<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ALM · Atribuir turmas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&family=Anton&display=swap" rel="stylesheet"/>
<style>
/* ══════════════════════════════════════════════════════════════════════
   WHY THE COLLOCATIONS MODAL LOOKS CRISP
   Read from skills/grammar-rules/collocations.html. The surprise is
   that it is not the blur — the blur is doing nothing. .modal is
   rgba(28,28,30,0.98), effectively opaque, so its 60px backdrop-filter
   has almost no surface to act on. Four other things are doing the work:

     1. THE SCRIM IS HEAVY. rgba(0,0,0,0.85). The page behind is gone,
        not softened. Our sheets sat on .30 — light enough that the
        grid behind stayed legible and competed with the card. That is
        what reads as haze, and it is the single biggest factor.
     2. THE CARD IS OPAQUE AND HAS AN EDGE. A 1px rule at 40% grey
        gives it a defined boundary instead of bleeding into the scrim.
     3. AIR. 2.5rem of padding, 2rem under the header. Ours was 24px.
     4. TIGHT TYPE. -0.02em on the title, -0.01em on the subtitle, at
        SF-Pro-ish sizes. Negative tracking at display size is most of
        what makes a card look engineered rather than typed.

   So: heavier scrim, opaque card, defined edge, more air, tighter
   tracking — and no blur at all, which we do not need and the flat
   rules forbid.
   ══════════════════════════════════════════════════════════════════════ */

/* ══════════════════════════════════════════════════════════════════════
   FLAT PASS
   Every box-shadow, every backdrop blur and every decorative gradient
   has been removed from this file — not softened, removed. Half-flat
   is worse than either: a page with three shadows on it reads as a
   page that forgot to finish.

   What replaced them:
   · DEPTH → NOTHING. The recessed wells came from one reference tile
     and quietly set the tone for the entire product. A timetable cell
     does not need to look pressed into anything; it needs an edge and
     a fill. It now has a flat fill one step off the page and no edge
     at all, which is how the INTUITY skills screen, the Apple grid
     and every reference in the brief handle a repeating cell.
   · ELEVATION → HAIRLINE. A card is white with a 1px rule at 7%
     black. Where something must sit above something else — the rail,
     the sheet — it gets one hairline on the meeting edge and nothing
     more.
   · SCRIM → FLAT INK. rgba(20,20,15,.30), no blur. Blur is expensive,
     it smears the type behind it, and it was the single biggest
     contributor to the screen looking soft.
   · BANNERS → GONE. The sand mastheads are white. The ONE survivor is
     the identity strip on a student or teacher card, which is not
     decoration: it is the only place a block of colour is carrying
     information (which department this person belongs to).
   ══════════════════════════════════════════════════════════════════════ */

/* ══════════════════════════════════════════════════════════════════════
   ALM · ATRIBUIR TURMAS
   Putting a teacher in front of a class.

   THE DEFECT THIS REWRITE EXISTS TO CLOSE
   ───────────────────────────────────────
   The previous page reported success on writes it had not verified.
   PostgREST answers a PATCH whose filter matches nothing with 200 and
   an empty array — a perfectly successful request that changed no row.
   Both write helpers checked `r.ok`, discarded the returned rows, and
   the caller printed "Guardado ✓". The screen updated optimistically,
   so an assignment that never reached the database looked identical to
   one that did, until a reload wiped it.

   Here every write asserts on the rows that came back. Zero rows is an
   error, the optimistic change is rolled back, and the message names
   the filter that matched nothing. A write either happened or it says
   it didn't.

   THE SURFACE
   Warm stone page, one cool stone instrument (the week grid), and two
   solid state colours: SAGE means a teacher is assigned and written,
   CLAY means the slot is still open. Nothing else carries hue, so the
   unassigned classes are the only thing on screen that stands out —
   which is the whole job of this page.

   THE LEFT RAIL IS A CATALOGUE, NOT A GROUP-BY
   ────────────────────────────────────────────
   It used to be built from Object.keys of a group-by over the loaded
   classes, which meant a level with no turma could not appear at all.
   With four turmas in Funchal, all Ano 4, the rail could only ever
   draw one row — and that read as a panel that had gone missing.
   It now walks LEVEL_ORDER, the fixed catalogue, and joins counts
   onto it. A level with nothing in it is drawn dim and inert. Zero is
   information: it is the work not yet started.
   ══════════════════════════════════════════════════════════════════════ */

*{box-sizing:border-box;margin:0;padding:0}
:root{
  --page:#F2F1EC; --card:#FBFAF7; --field:#DFE3E3;
  --shade:56,50,38; --grid-shade:40,50,54;
  --ink:#14140F; --ink-2:#3A3A36; --sub:#7A7A72; --faint:#A8A69C;
  --line:rgba(0,0,0,.07);
  --sage:#6F8F71; --sage-deep:#4E6B50; --sage-a:rgba(111,143,113,.12); --sage-b:rgba(111,143,113,.34);
  /* ── THE SAGE INSTRUMENT ─────────────────────────────────────────
     The grid was cool stone with sage marks on it. It is now a sage
     field, which is a better-looking object and a completely different
     colour problem: sage can no longer also mean "done", because a
     sage mark on a sage field is 1.6:1 against its own background and
     the clay mark is 1.05:1 — invisible.

     So the states were re-derived against the new ground:
       · PLUM  #2B2129 on sage = 4.17:1 — settled, marked, certified.
       · SAND  #E5D1B8 on sage = 2.51:1 — open, pending, unassigned.
     Warm sage and clay keep their meanings everywhere OFF the grid,
     on cards and chips, where they still have the contrast to work.

     The field and the cell fill are the same colour, as they always
     were — that is what makes the wells read as depth rather than as
     a vignette on a coloured box. The zebra is one step, not two:
     #7C9589 is a shade of the field, not a second colour.
     ──────────────────────────────────────────────────────────────── */
  /* ── SAGE IS A MARK, NOT A GROUND ────────────────────────────────
     The grid is light earthy stone again. Sage appears only on a slot
     that has something in it — assigned, marked, certified — and
     nowhere else. When the field itself went sage the tint stopped
     meaning anything: everything was sage, so nothing was.

     Two steps, chosen by whether small text sits on top:
       · #708A81 for marks that carry no text — seal discs, rings.
       · #5E776C for filled blocks that do. White at 9px measures
         3.72:1 on 708A81 and 4.85:1 on 5E776C; the smaller step is
         below AA and the turma code is 9px.
     Against the stone field they read 2.88:1 and 3.75:1 — a block,
     not body text, so that is the right range.
     ──────────────────────────────────────────────────────────────── */
  --sage-cool:#708A81;
  --sage-slot:#5E776C;
  --banner:#2B2129;
  --sand:#E5D1B8;
  --stone-warm:#D2CEC2;

  --clay:#9A7B62; --clay-a:rgba(154,123,98,.12); --clay-b:rgba(154,123,98,.32);
  --alert:#B8402A; --alert-a:rgba(184,64,42,.10);
  --d-kids:#6E8CA8; --d-juv:#6F8F71; --d-adults:#8C7F6A; --d-exam:#7E7391;

  /* Flat surfaces. Four steps, each one flat, no shadow between them.
     The separation is value alone, which is all a flat system has. */
  --page:#F2F1EC;      /* the page                        */
  --card:#FFFFFF;      /* anything raised, by hairline    */
  --well:#E7E8E4;      /* a repeating cell in a grid      */
  --rule:rgba(0,0,0,.07);
  --rule-2:rgba(0,0,0,.13);
  /* Handed to alm-grid.js. */
  --almg-paper:#FFFFFF; --almg-rule:#E4E2DB; --almg-rule-2:#CFCCC2;
  --almg-head:#F2F1EC; --almg-head-on:#DCE3DE;
  --almg-ink:#14140F; --almg-sub:#7A7A72; --almg-faint:#A8A69C;
  --almg-done:#5E776C; --almg-open:#9A7B62;
  --sans:'Geist',system-ui,-apple-system,sans-serif;
  --mono:'Geist Mono',ui-monospace,monospace;
  --display:'Anton',Impact,sans-serif;
  --row-h:46px;   /* rectangular. 46 tall against a ~78 minimum width
                     gives roughly 5:3 — the proportion an hour column
                     wants. The 64px square read as a button grid. */
}
html,body{height:100%;background:var(--page);color:var(--ink-2);
  font-family:var(--sans);font-size:13px;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;border:none;background:none;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
*{scrollbar-width:thin;scrollbar-color:rgba(var(--shade),.16) transparent}
@keyframes sheetIn{from{opacity:0;transform:scale(.95) translateY(20px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ══ TOPBAR ══ */
.topbar{flex-shrink:0;height:52px;display:flex;align-items:center;
  background:var(--card);border-bottom:1px solid var(--line);z-index:200}
.tb-brand{display:flex;align-items:center;gap:9px;padding:0 18px;height:100%;
  border-right:1px solid var(--line);flex-shrink:0}
.tb-alm{font-size:16px;font-weight:800;letter-spacing:7px;color:var(--ink)}
.tb-yr{font-family:var(--mono);font-size:9px;color:var(--faint);letter-spacing:.1em}
.tb-nav{display:flex;align-items:center;gap:3px;padding:0 14px;flex:1;overflow-x:auto;scrollbar-width:none}
.tb-nav::-webkit-scrollbar{display:none}
.nav-btn{font-size:12px;font-weight:600;padding:6px 15px;border-radius:999px;
  color:var(--sub);white-space:nowrap;transition:all .14s}
.nav-btn:hover{color:var(--ink);background:rgba(var(--shade),.05)}
.nav-btn.active{background:var(--ink);color:#fff}
.nav-btn .nb-n{font-family:var(--mono);font-size:9px;margin-left:6px;opacity:.55}
/* ── LEAVING THE PAGE vs SWITCHING A PANEL ────────────────────────
   Overview, Audit and Decision are panels inside alm-painel-central,
   not pages — they have no URL of their own until that file records
   one, so these point at its hash. They are set dimmer than the local
   pills because they are a different kind of action: one navigates
   away, the other repaints #main. Same shape would imply same cost.
   ──────────────────────────────────────────────────────────────── */
.nav-btn.xlink{text-decoration:none;display:inline-flex;align-items:center;
  color:var(--faint)}
.nav-btn.xlink:hover{color:var(--ink);background:rgba(var(--shade),.05)}
.nav-sep{width:1px;height:16px;background:var(--line);flex-shrink:0;margin:0 6px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px;padding:0 16px;
  height:100%;border-left:1px solid var(--line);flex-shrink:0}
.tb-dot{width:6px;height:6px;border-radius:50%;background:var(--sage);animation:pulse 2.4s infinite}
.tb-dot.warn{background:var(--clay)}.tb-dot.err{background:var(--alert);animation:none}
.tb-msg{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--faint)}
.tb-btn{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.08em;
  padding:5px 11px;border-radius:999px;background:rgba(var(--shade),.06);color:var(--sub);transition:all .13s}
.tb-btn:hover{background:rgba(var(--shade),.12);color:var(--ink)}
.tb-btn:disabled{opacity:.32;cursor:not-allowed}

/* ── THE LANGUAGE CHIPS ───────────────────────────────────────────
   The central panel counts students per language: EN 733, SP 188.
   These count something else and must not be mistaken for the same
   number — a chip here is SESSIONS STILL WITHOUT A TEACHER. That is
   the only quantity this page can act on, and it has the useful
   property of counting down to nothing. A language at 0 is finished
   work, not an absent language.
   ──────────────────────────────────────────────────────────────── */
.tb-langs{display:flex;align-items:center;gap:3px}
.lang-chip{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;
  padding:4px 10px;border-radius:999px;border:1px solid var(--line);
  color:var(--sub);background:var(--card);transition:all .13s;white-space:nowrap}
.lang-chip:hover{border-color:var(--sage-b);color:var(--ink)}
.lang-chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.lang-chip .lc-n{margin-left:6px;opacity:.55;font-weight:600}
.lang-chip.clear .lc-n{color:var(--sage-deep);opacity:.9}
.lang-chip.on .lc-n{opacity:.6;color:#fff}
@media(max-width:1180px){.tb-langs,.tb-langs-label{display:none}}

/* ══ HEADLINE BAR ══ */
/* No banner. A rule under the title and nothing else. */
.head{flex-shrink:0;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:14px 18px 12px;border-bottom:1px solid var(--rule)}
.head-n{font-family:var(--display);font-size:30px;letter-spacing:4px;
  text-transform:uppercase;color:var(--banner);line-height:1}
.head-sub{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.08em}
.kpis{margin-left:auto;display:flex}
/* When a filter is on, the page must say so somewhere the eye lands.
   The rail alone is not enough — it is 264px away from the grid. */
.filter-chip{display:inline-flex;align-items:center;gap:7px;margin-left:12px;
  font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.08em;
  padding:4px 10px;border-radius:999px;background:var(--ink);color:#fff;
  cursor:pointer;transition:opacity .13s;vertical-align:2px}
.filter-chip:hover{opacity:.72}
.filter-chip .fc-x{opacity:.6;font-size:11px;line-height:1}
.kpi{display:flex;flex-direction:column;align-items:center;padding:0 16px;
  border-left:1px solid var(--line);cursor:pointer;transition:opacity .13s}
.kpi:hover{opacity:.65}
.kpi-v{font-size:25px;font-weight:700;letter-spacing:-.02em;line-height:1;color:var(--ink)}
.kpi-l{font-family:var(--mono);font-size:8px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);margin-top:3px}

/* ══ LAYOUT ══ */
.body{flex:1;display:flex;min-height:0;overflow:hidden}
.side{width:264px;flex-shrink:0;border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;background:var(--page)}
.side-strip{display:flex;flex-wrap:wrap;gap:4px;padding:10px;border-bottom:1px solid var(--line)}
.side-list{flex:1;overflow-y:auto;padding:8px}
.main{flex:1;overflow-y:auto;padding:14px 16px 40px;min-width:0}
.pill{font-family:var(--mono);font-size:10px;font-weight:600;padding:5px 12px;
  border-radius:999px;border:1px solid var(--line);color:var(--sub);
  background:var(--card);transition:all .13s;white-space:nowrap}
.pill:hover{border-color:var(--sage-b);color:var(--ink)}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ══ SIDE ROWS ══ */
.srow{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:10px;
  margin-bottom:3px;cursor:pointer;transition:background .12s}
.srow:hover{background:rgba(var(--shade),.05)}
.srow.on{background:var(--card);}
.srow-av{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;font-weight:700}
.srow-n{font-size:13px;font-weight:500;color:var(--ink-2);flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow.on .srow-n{font-weight:600;color:var(--ink)}
.srow-m{font-family:var(--mono);font-size:10px;color:var(--faint);flex-shrink:0}
/* ── SELECTED, NOT MERELY POPULATED ───────────────────────────────
   The first cut gave a populated row a colour band, a load bar and a
   ✓, and gave the SELECTED row a white background. On a #F2F1EC page
   that is a two-percent difference, so the rail read as "Ano 4 is
   chosen" when nothing was chosen at all and the grid was showing the
   whole branch. Selection now takes the one thing nothing else uses:
   the band goes to solid ink and the row gets an edge. */
.srow.on{background:var(--card);outline:1px solid var(--rule-2);outline-offset:-1px}
.srow.on .srow-band{background:var(--ink)!important;opacity:1!important}
/* A level the branch does not run. Drawn so the catalogue stays
   whole, dimmed so it cannot be confused with work outstanding, and
   inert because there is nothing behind it to open. */
.srow.empty{cursor:default;opacity:.42}
.srow.empty:hover{background:none}
.srow-band{width:4px;height:22px;border-radius:6px;flex-shrink:0}
.load{width:40px;height:4px;border-radius:6px;background:rgba(var(--shade),.10);
  overflow:hidden;flex-shrink:0}
.load i{display:block;height:100%;border-radius:6px;background:var(--sage)}
.load.warn i{background:var(--clay)}.load.over i{background:var(--alert)}

/* ══ CARDS ══ */
.card{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:8px;}
.card-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card-code{font-family:var(--display);font-size:21px;letter-spacing:2px;line-height:1;color:var(--banner)}
.meta{font-family:var(--mono);font-size:10px;color:var(--faint)}
.sec{font-size:13px;font-weight:600;color:var(--ink);display:flex;
  align-items:center;gap:10px;margin:0 0 10px}
.sec::after{content:'';flex:1;height:1px;background:var(--line)}
.tag{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;padding:4px 10px;border-radius:6px;
  background:rgba(var(--shade),.06);color:var(--sub)}
.tag.on{background:var(--sage-a);color:var(--sage-deep)}
.tag.pend{background:var(--clay-a);color:var(--clay)}
.tag.bad{background:var(--alert-a);color:var(--alert)}

/* ══ SHEETS ══ */
/* THE PANEL DOES NOT COVER THE GRID.
   A centred modal put the assignment UI on top of the one thing the
   operator needs while assigning — the slot, its neighbours, and who
   is already in the surrounding hours. It is a right-hand rail now,
   and the scrim is gone entirely: there is nothing to dim, because
   the grid behind it is still the point. The roster keeps the
   centred treatment, since that one really is a detour. */
.sh-ov{position:fixed;top:0;right:0;bottom:0;z-index:1500;display:none;
  width:min(420px,92vw);background:transparent}
.sh-ov.on{display:block}
.sh-ov#sh-roster{inset:0;width:auto;display:none;align-items:center;
  justify-content:center;padding:26px;background:rgba(43,33,41,.42);}
.sh-ov#sh-roster.on{display:flex}
.sh-ov#sh-roster .sh{width:min(560px,92vw);max-height:88dvh;border-radius:6px;
  animation:sheetIn .26s cubic-bezier(.2,.9,.3,1)}
/* The rail's own card fills the rail. */
/* The rail meets the page on one hairline. That is the whole
   separation — no shadow falling across the grid. */
.sh-ov:not(#sh-roster) .sh{width:100%;height:100%;max-height:none;border-radius:0;
  border:none;border-left:1px solid var(--rule-2);
  animation:railIn .24s cubic-bezier(.4,0,.2,1)}
@keyframes railIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
/* The main column gets out of the way rather than being covered. */
body.rail-open .main{padding-right:min(436px,94vw)}
.sh{position:relative;width:min(620px,95vw);max-height:90dvh;display:flex;
  flex-direction:column;overflow:hidden;background:#FAF8F5;border-radius:6px;animation:sheetIn .26s cubic-bezier(.2,.9,.3,1)}

/* Masthead on sand, body on paper. */
/* No masthead. */
.sh-head{flex-shrink:0;padding:30px 32px 18px;border-bottom:1px solid var(--rule)}
.sh-strip{background:var(--sand);border-bottom:1px solid rgba(var(--shade),.12)}
.sh-eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sh-bar{width:22px;height:5px;border-radius:6px;background:var(--accent,var(--sage))}
.sh-kicker{font-family:var(--mono);font-size:9px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--faint)}
.sh-title{font-family:var(--display);font-size:clamp(24px,3.2vw,32px);line-height:.98;
  letter-spacing:2px;text-transform:uppercase;color:var(--banner)}

.sh-sub{font-size:15px;color:var(--sub);margin-top:14px;letter-spacing:-.01em}
.sh-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.sh-close{position:absolute;top:22px;right:24px;z-index:4;width:28px;height:28px;
  border-radius:50%;color:var(--faint);font-size:15px;transition:all .14s}
.sh-close:hover{background:rgba(var(--shade),.07);color:var(--ink)}
.sh-body{flex:1;overflow-y:auto;padding:14px 32px 26px;min-height:0}
.sh-sec{font-family:var(--mono);font-size:8px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--faint);display:flex;align-items:center;
  gap:10px;margin:18px 0 10px;scroll-margin-top:8px}
.sh-sec::after{content:'';flex:1;height:1px;background:var(--line);order:1}
.sh-foot{flex-shrink:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:18px 32px;border-top:1px solid var(--rule);background:#fff}
.sh-btn{font-size:12px;font-weight:600;padding:9px 17px;border-radius:10px;
  background:rgba(var(--shade),.07);color:var(--ink-2);transition:all .13s}
.sh-btn:hover{background:rgba(var(--shade),.12)}
.sh-btn.primary{background:var(--ink);color:#fff}
.sh-btn.primary:hover{background:#000}
.sh-btn.sage{background:var(--sage-a);color:var(--sage-deep)}
.sh-btn.bad{background:var(--alert-a);color:var(--alert)}
.sh-btn:disabled{opacity:.35;cursor:not-allowed}
.sh-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.sh-row:last-child{border-bottom:none}
.sh-av{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;font-weight:700}
.sh-name{font-size:14px;font-weight:500;letter-spacing:-.01em;color:var(--ink-2)}
.sh-meta{font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:2px}
.sh-empty{font-size:13px;color:var(--faint);padding:22px 0;text-align:center}
.sh-fld{background:rgba(var(--shade),.04);border-radius:6px;padding:10px 12px}

<script>
const SB  = 'https://oapygbeliocdvitbdjbq.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9hcHlnYmVsaW9jZHZpdGJkamJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NjQzNjAsImV4cCI6MjA5MjA0MDM2MH0.-9Uj9Bg3q8sIlqzfzw2Sc1JziaueeyYGNwep-qWhWWg';

   keys are hoisted to the front of a JS object's key order, so the
   catalogue would come back 1,2,3…,PI1,PI2 — Ano 1 above PI 1, which is
   backwards for a school that starts at four years old. */
const LEVEL_ORDER = ['PI1','PI2','PI3','PI4','PJ1','PJ2','PJ3',
  '1','2','3','4','5','Portugues','6','7','8'];
const BRANCH_LABEL = {FUNCHAL:'Funchal',CAMARA_LOBOS:'C. Lobos',SANTA_CRUZ:'S. Cruz',
  MACHICO:'Machico',RIBEIRA_BRAVA:'R. Brava',CALHETA:'Calheta'};
const LANG_NAME = {EN:'Inglês',PT:'Português',FR:'Francês',DE:'Alemão',ES:'Espanhol'};
/* The short forms match the central panel's chips so the two pages read
   as one product, even though they count different things. */
const LANG_ORDER = ['EN','ES','FR','DE','PT'];
const LANG_SHORT = {EN:'EN',ES:'SP',FR:'FR',DE:'GE',PT:'PT'};
const MAX_G = 17;

let AY = '2026/2027';
let CLASSES=[], TEACHERS=[], ENROL={};
let BRANCH='', LANG='', MODE='level', SEL_LEVEL=null, SEL_TEACHER=null, PANEL='grelha';
let UNDO=[];
let popState=null;

/* ══ REQUESTS ══════════════════════════════════════════════════════════ */
async function sbGet(table, qs=''){
  let all=[],page=0,PS=1000;
  while(true){
    const s=page*PS,e=s+PS-1;
    const r=await fetch(`${SB}/rest/v1/${table}?${qs}`,{headers:{...H,Range:`${s}-${e}`,Prefer:'count=none'}});
    if(!r.ok){const t=await r.text();throw new Error(`${table} ${r.status}: ${t.slice(0,140)}`);}
    const d=await r.json();all=all.concat(d);
    if(d.length<PS)break; if(++page>19)break;
  }
  return all;
}

/* ══════════════════════════════════════════════════════════════════════
   THE WRITE, VERIFIED
   ──────────────────────────────────────────────────────────────────────
   PostgREST answers a PATCH whose filter matches nothing with 200 and
   [] — a successful request that changed no row. The page this replaces
   checked only r.ok, so a filter that matched nothing (a null
   group_code, a mismatched academic_year, a turma_code with different
   whitespace) printed "Guardado ✓" and the optimistic UI made it look
   exactly like a real save. It only came apart on reload.

   patchClasses returns the rows it changed and throws when there are
   none, naming the filter, so the failure is visible at the moment it
   happens instead of the next time someone opens the page.
   ══════════════════════════════════════════════════════════════════════ */
async function patchClasses(filter, payload, expect){
  const r = await fetch(`${SB}/rest/v1/classes?${filter}`,
    {method:'PATCH', headers:H, body:JSON.stringify(payload)});
  const text = await r.text();
  if(!r.ok) throw new Error(`HTTP ${r.status} · ${text.slice(0,160)}`);
  let rows=[]; try{ rows = JSON.parse(text||'[]'); }catch{ rows=[]; }
  if(!Array.isArray(rows) || rows.length===0)
    throw new Error(`A base de dados não alterou nenhuma linha (filtro: ${decodeURIComponent(filter)})`);
  if(expect && rows.length !== expect)
    throw new Error(`Esperadas ${expect} sessões, alteradas ${rows.length}`);
  setConn(true,'Supabase');
  return rows;
}

/* ══ HELPERS ══ */
const AVP=[{bg:'#E4E6E2',t:'#4E6B50'},{bg:'#EAE4DC',t:'#8A6A4E'},{bg:'#E2E6EA',t:'#4A6478'},
           {bg:'#E9E4EA',t:'#6B5A76'},{bg:'#E6E9E2',t:'#5E7048'},{bg:'#EDE4E2',t:'#8A5548'}];
function avCol(n){let h=0;for(let i=0;i<(n||'?').length;i++)h=(h*31+(n||'?').charCodeAt(i))&0xffffffff;
  return AVP[Math.abs(h)%AVP.length];}
function avInit(n){return (n||'?').split(' ').filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase();}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normB(b){return (b||'').toUpperCase().replace(/[\s\-]+/g,'_').trim();}
function toMins(t){ if(!t) return null; const [h,m]=t.split(':').map(Number);
  return (isNaN(h)?0:h)*60+(isNaN(m)?0:m); }
function startOf(c){ return c.start_time?toMins(c.start_time):(c.hour||0)*60; }
function endOf(c){ return c.end_time?toMins(c.end_time):startOf(c)+(c.duration_min||90); }
function overlaps(a,b){ return startOf(a)<endOf(b) && startOf(b)<endOf(a); }
function deptOf(c){ return DEPT[c.department] ? c.department : (LEVEL_DEPT[(c.level_code||'').trim()]||'adults'); }
function levelOf(c){ return c.level_display || LEVEL_DISP[(c.level_code||'').trim()] || c.level_code || '—'; }
function langOf(c){ return (c.lang||'').toUpperCase().slice(0,2); }
function setConn(ok,msg){ const d=document.getElementById('conn');
  d.className='tb-dot'+(ok===true?'':ok==='warn'?' warn':' err');
  document.getElementById('conn-msg').textContent=msg||(ok===true?'ligado':'sem ligação'); }
let _tT; function toast(m,t=''){ const el=document.getElementById('toast');
  el.textContent=m; el.className='toast '+t+' show';
  clearTimeout(_tT); _tT=setTimeout(()=>el.classList.remove('show'), t==='err'?6000:3000); }

/* ══ SCOPE ══════════════════════════════════════════════════════════════
   branchScope is the branch and nothing else — it is what the language
   chips count against, so selecting EN does not zero every other chip.
   scoped() is branch AND language, and is what everything downstream
   sees.

   The old scoped() ended `return f.length ? f : CLASSES` — an empty
   branch silently showed every branch's classes under that branch's
   name. Empty now means empty, and the screens below say so.
   ══════════════════════════════════════════════════════════════════════ */
function branchScope(){ return CLASSES.filter(c=>c.branch===BRANCH); }
function scoped(){
  const l = branchScope();
  return LANG ? l.filter(c=>langOf(c)===LANG) : l;
}
function visible(){
  let l=scoped();
  if(MODE==='level' && SEL_LEVEL) l=l.filter(c=>(c.level_code||'').trim()===SEL_LEVEL);
  return l;
}
/* Contracted load is measured in real minutes, not in class counts —
   two 90-minute sessions are not "two hours". */
function loadOf(tid){
  const mins = CLASSES.filter(c=>c.teacher_id===tid)
    .reduce((s,c)=>s+Math.max(0,endOf(c)-startOf(c)),0);
  return mins/60;
}
function conflictsFor(tid, cls){
  return CLASSES.filter(x => x.teacher_id===tid && x.turma_code!==cls.turma_code
    && x.day_of_week===cls.day_of_week && overlaps(x,cls));
}
/* Every double-booking currently in the data, whatever caused it. */
function allConflicts(){
  const out=[], seen=new Set();
  CLASSES.forEach(a=>{ if(!a.teacher_id) return;
    CLASSES.forEach(b=>{
      if(b===a || !b.teacher_id || b.teacher_id!==a.teacher_id) return;
      if(b.day_of_week!==a.day_of_week || !overlaps(a,b)) return;
      const k=[a.turma_code,b.turma_code].sort().join('|');
      if(seen.has(k)) return; seen.add(k);
      out.push({a,b,teacher:TEACHERS.find(t=>t.id===a.teacher_id)});
    });
  });
  return out;
}
function siblingsOf(c){ return CLASSES.filter(x=>x.group_code===c.group_code); }

/* ══ BOOT ══ */
async function boot(){
  setConn('warn','a carregar');
  try{
    const cfg = await sbGet('school_config','select=key,value&limit=40');
    const row = cfg.find(r=>r.key==='academic_year');
    /* Read the year rather than hard-coding it. Every page that hard-codes
       it is one schema edit away from querying a year that no longer has
       any rows, and the symptom of that is a blank screen with no error. */
    if(row && row.value) AY = row.value;
  }catch(e){ console.warn('school_config', e.message); }
  document.getElementById('tb-yr').textContent = AY;

  try{
    const [cls, tea] = await Promise.all([
      sbGet('classes',`select=turma_code,group_code,teacher_id,teacher_code,teacher_name,lang,level_code,level_display,department,branch,day_of_week,hour,start_time,end_time,duration_min,student_refs&academic_year=eq.${encodeURIComponent(AY)}&order=day_of_week,hour`),
      sbGet('teachers','select=id,code,name,lang,native,branch_primary,branches,contract_hours_week'),
    ]);
    TEACHERS = (tea||[]).map(r=>({id:r.id, code:r.code||'??', name:r.name||'—',
      lang:(r.lang||'EN').toUpperCase().slice(0,2), native:!!r.native,
      contractH:r.contract_hours_week||22, branch:normB(r.branch_primary||''),
      branches:Array.isArray(r.branches)&&r.branches.length?r.branches.map(normB):[normB(r.branch_primary||'')]}));

    CLASSES = (cls||[]).map(c=>{
      let refs=[];
      if(Array.isArray(c.student_refs)) refs=c.student_refs;
      else if(typeof c.student_refs==='string'&&c.student_refs){ try{refs=JSON.parse(c.student_refs);}catch{} }
      return {...c,
        /* dbGroupCode is what the DATABASE holds; group_code is what this
           page reasons with. They are kept apart on purpose — see the
           note in openAssign(). Writing by a group code the database
           does not have is the silent-failure case. */
        dbGroupCode: c.group_code || null,
        group_code: c.group_code || (c.turma_code||'').replace(/[A-D]$/,''),
        hour: typeof c.hour==='number'?c.hour:(parseInt(c.hour,10)||9),
        day_of_week:(c.day_of_week||'').toUpperCase().replace('SAB','SÁB'),
        branch: normB(c.branch||''), student_refs:refs};
    }).filter(c=>DAYS.includes(c.day_of_week));

    const refs=[...new Set(CLASSES.flatMap(c=>c.student_refs))].filter(Boolean);
    for(let i=0;i<refs.length;i+=200){
      try{ (await sbGet('enrolments',
        `ref=in.(${refs.slice(i,i+200).join(',')})&select=ref,name,branch,lang,level_code`))
        .forEach(e=>{ENROL[e.ref]=e;}); }catch(e){}
    }
    setConn(true,'Supabase');
    /* turma_code is the key every write filters on, and commitAssign
       asserts exactly one row changed. Two sessions sharing a code
       would make that assertion throw and roll the pair back, so the
       collision is reported at load rather than at save. */
    const seen={}, dupes=[];
    CLASSES.forEach(c=>{ const k=c.turma_code;
      if(seen[k]) { if(seen[k]===1) dupes.push(k); seen[k]++; } else seen[k]=1; });
    if(dupes.length){
      console.warn('turma_code duplicado:', dupes,
        CLASSES.filter(c=>dupes.includes(c.turma_code)));
      toast(`Código repetido: ${dupes.join(', ')} — cada sessão precisa do seu próprio código`,'warn');
    }
  }catch(e){ setConn(false,'erro'); toast('Erro: '+e.message,'err'); return; }

  const present = new Set(CLASSES.map(c=>c.branch).filter(Boolean));
  const order = Object.keys(BRANCH_LABEL).filter(b=>present.has(b));
  BRANCH = order[0] || 'FUNCHAL';
  document.getElementById('branches').innerHTML = order.map(b=>
    `<button class="pill ${b===BRANCH?'on':''}" data-branch="${b}">${BRANCH_LABEL[b]||b}</button>`).join('')
    || '<span class="meta">sem filiais</span>';
  renderAll();
}

/* ══ RENDER ══ */
function renderAll(){ renderLangs(); renderSide(); renderHead(); renderMain(); }

/* ── DECISIONS OUTSTANDING, BY LANGUAGE ───────────────────────────
   Counted off branchScope so the chips stay comparable to each other
   while one of them is selected. The number is sessions without a
   teacher: it counts down, and a language that reaches zero is
   finished rather than missing.
   ──────────────────────────────────────────────────────────────── */
function renderLangs(){
  const s = branchScope();
  const langs = LANG_ORDER.filter(L=>s.some(c=>langOf(c)===L));

/* ── THE GRID ────────────────────────────────────────────────────
   Was gridHTML() + bandPos() + drawBands(), ~90 lines, and carrying a
   real bug: bandPos measured x from the first .gcell but drawBands
   appended the band to .grow, whose box starts at the frozen day
   column. Every band was therefore 58px too far left — 53 minutes —
   which is why a 14:00 lesson drew at 11:36.

   The module positions an item INSIDE its first cell, so the offset
   cannot exist. */
function gridHTML(){
  const items = visible();
  const label = `Grelha semanal${SEL_LEVEL?' · '+esc(LEVEL_DISP[SEL_LEVEL]||SEL_LEVEL):''}${LANG?' · '+esc(LANG_NAME[LANG]||LANG):''}`;
  /* Now that an empty branch is honestly empty, this path can run with
     nothing in it. Say which filter emptied it rather than drawing a
     blank week. */
  if(!items.length){
    return `<div class="sec">${label}</div>
      <div class="sh-empty">Sem sessões ${LANG?`de ${esc(LANG_NAME[LANG]||LANG)} `:''}${
        SEL_LEVEL?`em ${esc(LEVEL_DISP[SEL_LEVEL]||SEL_LEVEL)} `:''}nesta filial.</div>`;
  }
  requestAnimationFrame(drawGrid);
  return `<div class="sec">${label}</div><div id="agrid"></div>`;
}

function drawGrid(){
  const host = document.getElementById('agrid'); if(!host) return;
  const focus = MODE==='teacher' ? SEL_TEACHER : null;
  const open  = popState ? popState.code : null;
  const sibs  = popState ? popState.sibs.map(s=>s.turma_code) : [];
  ALMGrid.render(host, {
    items: visible().map(c=>{
      const t = c.teacher_id ? TEACHERS.find(x=>x.id===c.teacher_id) : null;
      return {
        day:c.day_of_week, start:(c.start_time||'').slice(0,5), end:(c.end_time||'').slice(0,5),
        title:c.turma_code,
        sub:`${t?t.name:'sem professor'} · ${c.student_refs.length}/${MAX_G}`,
        badge: t ? avInit(t.name) : '',
        state: t ? 'done' : 'open',
        tone: c.group_code,
        dim: focus && c.teacher_id!==focus,
        hot: c.turma_code===open,
        sib: open && c.turma_code!==open && sibs.includes(c.turma_code),
        code:c.turma_code,
      };
    }),
    onItem: it => openAssign(it.code),
    legend: [['#4A6A56','contorno liso = com professor'],
             ['dash','tracejado = por atribuir']],
    hint: 'clique numa sessão para atribuir',
  });
}

/* ══════════════════════════════════════════════════════════════════════
   THE ASSIGN SHEET
   ══════════════════════════════════════════════════════════════════════ */
function closeSheet(id){
  const el=document.getElementById(id); el.classList.remove('on'); el.innerHTML='';
  if(id==='sh-assign'){ popState=null; document.body.classList.remove('rail-open');
    if(PANEL==='grelha') drawGrid(); }
}
function hostFor(id){const el=document.getElementById(id);
  el.onclick=e=>{if(e.target===el)closeSheet(id);};return el;}

/* Candidates for ONE session. Every judgement is made against that
   session's own day and hour — which is the bug that made the old
   "partilhado" list wrong: it ranked the Wednesday teacher against
   Monday's timetable, so anyone free on Monday looked free on
   Wednesday. A session ranks against itself or not at all. */
function candidatesFor(cls){
  return TEACHERS.map(t=>{
    const clash = conflictsFor(t.id, cls);
    const h = loadOf(t.id);
    const langOK = !cls.lang || t.lang === (cls.lang||'').toUpperCase().slice(0,2);
    const branchOK = !cls.branch || t.branches.includes(cls.branch) || t.branch===cls.branch;
    let block = null;
    if(clash.length) block = `Já tem ${clash[0].turma_code} às ${(clash[0].start_time||'').slice(0,5)}`;
    else if(h + (endOf(cls)-startOf(cls))/60 > t.contractH) block = null; /* over-contract warns, never blocks */
    return {t, clash, h, langOK, branchOK, block,
      over: h + (endOf(cls)-startOf(cls))/60 > t.contractH};
  }).sort((a,b)=>
    (a.block?1:0)-(b.block?1:0) ||
    (b.langOK?1:0)-(a.langOK?1:0) ||
    (b.branchOK?1:0)-(a.branchOK?1:0) ||
    (b.t.native?1:0)-(a.t.native?1:0) ||
    a.h-b.h);
}

function candRow(c, cls, sel, slot){
  const av=avCol(c.t.name);
  const cls2 = c.block ? 'cand blocked' : (sel===c.t.id ? 'cand on' : 'cand');
  return `<div class="${cls2}" ${c.block?'':`data-pick="${slot}:${c.t.id}"`}>
    <span class="sh-av" style="background:${av.bg};color:${av.t}">${avInit(c.t.name)}</span>
    <div class="cand-n">
      <div class="sh-name">${esc(c.t.name)}</div>
      <div class="sh-meta">${esc(c.t.code)} · ${LANG_NAME[c.t.lang]||c.t.lang}</div>
      ${c.block?`<div class="cand-why">${esc(c.block)}</div>`:''}
    </div>
    ${c.langOK?'<span class="mini lang">língua</span>':''}
    ${c.t.native?'<span class="mini nat">nativo</span>':''}
    ${!c.branchOK?'<span class="mini free">outra filial</span>':''}
    <span class="cand-h" style="color:${c.over?'var(--alert)':c.h>=c.t.contractH*.8?'var(--clay)':'var(--sage-deep)'}">${c.h.toFixed(1)}/${c.t.contractH}h</span>
  </div>`;
}

function openAssign(turmaCode){
  const c = CLASSES.find(x=>x.turma_code===turmaCode); if(!c) return;
  const sibs = siblingsOf(c).sort((a,b)=>DAYS.indexOf(a.day_of_week)-DAYS.indexOf(b.day_of_week));
  const paired = sibs.length>1;
  popState = {code:turmaCode, mode: paired?'mesmo':'single', pick:{}, sibs};
  sibs.forEach(s=>{ popState.pick[s.turma_code] = s.teacher_id || null; });
  paintAssign();
}

function paintAssign(){
  const {code, mode, pick, sibs} = popState;
  const c = CLASSES.find(x=>x.turma_code===code);
  const d = DEPT[deptOf(c)];
  const anyAssigned = sibs.some(s=>s.teacher_id);

  /* WHY THIS WARNING EXISTS.
     A pair write filters on group_code. If the database column is null
     for these rows — perfectly possible for classes created before
     group_code was introduced — the filter matches nothing and the old
     page called that a success. Now it is checked before the write is
     offered, and the pair option is withdrawn rather than failing. */
  const canPairWrite = sibs.every(s=>s.dbGroupCode) &&
    new Set(sibs.map(s=>s.dbGroupCode)).size===1;

  /* WHY THE BUTTON WAS DEAD AND SAID NOTHING.
     In "um por sessão" every session needs its own choice, but only
     the first list fits the rail — the second is below the fold. Pick
     a teacher for Terça, look at a full-looking panel, press Atribuir,
     nothing happens. The choice for Quinta was never made and the
     disabled button gave no reason.

     Three changes, all about telling the truth: a checklist pinned
     above the lists showing each session and who is on it, a button
     that names what is missing instead of going grey, and a jump to
     the next unanswered session the moment one is answered. */
  const missing = mode==='mesmo'
    ? (pick[sibs[0].turma_code] ? [] : sibs.slice(0,1))
    : sibs.filter(s=>!pick[s.turma_code]);
  const ready = missing.length===0;

  const checklist = sibs.length>1 ? `<div class="checklist">
    ${sibs.map(s=>{
      const tid = mode==='mesmo' ? pick[sibs[0].turma_code] : pick[s.turma_code];
      const t = tid ? TEACHERS.find(x=>x.id===tid) : null;
      return `<div class="chk ${t?'done':''}" data-jump="${esc(s.turma_code)}">
        <span class="chk-mark">${t?'&#10003;':'&#183;'}</span>
        <span class="chk-day">${DAY_FULL[s.day_of_week]}</span>
        <span class="chk-who">${t?esc(t.name):'por escolher'}</span>
      </div>`;}).join('')}
  </div>` : '';

  const body = mode==='mesmo'
    ? `<div class="sh-sec">Um professor para as ${sibs.length} sessões</div>
       ${candidatesFor(c).map(x=>candRow(x,c,pick[sibs[0].turma_code],'ALL')).join('')}`
    : sibs.map(s=>{
        const tid = pick[s.turma_code];
        const t = tid ? TEACHERS.find(x=>x.id===tid) : null;
        return `<div class="sh-sec" id="sec-${esc(s.turma_code)}">
         ${DAY_FULL[s.day_of_week]} · ${(s.start_time||'').slice(0,5)}–${(s.end_time||'').slice(0,5)} · ${esc(s.turma_code)}
         <span class="sec-state ${t?'done':''}">${t?esc(t.code):'por escolher'}</span></div>
       ${candidatesFor(s).map(x=>candRow(x,s,pick[s.turma_code],s.turma_code)).join('')}`;}).join('');

  const host = hostFor('sh-assign');
  host.innerHTML = `<div class="sh" style="--accent:${anyAssigned?'var(--sage-deep)':'var(--clay)'}">
    <button class="sh-close" onclick="closeSheet('sh-assign')">✕</button>
    <div class="sh-head">
      <div class="sh-eyebrow"><span class="sh-bar"></span>
        <span class="sh-kicker">${d.label} · ${esc(levelOf(c))} · ${esc(BRANCH_LABEL[c.branch]||c.branch||'')}</span></div>
      <div class="sh-title">${esc(c.group_code)}</div>
      <div class="sh-sub">${sibs.map(s=>`${DAY_FULL[s.day_of_week]} ${(s.start_time||'').slice(0,5)}–${(s.end_time||'').slice(0,5)}`).join(' · ')}</div>
      <div class="sh-tags">
        <span class="sh-tag tag">${esc(c.lang||'')}</span>
        <span class="tag" style="cursor:pointer" data-roster="${esc(c.turma_code)}">${c.student_refs.length}/${MAX_G} alunos</span>
        ${sibs.map(s=>s.teacher_id
          ? `<span class="tag on">${esc(s.turma_code)} · ${esc(TEACHERS.find(t=>t.id===s.teacher_id)?.code||'—')}</span>`
          : `<span class="tag pend">${esc(s.turma_code)} · por atribuir</span>`).join('')}
      </div>
    </div>
    <div class="sh-body">
      ${!canPairWrite && sibs.length>1 ? `<div class="notice">
        <b>Sem código de grupo na base de dados.</b> Estas sessões não partilham um
        <code>group_code</code> gravado, por isso só podem ser atribuídas uma a uma —
        uma escrita em par não encontraria nenhuma linha.</div>`:''}
      ${sibs.length>1 && canPairWrite ? `<div class="seg">
        <button data-mode="mesmo" class="${mode==='mesmo'?'on':''}">Mesmo professor</button>
        <button data-mode="partilhado" class="${mode!=='mesmo'?'on':''}">Um por sessão</button>
      </div>`:''}
      ${checklist}
      ${body}
    </div>
    <div class="sh-foot">
      ${anyAssigned?`<button class="sh-btn bad" id="btn-clear">Remover professor</button>`:''}
      <button class="sh-btn" onclick="closeSheet('sh-assign')">Cancelar</button>
      <button class="sh-btn primary" id="btn-save" style="margin-left:auto" ${ready?'':'disabled'}>
        ${ready
          ? (mode==='mesmo' ? `Atribuir às ${sibs.length} sessões` : 'Atribuir')
          : `Falta ${missing.map(s=>DAY_FULL[s.day_of_week]).join(' e ')}`}</button>
    </div>
  </div>`;
  host.classList.add('on');
  document.body.classList.add('rail-open');
  /* Re-lay the grid under the narrowed column, then ring the session
     under assignment and its pair partner. */
  if(PANEL==='grelha') requestAnimationFrame(drawGrid);

  host.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{
    popState.mode=b.dataset.mode; popState.pick={};
    sibs.forEach(s=>{popState.pick[s.turma_code]=s.teacher_id||null;});
    paintAssign();
  });
  host.querySelectorAll('[data-pick]').forEach(el=>el.onclick=()=>{
    const i=el.dataset.pick.indexOf(':');
    const slot=el.dataset.pick.slice(0,i), tid=el.dataset.pick.slice(i+1);
    if(slot==='ALL') sibs.forEach(s=>{popState.pick[s.turma_code]=tid;});
    else popState.pick[slot]=tid;
    paintAssign();
    /* Answering one session moves you to the next unanswered one, so
       the second list is never something you have to discover. */
    const next = popState.sibs.find(s=>!popState.pick[s.turma_code]);
    if(next){
      const sec=document.getElementById('sec-'+next.turma_code);
      if(sec) sec.scrollIntoView({behavior:'smooth', block:'start'});
    }
  });
  host.querySelectorAll('[data-jump]').forEach(el=>el.onclick=()=>{
    const sec=document.getElementById('sec-'+el.dataset.jump);
    if(sec) sec.scrollIntoView({behavior:'smooth', block:'start'});
  });
  const clr=host.querySelector('#btn-clear'); if(clr) clr.onclick=()=>commitAssign(true);
  host.querySelector('#btn-save').onclick=()=>commitAssign(false);
}

/* ══════════════════════════════════════════════════════════════════════
   THE COMMIT
   Writes first, then updates the screen — the reverse of what the old
   page did. An optimistic update that precedes an unverified write is
   how an assignment came to look saved when it wasn't.
   ══════════════════════════════════════════════════════════════════════ */
async function commitAssign(clear){
  const {code, mode, pick, sibs} = popState;
  const btn=document.getElementById('btn-save');
  const prev = sibs.map(s=>({tc:s.turma_code, id:s.teacher_id, code:s.teacher_code, name:s.teacher_name}));
  btn.disabled=true; btn.textContent='A guardar…';

  const target = {};
  sibs.forEach(s=>{ target[s.turma_code] = clear ? null : (mode==='mesmo' ? pick[sibs[0].turma_code] : pick[s.turma_code]); });

  /* Never write a double booking. Checked against everything currently
     in CLASSES, plus the other sessions in this very commit. */
  for(const s of sibs){
    const tid = target[s.turma_code]; if(!tid) continue;
    const clash = conflictsFor(tid, s).filter(x=>!sibs.some(y=>y.turma_code===x.turma_code));
    const inBatch = sibs.filter(o=>o.turma_code!==s.turma_code
      && target[o.turma_code]===tid && o.day_of_week===s.day_of_week && overlaps(o,s));
    if(clash.length || inBatch.length){
      const t=TEACHERS.find(x=>x.id===tid);
      toast(`${t?t.code:'—'} já tem aula nesse horário (${(clash[0]||inBatch[0]).turma_code})`,'err');
      btn.disabled=false; btn.textContent='Atribuir'; return;
    }
  }

  try{
    const written=[];
    for(const s of sibs){
      const tid=target[s.turma_code];
      const t = tid ? TEACHERS.find(x=>x.id===tid) : null;
      const rows = await patchClasses(
        `turma_code=eq.${encodeURIComponent(s.turma_code)}&academic_year=eq.${encodeURIComponent(AY)}`,
        {teacher_id:tid||null, teacher_name:t?t.name:null, teacher_code:t?t.code:null}, 1);
      written.push({tc:s.turma_code, rows:rows.length});
      /* Only now, and only per row that actually changed. */
      s.teacher_id = tid||null; s.teacher_name = t?t.name:null; s.teacher_code = t?t.code:null;
    }
    UNDO.push(prev);
    document.getElementById('btn-undo').disabled=false;
    toast(clear ? `Professor removido · ${written.length} sessões`
                : `${written.map(w=>w.tc).join(' · ')} guardado`);
    closeSheet('sh-assign'); renderAll();
  }catch(e){
    /* Nothing was applied locally before the write, so there is nothing
       to roll back — but any session already written in this loop must
       be undone, or the pair ends up half-assigned. */
    setConn(false,'erro');
    toast('Não guardado: '+e.message,'err');
    try{ await revertTo(prev); }catch(_){}
    renderAll();
    const b=document.getElementById('btn-save'); if(b){b.disabled=false;b.textContent='Atribuir';}
  }
}

async function revertTo(snapshot){
  for(const p of snapshot){
    const s=CLASSES.find(x=>x.turma_code===p.tc); if(!s) continue;
    if(s.teacher_id===p.id) continue;
    await patchClasses(`turma_code=eq.${encodeURIComponent(p.tc)}&academic_year=eq.${encodeURIComponent(AY)}`,
      {teacher_id:p.id||null, teacher_name:p.name||null, teacher_code:p.code||null}, 1);
    s.teacher_id=p.id||null; s.teacher_name=p.name||null; s.teacher_code=p.code||null;
  }
}

/* Undo restores EVERY session in the pair. The old stack recorded only
   session A, so undoing a split assignment left B on the new teacher. */
async function undo(){
  const snap=UNDO.pop(); if(!snap) return;
  try{ await revertTo(snap); toast('Anulado'); }
  catch(e){ toast('Não foi possível anular: '+e.message,'err'); }
  document.getElementById('btn-undo').disabled = UNDO.length===0;
  renderAll();
}

/* ══ ROSTER ══ */
function openRoster(turmaCode){
  const c=CLASSES.find(x=>x.turma_code===turmaCode); if(!c) return;
  const list=c.student_refs.map(r=>({ref:r,name:ENROL[r]?.name||r}))
    .sort((a,b)=>a.name.localeCompare(b.name));
  const host=hostFor('sh-roster');
  host.innerHTML=`<div class="sh">
    <button class="sh-close" onclick="closeSheet('sh-roster')">✕</button>
    <div class="sh-head">
      <div class="sh-eyebrow"><span class="sh-bar"></span>
        <span class="sh-kicker">${esc(levelOf(c))} · ${DAY_FULL[c.day_of_week]} ${(c.start_time||'').slice(0,5)}</span></div>
      <div class="sh-title">${esc(c.turma_code)}</div>
      <div class="sh-sub">${list.length} de ${MAX_G} lugares</div>
    </div>
    <div class="sh-body">${list.length?list.map(s=>{const av=avCol(s.name);
      return `<div class="sh-row">
        <span class="sh-av" style="background:${av.bg};color:${av.t}">${avInit(s.name)}</span>
        <div style="flex:1;min-width:0"><div class="sh-name">${esc(s.name)}</div>
          <div class="sh-meta">${esc(s.ref)}</div></div></div>`;}).join('')
      :'<div class="sh-empty">Sem alunos nesta sessão.</div>'}</div>
    <div class="sh-foot"><button class="sh-btn" style="margin-left:auto"
      onclick="closeSheet('sh-roster')">Fechar</button></div></div>`;
  host.classList.add('on');
}

function exportCSV(){
  const rows=['ALM,Atribuição de turmas,'+AY,'',
    'Turma,Grupo,Nível,Dia,Início,Fim,Filial,Professor,Código,Alunos'];
  scoped().forEach(c=>{
    rows.push([c.turma_code,c.group_code,levelOf(c),c.day_of_week,
      (c.start_time||'').slice(0,5),(c.end_time||'').slice(0,5),
      BRANCH_LABEL[c.branch]||c.branch,`"${c.teacher_name||''}"`,c.teacher_code||'',
      c.student_refs.length].join(','));
  });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv;charset=utf-8'}));
  a.download=`ALM-atribuicao-${BRANCH}${LANG?'-'+LANG:''}.csv`; a.click();
  toast('CSV exportado');
}

/* ══ WIRING ══ */
document.getElementById('nav').addEventListener('click',e=>{
  /* The anchors share .nav-btn for styling, so they reach this handler
     too. Letting them through would set PANEL to undefined and repaint
     an empty #main a moment before the browser left the page. */
  const b=e.target.closest('.nav-btn'); if(!b || b.tagName==='A') return;
  PANEL=b.dataset.p;
  document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x===b));
  renderMain();
});
document.getElementById('branches').addEventListener('click',e=>{
  const b=e.target.closest('[data-branch]'); if(!b) return;
  BRANCH=b.dataset.branch; SEL_LEVEL=null; SEL_TEACHER=null;
  /* Language does not survive a branch change: a branch that runs no
     German would show an empty screen with a chip still lit. */
  LANG='';
  document.querySelectorAll('#branches .pill').forEach(x=>x.classList.toggle('on',x===b));
  renderAll();
});
document.getElementById('langs').addEventListener('click',e=>{
  const b=e.target.closest('[data-lang]'); if(!b) return;
  LANG = (LANG===b.dataset.lang) ? '' : b.dataset.lang;
  /* This used to clear SEL_LEVEL unconditionally, which meant picking
     a language silently threw away the level you had chosen and the
     grid quietly widened to the whole branch. The level is only
     dropped when the new language genuinely has nothing at it. */
  if(SEL_LEVEL && !scoped().some(c=>(c.level_code||'').trim()===SEL_LEVEL)) SEL_LEVEL=null;
  renderAll();
});
document.getElementById('h-filters').addEventListener('click',e=>{
  const b=e.target.closest('[data-clear]'); if(!b) return;
  const w=b.dataset.clear;
  if(w==='level') SEL_LEVEL=null;
  if(w==='lang') LANG='';
  if(w==='teacher') SEL_TEACHER=null;
  renderAll();
});
document.getElementById('m-level').onclick=()=>{MODE='level';SEL_TEACHER=null;renderAll();};
document.getElementById('m-teacher').onclick=()=>{MODE='teacher';SEL_LEVEL=null;renderAll();};
document.getElementById('side-list').addEventListener('click',e=>{
  const l=e.target.closest('[data-level]'), t=e.target.closest('[data-teacher]');
  if(l){ SEL_LEVEL = SEL_LEVEL===l.dataset.level ? null : l.dataset.level; }
  if(t){ SEL_TEACHER = SEL_TEACHER===t.dataset.teacher ? null : t.dataset.teacher; }
  renderAll();
});
document.body.addEventListener('click',e=>{
  const o=e.target.closest('[data-open]'); if(o){ openAssign(o.dataset.open); return; }
  const r=e.target.closest('[data-roster]'); if(r){ e.stopPropagation(); openRoster(r.dataset.roster); }
});
document.getElementById('btn-undo').onclick=undo;
document.getElementById('btn-csv').onclick=exportCSV;
document.getElementById('btn-reload').onclick=boot;
document.getElementById('k-sem').onclick=()=>{PANEL='porAtribuir';
  document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x.dataset.p==='porAtribuir'));renderMain();};
document.getElementById('k-com').onclick=()=>{PANEL='profs';
  document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x.dataset.p==='profs'));renderMain();};
document.getElementById('k-turmas').onclick=()=>{PANEL='grelha';
  document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x.dataset.p==='grelha'));renderMain();};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ ['sh-roster','sh-assign'].some(id=>{
    const el=document.getElementById(id);
    if(el.classList.contains('on')){closeSheet(id);return true;} }); }
});

boot();
</script>
</body>
</html>
