<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ALM · Calendário</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9A84C;--gold2:#E8C97A;--gold3:rgba(201,168,76,.18);--gold4:rgba(201,168,76,.08);
  --green:#1DB87A;--green-a:rgba(29,184,122,.16);--green-b:rgba(29,184,122,.38);--green-c:rgba(29,184,122,.07);
  --red:#E8455A;--red-a:rgba(232,69,90,.13);--red-b:rgba(232,69,90,.32);
  --amber:#E8A020;--amber-a:rgba(232,160,32,.14);--amber-b:rgba(232,160,32,.32);
  --teal:#28C8B0;--blue:#4A8FF5;--purple:#9B5ECA;
  --bg:#07060E;--bg2:#0E0C1A;--bg3:#161325;--bg4:#1C1930;
  --b:rgba(201,168,76,.09);--b2:rgba(201,168,76,.18);--b3:rgba(201,168,76,.32);
  --t:rgba(240,222,175,.94);--t2:rgba(215,193,145,.65);--t3:rgba(215,193,145,.38);--t4:rgba(215,193,145,.14);
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',system-ui,sans-serif;--display:'Bebas Neue',sans-serif;
}
html,body{min-height:100%;background:var(--bg);color:var(--t);font-family:var(--mono);font-size:12px;-webkit-font-smoothing:antialiased}
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.06) transparent}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes modal-in{from{opacity:0;transform:scale(.96) translateY(-8px)}to{opacity:1;transform:none}}
@keyframes slide-up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

/* ── TOPBAR ── */
.topbar{position:sticky;top:0;z-index:200;height:50px;display:flex;align-items:center;background:rgba(7,6,14,.99);border-bottom:1px solid var(--b2)}
.nav-duo{display:flex;flex-direction:column;height:100%;border-right:1px solid var(--b2);flex-shrink:0;min-width:54px}
.nav-home{display:flex;align-items:center;justify-content:center;flex:1;padding:0 14px;text-decoration:none;transition:background .14s;border-bottom:.5px solid var(--b)}
.nav-home:hover{background:var(--gold4)}
.nav-home-icon{font-size:15px;color:var(--t2)}
.nav-back{display:flex;align-items:center;justify-content:center;gap:4px;flex:1;padding:0 10px;text-decoration:none;transition:background .14s}
.nav-back:hover{background:var(--gold4)}
.nav-back-arrow{font-size:9px;color:var(--t3)}
.nav-back-label{font-size:7px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}
.brand{display:flex;align-items:center;padding:0 18px;height:100%;border-right:1px solid var(--b);flex-shrink:0}
.brand-alm{font-size:18px;font-weight:700;letter-spacing:8px;color:var(--gold2);font-family:var(--display)}
.brand-yr{font-size:8px;color:var(--t2);letter-spacing:.14em;margin-left:8px;align-self:flex-end;padding-bottom:3px}
.topbar-mid{flex:1;display:flex;align-items:center;padding:0 16px;gap:8px}
.tb-chip{font-size:8px;font-weight:700;letter-spacing:.08em;padding:3px 10px;border:1px solid var(--green-b);background:var(--green-c);color:var(--green);border-radius:2px}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:blink 2s infinite}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:6px;padding:0 12px;border-left:1px solid var(--b);height:100%;flex-shrink:0}
.tb-pill{font-size:8px;font-weight:700;letter-spacing:.06em;padding:4px 11px;border:1px solid;border-radius:2px}
.tb-pill.gold{color:var(--gold2);border-color:var(--b3);background:var(--gold4)}
.tb-pill.ok{color:var(--green);border-color:var(--green-b);background:var(--green-c)}
.tb-pill.neutral{color:var(--t2);border-color:var(--b2);background:rgba(255,255,255,.02)}
.tb-clock{font-size:10px;color:var(--t3);letter-spacing:.04em;min-width:56px;text-align:right}

/* ── SHELL ── */
.shell{max-width:1100px;margin:0 auto;padding:16px 16px 80px;display:grid;grid-template-columns:320px 1fr;gap:16px}
@media(max-width:780px){.shell{grid-template-columns:1fr}}

/* ── STATUS BANNER ── */
.status-banner{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg2);border:.5px solid var(--b);border-radius:4px;margin-bottom:0;font-size:9px;grid-column:1/-1}
.sb-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.sb-dot.ok{background:var(--green)}.sb-dot.loading{background:var(--amber);animation:blink 1s infinite}.sb-dot.err{background:var(--red)}
.sb-msg.ok{color:var(--green)}.sb-msg.loading{color:var(--amber)}.sb-msg.err{color:var(--red)}.sb-msg{color:var(--t2)}

/* ── TEACHER PICKER ── */
.teacher-picker{grid-column:1/-1;display:none;align-items:center;gap:8px;padding:8px 12px;background:var(--bg2);border:.5px solid var(--b);border-radius:4px}
.teacher-picker.show{display:flex}
.tp-label{font-size:8px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);flex-shrink:0}
.tp-select{background:rgba(255,255,255,.03);border:.5px solid var(--b2);border-radius:3px;padding:4px 10px;font-family:var(--mono);font-size:10px;color:var(--t);outline:none;cursor:pointer;min-width:220px}
.tp-select option{background:var(--bg2)}

/* ── LEFT PANEL: iphone calendar ── */
.cal-panel{display:flex;flex-direction:column;gap:0;background:var(--bg2);border:.5px solid var(--b2);border-radius:10px;overflow:hidden}

/* teacher hero inside calendar */
.cal-teacher-hero{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:.5px solid var(--b)}
.cth-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;border:1.5px solid;box-shadow:inset 0 0 0 99px rgba(0,0,0,.35)}
.cth-info{flex:1}
.cth-name{font-family:var(--display);font-size:16px;letter-spacing:3px;color:var(--gold2);line-height:1}
.cth-meta{font-size:7.5px;color:var(--t3);margin-top:3px}
.cth-lessons{text-align:right;flex-shrink:0}
.cth-num{font-family:var(--display);font-size:26px;color:var(--gold2);line-height:1;letter-spacing:2px}
.cth-lbl{font-size:6.5px;color:var(--t3);text-transform:uppercase;letter-spacing:.1em}

/* month nav */
.cal-month-nav{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:.5px solid var(--b)}
.cmn-btn{width:28px;height:28px;border-radius:50%;border:.5px solid var(--b2);background:transparent;color:var(--t2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s}
.cmn-btn:hover{background:var(--gold4);border-color:var(--b3);color:var(--gold2)}
.cmn-title{font-family:var(--display);font-size:18px;letter-spacing:3px;color:var(--t);line-height:1}
.cmn-sub{font-size:8px;color:var(--t3);text-align:center;margin-top:2px}

/* weekday labels */
.cal-wdays{display:grid;grid-template-columns:repeat(7,1fr);padding:6px 10px 2px;gap:0}
.cal-wday{text-align:center;font-size:8px;font-weight:700;color:var(--t3);letter-spacing:.06em;text-transform:uppercase;padding:3px 0}

/* days grid */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);padding:4px 10px 10px;gap:2px}
.cal-day{aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:500;color:var(--t2);cursor:pointer;position:relative;transition:all .15s;border:.5px solid transparent}
.cal-day:hover{background:var(--gold4);border-color:var(--b2);color:var(--t)}
.cal-day.other-month{color:var(--t4);cursor:default}
.cal-day.other-month:hover{background:transparent;border-color:transparent;color:var(--t4)}
.cal-day.today{background:rgba(29,184,122,.12);border-color:rgba(29,184,122,.35);color:var(--green)}
.cal-day.has-lesson{font-weight:700;color:var(--gold2)}
.cal-day.has-lesson::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:var(--gold)}
.cal-day.done-lesson{color:var(--teal)}
.cal-day.done-lesson::after{background:var(--teal)}
.cal-day.selected{background:var(--gold3);border-color:var(--b3);color:var(--gold2)}
.cal-day.empty{cursor:default}
.cal-day.empty:hover{background:transparent;border-color:transparent}

/* lesson dots legend */
.cal-legend{display:flex;gap:10px;padding:8px 14px;border-top:.5px solid var(--b);flex-wrap:wrap}
.cl-item{display:flex;align-items:center;gap:4px;font-size:7.5px;color:var(--t3)}
.cl-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

/* progress bar */
.cal-progress{padding:10px 14px;border-top:.5px solid var(--b)}
.cp-label{font-size:7.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:5px;display:flex;justify-content:space-between}
.cp-bar{height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
.cp-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--green));border-radius:2px;transition:width .4s}

/* ── RIGHT PANEL: lesson sheet ── */
.lesson-panel{display:flex;flex-direction:column;gap:10px;animation:slide-up .25s ease}

/* hero */
.lp-hero{background:var(--bg2);border:.5px solid var(--b2);border-radius:8px;overflow:hidden}
.lph-top{padding:16px 18px 12px;display:flex;align-items:flex-start;gap:12px}
.lph-num{font-family:var(--display);font-size:56px;letter-spacing:2px;line-height:1;flex-shrink:0}
.lph-info{flex:1}
.lph-date{font-family:var(--display);font-size:22px;letter-spacing:3px;color:var(--gold2);line-height:1}
.lph-sub{font-size:9px;color:var(--t3);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap}
.lph-badge{padding:2px 8px;border-radius:2px;font-size:7.5px;font-weight:700;border:.5px solid}
.lph-bar{height:2px;background:rgba(255,255,255,.04)}
.lph-bar-fill{height:100%;transition:width .4s}

/* empty state */
.lp-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;background:var(--bg2);border:.5px solid var(--b);border-radius:8px;gap:8px}
.lpe-icon{font-size:32px;opacity:.3}
.lpe-title{font-size:14px;font-weight:700;color:var(--t3);font-family:var(--display);letter-spacing:3px}
.lpe-sub{font-size:9px;color:var(--t3)}

/* section */
.lp-section{background:var(--bg2);border:.5px solid var(--b);border-radius:8px;overflow:hidden}
.lps-head{padding:8px 14px;border-bottom:.5px solid var(--b);background:rgba(0,0,0,.15);display:flex;align-items:center;justify-content:space-between}
.lps-title{font-size:7.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.lps-badge{font-size:7.5px;font-weight:700;padding:2px 8px;border-radius:2px;border:.5px solid var(--green-b);background:var(--green-c);color:var(--green)}
.lps-body{padding:12px 14px}

/* attendance mini list */
.att-mini{display:flex;flex-direction:column;gap:2px}
.att-mini-row{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:3px;background:rgba(255,255,255,.02);border:.5px solid rgba(255,255,255,.03);font-size:10px}
.amr-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.amr-name{flex:1;color:var(--t2)}
.amr-status{font-size:7.5px;font-weight:700;letter-spacing:.04em}
.amr-status.p{color:var(--green)}.amr-status.l{color:var(--amber)}.amr-status.a{color:var(--red)}

/* summary box */
.sum-box{background:rgba(255,255,255,.02);border:.5px solid var(--b);border-radius:5px;padding:10px 12px;font-size:10px;color:var(--t2);line-height:1.7}
.sum-field{display:flex;gap:8px;margin-top:5px;font-size:9px}
.sf-k{color:var(--t3);flex-shrink:0;min-width:80px}
.sf-v{color:var(--t)}

/* stats row */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat-card{padding:10px 12px;background:rgba(255,255,255,.02);border:.5px solid var(--b);border-radius:5px;text-align:center}
.sc-v{font-family:var(--display);font-size:24px;color:var(--gold2);line-height:1;letter-spacing:1px}
.sc-l{font-size:7px;color:var(--t3);text-transform:uppercase;letter-spacing:.1em;margin-top:4px}

/* no data */
.no-data{padding:16px;text-align:center;font-size:9px;color:var(--t3);font-style:italic}

/* save bar */
.save-bar{position:fixed;bottom:0;left:0;right:0;z-index:150;background:rgba(7,6,14,.98);border-top:.5px solid var(--b);padding:7px 16px;display:flex;align-items:center;gap:8px;backdrop-filter:blur(12px)}
.qa-btn{display:flex;align-items:center;gap:4px;padding:5px 11px;border-radius:2px;font-size:9.5px;font-weight:700;cursor:pointer;border:.5px solid;font-family:var(--mono);transition:all .12s;letter-spacing:.04em}
.qa-green{background:var(--green-a);border-color:var(--green-b);color:var(--green)}.qa-green:hover{background:rgba(29,184,122,.22)}
.qa-gold{background:var(--gold4);border-color:var(--b2);color:var(--gold)}.qa-gold:hover{background:var(--gold3);color:var(--gold2)}
.sb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.sb-status{font-size:8.5px;font-family:var(--mono);color:var(--t3)}
.spinner{width:12px;height:12px;border:1.5px solid rgba(255,255,255,.08);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;display:none}

/* toast */
.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%) translateY(8px);padding:5px 16px;border-radius:2px;font-size:9px;font-weight:700;letter-spacing:.06em;opacity:0;transition:all .2s;z-index:9999;pointer-events:none;white-space:nowrap;border:.5px solid;font-family:var(--mono)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--green-a);border-color:var(--green-b);color:var(--green)}
.toast.info{background:var(--gold4);border-color:var(--b3);color:var(--gold2)}
.toast.err{background:var(--red-a);border-color:var(--red-b);color:var(--red)}
</style>
</head>
<body>

<div class="topbar">
  <div class="nav-duo">
    <a class="nav-home" href="/admin/dashboard"><span class="nav-home-icon">⌂</span></a>
    <a class="nav-back" href="javascript:history.back()">
      <span class="nav-back-arrow">←</span>
      <span class="nav-back-label">Portal</span>
    </a>
  </div>
  <div class="brand"><span class="brand-alm">ALM</span><span class="brand-yr">2026/27</span></div>
  <div class="topbar-mid">
    <div class="live-dot"></div>
    <div class="tb-chip">Calendário de Aulas</div>
  </div>
  <div class="topbar-right">
    <div class="tb-pill neutral">2026/2027</div>
    <div class="tb-pill ok" id="kpi-done">— aulas</div>
    <div class="tb-pill gold" id="kpi-remain">— em falta</div>
    <span class="tb-clock" id="clk">--:--:--</span>
  </div>
</div>

<div style="max-width:1100px;margin:0 auto;padding:16px 16px 0;display:flex;flex-direction:column;gap:10px">
  <div class="status-banner" style="grid-column:unset">
    <div class="sb-dot loading" id="sb-dot"></div>
    <span class="sb-msg loading" id="sb-msg">A carregar…</span>
  </div>
  <div class="teacher-picker" id="teacher-picker">
    <span class="tp-label">Professor</span>
    <select class="tp-select" id="tp-select" onchange="switchTeacher(this.value)">
      <option value="">Seleccionar professor…</option>
    </select>
  </div>
</div>

<div class="shell">

  <!-- LEFT: calendar -->
  <div class="cal-panel">

    <div class="cal-teacher-hero" id="cal-teacher-hero">
      <div class="cth-av" id="cth-av" style="border-color:rgba(201,168,76,.3);color:var(--gold2);background:var(--gold4)">—</div>
      <div class="cth-info">
        <div class="cth-name" id="cth-name">A carregar</div>
        <div class="cth-meta" id="cth-meta">—</div>
      </div>
      <div class="cth-lessons">
        <div class="cth-num" id="cth-num">—</div>
        <div class="cth-lbl">aulas/ano</div>
      </div>
    </div>

    <div class="cal-month-nav">
      <button class="cmn-btn" onclick="prevMonth()">‹</button>
      <div style="text-align:center">
        <div class="cmn-title" id="cmn-title">—</div>
        <div class="cmn-sub" id="cmn-sub">—</div>
      </div>
      <button class="cmn-btn" onclick="nextMonth()">›</button>
    </div>

    <div class="cal-wdays">
      <div class="cal-wday">Dom</div>
      <div class="cal-wday">Seg</div>
      <div class="cal-wday">Ter</div>
      <div class="cal-wday">Qua</div>
      <div class="cal-wday">Qui</div>
      <div class="cal-wday">Sex</div>
      <div class="cal-wday">Sáb</div>
    </div>

    <div class="cal-grid" id="cal-grid"></div>

    <div class="cal-legend">
      <div class="cl-item"><div class="cl-dot" style="background:var(--gold)"></div>Aula agendada</div>
      <div class="cl-item"><div class="cl-dot" style="background:var(--teal)"></div>Aula registada</div>
      <div class="cl-item"><div class="cl-dot" style="background:var(--green)"></div>Hoje</div>
    </div>

    <div class="cal-progress">
      <div class="cp-label">
        <span>Progresso anual</span>
        <span id="cp-pct">0 / 110</span>
      </div>
      <div class="cp-bar"><div class="cp-fill" id="cp-fill" style="width:0%"></div></div>
    </div>

  </div>

  <!-- RIGHT: lesson sheet -->
  <div class="lesson-panel" id="lesson-panel">
    <div class="lp-empty" id="lp-empty">
      <div class="lpe-icon">📅</div>
      <div class="lpe-title">Seleccione uma aula</div>
      <div class="lpe-sub">Clique num dia do calendário para ver os detalhes</div>
    </div>
  </div>

</div>

<div class="save-bar">
  <button class="qa-btn qa-gold" onclick="window.location.href='/admin/alm-teacher-portal.html'+(teacherId?'?teacher='+teacherId:'')">← Portal do Professor</button>
  <div class="spinner" id="spinner"></div>
  <div class="sb-right">
    <span class="sb-status" id="sb-status">Pronto</span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════
   SUPABASE
══════════════════════════════════════════ */
const SB  = 'https://oapygbeliocdvitbdjbq.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9hcHlnYmVsaW9jZHZpdGJkamJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NjQzNjAsImV4cCI6MjA5MjA0MDM2MH0.-9Uj9Bg3q8sIlqzfzw2Sc1JziaueeyYGNwep-qWhWWg';
const H   = {apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
const AY  = '2026/2027';
const TOTAL_LESSONS = 110;

async function sbGet(table,qs=''){
  let all=[],page=0,ps=1000;
  while(true){
    const s=page*ps,e=s+ps-1;
    const r=await fetch(`${SB}/rest/v1/${table}?${qs}`,{headers:{...H,Range:`${s}-${e}`,Prefer:'count=none'}});
    if(!r.ok){const t=await r.text();throw new Error(`${table} ${r.status}: ${t.slice(0,80)}`);}
    const d=await r.json();all=all.concat(d);
    if(d.length<ps)break;page++;if(page>9)break;
  }
  return all;
}

/* ══════════════════════════════════════════
   CONSTANTS
══════════════════════════════════════════ */
const FLAGS = {EN:'🇬🇧',PT:'🇵🇹',FR:'🇫🇷',ES:'🇪🇸',DE:'🇩🇪'};
const AV_POOL = [
  {bg:'#49281f',t:'#cfb590'},{bg:'#564334',t:'#9e9a41'},
  {bg:'#49281f',t:'#9e9a41'},{bg:'#564334',t:'#cfb590'},
  {bg:'#49281f',t:'#758918'},{bg:'#3d2a1a',t:'#cfb590'},
  {bg:'#564334',t:'#758918'},{bg:'#3d2a1a',t:'#9e9a41'},
];
function avCol(n){let h=0;for(let i=0;i<(n||'').length;i++)h=(h*31+(n||'').charCodeAt(i))&0xffffffff;return AV_POOL[Math.abs(h)%AV_POOL.length];}
function avInit(n){return(n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();}

/* Academic year: Sep 2026 – Jun 2027, weekdays only, no Aug */
const YEAR_START = new Date(2026,8,14); /* 14 Sep 2026 */
const YEAR_END   = new Date(2027,5,27); /* 27 Jun 2027 */

/* Portuguese public holidays to exclude */
const HOLIDAYS = new Set([
  '2026-10-05','2026-11-01','2026-12-01','2026-12-08','2026-12-25',
  '2027-01-01','2027-04-02','2027-04-25','2027-05-01','2027-06-10',
]);

/* School break windows */
function isSchoolBreak(d){
  const m=d.getMonth(),day=d.getDate();
  /* Christmas break 20 Dec – 5 Jan */
  if((m===11&&day>=20)||(m===0&&day<=5))return true;
  /* Carnival: approx 1 week in Feb (variable; use 15-21 Feb) */
  if(m===1&&day>=15&&day<=21)return true;
  /* Easter approx 26 Mar – 6 Apr 2027 */
  if(m===2&&day>=26)return true;
  if(m===3&&day<=6)return true;
  return false;
}

function isTeachingDay(d){
  const dow=d.getDay();
  if(dow===0)return false; /* Sunday */
  const iso=d.toISOString().slice(0,10);
  if(HOLIDAYS.has(iso))return false;
  if(isSchoolBreak(d))return false;
  return true;
}

/* Build the 110 lesson dates distributed evenly across the year */
function buildLessonDates(){
  const all=[];
  const d=new Date(YEAR_START);
  while(d<=YEAR_END){
    if(isTeachingDay(d)) all.push(d.toISOString().slice(0,10));
    d.setDate(d.getDate()+1);
  }
  /* Pick evenly spaced 110 */
  const step=(all.length-1)/(TOTAL_LESSONS-1);
  const picked=[];
  for(let i=0;i<TOTAL_LESSONS;i++) picked.push(all[Math.round(i*step)]);
  return [...new Set(picked)].sort();
}

/* ══════════════════════════════════════════
   STATE
══════════════════════════════════════════ */
let TEACHERS = [];
let ME = null;
let teacherId = null;
let MY_CLASSES = [];
let LESSON_DATES = []; /* sorted ISO strings, 110 items */
let ATTEND_MAP = {}; /* date → {turma_code, students:[]} */
let SUMMARY_MAP = {}; /* date → summary obj */
let REQUEST_MAP = {}; /* date → requests[] */
let calYear = 2026, calMonth = 8; /* 0-indexed, Sep=8 */
let selectedDate = null;

/* ══════════════════════════════════════════
   BOOT
══════════════════════════════════════════ */
async function boot(){
  setSb('loading','A carregar professores…');
  LESSON_DATES = buildLessonDates();

  try{
    const raw = await sbGet('teachers','select=id,code,name,lang,native,branch_primary,contract_hours_week&limit=200');
    TEACHERS = raw.map(r=>({
      id:r.id,code:r.code||'??',name:r.name||'—',
      lang:(r.lang||'EN').toUpperCase().slice(0,2),
      native:!!r.native,branch:r.branch_primary||'Funchal',
      contractH:r.contract_hours_week||22,
    }));
  }catch(e){setSb('err','Erro professores: '+e.message);return;}

  const params = new URLSearchParams(window.location.search);
  const tp = params.get('teacher');
  if(tp) ME = TEACHERS.find(t=>t.id===tp||t.code===tp)||null;

  if(!ME){
    const picker = document.getElementById('teacher-picker');
    picker.classList.add('show');
    const sel = document.getElementById('tp-select');
    sel.innerHTML = '<option value="">Seleccionar professor…</option>' +
      TEACHERS.map(t=>`<option value="${t.id}">${t.code} · ${t.name} · ${FLAGS[t.lang]||''} ${t.lang}</option>`).join('');
    setSb('warn','Seleccione um professor para continuar');
    renderCalTeacherHero();
    renderCalendar();
    return;
  }
  teacherId = ME.id;
  await loadData();
}

async function switchTeacher(id){
  if(!id)return;
  ME=TEACHERS.find(t=>t.id===id);
  if(!ME)return;
  teacherId=ME.id;
  document.getElementById('teacher-picker').classList.remove('show');
  await loadData();
}

/* ══════════════════════════════════════════
   LOAD DATA
══════════════════════════════════════════ */
async function loadData(){
  setSb('loading',`A carregar dados de ${ME.name}…`);
  ATTEND_MAP={};SUMMARY_MAP={};REQUEST_MAP={};MY_CLASSES=[];

  try{
    /* Classes */
    const classes = await sbGet('classes',
      `teacher_id=eq.${encodeURIComponent(ME.id)}&academic_year=eq.${encodeURIComponent(AY)}&select=turma_code,lang,level_code,level_display,department,day_of_week,hour,start_time,end_time,student_refs&limit=200`);
    MY_CLASSES = classes;

    const turmaCodes = classes.map(c=>c.turma_code).filter(Boolean);

    /* All attendance for this teacher's turmas */
    if(turmaCodes.length){
      const attRows = await sbGet('attendance',
        `turma_code=in.(${turmaCodes.join(',')})&select=turma_code,student_ref,student_name,date,status&limit=5000`);
      attRows.forEach(r=>{
        if(!ATTEND_MAP[r.date]) ATTEND_MAP[r.date]={};
        if(!ATTEND_MAP[r.date][r.turma_code]) ATTEND_MAP[r.date][r.turma_code]=[];
        ATTEND_MAP[r.date][r.turma_code].push({ref:r.student_ref,name:r.student_name||r.student_ref,status:r.status});
      });
    }

    /* All lesson summaries */
    const sums = await sbGet('lesson_summaries',
      `teacher_id=eq.${encodeURIComponent(ME.id)}&select=turma_code,date,summary,book_page,skill,participation,notes,lesson_number&limit=500`);
    sums.forEach(s=>{ SUMMARY_MAP[s.date]=s; });

    /* Teacher requests (fotocópias etc) */
    const reqs = await sbGet('teacher_requests',
      `teacher_id=eq.${encodeURIComponent(ME.id)}&select=id,type,document,copies,urgency,status,created_at&limit=500`);
    reqs.forEach(r=>{
      const d=r.created_at?.slice(0,10);
      if(d){ if(!REQUEST_MAP[d])REQUEST_MAP[d]=[]; REQUEST_MAP[d].push(r); }
    });

    const doneDates = LESSON_DATES.filter(d=>ATTEND_MAP[d]||SUMMARY_MAP[d]);
    document.getElementById('kpi-done').textContent = doneDates.length+' registadas';
    document.getElementById('kpi-remain').textContent = (TOTAL_LESSONS-doneDates.length)+' em falta';
    updateProgress(doneDates.length);
    setSb('ok',`${MY_CLASSES.length} turmas · ${doneDates.length}/${TOTAL_LESSONS} aulas registadas`);

  }catch(e){setSb('err','Erro: '+e.message);console.error(e);}

  renderCalTeacherHero();
  renderCalendar();
}

/* ══════════════════════════════════════════
   HERO INSIDE CALENDAR
══════════════════════════════════════════ */
function renderCalTeacherHero(){
  if(!ME)return;
  const av=avCol(ME.name);
  const el=document.getElementById('cth-av');
  el.textContent=avInit(ME.name);
  el.style.background=av.bg;
  el.style.borderColor=av.t+'66';
  el.style.color=av.t;
  document.getElementById('cth-name').textContent=ME.name;
  document.getElementById('cth-meta').textContent=
    `${FLAGS[ME.lang]||''} ${ME.lang} · ${ME.contractH}h · ${ME.branch}`;
  document.getElementById('cth-num').textContent=TOTAL_LESSONS;
}

/* ══════════════════════════════════════════
   CALENDAR RENDER
══════════════════════════════════════════ */
const MONTHS_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
  'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function renderCalendar(){
  const lessonSet = new Set(LESSON_DATES);
  const doneSet   = new Set([...Object.keys(ATTEND_MAP),...Object.keys(SUMMARY_MAP)]);
  const todayISO  = new Date().toISOString().slice(0,10);

  document.getElementById('cmn-title').textContent = MONTHS_PT[calMonth];
  document.getElementById('cmn-sub').textContent   = calYear;

  const first  = new Date(calYear,calMonth,1);
  const lastDay= new Date(calYear,calMonth+1,0).getDate();
  const startDow = first.getDay(); /* 0=Sun */

  let html='';
  /* blanks before */
  for(let i=0;i<startDow;i++) html+=`<div class="cal-day empty other-month"></div>`;

  for(let d=1;d<=lastDay;d++){
    const iso=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isLesson = lessonSet.has(iso);
    const isDone   = doneSet.has(iso) && isLesson;
    const isToday  = iso===todayISO;
    const isSel    = iso===selectedDate;

    let cls='cal-day';
    if(isToday) cls+=' today';
    else if(isSel) cls+=' selected';
    if(isDone) cls+=' done-lesson';
    else if(isLesson) cls+=' has-lesson';
    if(!isLesson&&!isToday&&!isSel) cls+=' other-month'; /* grey non-lesson days */

    const onclick = isLesson ? `onclick="selectDate('${iso}')"` : '';
    html+=`<div class="${cls}" ${onclick}>${d}</div>`;
  }

  document.getElementById('cal-grid').innerHTML=html;
}

function prevMonth(){
  calMonth--;
  if(calMonth<0){calMonth=11;calYear--;}
  renderCalendar();
}
function nextMonth(){
  calMonth++;
  if(calMonth>11){calMonth=0;calYear++;}
  renderCalendar();
}

/* ══════════════════════════════════════════
   SELECT DATE → show lesson sheet
══════════════════════════════════════════ */
function selectDate(iso){
  selectedDate=iso;
  renderCalendar();

  const lessonNum = LESSON_DATES.indexOf(iso)+1; /* 1-based */
  const att   = ATTEND_MAP[iso]||{};
  const sum   = SUMMARY_MAP[iso]||null;
  const reqs  = REQUEST_MAP[iso]||[];
  const dept  = MY_CLASSES[0]?.department||'adults';

  /* lesson number colour */
  const numColor = lessonNum<=37?'var(--blue)':lessonNum<=74?'var(--teal)':'var(--gold2)';
  const doneRatio = Object.keys(ATTEND_MAP).filter(d=>LESSON_DATES.includes(d)).length;
  const barPct = Math.round(lessonNum/TOTAL_LESSONS*100);

  /* date display */
  const dt = new Date(iso+'T12:00:00');
  const datePT = dt.toLocaleDateString('pt-PT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

  /* attendance summary across turmas */
  let attHTML='';
  const turmas = Object.keys(att);
  if(!turmas.length){
    attHTML=`<div class="no-data">Sem presenças registadas para esta data.</div>`;
  } else {
    turmas.forEach(tc=>{
      const rows=att[tc];
      const pres=rows.filter(r=>r.status==='present'||r.status==='presente').length;
      const late=rows.filter(r=>r.status==='late'||r.status==='atraso').length;
      const abs =rows.filter(r=>r.status==='absent'||r.status==='falta').length;
      attHTML+=`<div style="margin-bottom:8px">
        <div style="font-size:8px;font-weight:700;color:var(--gold2);letter-spacing:.08em;margin-bottom:4px">${tc} · ${pres+late}/${rows.length} presentes</div>
        <div class="att-mini">
          ${rows.map(r=>{
            const p=r.status==='present'||r.status==='presente';
            const l=r.status==='late'||r.status==='atraso';
            const a=r.status==='absent'||r.status==='falta';
            const dotC=p?'var(--green)':l?'var(--amber)':'var(--red)';
            const sc=p?'p':l?'l':'a';
            const st=p?'PRESENTE':l?'ATRASO':'FALTA';
            return`<div class="att-mini-row">
              <div class="amr-dot" style="background:${dotC}"></div>
              <div class="amr-name">${r.name||r.ref}</div>
              <div class="amr-status ${sc}">${st}</div>
            </div>`;
          }).join('')}
        </div>
      </div>`;
    });
  }

  /* summary */
  let sumHTML='';
  if(sum){
    sumHTML=`<div class="sum-box">
      ${sum.summary||'<em style="color:var(--t3)">Sem texto de sumário.</em>'}
      ${sum.book_page?`<div class="sum-field"><span class="sf-k">Livro/Pág.</span><span class="sf-v">${sum.book_page}</span></div>`:''}
      ${sum.skill?`<div class="sum-field"><span class="sf-k">Competência</span><span class="sf-v">${sum.skill}</span></div>`:''}
      ${sum.participation?`<div class="sum-field"><span class="sf-k">Participação</span><span class="sf-v">${sum.participation}</span></div>`:''}
      ${sum.notes?`<div class="sum-field"><span class="sf-k">Observações</span><span class="sf-v">${sum.notes}</span></div>`:''}
    </div>`;
  } else {
    sumHTML=`<div class="no-data">Sem sumário registado.
      <button class="qa-btn qa-gold" style="margin-top:8px;display:inline-flex"
        onclick="window.location.href='/admin/alm-teacher-portal.html?teacher=${ME?.id||''}'">
        ✎ Registar sumário →
      </button>
    </div>`;
  }

  /* requests */
  let reqHTML='';
  if(reqs.length){
    reqHTML=reqs.map(r=>`<div class="att-mini-row">
      <div class="amr-dot" style="background:var(--amber)"></div>
      <div class="amr-name">${r.type==='foto'?'📄 Fotocópias':r.type} · ${r.document||'—'} · ${r.copies||'—'} cópias</div>
      <div class="amr-status" style="color:var(--amber);font-size:7.5px;font-weight:700">${(r.urgency||'normal').toUpperCase()}</div>
    </div>`).join('');
  } else {
    reqHTML=`<div class="no-data">Sem pedidos nesta data.</div>`;
  }

  /* stats */
  const totalPres = Object.values(att).flat().filter(r=>r.status==='present'||r.status==='presente').length;
  const totalAbs  = Object.values(att).flat().filter(r=>r.status==='absent'||r.status==='falta').length;
  const totalStu  = Object.values(att).flat().length;

  const panel = document.getElementById('lesson-panel');
  panel.innerHTML=`
    <div class="lp-hero">
      <div class="lph-top">
        <div class="lph-num" style="color:${numColor}">
          ${String(lessonNum).padStart(2,'0')}
        </div>
        <div class="lph-info">
          <div class="lph-date">${datePT.split(',')[0].toUpperCase()} ${dt.getDate()} ${MONTHS_PT[dt.getMonth()].toUpperCase()}</div>
          <div style="font-family:var(--display);font-size:14px;color:var(--t3);letter-spacing:2px;margin-top:2px">${dt.getFullYear()}</div>
          <div class="lph-sub">
            <span class="lph-badge" style="background:rgba(201,168,76,.08);border-color:var(--b2);color:var(--gold2)">
              Aula ${lessonNum} de ${TOTAL_LESSONS}
            </span>
            ${turmas.length?`<span class="lph-badge" style="background:var(--green-c);border-color:var(--green-b);color:var(--green)">✓ Presenças registadas</span>`:''}
            ${sum?`<span class="lph-badge" style="background:rgba(40,200,176,.08);border-color:rgba(40,200,176,.3);color:var(--teal)">✓ Sumário</span>`:''}
          </div>
        </div>
      </div>
      <div class="lph-bar"><div class="lph-bar-fill" style="width:${barPct}%;background:${numColor}"></div></div>
    </div>

    ${totalStu>0?`<div class="stats-row">
      <div class="stat-card"><div class="sc-v" style="color:var(--green)">${totalPres}</div><div class="sc-l">Presentes</div></div>
      <div class="stat-card"><div class="sc-v" style="color:var(--red)">${totalAbs}</div><div class="sc-l">Faltas</div></div>
      <div class="stat-card"><div class="sc-v">${totalStu}</div><div class="sc-l">Total alunos</div></div>
    </div>`:''}

    <div class="lp-section">
      <div class="lps-head">
        <span class="lps-title">Presenças</span>
        ${turmas.length?`<span class="lps-badge">✓ ${turmas.length} turma${turmas.length>1?'s':''}</span>`:''}
      </div>
      <div class="lps-body">${attHTML}</div>
    </div>

    <div class="lp-section">
      <div class="lps-head">
        <span class="lps-title">Sumário da Aula</span>
        ${sum?`<span class="lps-badge">✓ Registado</span>`:''}
      </div>
      <div class="lps-body">${sumHTML}</div>
    </div>

    ${reqs.length?`<div class="lp-section">
      <div class="lps-head"><span class="lps-title">Pedidos · Fotocópias & outros</span></div>
      <div class="lps-body"><div class="att-mini">${reqHTML}</div></div>
    </div>`:''}
  `;

  /* scroll to panel on mobile */
  if(window.innerWidth<=780) panel.scrollIntoView({behavior:'smooth',block:'start'});
}

/* ══════════════════════════════════════════
   PROGRESS
══════════════════════════════════════════ */
function updateProgress(done){
  document.getElementById('cp-pct').textContent=`${done} / ${TOTAL_LESSONS}`;
  document.getElementById('cp-fill').style.width=Math.round(done/TOTAL_LESSONS*100)+'%';
}

/* ══════════════════════════════════════════
   UTILS
══════════════════════════════════════════ */
function setSb(type,msg){
  document.getElementById('sb-dot').className='sb-dot '+type;
  const m=document.getElementById('sb-msg');
  m.className='sb-msg '+type;m.textContent=msg;
  document.getElementById('sb-status').textContent=msg;
}

function tick(){
  const n=new Date(),p=x=>String(x).padStart(2,'0');
  document.getElementById('clk').textContent=p(n.getHours())+':'+p(n.getMinutes())+':'+p(n.getSeconds());
}

let toastT=null;
function showToast(msg,type='info'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast '+type+' show';
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2700);
}

tick();setInterval(tick,1000);
boot();
</script>
