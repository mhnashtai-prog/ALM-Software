<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ALM · Turmas Certificadas</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* ── PALETTE — The Color Palette Studio · Olive Green ── */
  --mist:#b6bbd9;       /* soft lavender-grey — empty / ghost */
  --harvest:#ad8820;    /* rich olive-gold — accent */
  --terrain:#90844a;    /* muted olive — rod / structure */
  --forest:#444f24;     /* deep green — CERTIFIED */

  --forest-soft:rgba(68,79,36,.10);
  --forest-mid:rgba(68,79,36,.55);
  --harvest-soft:rgba(173,136,32,.12);
  --terrain-soft:rgba(144,132,74,.16);
  --mist-soft:rgba(182,187,217,.22);

  /* ── SURFACE — warm off-white, not clinical ── */
  --bg:#FAF8F2;
  --bg2:#F2EFE6;
  --ink:#2A2A22;        /* primary text */
  --ink2:#6B6857;       /* secondary text */
  --ink3:#A8A492;       /* tertiary / labels */
  --hair:rgba(68,79,36,.10);

  --mono:'IBM Plex Mono',monospace;
  --sans:'IBM Plex Sans',sans-serif;
  --display:'Bebas Neue',sans-serif;

  --h-hdr:54px;
  --h-branch:36px;
  --h-kpi:54px;
  --h-foot:26px;
}
html,body{
  height:100dvh;width:100vw;
  background:var(--bg);color:var(--ink);
  font-family:var(--mono);font-size:12px;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
body{display:flex;flex-direction:column}

/* ── HEADER ── */
.card-hdr{
  flex-shrink:0;height:var(--h-hdr);
  display:flex;align-items:center;gap:13px;
  padding:0 22px;
  border-bottom:1px solid var(--hair);
  background:var(--bg);
  position:relative;z-index:10;
  border-top:2px solid var(--forest);
}
.hdr-brand{font-family:var(--display);font-size:25px;letter-spacing:8px;color:var(--forest);line-height:1}
.hdr-yr{font-size:7px;color:var(--ink3);letter-spacing:.16em;align-self:flex-end;padding-bottom:4px}
.hdr-div{width:1px;height:20px;background:var(--hair)}
.hdr-title{font-size:8.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--forest);animation:blink 2.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.live-lbl{font-size:7px;font-weight:700;letter-spacing:.12em;color:var(--forest)}
.status-pill{font-size:7px;font-weight:600;letter-spacing:.07em;padding:3px 10px;border-radius:999px;border:1px solid;white-space:nowrap}
.sp-load{border-color:var(--terrain-soft);color:var(--terrain);background:var(--terrain-soft)}
.sp-ok{border-color:var(--forest-mid);color:var(--forest);background:var(--forest-soft)}
.sp-err{border-color:rgba(176,40,40,.3);color:#B02828;background:rgba(176,40,40,.07)}

/* ── BRANCH STRIP ── */
.branch-strip{
  flex-shrink:0;height:var(--h-branch);
  display:flex;align-items:center;gap:5px;
  padding:0 22px;
  border-bottom:1px solid var(--hair);
  background:var(--bg2);
  position:relative;z-index:10;
}
.branch-pill{
  font-size:7px;font-weight:600;letter-spacing:.06em;
  padding:3px 11px;border:1px solid var(--hair);border-radius:999px;
  cursor:pointer;color:var(--ink3);background:transparent;
  font-family:var(--mono);transition:all .14s;
}
.branch-pill:hover{color:var(--ink2);border-color:var(--terrain)}
.branch-pill.active{background:var(--forest);border-color:var(--forest);color:#fff}
.strip-right{margin-left:auto;display:flex;align-items:center;gap:16px}
.leg{display:flex;align-items:center;gap:5px;font-size:6.5px;color:var(--ink3);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.leg-bead{width:14px;height:8px;border-radius:40% / 35%}
.leg-sep{width:1px;height:13px;background:var(--hair);margin:0 4px}
.strip-kv{font-size:7px;color:var(--ink2);white-space:nowrap;letter-spacing:.03em}

/* ── KPI ROW ── */
.kpi-row{
  flex-shrink:0;height:var(--h-kpi);
  display:flex;align-items:stretch;
  border-bottom:1px solid var(--hair);
  background:var(--bg);
  position:relative;z-index:10;
}
.kpi{flex:1;padding:9px 18px;border-left:1px solid var(--hair);display:flex;flex-direction:column;justify-content:center}
.kpi:first-child{border-left:none}
.kpi-v{font-size:21px;font-weight:700;line-height:1}
.kpi-l{font-size:6px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-top:3px}
.kpi-bar{height:2px;background:var(--mist-soft);margin-top:6px;border-radius:1px;overflow:hidden}
.kpi-bar-fill{height:100%;border-radius:1px;background:var(--forest);transition:width .9s cubic-bezier(.4,0,.2,1)}

/* ── ABACUS AREA ── */
.abacus-area{
  flex:1;display:flex;flex-direction:column;
  overflow:hidden;position:relative;z-index:1;min-height:0;
}
.dept-headers{flex-shrink:0;display:flex;background:var(--bg2);border-bottom:1px solid var(--hair)}
.dept-hd{
  display:flex;align-items:center;justify-content:center;
  padding:6px 6px;
  font-size:6.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
}
.cols-row{flex:1;display:flex;min-height:0;overflow:hidden;padding:0 6px}
/* NO column separators — calm, open field */
.lv-col{
  flex:1;display:flex;flex-direction:column;align-items:center;
  position:relative;min-width:0;overflow:hidden;
  cursor:pointer;transition:background .16s;border-radius:8px;
}
.lv-col:hover{background:var(--forest-soft)}
.col-top{
  flex-shrink:0;width:100%;padding:8px 3px 6px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
.col-label{
  font-family:var(--display);font-size:14px;letter-spacing:2px;
  line-height:1;text-align:center;white-space:nowrap;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;
  color:var(--ink3);transition:color .16s;
}
.col-label.has{color:var(--forest)}
.col-cert-badge{
  font-size:6px;font-weight:700;letter-spacing:.06em;
  padding:1.5px 7px;border-radius:999px;border:1px solid;white-space:nowrap;
  font-family:var(--mono);
}
.rod-wrap{
  flex:1;display:flex;flex-direction:column;align-items:center;
  position:relative;width:100%;padding:6px 0 4px;min-height:0;overflow:hidden;
}
/* The rod — thin olive line, only structure on the page */
.rod-wrap::before{
  content:'';position:absolute;top:6px;bottom:4px;left:50%;transform:translateX(-50%);
  width:1.5px;border-radius:1px;
  background:linear-gradient(to bottom,transparent,var(--terrain-soft) 14%,var(--terrain-soft) 86%,transparent);
}
.lv-col.has .rod-wrap::before{
  background:linear-gradient(to bottom,transparent,rgba(144,132,74,.4) 14%,rgba(144,132,74,.4) 86%,transparent);
}
.beads-wrap{
  display:flex;flex-direction:column-reverse;align-items:center;
  gap:3px;width:100%;padding:0 5px;
  position:relative;z-index:1;flex:1;justify-content:flex-start;
}
.bead{
  width:min(calc(100% - 6px), 48px);
  border-radius:42% / 36%;flex-shrink:0;position:relative;
  transition:transform .14s;
}
.bead:hover{transform:scaleX(1.08)}
/* CERTIFIED — deep forest, glossy, real */
.bead.certified{
  background:linear-gradient(158deg,#5C6B33 0%,var(--forest) 70%,#333d1b 100%);
  border:1px solid rgba(68,79,36,.65);
  box-shadow:0 1px 5px rgba(68,79,36,.30), inset 0 1px 0 rgba(255,255,255,.22);
}
.bead.certified::after{
  content:'';position:absolute;top:16%;left:20%;
  width:38%;height:26%;border-radius:50%;
  background:rgba(255,255,255,.28);
}
/* EMPTY — faint mist ghost, recedes */
.bead.empty{
  background:var(--mist-soft);
  border:1px solid rgba(182,187,217,.4);
}
.col-foot{
  flex-shrink:0;width:100%;padding:5px 3px 7px;
  display:flex;flex-direction:column;align-items:center;gap:1px;
}
.col-enrol{font-size:9px;font-weight:700;line-height:1}
.col-enrol-lbl{font-size:5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}

/* ── FOOTER ── */
.card-footer{
  flex-shrink:0;height:var(--h-foot);
  display:flex;align-items:center;gap:12px;
  padding:0 22px;border-top:1px solid var(--hair);
  background:var(--bg2);font-size:6.5px;color:var(--ink3);letter-spacing:.08em;
  position:relative;z-index:10;
}
.footer-ts{margin-left:auto;font-size:6px;color:var(--ink3)}

/* ── SPINNER ── */
.spinner{width:15px;height:15px;border:1.5px solid var(--mist-soft);border-top-color:var(--forest);border-radius:50%;animation:spin .65s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── TOOLTIP ── */
.tip{
  position:fixed;background:#fff;border:1px solid var(--hair);
  padding:10px 14px;font-size:8px;line-height:1.85;color:var(--ink2);
  pointer-events:none;z-index:9999;white-space:nowrap;border-radius:8px;
  box-shadow:0 10px 36px rgba(68,79,36,.18);display:none;
}
.tip-title{font-size:10px;font-weight:700;color:var(--forest);margin-bottom:5px;letter-spacing:.04em}
.tip-cert{color:var(--forest);font-weight:700}
.tip strong{color:var(--ink)}
</style>
</head>
<body>

<!-- HEADER -->
<div class="card-hdr">
  <span class="hdr-brand">ALM</span>
  <span class="hdr-yr">2026/27</span>
  <div class="hdr-div"></div>
  <span class="hdr-title">Turmas Certificadas · Ábaco</span>
  <div class="hdr-right">
    <div class="live-dot" id="live-dot"></div>
    <span class="live-lbl" id="live-lbl">A ligar…</span>
    <span class="status-pill sp-load" id="status-pill">Supabase…</span>
  </div>
</div>

<!-- BRANCH STRIP -->
<div class="branch-strip" id="branch-strip">
  <div class="spinner"></div>
</div>

<!-- KPI ROW -->
<div class="kpi-row">
  <div class="kpi"><div class="kpi-v" style="color:var(--ink)" id="kpi-total">—</div><div class="kpi-l">Inscritos</div></div>
  <div class="kpi"><div class="kpi-v" style="color:var(--forest)" id="kpi-groups">—</div><div class="kpi-l">Grupos certificados</div></div>
  <div class="kpi"><div class="kpi-v" style="color:var(--terrain)" id="kpi-sessions">—</div><div class="kpi-l">Sessões certificadas</div></div>
  <div class="kpi">
    <div class="kpi-v" style="color:var(--harvest)" id="kpi-students">—</div>
    <div class="kpi-l">Alunos alocados</div>
    <div class="kpi-bar"><div class="kpi-bar-fill" id="alloc-bar" style="width:0%"></div></div>
  </div>
  <div class="kpi"><div class="kpi-v" style="color:var(--ink3)" id="kpi-levels">—</div><div class="kpi-l">Níveis com turma</div></div>
</div>

<!-- ABACUS -->
<div class="abacus-area">
  <div class="dept-headers" id="dept-headers"></div>
  <div class="cols-row" id="cols-row">
    <div style="margin:auto;display:flex;align-items:center;gap:10px;color:var(--ink3);font-size:8px;letter-spacing:.1em">
      <div class="spinner"></div>A carregar dados certificados…
    </div>
  </div>
</div>

<!-- FOOTER -->
<div class="card-footer">
  <span>ALM · Painel Central · 2026/2027</span>
  <span id="footer-info" style="color:var(--ink3)">—</span>
  <span class="footer-ts" id="footer-ts">—</span>
</div>

<div class="tip" id="tip"></div>

<script>
const SB  = 'https://oapygbeliocdvitbdjbq.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9hcHlnYmVsaW9jZHZpdGJkamJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NjQzNjAsImV4cCI6MjA5MjA0MDM2MH0.-9Uj9Bg3q8sIlqzfzw2Sc1JziaueeyYGNwep-qWhWWg';
const H   = { apikey: KEY, Authorization: 'Bearer ' + KEY };
const AY  = '2026/2027';

/* Department / level structure — drives the columns left→right */
const DEPTS = [
  { key:'kids',     label:'Infantil', color:'#5B6BBF',
    levels:[
      {key:'kids|PI1', label:'PI 1', lc:'PI1'},
      {key:'kids|PI2', label:'PI 2', lc:'PI2'},
      {key:'kids|PI3', label:'PI 3', lc:'PI3'},
      {key:'kids|PI4', label:'PI 4', lc:'PI4'},
    ]},
  { key:'kids_juv', label:'Juvenil', color:'#90844a',
    levels:[
      {key:'kids_juv|PJ1', label:'PJ 1', lc:'PJ1'},
      {key:'kids_juv|PJ2', label:'PJ 2', lc:'PJ2'},
      {key:'kids_juv|PJ3', label:'PJ 3', lc:'PJ3'},
    ]},
  { key:'adults',   label:'Geral', color:'#ad8820',
    levels:[
      {key:'adults|1',         label:'Ano 1', lc:'1'},
      {key:'adults|2',         label:'Ano 2', lc:'2'},
      {key:'adults|3',         label:'Ano 3', lc:'3'},
      {key:'adults|4',         label:'Ano 4', lc:'4'},
      {key:'adults|5',         label:'Ano 5', lc:'5'},
      {key:'adults|Portugues', label:'PT',    lc:'PT'},
    ]},
  { key:'exam',     label:'Exames', color:'#444f24',
    levels:[
      {key:'exam|6', label:'Ano 6', lc:'FCE'},
      {key:'exam|7', label:'Ano 7', lc:'CAE'},
      {key:'exam|8', label:'Ano 8', lc:'CPE'},
    ]},
];

const ALL_LEVELS = DEPTS.flatMap(d => d.levels.map(lv => ({...lv, dept:d})));
const TOTAL_COLS = ALL_LEVELS.length;
const BRANCHES = ['FUNCHAL','CAMARA_LOBOS','SANTA_CRUZ','MACHICO','RIBEIRA_BRAVA','CALHETA'];
const BL = {FUNCHAL:'Funchal',CAMARA_LOBOS:'C. Lobos',SANTA_CRUZ:'S. Cruz',MACHICO:'Machico',RIBEIRA_BRAVA:'R. Brava',CALHETA:'Calheta'};

let activeBranch = 'FUNCHAL';
let allClasses = [], allEnrols = [];

async function sbGet(table, qs) {
  let all=[], page=0, ps=1000;
  while(true){
    const s=page*ps, e=s+ps-1;
    const r=await fetch(`${SB}/rest/v1/${table}?${qs}`,{headers:{...H,Range:`${s}-${e}`,Prefer:'count=none'}});
    if(!r.ok) throw new Error(`${table} HTTP ${r.status}`);
    const d=await r.json(); all=all.concat(d);
    if(d.length<ps)break; page++; if(page>9)break;
  }
  return all;
}

const normB = b => (b||'').toUpperCase().replace(/[\s\-]+/g,'_').replace(/_+/g,'_').trim();

async function boot() {
  try {
    const [classes, enrols] = await Promise.all([
      // CERTIFIED ONLY — locked rows are the credible, persisted source of truth
      sbGet('classes', `select=turma_code,group_code,level_code,department,branch,locked,student_refs&academic_year=eq.${encodeURIComponent(AY)}&locked=eq.true`),
      sbGet('enrolments', `select=ref,branch,family,level_code&academic_year=eq.${encodeURIComponent(AY)}`),
    ]);
    allClasses = classes || [];
    allEnrols  = enrols  || [];
    setConn(true);
    buildBranchStrip();
    render();
    document.getElementById('footer-ts').textContent = 'Actualizado: ' + new Date().toLocaleTimeString('pt-PT');
  } catch(e) {
    setConn(false);
    document.getElementById('cols-row').innerHTML =
      `<div style="margin:auto;color:#B02828;font-size:8px;letter-spacing:.1em">Erro Supabase: ${e.message}</div>`;
  }
}

function setConn(ok) {
  const dot=document.getElementById('live-dot'),lbl=document.getElementById('live-lbl'),pill=document.getElementById('status-pill');
  if(ok){dot.style.background='var(--forest)';lbl.textContent='LIVE';lbl.style.color='var(--forest)';pill.textContent='Supabase OK';pill.className='status-pill sp-ok';}
  else{dot.style.background='#B02828';lbl.textContent='ERRO';lbl.style.color='#B02828';pill.textContent='Erro DB';pill.className='status-pill sp-err';}
}

function buildBranchStrip() {
  const present = BRANCHES.filter(b => allEnrols.some(e => normB(e.branch)===b));
  const strip = document.getElementById('branch-strip');
  const pills =
    `<button class="branch-pill${activeBranch==='FUNCHAL'?' active':''}" onclick="setBranch('FUNCHAL',this)">Funchal</button>` +
    present.filter(b=>b!=='FUNCHAL').map(b=>
      `<button class="branch-pill${activeBranch===b?' active':''}" onclick="setBranch('${b}',this)">${BL[b]||b}</button>`
    ).join('') +
    `<button class="branch-pill${activeBranch==='all'?' active':''}" onclick="setBranch('all',this)" style="border-style:dashed">Todas as filiais</button>`;
  strip.innerHTML = pills +
    `<div class="strip-right">
      <div class="leg"><div class="leg-bead" style="background:linear-gradient(158deg,#5C6B33,#444f24);border:1px solid rgba(68,79,36,.6)"></div>Certificada</div>
      <div class="leg"><div class="leg-bead" style="background:var(--mist-soft);border:1px solid rgba(182,187,217,.4)"></div>Sem turma</div>
      <div class="leg-sep"></div>
      <div class="strip-kv" id="strip-total">—</div>
    </div>`;
}

function setBranch(b, btn) {
  activeBranch = b;
  document.querySelectorAll('.branch-pill').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function computeMaps() {
  const classes = activeBranch==='all' ? allClasses : allClasses.filter(c=>normB(c.branch)===activeBranch);
  const enrols  = activeBranch==='all' ? allEnrols  : allEnrols.filter(e=>normB(e.branch)===activeBranch);

  const enrolMap={};
  enrols.forEach(e=>{
    const lk=(e.family||'').toLowerCase().trim()+'|'+(e.level_code||'').trim();
    enrolMap[lk]=(enrolMap[lk]||0)+1;
  });

  // Group certified sessions by group_code per level (A+B → one group)
  const groups={};        // lk -> Set of group_code
  const sessMap={};       // lk -> session count
  const studentSet={};    // lk -> Set of refs (alocados)
  classes.forEach(c=>{
    const lk=(c.department||'').toLowerCase().trim()+'|'+(c.level_code||'').trim();
    sessMap[lk]=(sessMap[lk]||0)+1;
    const gc=c.group_code||(c.turma_code||'').replace(/[AB]$/i,'');
    if(gc){ if(!groups[lk])groups[lk]=new Set(); groups[lk].add(gc); }
    (Array.isArray(c.student_refs)?c.student_refs:[]).forEach(r=>{
      if(!studentSet[lk])studentSet[lk]=new Set(); studentSet[lk].add(r);
    });
  });

  const groupMap={};   // lk -> count of certified groups
  Object.keys(groups).forEach(lk=>{ groupMap[lk]=groups[lk].size; });

  return {sessMap,groupMap,enrolMap,studentSet,enrolTotal:enrols.length};
}

function render() {
  const {sessMap,groupMap,enrolMap,studentSet,enrolTotal} = computeMaps();

  let totSess=0, totGroups=0, totStudents=0, levelsWithGroups=0;
  Object.values(sessMap).forEach(n=>totSess+=n);
  Object.values(groupMap).forEach(n=>{totGroups+=n; if(n>0)levelsWithGroups++;});
  Object.values(studentSet).forEach(s=>totStudents+=s.size);

  document.getElementById('kpi-total').textContent    = enrolTotal;
  document.getElementById('kpi-groups').textContent   = totGroups;
  document.getElementById('kpi-sessions').textContent = totSess;
  document.getElementById('kpi-students').textContent = totStudents;
  document.getElementById('kpi-levels').textContent   = levelsWithGroups + '/' + TOTAL_COLS;
  const allocPct = enrolTotal>0 ? Math.round(totStudents/enrolTotal*100) : 0;
  document.getElementById('alloc-bar').style.width    = allocPct+'%';
  document.getElementById('strip-total').textContent  =
    `${enrolTotal} inscritos · ${totGroups} grupo${totGroups!==1?'s':''} cert. · ${totStudents} alocados`;
  document.getElementById('footer-info').textContent  =
    `${levelsWithGroups} de ${TOTAL_COLS} níveis com turma · ${totGroups} grupos · ${totSess} sessões`;

  // Dynamic rod height: scale to the busiest level + 1 spare slot, min 3
  const maxGroups = Math.max(...ALL_LEVELS.map(lv => groupMap[lv.key]||0), 3);
  const TOTAL_SLOTS = maxGroups + 1;

  // Dept headers
  const deptHdr = document.getElementById('dept-headers');
  deptHdr.innerHTML = '';
  DEPTS.forEach(d => {
    const el = document.createElement('div');
    el.className = 'dept-hd';
    el.style.cssText = `width:${d.levels.length/TOTAL_COLS*100}%;color:${d.color}`;
    el.textContent = d.label;
    deptHdr.appendChild(el);
  });

  const colsRow = document.getElementById('cols-row');
  colsRow.innerHTML = '';

  ALL_LEVELS.forEach((lv, ci) => {
    const grps  = groupMap[lv.key] || 0;
    const enrol = enrolMap[lv.key] || 0;
    const dept  = lv.dept;
    const hasGroups = grps > 0;

    // One bead per certified group, bottom-up; pad with empty ghost beads
    const beads = [];
    for(let i=0;i<TOTAL_SLOTS;i++){
      beads.push(i < grps ? 'certified' : 'empty');
    }

    const badgeBg  = hasGroups ? 'var(--forest-soft)' : 'var(--mist-soft)';
    const badgeBdr = hasGroups ? 'var(--forest-mid)'  : 'rgba(182,187,217,.4)';
    const badgeClr = hasGroups ? 'var(--forest)'      : 'var(--ink3)';
    const badgeTxt = hasGroups ? `✓ ${grps}` : '—';

    const col = document.createElement('div');
    col.className = 'lv-col' + (hasGroups ? ' has' : '');
    col.innerHTML = `
      <div class="col-top">
        <div class="col-label${hasGroups?' has':''}">${lv.lc||lv.label}</div>
        <div class="col-cert-badge" style="background:${badgeBg};border-color:${badgeBdr};color:${badgeClr}">${badgeTxt}</div>
      </div>
      <div class="rod-wrap">
        <div class="beads-wrap" id="bw-${ci}">
          ${beads.map(cls=>`<div class="bead ${cls}"></div>`).join('')}
        </div>
      </div>
      <div class="col-foot">
        <div class="col-enrol" style="color:${enrol>0?'var(--ink2)':'var(--ink3)'}">${enrol||'—'}</div>
        <div class="col-enrol-lbl">inscr.</div>
      </div>`;
    col.addEventListener('mouseenter', e => showTip(e, {lv, dept, grps, enrol, sess:sessMap[lv.key]||0, alloc:(studentSet[lv.key]?.size)||0}));
    col.addEventListener('mousemove',  moveTip);
    col.addEventListener('mouseleave', hideTip);
    colsRow.appendChild(col);
  });

  requestAnimationFrame(() => adjustBeadHeights(TOTAL_SLOTS));
}

function adjustBeadHeights(slots) {
  const firstWrap = document.querySelector('.beads-wrap');
  if (!firstWrap) return;
  const rodH = firstWrap.parentElement.offsetHeight;
  const available = rodH - 10;
  let h = Math.floor((available - (slots - 1) * 3) / slots);
  h = Math.max(6, Math.min(h, 26));
  document.querySelectorAll('.bead').forEach(b => { b.style.height = h + 'px'; });
}

function showTip(e, data) {
  const tip = document.getElementById('tip');
  const {lv, dept, grps, enrol, sess, alloc} = data;
  tip.innerHTML = `
    <div class="tip-title">${dept.label} · ${lv.label}</div>
    Inscritos: <strong>${enrol}</strong><br>
    ${grps>0
      ? `<span class="tip-cert">● ${grps} turma${grps!==1?'s':''} certificada${grps!==1?'s':''}</span><br>`
        + `<span style="color:var(--ink3)">${sess} sessões · ${alloc} alunos alocados</span>`
      : `<span style="color:var(--ink3)">Sem turmas certificadas</span>`}
  `;
  tip.style.display = 'block';
  moveTip(e);
}
function moveTip(e) {
  const tip = document.getElementById('tip');
  const x = e.clientX + 16, y = e.clientY - 8;
  tip.style.left = Math.min(x, window.innerWidth - tip.offsetWidth - 10) + 'px';
  tip.style.top  = Math.max(8, Math.min(y, window.innerHeight - tip.offsetHeight - 8)) + 'px';
}
function hideTip(){ document.getElementById('tip').style.display = 'none'; }

window.addEventListener('resize', () => {
  const slots = document.querySelectorAll('#bw-0 .bead').length;
  if(slots>0) adjustBeadHeights(slots);
});

boot();
setInterval(boot, 60000);
</script>
</body>
</html>
