<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ALM · Turmas · Ábaco</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --mist:#b6bbd9;--terrain:#90844a;--forest:#444f24;
  --forest-soft:rgba(68,79,36,.10);--forest-mid:rgba(68,79,36,.55);
  --terrain-soft:rgba(144,132,74,.16);--mist-soft:rgba(182,187,217,.22);
  --bg:#FAF8F2;--bg2:#F2EFE6;
  --ink:#2A2A22;--ink2:#6B6857;--ink3:#A8A492;
  --hair:rgba(68,79,36,.10);
  --mono:'IBM Plex Mono',monospace;--display:'Bebas Neue',sans-serif;
  --h-hdr:54px;--h-branch:36px;--h-kpi:54px;--h-foot:26px;
}
html,body{height:100dvh;width:100vw;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:12px;-webkit-font-smoothing:antialiased;overflow:hidden}
body{display:flex;flex-direction:column}

.card-hdr{flex-shrink:0;height:var(--h-hdr);display:flex;align-items:center;gap:13px;padding:0 22px;border-bottom:1px solid var(--hair);background:var(--bg);position:relative;z-index:10;border-top:2px solid var(--forest)}
.hdr-stats{display:flex;align-items:baseline;gap:18px;margin-left:24px}
.hs{display:flex;align-items:baseline;gap:5px}
.hs-v{font-size:18px;font-weight:700;line-height:1;font-family:var(--mono)}
.hs-l{font-size:6.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.hdr-brand{font-family:var(--display);font-size:25px;letter-spacing:8px;color:var(--forest);line-height:1}
.hdr-yr{font-size:7px;color:var(--ink3);letter-spacing:.16em;align-self:flex-end;padding-bottom:4px}
.hdr-div{width:1px;height:20px;background:var(--hair)}
.hdr-title{font-size:8.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--forest);animation:blink 2.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.live-lbl{font-size:7px;font-weight:700;letter-spacing:.12em;color:var(--forest)}
.status-pill{font-size:7px;font-weight:600;letter-spacing:.07em;padding:3px 10px;border-radius:999px;border:1px solid;white-space:nowrap}
.sp-load{border-color:var(--terrain-soft);color:var(--terrain);background:var(--terrain-soft)}
.sp-ok{border-color:var(--forest-mid);color:var(--forest);background:var(--forest-soft)}
.sp-err{border-color:rgba(176,40,40,.3);color:#B02828;background:rgba(176,40,40,.07)}

.branch-strip{flex-shrink:0;height:var(--h-branch);display:flex;align-items:center;gap:5px;padding:0 22px;border-bottom:1px solid var(--hair);background:var(--bg2);position:relative;z-index:10}
.branch-pill{font-size:7px;font-weight:600;letter-spacing:.06em;padding:3px 11px;border:1px solid var(--hair);border-radius:999px;cursor:pointer;color:var(--ink3);background:transparent;font-family:var(--mono);transition:all .14s}
.branch-pill:hover{color:var(--ink2);border-color:var(--terrain)}
.branch-pill.active{background:var(--forest);border-color:var(--forest);color:#fff}
.strip-right{margin-left:auto;display:flex;align-items:center;gap:16px}
.leg{display:flex;align-items:center;gap:5px;font-size:6.5px;color:var(--ink3);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.leg-bead{width:14px;height:8px;border-radius:40% / 35%}
.leg-sep{width:1px;height:13px;background:var(--hair);margin:0 4px}
.strip-kv{font-size:7px;color:var(--ink2);white-space:nowrap;letter-spacing:.03em}

.kpi-bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--mist-soft);overflow:hidden}
.kpi-bar-fill{height:100%;background:var(--forest);transition:width .9s cubic-bezier(.4,0,.2,1)}

.abacus-area{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:1;min-height:0}
.dept-headers{flex-shrink:0;display:flex;background:var(--bg2);border-bottom:1px solid var(--hair)}
.dept-hd{display:flex;align-items:center;justify-content:center;padding:6px 6px;font-size:6.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.cols-row{flex:1;display:flex;min-height:0;overflow:hidden;padding:0 6px}
.lv-col{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;min-width:0;overflow:hidden;cursor:pointer;transition:background .16s;border-radius:8px}
.lv-col:hover{background:var(--forest-soft)}
.col-top{flex-shrink:0;width:100%;padding:8px 3px 6px;display:flex;flex-direction:column;align-items:center;gap:3px}
.col-label{font-family:var(--display);font-size:14px;letter-spacing:2px;line-height:1;text-align:center;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;color:var(--ink3);transition:color .16s}
.col-label.has{color:var(--forest)}
.col-cert-badge{font-size:6px;font-weight:700;letter-spacing:.06em;padding:1.5px 7px;border-radius:999px;border:1px solid;white-space:nowrap;font-family:var(--mono)}
.rod-wrap{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;width:100%;padding:6px 0 4px;min-height:0;overflow:hidden}
.rod-wrap::before{content:'';position:absolute;top:6px;bottom:4px;left:50%;transform:translateX(-50%);width:1.5px;border-radius:1px;background:linear-gradient(to bottom,transparent,var(--terrain-soft) 14%,var(--terrain-soft) 86%,transparent)}
.lv-col.has .rod-wrap::before{background:linear-gradient(to bottom,transparent,rgba(144,132,74,.4) 14%,rgba(144,132,74,.4) 86%,transparent)}
.beads-wrap{display:flex;flex-direction:column-reverse;align-items:center;gap:2px;width:100%;padding:0 5px;position:relative;z-index:1;flex:1;justify-content:flex-start}
.bead{width:14px;height:11px;border-radius:50%;flex-shrink:0;position:relative;transition:transform .14s}
.bead:hover{transform:scale(1.25)}
/* CERTIFIED — deep forest pea */
.bead.certified{background:radial-gradient(circle at 35% 30%,#6B7A3E,#444f24 75%);border:.5px solid rgba(68,79,36,.7);box-shadow:0 1px 3px rgba(68,79,36,.3)}
/* PROPOSED — living mist pea */
.bead.proposed{background:radial-gradient(circle at 35% 30%,#c3c8e6,#8088c0 80%);border:.5px solid rgba(122,128,174,.7);box-shadow:0 1px 3px rgba(122,128,174,.22)}
/* EMPTY — faint ghost pea */
.bead.empty{background:rgba(182,187,217,.14);border:.5px solid rgba(182,187,217,.3)}
.col-foot{flex-shrink:0;width:100%;padding:5px 3px 7px;display:flex;flex-direction:column;align-items:center;gap:1px}
.col-enrol{font-size:9px;font-weight:700;line-height:1}
.col-enrol-lbl{font-size:5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}

.card-footer{flex-shrink:0;height:var(--h-foot);display:flex;align-items:center;gap:12px;padding:0 22px;border-top:1px solid var(--hair);background:var(--bg2);font-size:6.5px;color:var(--ink3);letter-spacing:.08em;position:relative;z-index:10}
.footer-ts{margin-left:auto;font-size:6px;color:var(--ink3)}
.spinner{width:15px;height:15px;border:1.5px solid var(--mist-soft);border-top-color:var(--forest);border-radius:50%;animation:spin .65s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tip{position:fixed;background:#fff;border:1px solid var(--hair);padding:10px 14px;font-size:8px;line-height:1.85;color:var(--ink2);pointer-events:none;z-index:9999;white-space:nowrap;border-radius:8px;box-shadow:0 10px 36px rgba(68,79,36,.18);display:none}
.tip-title{font-size:10px;font-weight:700;color:var(--forest);margin-bottom:5px;letter-spacing:.04em}
.tip-cert{color:var(--forest);font-weight:700}
.tip-prop{color:#7A80AE;font-weight:700}
.tip strong{color:var(--ink)}
</style>
</head>
<body>

<div class="card-hdr">
  <span class="hdr-brand">ALM</span>
  <span class="hdr-yr">2026/27</span>
  <div class="hdr-div"></div>
  <span class="hdr-title">Turmas · Ábaco</span>
  <div class="hdr-stats">
    <div class="hs"><span class="hs-v" style="color:var(--ink)" id="kpi-total">—</span><span class="hs-l">inscritos</span></div>
    <div class="hs"><span class="hs-v" style="color:var(--forest)" id="kpi-cert">—</span><span class="hs-l">cert.</span></div>
    <div class="hs"><span class="hs-v" style="color:#7A80AE" id="kpi-prop">—</span><span class="hs-l">prop.</span></div>
    <div class="hs"><span class="hs-v" style="color:var(--terrain)" id="kpi-total-sess">—</span><span class="hs-l">sessões</span></div>
    <div class="hs"><span class="hs-v" style="color:var(--ink3)" id="kpi-levels">—</span><span class="hs-l">níveis</span></div>
  </div>
  <div class="hdr-right">
    <div class="live-dot" id="live-dot"></div>
    <span class="live-lbl" id="live-lbl">A ligar…</span>
    <span class="status-pill sp-load" id="status-pill">Supabase…</span>
  </div>
  <div class="kpi-bar" id="cert-bar-wrap"><div class="kpi-bar-fill" id="cert-bar" style="width:0%"></div></div>
</div>

<div class="branch-strip" id="branch-strip"><div class="spinner"></div></div>

<div class="abacus-area">
  <div class="dept-headers" id="dept-headers"></div>
  <div class="cols-row" id="cols-row">
    <div style="margin:auto;display:flex;align-items:center;gap:10px;color:var(--ink3);font-size:8px;letter-spacing:.1em">
      <div class="spinner"></div>A agrupar e auditar todos os níveis…
    </div>
  </div>
</div>

<div class="card-footer">
  <span>ALM · Painel Central · 2026/2027</span>
  <span id="footer-info" style="color:var(--ink3)">—</span>
  <span class="footer-ts" id="footer-ts">—</span>
</div>

<div class="tip" id="tip"></div>

<script>
/* ══════════════════════════════════════════════
   SUPABASE
══════════════════════════════════════════════ */
const SB  = 'https://oapygbeliocdvitbdjbq.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9hcHlnYmVsaW9jZHZpdGJkamJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NjQzNjAsImV4cCI6MjA5MjA0MDM2MH0.-9Uj9Bg3q8sIlqzfzw2Sc1JziaueeyYGNwep-qWhWWg';
const H   = { apikey: KEY, Authorization: 'Bearer ' + KEY };
const AY  = '2026/2027';

async function sbGet(table, qs) {
  let all=[], page=0, ps=1000;
  while(true){
    const s=page*ps, e=s+ps-1;
    const r=await fetch(`${SB}/rest/v1/${table}?${qs}`,{headers:{...H,Range:`${s}-${e}`,Prefer:'count=none'}});
    if(!r.ok) throw new Error(`${table} HTTP ${r.status}`);
    const d=await r.json(); all=all.concat(d);
    if(d.length<ps)break; page++; if(page>9)break;
  }
  return all;
}

/* ══════════════════════════════════════════════
   ENGINE CONSTANTS — ported verbatim from OVERVIEW
══════════════════════════════════════════════ */
const DAYS_PT   = ['SEG','TER','QUA','QUI','SEX','SÁB'];
const CLASS_DUR = 90;
const MIN_G=5, MAX_G=17;

const ALM_PAIRS = [
  {a:1,b:3,aL:'TER',bL:'QUI',label:'TER+QUI'},
  {a:2,b:4,aL:'QUA',bL:'SEX',label:'QUA+SEX'},
  {a:0,b:2,aL:'SEG',bL:'QUA',label:'SEG+QUA'},
  {a:5,b:5,aL:'SÁB',bL:'SÁB',label:'SÁB',examOnly:true},
];

const DAY_NORM = {
  monday:0,tuesday:1,wednesday:2,thursday:3,friday:4,saturday:5,
  segunda:0,terca:1,'terça':1,quarta:2,quinta:3,sexta:4,sabado:5,'sábado':5,
  seg:0,ter:1,qua:2,qui:3,sex:4,sab:5,'sáb':5,
  mon:0,tue:1,wed:2,thu:3,fri:4,sat:5,
  'segunda-feira':0,'terça-feira':1,'quarta-feira':2,'quinta-feira':3,'sexta-feira':4
};

/* Department / level structure — drives columns + maps to engine levelKey */
const DEPTS = [
  { key:'kids',     label:'Infantil', color:'#5B6BBF',
    levels:[['kids|PI1','PI 1'],['kids|PI2','PI 2'],['kids|PI3','PI 3'],['kids|PI4','PI 4']]},
  { key:'kids_juv', label:'Juvenil', color:'#90844a',
    levels:[['kids_juv|PJ1','PJ 1'],['kids_juv|PJ2','PJ 2'],['kids_juv|PJ3','PJ 3']]},
  { key:'adults',   label:'Geral', color:'#7C7440',
    levels:[['adults|1','Ano 1'],['adults|2','Ano 2'],['adults|3','Ano 3'],['adults|4','Ano 4'],['adults|5','Ano 5'],['adults|Portugues','PT']]},
  { key:'exam',     label:'Exames', color:'#444f24',
    levels:[['exam|6','FCE'],['exam|7','CAE'],['exam|8','CPE']]},
];
const ALL_LEVELS = DEPTS.flatMap(d => d.levels.map(([key,label]) => ({key,label,dept:d})));
const TOTAL_COLS = ALL_LEVELS.length;
const BRANCHES = ['FUNCHAL','CAMARA_LOBOS','SANTA_CRUZ','MACHICO','RIBEIRA_BRAVA','CALHETA'];
const BRANCH_LABELS = {FUNCHAL:'Funchal',CAMARA_LOBOS:'C. Lobos',SANTA_CRUZ:'S. Cruz',MACHICO:'Machico',RIBEIRA_BRAVA:'R. Brava',CALHETA:'Calheta'};

/* ══════════════════════════════════════════════
   STATE
══════════════════════════════════════════════ */
let activeBranch = 'FUNCHAL';
let allE=[], allR=[], rByRef={}, lockedClasses=[];

/* ══════════════════════════════════════════════
   HELPERS — ported verbatim from OVERVIEW
══════════════════════════════════════════════ */
const normB=b=>(b||'').toUpperCase().replace(/[\s\-]+/g,'_').replace(/_+/g,'_').trim();
const lk=e=>`${(e.family||'').toLowerCase()}|${(e.level_code||e.level_cefr||'').trim()}`;
const minsToT=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;

function parseDayPrefs(raw){
  if(!raw)return[];if(Array.isArray(raw))return raw;
  try{const p=JSON.parse(raw);return Array.isArray(p)?p:[];}catch{return[];}
}
function timeToMins(t){
  if(!t)return null;const parts=(t+'').trim().split(':');
  const h=parseInt(parts[0],10),m=parseInt(parts[1]||'0',10);
  return isNaN(h)?null:h*60+m;
}
function normDay(raw){
  if(raw===null||raw===undefined)return null;
  const n=parseInt(raw);
  if(!isNaN(n)&&n>=1&&n<=6)return n-1;
  if(!isNaN(n)&&n>=0&&n<=5)return n;
  const key=(raw+'').toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  return DAY_NORM[key]??null;
}
function parseSlot(p){
  if(p.available===false)return null;
  const rawDay=p.day_short||p.day||p.weekday||p.dia||p.day_code||'';
  let dayIdx=normDay(rawDay);if(dayIdx===null)return null;
  const rawStart=p.from||p.session_start||p.start_time||p.time||(p.hour!==undefined?`${p.hour}:00`:null);
  const fromMins=timeToMins(rawStart);if(fromMins===null)return null;
  const rawEnd=p.to||p.end_time;
  const toMins=rawEnd?timeToMins(rawEnd):fromMins+CLASS_DUR;
  return{dayIdx,fromMins,toMins:toMins||fromMins+CLASS_DUR};
}
function analysePrefs(ref){
  const req=rByRef[ref];if(!req)return null;
  const raw=parseDayPrefs(req.slots||req.day_preferences);if(!raw.length)return null;
  const byDay={};
  raw.forEach(p=>{
    const s=parseSlot(p);if(!s)return;
    if(!byDay[s.dayIdx])byDay[s.dayIdx]={dayIdx:s.dayIdx,earliest:s.fromMins,latest:s.toMins};
    else{if(s.fromMins<byDay[s.dayIdx].earliest)byDay[s.dayIdx].earliest=s.fromMins;if(s.toMins>byDay[s.dayIdx].latest)byDay[s.dayIdx].latest=s.toMins;}
  });
  const windows=Object.values(byDay),dayIdxs=windows.map(w=>w.dayIdx);
  return{windows,dayIdxs};
}

/* ══════════════════════════════════════════════
   PAIR ENGINE — ported verbatim from OVERVIEW buildProposals()
   Returns the groups it would form for a level+branch.
   Each group = 1 session if same-day pair, else 2 (A+B).
══════════════════════════════════════════════ */
function buildProposals(levelKey, branch){
  const STEP=30;
  const dept=(levelKey.split('|')[0]||'adults').toLowerCase();
  const all=allE.filter(e=>{
    if(lk(e)!==levelKey)return false;
    if(branch!=='all'&&normB(e.branch)!==branch)return false;
    return true;
  });
  const withReq=all.filter(e=>!!rByRef[e.ref]);

  const studentWindows={};
  withReq.forEach(e=>{
    const a=analysePrefs(e.ref);
    if(!a||!a.windows.length)return;
    studentWindows[e.ref]=a.windows;
  });

  const activePairs=ALM_PAIRS.filter(p=>!(p.examOnly&&dept!=='exam'));
  function coversSlot(windows,dayIdx,startMins){
    return windows.some(w=>w.dayIdx===dayIdx&&w.earliest<=startMins+30&&w.latest>=startMins+CLASS_DUR-30);
  }
  const SLOTS=[];
  for(let t=8*60;t<=20*60-CLASS_DUR;t+=STEP)SLOTS.push(t);

  const freqMap={};
  withReq.forEach(e=>{
    const windows=studentWindows[e.ref];
    if(!windows)return;
    activePairs.forEach((pair,pi)=>{
      SLOTS.forEach(startMins=>{
        const okA=coversSlot(windows,pair.a,startMins);
        const okB=pair.a===pair.b?okA:coversSlot(windows,pair.b,startMins);
        if(!okA||!okB)return;
        const key=`${pi}|${startMins}`;
        if(!freqMap[key])freqMap[key]=new Set();
        freqMap[key].add(e.ref);
      });
    });
  });

  const candidates=Object.entries(freqMap)
    .map(([key,refs])=>({key,refs,count:refs.size}))
    .filter(c=>c.count>=MIN_G)
    .sort((a,b)=>b.count-a.count);

  const placed=new Set();
  const groups=[];
  const studentCandidateCount={};
  candidates.forEach(({refs})=>{refs.forEach(r=>{studentCandidateCount[r]=(studentCandidateCount[r]||0)+1;});});

  candidates.forEach(({key,refs})=>{
    const available=[...refs].filter(r=>!placed.has(r)).sort((a,b)=>(studentCandidateCount[a]||0)-(studentCandidateCount[b]||0));
    if(available.length<MIN_G)return;
    const [piStr]=key.split('|');
    const pi=parseInt(piStr,10);
    const pair=activePairs[pi];
    if(!pair)return;
    const students=available.slice(0,MAX_G);
    students.forEach(r=>placed.add(r));
    const isSameDay=pair.a===pair.b;
    groups.push({ sessions: isSameDay?1:2, n:students.length });
  });

  return groups;
}

/* ══════════════════════════════════════════════
   BOOT — fetch raw inputs + locked rows, recompute proposals
══════════════════════════════════════════════ */
async function boot() {
  try {
    const [enrol, reqs, locked] = await Promise.all([
      sbGet('enrolments', `select=ref,name,branch,lang,family,level_code,level_cefr&academic_year=eq.${encodeURIComponent(AY)}&order=ref`),
      sbGet('timetable_requests', `select=ref,branch,family,level_code,level_cefr,slots,day_preferences,status&academic_year=eq.${encodeURIComponent(AY)}`),
      sbGet('classes', `select=turma_code,group_code,level_code,department,branch,locked,student_refs&academic_year=eq.${encodeURIComponent(AY)}&locked=eq.true`),
    ]);
    allE = enrol||[]; allR = reqs||[]; lockedClasses = locked||[];
    rByRef={}; allR.forEach(r=>{rByRef[r.ref]=r;});
    setConn(true);
    buildBranchStrip();
    render();
    document.getElementById('footer-ts').textContent = 'Actualizado: ' + new Date().toLocaleTimeString('pt-PT');
  } catch(e) {
    setConn(false);
    document.getElementById('cols-row').innerHTML =
      `<div style="margin:auto;color:#B02828;font-size:8px;letter-spacing:.1em">Erro Supabase: ${e.message}</div>`;
  }
}

function setConn(ok) {
  const dot=document.getElementById('live-dot'),lbl=document.getElementById('live-lbl'),pill=document.getElementById('status-pill');
  if(ok){dot.style.background='var(--forest)';lbl.textContent='LIVE';lbl.style.color='var(--forest)';pill.textContent='Supabase OK';pill.className='status-pill sp-ok';}
  else{dot.style.background='#B02828';lbl.textContent='ERRO';lbl.style.color='#B02828';pill.textContent='Erro DB';pill.className='status-pill sp-err';}
}

function buildBranchStrip() {
  const present = BRANCHES.filter(b => allE.some(e => normB(e.branch)===b));
  const strip = document.getElementById('branch-strip');
  const pills =
    `<button class="branch-pill${activeBranch==='FUNCHAL'?' active':''}" onclick="setBranch('FUNCHAL',this)">Funchal</button>` +
    present.filter(b=>b!=='FUNCHAL').map(b=>
      `<button class="branch-pill${activeBranch===b?' active':''}" onclick="setBranch('${b}',this)">${BRANCH_LABELS[b]||b}</button>`
    ).join('') +
    `<button class="branch-pill${activeBranch==='all'?' active':''}" onclick="setBranch('all',this)" style="border-style:dashed">Todas as filiais</button>`;
  strip.innerHTML = pills +
    `<div class="strip-right">
      <div class="leg"><div class="leg-bead" style="width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#6B7A3E,#444f24 75%);border:.5px solid rgba(68,79,36,.6)"></div>Certificada</div>
      <div class="leg"><div class="leg-bead" style="width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c3c8e6,#8088c0 80%);border:.5px solid rgba(122,128,174,.6)"></div>Proposta</div>
      <div class="leg-sep"></div>
      <div class="strip-kv" id="strip-total">—</div>
    </div>`;
}

function setBranch(b, btn) {
  activeBranch = b;
  document.querySelectorAll('.branch-pill').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  render();
}

/* ══════════════════════════════════════════════
   COMPUTE — per level: certified sessions (locked rows) + proposed sessions (engine)
══════════════════════════════════════════════ */
function computeLevel(levelKey, branch){
  // CERTIFIED — from locked rows in DB
  const lockedHere = lockedClasses.filter(c=>{
    const clk=(c.department||'').toLowerCase().trim()+'|'+(c.level_code||'').trim();
    if(clk!==levelKey)return false;
    if(branch!=='all'&&normB(c.branch)!==branch)return false;
    return true;
  });
  const certSessions = lockedHere.length;
  const certGroups = new Set(lockedHere.map(c=>c.group_code||(c.turma_code||'').replace(/[AB]$/i,''))).size;
  const certRefs = new Set();
  lockedHere.forEach(c=>(Array.isArray(c.student_refs)?c.student_refs:[]).forEach(r=>certRefs.add(r)));

  // PROPOSED — recompute via engine, then subtract what's already certified
  const proposedGroups = buildProposals(levelKey, branch);
  let propSessionsTotal = proposedGroups.reduce((n,g)=>n+g.sessions,0);
  // proposed beads = engine sessions NOT yet certified
  const propSessions = Math.max(0, propSessionsTotal - certSessions);

  return { certSessions, certGroups, certRefs:certRefs.size, propSessions, totalSessions: certSessions+propSessions };
}

function render() {
  const branch = activeBranch;
  const stats={};
  let totCert=0, totProp=0, totCertRefs=0, levelsWith=0;

  ALL_LEVELS.forEach(lv=>{
    const s = computeLevel(lv.key, branch);
    stats[lv.key]=s;
    totCert += s.certSessions;
    totProp += s.propSessions;
    totCertRefs += s.certRefs;
    if(s.totalSessions>0) levelsWith++;
  });
  const totSess = totCert + totProp;

  // Enrolment counts per level
  const scopeE = branch==='all' ? allE : allE.filter(e=>normB(e.branch)===branch);
  const enrolMap={}; scopeE.forEach(e=>{const k=lk(e);enrolMap[k]=(enrolMap[k]||0)+1;});
  const enrolTotal = scopeE.length;

  document.getElementById('kpi-total').textContent      = enrolTotal;
  document.getElementById('kpi-cert').textContent       = totCert;
  document.getElementById('kpi-prop').textContent       = totProp;
  document.getElementById('kpi-total-sess').textContent = totSess;
  document.getElementById('kpi-levels').textContent     = levelsWith + '/' + TOTAL_COLS;
  const certPct = totSess>0 ? Math.round(totCert/totSess*100) : 0;
  document.getElementById('cert-bar').style.width = certPct+'%';
  document.getElementById('strip-total').textContent =
    `${enrolTotal} inscritos · ${totCert} cert · ${totProp} prop · ${totSess} sessões`;
  document.getElementById('footer-info').textContent =
    `${levelsWith} de ${TOTAL_COLS} níveis com turma · ${totSess} sessões (${totCert} cert · ${totProp} prop)`;

  // rod height scales to busiest level + 1 spare
  const maxSess = Math.max(...ALL_LEVELS.map(lv => stats[lv.key].totalSessions), 3);
  const TOTAL_SLOTS = maxSess + 1;

  const deptHdr = document.getElementById('dept-headers');
  deptHdr.innerHTML = '';
  DEPTS.forEach(d => {
    const el = document.createElement('div');
    el.className = 'dept-hd';
    el.style.cssText = `width:${d.levels.length/TOTAL_COLS*100}%;color:${d.color}`;
    el.textContent = d.label;
    deptHdr.appendChild(el);
  });

  const colsRow = document.getElementById('cols-row');
  colsRow.innerHTML = '';

  ALL_LEVELS.forEach((lv, ci) => {
    const s = stats[lv.key];
    const enrol = enrolMap[lv.key] || 0;
    const has = s.totalSessions > 0;

    // beads bottom-up: certified first (forest), then proposed (mist), then empty
    const beads = [];
    for(let i=0;i<TOTAL_SLOTS;i++){
      if(i < s.certSessions) beads.push('certified');
      else if(i < s.totalSessions) beads.push('proposed');
      else beads.push('empty');
    }

    const badgeTxt = s.certSessions>0 ? `✓ ${s.certSessions}` : s.propSessions>0 ? `~ ${s.propSessions}` : '—';
    const badgeClr = s.certSessions>0 ? 'var(--forest)' : s.propSessions>0 ? '#7A80AE' : 'var(--ink3)';
    const badgeBg  = s.certSessions>0 ? 'var(--forest-soft)' : s.propSessions>0 ? 'rgba(182,187,217,.22)' : 'var(--mist-soft)';
    const badgeBdr = s.certSessions>0 ? 'var(--forest-mid)' : s.propSessions>0 ? 'rgba(140,146,184,.5)' : 'rgba(182,187,217,.4)';

    const col = document.createElement('div');
    col.className = 'lv-col' + (has ? ' has' : '');
    col.innerHTML = `
      <div class="col-top">
        <div class="col-label${has?' has':''}">${lv.label}</div>
        <div class="col-cert-badge" style="background:${badgeBg};border-color:${badgeBdr};color:${badgeClr}">${badgeTxt}</div>
      </div>
      <div class="rod-wrap">
        <div class="beads-wrap" id="bw-${ci}">
          ${beads.map(cls=>`<div class="bead ${cls}"></div>`).join('')}
        </div>
      </div>
      <div class="col-foot">
        <div class="col-enrol" style="color:${enrol>0?'var(--ink2)':'var(--ink3)'}">${enrol||'—'}</div>
        <div class="col-enrol-lbl">inscr.</div>
      </div>`;
    col.addEventListener('mouseenter', e => showTip(e, {lv, s, enrol}));
    col.addEventListener('mousemove',  moveTip);
    col.addEventListener('mouseleave', hideTip);
    colsRow.appendChild(col);
  });

  requestAnimationFrame(() => adjustBeadHeights(TOTAL_SLOTS));
}

function adjustBeadHeights(slots) {
  const firstWrap = document.querySelector('.beads-wrap');
  if (!firstWrap) return;
  const rodH = firstWrap.parentElement.offsetHeight - 8;
  // Peas are fixed-size; only shrink height/gap if a tall column would overflow the rod
  const beadH = 11, gap = 2;
  const needed = slots * beadH + (slots - 1) * gap;
  if (needed <= rodH) {
    document.querySelectorAll('.bead').forEach(b => { b.style.height = beadH + 'px'; });
    document.querySelectorAll('.beads-wrap').forEach(w => { w.style.gap = gap + 'px'; });
    return;
  }
  // overflow: compress proportionally, floor at 4px so peas never vanish
  let h = Math.floor((rodH - (slots - 1) * 1) / slots);
  h = Math.max(4, Math.min(h, beadH));
  document.querySelectorAll('.bead').forEach(b => { b.style.height = h + 'px'; });
  document.querySelectorAll('.beads-wrap').forEach(w => { w.style.gap = '1px'; });
}

function showTip(e, data) {
  const tip = document.getElementById('tip');
  const {lv, s, enrol} = data;
  let body = `Inscritos: <strong>${enrol}</strong><br>`;
  if(s.certSessions>0) body += `<span class="tip-cert">● ${s.certSessions} sessão${s.certSessions!==1?'ões':''} certificada${s.certSessions!==1?'s':''}</span><br>`;
  if(s.propSessions>0) body += `<span class="tip-prop">● ${s.propSessions} sessão${s.propSessions!==1?'ões':''} proposta${s.propSessions!==1?'s':''}</span><br>`;
  if(s.totalSessions===0) body += `<span style="color:var(--ink3)">Sem turmas</span>`;
  else body += `<span style="color:var(--ink3)">${s.totalSessions} sessões totais</span>`;
  tip.innerHTML = `<div class="tip-title">${lv.dept.label} · ${lv.label}</div>${body}`;
  tip.style.display = 'block';
  moveTip(e);
}
function moveTip(e) {
  const tip = document.getElementById('tip');
  const x = e.clientX + 16, y = e.clientY - 8;
  tip.style.left = Math.min(x, window.innerWidth - tip.offsetWidth - 10) + 'px';
  tip.style.top  = Math.max(8, Math.min(y, window.innerHeight - tip.offsetHeight - 8)) + 'px';
}
function hideTip(){ document.getElementById('tip').style.display = 'none'; }

window.addEventListener('resize', () => {
  const slots = document.querySelectorAll('#bw-0 .bead').length;
  if(slots>0) adjustBeadHeights(slots);
});

boot();
setInterval(boot, 60000);
</script>
