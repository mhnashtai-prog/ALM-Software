<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ALM · Turmas Certificadas</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9A84C;--gold2:#E8C97A;--gold3:rgba(201,168,76,.15);
  --green:#1DB87A;--green-a:rgba(29,184,122,.14);--green-b:rgba(29,184,122,.35);
  --red:#E8455A;--amber:#E8A020;
  --blue:#4A8FF5;--teal:#28C8B0;--purple:#9B5ECA;
  --bg:#07060E;--bg2:#0E0B1A;--bg3:#141025;
  --b:rgba(201,168,76,.08);--b2:rgba(201,168,76,.18);--b3:rgba(201,168,76,.32);
  --t:rgba(238,218,168,.92);--t2:rgba(210,188,140,.55);--t3:rgba(210,188,140,.28);--t4:rgba(210,188,140,.10);
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;--display:'Bebas Neue',sans-serif;
  --c-inf:#6AABFF;--c-juv:#3DE8A8;--c-ger:#C8A44A;--c-exa:#C080F0;
  --h-hdr:52px;
  --h-branch:34px;
  --h-kpi:52px;
  --h-foot:26px;
}
html,body{
  height:100dvh;width:100vw;
  background:var(--bg);color:var(--t);
  font-family:var(--mono);font-size:12px;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
body{display:flex;flex-direction:column}

body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(201,168,76,.018) 39px,rgba(201,168,76,.018) 40px),
    repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(201,168,76,.018) 39px,rgba(201,168,76,.018) 40px);
}

/* ── HEADER ── */
.card-hdr{
  flex-shrink:0;height:var(--h-hdr);
  display:flex;align-items:center;gap:12px;
  padding:0 18px;
  border-bottom:1px solid var(--b2);
  background:rgba(7,6,14,.96);
  position:relative;z-index:10;
  border-top:2px solid var(--gold);
}
.hdr-brand{font-family:var(--display);font-size:24px;letter-spacing:7px;color:var(--gold2);line-height:1}
.hdr-yr{font-size:7px;color:var(--t3);letter-spacing:.14em;align-self:flex-end;padding-bottom:3px}
.hdr-div{width:1px;height:20px;background:var(--b2)}
.hdr-title{font-size:8.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--t2)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:7px}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.live-lbl{font-size:7px;font-weight:700;letter-spacing:.1em;color:var(--green)}
.status-pill{font-size:7px;font-weight:600;letter-spacing:.06em;padding:2px 9px;border-radius:999px;border:1px solid;white-space:nowrap}
.sp-load{border-color:rgba(201,168,76,.3);color:var(--gold2);background:rgba(201,168,76,.06)}
.sp-ok{border-color:var(--green-b);color:var(--green);background:var(--green-a)}
.sp-err{border-color:rgba(232,69,90,.3);color:var(--red);background:rgba(232,69,90,.08)}

/* ── WAX SEAL ── */
.wax-seal-wrap{
  display:flex;align-items:center;justify-content:center;
  width:44px;height:44px;
  flex-shrink:0;
  filter:drop-shadow(0 2px 6px rgba(180,20,20,.45));
  transition:transform .15s, filter .15s;
  cursor:default;
}
.wax-seal-wrap:hover{
  transform:scale(1.08) rotate(-3deg);
  filter:drop-shadow(0 4px 12px rgba(200,30,30,.6));
}

/* ── BRANCH STRIP ── */
.branch-strip{
  flex-shrink:0;height:var(--h-branch);
  display:flex;align-items:center;gap:4px;
  padding:0 18px;
  border-bottom:1px solid var(--b);
  background:rgba(0,0,0,.18);
  position:relative;z-index:10;
}
.branch-pill{
  font-size:7px;font-weight:600;letter-spacing:.06em;
  padding:2px 9px;border:1px solid var(--b);border-radius:999px;
  cursor:pointer;color:var(--t3);background:transparent;
  font-family:var(--mono);transition:all .14s;
}
.branch-pill:hover{color:var(--t2);border-color:var(--b2)}
.branch-pill.active{background:var(--gold3);border-color:var(--gold);color:var(--gold2)}
.strip-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.strip-kv{font-size:7px;color:var(--t3);white-space:nowrap}
.strip-kv strong{color:var(--t2)}
.leg{display:flex;align-items:center;gap:3px;font-size:6.5px;color:var(--t3)}
.leg-bead{width:13px;height:6px;border-radius:2px}
.leg-sep{width:1px;height:12px;background:var(--b);margin:0 4px}

/* ── KPI ROW ── */
.kpi-row{
  flex-shrink:0;height:var(--h-kpi);
  display:flex;align-items:stretch;
  border-bottom:1px solid var(--b);
  background:rgba(0,0,0,.12);
  position:relative;z-index:10;
}
.kpi{flex:1;padding:8px 14px;border-left:1px solid var(--b);display:flex;flex-direction:column;justify-content:center}
.kpi:first-child{border-left:none}
.kpi-v{font-size:20px;font-weight:700;line-height:1}
.kpi-l{font-size:6px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-top:2px}
.kpi-bar{height:2px;background:rgba(255,255,255,.04);margin-top:5px;border-radius:1px;overflow:hidden}
.kpi-bar-fill{height:100%;border-radius:1px;transition:width .9s cubic-bezier(.4,0,.2,1)}

/* ── ABACUS AREA ── */
.abacus-area{
  flex:1;display:flex;flex-direction:column;
  overflow:hidden;position:relative;z-index:1;min-height:0;
}
.dept-headers{flex-shrink:0;display:flex;border-bottom:1px solid var(--b);background:rgba(0,0,0,.25)}
.dept-hd{
  display:flex;align-items:center;justify-content:center;
  padding:4px 6px;
  font-size:6px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  border-right:1px solid;
}
.dept-hd:last-child{border-right:none}
.cols-row{flex:1;display:flex;min-height:0;overflow:hidden}
.lv-col{
  flex:1;display:flex;flex-direction:column;align-items:center;
  border-right:1px solid var(--b);position:relative;
  cursor:pointer;transition:background .14s;min-width:0;overflow:hidden;
}
.lv-col:last-child{border-right:none}
.lv-col:hover{background:rgba(201,168,76,.028)}
.lv-col::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;opacity:.45}
.col-top{
  flex-shrink:0;width:100%;padding:5px 3px 4px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  border-bottom:.5px solid var(--b);background:rgba(0,0,0,.3);
}
.col-label{
  font-family:var(--display);font-size:13px;letter-spacing:2px;
  line-height:1;text-align:center;white-space:nowrap;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;
}
.col-cert-badge{
  font-size:6px;font-weight:700;letter-spacing:.05em;
  padding:1px 5px;border-radius:999px;border:1px solid;white-space:nowrap;
}
.rod-wrap{
  flex:1;display:flex;flex-direction:column;align-items:center;
  position:relative;width:100%;padding:5px 0 3px;min-height:0;overflow:hidden;
}
.rod-wrap::before{
  content:'';position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);
  width:1.5px;
  background:linear-gradient(to bottom,transparent,rgba(201,168,76,.18) 20%,rgba(201,168,76,.18) 80%,transparent);
}
.beads-wrap{
  display:flex;flex-direction:column-reverse;align-items:center;
  gap:2px;width:100%;padding:0 4px;
  position:relative;z-index:1;flex:1;justify-content:flex-start;
}
.bead{
  width:min(calc(100% - 4px), 46px);
  border-radius:40% / 35%;flex-shrink:0;position:relative;transition:transform .12s;
}
.bead:hover{transform:scaleX(1.06)}
.bead.certified{
  background:linear-gradient(160deg,rgba(46,220,140,.9) 0%,rgba(20,160,90,.85) 100%);
  border:1px solid rgba(29,184,122,.55);
  box-shadow:0 1px 5px rgba(29,184,122,.28), inset 0 1px 0 rgba(255,255,255,.18);
}
.bead.certified::after{
  content:'';position:absolute;top:18%;left:18%;
  width:40%;height:28%;border-radius:50%;background:rgba(255,255,255,.2);
}
.bead.session{background:rgba(74,143,245,.2);border:1px solid rgba(74,143,245,.38);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.bead.empty{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.045)}
.col-foot{
  flex-shrink:0;width:100%;padding:3px 3px 4px;
  display:flex;flex-direction:column;align-items:center;gap:1px;
  border-top:.5px solid var(--b);background:rgba(0,0,0,.25);
}
.col-enrol{font-size:8px;font-weight:700;line-height:1}
.col-enrol-lbl{font-size:5px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}

/* ── FOOTER ── */
.card-footer{
  flex-shrink:0;height:var(--h-foot);
  display:flex;align-items:center;gap:10px;
  padding:0 18px;border-top:1px solid var(--b);
  background:rgba(0,0,0,.3);font-size:6.5px;color:var(--t3);letter-spacing:.07em;
  position:relative;z-index:10;
}
.footer-ts{margin-left:auto;font-size:6px;color:var(--t4)}

/* ── SPINNER ── */
.spinner{width:14px;height:14px;border:1.5px solid rgba(255,255,255,.07);border-top-color:var(--gold);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── TOOLTIP ── */
.tip{
  position:fixed;background:rgba(7,6,14,.97);border:1px solid var(--b2);
  padding:9px 13px;font-size:8px;line-height:1.8;color:var(--t2);
  pointer-events:none;z-index:9999;white-space:nowrap;
  box-shadow:0 8px 32px rgba(0,0,0,.65);display:none;
}
.tip-title{font-size:10px;font-weight:700;color:var(--gold2);margin-bottom:4px;letter-spacing:.04em}
.tip-cert{color:var(--green);font-weight:700}
.tip-sess{color:var(--blue)}
.tip-warn{color:var(--amber)}
</style>
</head>
<body>

<!-- HEADER -->
<div class="card-hdr">
  <span class="hdr-brand">ALM</span>
  <span class="hdr-yr">2026/27</span>

    ]
  },
  { key:'exam',     label:'Exames',   color:'#C080F0', borderColor:'rgba(192,128,240,.25)',
    levels:[
      {key:'exam|6', label:'Ano 6', lc:'FCE'},
      {key:'exam|7', label:'Ano 7', lc:'CAE'},
      {key:'exam|8', label:'Ano 8', lc:'CPE'},
    ]
  },
];

const ALL_LEVELS = DEPTS.flatMap(d => d.levels.map(lv => ({...lv, dept:d})));
const TOTAL_COLS = ALL_LEVELS.length;
const BRANCHES = ['FUNCHAL','CAMARA_LOBOS','SANTA_CRUZ','MACHICO','RIBEIRA_BRAVA','CALHETA'];
const BL = {FUNCHAL:'Funchal',CAMARA_LOBOS:'C. Lobos',SANTA_CRUZ:'S. Cruz',MACHICO:'Machico',RIBEIRA_BRAVA:'R. Brava',CALHETA:'Calheta'};

let activeBranch = 'FUNCHAL';
let allClasses = [], allEnrols = [];

async function sbGet(table, qs) {
  let all=[], page=0, ps=1000;
  while(true){
    const s=page*ps, e=s+ps-1;
    const r=await fetch(`${SB}/rest/v1/${table}?${qs}`,{headers:{...H,Range:`${s}-${e}`,Prefer:'count=none'}});
    if(!r.ok) throw new Error(`${table} HTTP ${r.status}`);
    const d=await r.json(); all=all.concat(d);
    if(d.length<ps)break; page++; if(page>9)break;
  }
  return all;
}

const normB = b => (b||'').toUpperCase().replace(/[\s\-]+/g,'_').replace(/_+/g,'_').trim();

async function boot() {
  try {
    const [classes, enrols] = await Promise.all([
      sbGet('classes',    `select=turma_code,group_code,level_code,department,branch,locked,student_refs&academic_year=eq.${encodeURIComponent(AY)}`),
      sbGet('enrolments', `select=ref,branch,family,level_code&academic_year=eq.${encodeURIComponent(AY)}`),
    ]);
    allClasses = classes || [];
    allEnrols  = enrols  || [];
    setConn(true);
    buildBranchStrip();
    render();
    document.getElementById('footer-ts').textContent = 'Actualizado: ' + new Date().toLocaleTimeString('pt-PT');
  } catch(e) {
    setConn(false);
    document.getElementById('cols-row').innerHTML =
      `<div style="margin:auto;color:#E8455A;font-size:8px;letter-spacing:.1em">Erro Supabase: ${e.message}</div>`;
  }
}

function setConn(ok) {
  const dot=document.getElementById('live-dot'),lbl=document.getElementById('live-lbl'),pill=document.getElementById('status-pill');
  if(ok){dot.style.background='#1DB87A';lbl.textContent='LIVE';lbl.style.color='#1DB87A';pill.textContent='Supabase OK';pill.className='status-pill sp-ok';}
  else{dot.style.background='#E8455A';lbl.textContent='ERRO';lbl.style.color='#E8455A';pill.textContent='Erro DB';pill.className='status-pill sp-err';}
}

function buildBranchStrip() {
  const present = BRANCHES.filter(b => allEnrols.some(e => normB(e.branch)===b));
  const strip = document.getElementById('branch-strip');
  const pills =
    `<button class="branch-pill${activeBranch==='FUNCHAL'?' active':''}" onclick="setBranch('FUNCHAL',this)">Funchal</button>` +
    present.filter(b=>b!=='FUNCHAL').map(b=>
      `<button class="branch-pill${activeBranch===b?' active':''}" onclick="setBranch('${b}',this)">${BL[b]||b}</button>`
    ).join('') +
    `<button class="branch-pill${activeBranch==='all'?' active':''}" onclick="setBranch('all',this)" style="border-style:dashed">Todas as filiais</button>`;
  strip.innerHTML = pills +
    `<div class="strip-right">
      <div class="leg"><div class="leg-bead" style="background:var(--green);border:1px solid var(--green-b)"></div>Certificada</div>
      <div class="leg"><div class="leg-bead" style="background:rgba(74,143,245,.25);border:1px solid rgba(74,143,245,.4)"></div>Por cert.</div>
      <div class="leg"><div class="leg-bead" style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)"></div>Sem sessão</div>
      <div class="leg-sep"></div>
      <div class="strip-kv" id="strip-total">—</div>
    </div>`;
}

function setBranch(b, btn) {
  activeBranch = b;
  document.querySelectorAll('.branch-pill').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function computeMaps() {
  const classes = activeBranch==='all' ? allClasses : allClasses.filter(c=>normB(c.branch)===activeBranch);
  const enrols  = activeBranch==='all' ? allEnrols  : allEnrols.filter(e=>normB(e.branch)===activeBranch);
  const sessMap={}, certMap={}, groupMap={}, enrolMap={};
  classes.forEach(c => {
    const dept=(c.department||'').toLowerCase().trim();
    const lc=(c.level_code||'').trim();
    const lk=dept+'|'+lc;
    sessMap[lk]=(sessMap[lk]||0)+1;
    if(c.locked) certMap[lk]=(certMap[lk]||0)+1;
    const gc=c.group_code||(c.turma_code||'').replace(/[AB]$/i,'');
    if(gc){if(!groupMap[lk])groupMap[lk]=new Set();groupMap[lk].add(gc);}
  });
  enrols.forEach(e=>{
    const dept=(e.family||'').toLowerCase().trim();
    const lc=(e.level_code||'').trim();
    const lk=dept+'|'+lc;
    enrolMap[lk]=(enrolMap[lk]||0)+1;
  });
  return {sessMap,certMap,groupMap,enrolMap,enrolTotal:enrols.length};
}

function render() {
  const {sessMap,certMap,groupMap,enrolMap,enrolTotal} = computeMaps();
  let totSess=0,totCert=0,totGroups=0;
  Object.values(sessMap).forEach(n=>totSess+=n);
  Object.values(certMap).forEach(n=>totCert+=n);
  Object.values(groupMap).forEach(s=>totGroups+=s.size);
  const pct = totSess>0 ? Math.round(totCert/totSess*100) : 0;
  document.getElementById('kpi-total').textContent    = enrolTotal;
  document.getElementById('kpi-groups').textContent   = totGroups;
  document.getElementById('kpi-sessions').textContent = totSess;
  document.getElementById('kpi-cert').textContent     = totCert;
  document.getElementById('kpi-pend').textContent     = totSess-totCert;
  document.getElementById('cert-bar').style.width     = pct+'%';
  document.getElementById('strip-total').textContent  = `${enrolTotal} inscritos · ${totSess} sessões · ${totCert} cert.`;
  document.getElementById('footer-info').textContent  = `${TOTAL_COLS} níveis · ${totGroups} grupos · ${totCert} sessões certificadas`;
  const maxSess = Math.max(...ALL_LEVELS.map(lv=>sessMap[lv.key]||0), 1);
  const TOTAL_SLOTS = Math.min(MAX_BEADS, Math.max(maxSess+1, 4));
  const deptHdr = document.getElementById('dept-headers');
  deptHdr.innerHTML = '';
  DEPTS.forEach(d => {
    const p = d.levels.length / TOTAL_COLS * 100;
    const el = document.createElement('div');
    el.className = 'dept-hd';
    el.style.cssText = `width:${p}%;color:${d.color};border-color:${d.borderColor};background:rgba(0,0,0,.18)`;
    el.textContent = d.label;
    deptHdr.appendChild(el);
  });
  const colsRow = document.getElementById('cols-row');
  colsRow.innerHTML = '';
  ALL_LEVELS.forEach((lv, ci) => {
    const sess  = sessMap[lv.key]  || 0;
    const cert  = certMap[lv.key]  || 0;
    const grps  = groupMap[lv.key]?.size || 0;
    const enrol = enrolMap[lv.key] || 0;
    const pend  = sess - cert;
    const dept  = lv.dept;
    const beads = [];
    for(let i=0; i<TOTAL_SLOTS; i++){
      let cls;
      if(i < cert)      cls = 'certified';
      else if(i < sess) cls = 'session';
      else              cls = 'empty';
      beads.push(cls);
    }
    const badgeBg  = cert>0 ? 'rgba(29,184,122,.15)' : 'rgba(255,255,255,.04)';
    const badgeBdr = cert>0 ? 'rgba(29,184,122,.4)'  : 'rgba(255,255,255,.08)';
    const badgeClr = cert>0 ? 'var(--green)'          : 'var(--t3)';
    const badgeTxt = cert>0 ? `✓ ${cert}` : sess>0 ? `${sess}` : '—';
    const col = document.createElement('div');
    col.className = 'lv-col';
    col.innerHTML = `
      <div class="col-top">
        <div class="col-label" style="color:${sess>0?dept.color:'var(--t3)'}">${lv.lc||lv.label}</div>
        <div class="col-cert-badge" style="background:${badgeBg};border-color:${badgeBdr};color:${badgeClr}">${badgeTxt}</div>
      </div>
      <div class="rod-wrap">
        <div class="beads-wrap" id="bw-${ci}">
          ${beads.map((cls,bi)=>`<div class="bead ${cls}" style="animation-delay:${bi*30}ms"></div>`).join('')}
        </div>
      </div>
      <div class="col-foot">
        <div class="col-enrol" style="color:${enrol>0?dept.color:'var(--t3)'}">${enrol||'—'}</div>
        <div class="col-enrol-lbl">inscr.</div>
      </div>
    `;
    col.style.borderLeft = `2px solid ${dept.color}44`;
    col.addEventListener('mouseenter', e => showTip(e, {lv, dept, sess, cert, pend, grps, enrol}));
    col.addEventListener('mousemove',  moveTip);
    col.addEventListener('mouseleave', hideTip);
    colsRow.appendChild(col);
  });
  requestAnimationFrame(() => adjustBeadHeights(TOTAL_SLOTS));
}

function adjustBeadHeights(slots) {
  const firstWrap = document.querySelector('.beads-wrap');
  if (!firstWrap) return;
  const rodH = firstWrap.parentElement.offsetHeight;
  const available = rodH - 8;
  let h = Math.floor((available - (slots-1)*2) / slots);
  h = Math.max(5, Math.min(h, 22));
  document.querySelectorAll('.bead').forEach(b => { b.style.height = h + 'px'; });
}

let _tipData = null;
function showTip(e, data) {
  _tipData = data;
  const tip = document.getElementById('tip');
  const {lv,dept,sess,cert,pend,grps,enrol} = data;
  tip.innerHTML = `
    <div class="tip-title">${dept.label} · ${lv.label}</div>
    Inscritos: ${enrol}<br>
    Grupos únicos: <strong>${grps}</strong><br>
    <span class="tip-sess">Sessões criadas: ${sess}</span><br>
    <span class="tip-cert">Certificadas: ${cert}</span><br>
    ${pend>0?`<span class="tip-warn">Por certificar: ${pend}</span>`:'<span style="color:var(--green)">Tudo certificado ✓</span>'}
  `;
  tip.style.display = 'block';
  moveTip(e);
}
function moveTip(e) {
  const tip = document.getElementById('tip');
  const x = e.clientX+16, y = e.clientY-8;
  tip.style.left = Math.min(x, window.innerWidth-tip.offsetWidth-10)+'px';
  tip.style.top  = Math.max(8, Math.min(y, window.innerHeight-tip.offsetHeight-8))+'px';
}
function hideTip() { document.getElementById('tip').style.display='none'; }

window.addEventListener('resize', () => {
  const slots = document.querySelectorAll('#bw-0 .bead').length;
  if(slots>0) adjustBeadHeights(slots);
});

boot();
setInterval(boot, 60000);
</script>
</body>
</html>
