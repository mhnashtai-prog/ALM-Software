<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ALM · Formação de Turmas · 2026/2027</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#07060E;--bg2:#0D0B1A;--bg3:#131120;
  --gold:#C9A84C;--gold2:#E8C97A;--gold3:rgba(201,168,76,.15);--gold4:rgba(201,168,76,.06);
  --green:#1DB87A;--green-a:rgba(29,184,122,.14);--green-b:rgba(29,184,122,.3);
  --red:#E8455A;--red-a:rgba(232,69,90,.12);--red-b:rgba(232,69,90,.3);
  --amber:#E8A020;--amber-a:rgba(232,160,32,.13);--amber-b:rgba(232,160,32,.3);
  --teal:#28C8B0;--blue:#4A8FF5;--purple:#9B5ECA;
  --seam:rgba(201,168,76,.08);--seam2:rgba(201,168,76,.18);--seam3:rgba(201,168,76,.32);
  --ink:rgba(238,218,168,.92);--ink2:rgba(210,188,140,.55);--ink3:rgba(210,188,140,.28);--ink4:rgba(210,188,140,.10);
  --mono:'IBM Plex Mono',monospace;--sans:'DM Sans',system-ui,sans-serif;
  --c-inf:#4A8FF5;--c-juv:#28C8B0;--c-ger:#C8A44A;--c-exa:#9B5ECA;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:13px;background:var(--bg);color:var(--ink);font-family:var(--mono);-webkit-font-smoothing:antialiased}
body{min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══ LOADING ══ */
.lo{position:fixed;inset:0;z-index:9000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s}
.lo.done{opacity:0;pointer-events:none}
.lo-mark{font-size:52px;font-weight:700;letter-spacing:18px;color:var(--gold2);opacity:.18}
.lo-bar{width:180px;height:1px;background:rgba(255,255,255,.06)}
.lo-fill{height:100%;background:var(--gold);width:0%;transition:width .3s ease}
.lo-txt{font-size:8px;letter-spacing:.18em;color:var(--ink3);text-transform:uppercase}

/* ══ TOPBAR ══ */
.top{flex-shrink:0;height:48px;display:flex;align-items:center;background:rgba(7,6,14,.98);border-bottom:1px solid var(--seam2);position:sticky;top:0;z-index:600}
.top-brand{display:flex;align-items:baseline;gap:8px;padding:0 18px;height:100%;border-right:1px solid var(--seam)}
.brand-alm{font-size:16px;font-weight:700;letter-spacing:8px;color:var(--gold2)}
.brand-yr{font-size:7px;color:var(--ink3);letter-spacing:.12em}
.top-steps{display:flex;height:100%;border-right:1px solid var(--seam)}
.step{display:flex;align-items:center;gap:7px;height:100%;padding:0 14px;font-size:8px;font-weight:600;letter-spacing:.06em;border-right:1px solid var(--seam);color:var(--ink3);text-decoration:none;transition:background .12s;white-space:nowrap;cursor:pointer}
.step:hover{background:var(--gold4)}.step.active{color:var(--gold2);background:var(--gold4);border-bottom:2px solid var(--gold)}
.step-n{width:15px;height:15px;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;border:1px solid currentColor;flex-shrink:0}
.step.active .step-n{background:var(--gold);color:#000;border-color:var(--gold)}
.top-right{display:flex;align-items:center;gap:8px;margin-left:auto;padding:0 14px;border-left:1px solid var(--seam);height:100%}
.sb-pill{display:flex;align-items:center;gap:5px;padding:3px 9px;border:1px solid;font-size:7.5px;font-weight:500}
.sb-pill.ok{background:var(--green-a);border-color:var(--green-b);color:var(--green)}
.sb-pill.load{background:var(--amber-a);border-color:var(--amber-b);color:var(--amber)}
.sb-pill.err{background:var(--red-a);border-color:var(--red-b);color:var(--red)}
.sb-dot{width:5px;height:5px;flex-shrink:0;border-radius:50%}
.sb-pill.ok .sb-dot{background:var(--green);animation:blink 2s infinite}
.sb-pill.load .sb-dot{background:var(--amber);animation:blink .8s infinite}
.sb-pill.err .sb-dot{background:var(--red)}
.top-kpi{font-size:9px;font-weight:700;padding:3px 10px;border:1px solid var(--seam);color:var(--ink2)}
.top-kpi span{color:var(--gold2)}

/* ══ SHELL ══ */
.shell{flex:1;display:flex;overflow:hidden;height:calc(100dvh - 48px)}

/* ══ LEFT SIDEBAR ══ */
.sidebar{width:260px;flex-shrink:0;border-right:1px solid var(--seam2);display:flex;flex-direction:column;overflow:hidden}
.sb-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--seam);border-bottom:1px solid var(--seam2);flex-shrink:0}
.sb-stat{padding:10px 8px;background:var(--bg)}
.sb-stat-v{font-size:18px;font-weight:700;line-height:1}
.sb-stat-l{font-size:6px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-top:3px}
.loc-tabs{display:flex;flex-wrap:wrap;gap:3px;padding:8px 8px 6px;border-bottom:1px solid var(--seam);flex-shrink:0}
.loc-tab{font-size:7px;font-weight:600;letter-spacing:.06em;padding:3px 8px;border:1px solid var(--seam);cursor:pointer;color:var(--ink3);transition:all .13s;background:transparent}
.loc-tab:hover{color:var(--ink2);border-color:var(--seam2)}
.loc-tab.on{background:var(--gold3);border-color:var(--gold);color:var(--gold2)}
.tree{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--seam) transparent}
.dept-block{border-bottom:1px solid var(--seam)}
.dept-hdr{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;user-select:none;transition:background .12s}
.dept-hdr:hover{background:rgba(255,255,255,.015)}
.dept-bar{width:3px;height:13px;flex-shrink:0}
.dept-name{font-size:7.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;flex:1}
.dept-n{font-size:8px;color:var(--ink3)}
.dept-arrow{font-size:7px;color:var(--ink3);transition:transform .18s}
.dept-arrow.open{transform:rotate(90deg)}
.lv-list{display:none}.lv-list.open{display:block}
.lv-item{display:flex;align-items:center;gap:7px;padding:6px 10px 6px 20px;cursor:pointer;border-left:2px solid transparent;transition:all .12s}
.lv-item:hover{background:rgba(255,255,255,.02)}
.lv-item.on{background:var(--gold4);border-left-color:var(--gold)}
.lv-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.lv-name{font-size:9px;font-weight:600;flex:1}
.lv-n{font-size:7.5px;color:var(--ink3);min-width:26px;text-align:right}
.lv-badge{font-size:6px;font-weight:700;padding:1px 5px;border:1px solid;flex-shrink:0}
.badge-ok{background:var(--green-a);border-color:var(--green-b);color:var(--green)}
.badge-warn{background:var(--amber-a);border-color:var(--amber-b);color:var(--amber)}
.badge-err{background:var(--red-a);border-color:var(--red-b);color:var(--red)}

/* ══ MAIN CONTENT ══ */
.main{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 20px 60px;scrollbar-width:thin;scrollbar-color:var(--seam) transparent}
.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60%;color:var(--ink3);gap:10px}
.placeholder-icon{font-size:28px;opacity:.2}
.placeholder-text{font-size:8px;letter-spacing:.16em;text-transform:uppercase;opacity:.45}
.sec{font-size:7px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sec::after{content:'';flex:1;height:.5px;background:var(--seam2)}

/* ══ LEVEL SUMMARY ══ */
.level-banner{background:var(--bg2);border:1px solid var(--seam2);padding:14px 16px;margin-bottom:14px;display:flex;gap:20px;flex-wrap:wrap;align-items:flex-end;animation:fadeIn .2s ease}
.ls-stat{display:flex;flex-direction:column;gap:2px}
.ls-v{font-size:26px;font-weight:700;line-height:1}
.ls-l{font-size:6.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.cap-bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;min-width:120px}
.cap-track{height:3px;background:rgba(255,255,255,.05);overflow:hidden}
.cap-fill{height:100%;transition:width .6s}
.cap-lbl{font-size:6.5px;color:var(--ink3)}

/* ══ TIMETABLE GRID ══ */
.tt-wrap{background:var(--bg2);border:1px solid var(--seam2);margin-bottom:14px;overflow:hidden;animation:fadeIn .22s ease .04s both}
.tt-header{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--seam);background:rgba(0,0,0,.2)}
.tt-title{font-size:7.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.tt-meta{font-size:7.5px;color:var(--ink3);margin-left:auto}
.tt-legend{display:flex;gap:14px;align-items:center}
.tt-leg-item{display:flex;align-items:center;gap:4px;font-size:7px;color:var(--ink3)}
.tt-leg-swatch{width:9px;height:9px;border-radius:1px}
.tt-controls{display:flex;gap:4px;padding:8px 14px;border-bottom:1px solid var(--seam);background:rgba(0,0,0,.1);flex-wrap:wrap;align-items:center}
.tt-ctrl-lbl{font-size:7px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-right:4px}
.tt-btn{font-size:7.5px;font-weight:600;padding:3px 10px;border:1px solid var(--seam);cursor:pointer;color:var(--ink3);background:transparent;transition:all .12s;letter-spacing:.04em}
.tt-btn:hover{border-color:var(--seam2);color:var(--ink2)}
.tt-btn.on{background:var(--gold3);border-color:var(--gold);color:var(--gold2)}
.tt-pair-pill{display:flex;align-items:center;gap:4px;padding:2px 8px;border:1px solid;font-size:7px;font-weight:700;cursor:pointer;transition:all .12s}
.tt-pair-pill:hover{opacity:.8}
.tt-pair-pill.dim{opacity:.3}
.tt-grid-outer{overflow-x:auto;padding:12px 14px 14px}
.tt-grid{display:grid;gap:0;width:max-content}
.tt-col-hdr{font-size:7px;font-weight:700;color:var(--ink3);text-align:center;padding:3px 0;letter-spacing:.04em}
.tt-row-lbl{font-size:8px;font-weight:700;color:var(--gold2);display:flex;align-items:center;justify-content:flex-end;padding-right:10px;white-space:nowrap}
.tt-cell{width:44px;height:40px;border:.5px solid rgba(255,255,255,.04);position:relative;cursor:default;transition:all .15s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.tt-cell:hover{border-color:rgba(255,255,255,.12);z-index:5}
.tt-cell.gap-col{width:10px;background:transparent;border:none}
.tt-cell-n{font-size:13px;font-weight:700;line-height:1}
.tt-cell-sub{font-size:6px;color:rgba(255,255,255,.4);letter-spacing:.06em}
.tt-cell.empty{background:rgba(255,255,255,.01)}
/* cell coloring by count */
.tt-cell.c0{background:rgba(255,255,255,.02)}
.tt-cell.c1{background:rgba(74,143,245,.08)}
.tt-cell.c2{background:rgba(74,143,245,.14)}
.tt-cell.c3{background:rgba(232,160,32,.12)}
.tt-cell.c4{background:rgba(232,160,32,.2)}
.tt-cell.c5{background:rgba(29,184,122,.14)}
.tt-cell.c6{background:rgba(29,184,122,.22)}
.tt-cell.c7{background:rgba(29,184,122,.32)}
/* pair highlight */
.tt-cell.pair-hi{outline:1.5px solid var(--gold);outline-offset:-1px;z-index:3}
.tt-cell.pair-dim{opacity:.25}
/* block separator */
.tt-block-sep{width:8px}
.tt-day-sep{height:4px}
/* pair matrix below grid */
.pair-matrix{padding:10px 14px;border-top:1px solid var(--seam);display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.pm-card{padding:9px 11px;border:1px solid;position:relative;cursor:pointer;transition:all .15s}
.pm-card:hover{opacity:.85}
.pm-card.viable{background:var(--green-a);border-color:var(--green-b)}
.pm-card.wait{background:var(--amber-a);border-color:var(--amber-b)}
.pm-card.low{background:var(--red-a);border-color:var(--red-b)}
.pm-pair{font-size:9px;font-weight:700;margin-bottom:3px}
.pm-card.viable .pm-pair{color:var(--green)}
.pm-card.wait .pm-pair{color:var(--amber)}
.pm-card.low .pm-pair{color:var(--red)}
.pm-block{font-size:7px;color:var(--ink3);margin-bottom:4px}
.pm-count{font-size:24px;font-weight:700;line-height:1}
.pm-card.viable .pm-count{color:var(--green)}
.pm-card.wait .pm-count{color:var(--amber)}
.pm-card.low .pm-count{color:var(--red)}
.pm-lbl{font-size:7px;margin-top:2px}
.pm-card.viable .pm-lbl{color:var(--green)}.pm-card.wait .pm-lbl{color:var(--amber)}.pm-card.low .pm-lbl{color:var(--red)}
.pm-icon{position:absolute;top:8px;right:10px;font-size:12px}

/* ══ GROUP PROPOSALS ══ */
.group-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-bottom:14px}
.gcard{background:rgba(8,7,15,.97);border:1px solid var(--seam);position:relative;overflow:hidden;transition:border-color .2s}
.gcard:hover{border-color:var(--seam2)}
.gcard.approved{border-color:rgba(29,184,122,.3);background:rgba(29,184,122,.03)}
.gcard.low{border-color:var(--red-b)}
.gc-strip{height:2px;width:100%}
.gc-face{padding:12px 12px 8px;display:flex;justify-content:space-between;align-items:flex-start}
.gc-left{}
.gc-level{font-size:15px;font-weight:700;line-height:1}
.gc-branch{font-size:8px;color:var(--ink3);margin-top:2px}
.gc-slot{font-size:9px;margin-top:6px;font-weight:600}
.gc-block{font-size:7px;color:var(--ink3);margin-top:1px}
.gc-count{font-size:34px;font-weight:700;line-height:1;text-align:right}
.gc-count-lbl{font-size:7px;color:var(--ink3);text-align:right}
.gc-actions{display:flex;border-top:1px solid var(--seam);background:rgba(0,0,0,.15)}
.gc-action{flex:1;padding:7px 6px;font-size:7.5px;font-weight:700;letter-spacing:.06em;cursor:pointer;color:var(--ink3);border:none;background:transparent;transition:all .12s;text-align:center;border-right:1px solid var(--seam)}
.gc-action:last-child{border-right:none}
.gc-action:hover{background:var(--gold4);color:var(--gold2)}
.gc-action.approve-btn:hover{background:var(--green-a);color:var(--green)}
.gc-action.approved-btn{color:var(--green)}
.gc-action.approved-btn:hover{background:var(--red-a);color:var(--red)}
/* student list inside card */
.gc-students{display:none;border-top:1px solid var(--seam);padding:8px 10px;max-height:200px;overflow-y:auto}
.gc-students.open{display:block}
.gc-st-row{display:flex;align-items:center;gap:7px;padding:4px 0;border-bottom:.5px solid rgba(201,168,76,.04)}
.gc-st-row:last-child{border-bottom:none}
.gc-st-av{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:6.5px;font-weight:700;flex-shrink:0;border:1px solid;cursor:pointer}
.gc-st-name{font-size:8.5px;color:var(--ink);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.heatstrip{display:flex;gap:1px}
.hcell{width:8px;height:7px;border-radius:1px;background:rgba(255,255,255,.04);border:.5px solid rgba(255,255,255,.04)}
.hcell.on{background:rgba(40,200,176,.35);border-color:rgba(40,200,176,.5)}

/* ══ SINALIZADO ══ */
.sinal-block{background:rgba(232,69,90,.04);border:1px solid var(--red-b);border-left:3px solid var(--red);margin-bottom:12px}
.sinal-hdr{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer}
.sinal-title{font-size:9px;font-weight:600;color:var(--red);flex:1}
.sinal-count{font-size:20px;font-weight:700;color:var(--red);line-height:1}
.sinal-body{display:none;padding:8px 12px;border-top:1px solid var(--red-b)}
.sinal-body.open{display:block}
.sinal-row{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:.5px solid rgba(232,69,90,.08)}
.sinal-row:last-child{border-bottom:none}
.sinal-reason{font-size:7px;font-weight:700;padding:1px 5px;border:1px solid;flex-shrink:0}
.sinal-r-sd{background:var(--amber-a);border-color:var(--amber-b);color:var(--amber)}
.sinal-r-iv{background:var(--red-a);border-color:var(--red-b);color:var(--red)}
.sinal-r-ng{background:rgba(155,94,202,.12);border-color:rgba(155,94,202,.3);color:var(--purple)}
.slot-tag{font-size:6.5px;padding:1px 4px;border:1px solid;margin-right:2px}
.slot-valid{background:var(--green-a);border-color:var(--green-b);color:var(--green)}
.slot-invalid{background:var(--red-a);border-color:var(--red-b);color:var(--red)}

/* ══ STUDENT TABLE ══ */
.st-hdr{display:grid;grid-template-columns:1fr 100px 70px;font-size:7px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding:5px 0 7px;border-bottom:1px solid var(--seam2)}
.st-hdr span{padding:0 3px}
.st-row{display:grid;grid-template-columns:1fr 100px 70px;align-items:center;border-bottom:.5px solid rgba(201,168,76,.04);transition:background .1s}
.st-row:hover{background:rgba(201,168,76,.02)}
.st-cell{padding:5px 3px}
.spinner-wrap{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--ink3);gap:8px;font-size:9px;letter-spacing:.1em}
.spinner{width:12px;height:12px;border:1.5px solid var(--seam2);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
.empty-msg{padding:28px;text-align:center;color:var(--ink3);font-size:9px;letter-spacing:.1em}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(6px);padding:5px 18px;font-size:9px;opacity:0;transition:all .2s;z-index:9000;pointer-events:none;border:1px solid;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--green-a);border-color:var(--green-b);color:var(--green)}
.toast.warn{background:var(--amber-a);border-color:var(--amber-b);color:var(--amber)}
.toast.err{background:var(--red-a);border-color:var(--red-b);color:var(--red)}
</style>
</head>
<body>

<div class="lo" id="lo">
  <div class="lo-mark">ALM</div>
  <div class="lo-bar"><div class="lo-fill" id="lo-fill"></div></div>
  <div class="lo-txt" id="lo-txt">A inicializar…</div>
</div>

<div class="top">
  <div class="top-brand"><span class="brand-alm">ALM</span><span class="brand-yr">2026 / 2027</span></div>
  <div class="top-steps">
    <a class="step" href="/admin/alm-painel-central"><div class="step-n">1</div>Overview</a>
    <a class="step" href="/admin/alm-painel-central"><div class="step-n">2</div>Audit</a>
    <div class="step active"><div class="step-n">▶</div>Formation</div>
    <a class="step" href="/admin/alm-confirmar-turmas-criadas"><div class="step-n">4</div>Decision</a>
    <a class="step" href="/admin/alm-atribuir-turmas"><div class="step-n">5</div>Assign</a>
  </div>
  <div class="top-right">
    <div class="top-kpi"><span id="tk-e">—</span> inscritos · <span id="tk-r">—</span> pedidos</div>
    <div class="sb-pill load" id="sb-pill"><div class="sb-dot"></div><span id="sb-txt">A ligar…</span></div>
  </div>
</div>

<div class="shell">
  <!-- LEFT SIDEBAR -->
  <div class="sidebar">
    <div class="sb-stats">
      <div class="sb-stat"><div class="sb-stat-v" style="color:var(--gold2)" id="s-total">—</div><div class="sb-stat-l">Inscritos</div></div>
      <div class="sb-stat"><div class="sb-stat-v" style="color:var(--green)" id="s-com">—</div><div class="sb-stat-l">Com pedido</div></div>
      <div class="sb-stat"><div class="sb-stat-v" style="color:var(--red)" id="s-sem">—</div><div class="sb-stat-l">Sem pedido</div></div>
    </div>
    <div class="loc-tabs" id="loc-tabs">
      <div class="spinner-wrap" style="padding:8px"><div class="spinner"></div></div>
    </div>
    <div class="tree" id="tree">
      <div class="spinner-wrap"><div class="spinner"></div>A carregar níveis…</div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main" id="main">
    <div class="placeholder">

<script>
/* ═══════════════════════════════════════════════
   SUPABASE
═══════════════════════════════════════════════ */
const SB  = 'https://oapygbeliocdvitbdjbq.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9hcHlnYmVsaW9jZHZpdGJkamJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NjQzNjAsImV4cCI6MjA5MjA0MDM2MH0.-9Uj9Bg3q8sIlqzfzw2Sc1JziaueeyYGNwep-qWhWWg';
const H   = { apikey: KEY, Authorization: 'Bearer ' + KEY };
const AY  = '2026/2027';

async function sbGet(table, qs) {
  let all = [], page = 0;
  while (true) {
    const s = page * 1000, e = s + 999;
    const r = await fetch(`${SB}/rest/v1/${table}?${qs}`, { headers: { ...H, Range: `${s}-${e}` } });
    if (!r.ok) throw new Error(`${table}: HTTP ${r.status}`);
    const d = await r.json();
    all = all.concat(d);
    if (d.length < 1000) break;
    if (++page > 4) break;
  }
  return all;
}

/* ═══════════════════════════════════════════════
   CONSTANTS
═══════════════════════════════════════════════ */
const LEVEL_MAP = {
  'kids|A1':    { dept:'kids',     label:'PI-a1', color:'var(--c-inf)', order:1,  max:60  },
  'kids|A2':    { dept:'kids',     label:'PI-a2', color:'var(--c-inf)', order:2,  max:60  },

  'kids|B2':    { dept:'kids',     label:'PI-a4', color:'var(--c-inf)', order:4,  max:60  },

  'kids_juv|A2':{ dept:'kids_juv', label:'PJ2',   color:'var(--c-juv)', order:6,  max:90  },
  'kids_juv|B1':{ dept:'kids_juv', label:'PJ3',   color:'var(--c-juv)', order:7,  max:90  },
  'adults|A1':  { dept:'adults',   label:'1st',   color:'var(--c-ger)', order:8,  max:200 },
  'adults|A2':  { dept:'adults',   label:'2nd',   color:'var(--c-ger)', order:9,  max:200 },
  'adults|B1':  { dept:'adults',   label:'3rd',   color:'var(--c-ger)', order:10, max:200 },
  'adults|B2':  { dept:'adults',   label:'4th',   color:'var(--c-ger)', order:11, max:200 },
  'adults|C1':  { dept:'adults',   label:'5th',   color:'var(--c-ger)', order:12, max:200 },
  'adults|C2':  { dept:'adults',   label:'5th+',  color:'var(--c-ger)', order:13, max:200 },
  'exam|B2':    { dept:'exam',     label:'6th B2',color:'var(--c-exa)', order:14, max:60  },
  'exam|C1':    { dept:'exam',     label:'7th C1',color:'var(--c-exa)', order:15, max:60  },
  'exam|C2':    { dept:'exam',     label:'8th C2',color:'var(--c-exa)', order:16, max:60  },
};
const DEPT_CFG = {
  kids:     { label:'Infantil', color:'var(--c-inf)' },
  kids_juv: { label:'Juvenil',  color:'var(--c-juv)' },
  adults:   { label:'Geral',    color:'var(--c-ger)' },
  exam:     { label:'Exames',   color:'var(--c-exa)' },
};
const DEPT_ORDER = ['kids','kids_juv','adults','exam'];
const BRANCH_LABELS = { FUNCHAL:'Funchal', CAMARA_LOBOS:'C. Lobos', SANTA_CRUZ:'S. Cruz', MACHICO:'Machico', RIBEIRA_BRAVA:'R. Brava', CALHETA:'Calheta' };
const BRANCH_ORDER  = ['FUNCHAL','CAMARA_LOBOS','SANTA_CRUZ','MACHICO','RIBEIRA_BRAVA','CALHETA'];
const DAYS_PT       = ['SEG','TER','QUA','QUI','SEX','SÁB'];
const HOURS_MORN    = [8,9,10,11];
const HOURS_AFT     = [14,15,16,17,18,19,20];
const DAY_IDX_MAP   = {
  monday:0,tuesday:1,wednesday:2,thursday:3,friday:4,saturday:5,
  segunda:0,terca:1,'terça':1,quarta:2,quinta:3,sexta:4,sabado:5,'sábado':5,
  'segunda-feira':0,'terça-feira':1,'quarta-feira':2,'quinta-feira':3,'sexta-feira':4,
  mon:0,tue:1,wed:2,thu:3,fri:4,sat:5,seg:0,ter:1,qua:2,qui:3,sex:4,sab:5,'sáb':5
};
const ALM_PAIRS = [
  { a:0,b:2, aLbl:'SEG',bLbl:'QUA', label:'SEG+QUA' },
  { a:1,b:3, aLbl:'TER',bLbl:'QUI', label:'TER+QUI' },
  { a:2,b:4, aLbl:'QUA',bLbl:'SEX', label:'QUA+SEX' },
  { a:5,b:5, aLbl:'SÁB',bLbl:'SÁB', label:'SÁB',    examOnly:true },
];
const MIN_GROUP = 5, MAX_GROUP = 17;

/* ═══════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════ */
let allEnrolments = [], allRequests = [], reqByRef = {};
let activeLoc = 'all', activeLevel = null;
let openDepts = { kids:true, kids_juv:false, adults:false, exam:false };
let highlightPair = null; // for timetable pair highlight
let openStudentCards = new Set();
let approvedGroups = new Set();

/* ═══════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════ */
const normBranch = b => (b||'').toUpperCase().replace(/[\s\-]+/g,'_').trim();
const normStatus = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
const levelKey   = e => `${(e.family||'').toLowerCase()}|${(e.level_code||e.level_cefr||'').trim()}`;
const getLvlMeta = e => LEVEL_MAP[levelKey(e)] || { dept:'adults', label:`${e.family||'?'}·${e.level_cefr||'?'}`, color:'var(--ink3)', order:99, max:60 };
const getLocStudents = () => activeLoc === 'all' ? allEnrolments : allEnrolments.filter(e => normBranch(e.branch) === activeLoc);

function parseHour(t) { if (t==null) return null; const h=parseInt((t+'').split(':')[0],10); return isNaN(h)?null:h; }
function classifyBlock(s) { const h=parseHour(s); if(h===null)return null; if(h>=8&&h<=11)return'manha'; if(h>=14&&h<=20)return'tarde'; return null; }
function normDay(str) {
  if (!str) return null;
  const n = parseInt(str);
  if (!isNaN(n) && n >= 1 && n <= 6) return n - 1;
  return DAY_IDX_MAP[(str+'').toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'')] ?? null;
}
function parseDayPrefs(raw) {
  if (!raw) return [];
  if (Array.isArray(raw)) return raw;
  try { const p=JSON.parse(raw); return Array.isArray(p)?p:[]; } catch { return []; }
}
function analysePrefs(ref) {
  const req = reqByRef[ref]; if (!req) return null;
  const raw = parseDayPrefs(req.day_preferences);
  const slots = raw.map(p => ({
    dayIdx: normDay(p.day||p.weekday||p.dia||''),
    block:  classifyBlock(p.session_start||p.start_time||''),
    hour:   parseHour(p.session_start||p.start_time||''),
    raw: p
  })).filter(s => s.dayIdx !== null);
  const dayList = slots.map(s => s.dayIdx);
  const sameDay = dayList.length >= 2 && new Set(dayList).size < dayList.length;
  const validSlots = slots.filter(s => s.block !== null);
  return { prefs:slots, sameDay, validSlots, dayIdxs:[...new Set(slots.map(s=>s.dayIdx))] };
}

function avColor(name) {
  let h=0; for(let i=0;i<(name||'?').length;i++) h=(h*31+(name||'?').charCodeAt(i))&0xffffffff;
  const p=[{bg:'#3A2244',text:'#C8A0E0'},{bg:'#1E2E50',text:'#7AABEE'},{bg:'#1A3A2A',text:'#5EC888'},{bg:'#3A2A14',text:'#D4944A'},{bg:'#3A1A1A',text:'#E07878'},{bg:'#1A2A3A',text:'#5A9EC8'},{bg:'#282838',text:'#9898D8'},{bg:'#2A3820',text:'#80B850'}];
  const c=p[Math.abs(h)%p.length]; return{bg:c.bg,border:c.text+'55',text:c.text};
}

/* ═══════════════════════════════════════════════
   TIMETABLE HEATMAP BUILDER
   Returns a { day → { hour → count } } map
═══════════════════════════════════════════════ */
function buildHeatmap(students) {
  // students = enrolment rows filtered to a level (+ branch if not 'all')
  const map = {};
  DAYS_PT.forEach(d => { map[d] = {}; [...HOURS_MORN,...HOURS_AFT].forEach(h => map[d][h]=0); });
  students.forEach(e => {
    const a = analysePrefs(e.ref); if (!a) return;
    a.prefs.forEach(s => {
      if (s.dayIdx === null || s.hour === null) return;
      const day = DAYS_PT[s.dayIdx];
      if (map[day] && map[day][s.hour] !== undefined) map[day][s.hour]++;
    });
  });
  return map;
}

function countPairBlock(students, pair, block) {
  return students.filter(e => {
    const a = analysePrefs(e.ref); if (!a) return false;
    if (pair.a === pair.b)
      return a.validSlots.filter(s => s.dayIdx===pair.a && s.block===block).length >= 2;
    return a.validSlots.some(s => s.dayIdx===pair.a && s.block===block)
        && a.validSlots.some(s => s.dayIdx===pair.b && s.block===block);
  }).length;
}

/* ═══════════════════════════════════════════════
   GROUPING ENGINE — exact port from File 1
═══════════════════════════════════════════════ */
function buildGroupProposals(lk, branch) {
  const all = allEnrolments.filter(e => {
    if (levelKey(e) !== lk) return false;
    if (branch !== 'all' && normBranch(e.branch) !== branch) return false;
    return true;
  });
  const withReq   = all.filter(e => !!reqByRef[e.ref]);
  const dept      = (LEVEL_MAP[lk]||{}).dept || 'adults';
  const placed    = new Set(), groups = [];

  const sameDayBucket = withReq.filter(e => { const a=analysePrefs(e.ref); return a&&a.sameDay; });
  sameDayBucket.forEach(e => placed.add(e.ref));

  const invalidBucket = withReq.filter(e => {
    if (placed.has(e.ref)) return false;
    const a = analysePrefs(e.ref); return a && a.validSlots.length === 0;
  });
  invalidBucket.forEach(e => placed.add(e.ref));

  const eligible = withReq.filter(e => !placed.has(e.ref));

  ALM_PAIRS.forEach(pair => {
    if (pair.examOnly && dept !== 'exam') return;
    ['manha','tarde'].forEach(block => {
      const sub = eligible.filter(e => {
        if (placed.has(e.ref)) return false;
        const a = analysePrefs(e.ref); if (!a) return false;
        if (pair.a === pair.b)
          return a.validSlots.filter(s => s.dayIdx===pair.a && s.block===block).length >= 2;
        return a.validSlots.some(s => s.dayIdx===pair.a && s.block===block)
            && a.validSlots.some(s => s.dayIdx===pair.b && s.block===block);
      });
      if (sub.length < MIN_GROUP) return;
      let rem = [...sub];
      while (rem.length >= MIN_GROUP) {
        const chunk = rem.slice(0, MAX_GROUP); rem = rem.slice(MAX_GROUP);
        chunk.forEach(e => placed.add(e.ref));
        groups.push({ pair, block, students: chunk });
      }
    });
  });

  const sinalizados = [
    ...sameDayBucket.map(e => ({ e, reason:'same-day' })),
    ...invalidBucket.map(e => ({ e, reason:'invalid-window' })),
    ...eligible.filter(e => !placed.has(e.ref)).map(e => ({ e, reason:'no-group' })),
  ];

  return {
    groups, sinalizados,
    total:      all.length,
    withRequest: withReq.length,
    placed:     groups.reduce((s,g) => s+g.students.length, 0),
    sameDayCt:  sameDayBucket.length,
    invalidWinCt: invalidBucket.length,
    noGroupCt:  eligible.filter(e => !placed.has(e.ref)).length,
  };
}

/* ═══════════════════════════════════════════════
   BOOT
═══════════════════════════════════════════════ */
async function boot() {
  loPct(10, 'A ligar ao Supabase…');
  setSb('load', 'A carregar…');
  try {
    const [enrol, reqs] = await Promise.all([
      sbGet('enrolments', `select=ref,name,branch,lang,family,level_cefr&academic_year=eq.${encodeURIComponent(AY)}&limit=2000`),
      sbGet('timetable_requests', `select=ref,student_name,branch,lang,family,level_cefr,day_preferences,status,sessions_per_week&academic_year=eq.${encodeURIComponent(AY)}&limit=2000`),
    ]);
    allEnrolments = enrol || [];
    allRequests   = reqs  || [];
    allRequests.forEach(r => reqByRef[r.ref] = r);
    loPct(80, 'A construir níveis…');
    document.getElementById('tk-e').textContent = allEnrolments.length;
    document.getElementById('tk-r').textContent = allRequests.length;
    document.getElementById('s-total').textContent = allEnrolments.length;

    document.getElementById('s-sem').textContent   = allEnrolments.length - allRequests.length;

    initSidebar();
    loPct(100); setTimeout(loHide, 350);
    showToast(`${allEnrolments.length} inscritos · ${allRequests.length} pedidos carregados`, 'ok');
  } catch(e) {
    setSb('err', 'Erro: ' + e.message);
    showToast('Erro: ' + e.message, 'err');
    loHide();
  }
}

/* ═══════════════════════════════════════════════
   SIDEBAR
═══════════════════════════════════════════════ */
function initSidebar() {
  const branches = [...new Set(allEnrolments.map(e => normBranch(e.branch)).filter(Boolean))];
  const ordered  = BRANCH_ORDER.filter(b => branches.includes(b)).concat(branches.filter(b => !BRANCH_ORDER.includes(b)));
  document.getElementById('loc-tabs').innerHTML =
    `<div class="loc-tab on" onclick="setLoc('all',this)">Tudo</div>` +
    ordered.map(b => `<div class="loc-tab" onclick="setLoc('${b}',this)">${BRANCH_LABELS[b]||b}</div>`).join('');
  renderTree();
}

function setLoc(loc, btn) {
  activeLoc = loc;
  document.querySelectorAll('.loc-tab').forEach(t => t.classList.remove('on'));
  btn.classList.add('on');
  activeLevel = null;
  updateSidebarStats();
  renderTree();
  document.getElementById('main').innerHTML = `<div class="placeholder"><div class="placeholder-icon">◈</div><div class="placeholder-text">← Seleccione um nível</div></div>`;
}

function updateSidebarStats() {
  const s = getLocStudents();
  const com = s.filter(e => reqByRef[e.ref]).length;
  document.getElementById('s-total').textContent = s.length;
  document.getElementById('s-com').textContent   = com;
  document.getElementById('s-sem').textContent   = s.length - com;
}

function renderTree() {
  const students = getLocStudents();
  const tree = {};
  students.forEach(e => {
    const meta = getLvlMeta(e), dk = meta.dept, lk = levelKey(e);
    if (!tree[dk]) tree[dk] = {};
    if (!tree[dk][lk]) tree[dk][lk] = [];
    tree[dk][lk].push(e);
  });
  let html = '';
  DEPT_ORDER.forEach(dk => {
    if (!tree[dk]) return;
    const dc = DEPT_CFG[dk];
    const isOpen = openDepts[dk];
    const dStudents = Object.values(tree[dk]).flat();
    const sortedLks = Object.keys(tree[dk]).sort((a,b) => (LEVEL_MAP[a]?.order||99)-(LEVEL_MAP[b]?.order||99));
    html += `<div class="dept-block"><div class="dept-hdr" onclick="toggleDept('${dk}')">
      <div class="dept-bar" style="background:${dc.color}"></div>
      <div class="dept-name" style="color:${dc.color}">${dc.label}</div>
      <div class="dept-n">${dStudents.length} al</div>
      <div class="dept-arrow${isOpen?' open':''}">▶</div>
    </div><div class="lv-list${isOpen?' open':''}">`;
    sortedLks.forEach(lk => {
      const ls = tree[dk][lk];
      const meta = LEVEL_MAP[lk] || getLvlMeta(ls[0]);
      const sem = ls.filter(e => !reqByRef[e.ref]).length;
      const isAct = activeLevel === lk;
      const bcls = sem > 0 ? 'badge-warn' : 'badge-ok';
      const btxt = sem > 0 ? `${sem} s/p` : 'ok';
      html += `<div class="lv-item${isAct?' on':''}" onclick="selectLevel('${lk}')">
        <div class="lv-dot" style="background:${meta.color}"></div>
        <div class="lv-name">${meta.label}</div>
        <div class="lv-n">${ls.length}</div>
        <div class="lv-badge badge ${bcls}">${btxt}</div>
      </div>`;
    });
    html += `</div></div>`;
  });
  document.getElementById('tree').innerHTML = html || '<div class="empty-msg">Sem dados.</div>';
}

function toggleDept(dk) { openDepts[dk] = !openDepts[dk]; renderTree(); }
function selectLevel(lk) { activeLevel = lk; highlightPair = null; renderTree(); renderLevel(); }

/* ═══════════════════════════════════════════════
   LEVEL RENDER — main panel
═══════════════════════════════════════════════ */
function renderLevel() {
  const main = document.getElementById('main');
  const students = getLocStudents().filter(e => levelKey(e) === activeLevel);
  if (!students.length) { main.innerHTML = '<div class="empty-msg">Nenhum aluno neste nível para a filial seleccionada.</div>'; return; }

  const meta   = LEVEL_MAP[activeLevel] || getLvlMeta(students[0]);
  const dc     = DEPT_CFG[meta.dept]   || {};
  const com    = students.filter(e => reqByRef[e.ref]).length;
  const sem    = students.length - com;
  const capPct = Math.round(students.length / meta.max * 100);

  // Run grouping (cross-branch when 'all', or specific branch)
  const result = com > 0 ? buildGroupProposals(activeLevel, activeLoc) : null;

  // Build heatmap from students who HAVE requests
  const studentsWithReq = students.filter(e => reqByRef[e.ref]);
  const heatmap = buildHeatmap(studentsWithReq);

  let html = `
  <div class="sec">${meta.label} · <span style="color:${meta.color}">${dc.label||''}</span>${activeLoc!=='all'?' · '+(BRANCH_LABELS[activeLoc]||activeLoc):''}</div>

  <!-- LEVEL SUMMARY -->
  <div class="level-banner">
    <div class="ls-stat"><div class="ls-v" style="color:var(--gold2)">${students.length}</div><div class="ls-l">Inscritos</div></div>
    <div class="ls-stat"><div class="ls-v" style="color:var(--green)">${com}</div><div class="ls-l">Com pedido</div></div>
    <div class="ls-stat"><div class="ls-v" style="color:var(--red)">${sem}</div><div class="ls-l">Sem pedido</div></div>
    ${result ? `
    <div class="ls-stat"><div class="ls-v" style="color:var(--teal)">${result.placed}</div><div class="ls-l">Em turma</div></div>
    <div class="ls-stat"><div class="ls-v" style="color:var(--amber)">${result.sinalizados.length}</div><div class="ls-l">Sinalizados</div></div>
    ` : ''}
    <div class="cap-bar">
      <div class="cap-lbl">${capPct}% capacidade · max ${meta.max}</div>
      <div class="cap-track"><div class="cap-fill" style="width:${capPct}%;background:${meta.color}"></div></div>
    </div>
  </div>`;

  // TIMETABLE HEATMAP
  html += buildTimetableHTML(heatmap, studentsWithReq, meta, result);

  // GROUP PROPOSALS
  if (result && result.groups.length) {
    html += `<div class="sec" style="margin-top:16px">Turmas propostas · ${result.groups.length} grupos · ${result.placed} alunos</div>`;
    html += `<div class="group-grid">` + result.groups.map((g, i) => buildGroupCard(g, i, meta)).join('') + `</div>`;
  }

  // SINALIZADOS
  if (result && result.sinalizados.length) {
    html += buildSinalizadosHTML(result);
  }

  // STUDENT TABLE
  html += `<div class="sec" style="margin-top:16px">Alunos · ${students.length} registos</div>
  <div class="st-hdr"><span>Nome</span><span>Disponibilidade</span><span>Status</span></div>`;
  students.sort((a,b) => (a.name||'').localeCompare(b.name||'')).forEach(e => {
    const a = analysePrefs(e.ref);
    const dayIdxs = a ? a.dayIdxs : [];
    const cells = DAYS_PT.map((_,di) => `<div class="hcell${dayIdxs.includes(di)?' on':''}"></div>`).join('');
    const st = reqByRef[e.ref] ? normStatus(reqByRef[e.ref].status) : 'sem_pedido';
    const bcls = st==='atribuido'?'badge-ok':st==='sem_pedido'?'badge-err':'badge-warn';
    const btxt = st==='atribuido'?'atribuído':st==='sem_pedido'?'sem pedido':'pendente';
    html += `<div class="st-row">
      <div class="st-cell"><div style="font-size:9px;color:var(--ink)">${e.name||'—'}</div><div style="font-size:7px;color:var(--ink3)">${e.ref||'—'}</div></div>
      <div class="st-cell"><div class="heatstrip">${cells}</div><div style="font-size:5.5px;color:var(--ink4);margin-top:2px;letter-spacing:.04em">S T Q Q S S</div></div>
      <div class="st-cell"><span class="lv-badge badge ${bcls}">${btxt}</span></div>
    </div>`;
  });

  main.innerHTML = html;
}

/* ═══════════════════════════════════════════════
   TIMETABLE HTML
═══════════════════════════════════════════════ */
function buildTimetableHTML(heatmap, studentsWithReq, meta, result) {
  const dept = (LEVEL_MAP[activeLevel]||{}).dept || 'adults';
  const maxCount = Math.max(...DAYS_PT.flatMap(d => [...HOURS_MORN,...HOURS_AFT].map(h => heatmap[d]?.[h]||0)), 1);

  // Pair counts for matrix
  const pairMatrix = [];
  ALM_PAIRS.forEach(pair => {
    if (pair.examOnly && dept !== 'exam') return;
    ['manha','tarde'].forEach(block => {
      const count = countPairBlock(studentsWithReq, pair, block);
      pairMatrix.push({ pair, block, count });
    });
  });
  pairMatrix.sort((a,b) => b.count - a.count);

  function colorClass(n, max) {
    if (n === 0) return 'c0';
    const pct = n / max;
    if (pct < 0.1) return 'c1';
    if (pct < 0.2) return 'c2';
    if (pct < 0.35) return 'c3';
    if (pct < 0.5) return 'c4';
    if (pct < 0.65) return 'c5';
    if (pct < 0.8) return 'c6';
    return 'c7';
  }

  // Pair highlight controls
  let pairBtns = pairMatrix.map((pm, i) => {
    const blockLbl = pm.block === 'manha' ? 'M' : 'T';
    const col = pm.count >= 8 ? 'var(--green)' : pm.count >= MIN_GROUP ? 'var(--amber)' : 'var(--red)';
    return `<span class="tt-pair-pill" style="border-color:${col}44;color:${col}" id="pp-${i}" onclick="highlightPairFn(${i},[${pm.pair.a},${pm.pair.b}],'${pm.block}')" title="${pm.pair.label} · ${pm.block==='manha'?'Manhã':'Tarde'}">${pm.pair.aLbl}+${pm.pair.bLbl} ${blockLbl} <strong>${pm.count}</strong></span>`;
  }).join('');

  // Grid columns: label col + morn hours + gap + aft hours
  const totalCols = 1 + HOURS_MORN.length + 1 + HOURS_AFT.length;
  const colTemplate = `80px repeat(${HOURS_MORN.length},44px) 10px repeat(${HOURS_AFT.length},44px)`;

  let gridHTML = `<div class="tt-grid" style="grid-template-columns:${colTemplate}">`;

  // Header row
  gridHTML += `<div class="tt-col-hdr" style="text-align:right;padding-right:10px;color:var(--ink3);font-size:7px">DIA / HORA</div>`;
  HOURS_MORN.forEach(h => gridHTML += `<div class="tt-col-hdr">${h}h</div>`);
  gridHTML += `<div class="tt-col-hdr"></div>`; // gap
  HOURS_AFT.forEach(h  => gridHTML += `<div class="tt-col-hdr">${h}h</div>`);

  // Day rows
  DAYS_PT.forEach((day, di) => {
    gridHTML += `<div class="tt-row-lbl">${day}</div>`;
    [...HOURS_MORN].forEach(h => {
      const n   = heatmap[day]?.[h] || 0;
      const cls = colorClass(n, maxCount);
      const cellId = `tt-${day.replace('Á','A')}-${h}`;
      gridHTML += `<div class="tt-cell ${cls} ${n===0?'empty':''}" id="${cellId}" title="${day} ${h}h · ${n} aluno${n!==1?'s':''}">
        ${n > 0 ? `<div class="tt-cell-n">${n}</div><div class="tt-cell-sub">al</div>` : ''}
      </div>`;
    });
    gridHTML += `<div class="tt-cell gap-col"></div>`;
    [...HOURS_AFT].forEach(h => {
      const n   = heatmap[day]?.[h] || 0;
      const cls = colorClass(n, maxCount);
      const cellId = `tt-${day.replace('Á','A')}-${h}`;
      gridHTML += `<div class="tt-cell ${cls} ${n===0?'empty':''}" id="${cellId}" title="${day} ${h}h · ${n} aluno${n!==1?'s':''}">
        ${n > 0 ? `<div class="tt-cell-n">${n}</div><div class="tt-cell-sub">al</div>` : ''}
      </div>`;
    });
  });

  gridHTML += `</div>`;

  const legendHTML = `
    <div class="tt-legend">
      <div class="tt-leg-item"><div class="tt-leg-swatch" style="background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08)"></div>0</div>
      <div class="tt-leg-item"><div class="tt-leg-swatch" style="background:rgba(74,143,245,.14)"></div>1–2</div>
      <div class="tt-leg-item"><div class="tt-leg-swatch" style="background:rgba(232,160,32,.2)"></div>3–5</div>
      <div class="tt-leg-item"><div class="tt-leg-swatch" style="background:rgba(29,184,122,.22)"></div>6–10</div>
      <div class="tt-leg-item"><div class="tt-leg-swatch" style="background:rgba(29,184,122,.35)"></div>11+</div>
    </div>`;

  // Pair matrix cards
  const pmCardsHTML = pairMatrix.length ? `<div class="pair-matrix">` + pairMatrix.map((pm, i) => {
    const blockLbl = pm.block === 'manha' ? 'Manhã · 08–11h' : 'Tarde · 14–20h';
    const cls      = pm.count >= 8 ? 'viable' : pm.count >= MIN_GROUP ? 'wait' : 'low';
    const icon     = pm.count >= 8 ? '✓' : pm.count >= MIN_GROUP ? '!' : '✕';
    const lbl      = pm.count >= 8 ? 'atribuir agora' : pm.count >= MIN_GROUP ? 'aguardar' : 'não abre';
    return `<div class="pm-card ${cls}" id="pm-${i}" onclick="highlightPairFn(${i},[${pm.pair.a},${pm.pair.b}],'${pm.block}')">
      <div class="pm-icon">${icon}</div>
      <div class="pm-pair">${pm.pair.aLbl} + ${pm.pair.bLbl}</div>
      <div class="pm-block">${blockLbl}</div>
      <div class="pm-count">${pm.count}</div>
      <div class="pm-lbl">${lbl}</div>
    </div>`;
  }).join('') + `</div>` : '';

  return `
  <div class="tt-wrap">
    <div class="tt-header">
      <span class="tt-title">📊 Disponibilidade · Mapa de Horários</span>
      ${legendHTML}
      <span class="tt-meta">${studentsWithReq.length} alunos com pedido</span>
    </div>
    <div class="tt-controls">
      <span class="tt-ctrl-lbl">Realçar par:</span>
      ${pairBtns}
      <button class="tt-btn" style="margin-left:auto" onclick="clearHighlight()">Limpar</button>
    </div>
    <div class="tt-grid-outer">${gridHTML}</div>
    ${pmCardsHTML}
  </div>`;
}

/* ═══════════════════════════════════════════════
   PAIR HIGHLIGHT
═══════════════════════════════════════════════ */
function highlightPairFn(idx, dayPair, block) {
  // Toggle
  if (highlightPair === idx) { clearHighlight(); return; }
  highlightPair = idx;

  // Mark all pair pill buttons
  document.querySelectorAll('.tt-pair-pill').forEach((el,i) => el.classList.toggle('dim', i!==idx));
  document.querySelectorAll('[id^="pm-"]').forEach((el,i) => el.style.opacity = i===idx?'1':'0.4');

  const hlDays = dayPair[0]===dayPair[1] ? [dayPair[0]] : [dayPair[0], dayPair[1]];
  const hlHours = block === 'manha' ? HOURS_MORN : HOURS_AFT;

  document.querySelectorAll('.tt-cell:not(.gap-col)').forEach(cell => {
    cell.classList.remove('pair-hi','pair-dim');
  });

  DAYS_PT.forEach((day, di) => {
    const inPair = hlDays.includes(di);
    const allHours = [...HOURS_MORN,...HOURS_AFT];
    allHours.forEach(h => {
      const inBlock = hlHours.includes(h);
      const cellId = `tt-${day.replace('Á','A')}-${h}`;
      const cell = document.getElementById(cellId);
      if (!cell) return;
      if (inPair && inBlock) cell.classList.add('pair-hi');
      else cell.classList.add('pair-dim');
    });
  });
}

function clearHighlight() {
  highlightPair = null;
  document.querySelectorAll('.tt-pair-pill').forEach(el => el.classList.remove('dim'));
  document.querySelectorAll('[id^="pm-"]').forEach(el => el.style.opacity = '1');
  document.querySelectorAll('.tt-cell').forEach(cell => { cell.classList.remove('pair-hi','pair-dim'); });
}

/* ═══════════════════════════════════════════════
   GROUP CARD
═══════════════════════════════════════════════ */
function buildGroupCard(g, idx, meta) {
  const letter   = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[idx] || (idx+1);
  const n        = g.students.length;
  const color    = meta.color;
  const isLow    = n < MIN_GROUP;
  const approved = approvedGroups.has(`${activeLevel}|${idx}`);
  const blockLbl = g.block === 'manha' ? 'Manhã · 08–11h' : 'Tarde · 14–20h';
  const branchSet= [...new Set(g.students.map(e => BRANCH_LABELS[normBranch(e.branch)]||e.branch||'—'))];
  const branchStr= branchSet.length <= 2 ? branchSet.join(' · ') : `${branchSet.length} filiais`;
  return `<div class="gcard${isLow?' low':''}${approved?' approved':''}" id="gcard-${idx}">
    <div class="gc-strip" style="background:${color}"></div>
    <div class="gc-face">
      <div class="gc-left">
        <div class="gc-level" style="color:${color}">T${letter}</div>
        <div class="gc-branch">${branchStr}</div>
        <div class="gc-slot" style="color:${color}">${g.pair.aLbl} + ${g.pair.bLbl}</div>
        <div class="gc-block">${blockLbl}</div>
      </div>
      <div>
        <div class="gc-count" style="color:${color}">${n}</div>
        <div class="gc-count-lbl">alunos</div>
      </div>
    </div>
    <div class="gc-actions">
      <button class="gc-action" onclick="toggleCardStudents(${idx})">Lista</button>
      <button class="gc-action" onclick="exportGroup(${idx})">↓ CSV</button>
      <button class="gc-action ${approved?'approved-btn':'approve-btn'}" onclick="toggleApprove(${idx})">${approved?'✓ OK':'Aprovar'}</button>
    </div>
    <div class="gc-students" id="gcs-${idx}">
      ${g.students.sort((a,b)=>(a.name||'').localeCompare(b.name||'')).map(e => {
        const av = avColor(e.name||e.ref);
        const ini = (e.name||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
        const a = analysePrefs(e.ref);
        const dayIdxs = a ? a.dayIdxs : [];
        const cells = DAYS_PT.map((_,di)=>`<div class="hcell${dayIdxs.includes(di)?' on':''}"></div>`).join('');
        const br = BRANCH_LABELS[normBranch(e.branch)]||e.branch||'—';
        return `<div class="gc-st-row">
          <div class="gc-st-av" style="background:${av.bg};border-color:${av.border};color:${av.text}">${ini}</div>
          <div style="flex:1;min-width:0">
            <div class="gc-st-name">${e.name||'—'}</div>
            <div style="font-size:6.5px;color:var(--ink3)">${e.ref} · ${br}</div>
          </div>
          <div><div class="heatstrip">${cells}</div><div style="font-size:5px;color:var(--ink4);letter-spacing:.04em;margin-top:1px">S T Q Q S S</div></div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

// Store last result for export
let _lastResult = null;
const origRenderLevel = renderLevel;
function renderLevel() {
  const main = document.getElementById('main');
  const students = getLocStudents().filter(e => levelKey(e) === activeLevel);
  if (!students.length) { main.innerHTML = '<div class="empty-msg">Nenhum aluno neste nível para a filial seleccionada.</div>'; return; }
  const meta   = LEVEL_MAP[activeLevel] || getLvlMeta(students[0]);
  const dc     = DEPT_CFG[meta.dept]   || {};
  const com    = students.filter(e => reqByRef[e.ref]).length;
  const sem    = students.length - com;
  const capPct = Math.round(students.length / meta.max * 100);
  const result = com > 0 ? buildGroupProposals(activeLevel, activeLoc) : null;
  _lastResult  = result;
  const studentsWithReq = students.filter(e => reqByRef[e.ref]);
  const heatmap = buildHeatmap(studentsWithReq);

  let html = `
  <div class="sec">${meta.label} · <span style="color:${meta.color}">${dc.label||''}</span>${activeLoc!=='all'?' · '+(BRANCH_LABELS[activeLoc]||activeLoc):''}</div>
  <div class="level-banner">
    <div class="ls-stat"><div class="ls-v" style="color:var(--gold2)">${students.length}</div><div class="ls-l">Inscritos</div></div>
    <div class="ls-stat"><div class="ls-v" style="color:var(--green)">${com}</div><div class="ls-l">Com pedido</div></div>
    <div class="ls-stat"><div class="ls-v" style="color:var(--red)">${sem}</div><div class="ls-l">Sem pedido</div></div>
    ${result?`<div class="ls-stat"><div class="ls-v" style="color:var(--teal)">${result.placed}</div><div class="ls-l">Em turma</div></div>
    <div class="ls-stat"><div class="ls-v" style="color:var(--amber)">${result.sinalizados.length}</div><div class="ls-l">Sinalizados</div></div>`:''}
    <div class="cap-bar">
      <div class="cap-lbl">${capPct}% capacidade · max ${meta.max}</div>
      <div class="cap-track"><div class="cap-fill" style="width:${capPct}%;background:${meta.color}"></div></div>
    </div>
  </div>`;

  html += buildTimetableHTML(heatmap, studentsWithReq, meta, result);

  if (result && result.groups.length) {
    html += `<div class="sec" style="margin-top:16px">Turmas propostas · ${result.groups.length} grupos · ${result.placed} alunos</div>`;
    html += `<div class="group-grid">` + result.groups.map((g,i) => buildGroupCard(g,i,meta)).join('') + `</div>`;
  } else if (com > 0) {
    html += `<div class="empty-msg">Sem grupos viáveis — poucos alunos por par/bloco (mín. ${MIN_GROUP}).</div>`;
  } else {
    html += `<div class="empty-msg">Nenhum pedido de horário submetido neste nível.</div>`;
  }

  if (result && result.sinalizados.length) html += buildSinalizadosHTML(result);

  html += `<div class="sec" style="margin-top:16px">Alunos · ${students.length} registos</div>
  <div class="st-hdr"><span>Nome</span><span>Disponibilidade</span><span>Status</span></div>`;
  students.sort((a,b)=>(a.name||'').localeCompare(b.name||'')).forEach(e => {
    const a = analysePrefs(e.ref); const dayIdxs = a?a.dayIdxs:[];
    const cells = DAYS_PT.map((_,di)=>`<div class="hcell${dayIdxs.includes(di)?' on':''}"></div>`).join('');
    const st = reqByRef[e.ref]?normStatus(reqByRef[e.ref].status):'sem_pedido';
    const bcls = st==='atribuido'?'badge-ok':st==='sem_pedido'?'badge-err':'badge-warn';
    const btxt = st==='atribuido'?'atribuído':st==='sem_pedido'?'sem pedido':'pendente';
    html += `<div class="st-row">
      <div class="st-cell"><div style="font-size:9px;color:var(--ink)">${e.name||'—'}</div><div style="font-size:7px;color:var(--ink3)">${e.ref||'—'}</div></div>
      <div class="st-cell"><div class="heatstrip">${cells}</div><div style="font-size:5.5px;color:var(--ink4);margin-top:2px;letter-spacing:.04em">S T Q Q S S</div></div>
      <div class="st-cell"><span class="lv-badge badge ${bcls}">${btxt}</span></div>
    </div>`;
  });

  main.innerHTML = html;
}

/* ═══════════════════════════════════════════════
   SINALIZADOS
═══════════════════════════════════════════════ */
function buildSinalizadosHTML(result) {
  const { sinalizados, sameDayCt, invalidWinCt, noGroupCt } = result;
  return `<div class="sinal-block">
    <div class="sinal-hdr" onclick="this.nextElementSibling.classList.toggle('open')">
      <div style="flex:1">
        <div class="sinal-title">⚠ Sinalizados · ${sinalizados.length} alunos não alocados</div>
        <div style="font-size:7px;color:rgba(232,69,90,.5);margin-top:2px">
          ${sameDayCt?`${sameDayCt} mesmo dia · `:''}${invalidWinCt?`${invalidWinCt} horário inválido · `:''}${noGroupCt?`${noGroupCt} sem grupo`:''}
        </div>
      </div>
      <div class="sinal-count">${sinalizados.length}</div>
    </div>
    <div class="sinal-body">
      ${sinalizados.map(({ e, reason }) => {
        const a = analysePrefs(e.ref);
        const slots = (a?.prefs||[]).map(s => {
          const d = s.dayIdx!==null?DAYS_PT[s.dayIdx]:'?';
          const t = s.raw?.session_start||'—';
          const cls = reason==='same-day'?'slot-invalid':s.block?'slot-valid':'slot-invalid';
          return `<span class="slot-tag ${cls}">${d} ${t}</span>`;
        }).join('');
        const rCls = reason==='same-day'?'sinal-r-sd':reason==='invalid-window'?'sinal-r-iv':'sinal-r-ng';
        const rTxt = reason==='same-day'?'mesmo dia':reason==='invalid-window'?'horário inválido':'sem grupo';
        const br = BRANCH_LABELS[normBranch(e.branch)]||e.branch||'—';
        return `<div class="sinal-row">
          <span class="sinal-reason ${rCls}">${rTxt}</span>
          <div style="flex:1;min-width:0">
            <div style="font-size:9px;color:var(--ink)">${e.name||'—'} <span style="font-size:7px;color:var(--ink3)">· ${e.ref} · ${br}</span></div>
            <div style="margin-top:2px">${slots}</div>
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

/* ═══════════════════════════════════════════════
   CARD ACTIONS
═══════════════════════════════════════════════ */
function toggleCardStudents(idx) {
  const el = document.getElementById(`gcs-${idx}`);
  if (el) el.classList.toggle('open');
}

function toggleApprove(idx) {
  const key = `${activeLevel}|${idx}`;
  approvedGroups.has(key) ? approvedGroups.delete(key) : approvedGroups.add(key);
  const card = document.getElementById(`gcard-${idx}`);
  const btn  = card?.querySelector('.gc-action.approve-btn,.gc-action.approved-btn');
  if (card) card.classList.toggle('approved', approvedGroups.has(key));
  if (btn)  { btn.className = `gc-action ${approvedGroups.has(key)?'approved-btn':'approve-btn'}`; btn.textContent = approvedGroups.has(key)?'✓ OK':'Aprovar'; }
  showToast(approvedGroups.has(key)?'Grupo aprovado ✓':'Aprovação removida', approvedGroups.has(key)?'ok':'warn');
}

function exportGroup(idx) {
  if (!_lastResult?.groups[idx]) return;
  const g = _lastResult.groups[idx];
  const meta = LEVEL_MAP[activeLevel]||{};
  const letter = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[idx]||(idx+1);
  const rows = [`ALM · ${meta.label||activeLevel} · T${letter} · ${g.pair.aLbl}+${g.pair.bLbl} · ${g.block==='manha'?'Manhã':'Tarde'}`,'','Nome,Ref,Filial,Status'];
  g.students.forEach(e => {
    const st = reqByRef[e.ref]?normStatus(reqByRef[e.ref].status):'sem pedido';
    const br = BRANCH_LABELS[normBranch(e.branch)]||e.branch||'—';
    rows.push(`"${e.name||''}","${e.ref||''}","${br}","${st}"`);
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv;charset=utf-8;'}));
  a.download = `ALM-T${letter}-${meta.label||activeLevel}.csv`;
  a.click();
  showToast(`CSV exportado · ${g.students.length} alunos`,'ok');
}

/* ═══════════════════════════════════════════════
   UI UTILITIES
═══════════════════════════════════════════════ */
let _toastT;
function showToast(msg, type='ok') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast ${type} show`;
  clearTimeout(_toastT); _toastT = setTimeout(() => t.classList.remove('show'), 2600);
}
function setSb(type, txt) {
  document.getElementById('sb-pill').className = 'sb-pill ' + type;
  document.getElementById('sb-txt').textContent = txt;
}
function loPct(pct, txt) {
  const f = document.getElementById('lo-fill'), s = document.getElementById('lo-txt');
  if (f) f.style.width = pct + '%';
  if (s && txt) s.textContent = txt;
}
function loHide() { const e = document.getElementById('lo'); if(e){e.classList.add('done'); setTimeout(()=>e.remove(),600);} }

boot();
</script>
