<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ALM · Formation · 2026/2027</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9A84C;--gold2:#E8C97A;--gold3:rgba(201,168,76,.15);--gold4:rgba(201,168,76,.06);
  --green:#1DB87A;--green-a:rgba(29,184,122,.14);--green-b:rgba(29,184,122,.30);
  --red:#E8455A;--red-a:rgba(232,69,90,.12);--red-b:rgba(232,69,90,.30);
  --amber:#E8A020;--amber-a:rgba(232,160,32,.13);--amber-b:rgba(232,160,32,.30);
  --teal:#28C8B0;--purple:#9B5ECA;--blue:#4A8FF5;
  --bg:#07060E;--bg2:#0E0B1A;--bg3:#141025;--bg4:#1A162E;
  --b:rgba(201,168,76,.07);--b2:rgba(201,168,76,.16);--b3:rgba(201,168,76,.30);
  --t:rgba(238,218,168,.92);--t2:rgba(210,188,140,.55);--t3:rgba(210,188,140,.28);--t4:rgba(210,188,140,.10);
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',system-ui,sans-serif;--display:'Bebas Neue',sans-serif;
  --c-inf:#4A8FF5;--c-juv:#28C8B0;--c-ger:#C8A44A;--c-exa:#9B5ECA;
  /* Group palette — 12 distinct colours for pins */
  --g0:#E8455A;--g1:#E8A020;--g2:#1DB87A;--g3:#4A8FF5;--g4:#9B5ECA;--g5:#28C8B0;
  --g6:#F06090;--g7:#F0C040;--g8:#50D890;--g9:#70B0FF;--g10:#C080F0;--g11:#40E0D0;
}
html,body{height:100%;background:var(--bg);color:var(--t);font-family:var(--mono);font-size:12px;-webkit-font-smoothing:antialiased;overflow:hidden}
body{display:flex;flex-direction:column}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes pinDrop{from{opacity:0;transform:translateY(-8px) scale(.8)}to{opacity:1;transform:none}}
@keyframes modalIn{from{opacity:0;transform:scale(.94) translateY(12px)}to{opacity:1;transform:none}}

/* ── TOPBAR ── */
.topbar{flex-shrink:0;height:50px;display:flex;align-items:center;background:rgba(7,6,14,.99);border-bottom:1px solid var(--b2);z-index:200}
.nav-duo{display:flex;flex-direction:column;height:100%;border-right:1px solid var(--b2);flex-shrink:0;min-width:52px}
.nav-home,.nav-back{display:flex;align-items:center;justify-content:center;flex:1;text-decoration:none;transition:background .14s}
.nav-home{border-bottom:.5px solid var(--b);padding:0 14px}
.nav-back{padding:0 10px;gap:3px}
.nav-home:hover,.nav-back:hover{background:var(--gold4)}
.nav-icon{font-size:13px;color:var(--t3)}
.nav-lbl{font-size:6.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}
.nav-home:hover .nav-icon,.nav-back:hover .nav-icon,.nav-back:hover .nav-lbl{color:var(--gold2)}
.brand{display:flex;align-items:center;padding:0 18px;height:100%;border-right:1px solid var(--b);flex-shrink:0}
.brand-alm{font-size:18px;font-weight:700;letter-spacing:8px;color:var(--gold2)}
.brand-yr{font-size:7.5px;color:var(--t3);letter-spacing:.14em;margin-left:8px;align-self:flex-end;padding-bottom:3px}
.tabs{display:flex;align-items:stretch;height:100%;flex:1;overflow:hidden}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 18px;border-right:1px solid var(--b);border-bottom:2px solid transparent;transition:all .18s;flex-shrink:0;gap:2px;text-decoration:none;cursor:pointer}
.tab:hover{background:var(--gold4)}
.tab.active{background:rgba(201,168,76,.06);border-bottom-color:var(--gold)}
.tab-n{font-size:7px;font-weight:700;color:var(--t4);width:15px;height:15px;border:1px solid var(--b);display:flex;align-items:center;justify-content:center;transition:all .18s}
.tab.active .tab-n{background:var(--gold);color:#07060E;border-color:var(--gold)}
.tab-l{font-size:7.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);white-space:nowrap;transition:color .18s}
.tab.active .tab-l{color:var(--gold2)}
.tab:hover .tab-l{color:var(--t2)}
.tab-arr{font-size:7px;color:var(--t4)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:7px;padding:0 13px;border-left:1px solid var(--b);height:100%;flex-shrink:0}
.live{display:flex;align-items:center;gap:5px}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:blink 2s infinite}
.live-dot.amber{background:var(--amber)}
.live-dot.red{background:var(--red)}
.live-lbl{font-size:7px;font-weight:700;letter-spacing:.1em;color:var(--green)}
.tb-pill{font-size:7.5px;font-weight:600;letter-spacing:.06em;padding:3px 10px;border:1px solid var(--b2);color:var(--t2)}
.tb-pill.gold{color:var(--gold2);border-color:var(--b3);background:var(--gold4)}
.tb-pill.ok{color:var(--green);border-color:var(--green-b);background:var(--green-a)}
.tb-pill.load{color:var(--amber);border-color:var(--amber-b)}
.tb-pill.err{color:var(--red);border-color:var(--red-b)}

/* ── LAYOUT ── */
.layout{flex:1;display:flex;overflow:hidden}

/* ── LEFT SIDEBAR ── */
.sidebar{width:240px;flex-shrink:0;border-right:1px solid var(--b2);display:flex;flex-direction:column;overflow:hidden;background:var(--bg2)}
.sb-kpis{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--b2);flex-shrink:0}
.sb-kpi{padding:10px 8px 8px}
.sb-kpi+.sb-kpi{border-left:1px solid var(--b)}
.sb-kpi-v{font-size:22px;font-weight:700;line-height:1}
.sb-kpi-l{font-size:6.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-top:3px}
.branch-strip{display:flex;flex-wrap:wrap;gap:3px;padding:8px 8px 6px;border-bottom:1px solid var(--b);flex-shrink:0}
.btab{font-size:7.5px;font-weight:600;letter-spacing:.04em;padding:3px 9px;border:1px solid var(--b2);cursor:pointer;color:var(--t3);transition:all .13s;background:transparent;font-family:var(--mono)}
.btab:hover{color:var(--t2);border-color:var(--b3)}
.btab.active{background:var(--gold3);border-color:var(--gold);color:var(--gold2)}
.level-tree{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--b) transparent}
.dept-hdr{display:flex;align-items:center;gap:7px;padding:8px 10px 5px;cursor:pointer;user-select:none;transition:background .12s;position:sticky;top:0;background:var(--bg2);z-index:2;border-bottom:.5px solid var(--b)}
.dept-hdr:hover{background:rgba(255,255,255,.015)}
.dept-bar{width:3px;height:13px;flex-shrink:0}
.dept-name{font-size:7.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;flex:1}
.dept-n{font-size:8px;color:var(--t3)}
.dept-arr{font-size:7px;color:var(--t4);transition:transform .18s}
.dept-arr.open{transform:rotate(90deg)}
.level-list{display:none}.level-list.open{display:block}
.lv-item{display:flex;align-items:center;gap:7px;padding:6px 10px 6px 20px;cursor:pointer;border-left:2px solid transparent;transition:all .12s}
.lv-item:hover{background:rgba(255,255,255,.02)}
.lv-item.active{background:var(--gold4);border-left-color:var(--gold)}
.lv-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.lv-name{font-size:9px;font-weight:600;flex:1}
.lv-n{font-size:8px;color:var(--t3);min-width:24px;text-align:right}
.lv-badge{font-size:6px;font-weight:700;padding:1px 5px;border:1px solid;flex-shrink:0}
.lv-badge-ok{background:var(--green-a);border-color:var(--green-b);color:var(--green)}
.lv-badge-warn{background:var(--amber-a);border-color:var(--amber-b);color:var(--amber)}

/* ── MAIN AREA ── */
.main{flex:1;overflow:hidden;display:flex;flex-direction:column}

/* ── LEVEL HEADER ── */
.level-hdr{flex-shrink:0;padding:12px 18px 10px;background:rgba(0,0,0,.2);border-bottom:1px solid var(--b2);display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-height:52px}
.lh-name{font-family:var(--display);font-size:28px;letter-spacing:5px;line-height:1}
.lh-dept{font-size:8.5px;color:var(--t2);letter-spacing:.1em;align-self:flex-end;padding-bottom:2px}
.lh-stats{display:flex;gap:0;margin-left:auto}
.lh-stat{display:flex;flex-direction:column;align-items:center;padding:0 12px;border-left:1px solid var(--b)}
.lh-v{font-size:20px;font-weight:700;line-height:1}
.lh-l{font-size:6.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-top:2px}
.lh-cap-bar{width:60px;height:2px;background:rgba(255,255,255,.05);overflow:hidden;margin-top:4px}
.lh-cap-fill{height:100%;transition:width .5s}
.placeholder-main{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;color:var(--t3);gap:8px}
.placeholder-icon{font-size:26px;opacity:.18}
.placeholder-text{font-size:7.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.4}

/* ── VIEW TOGGLE ── */
.view-toggle-bar{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:8px 18px;border-bottom:1px solid var(--b);background:rgba(0,0,0,.15)}
.vt-label{font-size:7px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--t3)}
.toggle-switch{display:flex;border:1px solid var(--b2);overflow:hidden;flex-shrink:0}
.ts-btn{font-size:7.5px;font-weight:700;letter-spacing:.08em;padding:4px 14px;cursor:pointer;background:transparent;border:none;font-family:var(--mono);color:var(--t3);transition:all .15s;text-transform:uppercase;white-space:nowrap}
.ts-btn.active{background:var(--gold3);color:var(--gold2)}
.ts-btn:hover:not(.active){color:var(--t2);background:rgba(255,255,255,.03)}
.vt-pair-pills{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap}
.vt-pair-pill{font-size:7px;font-weight:700;padding:3px 10px;border:1px solid;cursor:pointer;transition:all .13s;font-family:var(--mono);letter-spacing:.04em}
.vt-pair-pill:hover{opacity:.8}
.vt-pair-pill.dim{opacity:.22}
.vt-hint{font-size:7px;color:var(--t3);margin-left:auto}
.clear-btn{font-size:7px;padding:3px 9px;border:1px solid var(--b2);color:var(--t3);background:transparent;cursor:pointer;font-family:var(--mono);transition:all .12s}
.clear-btn:hover{border-color:var(--b3);color:var(--t2)}

/* ── SCROLL AREA ── */
.scroll-area{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--b) transparent;padding:14px 18px 60px}

/* ── HEATMAP GRID ── */
.heatmap-wrap{background:var(--bg2);border:1px solid var(--b2);margin-bottom:14px}
.hm-head{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--b);background:rgba(0,0,0,.2)}
.hm-title{font-size:7.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.hm-legend{display:flex;gap:12px;margin-left:auto;align-items:center}
.hm-leg-item{display:flex;align-items:center;gap:4px;font-size:7px;color:var(--t3)}
.hm-leg-sq{width:9px;height:9px;border-radius:1px}
.hm-grid-outer{overflow-x:auto;padding:10px 14px 12px}
/* Grid is a CSS grid built inline per level */
.hm-grid{display:grid;gap:0;width:max-content}
.hm-col-hdr{font-size:7px;font-weight:600;color:rgba(210,180,100,.55);text-align:center;padding:2px 0;letter-spacing:.04em}
.hm-row-lbl{font-size:8.5px;font-weight:700;color:var(--gold2);display:flex;align-items:center;justify-content:flex-end;padding-right:10px;white-space:nowrap}
.hm-cell{width:48px;height:42px;border:.5px solid rgba(255,255,255,.04);position:relative;cursor:default;transition:all .15s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.hm-cell.gap-col{width:12px;background:transparent;border:none}
.hm-cell:not(.gap-col):hover{border-color:rgba(255,255,255,.14);z-index:2}
.hm-cell-n{font-size:14px;font-weight:700;line-height:1}
.hm-cell-sub{font-size:6px;color:rgba(255,255,255,.4);letter-spacing:.06em}
.hm-cell.c0{background:rgba(255,255,255,.015)}
.hm-cell.c1{background:rgba(74,143,245,.07)}
.hm-cell.c2{background:rgba(74,143,245,.13)}
.hm-cell.c3{background:rgba(232,160,32,.10)}
.hm-cell.c4{background:rgba(232,160,32,.18)}
.hm-cell.c5{background:rgba(29,184,122,.13)}
.hm-cell.c6{background:rgba(29,184,122,.22)}
.hm-cell.c7{background:rgba(29,184,122,.34)}
.hm-cell.pair-hi{outline:1.5px solid var(--gold);outline-offset:-1px;z-index:3}
.hm-cell.pair-dim{opacity:.18}

/* ── PIN VIEW ── */
.pin-grid-wrap{background:var(--bg2);border:1px solid var(--b2);margin-bottom:14px}
.pg-head{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--b);background:rgba(0,0,0,.2)}
.pg-title{font-size:7.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.pg-outer{overflow-x:auto;padding:10px 14px 14px}
/* Pin grid: same column structure as heatmap */
.pg-grid{display:grid;gap:0;width:max-content}
.pg-col-hdr{font-size:7px;font-weight:600;color:rgba(210,180,100,.55);text-align:center;padding:2px 0}
.pg-row-lbl{font-size:8.5px;font-weight:700;color:var(--gold2);display:flex;align-items:center;justify-content:flex-end;padding-right:10px;white-space:nowrap}
.pg-cell{width:48px;border:.5px solid rgba(255,255,255,.04);position:relative;transition:border-color .13s;min-height:42px;display:flex;flex-wrap:wrap;align-items:flex-start;padding:3px;gap:2px;cursor:default}
.pg-cell.gap-col{width:12px;background:transparent;border:none;min-height:0}
.pg-cell:not(.gap-col):hover{border-color:rgba(255,255,255,.14)}
.pg-cell.has-pins{cursor:pointer}
/* Row expands to fit pins */
.pg-cell.group-hi{outline:1.5px solid var(--gold);outline-offset:-1px;z-index:3}
.pg-cell.group-dim{opacity:.14}

/* ── PINS ── */
.pin{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;cursor:pointer;flex-shrink:0;border:1.5px solid rgba(0,0,0,.35);transition:transform .12s,box-shadow .12s;animation:pinDrop .22s ease both;position:relative;font-family:var(--mono)}
.pin:hover{transform:scale(1.25);box-shadow:0 3px 12px rgba(0,0,0,.6);z-index:10}
/* colour variants */
.pin-0{background:var(--g0)}.pin-1{background:var(--g1)}.pin-2{background:var(--g2)}
.pin-3{background:var(--g3)}.pin-4{background:var(--g4)}.pin-5{background:var(--g5)}
.pin-6{background:var(--g6)}.pin-7{background:var(--g7)}.pin-8{background:var(--g8)}
.pin-9{background:var(--g9)}.pin-10{background:var(--g10)}.pin-11{background:var(--g11)}
.pin-overflow{background:rgba(255,255,255,.15);color:var(--t3);border-style:dashed}

/* Count badge on pin for large groups */
.pin-count{font-size:6px;position:absolute;bottom:-5px;right:-3px;background:var(--bg);border:1px solid rgba(255,255,255,.15);border-radius:99px;padding:0 3px;color:var(--t2);white-space:nowrap;pointer-events:none}

/* ── PAIR MATRIX ── */
.pair-matrix{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-bottom:14px}
.pm-card{background:var(--bg2);border:1px solid;padding:11px 12px;cursor:pointer;transition:all .14s;position:relative}
.pm-card:hover{filter:brightness(1.08)}
.pm-card.viable{background:var(--green-a);border-color:var(--green-b)}
.pm-card.wait{background:var(--amber-a);border-color:var(--amber-b)}
.pm-card.low{background:var(--red-a);border-color:var(--red-b)}
.pm-pair{font-size:9px;font-weight:700;margin-bottom:3px}
.pm-card.viable .pm-pair{color:var(--green)}
.pm-card.wait .pm-pair{color:var(--amber)}
.pm-card.low .pm-pair{color:var(--red)}
.pm-block-lbl{font-size:7px;color:var(--t3);margin-bottom:4px}
.pm-count{font-size:28px;font-weight:700;line-height:1}
.pm-card.viable .pm-count{color:var(--green)}
.pm-card.wait .pm-count{color:var(--amber)}
.pm-card.low .pm-count{color:var(--red)}
.pm-sublabel{font-size:7px;margin-top:3px}
.pm-card.viable .pm-sublabel{color:var(--green)}
.pm-card.wait .pm-sublabel{color:var(--amber)}
.pm-card.low .pm-sublabel{color:var(--red)}
.pm-icon{position:absolute;top:8px;right:10px;font-size:12px}

/* ── GROUP PROPOSALS (list view) ── */
.group-list{margin-bottom:14px}
.gcard{background:var(--bg2);border:1px solid var(--b2);margin-bottom:5px;overflow:hidden;transition:border-color .15s}
.gcard:hover{border-color:var(--b3)}
.gcard.open{border-color:rgba(201,168,76,.4)}
.gc-hdr{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;border-left:3px solid transparent}
.gc-letter{font-family:var(--display);font-size:18px;letter-spacing:2px;min-width:32px}
.gc-slot{font-size:11px;font-weight:600;color:var(--t);flex:1}
.gc-time{font-size:8.5px;color:var(--t2);flex-shrink:0}
.gc-block-tag{font-size:7px;font-weight:700;letter-spacing:.08em;padding:2px 8px;border:1px solid;flex-shrink:0}
.bk-manha{background:rgba(74,143,245,.1);border-color:rgba(74,143,245,.3);color:var(--blue)}
.bk-tarde{background:rgba(155,94,202,.1);border-color:rgba(155,94,202,.3);color:var(--purple)}
.gc-n{font-size:26px;font-weight:700;line-height:1;flex-shrink:0}
.gc-n-lbl{font-size:6.5px;color:var(--t3);letter-spacing:.08em;flex-shrink:0;align-self:flex-end;padding-bottom:2px}
.gc-arrow{font-size:8px;color:var(--t3);transition:transform .18s}
.gcard.open .gc-arrow{transform:rotate(180deg)}
.gc-body{display:none;padding:8px 14px 12px;border-top:1px solid var(--b)}
.gcard.open .gc-body{display:block}
.gc-actions{display:flex;gap:6px;padding:4px 0 8px}
.gbtn{padding:3px 10px;border:1px solid;font-family:var(--mono);font-size:7.5px;cursor:pointer;background:transparent;transition:all .12s}
.gbtn-csv{border-color:var(--green-b);color:var(--green)}.gbtn-csv:hover{background:var(--green-a)}
.gc-stu-row{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:.5px solid rgba(201,168,76,.04)}
.gc-stu-row:last-child{border-bottom:none}
.gc-stu-av{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;flex-shrink:0;border:1px solid}

/* ── SINALIZADOS ── */
.sinal-block{margin-bottom:14px}
.sinal-hdr{display:flex;align-items:center;gap:10px;padding:9px 14px;background:rgba(232,69,90,.04);border:1px solid var(--red-b);border-left:3px solid var(--red);cursor:pointer}
.sinal-hdr:hover{background:rgba(232,69,90,.07)}
.sinal-title{font-size:9px;font-weight:600;color:var(--red);flex:1}
.sinal-count{font-size:22px;font-weight:700;color:var(--red);line-height:1}
.sinal-body{display:none;border:1px solid var(--red-b);border-top:none;padding:10px 14px}
.sinal-body.open{display:block}
.sinal-sub{font-size:7px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(232,69,90,.55);margin:8px 0 5px}
.sinal-stu{display:flex;align-items:flex-start;gap:8px;padding:4px 0;border-bottom:.5px solid rgba(232,69,90,.07)}
.sinal-stu:last-child{border-bottom:none}
.sinal-reason{font-size:6.5px;font-weight:700;padding:1px 5px;border:1px solid;flex-shrink:0}
.sr-sd{background:var(--amber-a);border-color:var(--amber-b);color:var(--amber)}
.sr-iv{background:var(--red-a);border-color:var(--red-b);color:var(--red)}
.sr-ng{background:rgba(155,94,202,.1);border-color:rgba(155,94,202,.3);color:var(--purple)}
.slot-tag{font-size:6.5px;padding:1px 4px;border:1px solid;margin-right:2px}

const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9hcHlnYmVsaW9jZHZpdGJkamJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NjQzNjAsImV4cCI6MjA5MjA0MDM2MH0.-9Uj9Bg3q8sIlqzfzw2Sc1JziaueeyYGNwep-qWhWWg';

function setConn(ok) {

    else { dot.className='live-dot red'; lbl.className='live-lbl'; lbl.textContent='OFFLINE'; }
  }
}

async function sbGet(table, qs) {
  let all = [], page = 0, ps = 1000;
  while (true) {
    const s = page * ps, e = s + ps - 1;
    const r = await fetch(`${SB}/rest/v1/${table}?${qs}`, { headers: { ...H, Range: `${s}-${e}`, Prefer: 'count=none' } });
    if (!r.ok) throw new Error(`${table} HTTP ${r.status}`);
    const d = await r.json(); all = all.concat(d);
    if (d.length < ps) break; page++; if (page > 9) break;
  }
  return all;
}

/* ══════════════════════════════════════════════
   CONSTANTS — all derived from DB at runtime
══════════════════════════════════════════════ */
const DAYS_PT   = ['SEG','TER','QUA','QUI','SEX','SÁB'];
const HOURS_AM  = [8,9,10,11];
const HOURS_PM  = [14,15,16,17,18,19,20];
const ALL_HOURS = [...HOURS_AM, ...HOURS_PM];
const CLASS_DUR = 90; // minutes
const MIN_G     = 5;
const MAX_G     = 17;
const ASSIGN_MIN= 8;

const ALM_PAIRS = [
  { a:0, b:2, aL:'SEG', bL:'QUA', label:'SEG + QUA' },
  { a:1, b:3, aL:'TER', bL:'QUI', label:'TER + QUI' },
  { a:2, b:4, aL:'QUA', bL:'SEX', label:'QUA + SEX' },
  { a:5, b:5, aL:'SÁB', bL:'SÁB', label:'SÁB',      examOnly: true },
];

const DAY_NORM = {
  monday:0,tuesday:1,wednesday:2,thursday:3,friday:4,saturday:5,
  segunda:0,terca:1,'terça':1,quarta:2,quinta:3,sexta:4,sabado:5,'sábado':5,
  seg:0,ter:1,qua:2,qui:3,sex:4,sab:5,'sáb':5,
  mon:0,tue:1,wed:2,thu:3,fri:4,sat:5,
  'segunda-feira':0,'terça-feira':1,'quarta-feira':2,'quinta-feira':3,'sexta-feira':4
};

const LEVEL_MAP = {
  'kids|PI1':        { dept:'kids',     label:'PI 1',       color:'var(--c-inf)', order:1,  maxCap:60  },
  'kids|PI2':        { dept:'kids',     label:'PI 2',       color:'var(--c-inf)', order:2,  maxCap:60  },
  'kids|PI3':        { dept:'kids',     label:'PI 3',       color:'var(--c-inf)', order:3,  maxCap:60  },
  'kids|PI4':        { dept:'kids',     label:'PI 4',       color:'var(--c-inf)', order:4,  maxCap:60  },
  'kids_juv|PJ1':    { dept:'kids_juv', label:'PJ 1',       color:'var(--c-juv)', order:5,  maxCap:90  },
  'kids_juv|PJ2':    { dept:'kids_juv', label:'PJ 2',       color:'var(--c-juv)', order:6,  maxCap:90  },
  'kids_juv|PJ3':    { dept:'kids_juv', label:'PJ 3',       color:'var(--c-juv)', order:7,  maxCap:90  },
  'adults|1':        { dept:'adults',   label:'Ano 1',      color:'var(--c-ger)', order:8,  maxCap:200 },
  'adults|2':        { dept:'adults',   label:'Ano 2',      color:'var(--c-ger)', order:9,  maxCap:200 },
  'adults|3':        { dept:'adults',   label:'Ano 3',      color:'var(--c-ger)', order:10, maxCap:200 },
  'adults|4':        { dept:'adults',   label:'Ano 4',      color:'var(--c-ger)', order:11, maxCap:200 },
  'adults|5':        { dept:'adults',   label:'Ano 5',      color:'var(--c-ger)', order:12, maxCap:200 },
  'adults|Portugues':{ dept:'adults',   label:'Português',  color:'var(--c-ger)', order:13, maxCap:200 },
  'exam|6':          { dept:'exam',     label:'Ano 6 FCE',  color:'var(--c-exa)', order:14, maxCap:60  },
  'exam|7':          { dept:'exam',     label:'Ano 7 CAE',  color:'var(--c-exa)', order:15, maxCap:60  },
  'exam|8':          { dept:'exam',     label:'Ano 8 CPE',  color:'var(--c-exa)', order:16, maxCap:60  },
};

const DEPT_CFG = {
  kids:     { label:'Infantil', color:'var(--c-inf)' },
  kids_juv: { label:'Juvenil',  color:'var(--c-juv)' },
  adults:   { label:'Geral',    color:'var(--c-ger)'  },
  exam:     { label:'Exames',   color:'var(--c-exa)'  },
};
const DEPT_ORDER = ['kids','kids_juv','adults','exam'];

const DEPT_GRADS = {
  kids:     'linear-gradient(145deg,#1A3A6A,#0D2248)',
  kids_juv: 'linear-gradient(145deg,#0D4A3A,#062A20)',
  adults:   'linear-gradient(145deg,#3A2A10,#201408)',
  exam:     'linear-gradient(145deg,#3A1A3A,#200D20)',
};

const GROUP_COLORS = [
  '#E8455A','#E8A020','#1DB87A','#4A8FF5','#9B5ECA','#28C8B0',
  '#F06090','#F0C040','#50D890','#70B0FF','#C080F0','#40E0D0'
];

/* ══════════════════════════════════════════════
   STATE
══════════════════════════════════════════════ */
let allE = [], allR = [], rByRef = {};
let activeLoc = 'all', activeLevelKey = null;
let openDepts = { kids:true, kids_juv:false, adults:false, exam:false };
let currentView = 'heatmap'; // 'heatmap' | 'pins'
let highlightPairIdx = null;
let _lastResult = null;
let _modalGroup = null;

/* ══════════════════════════════════════════════
   HELPERS
══════════════════════════════════════════════ */
// Normalise branch: handles "Funchal", "FUNCHAL", "Camara_Lobos", "CAMARA_LOBOS", "Camara Lobos"
const normB   = b  => (b||'').toUpperCase().replace(/[\s\-]+/g,'_').replace(/_+/g,'_').trim();
const normS   = s  => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
const lk      = e  => `${(e.family||'').toLowerCase()}|${(e.level_code||e.level_cefr||'').trim()}`;
const getLM   = e  => LEVEL_MAP[lk(e)] || { dept:(e.family||'adults'), label:(e.level_code||e.level_cefr||'—'), color:'var(--t3)', order:99, maxCap:60 };
const locStu  = () => activeLoc === 'all' ? allE : allE.filter(e => normB(e.branch) === activeLoc);
const minsToT = m  => `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;

function avCol(name) {
  let h = 0;
  for (let i = 0; i < (name||'?').length; i++) h = (h * 31 + (name||'?').charCodeAt(i)) & 0xffffffff;
  const p = [{bg:'#3A2244',t:'#C8A0E0'},{bg:'#1E2E50',t:'#7AABEE'},{bg:'#1A3A2A',t:'#5EC888'},{bg:'#3A2A14',t:'#D4944A'},{bg:'#3A1A1A',t:'#E07878'},{bg:'#1A2A3A',t:'#5A9EC8'},{bg:'#282838',t:'#9898D8'},{bg:'#2A3820',t:'#80B850'}];
  return p[Math.abs(h) % p.length];
}
function avInit(n) { return (n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }

function parseDayPrefs(raw) {
  if (!raw) return [];
  if (Array.isArray(raw)) return raw;
  try { const p = JSON.parse(raw); return Array.isArray(p) ? p : []; } catch { return []; }
}

function timeToMins(t) {
  if (!t) return null;
  const parts = (t+'').trim().split(':');
  const h = parseInt(parts[0], 10), m = parseInt(parts[1]||'0', 10);
  return isNaN(h) ? null : h * 60 + m;
}

function normDay(raw) {
  if (!raw) return null;
  // Handle numeric (1=Mon ... 6=Sat)
  const n = parseInt(raw);
  if (!isNaN(n) && n >= 1 && n <= 6) return n - 1;
  const key = (raw+'').toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  return DAY_NORM[key] ?? null;
}

/* Parse a slot object from the DB.
   Canonical shape: { day:"Monday", day_short:"SEG", from:"14:30", to:"18:30", available:true }
   We resolve to { dayIdx, fromMins, toMins }
*/
function parseSlot(p) {
  // Day resolution: prefer day_short, fallback to day
  const rawDay = p.day_short || p.day || p.weekday || p.dia || '';
  let dayIdx = normDay(rawDay);
  // If dayIdx still null, try the English full name
  if (dayIdx === null) dayIdx = normDay((rawDay+'').split('-')[0]);
  if (dayIdx === null) return null;
  if (p.available === false) return null;

  const fromMins = timeToMins(p.from || p.session_start || p.start_time || p.time || '');
  const toMins   = timeToMins(p.to   || p.end_time   || '');
  if (fromMins === null) return null;

  return { dayIdx, fromMins, toMins: toMins !== null ? toMins : fromMins + CLASS_DUR };
}

function analysePrefs(ref) {
  const req = rByRef[ref];
  if (!req) return null;
  // slots can be a JSON string, a parsed array, or null; day_preferences is the fallback
  const raw = parseDayPrefs(req.slots || req.day_preferences);
  if (!raw.length) {
    // Surface in console so we can diagnose missing slot data
    if (req.slots || req.day_preferences) console.warn('[ALM] Empty slots after parse for', ref, req.slots);
    return null;
  }

  // Aggregate windows per day: earliest from → latest to
  const byDay = {};
  raw.forEach(p => {
    const s = parseSlot(p);
    if (!s) return;
    if (!byDay[s.dayIdx]) byDay[s.dayIdx] = { dayIdx: s.dayIdx, earliest: s.fromMins, latest: s.toMins };
    else {
      if (s.fromMins < byDay[s.dayIdx].earliest) byDay[s.dayIdx].earliest = s.fromMins;
      if (s.toMins   > byDay[s.dayIdx].latest  ) byDay[s.dayIdx].latest   = s.toMins;
    }
  });

  const windows  = Object.values(byDay);
  const dayIdxs  = windows.map(w => w.dayIdx);
  const sameDay  = new Set(dayIdxs).size === 1 && windows.length >= 2;

  return { windows, dayIdxs, sameDay };
}

/* ══════════════════════════════════════════════
   GROUPING ENGINE
   Finds the best shared start-time for each pair,
   places students greedily, repeats until < MIN_G remain.
══════════════════════════════════════════════ */
function buildProposals(levelKey, branch) {
  const STEP = 30;

  const all = allE.filter(e => {
    if (lk(e) !== levelKey) return false;
    if (branch !== 'all' && normB(e.branch) !== branch) return false;
    return true;
  });

  const withReq   = all.filter(e => !!rByRef[e.ref]);
  const dept      = (LEVEL_MAP[levelKey]||{}).dept || 'adults';
  const placed    = new Set();
  const groups    = [];

  // Bucket: single-day requests — cannot be paired
  const sameDayB  = withReq.filter(e => { const a = analysePrefs(e.ref); return a && a.sameDay; });
  sameDayB.forEach(e => placed.add(e.ref));

  // Bucket: no valid windows
  const invalidB  = withReq.filter(e => { if (placed.has(e.ref)) return false; const a = analysePrefs(e.ref); return !a || a.windows.length === 0; });
  invalidB.forEach(e => placed.add(e.ref));

  // Eligible pool
  const eligible  = withReq.filter(e => !placed.has(e.ref));

  function overlapMins(w, startMins) {
    const endMins = startMins + CLASS_DUR;
    return Math.min(w.latest, endMins) - Math.max(w.earliest, startMins);
  }

  function canAttend(e, dayIdx, startMins) {
    if (placed.has(e.ref)) return false;
    const a = analysePrefs(e.ref);
    if (!a) return false;
    const w = a.windows.find(x => x.dayIdx === dayIdx);
    if (!w) return false;
    return overlapMins(w, startMins) >= CLASS_DUR - 30;
  }

  function getGroup(pool, pair, startA, startB) {
    return pool.filter(e => {
      if (placed.has(e.ref)) return false;
      const a = analysePrefs(e.ref); if (!a) return false;
      const wA = a.windows.find(x => x.dayIdx === pair.a);
      const wB = a.windows.find(x => x.dayIdx === pair.b);
      if (!wA || !wB) return false;
      return overlapMins(wA, startA) >= CLASS_DUR - 30 &&
             overlapMins(wB, startB) >= CLASS_DUR - 30;
    });
  }

  ALM_PAIRS.forEach(pair => {
    if (pair.examOnly && dept !== 'exam') return;

    const pairPool = eligible.filter(e => {
      if (placed.has(e.ref)) return false;
      const a = analysePrefs(e.ref); if (!a) return false;
      return a.windows.find(x => x.dayIdx === pair.a) && a.windows.find(x => x.dayIdx === pair.b);
    });

    if (pairPool.length < MIN_G) return;
    let remaining = [...pairPool];

    while (remaining.length >= MIN_G) {
      // Majority vote: find start time with max students on BOTH days
      let bestStart = null, bestCount = 0;
      for (let t = 8 * 60; t <= 20 * 60 - CLASS_DUR; t += STEP) {
        const count = Math.min(
          remaining.filter(e => canAttend(e, pair.a, t)).length,
          remaining.filter(e => canAttend(e, pair.b, t)).length
        );
        if (count > bestCount) { bestCount = count; bestStart = t; }
      }
      if (!bestStart || bestCount < MIN_G) break;

      const candidates = getGroup(remaining, pair, bestStart, bestStart);
      if (candidates.length < MIN_G) break;

      const groupStudents = candidates.slice(0, MAX_G);
      groupStudents.forEach(e => { placed.add(e.ref); remaining = remaining.filter(r => r.ref !== e.ref); });

      groups.push({
        pair,
        startMins: bestStart,
        startTime: minsToT(bestStart),
        endTime:   minsToT(bestStart + CLASS_DUR),
        students:  groupStudents,
      });
    }
  });

  const sinalizados = [
    ...sameDayB.map(e => ({ e, reason:'same-day' })),
    ...invalidB.map(e => ({ e, reason:'invalid-window' })),
    ...eligible.filter(e => !placed.has(e.ref)).map(e => ({ e, reason:'no-group' })),
  ];

  return {
    groups,
    sinalizados,
    total:       all.length,
    withRequest: withReq.length,
    placed:      groups.reduce((s, g) => s + g.students.length, 0),
    sameDayCt:   sameDayB.length,
    invalidWinCt:invalidB.length,
    noGroupCt:   eligible.filter(e => !placed.has(e.ref)).length,
  };
}

/* ══════════════════════════════════════════════
   HEATMAP
   Counts unique students per day+hour slot,
   based on their availability window.
══════════════════════════════════════════════ */
function buildHeatmap(students) {
  const map = {};
  DAYS_PT.forEach(d => {
    map[d] = {};
    ALL_HOURS.forEach(h => map[d][h] = 0);
  });

  students.forEach(e => {
    const a = analysePrefs(e.ref); if (!a) return;
    a.windows.forEach(w => {
      const day = DAYS_PT[w.dayIdx]; if (!day) return;
      const startH = Math.floor(w.earliest / 60);
      const endH   = Math.floor(w.latest   / 60);
      const seen   = new Set();
      for (let h = startH; h <= endH; h++) {
        if (ALL_HOURS.includes(h) && !seen.has(h)) { seen.add(h); map[day][h]++; }
      }
    });
  });

  return map;
}

function heatColorClass(n, max) {
  if (n === 0) return 'c0';
  const p = n / max;
  if (p < 0.10) return 'c1';
  if (p < 0.20) return 'c2';
  if (p < 0.35) return 'c3';
  if (p < 0.50) return 'c4';
  if (p < 0.65) return 'c5';
  if (p < 0.80) return 'c6';
  return 'c7';
}

/* ══════════════════════════════════════════════
   PAIR COUNTING (for pair matrix cards)
══════════════════════════════════════════════ */
function countPair(students, pair) {
  return students.filter(e => {
    const a = analysePrefs(e.ref); if (!a) return false;
    return a.windows.find(w => w.dayIdx === pair.a) && a.windows.find(w => w.dayIdx === pair.b);
  }).length;
}

    });

      const n = heatmap[day][h] || 0;

      gridHTML += `<div class="hm-cell ${cls}" data-day="${di}" data-h="${h}" title="${day} ${h}h · ${n} aluno${n!==1?'s':''}">${n > 0 ? `<div class="hm-cell-n">${n}</div><div class="hm-cell-sub">al</div>` : ''}</div>`;

    <div class="hm-leg-item"><div class="hm-leg-sq" style="background:rgba(232,160,32,.18)"></div>3–5</div>

/* ── PIN VIEW HTML ── */
function buildPinViewHTML(students, result) {
  const { groups } = result;

  /* Build pair pills */
  const dept = (LEVEL_MAP[activeLevelKey]||{}).dept || 'adults';
  const pairCounts = ALM_PAIRS
    .filter(p => !(p.examOnly && dept !== 'exam'))
    .map(p => ({ pair: p, count: countPair(students, p) }));
  let pillsHTML = '';
  pairCounts.forEach(({ pair, count }, i) => {
    const col = count >= ASSIGN_MIN ? 'var(--green)' : count >= MIN_G ? 'var(--amber)' : 'var(--red)';
    pillsHTML += `<span class="vt-pair-pill" style="border-color:${col}44;color:${col}" id="pill-${i}" onclick="highlightPair(${i},[${pair.a},${pair.b}])">${pair.aL}+${pair.bL} <strong>${count}</strong></span>`;
  });
  document.getElementById('vt-pair-pills').innerHTML = pillsHTML;

  if (!groups.length) {
    return `<div class="pin-grid-wrap">
      <div class="pg-head"><span class="pg-title">📍 Vista de Pinos · Grupos Propostos</span></div>
      <div style="padding:30px;text-align:center;color:var(--t3);font-size:8.5px;letter-spacing:.08em">Nenhum grupo formado para este nível e filial.</div>
    </div>`;
  }

  /* Map: day+hour → list of groups that land there */
  // A group lands in (pair.a, startHour) and (pair.b, startHour)
  const cellGroups = {}; // key: "dayIdx|hour" → [{ groupIdx, group }]
  groups.forEach((g, idx) => {
    const h = Math.floor(g.startMins / 60);
    const days = g.pair.a === g.pair.b ? [g.pair.a] : [g.pair.a, g.pair.b];
    days.forEach(dayIdx => {
      const key = `${dayIdx}|${h}`;
      if (!cellGroups[key]) cellGroups[key] = [];
      cellGroups[key].push({ idx, group: g });
    });
  });

  /* Max pins in any cell — to size row height */
  const maxPins = Math.max(1, ...Object.values(cellGroups).map(a => a.length));
  const cellH   = Math.max(42, Math.ceil(maxPins / 3) * 24 + 10);

  const colTemplate = `72px repeat(${HOURS_AM.length},1fr) 12px repeat(${HOURS_PM.length},1fr)`;
  let gridHTML = `<div class="pg-grid" style="grid-template-columns:${colTemplate};width:100%">`;

  /* Header */
  gridHTML += `<div class="pg-col-hdr" style="text-align:right;padding-right:8px;color:var(--t3);font-size:6.5px">DIA / HORA</div>`;
  HOURS_AM.forEach(h => gridHTML += `<div class="pg-col-hdr">${h}h</div>`);
  gridHTML += `<div class="pg-col-hdr"></div>`;
  HOURS_PM.forEach(h => gridHTML += `<div class="pg-col-hdr">${h}h</div>`);

  DAYS_PT.forEach((day, di) => {
    gridHTML += `<div class="pg-row-lbl">${day}</div>`;
    const buildCell = h => {
      const key  = `${di}|${h}`;
      const cgs  = cellGroups[key] || [];
      const hasPins = cgs.length > 0;
      const style = `min-height:${cellH}px`;
      let pins = '';
      cgs.forEach(({ idx, group }) => {
        const col = GROUP_COLORS[idx % GROUP_COLORS.length];
        const letter = String.fromCharCode(65 + idx);
        const delay  = (idx * 35) + 'ms';
        pins += `<div class="pin pin-${idx % 12}" style="background:${col};color:#fff;animation-delay:${delay}" title="Turma ${letter} · ${group.pair.aL}+${group.pair.bL} · ${group.startTime}–${group.endTime} · ${group.students.length} alunos" onclick="event.stopPropagation();openGroupModal(${idx})">${letter}</div>`;
      });
      const overflow = cgs.length > 9 ? `<div class="pin pin-overflow" title="+mais grupos">+${cgs.length-9}</div>` : '';
      return `<div class="pg-cell${hasPins?' has-pins':''}" style="${style}" data-day="${di}" data-h="${h}" title="${day} ${h}h" onclick="${hasPins?'handleCellClick('+di+','+h+')':''}">${pins}${overflow}</div>`;
    };

    [...HOURS_AM].forEach(h => { gridHTML += buildCell(h); });
    gridHTML += `<div class="pg-cell gap-col"></div>`;
    [...HOURS_PM].forEach(h => { gridHTML += buildCell(h); });
  });

  gridHTML += `</div>`;

  /* Group legend below */
  let legendHTML = `<div style="padding:10px 0 4px;display:flex;flex-wrap:wrap;gap:5px;border-top:.5px solid var(--b2);margin-top:8px">`;
  groups.forEach((g, i) => {
    const col = GROUP_COLORS[i % GROUP_COLORS.length];
    const letter = String.fromCharCode(65 + i);
    legendHTML += `<span style="display:inline-flex;align-items:center;gap:5px;font-size:7.5px;padding:3px 9px;border:1px solid ${col}55;border-radius:2px;cursor:pointer;color:var(--t2)" onclick="openGroupModal(${i})">
      <span style="width:9px;height:9px;border-radius:50%;background:${col};display:inline-block;flex-shrink:0"></span>
      T${letter} · ${g.pair.aL}+${g.pair.bL} · ${g.startTime} · ${g.students.length}al
    </span>`;
  });
  legendHTML += `</div>`;

  return `<div class="pin-grid-wrap">
    <div class="pg-head"><span class="pg-title">📍 Vista de Pinos · ${groups.length} Grupos Propostos</span><span style="font-size:7.5px;color:var(--t3);margin-left:auto">Clique num pino para ver a lista de alunos</span></div>
    <div class="pg-outer">${gridHTML}${legendHTML}</div>
  </div>`;
}

/* ── HANDLE CELL CLICK in pin view (multiple groups → list) ── */
function handleCellClick(dayIdx, h) {
  if (!_lastResult) return;
  const key = `${dayIdx}|${h}`;
  const groups = _lastResult.groups;
  const matching = [];
  groups.forEach((g, idx) => {
    const startH = Math.floor(g.startMins / 60);
    const days = g.pair.a === g.pair.b ? [g.pair.a] : [g.pair.a, g.pair.b];
    if (days.includes(dayIdx) && startH === h) matching.push({ idx, group: g });
  });
  if (matching.length === 1) { openGroupModal(matching[0].idx); return; }
  if (matching.length > 1) {
    // If multiple groups share a cell, open the first. User can navigate from modal.
    openGroupModal(matching[0].idx);
  }
}

/* ══════════════════════════════════════════════
   PAIR HIGHLIGHT
══════════════════════════════════════════════ */
function highlightPair(idx, dayPair) {
  if (highlightPairIdx === idx) { clearHighlight(); return; }
  highlightPairIdx = idx;

  document.querySelectorAll('.vt-pair-pill').forEach((p, i) => p.classList.toggle('dim', i !== idx));

  if (currentView === 'heatmap') {
    const hlDays = dayPair[0] === dayPair[1] ? [dayPair[0]] : [dayPair[0], dayPair[1]];
    document.querySelectorAll('.hm-cell:not(.gap-col)').forEach(c => {
      const d = parseInt(c.dataset.day);
      const inDay = hlDays.includes(d);
      c.classList.toggle('pair-hi', inDay);
      c.classList.toggle('pair-dim', !inDay);
    });
  }

  if (currentView === 'pins') {
    const hlDays = dayPair[0] === dayPair[1] ? [dayPair[0]] : [dayPair[0], dayPair[1]];
    document.querySelectorAll('.pg-cell:not(.gap-col)').forEach(c => {
      const d = parseInt(c.dataset.day);
      const inDay = hlDays.includes(d);
      c.classList.toggle('group-hi', inDay && c.classList.contains('has-pins'));
      c.classList.toggle('group-dim', !inDay);
    });
  }
}

/* ══════════════════════════════════════════════

  const grad = DEPT_GRADS[meta.dept||'adults'] || DEPT_GRADS.adults;
  document.getElementById('gm-hero-bg').style.background = grad;
  document.getElementById('gm-code').textContent  = `T${letter}`;
  document.getElementById('gm-code').style.color  = col;
  document.getElementById('gm-slot').textContent  = `${g.pair.aL} + ${g.pair.bL}`;
  document.getElementById('gm-time').textContent  = `${g.startTime} – ${g.endTime} · ${meta.label||activeLevelKey} · ${dc.label||''}`;
  document.getElementById('gm-n').textContent     = g.students.length;
  document.getElementById('gm-cap-fill').style.width      = capPct + '%';
  document.getElementById('gm-cap-fill').style.background = capPct >= 80 ? 'var(--amber)' : col;

  const sorted = [...g.students].sort((a, b) => (a.name||'').localeCompare(b.name||''));
  document.getElementById('gm-body').innerHTML = sorted.map(e => {
    const av  = avCol(e.name || e.ref);

    const stCol = st === 'atribuido' ? 'var(--green)' : st === 'sem_pedido' ? 'var(--red)' : 'var(--amber)';
    const stTxt = st === 'atribuido' ? 'atribuído' : st === 'sem_pedido' ? 'sem pedido' : 'pendente';
    const br = (BRANCH_LABELS[normB(e.branch)] || e.branch || '—');
    return `<div class="gm-stu" onclick="closeModal();openDossierExt('${e.ref}')">
      <div class="gm-av" style="background:${av.bg};color:${av.t};border-color:${av.t}55">${avInit(e.name||e.ref)}</div>
      <div class="gm-stu-info">
        <div class="gm-stu-name">${e.name||'—'}</div>
        <div class="gm-stu-ref">${e.ref} · ${br}</div>
      </div>
      <span style="font-size:7.5px;font-weight:700;color:${stCol};flex-shrink:0;padding:1px 6px;border:1px solid ${stCol}55">${stTxt}</span>
      <span class="gm-stu-arrow">↗</span>
    </div>`;
  }).join('');

  document.getElementById('gm-overlay').classList.add('open');
}

    const st = rByRef[e.ref] ? normS(rByRef[e.ref].status) : 'sem pedido';
    const br = BRANCH_LABELS[normB(e.branch)] || e.branch || '—';
    rows.push(`"${e.name||''}","${e.ref||''}","${br}","${st}"`);
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([rows.join('\n')], { type: 'text/csv;charset=utf-8;' }));
  a.download = `ALM-T${letter}-${g.pair.aL}${g.pair.bL}.csv`;
  a.click();
  showToast(`CSV exportado · ${g.students.length} alunos`, 'ok');
}

/* External dossier opener — bridges to whatever dossier system is deployed */
function openDossierExt(ref) {
  // Try same-page openDossier first (if loaded inside the overview shell)
  if (typeof window.openDossier === 'function') { window.openDossier(ref, 'director'); return; }
  // Fallback: navigate with ref as query param
  window.open(`/admin/alm-painel-central?num=${ref.replace('ALM-','')}`, '_blank');
}

/* ══════════════════════════════════════════════
   RENDER LEVEL CONTENT
══════════════════════════════════════════════ */
function renderLevelContent() {
  const area = document.getElementById('scroll-area');
  if (!activeLevelKey) {
    area.innerHTML = `<div class="placeholder-main"><div class="placeholder-icon">◈</div><div class="placeholder-text">Seleccione um nível para ver os dados</div></div>`;
    return;
  }

  const allStudents   = locStu().filter(e => lk(e) === activeLevelKey);
  const withReq       = allStudents.filter(e => !!rByRef[e.ref]);
  const noReq         = allStudents.length - withReq.length;
  const meta          = LEVEL_MAP[activeLevelKey] || getLM(allStudents[0] || {});
  const dc            = DEPT_CFG[meta.dept] || {};
  const capPct        = Math.round(allStudents.length / (meta.maxCap || 60) * 100);

  /* Level header */
  const hdr = document.getElementById('level-hdr');
  const placed = _lastResult ? _lastResult.placed : 0;
  const sinal  = _lastResult ? _lastResult.sinalizados.length : 0;
  hdr.innerHTML = `
    <div class="lh-name" style="color:${meta.color}">${meta.label}</div>
    <div class="lh-dept" style="color:${dc.color}">${dc.label||''}</div>
    <div class="lh-stats">
      <div class="lh-stat"><div class="lh-v" style="color:var(--gold2)">${allStudents.length}</div><div class="lh-l">Inscritos</div></div>
      <div class="lh-stat"><div class="lh-v" style="color:var(--green)">${withReq.length}</div><div class="lh-l">Com pedido</div></div>
      <div class="lh-stat"><div class="lh-v" style="color:var(--red)">${noReq}</div><div class="lh-l">Sem pedido</div></div>
      ${_lastResult ? `<div class="lh-stat"><div class="lh-v" style="color:var(--teal)">${placed}</div><div class="lh-l">Em turma</div><div class="lh-cap-bar"><div class="lh-cap-fill" style="width:${withReq.length?Math.round(placed/withReq.length*100):0}%;background:var(--teal)"></div></div></div>` : ''}
      ${_lastResult ? `<div class="lh-stat"><div class="lh-v" style="color:var(--amber)">${sinal}</div><div class="lh-l">Sinalizados</div></div>` : ''}
      <div class="lh-stat"><div class="lh-v" style="color:${capPct>80?'var(--amber)':'var(--t2)'}">${capPct}%</div><div class="lh-l">Capacidade</div><div class="lh-cap-bar"><div class="lh-cap-fill" style="width:${capPct}%;background:${meta.color}"></div></div></div>
    </div>`;

  document.getElementById('view-toggle-bar').style.display = withReq.length ? 'flex' : 'none';

  if (!withReq.length) {
    area.innerHTML = `<div class="placeholder-main" style="padding-top:40px;display:flex;flex-direction:column;align-items:center;gap:8px"><div style="font-size:22px;opacity:.2">📭</div><div style="font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);opacity:.55">Nenhum pedido de horário submetido neste nível</div></div>`;
    return;
  }

  let html = '';

  /* Grid view (heatmap OR pins) */
  if (currentView === 'heatmap') {
    html += buildHeatmapHTML(withReq, _lastResult);
  } else {
    html += buildPinViewHTML(withReq, _lastResult);
  }

  /* Group proposals list */
  if (_lastResult && _lastResult.groups.length) {
    html += `<div class="sec" style="margin-top:14px">Turmas Propostas · ${_lastResult.groups.length} grupo${_lastResult.groups.length!==1?'s':''} · ${_lastResult.placed} alunos alocados</div>`;
    html += `<div class="group-list">`;
    _lastResult.groups.forEach((g, i) => {
      const col    = GROUP_COLORS[i % GROUP_COLORS.length];
      const letter = String.fromCharCode(65 + i);
      const dept   = (LEVEL_MAP[activeLevelKey]||{}).dept || 'adults';
      html += `<div class="gcard" id="gcard-${i}">
        <div class="gc-hdr" style="border-left-color:${col}" onclick="toggleGCard(${i})">
          <div class="gc-letter" style="color:${col}">T${letter}</div>
          <div class="gc-slot">${g.pair.aL} + ${g.pair.bL}</div>
          <div class="gc-time">${g.startTime} – ${g.endTime}</div>
          <div class="gc-block-tag ${g.startMins < 720 ? 'bk-manha':'bk-tarde'}">${g.startMins < 720 ? 'Manhã':'Tarde'}</div>
          <div class="gc-n" style="color:${col}">${g.students.length}</div>
          <div class="gc-n-lbl">/ ${MAX_G}</div>
          <div class="gc-arrow">▼</div>
        </div>
        <div class="gc-body">
          <div class="gc-actions"><button class="gbtn gbtn-csv" onclick="event.stopPropagation();exportGroup(${i})">↓ CSV</button></div>
          ${[...g.students].sort((a,b)=>(a.name||'').localeCompare(b.name||'')).map(e => {
            const av = avCol(e.name||e.ref);
            const st = rByRef[e.ref] ? normS(rByRef[e.ref].status) : 'sem_pedido';
            const stCol = st==='atribuido'?'var(--green)':st==='sem_pedido'?'var(--red)':'var(--amber)';
            const stTxt = st==='atribuido'?'atribuído':st==='sem_pedido'?'sem pedido':'pendente';
            return `<div class="gc-stu-row">
              <div class="gc-stu-av" style="background:${av.bg};color:${av.t};border-color:${av.t}55">${avInit(e.name||e.ref)}</div>
              <div style="flex:1;min-width:0;cursor:pointer" onclick="openDossierExt('${e.ref}')">
                <div style="font-size:9.5px;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e.name||'—'}</div>
                <div style="font-size:7.5px;color:var(--t3)">${e.ref}</div>
              </div>
              <span style="font-size:7px;font-weight:700;color:${stCol};padding:1px 6px;border:1px solid ${stCol}55;flex-shrink:0">${stTxt}</span>
            </div>`;
          }).join('')}
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  /* Sinalizados */
  if (_lastResult && _lastResult.sinalizados.length) {
    const { sinalizados, sameDayCt, invalidWinCt, noGroupCt } = _lastResult;
    html += `<div class="sinal-block">
      <div class="sinal-hdr" onclick="toggleSinal()">
        <div style="flex:1">
          <div class="sinal-title">⚠ Sinalizados · não alocados</div>
          <div style="font-size:7px;color:rgba(232,69,90,.5);margin-top:2px">
            ${sameDayCt?`${sameDayCt} mesmo dia · `:''}${invalidWinCt?`${invalidWinCt} horário inválido · `:''}${noGroupCt?`${noGroupCt} sem grupo`:''}
          </div>
        </div>
        <div class="sinal-count">${sinalizados.length}</div>
        <div style="font-size:8px;color:var(--red-b);transition:transform .18s" id="sinal-arr">▼</div>
      </div>
      <div class="sinal-body" id="sinal-body">
        ${[{k:'same-day',lbl:'Mesmo dia'},{k:'invalid-window',lbl:'Horário inválido'},{k:'no-group',lbl:'Sem grupo compatível'}].map(({k,lbl})=>{
          const sub = sinalizados.filter(s => s.reason === k);
          if (!sub.length) return '';
          return `<div class="sinal-sub">${lbl}</div>` + sub.map(({e}) => {
            const a = analysePrefs(e.ref);
            const slots = (a?.windows||[]).map(w => {
              const d = DAYS_PT[w.dayIdx]||'?';
              return `<span class="slot-tag slot-ok">${d} ${minsToT(w.earliest)}</span>`;
            }).join('');
            const br = BRANCH_LABELS[normB(e.branch)] || e.branch || '—';
            return `<div class="sinal-stu">
              <span class="sinal-reason ${k==='same-day'?'sr-sd':k==='invalid-window'?'sr-iv':'sr-ng'}">${k==='same-day'?'SD':k==='invalid-window'?'IV':'NG'}</span>
              <div style="flex:1;min-width:0">
                <div style="font-size:9px;color:var(--t);cursor:pointer" onclick="openDossierExt('${e.ref}')">${e.name||'—'}</div>
                <div style="font-size:7px;color:var(--t3);margin-bottom:3px">${e.ref} · ${br}</div>
                <div>${slots}</div>
              </div>
            </div>`;
          }).join('');
        }).join('')}
      </div>
    </div>`;
  }

  /* Student table */
  html += `<div class="stu-sec-hdr" style="margin-top:14px">Alunos · ${allStudents.length} registos</div>
  <div class="stu-hdr"><span>Nome</span><span>Disponibilidade</span><span>Status</span></div>`;

  allStudents.sort((a,b) => (a.name||'').localeCompare(b.name||'')).forEach(e => {
    const a = analysePrefs(e.ref);
    const dayIdxs = a ? a.dayIdxs : [];
    const cells   = DAYS_PT.map((_,di) => `<div class="hcell${dayIdxs.includes(di)?' on':''}"></div>`).join('');
    const st      = rByRef[e.ref] ? normS(rByRef[e.ref].status) : 'sem_pedido';
    const stCol   = st==='atribuido'?'var(--green)':st==='sem_pedido'?'var(--red)':'var(--amber)';
    const stTxt   = st==='atribuido'?'atribuído':st==='sem_pedido'?'sem pedido':'pendente';
    html += `<div class="stu-row">
      <div class="stu-cell" style="cursor:pointer" onclick="openDossierExt('${e.ref}')">
        <div style="font-size:9px;color:var(--t)">${e.name||'—'}</div>
        <div style="font-size:7px;color:var(--t3)">${e.ref||'—'}</div>
      </div>
      <div class="stu-cell"><div class="heatstrip">${cells}</div><div style="font-size:5.5px;color:var(--t4);margin-top:2px;letter-spacing:.04em">S T Q Q S S</div></div>
      <div class="stu-cell"><span style="font-size:7px;font-weight:700;color:${stCol};padding:1px 6px;border:1px solid ${stCol}55">${stTxt}</span></div>
    </div>`;
  });

  area.innerHTML = html;
  clearHighlight();
}

function toggleGCard(i) { document.getElementById(`gcard-${i}`)?.classList.toggle('open'); }

let _sinalOpen = false;
function toggleSinal() {
  _sinalOpen = !_sinalOpen;
  document.getElementById('sinal-body')?.classList.toggle('open', _sinalOpen);
  const arr = document.getElementById('sinal-arr');
  if (arr) arr.style.transform = _sinalOpen ? 'rotate(180deg)' : '';
}

function exportGroup(idx) {
  if (!_lastResult?.groups[idx]) return;
  const g      = _lastResult.groups[idx];
  const letter = String.fromCharCode(65 + idx);
  const meta   = LEVEL_MAP[activeLevelKey] || {};
  const rows   = [`ALM · ${meta.label||activeLevelKey} · T${letter} · ${g.pair.aL}+${g.pair.bL} · ${g.startTime}–${g.endTime}`, `Total: ${g.students.length}`, '', 'Nome,Ref,Filial,Estado'];
  g.students.forEach(e => {
    const st = rByRef[e.ref] ? normS(rByRef[e.ref].status) : 'sem pedido';
    const br = BRANCH_LABELS[normB(e.branch)] || e.branch || '—';
    rows.push(`"${e.name||''}","${e.ref||''}","${br}","${st}"`);
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([rows.join('\n')], { type:'text/csv;charset=utf-8;' }));
  a.download = `ALM-T${letter}-${meta.label||''}.csv`.replace(/\s/g,'_');
  a.click();
  showToast(`CSV T${letter} exportado`, 'ok');
}

/* ══════════════════════════════════════════════
   SIDEBAR
══════════════════════════════════════════════ */
const BRANCH_LABELS = { FUNCHAL:'Funchal', CAMARA_LOBOS:'C. Lobos', SANTA_CRUZ:'S. Cruz', MACHICO:'Machico', RIBEIRA_BRAVA:'R. Brava', CALHETA:'Calheta' };
const BRANCH_ORDER  = ['FUNCHAL','CAMARA_LOBOS','SANTA_CRUZ','MACHICO','RIBEIRA_BRAVA','CALHETA'];

function initBranchStrip() {
  const branches = [...new Set(allE.map(e => normB(e.branch)).filter(Boolean))];
  const ordered  = BRANCH_ORDER.filter(b => branches.includes(b)).concat(branches.filter(b => !BRANCH_ORDER.includes(b)));
  document.getElementById('branch-strip').innerHTML =
    `<button class="btab active" onclick="setLoc('all',this)">Tudo</button>` +
    ordered.map(b => `<button class="btab" onclick="setLoc('${b}',this)">${BRANCH_LABELS[b]||b}</button>`).join('');
}

function setLoc(loc, btn) {
  activeLoc = loc;
  document.querySelectorAll('.btab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  activeLevelKey = null;
  _lastResult    = null;
  updateSidebarKPIs();
  renderTree();
  renderLevelContent();
}

function updateSidebarKPIs() {
  const students = locStu();
  const com = students.filter(e => rByRef[e.ref]).length;
  document.getElementById('st-total').textContent = students.length;
  document.getElementById('st-com').textContent   = com;
  document.getElementById('st-sem').textContent   = students.length - com;
}

function renderTree() {
  const students = locStu();
  const tree = {};
  students.forEach(e => {
    const meta = LEVEL_MAP[lk(e)] || {};
    const dk   = meta.dept || (e.family||'adults').toLowerCase();
    const key  = lk(e);
    if (!tree[dk]) tree[dk] = {};
    if (!tree[dk][key]) tree[dk][key] = [];
    tree[dk][key].push(e);
  });

  let html = '';
  DEPT_ORDER.forEach(dk => {
    if (!tree[dk]) return;
    const dc      = DEPT_CFG[dk] || { label: dk, color: 'var(--t3)' };
    const isOpen  = openDepts[dk];
    const dStu    = Object.values(tree[dk]).flat();
    const sortedK = Object.keys(tree[dk]).sort((a,b) => (LEVEL_MAP[a]?.order||99) - (LEVEL_MAP[b]?.order||99));

    html += `<div class="dept-hdr" onclick="toggleDept('${dk}')">
      <div class="dept-bar" style="background:${dc.color}"></div>
      <div class="dept-name" style="color:${dc.color}">${dc.label}</div>
      <div class="dept-n">${dStu.length} al</div>
      <div class="dept-arr${isOpen?' open':''}">▶</div>
    </div>
    <div class="level-list${isOpen?' open':''}">`;

    sortedK.forEach(key => {
      const ls    = tree[dk][key];
      const meta  = LEVEL_MAP[key] || {};
      const noReq = ls.filter(e => !rByRef[e.ref]).length;
      const isAct = activeLevelKey === key;
      const bCls  = noReq > 0 ? 'lv-badge-warn' : 'lv-badge-ok';
      const bTxt  = noReq > 0 ? `${noReq} s/p` : 'ok';
      html += `<div class="lv-item${isAct?' active':''}" onclick="selectLevel('${key}')">
        <div class="lv-dot" style="background:${meta.color||'var(--t3)'}"></div>
        <div class="lv-name">${meta.label||key}</div>
        <div class="lv-n">${ls.length}</div>
        <div class="lv-badge ${bCls}">${bTxt}</div>
      </div>`;
    });

    html += `</div>`;
  });

  document.getElementById('level-tree').innerHTML = html || `<div style="padding:20px;font-size:8px;color:var(--t3);text-align:center">Sem dados para esta filial.</div>`;
}

function toggleDept(dk) { openDepts[dk] = !openDepts[dk]; renderTree(); }

function selectLevel(key) {
  activeLevelKey = key;
  _sinalOpen     = false;
  highlightPairIdx = null;
  renderTree();

  // Compute proposals
  const studentsForLevel = locStu().filter(e => lk(e) === key);
  const withReq = studentsForLevel.filter(e => !!rByRef[e.ref]);
  _lastResult = withReq.length >= MIN_G ? buildProposals(key, activeLoc) : null;

  renderLevelContent();
}

/* ══════════════════════════════════════════════
   BOOT
══════════════════════════════════════════════ */
async function boot() {
  try {
    const [enrol, reqs] = await Promise.all([
      sbGet('enrolments',         `select=ref,name,branch,lang,family,level_code,level_cefr&academic_year=eq.${AY}&order=ref&limit=2000`),
      sbGet('timetable_requests', `select=ref,branch,family,level_code,level_cefr,slots,day_preferences,status&academic_year=eq.${AY}&limit=2000`),
    ]);

    setConn(true);
    allE = enrol || []; allR = reqs || []; rByRef = {};
    allR.forEach(r => { rByRef[r.ref] = r; });

    const tot = allE.length, sem = allE.filter(e => !rByRef[e.ref]).length;
    document.getElementById('pill-total').textContent = `${tot} al`;
    document.getElementById('pill-status').textContent = `Supabase OK`;
    document.getElementById('pill-status').className = 'tb-pill ok';

    updateSidebarKPIs();
    initBranchStrip();
    renderTree();

    showToast(`${tot} inscritos · ${allR.length} pedidos`, 'ok');
  } catch (err) {
    setConn(false);
    document.getElementById('pill-status').textContent = 'Erro DB';
    document.getElementById('pill-status').className = 'tb-pill err';
    document.getElementById('scroll-area').innerHTML = `<div style="margin:20px;padding:14px;background:var(--red-a);border:1px solid var(--red-b);color:var(--red);font-size:9px">Erro: ${err.message}</div>`;
    showToast('Erro Supabase: ' + err.message, 'err');
  }
}

let _toastT;
function showToast(msg, type = 'ok') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast ${type} show`;
  clearTimeout(_toastT); _toastT = setTimeout(() => t.classList.remove('show'), 2800);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); }
});

boot();
</script>
