<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ALM · 2026/2027</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9A84C;--gold2:#E8C97A;--gold3:rgba(201,168,76,.15);--gold4:rgba(201,168,76,.06);
  --green:#1DB87A;--green-a:rgba(29,184,122,.14);--green-b:rgba(29,184,122,.3);
  --red:#E8455A;--red-a:rgba(232,69,90,.12);--red-b:rgba(232,69,90,.3);
  --amber:#E8A020;--amber-a:rgba(232,160,32,.13);--amber-b:rgba(232,160,32,.3);
  --teal:#28C8B0;--purple:#9B5ECA;--blue:#4A8FF5;
  --bg:#07060E;--bg2:#0E0B1A;--bg3:#141025;
  --b:rgba(201,168,76,.07);--b2:rgba(201,168,76,.16);--b3:rgba(201,168,76,.30);
  --t:rgba(238,218,168,.92);--t2:rgba(210,188,140,.52);--t3:rgba(210,188,140,.26);--t4:rgba(210,188,140,.10);
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',system-ui,sans-serif;
  --c-juv:#28C8B0;--c-ger:#C8A44A;--c-exa:#9B5ECA;--c-inf:#4A8FF5;
}
html,body{height:100%;background:var(--bg);color:var(--t);font-family:var(--mono);font-size:12px;-webkit-font-smoothing:antialiased;overflow:hidden}
body{display:flex;flex-direction:column}

/* ══ TOPBAR ══ */
.topbar{
  flex-shrink:0;height:50px;display:flex;align-items:center;
  background:rgba(7,6,14,.99);border-bottom:1px solid var(--b2);
  position:relative;z-index:200;
}

/* HOME */
.home-btn{
  display:flex;align-items:center;gap:7px;
  padding:0 16px;height:100%;
  border-right:1px solid var(--b);
  text-decoration:none;flex-shrink:0;
  transition:background .15s;
}
.home-btn:hover{background:var(--gold4)}
.home-icon{font-size:13px;color:var(--t3);transition:color .15s}
.home-btn:hover .home-icon{color:var(--gold2)}
.home-label{font-size:7px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t4);transition:color .15s}
.home-btn:hover .home-label{color:var(--gold)}

/* BRAND */
.brand{
  display:flex;align-items:center;
  padding:0 18px;height:100%;
  border-right:1px solid var(--b);flex-shrink:0;
}
.brand-alm{font-size:18px;font-weight:700;letter-spacing:8px;color:var(--gold2)}
.brand-yr{font-size:7px;color:var(--t3);letter-spacing:.14em;margin-left:8px;align-self:flex-end;padding-bottom:3px}

/* TABS */
.tabs{display:flex;align-items:stretch;height:100%;flex:1;overflow:hidden}

/* Panel tabs (Overview, Audit) stay in-page */
.tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 20px;cursor:pointer;
  border-right:1px solid var(--b);border-bottom:2px solid transparent;
  transition:all .18s;position:relative;flex-shrink:0;gap:3px;
  text-decoration:none;
}
.tab:hover{background:var(--gold4)}
.tab.active{background:rgba(201,168,76,.05);border-bottom-color:var(--gold)}
.tab-num{
  font-size:7px;font-weight:700;letter-spacing:.08em;color:var(--t4);
  width:16px;height:16px;border:1px solid var(--b);
  display:flex;align-items:center;justify-content:center;transition:all .18s;
}
.tab.active .tab-num{background:var(--gold);color:#07060E;border-color:var(--gold)}
.tab-label{font-size:8px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);transition:color .18s;white-space:nowrap}
.tab.active .tab-label{color:var(--gold2)}
.tab:hover .tab-label{color:var(--t2)}
.tab-badge{
  position:absolute;top:7px;right:7px;
  background:var(--red);color:#fff;font-size:6px;font-weight:700;
  padding:1px 4px;min-width:14px;text-align:center;border-radius:6px;line-height:1.4;
}

/* Link tabs (Formation, Decision, Assign) navigate to external files */
.tab-link{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 20px;
  border-right:1px solid var(--b);border-bottom:2px solid transparent;
  transition:all .18s;position:relative;flex-shrink:0;gap:3px;
  text-decoration:none;cursor:pointer;
}
.tab-link:hover{background:var(--gold4);border-bottom-color:var(--b2)}
.tab-link .tab-num{
  font-size:7px;font-weight:700;letter-spacing:.08em;color:var(--t4);
  width:16px;height:16px;border:1px solid var(--b);
  display:flex;align-items:center;justify-content:center;transition:all .18s;
}
.tab-link:hover .tab-num{background:var(--b2);color:var(--gold);border-color:var(--b2)}
.tab-link .tab-label{font-size:8px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);transition:color .18s;white-space:nowrap}
.tab-link:hover .tab-label{color:var(--t2)}
.tab-link-arrow{font-size:7px;color:var(--t4);transition:color .15s;margin-top:1px}
.tab-link:hover .tab-link-arrow{color:var(--gold)}

.topbar-right{
  margin-left:auto;display:flex;align-items:center;gap:8px;
  padding:0 14px;border-left:1px solid var(--b);height:100%;flex-shrink:0;
}
.live{display:flex;align-items:center;gap:5px}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.live-lbl{font-size:7px;font-weight:700;letter-spacing:.1em;color:var(--green)}
.topbar-pill{font-size:7px;font-weight:600;letter-spacing:.08em;padding:2px 9px;border:1px solid var(--b2);color:var(--t2)}
.topbar-pill.gold{color:var(--gold2);border-color:var(--b3);background:var(--gold4)}
.topbar-pill.ok{color:var(--green);border-color:var(--green-b)}
.topbar-pill.err{color:var(--red);border-color:var(--red-b)}
.topbar-pill.loading{color:var(--amber);border-color:var(--amber-b)}

/* ══ PANELS ══ */
.panels{flex:1;overflow:hidden;position:relative}
.panel{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  display:none;
  scrollbar-width:thin;scrollbar-color:var(--b) transparent;
}
.panel.active{display:block;animation:fadeIn .18s ease}
.panel.active.flex-panel{display:flex!important;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.panel::-webkit-scrollbar{width:3px}
.panel::-webkit-scrollbar-thumb{background:var(--b2)}

/* overview is split */
#panel-overview{flex-direction:row}

/* ══ SHARED ══ */
.sec{
  font-size:7.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--gold);display:flex;align-items:center;gap:10px;margin-bottom:10px;
}
.sec::after{content:'';flex:1;height:.5px;background:var(--b2)}
.badge{font-size:6.5px;font-weight:700;padding:1px 6px;border:1px solid}
.badge-ok{background:var(--green-a);border-color:var(--green-b);color:var(--green)}
.badge-warn{background:var(--amber-a);border-color:var(--amber-b);color:var(--amber)}
.badge-err{background:var(--red-a);border-color:var(--red-b);color:var(--red)}
.spinner-wrap{
  display:flex;align-items:center;justify-content:center;
  padding:60px;color:var(--t3);gap:10px;font-size:9px;letter-spacing:.1em;
}
.spinner{
  width:14px;height:14px;border:1.5px solid var(--b2);border-top-color:var(--gold);
  border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;
}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-msg{padding:40px;text-align:center;color:var(--t3);font-size:9px;letter-spacing:.1em}
.err-msg{
  padding:20px;background:var(--red-a);border:1px solid var(--red-b);
  color:var(--red);font-size:9px;margin:16px 20px;
}
.toast{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(8px);
  padding:5px 18px;font-size:9px;font-weight:500;
  opacity:0;transition:all .2s;z-index:9000;pointer-events:none;
  border:1px solid;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--green-a);border-color:var(--green-b);color:var(--green)}
.toast.warn{background:var(--amber-a);border-color:var(--amber-b);color:var(--amber)}
.toast.err{background:var(--red-a);border-color:var(--red-b);color:var(--red)}

/* ══ OVERVIEW LEFT ══ */
.ov-left{
  width:290px;flex-shrink:0;
  border-right:1px solid var(--b2);
  overflow-y:auto;overflow-x:hidden;
  display:flex;flex-direction:column;
}
.ov-left::-webkit-scrollbar{width:3px}
.ov-left::-webkit-scrollbar-thumb{background:var(--b2)}

.ov-stats{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:1px;background:var(--b);border-bottom:1px solid var(--b2);flex-shrink:0;
}
.ov-stat{padding:12px 10px;background:var(--bg)}
.ov-stat-v{font-size:20px;font-weight:700;line-height:1}
.ov-stat-l{font-size:6px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-top:3px}

.loc-tabs{
  display:flex;flex-wrap:wrap;gap:3px;
  padding:10px 10px 6px;border-bottom:1px solid var(--b);flex-shrink:0;
}
.loc-tab{
  font-size:7.5px;font-weight:600;letter-spacing:.06em;
  padding:3px 9px;border:1px solid var(--b);
  cursor:pointer;color:var(--t3);transition:all .13s;
  background:transparent;font-family:var(--mono);
}
.loc-tab:hover{color:var(--t2);border-color:var(--b2)}
.loc-tab.active{background:var(--gold3);border-color:var(--gold);color:var(--gold2)}

/* level tree */
.dept-block{border-bottom:1px solid var(--b)}
.dept-hdr{
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;cursor:pointer;user-select:none;
}
.dept-hdr:hover{background:rgba(255,255,255,.015)}
.dept-bar{width:3px;height:14px;flex-shrink:0}
.dept-hdr-name{font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;flex:1}
.dept-hdr-n{font-size:8px;color:var(--t3)}
.dept-arrow{font-size:8px;color:var(--t4);transition:transform .18s}
.dept-arrow.open{transform:rotate(90deg)}
.level-list{display:none}
.level-list.open{display:block}
.level-item{
  display:flex;align-items:center;gap:7px;
  padding:6px 12px 6px 22px;
  cursor:pointer;border-left:2px solid transparent;transition:all .12s;
}
.level-item:hover{background:rgba(255,255,255,.02)}
.level-item.active{background:var(--gold4);border-left-color:var(--gold)}
.level-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.level-item-name{font-size:9px;font-weight:600;flex:1}
.level-item-n{font-size:8px;color:var(--t3);min-width:26px;text-align:right}
.level-item-badge{font-size:6px;font-weight:700;padding:1px 5px;border:1px solid;flex-shrink:0}

/* ══ OVERVIEW RIGHT ══ */
.ov-right{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 20px 40px}
.ov-right::-webkit-scrollbar{width:3px}
.ov-right::-webkit-scrollbar-thumb{background:var(--b2)}

.placeholder{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:60%;color:var(--t3);gap:8px;
}
.placeholder-icon{font-size:24px;opacity:.25}
.placeholder-text{font-size:8px;letter-spacing:.14em;text-transform:uppercase;opacity:.5}

/* dept summary bars */
.dept-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:.5px solid var(--b)}
.dept-row:last-child{border-bottom:none}
.dept-row-name{font-size:10px;font-weight:600;width:70px;flex-shrink:0}
.dept-track{flex:1;height:4px;background:rgba(255,255,255,.04)}
.dept-fill{height:100%;transition:width .8s ease}
.dept-n{font-size:9px;color:var(--t2);width:34px;text-align:right;flex-shrink:0}

/* action rows */
.action-row{
  display:flex;align-items:center;gap:10px;
  padding:10px 0;border-bottom:.5px solid var(--b);font-size:9px;
}
.action-row:last-child{border-bottom:none}
.action-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.action-btn{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 13px;border:1px solid;cursor:pointer;
  font-family:var(--mono);font-size:8px;font-weight:700;
  letter-spacing:.06em;transition:all .13s;background:transparent;
  text-decoration:none;margin-left:auto;
}
.action-btn-gold{border-color:var(--b2);color:var(--gold)}
.action-btn-gold:hover{background:var(--gold3)}
.action-btn-green{border-color:var(--green-b);color:var(--green)}
.action-btn-green:hover{background:var(--green-a)}

/* slot count cards */
.slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin-bottom:16px}
.slot-card{
  background:var(--bg2);border:1px solid var(--b);
  padding:12px;cursor:pointer;transition:all .15s;position:relative;
}
.slot-card:hover{border-color:var(--b2);transform:translateY(-1px)}
.slot-card.chosen{border-color:var(--gold);background:var(--gold4)}
.slot-card-count{font-size:28px;font-weight:700;line-height:1}
.slot-card-time{font-size:8px;color:var(--t2);margin-top:4px}
.slot-card-day{font-size:7px;color:var(--t3);margin-top:1px;letter-spacing:.06em;text-transform:uppercase}
.slot-pct-badge{font-size:6.5px;font-weight:700;padding:1px 5px;border:1px solid;position:absolute;top:8px;right:8px}
.slot-pct-badge.hi{background:var(--green-a);border-color:var(--green-b);color:var(--green)}
.slot-pct-badge.mid{background:var(--amber-a);border-color:var(--amber-b);color:var(--amber)}
.slot-pct-badge.lo{background:var(--red-a);border-color:var(--red-b);color:var(--red)}

/* student list */
.student-hdr{
  display:grid;grid-template-columns:1fr 120px 70px;
  font-size:7px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--t3);padding:5px 0 8px;
  border-bottom:1px solid var(--b2);margin-bottom:2px;
}
.student-hdr span{padding:0 4px}
.student-row{
  display:grid;grid-template-columns:1fr 120px 70px;
  align-items:center;
  border-bottom:.5px solid rgba(201,168,76,.04);transition:background .1s;
}
.student-row:hover{background:rgba(201,168,76,.02)}
.sr-cell{padding:6px 4px}
.heatstrip{display:flex;gap:1px}
.hcell{width:11px;height:9px;border-radius:1px;background:rgba(255,255,255,.04);border:.5px solid rgba(255,255,255,.04)}
.hcell.on{background:rgba(40,200,176,.35);border-color:rgba(40,200,176,.5)}

/* level summary */
.level-summary{
  background:var(--bg3);border:1px solid var(--b2);
  padding:14px;margin-bottom:14px;
  display:flex;gap:20px;flex-wrap:wrap;align-items:flex-end;
}
.ls-stat{display:flex;flex-direction:column;gap:2px}
.ls-v{font-size:22px;font-weight:700;line-height:1}
.ls-l{font-size:6.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}
.cap-bar{height:3px;background:rgba(255,255,255,.04);flex:1;margin-bottom:6px;overflow:hidden}
.cap-fill{height:100%;transition:width .6s}

/* ══ AUDIT ══ */
.audit-wrap{padding:0 20px 40px}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;padding:18px 0 14px}
.kpi{background:var(--bg2);border:1px solid var(--b);padding:11px 13px;position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1.5px;background:linear-gradient(90deg,transparent,currentColor,transparent)}
.kpi-v{font-size:22px;font-weight:700;line-height:1}
.kpi-l{font-size:6.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin-top:3px}
.filter-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.fbt{
  font-size:7.5px;font-weight:600;letter-spacing:.06em;
  padding:3px 10px;border:1px solid var(--b);
  cursor:pointer;color:var(--t3);transition:all .13s;
  background:transparent;font-family:var(--mono);
}
.fbt:hover{color:var(--t2);border-color:var(--b2)}
.fbt.act{background:var(--gold4);border-color:var(--gold);color:var(--gold2)}
.fbt-sep{width:.5px;background:var(--b2);margin:0 4px;align-self:stretch}
.search-box{
  margin-left:auto;background:var(--bg2);border:1px solid var(--b);
  padding:4px 9px;font-family:var(--mono);font-size:9px;color:var(--t);outline:none;width:180px;
}
.search-box:focus{border-color:var(--b2)}
.audit-hdr{
  display:grid;grid-template-columns:180px 100px 1fr 80px;
  font-size:7px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--t3);padding:5px 0 8px;border-bottom:1px solid var(--b2);
}
.audit-hdr span{padding:0 4px}
.audit-row{
  display:grid;grid-template-columns:180px 100px 1fr 80px;
  align-items:center;
  border-bottom:.5px solid rgba(201,168,76,.04);transition:background .1s;
}
.audit-row:hover{background:rgba(201,168,76,.02)}
.ar-cell{padding:7px 4px}
</style>
</head>
<body>

<!-- ══ TOPBAR ══ -->
<div class="topbar">

  <!-- HOME -->
  <a class="home-btn" href="dashboard.html">
    <span class="home-icon">⌂</span>
    <span class="home-label">Home</span>
  </a>

  <!-- BRAND -->
  <div class="brand">
    <span class="brand-alm">ALM</span>
    <span class="brand-yr">2026/27</span>
  </div>

  <!-- TABS -->
  <div class="tabs">

    <!-- In-page panels -->
    <div class="tab active" data-panel="overview" onclick="switchTab(this)">
      <div class="tab-num">1</div>
      <div class="tab-label">Overview</div>
    </div>

    <div class="tab" data-panel="audit" onclick="switchTab(this)">
      <div class="tab-num">2</div>
      <div class="tab-label">Audit</div>
      <div class="tab-badge" id="badge-audit">—</div>
    </div>

    <!-- External links -->
    <a class="tab-link" href="alm-group-formation.html">
      <div class="tab-num">3</div>
      <div class="tab-label">Formation</div>
      <div class="tab-link-arrow">↗</div>
    </a>

    <a class="tab-link" href="alm-allocation-engine.html">
      <div class="tab-num">4</div>
      <div class="tab-label">Decision</div>
      <div class="tab-link-arrow">↗</div>
    </a>

    <a class="tab-link" href="alm-atribuir-turmas.html">
      <div class="tab-num">5</div>
      <div class="tab-label">Assign</div>
      <div class="tab-link-arrow">↗</div>
    </a>

  </div>

  <div class="topbar-right">
    <div class="live"><div class="live-dot"></div><span class="live-lbl">LIVE</span></div>
    <div class="topbar-pill">2026/2027</div>
    <div class="topbar-pill gold" id="pill-total">— al</div>
    <div class="topbar-pill loading" id="pill-status">A carregar…</div>
  </div>
</div>

<!-- ══ PANELS ══ -->
<div class="panels">

  <!-- ── 1. OVERVIEW ── -->
  <div class="panel flex-panel" id="panel-overview">

    <div class="ov-left">
      <div class="ov-stats">
        <div class="ov-stat">
          <div class="ov-stat-v" style="color:var(--gold2)" id="ov-total">—</div>
          <div class="ov-stat-l">Inscritos</div>
        </div>
        <div class="ov-stat">
          <div class="ov-stat-v" style="color:var(--green)" id="ov-com">—</div>
          <div class="ov-stat-l">Com pedido</div>
        </div>
        <div class="ov-stat">
          <div class="ov-stat-v" style="color:var(--red)" id="ov-sem">—</div>
          <div class="ov-stat-l">Sem pedido</div>
        </div>
      </div>
      <div class="loc-tabs" id="loc-tabs">
        <div class="spinner-wrap" style="padding:10px"><div class="spinner"></div></div>
      </div>
      <div id="level-tree">
        <div class="spinner-wrap"><div class="spinner"></div>A carregar níveis…</div>
      </div>
    </div>

    <div class="ov-right" id="ov-right">
      <div class="placeholder">
        <div class="placeholder-icon">◈</div>
        <div class="placeholder-text">← Seleccione um nível</div>
      </div>
    </div>

  </div>

  <!-- ── 2. AUDIT ── -->
  <div class="panel" id="panel-audit">
    <div class="audit-wrap">

      <div class="kpi-row">
        <div class="kpi" style="color:var(--gold2)"><div class="kpi-v" id="a-total">—</div><div class="kpi-l">Total</div></div>

<script>
/* ══════════════════════════════════════════════════
   SUPABASE
══════════════════════════════════════════════════ */
const SB  = 'https://oapygbeliocdvitbdjbq.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9hcHlnYmVsaW9jZHZpdGJkamJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NjQzNjAsImV4cCI6MjA5MjA0MDM2MH0.-9Uj9Bg3q8sIlqzfzw2Sc1JziaueeyYGNwep-qWhWWg';
const H   = { apikey: KEY, Authorization: 'Bearer ' + KEY };
const AY  = '2026/2027';

async function sbGet(table, qs) {
  const r = await fetch(`${SB}/rest/v1/${table}?${qs}`, { headers: H });
  if (!r.ok) throw new Error(`${table}: HTTP ${r.status}`);
  return r.json();
}

/* ══════════════════════════════════════════════════
   CONSTANTS
══════════════════════════════════════════════════ */
const BRANCH_LABELS = {
  FUNCHAL:'Funchal', CAMARA_LOBOS:'C. Lobos', SANTA_CRUZ:'S. Cruz',
  MACHICO:'Machico', RIBEIRA_BRAVA:'R. Brava', CALHETA:'Calheta'
};
const BRANCH_ORDER = ['FUNCHAL','CAMARA_LOBOS','SANTA_CRUZ','MACHICO','RIBEIRA_BRAVA','CALHETA'];

const LEVEL_MAP = {
  'kids|A1':    { dept:'kids',     label:'PI-a1',  color:'var(--c-inf)', order:1,  max:60  },
  'kids|A2':    { dept:'kids',     label:'PI-a2',  color:'var(--c-inf)', order:2,  max:60  },
  'kids|B1':    { dept:'kids',     label:'PI-a3',  color:'var(--c-inf)', order:3,  max:60  },
  'kids|B2':    { dept:'kids',     label:'PI-a4',  color:'var(--c-inf)', order:4,  max:60  },
  'kids_juv|A1':{ dept:'kids_juv', label:'PJ1',    color:'var(--c-juv)', order:5,  max:90  },
  'kids_juv|A2':{ dept:'kids_juv', label:'PJ2',    color:'var(--c-juv)', order:6,  max:90  },
  'kids_juv|B1':{ dept:'kids_juv', label:'PJ3',    color:'var(--c-juv)', order:7,  max:90  },
  'adults|A1':  { dept:'adults',   label:'1st',    color:'var(--c-ger)', order:8,  max:200 },
  'adults|A2':  { dept:'adults',   label:'2nd',    color:'var(--c-ger)', order:9,  max:200 },
  'adults|B1':  { dept:'adults',   label:'3rd',    color:'var(--c-ger)', order:10, max:200 },
  'adults|B2':  { dept:'adults',   label:'4th',    color:'var(--c-ger)', order:11, max:200 },
  'adults|C1':  { dept:'adults',   label:'5th',    color:'var(--c-ger)', order:12, max:200 },
  'exam|B2':    { dept:'exam',     label:'6th B2', color:'var(--c-exa)', order:13, max:60  },
  'exam|C1':    { dept:'exam',     label:'7th C1', color:'var(--c-exa)', order:14, max:60  },
  'exam|C2':    { dept:'exam',     label:'8th C2', color:'var(--c-exa)', order:15, max:60  },
};

const DEPT_CONFIG = {
  kids:     { label:'Infantil', color:'var(--c-inf)' },
  kids_juv: { label:'Juvenil',  color:'var(--c-juv)' },
  adults:   { label:'Geral',    color:'var(--c-ger)' },
  exam:     { label:'Exames',   color:'var(--c-exa)' },
};
const DEPT_ORDER = ['kids','kids_juv','adults','exam'];

const DAYS_PT = ['SEG','TER','QUA','QUI','SEX','SÁB'];
const DAY_MAP = {
  monday:0, segunda:0, 'segunda-feira':0, mon:0, seg:0,
  tuesday:1, terca:1, 'terça-feira':1, tue:1, ter:1,
  wednesday:2, quarta:2, 'quarta-feira':2, wed:2, qua:2,
  thursday:3, quinta:3, 'quinta-feira':3, thu:3, qui:3,
  friday:4, sexta:4, 'sexta-feira':4, fri:4, sex:4,
  saturday:5, sabado:5, sábado:5, sat:5, sab:5, 'sáb':5
};

/* ══════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════ */
let allEnrolments = [];
let allRequests   = [];
let reqByRef      = {};
let activeLoc     = 'all';
let activeLevel   = null;
let openDepts     = { kids:true, kids_juv:false, adults:false, exam:false };
let auditFilters  = { branch:'all', status:'all', dept:'all' };

/* ══════════════════════════════════════════════════
   NAV
══════════════════════════════════════════════════ */
function switchTab(el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('panel-' + el.dataset.panel).classList.add('active');
}

let toastT;
function showToast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = `toast ${type} show`;
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), 2800);
}

/* ══════════════════════════════════════════════════
   HELPERS
══════════════════════════════════════════════════ */
function normBranch(b) {
  return (b || '').toUpperCase().replace(/[\s\-]+/g, '_').trim();
}
function normStatus(s) {
  return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
}
function levelKey(e) {
  return `${(e.family || '').toLowerCase()}|${(e.level_cefr || '').toUpperCase()}`;
}
function parseDayPrefs(raw) {
  if (!raw) return [];
  if (Array.isArray(raw)) return raw;
  try { const p = JSON.parse(raw); return Array.isArray(p) ? p : []; } catch { return []; }
}
function dayIdx(str) {
  return DAY_MAP[(str || '').toLowerCase().trim()];
}
function parseHour(t) {
  if (!t) return null;
  const h = parseInt((t + '').split(':')[0], 10);
  return isNaN(h) ? null : h;
}
function getLevelMeta(e) {
  return LEVEL_MAP[levelKey(e)] || { dept: 'adults', label: e.level_cefr || '?', color: 'var(--c-ger)', order: 99, max: 60 };
}
function getLocStudents() {
  if (activeLoc === 'all') return allEnrolments;
  return allEnrolments.filter(e => normBranch(e.branch) === activeLoc);
}
function computeSlotCounts(students) {
  const counts = {};
  students.forEach(e => {
    const req = reqByRef[e.ref];
    if (!req) return;
    parseDayPrefs(req.day_preferences).forEach(p => {
      const di = dayIdx(p.day || p.weekday || p.dia || '');
      const h  = parseHour(p.session_start || p.start_time || p.time || '');
      if (di === undefined || h === null) return;
      const key = `${DAYS_PT[di]}_${h}`;
      counts[key] = (counts[key] || 0) + 1;
    });
  });
  return counts;
}

/* ══════════════════════════════════════════════════
   LOAD
══════════════════════════════════════════════════ */
async function loadAll() {
  const pill = document.getElementById('pill-status');
  try {
    const [enrol, reqs] = await Promise.all([
      sbGet('enrolments',
        `select=ref,name,branch,lang,family,level_cefr&academic_year=eq.${encodeURIComponent(AY)}&limit=2000`),
      sbGet('timetable_requests',
        `select=ref,student_name,branch,family,level_cefr,day_preferences,status&academic_year=eq.${encodeURIComponent(AY)}&limit=2000`)
    ]);

    allEnrolments = enrol || [];
    allRequests   = reqs  || [];
    reqByRef = {};
    allRequests.forEach(r => { reqByRef[r.ref] = r; });

    const total = allEnrolments.length;
    const sem   = allEnrolments.filter(e => !reqByRef[e.ref]).length;

    document.getElementById('pill-total').textContent = `${total} al`;
    pill.textContent = `Supabase · ${allRequests.length} pedidos`;
    pill.className = 'topbar-pill ok';
    document.getElementById('badge-audit').textContent = sem;

    initOverview();
    renderAudit();

    showToast(`${total} inscritos · ${allRequests.length} pedidos carregados`, 'ok');

  } catch(e) {
    pill.textContent = 'Erro Supabase';
    pill.className = 'topbar-pill err';
    const errHtml = `<div class="err-msg">Erro ao ligar ao Supabase: ${e.message}</div>`;
    document.getElementById('level-tree').innerHTML = errHtml;
    document.getElementById('audit-rows').innerHTML = errHtml;
    document.getElementById('ov-right').innerHTML   = errHtml;
    showToast('Erro: ' + e.message, 'err');
    console.error(e);
  }
}

/* ══════════════════════════════════════════════════
   OVERVIEW
══════════════════════════════════════════════════ */
function initOverview() {
  // Build location tabs from real branch values in DB
  const branches = [...new Set(
    allEnrolments.map(e => normBranch(e.branch)).filter(Boolean)
  )];
  const ordered = BRANCH_ORDER.filter(b => branches.includes(b))
    .concat(branches.filter(b => !BRANCH_ORDER.includes(b)));

  document.getElementById('loc-tabs').innerHTML =
    `<button class="loc-tab active" onclick="setLoc('all',this)">Tudo</button>` +
    ordered.map(b =>
      `<button class="loc-tab" onclick="setLoc('${b}',this)">${BRANCH_LABELS[b] || b}</button>`
    ).join('');

  renderOverviewStats();
  renderTree();
  // Right side: show summary until a level is clicked
  renderOvSummary();
}

function setLoc(loc, btn) {
  activeLoc = loc;
  document.querySelectorAll('.loc-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  activeLevel = null;
  renderOverviewStats();
  renderTree();
  renderOvSummary();
}

function renderOverviewStats() {
  const students = getLocStudents();
  const com = students.filter(e => reqByRef[e.ref]).length;
  document.getElementById('ov-total').textContent = students.length;
  document.getElementById('ov-com').textContent   = com;
  document.getElementById('ov-sem').textContent   = students.length - com;
}

function renderTree() {
  const students = getLocStudents();
  // Group by dept → levelKey
  const tree = {};
  students.forEach(e => {
    const meta = getLevelMeta(e);
    const dk = meta.dept;
    const lk = levelKey(e);
    if (!tree[dk]) tree[dk] = {};
    if (!tree[dk][lk]) tree[dk][lk] = [];
    tree[dk][lk].push(e);
  });

  let html = '';
  DEPT_ORDER.forEach(dk => {
    if (!tree[dk]) return;
    const dc = DEPT_CONFIG[dk];
    const dStudents = Object.values(tree[dk]).flat();
    const isOpen = openDepts[dk];
    const sortedLks = Object.keys(tree[dk]).sort((a, b) =>
      (LEVEL_MAP[a]?.order || 99) - (LEVEL_MAP[b]?.order || 99));

    html += `<div class="dept-block">
      <div class="dept-hdr" onclick="toggleDept('${dk}')">
        <div class="dept-bar" style="background:${dc.color}"></div>
        <div class="dept-hdr-name" style="color:${dc.color}">${dc.label}</div>
        <div class="dept-hdr-n">${dStudents.length} al</div>
        <div class="dept-arrow${isOpen ? ' open' : ''}">▶</div>
      </div>
      <div class="level-list${isOpen ? ' open' : ''}">`;

    sortedLks.forEach(lk => {
      const ls   = tree[dk][lk];
      const meta = LEVEL_MAP[lk] || getLevelMeta(ls[0]);
      const sem  = ls.filter(e => !reqByRef[e.ref]).length;
      const isAct = activeLevel === lk;
      const badgeCls = sem > 0 ? 'badge-warn' : 'badge-ok';
      const badgeTxt = sem > 0 ? `${sem} s/ped` : 'ok';
      html += `<div class="level-item${isAct ? ' active' : ''}" onclick="selectLevel('${lk}')">
        <div class="level-dot" style="background:${meta.color}"></div>
        <div class="level-item-name">${meta.label}</div>
        <div class="level-item-n">${ls.length}</div>
        <div class="level-item-badge badge ${badgeCls}">${badgeTxt}</div>
      </div>`;
    });

    html += `</div></div>`;
  });

  document.getElementById('level-tree').innerHTML =
    html || '<div class="empty-msg">Sem dados para esta filial.</div>';
}

function toggleDept(dk) {
  openDepts[dk] = !openDepts[dk];
  renderTree();
}

function selectLevel(lk) {
  activeLevel = lk;
  renderTree();
  renderOvLevel();
}

/* Overview right — summary (no level selected) */
function renderOvSummary() {
  const students = getLocStudents();
  const total    = students.length;
  if (!total) {
    document.getElementById('ov-right').innerHTML =
      '<div class="empty-msg">Sem inscrições para esta filial.</div>';
    return;
  }
  const com  = students.filter(e => reqByRef[e.ref]).length;
  const sem  = total - com;
  const pend = students.filter(e => { const r = reqByRef[e.ref]; return r && normStatus(r.status) === 'pendente'; }).length;

  // Dept counts for bars
  const deptCounts = {};
  DEPT_ORDER.forEach(dk => {
    deptCounts[dk] = students.filter(e => getLevelMeta(e).dept === dk).length;
  });
  const maxDept = Math.max(...Object.values(deptCounts), 1);

  let html = `<div class="sec">Visão geral${activeLoc !== 'all' ? ' · ' + (BRANCH_LABELS[activeLoc] || activeLoc) : ''}</div>`;

  // dept bars
  html += `<div style="background:var(--bg2);border:1px solid var(--b);padding:12px 14px;margin-bottom:14px">`;
  DEPT_ORDER.forEach(dk => {
    const dc = DEPT_CONFIG[dk];
    const n  = deptCounts[dk] || 0;
    const pct = Math.round(n / maxDept * 100);
    html += `<div class="dept-row">
      <div class="dept-row-name" style="color:${dc.color}">${dc.label}</div>
      <div class="dept-track"><div class="dept-fill" style="width:${pct}%;background:${dc.color}"></div></div>
      <div class="dept-n">${n}</div>
    </div>`;
  });
  html += `</div>`;

  // Action rows linking to external files
  html += `<div class="sec">Próximas acções</div>
  <div style="background:var(--bg2);border:1px solid var(--b);padding:2px 14px;margin-bottom:14px">
    <div class="action-row">
      <div class="action-dot" style="background:var(--red)"></div>
      <span style="color:var(--t2)">${sem} aluno${sem!==1?'s':''} sem pedido de horário</span>
      <a class="action-btn action-btn-gold" href="#" onclick="switchTabById('audit');return false;">Audit →</a>
    </div>
    <div class="action-row">
      <div class="action-dot" style="background:var(--amber)"></div>
      <span style="color:var(--t2)">${pend} turma${pend!==1?'s':''} aguardam decisão</span>
      <a class="action-btn action-btn-gold" href="alm-allocation-engine.html">Decision →</a>
    </div>
    <div class="action-row">
      <div class="action-dot" style="background:var(--teal)"></div>
      <span style="color:var(--t2)">Formação de turmas em curso</span>
      <a class="action-btn action-btn-gold" href="alm-group-formation.html">Formation →</a>
    </div>
    <div class="action-row">
      <div class="action-dot" style="background:var(--green)"></div>
      <span style="color:var(--t2)">Atribuir professores a turmas aprovadas</span>
      <a class="action-btn action-btn-green" href="alm-atribuir-turmas.html">Assign →</a>
    </div>
  </div>
  <div style="font-size:7.5px;color:var(--t3);padding:4px 0">← Seleccione um nível para ver disponibilidade por slot</div>`;

  document.getElementById('ov-right').innerHTML = html;
}

function switchTabById(id) {
  const t = document.querySelector(`.tab[data-panel="${id}"]`);
  if (t) switchTab(t);
}

/* Overview right — level selected */
function renderOvLevel() {
  const el = document.getElementById('ov-right');
  const students = getLocStudents().filter(e => levelKey(e) === activeLevel);

  if (!students.length) {
    el.innerHTML = '<div class="empty-msg">Nenhum aluno neste nível para a filial seleccionada.</div>';
    return;
  }

  const meta   = LEVEL_MAP[activeLevel] || getLevelMeta(students[0]);
  const dc     = DEPT_CONFIG[meta.dept] || {};
  const com    = students.filter(e => reqByRef[e.ref]).length;
  const sem    = students.length - com;
  const capPct = Math.round(students.length / meta.max * 100);

  // Slot counts from real day_preferences
  const slotCounts = computeSlotCounts(students);
  const topSlots   = Object.entries(slotCounts)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 12);

  let html = `<div class="sec">${meta.label} · <span style="color:${meta.color}">${dc.label || ''}</span></div>`;

  // Level summary
  html += `<div class="level-summary">
    <div class="ls-stat"><div class="ls-v" style="color:${meta.color}">${students.length}</div><div class="ls-l">Alunos</div></div>
    <div class="ls-stat"><div class="ls-v" style="color:var(--green)">${com}</div><div class="ls-l">Com pedido</div></div>
    <div class="ls-stat"><div class="ls-v" style="color:var(--red)">${sem}</div><div class="ls-l">Sem pedido</div></div>
    <div style="flex:1">
      <div style="font-size:6.5px;color:var(--t3);margin-bottom:4px">${capPct}% capacidade (max ${meta.max})</div>
      <div class="cap-bar"><div class="cap-fill" style="width:${capPct}%;background:${meta.color}"></div></div>
    </div>
  </div>`;

  // Slot cards — counts come from real day_preferences
  if (topSlots.length) {
    html += `<div class="sec">Disponibilidade por slot · ${com} pedido${com!==1?'s':''} analisado${com!==1?'s':''}</div>
    <div class="slot-grid">`;
    topSlots.forEach(([key, count]) => {
      const [day, hour] = key.split('_');
      const pctSlot = com > 0 ? Math.round(count / com * 100) : 0;
      const pctCls  = pctSlot >= 70 ? 'hi' : pctSlot >= 40 ? 'mid' : 'lo';
      html += `<div class="slot-card" onclick="this.classList.toggle('chosen')">
        <div class="slot-pct-badge ${pctCls}">${pctSlot}%</div>
        <div class="slot-card-count" style="color:${meta.color}">${count}</div>
        <div class="slot-card-time">${hour}h00</div>
        <div class="slot-card-day">${day}</div>
      </div>`;
    });
    html += `</div>`;
  } else {
    html += `<div class="empty-msg" style="padding:16px 0;text-align:left">
      Nenhum pedido de horário submetido neste nível.
    </div>`;
  }

  // Student list
  html += `<div class="sec">Alunos · ${students.length} registos</div>
  <div class="student-hdr"><span>Nome</span><span>Disponibilidade</span><span>Status</span></div>`;

  students
    .sort((a, b) => (a.name || '').localeCompare(b.name || ''))
    .slice(0, 300)
    .forEach(e => {
      const req     = reqByRef[e.ref];
      const prefs   = parseDayPrefs(req?.day_preferences);
      const dayIdxs = prefs.map(p => dayIdx(p.day || p.weekday || p.dia || ''));
      const cells   = DAYS_PT.map((_, di) =>
        `<div class="hcell${dayIdxs.includes(di) ? ' on' : ''}"></div>`).join('');
      const status  = req ? normStatus(req.status) : 'sem_pedido';
      const bCls    = status === 'atribuido' ? 'badge-ok' : status === 'sem_pedido' ? 'badge-err' : 'badge-warn';
      const bTxt    = status === 'atribuido' ? 'atribuído' : status === 'sem_pedido' ? 'sem pedido' : 'pendente';
      html += `<div class="student-row">
        <div class="sr-cell">
          <div style="font-size:9px;color:var(--t)">${e.name || '—'}</div>
          <div style="font-size:7px;color:var(--t3)">${e.ref || '—'}</div>
        </div>
        <div class="sr-cell">
          <div class="heatstrip">${cells}</div>
          <div style="font-size:6px;color:var(--t4);margin-top:2px;letter-spacing:.04em">S T Q Q S S</div>
        </div>
        <div class="sr-cell"><span class="badge ${bCls}">${bTxt}</span></div>
      </div>`;
    });

  if (students.length > 300)
    html += `<div class="empty-msg">… e mais ${students.length - 300} alunos</div>`;

  el.innerHTML = html;
}

/* ══════════════════════════════════════════════════
   AUDIT
══════════════════════════════════════════════════ */
function setAF(btn) {
  const group = btn.dataset.group;
  const val   = btn.dataset.val;
  auditFilters[group] = val;
  // deactivate all buttons in same group, activate clicked
  document.querySelectorAll(`#audit-filter-row .fbt[data-group="${group}"]`)
    .forEach(b => b.classList.remove('act'));
  btn.classList.add('act');
  renderAudit();
}

function renderAudit() {
  let students = [...allEnrolments];

  if (auditFilters.branch !== 'all')
    students = students.filter(e => normBranch(e.branch) === auditFilters.branch);

  if (auditFilters.dept !== 'all')
    students = students.filter(e => (e.family || '').toLowerCase() === auditFilters.dept);

  if (auditFilters.status !== 'all') {
    students = students.filter(e => {
      const req = reqByRef[e.ref];
      if (auditFilters.status === 'noreq')     return !req;
      if (auditFilters.status === 'pendente')  return req && normStatus(req.status) === 'pendente';
      if (auditFilters.status === 'atribuido') return req && normStatus(req.status) === 'atribuido';
      return true;
    });
  }

  const q = (document.getElementById('audit-search')?.value || '').toLowerCase().trim();
  if (q) students = students.filter(e =>
    (e.name || '').toLowerCase().includes(q) || (e.ref || '').toLowerCase().includes(q)
  );

  // KPIs from full dataset
  const total = allEnrolments.length;
  const com   = allEnrolments.filter(e => reqByRef[e.ref]).length;
  const sem   = total - com;
  const pend  = allEnrolments.filter(e => {
    const r = reqByRef[e.ref];
    return r && normStatus(r.status) === 'pendente';
  }).length;
  document.getElementById('a-total').textContent = total;
  document.getElementById('a-com').textContent   = com;
  document.getElementById('a-sem').textContent   = sem;
  document.getElementById('a-pend').textContent  = pend;
  document.getElementById('badge-audit').textContent = sem;

  const showing = Math.min(students.length, 500);
  document.getElementById('audit-count-lbl').textContent =
    `A mostrar ${showing} de ${students.length} registos`;

  const html = students.slice(0, 500).map(e => {
    const req     = reqByRef[e.ref];
    const meta    = getLevelMeta(e);
    const dc      = DEPT_CONFIG[meta.dept] || {};
    const prefs   = parseDayPrefs(req?.day_preferences);
    const dayIdxs = prefs.map(p => dayIdx(p.day || p.weekday || p.dia || ''));
    const cells   = DAYS_PT.map((_, di) =>
      `<div class="hcell${dayIdxs.includes(di) ? ' on' : ''}"></div>`).join('');
    const status  = req ? normStatus(req.status) : 'sem_pedido';
    const bCls    = status === 'atribuido' ? 'badge-ok' : status === 'sem_pedido' ? 'badge-err' : 'badge-warn';
    const bTxt    = status === 'atribuido' ? 'atribuído' : status === 'sem_pedido' ? 'sem pedido' : 'pendente';
    return `<div class="audit-row">
      <div class="ar-cell">
        <div style="font-size:9px;color:var(--t)">${e.name || '—'}</div>
        <div style="font-size:7px;color:var(--t3)">${e.ref || '—'}</div>
      </div>
      <div class="ar-cell">
        <div style="font-size:9px;font-weight:600;color:${meta.color}">${meta.label}</div>
        <div style="font-size:7px;color:var(--t3)">${e.level_cefr || '—'} · ${dc.label || ''}</div>
      </div>
      <div class="ar-cell">
        <div class="heatstrip">${cells}</div>
        <div style="font-size:6px;color:var(--t4);margin-top:3px;letter-spacing:.04em">S T Q Q S S</div>
      </div>
      <div class="ar-cell" style="text-align:center">
        <span class="badge ${bCls}">${bTxt}</span>
      </div>
    </div>`;
  }).join('');

  document.getElementById('audit-rows').innerHTML =
    html || '<div class="empty-msg">Nenhum resultado com estes filtros.</div>';
}

   BOOT

loadAll();
</script>
