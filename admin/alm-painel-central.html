<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ALM · 2026/2027</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9A84C;--gold2:#E8C97A;--gold3:rgba(201,168,76,.15);--gold4:rgba(201,168,76,.06);
  --green:#1DB87A;--green-a:rgba(29,184,122,.14);--green-b:rgba(29,184,122,.3);
  --red:#E8455A;--red-a:rgba(232,69,90,.12);--red-b:rgba(232,69,90,.3);
  --amber:#E8A020;--amber-a:rgba(232,160,32,.13);--amber-b:rgba(232,160,32,.3);
  --teal:#28C8B0;--purple:#9B5ECA;--blue:#4A8FF5;
  --bg:#07060E;--bg2:#0E0B1A;--bg3:#141025;
  --b:rgba(201,168,76,.07);--b2:rgba(201,168,76,.16);--b3:rgba(201,168,76,.30);
  --t:rgba(238,218,168,.92);--t2:rgba(210,188,140,.52);--t3:rgba(210,188,140,.26);--t4:rgba(210,188,140,.10);
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',system-ui,sans-serif;
  --c-juv:#28C8B0;--c-ger:#C8A44A;--c-exa:#9B5ECA;--c-inf:#4A8FF5;
}
html,body{height:100%;background:var(--bg);color:var(--t);font-family:var(--mono);font-size:12px;-webkit-font-smoothing:antialiased;overflow:hidden}
body{display:flex;flex-direction:column}

/* ══ TOPBAR ══ */
.topbar{flex-shrink:0;height:50px;display:flex;align-items:center;background:rgba(7,6,14,.99);border-bottom:1px solid var(--b2);position:relative;z-index:200}
.home-btn{display:flex;align-items:center;gap:7px;padding:0 16px;height:100%;border-right:1px solid var(--b);text-decoration:none;flex-shrink:0;transition:background .15s}
.home-btn:hover{background:var(--gold4)}
.home-icon{font-size:13px;color:var(--t3);transition:color .15s}
.home-btn:hover .home-icon{color:var(--gold2)}
.home-label{font-size:7px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t4);transition:color .15s}
.home-btn:hover .home-label{color:var(--gold)}
.brand{display:flex;align-items:center;padding:0 18px;height:100%;border-right:1px solid var(--b);flex-shrink:0}
.brand-alm{font-size:18px;font-weight:700;letter-spacing:8px;color:var(--gold2)}
.brand-yr{font-size:7px;color:var(--t3);letter-spacing:.14em;margin-left:8px;align-self:flex-end;padding-bottom:3px}
.tabs{display:flex;align-items:stretch;height:100%;flex:1;overflow:hidden}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 20px;cursor:pointer;border-right:1px solid var(--b);border-bottom:2px solid transparent;transition:all .18s;position:relative;flex-shrink:0;gap:3px;text-decoration:none}
.tab:hover{background:var(--gold4)}
.tab.active{background:rgba(201,168,76,.05);border-bottom-color:var(--gold)}
.tab-num{font-size:7px;font-weight:700;letter-spacing:.08em;color:var(--t4);width:16px;height:16px;border:1px solid var(--b);display:flex;align-items:center;justify-content:center;transition:all .18s}
.tab.active .tab-num{background:var(--gold);color:#07060E;border-color:var(--gold)}
.tab-label{font-size:8px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);transition:color .18s;white-space:nowrap}
.tab.active .tab-label{color:var(--gold2)}
.tab:hover .tab-label{color:var(--t2)}
.tab-badge{position:absolute;top:7px;right:7px;background:var(--red);color:#fff;font-size:6px;font-weight:700;padding:1px 4px;min-width:14px;text-align:center;border-radius:6px;line-height:1.4}
.tab-link{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 20px;border-right:1px solid var(--b);border-bottom:2px solid transparent;transition:all .18s;position:relative;flex-shrink:0;gap:3px;text-decoration:none;cursor:pointer}
.tab-link:hover{background:var(--gold4);border-bottom-color:var(--b2)}
.tab-link .tab-num{font-size:7px;font-weight:700;color:var(--t4);width:16px;height:16px;border:1px solid var(--b);display:flex;align-items:center;justify-content:center;transition:all .18s}
.tab-link:hover .tab-num{background:var(--b2);color:var(--gold)}
.tab-link .tab-label{font-size:8px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);transition:color .18s;white-space:nowrap}
.tab-link:hover .tab-label{color:var(--t2)}
.tab-link-arrow{font-size:7px;color:var(--t4);transition:color .15s;margin-top:1px}
.tab-link:hover .tab-link-arrow{color:var(--gold)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;padding:0 14px;border-left:1px solid var(--b);height:100%;flex-shrink:0}
.live{display:flex;align-items:center;gap:5px}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.live-lbl{font-size:7px;font-weight:700;letter-spacing:.1em;color:var(--green)}
.topbar-pill{font-size:7px;font-weight:600;letter-spacing:.08em;padding:2px 9px;border:1px solid var(--b2);color:var(--t2)}
.topbar-pill.gold{color:var(--gold2);border-color:var(--b3);background:var(--gold4)}
.topbar-pill.ok{color:var(--green);border-color:var(--green-b)}
.topbar-pill.err{color:var(--red);border-color:var(--red-b)}
.topbar-pill.loading{color:var(--amber);border-color:var(--amber-b)}

/* ══ PANELS ══ */
.panels{flex:1;overflow:hidden;position:relative}
.panel{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none;scrollbar-width:thin;scrollbar-color:var(--b) transparent}
.panel.active{display:block;animation:fadeIn .18s ease}
.panel.active.flex-panel{display:flex!important}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.panel::-webkit-scrollbar{width:3px}
.panel::-webkit-scrollbar-thumb{background:var(--b2)}
#panel-overview{flex-direction:row}

/* ══ SHARED ══ */
.sec{font-size:7.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sec::after{content:'';flex:1;height:.5px;background:var(--b2)}
.badge{font-size:6.5px;font-weight:700;padding:1px 6px;border:1px solid}
.badge-ok{background:var(--green-a);border-color:var(--green-b);color:var(--green)}
.badge-warn{background:var(--amber-a);border-color:var(--amber-b);color:var(--amber)}
.badge-err{background:var(--red-a);border-color:var(--red-b);color:var(--red)}
.spinner-wrap{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--t3);gap:10px;font-size:9px;letter-spacing:.1em}
.spinner{width:14px;height:14px;border:1.5px solid var(--b2);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-msg{padding:40px;text-align:center;color:var(--t3);font-size:9px;letter-spacing:.1em}
.err-msg{padding:20px;background:var(--red-a);border:1px solid var(--red-b);color:var(--red);font-size:9px;margin:16px 20px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(8px);padding:5px 18px;font-size:9px;font-weight:500;opacity:0;transition:all .2s;z-index:9000;pointer-events:none;border:1px solid;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--green-a);border-color:var(--green-b);color:var(--green)}
.toast.warn{background:var(--amber-a);border-color:var(--amber-b);color:var(--amber)}
.toast.err{background:var(--red-a);border-color:var(--red-b);color:var(--red)}

/* ══ OVERVIEW LEFT ══ */
.ov-left{width:290px;flex-shrink:0;border-right:1px solid var(--b2);overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column}
.ov-left::-webkit-scrollbar{width:3px}
.ov-left::-webkit-scrollbar-thumb{background:var(--b2)}
.ov-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--b);border-bottom:1px solid var(--b2);flex-shrink:0}
.ov-stat{padding:12px 10px;background:var(--bg)}
.ov-stat-v{font-size:20px;font-weight:700;line-height:1}
.ov-stat-l{font-size:6px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-top:3px}
.loc-tabs{display:flex;flex-wrap:wrap;gap:3px;padding:10px 10px 6px;border-bottom:1px solid var(--b);flex-shrink:0}
.loc-tab{font-size:7.5px;font-weight:600;letter-spacing:.06em;padding:3px 9px;border:1px solid var(--b);cursor:pointer;color:var(--t3);transition:all .13s;background:transparent;font-family:var(--mono)}
.loc-tab:hover{color:var(--t2);border-color:var(--b2)}
.loc-tab.active{background:var(--gold3);border-color:var(--gold);color:var(--gold2)}
.dept-block{border-bottom:1px solid var(--b)}
.dept-hdr{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;user-select:none}
.dept-hdr:hover{background:rgba(255,255,255,.015)}
.dept-bar{width:3px;height:14px;flex-shrink:0}
.dept-hdr-name{font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;flex:1}
.dept-hdr-n{font-size:8px;color:var(--t3)}
.dept-arrow{font-size:8px;color:var(--t4);transition:transform .18s}
.dept-arrow.open{transform:rotate(90deg)}
.level-list{display:none}
.level-list.open{display:block}
.level-item{display:flex;align-items:center;gap:7px;padding:6px 12px 6px 22px;cursor:pointer;border-left:2px solid transparent;transition:all .12s}
.level-item:hover{background:rgba(255,255,255,.02)}
.level-item.active{background:var(--gold4);border-left-color:var(--gold)}
.level-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.level-item-name{font-size:9px;font-weight:600;flex:1}
.level-item-n{font-size:8px;color:var(--t3);min-width:26px;text-align:right}
.level-item-badge{font-size:6px;font-weight:700;padding:1px 5px;border:1px solid;flex-shrink:0}

/* ══ OVERVIEW RIGHT ══ */
.ov-right{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 20px 40px}
.ov-right::-webkit-scrollbar{width:3px}
.ov-right::-webkit-scrollbar-thumb{background:var(--b2)}
.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60%;color:var(--t3);gap:8px}
.placeholder-icon{font-size:24px;opacity:.25}
.placeholder-text{font-size:8px;letter-spacing:.14em;text-transform:uppercase;opacity:.5}
.dept-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:.5px solid var(--b)}
.dept-row:last-child{border-bottom:none}
.dept-row-name{font-size:10px;font-weight:600;width:70px;flex-shrink:0}
.dept-track{flex:1;height:4px;background:rgba(255,255,255,.04)}
.dept-fill{height:100%;transition:width .8s ease}
.dept-n{font-size:9px;color:var(--t2);width:34px;text-align:right;flex-shrink:0}
.action-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:.5px solid var(--b);font-size:9px}
.action-row:last-child{border-bottom:none}
.action-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.action-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 13px;border:1px solid;cursor:pointer;font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:.06em;transition:all .13s;background:transparent;text-decoration:none;margin-left:auto}
.action-btn-gold{border-color:var(--b2);color:var(--gold)}
.action-btn-gold:hover{background:var(--gold3)}
.action-btn-green{border-color:var(--green-b);color:var(--green)}
.action-btn-green:hover{background:var(--green-a)}

/* ══ SLOT CARDS ══ */
.slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;margin-bottom:16px}
.slot-card{background:var(--bg2);border:1px solid var(--b);padding:12px;cursor:pointer;transition:all .15s;position:relative}
.slot-card:hover{border-color:var(--b2);transform:translateY(-1px)}
.slot-card.chosen{border-color:var(--gold);background:var(--gold4);box-shadow:0 0 0 1px var(--gold3)}
.slot-card-count{font-size:28px;font-weight:700;line-height:1}
.slot-card-time{font-size:8px;color:var(--t2);margin-top:4px}
.slot-card-day{font-size:7px;color:var(--t3);margin-top:1px;letter-spacing:.06em;text-transform:uppercase}
.slot-pct-badge{font-size:6.5px;font-weight:700;padding:1px 5px;border:1px solid;position:absolute;top:8px;right:8px}
.slot-pct-badge.hi{background:var(--green-a);border-color:var(--green-b);color:var(--green)}
.slot-pct-badge.mid{background:var(--amber-a);border-color:var(--amber-b);color:var(--amber)}
.slot-pct-badge.lo{background:var(--red-a);border-color:var(--red-b);color:var(--red)}

/* ══ SLOT DRILL — THE KEY NEW PIECE ══ */
.drill-panel{background:var(--bg2);border:1px solid var(--b2);margin-bottom:16px;animation:fadeIn .2s ease}
.drill-hdr{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--b);background:rgba(0,0,0,.2)}
.drill-title{font-size:10px;font-weight:700;color:var(--gold2);flex:1;letter-spacing:.04em}
.drill-count{font-size:9px;color:var(--t3)}
.drill-actions{display:flex;gap:6px}
.drill-btn{display:flex;align-items:center;gap:4px;padding:4px 11px;border:1px solid;font-family:var(--mono);font-size:8px;font-weight:600;cursor:pointer;background:transparent;transition:all .12s}
.drill-btn-csv{border-color:var(--green-b);color:var(--green)}
.drill-btn-csv:hover{background:var(--green-a)}
.drill-btn-print{border-color:var(--b2);color:var(--gold)}
.drill-btn-print:hover{background:var(--gold3)}
.drill-btn-close{border-color:var(--b);color:var(--t3)}
.drill-btn-close:hover{border-color:var(--red-b);color:var(--red)}
.drill-list{max-height:360px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--b) transparent}
.drill-list::-webkit-scrollbar{width:3px}
.drill-list::-webkit-scrollbar-thumb{background:var(--b2)}
.drill-row{display:grid;grid-template-columns:1fr 80px 120px 80px;align-items:center;border-bottom:.5px solid rgba(201,168,76,.04);transition:background .1s}
.drill-row:hover{background:rgba(201,168,76,.025)}
.drill-row-hdr{font-size:7px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);padding:5px 0 6px;border-bottom:1px solid var(--b2)}
.dr-cell{padding:6px 8px}
.drill-name{font-size:9px;color:var(--t)}
.drill-ref{font-size:7px;color:var(--t3);margin-top:1px}
.drill-slots{display:flex;gap:2px}
.drill-slot-pip{font-size:7px;font-weight:600;padding:1px 5px;border:1px solid;white-space:nowrap}
.drill-slot-a{background:rgba(74,143,245,.1);border-color:rgba(74,143,245,.3);color:var(--blue)}
.drill-slot-b{background:rgba(155,94,202,.1);border-color:rgba(155,94,202,.3);color:var(--purple)}
.drill-empty{padding:24px;text-align:center;font-size:9px;color:var(--t3)}

/* ══ STUDENT LIST ══ */
.student-hdr{display:grid;grid-template-columns:1fr 120px 70px;font-size:7px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);padding:5px 0 8px;border-bottom:1px solid var(--b2);margin-bottom:2px}
.student-hdr span{padding:0 4px}
.student-row{display:grid;grid-template-columns:1fr 120px 70px;align-items:center;border-bottom:.5px solid rgba(201,168,76,.04);transition:background .1s}
.student-row:hover{background:rgba(201,168,76,.02)}
.sr-cell{padding:6px 4px}
.heatstrip{display:flex;gap:1px}
.hcell{width:11px;height:9px;border-radius:1px;background:rgba(255,255,255,.04);border:.5px solid rgba(255,255,255,.04)}
.hcell.on{background:rgba(40,200,176,.35);border-color:rgba(40,200,176,.5)}
.level-summary{background:var(--bg3);border:1px solid var(--b2);padding:14px;margin-bottom:14px;display:flex;gap:20px;flex-wrap:wrap;align-items:flex-end}
.ls-stat{display:flex;flex-direction:column;gap:2px}
.ls-v{font-size:22px;font-weight:700;line-height:1}
.ls-l{font-size:6.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}
.cap-bar{height:3px;background:rgba(255,255,255,.04);flex:1;margin-bottom:6px;overflow:hidden}
.cap-fill{height:100%;transition:width .6s}

/* ══ AUDIT ══ */
.audit-wrap{padding:0 20px 40px}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;padding:18px 0 14px}
.kpi{background:var(--bg2);border:1px solid var(--b);padding:11px 13px;position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1.5px;background:linear-gradient(90deg,transparent,currentColor,transparent)}
.kpi-v{font-size:22px;font-weight:700;line-height:1}
.kpi-l{font-size:6.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin-top:3px}
.filter-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.fbt{font-size:7.5px;font-weight:600;letter-spacing:.06em;padding:3px 10px;border:1px solid var(--b);cursor:pointer;color:var(--t3);transition:all .13s;background:transparent;font-family:var(--mono)}
.fbt:hover{color:var(--t2);border-color:var(--b2)}
.fbt.act{background:var(--gold4);border-color:var(--gold);color:var(--gold2)}
.fbt-sep{width:.5px;background:var(--b2);margin:0 4px;align-self:stretch}
.search-box{margin-left:auto;background:var(--bg2);border:1px solid var(--b);padding:4px 9px;font-family:var(--mono);font-size:9px;color:var(--t);outline:none;width:180px}
.search-box:focus{border-color:var(--b2)}
.audit-hdr{display:grid;grid-template-columns:180px 100px 1fr 80px;font-size:7px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);padding:5px 0 8px;border-bottom:1px solid var(--b2)}
.audit-hdr span{padding:0 4px}
.audit-row{display:grid;grid-template-columns:180px 100px 1fr 80px;align-items:center;border-bottom:.5px solid rgba(201,168,76,.04);transition:background .1s}
.audit-row:hover{background:rgba(201,168,76,.02)}
.ar-cell{padding:7px 4px}

/* ══ PRINT STYLES ══ */
@media print {
  body{background:#fff;color:#000;overflow:auto}
  .topbar,.tabs,.panels,.ov-left,.audit-wrap,.fbt,.search-box,.drill-actions,.loc-tabs{display:none!important}
  .print-target{display:block!important;position:static!important;inset:auto!important;padding:20px}
  .drill-panel{border:1px solid #ccc;break-inside:avoid}
  .drill-hdr{background:#f5f5f5;border-bottom:1px solid #ccc}
  .drill-title,.drill-count{color:#000}
  .drill-name{color:#000}
  .drill-ref,.drill-slot-pip{color:#555}
  .drill-row{border-bottom:.5px solid #eee}
  .badge-ok{color:#1a7a4a;border-color:#1a7a4a}
  .badge-warn{color:#8a5a00;border-color:#8a5a00}
  .badge-err{color:#c0392b;border-color:#c0392b}
  h2.print-title{font-size:16px;margin-bottom:8px;font-family:monospace;color:#000}
  .print-meta{font-size:11px;color:#555;margin-bottom:16px;font-family:monospace}
}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <a class='home-btn' href='/admin/dashboard'>
    <span class="home-icon">⌂</span>
    <span class="home-label">Home</span>
  </a>
  <div class="brand">
    <span class="brand-alm">ALM</span>
    <span class="brand-yr">2026/27</span>
  </div>
  <div class="tabs">
    <div class="tab active" data-panel="overview" onclick="switchTab(this)">
      <div class="tab-num">1</div>
      <div class="tab-label">Overview</div>
    </div>
    <div class="tab" data-panel="audit" onclick="switchTab(this)">
      <div class="tab-num">2</div>
      <div class="tab-label">Audit</div>
      <div class="tab-badge" id="badge-audit">—</div>
    </div>
    <a class='tab-link' href='/admin/alm-group-formation'>
      <div class="tab-num">3</div>
      <div class="tab-label">Formation</div>
      <div class="tab-link-arrow">↗</div>
    </a>
    <a class='tab-link' href='/admin/alm-allocation-engine'>
      <div class="tab-num">4</div>
      <div class="tab-label">Decision</div>
      <div class="tab-link-arrow">↗</div>

/* ══ HELPERS ══ */
function normBranch(b) {
  return (b || '').toUpperCase().replace(/[\s\-]+/g, '_').trim();
}
function normStatus(s) {
  return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
}
function levelKey(e) {
  return `${(e.family || '').toLowerCase()}|${(e.level_cefr || '').toUpperCase()}`;
}
function parseDayPrefs(raw) {
  if (!raw) return [];
  if (Array.isArray(raw)) return raw;
  try { const p = JSON.parse(raw); return Array.isArray(p) ? p : []; } catch { return []; }
}
function dayIdx(str) {
  // Handle numeric day values (1=Monday...6=Saturday from Supabase)
  const n = parseInt(str);
  if (!isNaN(n) && n >= 1 && n <= 6) return n - 1;
  return DAY_MAP[(str || '').toLowerCase().trim()];
}
function parseHour(t) {
  if (!t) return null;
  const h = parseInt((t + '').split(':')[0], 10);
  return isNaN(h) ? null : h;
}
function getLevelMeta(e) {
  return LEVEL_MAP[levelKey(e)] || { dept:'adults', label: e.level_cefr || '?', color:'var(--c-ger)', order:99, max:60 };
}
function getLocStudents() {
  if (activeLoc === 'all') return allEnrolments;
  return allEnrolments.filter(e => normBranch(e.branch) === activeLoc);
}
function computeSlotCounts(students) {
  const counts = {};
  students.forEach(e => {
    const req = reqByRef[e.ref];
    if (!req) return;
    parseDayPrefs(req.day_preferences).forEach(p => {
      const di = dayIdx(p.day || p.weekday || p.dia || '');
      const h  = parseHour(p.session_start || p.start_time || p.time || '');
      if (di === undefined || di === null || isNaN(di) || h === null) return;
      const key = `${DAYS_PT[di]}_${h}`;
      counts[key] = (counts[key] || 0) + 1;
    });
  });
  return counts;
}

/* ══════════════════════════════════════════
   THE KEY FUNCTION — this is what was missing
   Returns every student available at a given
   day + hour for the currently active level/branch
══════════════════════════════════════════ */
function getStudentsForSlot(lk, branch, day, hour) {
  return allEnrolments.filter(e => {
    // Must match active level
    if (levelKey(e) !== lk) return false;
    // Must match active branch (unless 'all')
    if (branch !== 'all' && normBranch(e.branch) !== branch) return false;
    // Must have a timetable request
    const req = reqByRef[e.ref];
    if (!req) return false;
    // Must have this exact slot in their preferences
    return parseDayPrefs(req.day_preferences).some(p => {
      const di = dayIdx(p.day || p.weekday || p.dia || '');
      const h  = parseHour(p.session_start || p.start_time || p.time || '');
      return DAYS_PT[di] === day && h === hour;
    });
  });
}

/* ══════════════════════════════════════════
   ALM VALID DAY PAIRS
   SEG+QUA · TER+QUI · QUA+SEX · SÁB(duplo)
══════════════════════════════════════════ */
const ALM_PAIRS = [
  { a:'SEG', b:'QUA', label:'SEG + QUA' },
  { a:'TER', b:'QUI', label:'TER + QUI' },
  { a:'QUA', b:'SEX', label:'QUA + SEX' },
  { a:'SÁB', b:'SÁB', label:'SÁB (duplo)', examOnly:true },
];

/* Hour validity per dept
   kids / kids_juv (preps): 8h and 9h only
   exam / adults / geral: 8h–19h max (20h invalid)
   SÁB pairs: exam dept only
*/
/* ALM valid start hours per dept
   kids / kids_juv: 8h, 9h (morning) OR 14h–19h (afternoon)
   adults / exam:   8h–19h
   Anyone outside these windows needs a callback to change their request
*/
function isHourValid(h, dept) {
  if (h === null || h === undefined || isNaN(h)) return false;
  if (dept === 'kids' || dept === 'kids_juv') {
    return h === 8 || h === 9 || (h >= 14 && h <= 19);
  }
  return h >= 8 && h <= 19;
}

/* Does a student have AT LEAST ONE valid slot for their dept? */
function studentHasValidSlot(ref, dept) {
  const req = reqByRef[ref];
  if (!req) return false;
  return parseDayPrefs(req.day_preferences).some(p => {
    const h = parseHour(p.session_start || '');
    return isHourValid(h, dept);
  });
}

/* Returns valid pairs for a given dept */
function validPairsForDept(dept) {
  return ALM_PAIRS.filter(p => !p.examOnly || dept === 'exam');
}

/* Count students sharing BOTH days of a pair at any valid hour combo */
function countPairStudents(students, pair, dept) {
  return students.filter(e => {
    const prefs = parseDayPrefs(reqByRef[e.ref]?.day_preferences);
    const validPrefs = prefs.filter(p => isHourValid(parseHour(p.session_start||''), dept));
    const days = validPrefs.map(p => {
      const di = dayIdx(p.day||'');
      return (di !== undefined && !isNaN(di)) ? DAYS_PT[di] : null;
    }).filter(Boolean);
    if (pair.a === pair.b) return days.filter(d => d === pair.a).length >= 2;
    return days.includes(pair.a) && days.includes(pair.b);
  }).length;
}

let _lastProposals = null;

function buildGroupProposals(lk, branch) {
  const allLevelStudents = allEnrolments.filter(e => {
    if (levelKey(e) !== lk) return false;
    if (branch !== 'all' && normBranch(e.branch) !== branch) return false;
    return !!reqByRef[e.ref];
  });

  const lvMeta = LEVEL_MAP[lk] || {};
  const dept = lvMeta.dept || 'adults';

  const students  = allLevelStudents.filter(e => studentHasValidSlot(e.ref, dept));
  const callbacks = allLevelStudents.filter(e => !studentHasValidSlot(e.ref, dept));

  const MAX = 17, MIN = 5;
  const placed = new Set();
  const groups = [];

  ALM_PAIRS.forEach(pair => {
    // SAB pairs only valid for exam dept
    if (pair.examOnly && dept !== 'exam') return;

    const eligible = students.filter(e => {
      if (placed.has(e.ref)) return false;
      const prefs = parseDayPrefs(reqByRef[e.ref]?.day_preferences);
      // Filter prefs to only valid hours for this dept
      const validPrefs = prefs.filter(p => {
        const h = parseHour(p.session_start || '');
        return isHourValid(h, dept);
      });
      const days = validPrefs.map(p => {
        const di = dayIdx(p.day || '');
        return (di !== undefined && di !== null && !isNaN(di)) ? DAYS_PT[di] : null;
      }).filter(Boolean);
      if (pair.a === pair.b) return days.filter(d => d === pair.a).length >= 2;
      return days.includes(pair.a) && days.includes(pair.b);
    });

    if (eligible.length < MIN) return;

    // Find best hour combo — only valid hours
    const combos = {};
    eligible.forEach(e => {
      const prefs = parseDayPrefs(reqByRef[e.ref]?.day_preferences);
      const hoursA = prefs.filter(p => {
        const di = dayIdx(p.day || '');
        const h = parseHour(p.session_start || '');
        return di !== undefined && !isNaN(di) && DAYS_PT[di] === pair.a && isHourValid(h, dept);
      }).map(p => parseHour(p.session_start || '')).filter(h => h !== null);
      const hoursB = pair.a === pair.b ? hoursA : prefs.filter(p => {
        const di = dayIdx(p.day || '');
        const h = parseHour(p.session_start || '');
        return di !== undefined && !isNaN(di) && DAYS_PT[di] === pair.b && isHourValid(h, dept);
      }).map(p => parseHour(p.session_start || '')).filter(h => h !== null);

      if (pair.a === pair.b) {
        const u = [...new Set(hoursA)];
        u.forEach((h1, i) => u.slice(i+1).forEach(h2 => {
          const k = `${h1}+${h2}`; combos[k] = (combos[k]||0) + 1;
        }));
      } else {
        hoursA.forEach(ha => hoursB.forEach(hb => {
          const k = `${ha}+${hb}`; combos[k] = (combos[k]||0) + 1;
        }));
      }
    });

    const best = Object.entries(combos).sort((a,b) => b[1]-a[1])[0];
    if (!best) return;
    const [hA, hB] = best[0].split('+').map(Number);

    const forGroup = eligible.filter(e => {
      const prefs = parseDayPrefs(reqByRef[e.ref]?.day_preferences);
      if (pair.a === pair.b) {
        const hours = prefs.filter(p => {
          const di = dayIdx(p.day||'');
          return di !== undefined && !isNaN(di) && DAYS_PT[di] === pair.a;
        }).map(p => parseHour(p.session_start||''));
        return hours.includes(hA) && hours.includes(hB);
      }
      const hasA = prefs.some(p => {
        const di = dayIdx(p.day||'');
        return di !== undefined && !isNaN(di) && DAYS_PT[di] === pair.a && parseHour(p.session_start||'') === hA;
      });
      const hasB = prefs.some(p => {
        const di = dayIdx(p.day||'');
        return di !== undefined && !isNaN(di) && DAYS_PT[di] === pair.b && parseHour(p.session_start||'') === hB;
      });
      return hasA && hasB;
    });

    if (forGroup.length < MIN) return;

    const chunk = forGroup.slice(0, MAX);
    chunk.forEach(e => placed.add(e.ref));
    groups.push({
      pair, hA, hB,
      slotA: `${pair.a} ${hA}h`,
      slotB: pair.a === pair.b ? `${pair.b} ${hB}h` : `${pair.b} ${hB}h`,
      students: chunk,
      overflow: forGroup.slice(MAX)
    });

    // If overflow >= MIN, make a second group from same pair
    if (forGroup.length > MAX) {
      const rest = forGroup.slice(MAX);
      if (rest.length >= MIN) {
        rest.forEach(e => placed.add(e.ref));
        groups.push({
          pair, hA, hB,
          slotA: `${pair.a} ${hA}h`,
          slotB: pair.a === pair.b ? `${pair.b} ${hB}h` : `${pair.b} ${hB}h`,
          students: rest,
          overflow: []
        });
      }
    }
  });

  const basket = students.filter(e => !placed.has(e.ref));
  return { groups, basket, callbacks, total: allLevelStudents.length,
           slottable: students.length };
}

function renderGroupProposals(lk, branch, meta) {

        <div style="font-size:8px;color:var(--t3);margin-left:8px" class="grp-arrow-${i}">▼</div>

          <button onclick="event.stopPropagation();printGrp(${i})"
            style="padding:3px 10px;border:1px solid var(--b2);background:var(--gold4);
            color:var(--gold);font-family:var(--mono);font-size:8px;cursor:pointer">⎙ Imprimir</button>
        </div>
        ${g.students.map(e => {
          const req = reqByRef[e.ref];
          const st = req ? normStatus(req.status) : 'sem_pedido';
          const bCls = st==='atribuido'?'badge-ok':st==='sem_pedido'?'badge-err':'badge-warn';
          const br = BRANCH_LABELS[normBranch(e.branch)] || e.branch || '—';
          const stTxt = st==='atribuido'?'atribuído':st==='sem_pedido'?'sem pedido':'pendente';
          return `<div style="display:flex;align-items:center;gap:8px;padding:4px 0;
            border-bottom:.5px solid rgba(201,168,76,.04)">
            <div style="flex:1;min-width:0">
              <div style="font-size:9px;color:var(--t)">${e.name||'—'}</div>
              <div style="font-size:7px;color:var(--t3)">${e.ref} · ${br}</div>
            </div>
            <span class="badge ${bCls}">${stTxt}</span>
          </div>`;
        }).join('')}
        ${g.overflow.length?`<div style="margin-top:6px;padding:5px 8px;background:var(--amber-a);
          border:1px solid var(--amber-b);font-size:8px;color:var(--amber)">
          ⚠ +${g.overflow.length} aluno${g.overflow.length!==1?'s':''} com o mesmo par — sem vaga nesta turma
        </div>`:''}
      </div>
    </div>`;
  });

  // AMBER — basket: slottable but no valid pair found
  if (basket.length) {
    html += `<div style="background:var(--bg2);border:1px solid rgba(232,160,32,.3);
      border-left:3px solid var(--amber);padding:10px 14px;margin-bottom:5px;cursor:pointer"
      onclick="toggleGroupDrill('basket-drill',this)">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="font-size:10px;font-weight:600;color:var(--amber)">🧺 Cesto · sem par válido</div>
        <div style="font-size:7.5px;color:var(--t3)">horário válido mas sem grupo compatível</div>
        <div style="margin-left:auto;font-size:22px;font-weight:700;color:var(--amber);line-height:1">${basket.length}</div>
        <div style="font-size:7px;color:var(--t3)">alunos</div>
        <div style="font-size:8px;color:var(--t3);margin-left:8px">▼</div>
      </div>
      <div id="basket-drill" style="display:none;margin-top:10px;border-top:1px solid var(--b);padding-top:8px">
        <div style="font-size:8px;color:var(--t3);margin-bottom:8px">
          Horário válido mas sem par compatível com outros alunos. Aguardar mais pedidos ou contactar.
        </div>
        ${basket.map(e => {
          const req = reqByRef[e.ref];
          const prefs = parseDayPrefs(req?.day_preferences);
          const slots = prefs.map(p => {
            const di = dayIdx(p.day||'');
            const h = parseHour(p.session_start||'');
            return (di!==undefined&&!isNaN(di)&&h!==null)?`${DAYS_PT[di]} ${h}h`:'';
          }).filter(Boolean).join(' + ');
          const st = req ? normStatus(req.status) : 'sem_pedido';
          const bCls = st==='atribuido'?'badge-ok':st==='sem_pedido'?'badge-err':'badge-warn';
          return `<div style="display:flex;align-items:center;gap:8px;padding:4px 0;
            border-bottom:.5px solid rgba(201,168,76,.04)">
            <div style="flex:1;min-width:0">
              <div style="font-size:9px;color:var(--t)">${e.name||'—'}</div>
              <div style="font-size:7px;color:var(--t3)">${e.ref}</div>
            </div>
            <div style="font-size:7.5px;color:var(--t2);font-family:var(--mono)">${slots||'—'}</div>
            <span class="badge ${bCls}">${st==='atribuido'?'atribuído':st==='sem_pedido'?'sem pedido':'pendente'}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  // RED — callbacks: requested outside valid windows
  if (callbacks.length) {
    html += `<div style="background:var(--bg2);border:1px solid var(--red-b);
      border-left:3px solid var(--red);padding:10px 14px;margin-bottom:14px;cursor:pointer"
      onclick="toggleGroupDrill('callback-drill',this)">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="font-size:10px;font-weight:600;color:var(--red)">⚠ Fora do horário escolar</div>
        <div style="font-size:7.5px;color:var(--t3)">pediram horas fora dos blocos válidos · necessitam contacto</div>
        <div style="margin-left:auto;font-size:22px;font-weight:700;color:var(--red);line-height:1">${callbacks.length}</div>
        <div style="font-size:7px;color:var(--t3)">alunos</div>
        <div style="font-size:8px;color:var(--t3);margin-left:8px">▼</div>
      </div>
      <div id="callback-drill" style="display:none;margin-top:10px;border-top:1px solid var(--b);padding-top:8px">
        <div style="padding:6px 0 10px;font-size:8px;color:var(--red);border-bottom:1px solid var(--b);margin-bottom:8px">
          Blocos válidos para este nível:
          8h00–9h00 (manhã) · 14h00–19h00 (tarde)
          <br>Estes alunos pediram fora destes blocos e precisam de novo contacto.
        </div>
        ${callbacks.map(e => {
          const req = reqByRef[e.ref];
          const prefs = parseDayPrefs(req?.day_preferences);
          const slots = prefs.map(p => {
            const di = dayIdx(p.day||'');
            const h = parseHour(p.session_start||'');
            if (di===undefined||isNaN(di)||h===null) return '';
            const valid = isHourValid(h, dept);
            return `<span style="color:${valid?'var(--green)':'var(--red)'};font-family:var(--mono);
              font-size:7.5px">${DAYS_PT[di]} ${h}h${valid?'✓':'✗'}</span>`;
          }).filter(Boolean).join(' &nbsp; ');
          return `<div style="display:flex;align-items:center;gap:8px;padding:5px 0;
            border-bottom:.5px solid rgba(232,69,90,.08)">
            <div style="flex:1;min-width:0">
              <div style="font-size:9px;color:var(--t)">${e.name||'—'}</div>
              <div style="font-size:7px;color:var(--t3)">${e.ref}</div>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap">${slots||'—'}</div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  return html;
}

function toggleGroupDrill(id, card) {
  const el = document.getElementById(id);

  const isOpen = el.style.display !== 'none';
  el.style.display = isOpen ? 'none' : 'block';
}

function exportGrp(idx) {
  if (!_lastProposals?.groups[idx]) return;
  const g = _lastProposals.groups[idx];
  const meta = LEVEL_MAP[activeLevel] || {};
  const letter = String.fromCharCode(65+idx);
  const rows = [`ALM · ${meta.label||activeLevel} · Turma ${letter} · ${g.slotA} + ${g.slotB}`,
    `Total: ${g.students.length}`, '', 'Nome,Ref,Filial,Estado'];
  g.students.forEach(e => {
    const st = reqByRef[e.ref] ? normStatus(reqByRef[e.ref].status) : 'sem pedido';
    const br = BRANCH_LABELS[normBranch(e.branch)] || e.branch || '—';
    rows.push(`"${e.name||''}","${e.ref||''}","${br}","${st}"`);
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv;charset=utf-8;'}));
  a.download = `ALM-T${letter}-${g.slotA}-${g.slotB}.csv`.replace(/\s+/g,'_');
  a.click();
  showToast(`CSV exportado · ${g.students.length} alunos`);
}

/* ══ SLOT DRILL — renders the named list ══ */
function drillSlot(day, hour, cardEl) {
  // Toggle: clicking the same card again closes the drill
  const isSame = currentDrillSlot &&
    currentDrillSlot.day === day && currentDrillSlot.hour === hour;

  document.querySelectorAll('.slot-card').forEach(c => c.classList.remove('chosen'));
  const drillEl = document.getElementById('slot-drill');

  if (isSame) {
    currentDrillSlot = null;
    drillEl.innerHTML = '';
    return;
  }

  cardEl.classList.add('chosen');
  currentDrillSlot = { day, hour };

  const students = getStudentsForSlot(activeLevel, activeLoc, day, hour);
  const meta = LEVEL_MAP[activeLevel] || {};
  const levelLabel = meta.label || activeLevel;
  const branchLabel = activeLoc === 'all' ? 'Todas as filiais' : (BRANCH_LABELS[activeLoc] || activeLoc);

  if (!students.length) {
    drillEl.innerHTML = `
      <div class="drill-panel">
        <div class="drill-hdr">
          <div class="drill-title">${day} ${hour}h — ${levelLabel} · ${branchLabel}</div>
          <button class="drill-btn drill-btn-close" onclick="closeDrill()">✕ Fechar</button>
        </div>
        <div class="drill-empty">Nenhum aluno disponível neste slot com os filtros actuais.</div>
      </div>`;
    return;
  }

  // Build the student rows
  const rows = students
    .sort((a, b) => (a.name || '').localeCompare(b.name || ''))
    .map((e, i) => {
      const req    = reqByRef[e.ref];
      const status = req ? normStatus(req.status) : 'sem_pedido';
      const bCls   = status === 'atribuido' ? 'badge-ok'
                   : status === 'sem_pedido' ? 'badge-err' : 'badge-warn';
      const bTxt   = status === 'atribuido' ? 'atribuído'
                   : status === 'sem_pedido' ? 'sem pedido' : 'pendente';
      // Show all their slots as pips
      const prefs = parseDayPrefs(req?.day_preferences);
      const slotPips = prefs.map((p, pi) => {
        const di = dayIdx(p.day || '');
        const h  = parseHour(p.session_start || '');
        if (di === undefined || h === null) return '';
        const isThis = DAYS_PT[di] === day && h === hour;
        return `<span class="drill-slot-pip ${pi === 0 ? 'drill-slot-a' : 'drill-slot-b'}"
          style="${isThis ? 'opacity:1;font-weight:700' : 'opacity:.45'}"
          >${DAYS_PT[di]} ${h}h</span>`;
      }).join('');

      return `<div class="drill-row">
        <div class="dr-cell">
          <div class="drill-name">${e.name || '—'}</div>
          <div class="drill-ref">${e.ref || '—'}</div>
        </div>
        <div class="dr-cell">
          <span style="font-size:9px;font-weight:600;color:${meta.color||'var(--c-ger)'}">
            ${levelLabel}
          </span>
          <div style="font-size:7px;color:var(--t3);margin-top:1px">
            ${(BRANCH_LABELS[normBranch(e.branch)] || e.branch) || '—'}
          </div>
        </div>
        <div class="dr-cell"><div class="drill-slots">${slotPips || '—'}</div></div>
        <div class="dr-cell"><span class="badge ${bCls}">${bTxt}</span></div>
      </div>`;
    }).join('');

  drillEl.innerHTML = `
    <div class="drill-panel">
      <div class="drill-hdr">
        <div class="drill-title">${day} · ${hour}h00 · ${levelLabel} · ${branchLabel}</div>
        <div class="drill-count">${students.length} aluno${students.length !== 1 ? 's' : ''}</div>
        <div class="drill-actions">
          <button class="drill-btn drill-btn-csv" onclick="exportSlot('${day}',${hour})">↓ CSV</button>
          <button class="drill-btn drill-btn-print" onclick="printSlot('${day}',${hour})">⎙ Imprimir</button>
          <button class="drill-btn drill-btn-close" onclick="closeDrill()">✕</button>
        </div>
      </div>
      <div class="drill-row drill-row-hdr">
        <div class="dr-cell">Nome</div>
        <div class="dr-cell">Nível</div>
        <div class="dr-cell">Slots pedidos</div>
        <div class="dr-cell">Estado</div>
      </div>
      <div class="drill-list">${rows}</div>
    </div>`;
}

/* drillPair — shows all students available on BOTH days of a pair,
   grouped by best shared hour combination */
function drillPair(dayA, dayB, cardEl) {
  const isSame = currentDrillSlot &&
    currentDrillSlot.day === dayA && currentDrillSlot.hour === dayB;
  document.querySelectorAll('.slot-card').forEach(c => c.classList.remove('chosen'));
  const drillEl = document.getElementById('slot-drill');

  if (isSame) {
    currentDrillSlot = null;
    if (drillEl) drillEl.innerHTML = '';
    return;
  }

  cardEl.classList.add('chosen');
  currentDrillSlot = { day: dayA, hour: dayB };

  const lvMeta = LEVEL_MAP[activeLevel] || {};
  const dept   = lvMeta.dept || 'adults';
  const meta   = lvMeta;
  const branchLabel = activeLoc === 'all' ? 'Todas as filiais' : (BRANCH_LABELS[activeLoc] || activeLoc);
  const pair = ALM_PAIRS.find(p => p.a === dayA && p.b === dayB) || { a:dayA, b:dayB, label:`${dayA} + ${dayB}` };

  // Get students available on both days (any valid hour)
  const students = allEnrolments.filter(e => {
    if (levelKey(e) !== activeLevel) return false;
    if (activeLoc !== 'all' && normBranch(e.branch) !== activeLoc) return false;
    const req = reqByRef[e.ref];
    if (!req) return false;
    const prefs = parseDayPrefs(req.day_preferences);
    const validPrefs = prefs.filter(p => isHourValid(parseHour(p.session_start||''), dept));
    const days = validPrefs.map(p => {
      const di = dayIdx(p.day||'');
      return (di !== undefined && !isNaN(di)) ? DAYS_PT[di] : null;
    }).filter(Boolean);
    if (dayA === dayB) return days.filter(d => d === dayA).length >= 2;
    return days.includes(dayA) && days.includes(dayB);
  });

  // Group by best shared hour combo
  const combos = {};
  students.forEach(e => {
    const prefs = parseDayPrefs(reqByRef[e.ref]?.day_preferences);
    const hoursA = prefs.filter(p => {
      const di = dayIdx(p.day||'');
      const h = parseHour(p.session_start||'');
      return di !== undefined && !isNaN(di) && DAYS_PT[di] === dayA && isHourValid(h, dept);
    }).map(p => parseHour(p.session_start||''));
    const hoursB = dayA === dayB ? hoursA : prefs.filter(p => {
      const di = dayIdx(p.day||'');
      const h = parseHour(p.session_start||'');
      return di !== undefined && !isNaN(di) && DAYS_PT[di] === dayB && isHourValid(h, dept);
    }).map(p => parseHour(p.session_start||''));
    if (dayA === dayB) {
      const u = [...new Set(hoursA)];
      u.forEach((h1,i) => u.slice(i+1).forEach(h2 => {
        const k=`${h1}+${h2}`; combos[k]=(combos[k]||0)+1;
      }));
    } else {
      hoursA.forEach(ha => hoursB.forEach(hb => {
        const k=`${ha}+${hb}`; combos[k]=(combos[k]||0)+1;
      }));
    }
  });

  const sortedCombos = Object.entries(combos).sort((a,b) => b[1]-a[1]);

  if (!students.length) {
    drillEl.innerHTML = `<div class="drill-panel">
      <div class="drill-hdr">
        <div class="drill-title">${pair.label} · ${meta.label||activeLevel} · ${branchLabel}</div>
        <button class="drill-btn drill-btn-close" onclick="closeDrill()">✕</button>
      </div>
      <div class="drill-empty">Nenhum aluno disponível neste par de dias.</div>
    </div>`;
    return;
  }

  // Build hour-combo sub-groups
  let comboRows = '';
  sortedCombos.forEach(([k, n]) => {
    const [hA, hB] = k.split('+').map(Number);
    const inCombo = students.filter(e => {
      const prefs = parseDayPrefs(reqByRef[e.ref]?.day_preferences);
      if (dayA === dayB) {
        const hours = prefs.filter(p => {
          const di = dayIdx(p.day||'');
          return di !== undefined && !isNaN(di) && DAYS_PT[di] === dayA;
        }).map(p => parseHour(p.session_start||''));
        return hours.includes(hA) && hours.includes(hB);
      }
      const hasA = prefs.some(p => {
        const di = dayIdx(p.day||'');
        return di !== undefined && !isNaN(di) && DAYS_PT[di] === dayA && parseHour(p.session_start||'') === hA;
      });
      const hasB = prefs.some(p => {
        const di = dayIdx(p.day||'');
        return di !== undefined && !isNaN(di) && DAYS_PT[di] === dayB && parseHour(p.session_start||'') === hB;
      });
      return hasA && hasB;
    });
    if (!inCombo.length) return;
    const viable = inCombo.length >= 5;
    const col = inCombo.length >= 8 ? 'var(--green)' : inCombo.length >= 5 ? 'var(--amber)' : 'var(--red)';
    comboRows += `<div style="margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--b)">
        <div style="font-family:var(--mono);font-size:10px;font-weight:600;color:var(--gold2)">
          ${dayA} ${hA}h &nbsp;·&nbsp; ${dayB} ${hB}h
        </div>
        <div style="font-size:20px;font-weight:700;color:${col};margin-left:auto;line-height:1">${inCombo.length}</div>
        <div style="font-size:7px;color:var(--t3)">alunos</div>
        ${!viable?'<div style="font-size:7.5px;color:var(--red)">abaixo do mínimo</div>':''}
      </div>
      ${inCombo.sort((a,b)=>(a.name||'').localeCompare(b.name||'')).map(e => {
        const req = reqByRef[e.ref];
        const st = req ? normStatus(req.status) : 'sem_pedido';
        const bCls = st==='atribuido'?'badge-ok':st==='sem_pedido'?'badge-err':'badge-warn';
        const br = BRANCH_LABELS[normBranch(e.branch)] || e.branch || '—';
        return `<div style="display:flex;align-items:center;gap:8px;padding:4px 0;
          border-bottom:.5px solid rgba(201,168,76,.04)">
          <div style="flex:1;min-width:0">
            <div style="font-size:9px;color:var(--t)">${e.name||'—'}</div>
            <div style="font-size:7px;color:var(--t3)">${e.ref} · ${br}</div>
          </div>
          <span class="badge ${bCls}">${st==='atribuido'?'atribuído':st==='sem_pedido'?'sem pedido':'pendente'}</span>
        </div>`;
      }).join('')}
    </div>`;
  });

  drillEl.innerHTML = `<div class="drill-panel">
    <div class="drill-hdr">
      <div class="drill-title">${pair.label} · ${meta.label||activeLevel} · ${branchLabel}</div>
      <div class="drill-count">${students.length} aluno${students.length!==1?'s':''}</div>
      <div class="drill-actions">
        <button class="drill-btn drill-btn-close" onclick="closeDrill()">✕</button>
      </div>
    </div>
    <div class="drill-list" style="padding:8px 14px">${comboRows}</div>
  </div>`;
}

function closeDrill() {
  currentDrillSlot = null;
  document.querySelectorAll('.slot-card').forEach(c => c.classList.remove('chosen'));
  const el = document.getElementById('slot-drill');
  if (el) el.innerHTML = '';
}

/* ══ EXPORT CSV ══ */
function exportSlot(day, hour) {
  const students = getStudentsForSlot(activeLevel, activeLoc, day, parseInt(hour));
  const meta = LEVEL_MAP[activeLevel] || {};
  const levelLabel = meta.label || activeLevel;
  const branchLabel = activeLoc === 'all' ? 'Todas' : (BRANCH_LABELS[activeLoc] || activeLoc);

  const rows = [
    `ALM · ${levelLabel} · ${branchLabel} · ${day} ${hour}h`,
    `Exportado: ${new Date().toLocaleString('pt-PT')}`,
    `Total: ${students.length} alunos`,
    '',
    'Nome,Ref,Filial,Nível,Todos os Slots,Estado'
  ];

  students
    .sort((a, b) => (a.name || '').localeCompare(b.name || ''))
    .forEach(e => {
      const req    = reqByRef[e.ref];
      const status = req ? normStatus(req.status) : 'sem pedido';
      const prefs  = parseDayPrefs(req?.day_preferences);
      const slots  = prefs.map(p => {
        const di = dayIdx(p.day || '');
        const h  = parseHour(p.session_start || '');
        return (di !== undefined && h !== null) ? `${DAYS_PT[di]} ${h}h` : '';
      }).filter(Boolean).join(' + ');
      const branch = BRANCH_LABELS[normBranch(e.branch)] || e.branch || '—';
      rows.push(`"${e.name || ''}","${e.ref || ''}","${branch}","${levelLabel}","${slots}","${status}"`);
    });

  const blob = new Blob([rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ALM-${levelLabel}-${branchLabel}-${day}-${hour}h.csv`.replace(/\s+/g, '_');
  a.click();
  showToast(`CSV exportado · ${students.length} alunos`);
}

/* ══ PRINT ══ */
function printSlot(day, hour) {
  const students = getStudentsForSlot(activeLevel, activeLoc, day, parseInt(hour));
  const meta = LEVEL_MAP[activeLevel] || {};
  const levelLabel = meta.label || activeLevel;
  const branchLabel = activeLoc === 'all' ? 'Todas as filiais' : (BRANCH_LABELS[activeLoc] || activeLoc);

  const rows = students
    .sort((a, b) => (a.name || '').localeCompare(b.name || ''))
    .map((e, i) => {
      const req    = reqByRef[e.ref];
      const status = req ? normStatus(req.status) : 'sem pedido';
      const prefs  = parseDayPrefs(req?.day_preferences);
      const slots  = prefs.map(p => {
        const di = dayIdx(p.day || '');
        const h  = parseHour(p.session_start || '');
        return (di !== undefined && h !== null) ? `${DAYS_PT[di]} ${h}h` : '';
      }).filter(Boolean).join(' + ');
      const branch = BRANCH_LABELS[normBranch(e.branch)] || e.branch || '—';
      return `<tr style="border-bottom:1px solid #eee">
        <td style="padding:6px 10px;font-size:12px">${i + 1}</td>
        <td style="padding:6px 10px;font-size:12px;font-weight:600">${e.name || '—'}</td>
        <td style="padding:6px 10px;font-size:11px;color:#666">${e.ref || '—'}</td>
        <td style="padding:6px 10px;font-size:11px">${branch}</td>
        <td style="padding:6px 10px;font-size:11px;font-family:monospace">${slots}</td>
        <td style="padding:6px 10px;font-size:11px">${status}</td>
      </tr>`;
    }).join('');

  const win = window.open('', '_blank');
  win.document.write(`<!DOCTYPE html><html><head>
    <meta charset="UTF-8">
    <title>ALM · ${levelLabel} · ${day} ${hour}h</title>
    <style>
      body{font-family:monospace;margin:30px;color:#000}
      h1{font-size:18px;margin-bottom:4px}
      .meta{font-size:12px;color:#666;margin-bottom:20px}
      table{width:100%;border-collapse:collapse;font-size:12px}
      th{background:#f0f0f0;padding:7px 10px;text-align:left;font-size:11px;
         border-bottom:2px solid #ccc;letter-spacing:.05em;text-transform:uppercase}
      tr:nth-child(even) td{background:#fafafa}
      @media print{@page{margin:20mm}}
    </style>
  </head><body>
    <h1>ALM · ${levelLabel} · ${branchLabel} · ${day} ${hour}h00</h1>
    <div class="meta">
      ${students.length} aluno${students.length !== 1 ? 's' : ''} disponíveis ·
      Exportado: ${new Date().toLocaleString('pt-PT')}
    </div>
    <table>
      <thead><tr>
        <th>#</th><th>Nome</th><th>Ref</th>
        <th>Filial</th><th>Slots Pedidos</th><th>Estado</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <script>window.onload=()=>window.print()<\/script>
  </body></html>`);
  win.document.close();
}

/* ══ LOAD ══ */
async function loadAll() {
  const pill = document.getElementById('pill-status');
  try {
    const [enrol, reqs] = await Promise.all([
      sbGet('enrolments',
        `select=ref,name,branch,lang,family,level_cefr&academic_year=eq.${encodeURIComponent(AY)}&limit=2000`),
      sbGet('timetable_requests',
        `select=ref,student_name,branch,family,level_cefr,day_preferences,status&academic_year=eq.${encodeURIComponent(AY)}&limit=2000`)
    ]);
    allEnrolments = enrol || [];
    allRequests   = reqs  || [];
    reqByRef = {};
    allRequests.forEach(r => { reqByRef[r.ref] = r; });

    const total = allEnrolments.length;
    const sem   = allEnrolments.filter(e => !reqByRef[e.ref]).length;

    document.getElementById('pill-total').textContent = `${total} al`;
    pill.textContent = `Supabase · ${allRequests.length} pedidos`;
    pill.className = 'topbar-pill ok';
    document.getElementById('badge-audit').textContent = sem;

    initOverview();
    renderAudit();
    showToast(`${total} inscritos · ${allRequests.length} pedidos carregados`);

    const ovTab = document.querySelector('.tab[data-panel="overview"]');
    if (ovTab) switchTab(ovTab);

  } catch(e) {
    pill.textContent = 'Erro Supabase';
    pill.className = 'topbar-pill err';
    const errHtml = `<div class="err-msg">Erro: ${e.message}</div>`;
    document.getElementById('level-tree').innerHTML = errHtml;
    document.getElementById('audit-rows').innerHTML = errHtml;
    document.getElementById('ov-right').innerHTML   = errHtml;
    showToast('Erro: ' + e.message, 'err');
  }
}

/* ══ OVERVIEW ══ */
function initOverview() {
  const branches = [...new Set(allEnrolments.map(e => normBranch(e.branch)).filter(Boolean))];
  const ordered  = BRANCH_ORDER.filter(b => branches.includes(b))
    .concat(branches.filter(b => !BRANCH_ORDER.includes(b)));

  document.getElementById('loc-tabs').innerHTML =
    `<button class="loc-tab active" onclick="setLoc('all',this)">Tudo</button>` +
    ordered.map(b =>
      `<button class="loc-tab" onclick="setLoc('${b}',this)">${BRANCH_LABELS[b] || b}</button>`
    ).join('');

  renderOverviewStats();
  renderTree();
  renderOvSummary();
}

function setLoc(loc, btn) {
  activeLoc = loc;
  document.querySelectorAll('.loc-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  activeLevel = null;
  closeDrill();
  renderOverviewStats();
  renderTree();
  renderOvSummary();
}

function renderOverviewStats() {
  const students = getLocStudents();
  const com = students.filter(e => reqByRef[e.ref]).length;
  document.getElementById('ov-total').textContent = students.length;
  document.getElementById('ov-com').textContent   = com;
  document.getElementById('ov-sem').textContent   = students.length - com;
}

function renderTree() {
  const students = getLocStudents();
  const tree = {};
  students.forEach(e => {
    const meta = getLevelMeta(e);
    const dk = meta.dept, lk = levelKey(e);
    if (!tree[dk]) tree[dk] = {};
    if (!tree[dk][lk]) tree[dk][lk] = [];
    tree[dk][lk].push(e);
  });

  let html = '';
  DEPT_ORDER.forEach(dk => {
    if (!tree[dk]) return;
    const dc = DEPT_CONFIG[dk];
    const dStudents = Object.values(tree[dk]).flat();
    const isOpen = openDepts[dk];
    const sortedLks = Object.keys(tree[dk]).sort((a, b) =>
      (LEVEL_MAP[a]?.order || 99) - (LEVEL_MAP[b]?.order || 99));

    html += `<div class="dept-block">
      <div class="dept-hdr" onclick="toggleDept('${dk}')">
        <div class="dept-bar" style="background:${dc.color}"></div>
        <div class="dept-hdr-name" style="color:${dc.color}">${dc.label}</div>
        <div class="dept-hdr-n">${dStudents.length} al</div>
        <div class="dept-arrow${isOpen ? ' open' : ''}">▶</div>
      </div>
      <div class="level-list${isOpen ? ' open' : ''}">`;

    sortedLks.forEach(lk => {
      const ls   = tree[dk][lk];
      const meta = LEVEL_MAP[lk] || getLevelMeta(ls[0]);
      const sem  = ls.filter(e => !reqByRef[e.ref]).length;
      const isAct = activeLevel === lk;
      const badgeCls = sem > 0 ? 'badge-warn' : 'badge-ok';
      const badgeTxt = sem > 0 ? `${sem} s/ped` : 'ok';
      html += `<div class="level-item${isAct ? ' active' : ''}" onclick="selectLevel('${lk}')">
        <div class="level-dot" style="background:${meta.color}"></div>
        <div class="level-item-name">${meta.label}</div>
        <div class="level-item-n">${ls.length}</div>
        <div class="level-item-badge badge ${badgeCls}">${badgeTxt}</div>
      </div>`;
    });
    html += `</div></div>`;
  });

  document.getElementById('level-tree').innerHTML =
    html || '<div class="empty-msg">Sem dados para esta filial.</div>';
}

function toggleDept(dk) {
  openDepts[dk] = !openDepts[dk];
  renderTree();
}

function selectLevel(lk) {
  activeLevel = lk;
  closeDrill();
  renderTree();
  renderOvLevel();
}

/* ══ OVERVIEW SUMMARY (no level selected) ══ */
function renderOvSummary() {
  const students = getLocStudents();
  const total = students.length;
  if (!total) {
    document.getElementById('ov-right').innerHTML =
      '<div class="empty-msg">Sem inscrições para esta filial.</div>';
    return;
  }
  const com  = students.filter(e => reqByRef[e.ref]).length;
  const sem  = total - com;
  const pend = students.filter(e => {
    const r = reqByRef[e.ref];
    return r && normStatus(r.status) === 'pendente';
  }).length;

  const deptCounts = {};
  DEPT_ORDER.forEach(dk => {
    deptCounts[dk] = students.filter(e => getLevelMeta(e).dept === dk).length;
  });
  const maxDept = Math.max(...Object.values(deptCounts), 1);

  let html = `<div class="sec">Visão geral${activeLoc !== 'all' ? ' · ' + (BRANCH_LABELS[activeLoc] || activeLoc) : ''}</div>`;
  html += `<div style="background:var(--bg2);border:1px solid var(--b);padding:12px 14px;margin-bottom:14px">`;
  DEPT_ORDER.forEach(dk => {
    const dc = DEPT_CONFIG[dk];
    const n  = deptCounts[dk] || 0;
    const pct = Math.round(n / maxDept * 100);
    html += `<div class="dept-row">
      <div class="dept-row-name" style="color:${dc.color}">${dc.label}</div>
      <div class="dept-track"><div class="dept-fill" style="width:${pct}%;background:${dc.color}"></div></div>
      <div class="dept-n">${n}</div>
    </div>`;
  });
  html += `</div>`;
  html += `<div class="sec">Próximas acções</div>
  <div style="background:var(--bg2);border:1px solid var(--b);padding:2px 14px;margin-bottom:14px">
    <div class="action-row">
      <div class="action-dot" style="background:var(--red)"></div>
      <span style="color:var(--t2)">${sem} aluno${sem!==1?'s':''} sem pedido de horário</span>
      <a class="action-btn action-btn-gold" href="#" onclick="switchTabById('audit');return false;">Audit →</a>
    </div>
    <div class="action-row">
      <div class="action-dot" style="background:var(--amber)"></div>
      <span style="color:var(--t2)">${pend} turma${pend!==1?'s':''} aguardam decisão</span>
      <a class="action-btn action-btn-gold" href="/admin/alm-allocation-engine">Decision →</a>
    </div>
    <div class="action-row">
      <div class="action-dot" style="background:var(--teal)"></div>
      <span style="color:var(--t2)">Formação de turmas em curso</span>
      <a class="action-btn action-btn-gold" href="/admin/alm-group-formation">Formation →</a>
    </div>
    <div class="action-row">
      <div class="action-dot" style="background:var(--green)"></div>
      <span style="color:var(--t2)">Atribuir professores a turmas aprovadas</span>
      <a class="action-btn action-btn-green" href="/admin/alm-atribuir-turmas">Assign →</a>
    </div>
  </div>
  <div style="font-size:7.5px;color:var(--t3);padding:4px 0">← Seleccione um nível para ver disponibilidade por slot</div>`;

  document.getElementById('ov-right').innerHTML = html;
}

/* ══ OVERVIEW LEVEL (level selected) ══ */
function renderOvLevel() {
  const el = document.getElementById('ov-right');
  const students = getLocStudents().filter(e => levelKey(e) === activeLevel);

  if (!students.length) {
    el.innerHTML = '<div class="empty-msg">Nenhum aluno neste nível para a filial seleccionada.</div>';
    return;
  }

  const meta   = LEVEL_MAP[activeLevel] || getLevelMeta(students[0]);
  const dc     = DEPT_CONFIG[meta.dept] || {};
  const com    = students.filter(e => reqByRef[e.ref]).length;
  const sem    = students.length - com;
  const capPct = Math.round(students.length / meta.max * 100);

  let html = `<div class="sec">${meta.label} · <span style="color:${meta.color}">${dc.label || ''}</span></div>`;

  html += `<div class="level-summary">
    <div class="ls-stat"><div class="ls-v" style="color:${meta.color}">${students.length}</div><div class="ls-l">Alunos</div></div>
    <div class="ls-stat"><div class="ls-v" style="color:var(--green)">${com}</div><div class="ls-l">Com pedido</div></div>
    <div class="ls-stat"><div class="ls-v" style="color:var(--red)">${sem}</div><div class="ls-l">Sem pedido</div></div>
    <div style="flex:1">
      <div style="font-size:6.5px;color:var(--t3);margin-bottom:4px">${capPct}% capacidade (max ${meta.max})</div>
      <div class="cap-bar"><div class="cap-fill" style="width:${capPct}%;background:${meta.color}"></div></div>
    </div>
  </div>`;

  if (com > 0) {
    // Show group proposals first
    html += renderGroupProposals(activeLevel, activeLoc, meta);

    // Then valid pair summary cards (replace raw slot cards)
    const lvMeta2 = LEVEL_MAP[activeLevel] || {};
    const dept2   = lvMeta2.dept || 'adults';
    const pairs   = validPairsForDept(dept2);
    const studentsWithReq = students.filter(e => reqByRef[e.ref]);
    const pairCounts = pairs.map(pair => ({
      pair,
      count: countPairStudents(studentsWithReq, pair, dept2)
    })).filter(p => p.count > 0).sort((a,b) => b.count - a.count);

    if (pairCounts.length) {
      html += `<div class="sec" style="margin-top:8px">Pares de dias válidos · clique para ver alunos disponíveis</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin-bottom:14px">`;
      pairCounts.forEach(({ pair, count }) => {
        const pct = com > 0 ? Math.round(count / com * 100) : 0;
        const col = pct >= 50 ? 'var(--green)' : pct >= 25 ? 'var(--amber)' : 'var(--red)';
        const pctCls = pct >= 50 ? 'hi' : pct >= 25 ? 'mid' : 'lo';
        html += `<div class="slot-card" onclick="drillPair('${pair.a}','${pair.b}',this)">
          <div class="slot-pct-badge ${pctCls}">${pct}%</div>
          <div class="slot-card-count" style="color:${col}">${count}</div>
          <div class="slot-card-time" style="font-size:10px;font-weight:600;margin-top:6px">${pair.label}</div>
          <div class="slot-card-day">ambos os dias</div>
        </div>`;
      });
      html += `</div>`;
    }
  } else {
    html += `<div class="empty-msg" style="padding:16px 0;text-align:left">Nenhum pedido de horário submetido neste nível.</div>`;
  }

  /* ── drill panel ── */
  html += `<div id="slot-drill"></div>`;

  html += `<div class="sec" style="margin-top:8px">Alunos · ${students.length} registos</div>
  <div class="student-hdr"><span>Nome</span><span>Disponibilidade</span><span>Status</span></div>`;

  students
    .sort((a, b) => (a.name || '').localeCompare(b.name || ''))
    .slice(0, 300)
    .forEach(e => {
      const req     = reqByRef[e.ref];
      const prefs   = parseDayPrefs(req?.day_preferences);
      const dayIdxs = prefs.map(p => dayIdx(p.day || p.weekday || p.dia || ''));
      const cells   = DAYS_PT.map((_, di) =>
        `<div class="hcell${dayIdxs.includes(di) ? ' on' : ''}"></div>`).join('');
      const status  = req ? normStatus(req.status) : 'sem_pedido';
      const bCls    = status === 'atribuido' ? 'badge-ok' : status === 'sem_pedido' ? 'badge-err' : 'badge-warn';
      const bTxt    = status === 'atribuido' ? 'atribuído' : status === 'sem_pedido' ? 'sem pedido' : 'pendente';
      html += `<div class="student-row">
        <div class="sr-cell">
          <div style="font-size:9px;color:var(--t)">${e.name || '—'}</div>
          <div style="font-size:7px;color:var(--t3)">${e.ref || '—'}</div>
        </div>
        <div class="sr-cell">
          <div class="heatstrip">${cells}</div>
          <div style="font-size:6px;color:var(--t4);margin-top:2px;letter-spacing:.04em">S T Q Q S S</div>
        </div>
        <div class="sr-cell"><span class="badge ${bCls}">${bTxt}</span></div>
      </div>`;
    });

  if (students.length > 300)
    html += `<div class="empty-msg">… e mais ${students.length - 300} alunos</div>`;

  el.innerHTML = html;
}

/* ══ AUDIT ══ */
function setAF(btn) {
  const group = btn.dataset.group, val = btn.dataset.val;
  auditFilters[group] = val;
  document.querySelectorAll(`#audit-filter-row .fbt[data-group="${group}"]`)
    .forEach(b => b.classList.remove('act'));
  btn.classList.add('act');
  renderAudit();
}

function renderAudit() {
  let students = [...allEnrolments];
  if (auditFilters.branch !== 'all')
    students = students.filter(e => normBranch(e.branch) === auditFilters.branch);
  if (auditFilters.dept !== 'all')
    students = students.filter(e => (e.family || '').toLowerCase() === auditFilters.dept);
  if (auditFilters.status !== 'all') {
    students = students.filter(e => {
      const req = reqByRef[e.ref];
      if (auditFilters.status === 'noreq')     return !req;
      if (auditFilters.status === 'pendente')  return req && normStatus(req.status) === 'pendente';
      if (auditFilters.status === 'atribuido') return req && normStatus(req.status) === 'atribuido';
      return true;
    });
  }
  const q = (document.getElementById('audit-search')?.value || '').toLowerCase().trim();
  if (q) students = students.filter(e =>
    (e.name || '').toLowerCase().includes(q) || (e.ref || '').toLowerCase().includes(q));

  const total = allEnrolments.length;
  const com   = allEnrolments.filter(e => reqByRef[e.ref]).length;
  const sem   = total - com;
  const pend  = allEnrolments.filter(e => {
    const r = reqByRef[e.ref];
    return r && normStatus(r.status) === 'pendente';
  }).length;
  document.getElementById('a-total').textContent = total;
  document.getElementById('a-com').textContent   = com;
  document.getElementById('a-sem').textContent   = sem;
  document.getElementById('a-pend').textContent  = pend;
  document.getElementById('badge-audit').textContent = sem;

  const showing = Math.min(students.length, 500);
  document.getElementById('audit-count-lbl').textContent =
    `A mostrar ${showing} de ${students.length} registos`;

  const html = students.slice(0, 500).map(e => {
    const req     = reqByRef[e.ref];
    const meta    = getLevelMeta(e);
    const dc      = DEPT_CONFIG[meta.dept] || {};
    const prefs   = parseDayPrefs(req?.day_preferences);
    const dayIdxs = prefs.map(p => dayIdx(p.day || p.weekday || p.dia || ''));
    const cells   = DAYS_PT.map((_, di) =>
      `<div class="hcell${dayIdxs.includes(di) ? ' on' : ''}"></div>`).join('');
    const status  = req ? normStatus(req.status) : 'sem_pedido';
    const bCls    = status === 'atribuido' ? 'badge-ok' : status === 'sem_pedido' ? 'badge-err' : 'badge-warn';
    const bTxt    = status === 'atribuido' ? 'atribuído' : status === 'sem_pedido' ? 'sem pedido' : 'pendente';
    return `<div class="audit-row">
      <div class="ar-cell">
        <div style="font-size:9px;color:var(--t)">${e.name || '—'}</div>
        <div style="font-size:7px;color:var(--t3)">${e.ref || '—'}</div>
      </div>
      <div class="ar-cell">
        <div style="font-size:9px;font-weight:600;color:${meta.color}">${meta.label}</div>
        <div style="font-size:7px;color:var(--t3)">${e.level_cefr || '—'} · ${dc.label || ''}</div>
      </div>
      <div class="ar-cell">
        <div class="heatstrip">${cells}</div>
        <div style="font-size:6px;color:var(--t4);margin-top:3px;letter-spacing:.04em">S T Q Q S S</div>
      </div>
      <div class="ar-cell" style="text-align:center">
        <span class="badge ${bCls}">${bTxt}</span>
      </div>
    </div>`;
  }).join('');

  document.getElementById('audit-rows').innerHTML =
    html || '<div class="empty-msg">Nenhum resultado com estes filtros.</div>';
}

/* ══ BOOT ══ */
loadAll();
</script>
