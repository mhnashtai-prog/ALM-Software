<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ALM · 2026/2027</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9A84C;--gold2:#E8C97A;--gold3:rgba(201,168,76,.15);--gold4:rgba(201,168,76,.06);
  --green:#1DB87A;--green-a:rgba(29,184,122,.14);--green-b:rgba(29,184,122,.3);
  --red:#E8455A;--red-a:rgba(232,69,90,.12);--red-b:rgba(232,69,90,.3);
  --amber:#E8A020;--amber-a:rgba(232,160,32,.13);--amber-b:rgba(232,160,32,.3);
  --teal:#28C8B0;--purple:#9B5ECA;--blue:#4A8FF5;
  --bg:#07060E;--bg2:#0E0B1A;--bg3:#141025;
  --b:rgba(201,168,76,.07);--b2:rgba(201,168,76,.16);--b3:rgba(201,168,76,.30);
  --t:rgba(238,218,168,.92);--t2:rgba(210,188,140,.52);--t3:rgba(210,188,140,.26);--t4:rgba(210,188,140,.10);
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',system-ui,sans-serif;
  --c-juv:#28C8B0;--c-ger:#C8A44A;--c-exa:#9B5ECA;--c-inf:#4A8FF5;
}
html,body{height:100%;background:var(--bg);color:var(--t);font-family:var(--mono);font-size:12px;-webkit-font-smoothing:antialiased;overflow:hidden}
body{display:flex;flex-direction:column}

/* ══ TOPBAR ══ */
.topbar{flex-shrink:0;height:50px;display:flex;align-items:center;background:rgba(7,6,14,.99);border-bottom:1px solid var(--b2);position:relative;z-index:200}
.home-btn{display:flex;align-items:center;gap:7px;padding:0 16px;height:100%;border-right:1px solid var(--b);text-decoration:none;flex-shrink:0;transition:background .15s}
.home-btn:hover{background:var(--gold4)}
.home-icon{font-size:13px;color:var(--t3);transition:color .15s}
.home-btn:hover .home-icon{color:var(--gold2)}
.home-label{font-size:7px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t4);transition:color .15s}
.home-btn:hover .home-label{color:var(--gold)}
.brand{display:flex;align-items:center;padding:0 18px;height:100%;border-right:1px solid var(--b);flex-shrink:0}
.brand-alm{font-size:18px;font-weight:700;letter-spacing:8px;color:var(--gold2)}
.brand-yr{font-size:7px;color:var(--t3);letter-spacing:.14em;margin-left:8px;align-self:flex-end;padding-bottom:3px}
.tabs{display:flex;align-items:stretch;height:100%;flex:1;overflow:hidden}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 20px;cursor:pointer;border-right:1px solid var(--b);border-bottom:2px solid transparent;transition:all .18s;position:relative;flex-shrink:0;gap:3px;text-decoration:none}
.tab:hover{background:var(--gold4)}
.tab.active{background:rgba(201,168,76,.05);border-bottom-color:var(--gold)}
.tab-num{font-size:7px;font-weight:700;letter-spacing:.08em;color:var(--t4);width:16px;height:16px;border:1px solid var(--b);display:flex;align-items:center;justify-content:center;transition:all .18s}
.tab.active .tab-num{background:var(--gold);color:#07060E;border-color:var(--gold)}
.tab-label{font-size:8px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);transition:color .18s;white-space:nowrap}
.tab.active .tab-label{color:var(--gold2)}
.tab:hover .tab-label{color:var(--t2)}
.tab-badge{position:absolute;top:7px;right:7px;background:var(--red);color:#fff;font-size:6px;font-weight:700;padding:1px 4px;min-width:14px;text-align:center;border-radius:6px;line-height:1.4}
.tab-link{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 20px;border-right:1px solid var(--b);border-bottom:2px solid transparent;transition:all .18s;position:relative;flex-shrink:0;gap:3px;text-decoration:none;cursor:pointer}
.tab-link:hover{background:var(--gold4);border-bottom-color:var(--b2)}
.tab-link .tab-num{font-size:7px;font-weight:700;color:var(--t4);width:16px;height:16px;border:1px solid var(--b);display:flex;align-items:center;justify-content:center;transition:all .18s}
.tab-link:hover .tab-num{background:var(--b2);color:var(--gold)}
.tab-link .tab-label{font-size:8px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);transition:color .18s;white-space:nowrap}
.tab-link:hover .tab-label{color:var(--t2)}
.tab-link-arrow{font-size:7px;color:var(--t4);transition:color .15s;margin-top:1px}
.tab-link:hover .tab-link-arrow{color:var(--gold)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;padding:0 14px;border-left:1px solid var(--b);height:100%;flex-shrink:0}
.live{display:flex;align-items:center;gap:5px}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.live-lbl{font-size:7px;font-weight:700;letter-spacing:.1em;color:var(--green)}
.topbar-pill{font-size:7px;font-weight:600;letter-spacing:.08em;padding:2px 9px;border:1px solid var(--b2);color:var(--t2)}
.topbar-pill.gold{color:var(--gold2);border-color:var(--b3);background:var(--gold4)}
.topbar-pill.ok{color:var(--green);border-color:var(--green-b)}
.topbar-pill.err{color:var(--red);border-color:var(--red-b)}
.topbar-pill.loading{color:var(--amber);border-color:var(--amber-b)}

/* ══ PANELS ══ */
.panels{flex:1;overflow:hidden;position:relative}
.panel{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none;scrollbar-width:thin;scrollbar-color:var(--b) transparent}
.panel.active{display:block;animation:fadeIn .18s ease}
.panel.active.flex-panel{display:flex!important}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.panel::-webkit-scrollbar{width:3px}
.panel::-webkit-scrollbar-thumb{background:var(--b2)}
#panel-overview{flex-direction:row}

/* ══ SHARED ══ */
.sec{font-size:7.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sec::after{content:'';flex:1;height:.5px;background:var(--b2)}
.badge{font-size:6.5px;font-weight:700;padding:1px 6px;border:1px solid}
.badge-ok{background:var(--green-a);border-color:var(--green-b);color:var(--green)}
.badge-warn{background:var(--amber-a);border-color:var(--amber-b);color:var(--amber)}
.badge-err{background:var(--red-a);border-color:var(--red-b);color:var(--red)}
.spinner-wrap{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--t3);gap:10px;font-size:9px;letter-spacing:.1em}
.spinner{width:14px;height:14px;border:1.5px solid var(--b2);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-msg{padding:40px;text-align:center;color:var(--t3);font-size:9px;letter-spacing:.1em}
.err-msg{padding:20px;background:var(--red-a);border:1px solid var(--red-b);color:var(--red);font-size:9px;margin:16px 20px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(8px);padding:5px 18px;font-size:9px;font-weight:500;opacity:0;transition:all .2s;z-index:9000;pointer-events:none;border:1px solid;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--green-a);border-color:var(--green-b);color:var(--green)}
.toast.warn{background:var(--amber-a);border-color:var(--amber-b);color:var(--amber)}
.toast.err{background:var(--red-a);border-color:var(--red-b);color:var(--red)}

/* ══ OVERVIEW LEFT ══ */
.ov-left{width:290px;flex-shrink:0;border-right:1px solid var(--b2);overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column}
.ov-left::-webkit-scrollbar{width:3px}
.ov-left::-webkit-scrollbar-thumb{background:var(--b2)}
.ov-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--b);border-bottom:1px solid var(--b2);flex-shrink:0}
.ov-stat{padding:12px 10px;background:var(--bg)}
.ov-stat-v{font-size:20px;font-weight:700;line-height:1;cursor:pointer;transition:opacity .15s}
.ov-stat-v:hover{opacity:.75}
.ov-stat-l{font-size:6px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-top:3px}
.loc-tabs{display:flex;flex-wrap:wrap;gap:3px;padding:10px 10px 6px;border-bottom:1px solid var(--b);flex-shrink:0}
.loc-tab{font-size:7.5px;font-weight:600;letter-spacing:.06em;padding:3px 9px;border:1px solid var(--b);cursor:pointer;color:var(--t3);transition:all .13s;background:transparent;font-family:var(--mono)}
.loc-tab:hover{color:var(--t2);border-color:var(--b2)}
.loc-tab.active{background:var(--gold3);border-color:var(--gold);color:var(--gold2)}
.dept-block{border-bottom:1px solid var(--b)}
.dept-hdr{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;user-select:none}
.dept-hdr:hover{background:rgba(255,255,255,.015)}
.dept-bar{width:3px;height:14px;flex-shrink:0}
.dept-hdr-name{font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;flex:1}
.dept-hdr-n{font-size:8px;color:var(--t3)}
.dept-arrow{font-size:8px;color:var(--t4);transition:transform .18s}
.dept-arrow.open{transform:rotate(90deg)}
.level-list{display:none}
.level-list.open{display:block}
.level-item{display:flex;align-items:center;gap:7px;padding:6px 12px 6px 22px;cursor:pointer;border-left:2px solid transparent;transition:all .12s}
.level-item:hover{background:rgba(255,255,255,.02)}
.level-item.active{background:var(--gold4);border-left-color:var(--gold)}
.level-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.level-item-name{font-size:9px;font-weight:600;flex:1}
.level-item-n{font-size:8px;color:var(--t3);min-width:26px;text-align:right}
.level-item-badge{font-size:6px;font-weight:700;padding:1px 5px;border:1px solid;flex-shrink:0}

/* ══ OVERVIEW RIGHT ══ */
.ov-right{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 20px 40px}
.ov-right::-webkit-scrollbar{width:3px}
.ov-right::-webkit-scrollbar-thumb{background:var(--b2)}
.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60%;color:var(--t3);gap:8px}
.placeholder-icon{font-size:24px;opacity:.25}
.placeholder-text{font-size:8px;letter-spacing:.14em;text-transform:uppercase;opacity:.5}
.dept-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:.5px solid var(--b)}
.dept-row:last-child{border-bottom:none}
.dept-row-name{font-size:10px;font-weight:600;width:70px;flex-shrink:0}
.dept-track{flex:1;height:4px;background:rgba(255,255,255,.04)}
.dept-fill{height:100%;transition:width .8s ease}
.dept-n{font-size:9px;color:var(--t2);width:34px;text-align:right;flex-shrink:0}
.action-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:.5px solid var(--b);font-size:9px}
.action-row:last-child{border-bottom:none}
.action-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.action-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 13px;border:1px solid;cursor:pointer;font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:.06em;transition:all .13s;background:transparent;text-decoration:none;margin-left:auto}
.action-btn-gold{border-color:var(--b2);color:var(--gold)}
.action-btn-gold:hover{background:var(--gold3)}
.action-btn-green{border-color:var(--green-b);color:var(--green)}
.action-btn-green:hover{background:var(--green-a)}

/* ══ GROUP CARDS — redesigned hierarchy ══ */
.groups-master{margin-bottom:20px}
.group-card{background:var(--bg2);border:1px solid var(--b2);border-left:3px solid var(--green);margin-bottom:5px;cursor:pointer;transition:border-color .15s}
.group-card:hover{border-color:var(--b3)}
.group-card.open{border-color:var(--gold);border-left-color:var(--green)}
.group-card-hdr{display:flex;align-items:center;gap:12px;padding:10px 14px}
.group-letter{font-size:11px;font-weight:700;color:var(--green);width:24px;flex-shrink:0}
.group-slot{font-size:11px;font-weight:600;color:var(--gold2);flex:1;letter-spacing:.02em}
.group-block-tag{font-size:7px;font-weight:700;letter-spacing:.1em;padding:2px 7px;border:1px solid;flex-shrink:0}
.block-manha{background:rgba(74,143,245,.1);border-color:rgba(74,143,245,.3);color:var(--blue)}
.block-tarde{background:rgba(155,94,202,.1);border-color:rgba(155,94,202,.3);color:var(--purple)}
.group-count-wrap{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0}
.group-count{font-size:28px;font-weight:700;color:var(--green);line-height:1}
.group-count-lbl{font-size:6.5px;color:var(--t3);letter-spacing:.08em}
.group-overflow-tag{font-size:7px;color:var(--amber);margin-top:2px}
.group-arrow{font-size:8px;color:var(--t3);margin-left:6px;transition:transform .18s;flex-shrink:0}
.group-card.open .group-arrow{transform:rotate(180deg)}
.group-body{display:none;padding:0 14px 10px;border-top:1px solid var(--b)}
.group-card.open .group-body{display:block}
.group-actions{display:flex;gap:6px;padding:8px 0}
.gbtn{padding:3px 10px;border:1px solid;font-family:var(--mono);font-size:8px;cursor:pointer;background:transparent;transition:all .12s}
.gbtn-csv{border-color:var(--green-b);color:var(--green)}
.gbtn-csv:hover{background:var(--green-a)}
.gbtn-print{border-color:var(--b2);color:var(--gold)}
.gbtn-print:hover{background:var(--gold3)}
.group-student-row{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:.5px solid rgba(201,168,76,.04)}
.group-student-row:last-child{border-bottom:none}

/* ══ SINALIZADO BLOCK — secondary, compact ══ */
.sinal-block{margin-bottom:16px}
.sinal-hdr{display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(232,69,90,.04);border:1px solid var(--red-b);border-left:3px solid var(--red);cursor:pointer}
.sinal-hdr:hover{background:rgba(232,69,90,.07)}
.sinal-title{font-size:9px;font-weight:600;color:var(--red);flex:1}
.sinal-count{font-size:18px;font-weight:700;color:var(--red);line-height:1}
.sinal-count-lbl{font-size:6.5px;color:rgba(232,69,90,.6);letter-spacing:.08em}
.sinal-arrow{font-size:8px;color:var(--red-b);transition:transform .18s}
.sinal-body{display:none;border:1px solid var(--red-b);border-top:none;padding:10px 14px}
.sinal-body.open{display:block}
.sinal-sub{font-size:7.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(232,69,90,.6);margin:8px 0 5px}
.sinal-reason{font-size:8.5px;color:var(--red);line-height:1.5;padding:6px 0 10px;border-bottom:1px solid rgba(232,69,90,.12)}
.sinal-export{display:flex;gap:6px;padding:8px 0}
.sinal-student{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:.5px solid rgba(232,69,90,.08)}
.sinal-student:last-child{border-bottom:none}
.sinal-slots{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.slot-tag{font-size:7px;padding:1px 5px;border:1px solid}
.slot-valid{background:rgba(29,184,122,.08);border-color:rgba(29,184,122,.25);color:var(--green)}
.slot-invalid{background:rgba(232,69,90,.08);border-color:rgba(232,69,90,.25);color:var(--red)}
.slot-sameday{background:rgba(232,160,32,.1);border-color:rgba(232,160,32,.3);color:var(--amber)}

/* ══ PAIR CARDS ══ */
.pair-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-bottom:16px}
.pair-card{background:var(--bg2);border:1px solid var(--b);padding:12px;cursor:pointer;transition:all .15s;position:relative}
.pair-card:hover{border-color:var(--b2);transform:translateY(-1px)}
.pair-card.chosen{border-color:var(--gold);background:var(--gold4)}
.pair-count{font-size:28px;font-weight:700;line-height:1}
.pair-label{font-size:10px;font-weight:600;margin-top:6px}
.pair-sub{font-size:7px;color:var(--t3);margin-top:1px;letter-spacing:.04em;text-transform:uppercase}
.pair-pct{font-size:6.5px;font-weight:700;padding:1px 5px;border:1px solid;position:absolute;top:8px;right:8px}
.pct-hi{background:var(--green-a);border-color:var(--green-b);color:var(--green)}
.pct-mid{background:var(--amber-a);border-color:var(--amber-b);color:var(--amber)}
.pct-lo{background:var(--red-a);border-color:var(--red-b);color:var(--red)}

/* ══ DRILL PANEL ══ */
.drill-panel{background:var(--bg2);border:1px solid var(--b2);margin-bottom:16px;animation:fadeIn .2s ease}
.drill-hdr{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--b);background:rgba(0,0,0,.2)}
.drill-title{font-size:10px;font-weight:700;color:var(--gold2);flex:1}
.drill-count{font-size:9px;color:var(--t3)}
.drill-actions{display:flex;gap:6px}
.drill-btn{display:flex;align-items:center;gap:4px;padding:4px 11px;border:1px solid;font-family:var(--mono);font-size:8px;font-weight:600;cursor:pointer;background:transparent;transition:all .12s}
.drill-btn-csv{border-color:var(--green-b);color:var(--green)}
.drill-btn-csv:hover{background:var(--green-a)}
.drill-btn-print{border-color:var(--b2);color:var(--gold)}
.drill-btn-print:hover{background:var(--gold3)}
.drill-btn-close{border-color:var(--b);color:var(--t3)}
.drill-btn-close:hover{border-color:var(--red-b);color:var(--red)}
.drill-list{max-height:360px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--b) transparent}
.drill-list::-webkit-scrollbar{width:3px}
.drill-list::-webkit-scrollbar-thumb{background:var(--b2)}
.drill-row{display:grid;grid-template-columns:1fr 90px 110px 80px;align-items:center;border-bottom:.5px solid rgba(201,168,76,.04);transition:background .1s}
.drill-row:hover{background:rgba(201,168,76,.025)}
.drill-row-hdr{font-size:7px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);padding:5px 0 6px;border-bottom:1px solid var(--b2)}
.dr-cell{padding:6px 8px}
.drill-name{font-size:9px;color:var(--t)}
.drill-ref{font-size:7px;color:var(--t3);margin-top:1px}

/* ══ STUDENT LIST ══ */
.student-hdr{display:grid;grid-template-columns:1fr 120px 70px;font-size:7px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);padding:5px 0 8px;border-bottom:1px solid var(--b2);margin-bottom:2px}
.student-hdr span{padding:0 4px}
.student-row{display:grid;grid-template-columns:1fr 120px 70px;align-items:center;border-bottom:.5px solid rgba(201,168,76,.04);transition:background .1s}
.student-row:hover{background:rgba(201,168,76,.02)}
.sr-cell{padding:6px 4px}
.heatstrip{display:flex;gap:1px}
.hcell{width:11px;height:9px;border-radius:1px;background:rgba(255,255,255,.04);border:.5px solid rgba(255,255,255,.04)}
.hcell.on{background:rgba(40,200,176,.35);border-color:rgba(40,200,176,.5)}
.level-summary{background:var(--bg3);border:1px solid var(--b2);padding:14px;margin-bottom:14px;display:flex;gap:20px;flex-wrap:wrap;align-items:flex-end}
.ls-stat{display:flex;flex-direction:column;gap:2px}
.ls-v{font-size:22px;font-weight:700;line-height:1}
/* clickable stat */
.ls-v.clickable{cursor:pointer;transition:opacity .15s;border-bottom:1px solid transparent}
.ls-v.clickable:hover{opacity:.7;border-bottom-color:currentColor}
.ls-l{font-size:6.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}
.cap-bar{height:3px;background:rgba(255,255,255,.04);flex:1;margin-bottom:6px;overflow:hidden}
.cap-fill{height:100%;transition:width .6s}

/* ══ AUDIT ══ */
.audit-wrap{padding:0 20px 40px}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;padding:18px 0 14px}
.kpi{background:var(--bg2);border:1px solid var(--b);padding:11px 13px;position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1.5px;background:linear-gradient(90deg,transparent,currentColor,transparent)}

};

const DEPT_CONFIG = {
  kids:     { label:'Infantil', color:'var(--c-inf)' },
  kids_juv: { label:'Juvenil',  color:'var(--c-juv)' },
  adults:   { label:'Geral',    color:'var(--c-ger)' },
  exam:     { label:'Exames',   color:'var(--c-exa)' },
};
const DEPT_ORDER = ['kids','kids_juv','adults','exam'];

/* ══ DAY NORMALISATION ══ */
const DAYS_PT = ['SEG','TER','QUA','QUI','SEX','SÁB'];
const DAY_EN_TO_IDX = {
  monday:0, tuesday:1, wednesday:2, thursday:3, friday:4, saturday:5,
  segunda:0, terca:1, terça:1, quarta:2, quinta:3, sexta:4, sabado:5, sábado:5,
  'segunda-feira':0,'terça-feira':1,'quarta-feira':2,'quinta-feira':3,'sexta-feira':4,
  mon:0, tue:1, wed:2, thu:3, fri:4, sat:5,
  seg:0, ter:1, qua:2, qui:3, sex:4, sab:5, 'sáb':5
};

function normDay(str) {
  if (!str) return null;
  const n = parseInt(str);
  if (!isNaN(n) && n >= 1 && n <= 6) return n - 1;
  return DAY_EN_TO_IDX[(str+'').toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'')] ?? null;
}

/* ══════════════════════════════════════════════════════
   BLOCK CLASSIFICATION
   Morning : 8:00–11:00  (hours 8, 9, 10, 11)
   Afternoon: 14:00–20:00 (hours 14–20)
   Invalid:  anything else
══════════════════════════════════════════════════════ */
function parseHour(t) {
  if (t == null) return null;
  const h = parseInt((t + '').split(':')[0], 10);
  return isNaN(h) ? null : h;
}

function classifyBlock(sessionStart) {
  const h = parseHour(sessionStart);
  if (h === null) return null;
  if (h >= 8  && h <= 11) return 'manha';
  if (h >= 14 && h <= 20) return 'tarde';
  return null; // invalid window
}

/* ══ VALID ALM DAY PAIRS ══ */
const ALM_PAIRS = [
  { a:0, b:2, label:'SEG + QUA', aLbl:'SEG', bLbl:'QUA' }, // Mon+Wed
  { a:1, b:3, label:'TER + QUI', aLbl:'TER', bLbl:'QUI' }, // Tue+Thu
  { a:2, b:4, label:'QUA + SEX', aLbl:'QUA', bLbl:'SEX' }, // Wed+Fri
  { a:5, b:5, label:'SÁB (duplo)', aLbl:'SÁB', bLbl:'SÁB', examOnly:true },
];

/* ══════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════ */
let allEnrolments = [], allRequests = [], reqByRef = {};
let activeLoc = 'all', activeLevel = null;
let openDepts = { kids:true, kids_juv:false, adults:false, exam:false };
let auditFilters = { branch:'all', status:'all', dept:'all' };
let _lastProposals = null;
let openSinalBody = false;

/* ══════════════════════════════════════════════════════
   HELPERS
══════════════════════════════════════════════════════ */
function normBranch(b) { return (b||'').toUpperCase().replace(/[\s\-]+/g,'_').trim(); }
function normStatus(s) { return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); }
function levelKey(e)   { return `${(e.family||'').toLowerCase()}|${(e.level_cefr||'').toUpperCase()}`; }
function getLevelMeta(e){ return LEVEL_MAP[levelKey(e)] || { dept:'unknown', label:`${e.family||'?'}·${e.level_cefr||'?'}`, color:'var(--t3)', order:99, max:60 }; }
function getLocStudents(){ return activeLoc==='all' ? allEnrolments : allEnrolments.filter(e=>normBranch(e.branch)===activeLoc); }

function parseDayPrefs(raw) {
  if (!raw) return [];
  if (Array.isArray(raw)) return raw;
  try { const p=JSON.parse(raw); return Array.isArray(p)?p:[]; } catch { return []; }
}

/* ══════════════════════════════════════════════════════
   PREFERENCE ANALYSIS
   Returns structured object per student:
   { prefs, sameDay:bool, validSlots:[{dayIdx,block}], invalidSlots:[...], hasManha, hasTarde }
══════════════════════════════════════════════════════ */
function analysePrefs(ref) {
  const req = reqByRef[ref];
  if (!req) return null;
  const raw = parseDayPrefs(req.day_preferences);

  const slots = raw.map(p => {
    const dayIdx = normDay(p.day || p.weekday || p.dia || '');
    const block  = classifyBlock(p.session_start || p.start_time || '');
    const hour   = parseHour(p.session_start || p.start_time || '');
    return { dayIdx, block, hour, raw: p };
  }).filter(s => s.dayIdx !== null);

  // Detect same-day-twice (both entries map to same day index)
  const dayList = slots.map(s => s.dayIdx);
  const sameDay = dayList.length >= 2 && new Set(dayList).size < dayList.length;

  const validSlots   = slots.filter(s => s.block !== null);
  const invalidSlots = slots.filter(s => s.block === null);

  return {
    prefs: slots,
    sameDay,
    validSlots,
    invalidSlots,
    hasManha: validSlots.some(s => s.block === 'manha'),
    hasTarde: validSlots.some(s => s.block === 'tarde'),
    dayIdxs:  [...new Set(slots.map(s => s.dayIdx))]
  };
}

/* ══════════════════════════════════════════════════════
   CORE GROUPING ENGINE — REWRITTEN
   
   Logic:
   1. For each valid ALM day-pair (SEG+QUA, TER+QUI, QUA+SEX)
   2. For each session block (manhã, tarde)
   3. Find students who have at least one slot on day A AND at least
      one slot on day B, both in the SAME block
   4. If count ≥ MIN_GROUP → propose a group
   5. Cap at MAX_GROUP, create overflow group if remainder ≥ MIN_GROUP
   
   Students are flagged (sinalizado) if:
   - They submitted same-day-twice (invalid structure)
   - Their slots fall outside valid windows (not 8-11 or 14-20)
   - No viable pair+block combination has enough students for them
══════════════════════════════════════════════════════ */
const MIN_GROUP = 5;
const MAX_GROUP = 17;

function buildGroupProposals(lk, branch) {
  const allAtLevel = allEnrolments.filter(e => {
    if (levelKey(e) !== lk) return false;
    if (branch !== 'all' && normBranch(e.branch) !== branch) return false;
    return true;
  });

  const withRequest = allAtLevel.filter(e => !!reqByRef[e.ref]);
  const dept = (LEVEL_MAP[lk] || {}).dept || 'adults';

  const placed   = new Set();
  const groups   = [];

  // BUCKET 1: same-day-twice — immediately invalid
  const sameDayBucket = withRequest.filter(e => {
    const a = analysePrefs(e.ref);
    return a && a.sameDay;
  });
  sameDayBucket.forEach(e => placed.add(e.ref));

  // BUCKET 2: invalid time window (not morning or afternoon)
  const invalidWindowBucket = withRequest.filter(e => {
    if (placed.has(e.ref)) return false;
    const a = analysePrefs(e.ref);
    return a && a.validSlots.length === 0;
  });
  invalidWindowBucket.forEach(e => placed.add(e.ref));

  // ELIGIBLE: has valid slots, not already flagged
  const eligible = withRequest.filter(e => !placed.has(e.ref));

  // BUILD GROUPS: pair × block
  ALM_PAIRS.forEach(pair => {
    if (pair.examOnly && dept !== 'exam') return;

    ['manha', 'tarde'].forEach(block => {
      // Students available on BOTH days of this pair in this block
      const forPairBlock = eligible.filter(e => {
        if (placed.has(e.ref)) return false;
        const a = analysePrefs(e.ref);
        if (!a) return false;

        if (pair.a === pair.b) {
          // SAB duplo: needs 2 slots on Saturday in the same block
          const sabSlots = a.validSlots.filter(s => s.dayIdx === pair.a && s.block === block);
          return sabSlots.length >= 2;
        }

        const hasA = a.validSlots.some(s => s.dayIdx === pair.a && s.block === block);
        const hasB = a.validSlots.some(s => s.dayIdx === pair.b && s.block === block);
        return hasA && hasB;
      });

      if (forPairBlock.length < MIN_GROUP) return;

      // Slice into groups of MAX_GROUP
      let remaining = [...forPairBlock];
      let groupIdx  = 0;
      while (remaining.length >= MIN_GROUP) {
        const chunk = remaining.slice(0, MAX_GROUP);
        remaining   = remaining.slice(MAX_GROUP);
        chunk.forEach(e => placed.add(e.ref));
        groups.push({ pair, block, students: chunk, overflow: remaining.length >= MIN_GROUP ? [] : remaining });
        groupIdx++;
      }
      // remaining < MIN_GROUP: don't place them, they'll go to unplaced
    });
  });

  // BUCKET 3: valid slots but no compatible group (unplaced after algorithm)
  const unplaced = eligible.filter(e => !placed.has(e.ref));

  const sinalizados = [
    ...sameDayBucket.map(e => ({ e, reason: 'same-day' })),
    ...invalidWindowBucket.map(e => ({ e, reason: 'invalid-window' })),
    ...unplaced.map(e => ({ e, reason: 'no-group' }))
  ];

  return {
    groups,
    sinalizados,
    sameDayCt:     sameDayBucket.length,
    invalidWinCt:  invalidWindowBucket.length,
    noGroupCt:     unplaced.length,
    total:         allAtLevel.length,
    withRequest:   withRequest.length,
    placed:        groups.reduce((s,g) => s + g.students.length, 0)
  };
}

/* ══════════════════════════════════════════════════════
   RENDER GROUP PROPOSALS
══════════════════════════════════════════════════════ */
function renderGroupProposals(lk, branch, meta) {
  // Reuse result already computed by renderOvLevel — do NOT call buildGroupProposals again
  const result = _lastProposals;
  if (!result) return '';

  const { groups, sinalizados, total, withRequest, placed } = result;
  if (!groups.length && !sinalizados.length) return '';

  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const blockLabel = b => b === 'manha' ? 'Manhã 08–11h' : 'Tarde 14–20h';

  // Section header — no need to repeat placed/sinalizados, already in summary bar
  let html = `<div class="sec" style="margin-top:4px">Turmas propostas</div>`;

  /* ── GROUP CARDS ── */
  html += `<div class="groups-master">`;
  groups.forEach((g, i) => {
    const letter = letters[i] || (i+1);
    html += `
    <div class="group-card" id="gc-${i}" onclick="toggleGroupCard(${i})">
      <div class="group-card-hdr">
        <div class="group-letter">T${letter}</div>
        <div class="group-slot">${g.pair.aLbl} + ${g.pair.bLbl}</div>
        <div class="group-block-tag ${g.block==='manha'?'block-manha':'block-tarde'}">${blockLabel(g.block)}</div>
        <div class="group-count-wrap">
          <div class="group-count">${g.students.length}</div>
          <div class="group-count-lbl">alunos</div>
          ${g.overflow?.length ? `<div class="group-overflow-tag">+${g.overflow.length} overflow</div>` : ''}
        </div>
        <div class="group-arrow">▼</div>
      </div>
      <div class="group-body">
        <div class="group-actions">
          <button class="gbtn gbtn-csv" onclick="event.stopPropagation();exportGrp(${i})">↓ CSV</button>
          <button class="gbtn gbtn-print" onclick="event.stopPropagation();printGrp(${i})">⎙ Imprimir</button>
        </div>
        ${g.students.sort((a,b)=>(a.name||'').localeCompare(b.name||'')).map(e => {
          const req = reqByRef[e.ref];
          const st  = req ? normStatus(req.status) : 'sem_pedido';
          const bCls = st==='atribuido'?'badge-ok':st==='sem_pedido'?'badge-err':'badge-warn';
          const bTxt = st==='atribuido'?'atribuído':st==='sem_pedido'?'sem pedido':'pendente';
          const br = BRANCH_LABELS[normBranch(e.branch)] || e.branch || '—';
          return `<div class="group-student-row">
            <div style="flex:1;min-width:0">
              <div style="font-size:9px;color:var(--t)">${e.name||'—'}</div>
              <div style="font-size:7px;color:var(--t3)">${e.ref} · ${br}</div>
            </div>
            <span class="badge ${bCls}">${bTxt}</span>
          </div>`;
        }).join('')}
        ${g.overflow?.length ? `<div style="margin-top:6px;padding:5px 8px;background:var(--amber-a);border:1px solid var(--amber-b);font-size:8px;color:var(--amber)">
          ⚠ +${g.overflow.length} aluno${g.overflow.length!==1?'s':''} com o mesmo par/bloco — sem vaga nesta turma
        </div>` : ''}
      </div>
    </div>`;
  });
  html += `</div>`;

  /* ── SINALIZADO BLOCK ── */
  if (sinalizados.length) {
    const { sameDayCt, invalidWinCt, noGroupCt } = result;
    html += `
    <div class="sinal-block">
      <div class="sinal-hdr" onclick="toggleSinal()">
        <div style="display:flex;flex-direction:column;gap:2px;flex:1">
          <div class="sinal-title">⚠ Sinalizados · não podem ser alocados</div>
          <div style="font-size:7.5px;color:rgba(232,69,90,.55)">
            ${sameDayCt ? `${sameDayCt} mesmo dia · ` : ''}${invalidWinCt ? `${invalidWinCt} horário inválido · ` : ''}${noGroupCt ? `${noGroupCt} sem grupo compatível` : ''}
          </div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end">
          <div class="sinal-count">${sinalizados.length}</div>
          <div class="sinal-count-lbl">alunos</div>
        </div>
        <div class="sinal-arrow" id="sinal-arrow">▼</div>
      </div>
      <div class="sinal-body" id="sinal-body">
        <div class="sinal-export">
          <button class="gbtn gbtn-csv" onclick="exportSinalizados()">↓ CSV Sinalizados</button>
        </div>`;

    [
      { key:'same-day',       label:'Mesmo dia (submeteram dois slots no mesmo dia)',              ct: sameDayCt    },
      { key:'invalid-window', label:'Fora do horário escolar (não é manhã 8–11h nem tarde 14–20h)', ct: invalidWinCt },
      { key:'no-group',       label:'Sem grupo compatível (mínimo 5 alunos não atingido)',          ct: noGroupCt    },
    ].forEach(({ key, label, ct }) => {
      if (!ct) return;
      const subset = sinalizados.filter(s => s.reason === key);
      html += `<div class="sinal-sub">${label}</div>`;
      html += subset.map(({ e }) => {
        const a = analysePrefs(e.ref);
        const slots = (a?.prefs || []).map(s => {
          const dayLbl  = s.dayIdx !== null ? DAYS_PT[s.dayIdx] : '?';
          const timeStr = s.raw?.session_start || '—';
          let cls = 'slot-invalid';
          if (key === 'same-day') cls = 'slot-sameday';
          else if (s.block !== null) cls = 'slot-valid';
          return `<span class="slot-tag ${cls}">${dayLbl} ${timeStr}</span>`;
        }).join('');
        const br = BRANCH_LABELS[normBranch(e.branch)] || e.branch || '—';
        return `<div class="sinal-student">
          <div style="flex:1;min-width:0">
            <div style="font-size:9px;color:var(--t)">${e.name||'—'}</div>
            <div style="font-size:7px;color:var(--t3);margin-bottom:3px">${e.ref} · ${br}</div>
            <div class="sinal-slots">${slots}</div>
          </div>
        </div>`;
      }).join('');
    });

    html += `</div></div>`;
  }

  return html;
}

function toggleGroupCard(i) {
  const card = document.getElementById(`gc-${i}`);
  if (card) card.classList.toggle('open');
}

function toggleSinal() {
  openSinalBody = !openSinalBody;
  const body = document.getElementById('sinal-body');
  const arrow = document.getElementById('sinal-arrow');
  if (body)  body.classList.toggle('open', openSinalBody);
  if (arrow) arrow.style.transform = openSinalBody ? 'rotate(180deg)' : '';
}

/* ══════════════════════════════════════════════════════
   PAIR CARDS (below groups — raw availability summary)
══════════════════════════════════════════════════════ */
function countPairBlock(students, pair, block) {
  return students.filter(e => {
    const a = analysePrefs(e.ref);
    if (!a) return false;
    if (pair.a === pair.b) {
      return a.validSlots.filter(s => s.dayIdx === pair.a && s.block === block).length >= 2;
    }
    return a.validSlots.some(s => s.dayIdx === pair.a && s.block === block) &&
           a.validSlots.some(s => s.dayIdx === pair.b && s.block === block);
  }).length;
}

/* ══════════════════════════════════════════════════════
   EXPORT / PRINT
══════════════════════════════════════════════════════ */
function exportGrp(idx) {
  if (!_lastProposals?.groups[idx]) return;
  const g = _lastProposals.groups[idx];
  const meta = LEVEL_MAP[activeLevel] || {};
  const letter = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[idx] || (idx+1);
  const rows = [
    `ALM · ${meta.label||activeLevel} · Turma ${letter} · ${g.pair.label} · ${g.block==='manha'?'Manhã':'Tarde'}`,
    `Total: ${g.students.length}`, '', 'Nome,Ref,Filial,Estado'
  ];
  g.students.forEach(e => {
    const st = reqByRef[e.ref] ? normStatus(reqByRef[e.ref].status) : 'sem pedido';
    const br = BRANCH_LABELS[normBranch(e.branch)] || e.branch || '—';
    rows.push(`"${e.name||''}","${e.ref||''}","${br}","${st}"`);
  });
  dlCSV(rows.join('\n'), `ALM-T${letter}-${g.pair.label.replace(/\s/g,'')}.csv`);
  showToast(`CSV exportado · ${g.students.length} alunos`);
}

function printGrp(idx) {
  if (!_lastProposals?.groups[idx]) return;
  const g = _lastProposals.groups[idx];
  const meta = LEVEL_MAP[activeLevel] || {};
  const letter = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[idx] || (idx+1);
  const rows = g.students.map((e,i) => {
    const st = reqByRef[e.ref] ? normStatus(reqByRef[e.ref].status) : 'sem pedido';
    const br = BRANCH_LABELS[normBranch(e.branch)] || e.branch || '—';
    return `<tr><td>${i+1}</td><td>${e.name||'—'}</td><td>${e.ref||'—'}</td><td>${br}</td><td>${st}</td></tr>`;
  }).join('');
  openPrint(`ALM · Turma ${letter} · ${g.pair.label}`,
    `${g.students.length} alunos · ${g.block==='manha'?'Manhã':'Tarde'}`,
    `<table><thead><tr><th>#</th><th>Nome</th><th>Ref</th><th>Filial</th><th>Estado</th></tr></thead><tbody>${rows}</tbody></table>`);
}

function exportSinalizados() {
  if (!_lastProposals?.sinalizados) return;
  const meta = LEVEL_MAP[activeLevel] || {};
  const rows = ['Nome,Ref,Filial,Motivo,Slots'];
  _lastProposals.sinalizados.forEach(({ e, reason }) => {
    const br = BRANCH_LABELS[normBranch(e.branch)] || e.branch || '—';
    const a  = analysePrefs(e.ref);
    const slots = (a?.prefs||[]).map(s => {
      const d = s.dayIdx !== null ? DAYS_PT[s.dayIdx] : '?';
      return `${d} ${s.raw?.session_start||''}`;
    }).join(' + ');
    const motivo = reason==='same-day'?'Mesmo dia':reason==='invalid-window'?'Horário inválido':'Sem grupo compatível';
    rows.push(`"${e.name||''}","${e.ref||''}","${br}","${motivo}","${slots}"`);
  });
  dlCSV(rows.join('\n'), `ALM-Sinalizados-${meta.label||activeLevel}.csv`);
  showToast(`CSV exportado · ${_lastProposals.sinalizados.length} sinalizados`);
}

function dlCSV(content, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], {type:'text/csv;charset=utf-8;'}));
  a.download = filename.replace(/\s+/g,'_');
  a.click();
}

function openPrint(title, meta, body) {
  const win = window.open('','_blank');
  win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
    <title>${title}</title>
    <style>body{font-family:monospace;margin:30px}h1{font-size:16px;margin-bottom:4px}
    .meta{font-size:12px;color:#666;margin-bottom:20px}
    table{width:100%;border-collapse:collapse}
    th{background:#f0f0f0;padding:6px 10px;text-align:left;font-size:11px;border-bottom:2px solid #ccc}
    td{padding:6px 10px;font-size:12px;border-bottom:1px solid #eee}
    tr:nth-child(even) td{background:#fafafa}</style>
  </head><body>
    <h1>${title}</h1><div class="meta">${meta} · ${new Date().toLocaleString('pt-PT')}</div>
    ${body}<script>window.onload=()=>window.print()<\/script>
  </body></html>`);
  win.document.close();
}

   NAV

function switchTab(el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('panel-' + el.dataset.panel).classList.add('active');
}
function switchTabById(id) {
  const t = document.querySelector(`.tab[data-panel="${id}"]`);
  if (t) switchTab(t);
}

let toastT;
function showToast(msg, type='ok') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = `toast ${type} show`;
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), 2800);
}

/* ══════════════════════════════════════════════════════
   LOAD
══════════════════════════════════════════════════════ */
async function loadAll() {
  const pill = document.getElementById('pill-status');
  try {
    const [enrol, reqs] = await Promise.all([
      sbGet('enrolments',
        `select=ref,name,branch,lang,family,level_cefr&academic_year=eq.${encodeURIComponent(AY)}&limit=2000`),
      sbGet('timetable_requests',
        `select=ref,student_name,branch,family,level_cefr,day_preferences,status,sessions_per_week&academic_year=eq.${encodeURIComponent(AY)}&limit=2000`)
    ]);
    allEnrolments = enrol || [];
    allRequests   = reqs  || [];
    reqByRef = {};
    allRequests.forEach(r => { reqByRef[r.ref] = r; });

    const total = allEnrolments.length;
    const sem   = allEnrolments.filter(e => !reqByRef[e.ref]).length;

    document.getElementById('pill-total').textContent = `${total} al`;
    pill.textContent = `Supabase · ${allRequests.length} pedidos`;
    pill.className = 'topbar-pill ok';
    document.getElementById('badge-audit').textContent = sem;
    
   initOverview();
        renderAudit();
        showToast(`${total} inscritos · ${allRequests.length} pedidos carregados`);

        // Activate Overview tab on load
        const ovTab = document.querySelector('.tab[data-panel="overview"]');
        if (ovTab) switchTab(ovTab);

  } catch(e) {
    pill.textContent = 'Erro Supabase';
    pill.className = 'topbar-pill err';
    const errHtml = `<div class="err-msg">Erro: ${e.message}</div>`;
    document.getElementById('level-tree').innerHTML = errHtml;
    document.getElementById('audit-rows').innerHTML = errHtml;
    document.getElementById('ov-right').innerHTML   = errHtml;
    showToast('Erro: ' + e.message, 'err');
  }
}

/* ══════════════════════════════════════════════════════
   OVERVIEW
══════════════════════════════════════════════════════ */
function initOverview() {
  const branches = [...new Set(allEnrolments.map(e => normBranch(e.branch)).filter(Boolean))];
  const ordered  = BRANCH_ORDER.filter(b => branches.includes(b))
    .concat(branches.filter(b => !BRANCH_ORDER.includes(b)));

  document.getElementById('loc-tabs').innerHTML =
    `<button class="loc-tab active" onclick="setLoc('all',this)">Tudo</button>` +
    ordered.map(b =>
      `<button class="loc-tab" onclick="setLoc('${b}',this)">${BRANCH_LABELS[b]||b}</button>`
    ).join('');

  renderOverviewStats();
  renderTree();
  renderOvSummary();
}

function setLoc(loc, btn) {
  activeLoc = loc;
  document.querySelectorAll('.loc-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  activeLevel = null;
  renderOverviewStats();
  renderTree();
  renderOvSummary();
}

function renderOverviewStats() {
  const students = getLocStudents();
  const com = students.filter(e => reqByRef[e.ref]).length;
  document.getElementById('ov-total').textContent = students.length;
  document.getElementById('ov-com').textContent   = com;
  document.getElementById('ov-sem').textContent   = students.length - com;
}

function renderTree() {
  const students = getLocStudents();
  const tree = {};
  students.forEach(e => {
    const meta = getLevelMeta(e);
    const dk = meta.dept, lk = levelKey(e);
    if (!tree[dk]) tree[dk] = {};
    if (!tree[dk][lk]) tree[dk][lk] = [];
    tree[dk][lk].push(e);
  });

  let html = '';
  DEPT_ORDER.forEach(dk => {
    if (!tree[dk]) return;
    const dc = DEPT_CONFIG[dk];
    const dStudents = Object.values(tree[dk]).flat();
    const isOpen = openDepts[dk];
    const sortedLks = Object.keys(tree[dk]).sort((a,b) =>
      (LEVEL_MAP[a]?.order||99) - (LEVEL_MAP[b]?.order||99));

    html += `<div class="dept-block">
      <div class="dept-hdr" onclick="toggleDept('${dk}')">
        <div class="dept-bar" style="background:${dc.color}"></div>
        <div class="dept-hdr-name" style="color:${dc.color}">${dc.label}</div>
        <div class="dept-hdr-n">${dStudents.length} al</div>
        <div class="dept-arrow${isOpen?' open':''}">▶</div>
      </div>
      <div class="level-list${isOpen?' open':''}">`;

    sortedLks.forEach(lk => {
      const ls   = tree[dk][lk];
      const meta = LEVEL_MAP[lk] || getLevelMeta(ls[0]);
      const sem  = ls.filter(e => !reqByRef[e.ref]).length;
      const isAct = activeLevel === lk;
      const badgeCls = sem > 0 ? 'badge-warn' : 'badge-ok';
      const badgeTxt = sem > 0 ? `${sem} s/ped` : 'ok';
      html += `<div class="level-item${isAct?' active':''}" onclick="selectLevel('${lk}')">
        <div class="level-dot" style="background:${meta.color}"></div>
        <div class="level-item-name">${meta.label}</div>
        <div class="level-item-n">${ls.length}</div>
        <div class="level-item-badge badge ${badgeCls}">${badgeTxt}</div>
      </div>`;
    });
    html += `</div></div>`;
  });

  document.getElementById('level-tree').innerHTML =
    html || '<div class="empty-msg">Sem dados para esta filial.</div>';
}

function toggleDept(dk) {
  openDepts[dk] = !openDepts[dk];
  renderTree();
}

function selectLevel(lk) {
  activeLevel = lk;
  openSinalBody = false;
  renderTree();
  renderOvLevel();
}

/* ══ OVERVIEW SUMMARY ══ */
function renderOvSummary() {
  const students = getLocStudents();
  const total = students.length;
  if (!total) {
    document.getElementById('ov-right').innerHTML =
      '<div class="empty-msg">Sem inscrições para esta filial.</div>';
    return;
  }
  const com  = students.filter(e => reqByRef[e.ref]).length;
  const sem  = total - com;
  const pend = students.filter(e => {
    const r = reqByRef[e.ref];
    return r && normStatus(r.status) === 'pendente';
  }).length;

  const deptCounts = {};
  DEPT_ORDER.forEach(dk => {
    deptCounts[dk] = students.filter(e => getLevelMeta(e).dept === dk).length;
  });
  const maxDept = Math.max(...Object.values(deptCounts), 1);

  let html = `<div class="sec">Visão geral${activeLoc!=='all'?' · '+(BRANCH_LABELS[activeLoc]||activeLoc):''}</div>`;
  html += `<div style="background:var(--bg2);border:1px solid var(--b);padding:12px 14px;margin-bottom:14px">`;
  DEPT_ORDER.forEach(dk => {
    const dc = DEPT_CONFIG[dk];
    const n  = deptCounts[dk]||0;
    const pct = Math.round(n/maxDept*100);
    html += `<div class="dept-row">
      <div class="dept-row-name" style="color:${dc.color}">${dc.label}</div>
      <div class="dept-track"><div class="dept-fill" style="width:${pct}%;background:${dc.color}"></div></div>
      <div class="dept-n">${n}</div>
    </div>`;
  });
  html += `</div>`;
  html += `<div class="sec">Próximas acções</div>
  <div style="background:var(--bg2);border:1px solid var(--b);padding:2px 14px;margin-bottom:14px">
    <div class="action-row">
      <div class="action-dot" style="background:var(--red)"></div>
      <span style="color:var(--t2)">${sem} aluno${sem!==1?'s':''} sem pedido de horário</span>
      <a class="action-btn action-btn-gold" href="#" onclick="switchTabById('audit');return false;">Audit →</a>
    </div>
    <div class="action-row">
      <div class="action-dot" style="background:var(--amber)"></div>
      <span style="color:var(--t2)">${pend} turma${pend!==1?'s':''} aguardam decisão</span>
      <a class="action-btn action-btn-gold" href="/admin/alm-allocation-engine">Decision →</a>
    </div>
    <div class="action-row">
      <div class="action-dot" style="background:var(--teal)"></div>
      <span style="color:var(--t2)">Formação de turmas em curso</span>
      <a class="action-btn action-btn-gold" href="/admin/alm-group-formation">Formation →</a>
    </div>
    <div class="action-row">
      <div class="action-dot" style="background:var(--green)"></div>
      <span style="color:var(--t2)">Atribuir professores a turmas aprovadas</span>
      <a class="action-btn action-btn-green" href="/admin/alm-atribuir-turmas">Assign →</a>
    </div>
  </div>
  <div style="font-size:7.5px;color:var(--t3);padding:4px 0">← Seleccione um nível para ver turmas propostas</div>`;

  document.getElementById('ov-right').innerHTML = html;
}

/* ══ OVERVIEW LEVEL ══ */
const ASSIGN_MIN = 8;

function renderOvLevel() {
  const el = document.getElementById('ov-right');
  const students = getLocStudents().filter(e => levelKey(e) === activeLevel);
  if (!students.length) {
    el.innerHTML = '<div class="empty-msg">Nenhum aluno neste nível para a filial seleccionada.</div>';
    return;
  }

  const meta   = LEVEL_MAP[activeLevel] || getLevelMeta(students[0]);
  const dc     = DEPT_CONFIG[meta.dept] || {};
  const com    = students.filter(e => reqByRef[e.ref]).length;
  const sem    = students.length - com;
  const capPct = Math.round(students.length / meta.max * 100);

  let html = `<div class="sec">${meta.label} · <span style="color:${meta.color}">${dc.label||''}</span></div>`;

  // Run proposals once — reused by renderGroupProposals below
  const proposalResult = com > 0 ? buildGroupProposals(activeLevel, activeLoc) : null;
  _lastProposals = proposalResult;
  const placed      = proposalResult ? proposalResult.placed : 0;
  const sinalizados = proposalResult ? proposalResult.sinalizados.length : 0;

  // ── SUMMARY STATS ──
  html += `<div class="level-summary">
    <div class="ls-stat">
      <div class="ls-v" style="color:var(--gold2)">${students.length}</div>
      <div class="ls-l">Inscritos</div>
    </div>
    <div class="ls-stat">
      <div class="ls-v" style="color:var(--green)">${com}</div>
      <div class="ls-l">Com pedido</div>
    </div>
    <div class="ls-stat">
      <div class="ls-v" style="color:var(--red)">${sem}</div>
      <div class="ls-l">Sem pedido</div>
    </div>
    ${com > 0 ? `
    <div class="ls-stat">
      <div class="ls-v clickable" style="color:var(--teal)"
        title="Clique para ver turmas"
        onclick="document.getElementById('group-anchor').scrollIntoView({behavior:'smooth'})">${placed}</div>
      <div class="ls-l">Em turma ↓</div>
    </div>
    <div class="ls-stat">
      <div class="ls-v" style="color:var(--amber)">${sinalizados}</div>
      <div class="ls-l">Sinalizados</div>
    </div>` : ''}
    <div style="flex:1">
      <div style="font-size:6.5px;color:var(--t3);margin-bottom:4px">${capPct}% capacidade (max ${meta.max})</div>
      <div class="cap-bar"><div class="cap-fill" style="width:${capPct}%;background:${meta.color}"></div></div>
    </div>
  </div>`;

  // ── PAIR AVAILABILITY CARDS ──
  if (com > 0) {
    const dept2 = (LEVEL_MAP[activeLevel]||{}).dept || 'adults';
    const studentsWithReq = students.filter(e => reqByRef[e.ref]);
    const pairBlockCounts = [];
    ALM_PAIRS.forEach(pair => {
      if (pair.examOnly && dept2 !== 'exam') return;
      ['manha','tarde'].forEach(block => {
        const count = countPairBlock(studentsWithReq, pair, block);
        if (count > 0) pairBlockCounts.push({ pair, block, count });
      });
    });
    pairBlockCounts.sort((a,b) => b.count - a.count);

    if (pairBlockCounts.length) {
      html += `<div class="sec" style="margin-top:8px">Disponibilidade por par + bloco</div>
      <div class="pair-grid">`;
      pairBlockCounts.forEach(({ pair, block, count }) => {
        const isReady = count >= ASSIGN_MIN;
        const isWait  = count >= MIN_GROUP && count < ASSIGN_MIN;
        const blkLbl  = block === 'manha' ? 'Manhã · 08–11h' : 'Tarde · 14–20h';
        const bg      = isReady ? 'var(--green-a)'         : isWait ? 'var(--amber-a)'         : 'rgba(255,255,255,.02)';
        const border  = isReady ? 'var(--green-b)'         : isWait ? 'var(--amber-b)'         : 'var(--b)';
        const col     = isReady ? 'var(--green)'           : isWait ? 'var(--amber)'           : 'var(--t3)';
        const icon    = isReady ? '✓' : isWait ? '!' : '✕';
        const label   = isReady ? 'atribuir agora'         : isWait ? 'aguardar'               : 'não abre';
        const opacity = '';
        html += `<div class="pair-card" style="background:${bg};border-color:${border};${opacity}cursor:default">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <div style="font-size:9px;font-weight:700;color:${col}">${pair.aLbl} + ${pair.bLbl}</div>
            <span style="font-size:11px;color:${col}">${icon}</span>
          </div>
          <div style="font-size:8px;color:${col};opacity:.8;margin-bottom:6px">${blkLbl}</div>
          <div style="font-size:26px;font-weight:700;color:${col};line-height:1">${count}</div>
          <div style="font-size:8px;color:${col};opacity:.8;margin-top:4px">${label}</div>
        </div>`;
      });
      html += `</div>`;
    }
  }

  // ── GROUP PROPOSALS ──
  html += `<div id="group-anchor"></div>`;
  if (com > 0) {
    html += renderGroupProposals(activeLevel, activeLoc, meta);
  } else {
    html += `<div class="empty-msg" style="padding:16px 0;text-align:left">Nenhum pedido submetido neste nível.</div>`;
  }

  // ── STUDENT LIST ──
  html += `<div class="sec" style="margin-top:16px">Alunos · ${students.length} registos</div>
  <div class="student-hdr"><span>Nome</span><span>Disponibilidade</span><span>Status</span></div>`;

  students.sort((a,b) => (a.name||'').localeCompare(b.name||'')).forEach(e => {
    const a       = analysePrefs(e.ref);
    const dayIdxs = a ? a.dayIdxs : [];
    const cells   = DAYS_PT.map((_,di) =>
      `<div class="hcell${dayIdxs.includes(di)?' on':''}"></div>`).join('');
    const status  = reqByRef[e.ref] ? normStatus(reqByRef[e.ref].status) : 'sem_pedido';
    const bCls    = status==='atribuido'?'badge-ok':status==='sem_pedido'?'badge-err':'badge-warn';
    const bTxt    = status==='atribuido'?'atribuído':status==='sem_pedido'?'sem pedido':'pendente';
    const isFlagged = status === 'sem_pedido';
    html += `<div class="student-row">
      <div class="sr-cell">
        <div style="font-size:9px;color:var(--t);cursor:pointer;text-decoration:underline dotted var(--t3)"
          onclick="openDossier('${e.ref}','director')">${e.name||'—'}</div>
        <div style="font-size:7px;color:var(--t3)">${e.ref||'—'}</div>
      </div>
      <div class="sr-cell">
        <div class="heatstrip">${cells}</div>
        <div style="font-size:6px;color:var(--t4);margin-top:2px;letter-spacing:.04em">S T Q Q S S</div>
      </div>
      <div class="sr-cell" style="display:flex;align-items:center;gap:6px">
        <span class="badge ${bCls}">${bTxt}</span>
        ${isFlagged ? `<span style="font-size:8px;cursor:pointer;color:var(--t3);transition:color .12s"
          title="Adicionar à lista de acompanhamento"
          onmouseenter="this.style.color='var(--amber)'"
          onmouseleave="this.style.color='var(--t3)'"
          onclick="pinStudent('${e.ref}','${(e.name||'').replace(/'/g,"\\'")}')">📌</span>` : ''}
      </div>
    </div>`;
  });

  el.innerHTML = html;
}

/* ── WATCHLIST ── */
function pinStudent(ref, name) {
  const list = JSON.parse(localStorage.getItem('alm-watchlist') || '[]');
  if (list.find(s => s.ref === ref)) {
    showToast(`${name} já está na lista`, 'warn'); return;
  }
  const meta = activeLevel ? (LEVEL_MAP[activeLevel] || {}) : {};
  list.push({ ref, name, level: meta.label || '—', pinned: new Date().toISOString() });
  localStorage.setItem('alm-watchlist', JSON.stringify(list));
  updateWatchBadge();
  showToast(`${name} → lista de acompanhamento`, 'ok');
}

function updateWatchBadge() {
  const list = JSON.parse(localStorage.getItem('alm-watchlist') || '[]');
  const badge = document.getElementById('badge-watch');
  if (badge) badge.textContent = list.length || '—';
}

/* ══════════════════════════════════════════════════════
   AUDIT
══════════════════════════════════════════════════════ */
function setAF(btn) {
  const group = btn.dataset.group, val = btn.dataset.val;
  auditFilters[group] = val;
  document.querySelectorAll(`#audit-filter-row .fbt[data-group="${group}"]`)
    .forEach(b => b.classList.remove('act'));
  btn.classList.add('act');
  renderAudit();
}

function renderAudit() {
  let students = [...allEnrolments];
  if (auditFilters.branch !== 'all')
    students = students.filter(e => normBranch(e.branch) === auditFilters.branch);
  if (auditFilters.dept !== 'all')
    students = students.filter(e => (e.family||'').toLowerCase() === auditFilters.dept);
  if (auditFilters.status !== 'all') {
    students = students.filter(e => {
      const req = reqByRef[e.ref];
      if (auditFilters.status === 'noreq')     return !req;
      if (auditFilters.status === 'pendente')  return req && normStatus(req.status) === 'pendente';
      if (auditFilters.status === 'atribuido') return req && normStatus(req.status) === 'atribuido';
      return true;
    });
  }
  const q = (document.getElementById('audit-search')?.value||'').toLowerCase().trim();
  if (q) students = students.filter(e =>
    (e.name||'').toLowerCase().includes(q) || (e.ref||'').toLowerCase().includes(q));

  const total = allEnrolments.length;
  const com   = allEnrolments.filter(e => reqByRef[e.ref]).length;
  const sem   = total - com;
  const pend  = allEnrolments.filter(e => {
    const r = reqByRef[e.ref];
    return r && normStatus(r.status) === 'pendente';
  }).length;
  document.getElementById('a-total').textContent = total;
  document.getElementById('a-com').textContent   = com;
  document.getElementById('a-sem').textContent   = sem;
  document.getElementById('a-pend').textContent  = pend;
  document.getElementById('badge-audit').textContent = sem;

  const showing = Math.min(students.length, 500);
  document.getElementById('audit-count-lbl').textContent =
    `A mostrar ${showing} de ${students.length} registos`;

  const html = students.slice(0, 500).map(e => {
    const req     = reqByRef[e.ref];
    const meta    = getLevelMeta(e);
    const dc      = DEPT_CONFIG[meta.dept] || {};
    const a       = analysePrefs(e.ref);
    const dayIdxs = a ? a.dayIdxs : [];
    const cells   = DAYS_PT.map((_,di) =>
      `<div class="hcell${dayIdxs.includes(di)?' on':''}"></div>`).join('');
    const status  = req ? normStatus(req.status) : 'sem_pedido';
    const bCls    = status==='atribuido'?'badge-ok':status==='sem_pedido'?'badge-err':'badge-warn';
    const bTxt    = status==='atribuido'?'atribuído':status==='sem_pedido'?'sem pedido':'pendente';
    return `<div class="audit-row">
      <div class="ar-cell">
        <div style="font-size:9px;color:var(--t)">${e.name||'—'}</div>
        <div style="font-size:7px;color:var(--t3)">${e.ref||'—'}</div>
      </div>
      <div class="ar-cell">
        <div style="font-size:9px;font-weight:600;color:${meta.color}">${meta.label}</div>
        <div style="font-size:7px;color:var(--t3)">${e.level_cefr||'—'} · ${dc.label||''}</div>
      </div>
      <div class="ar-cell">
        <div class="heatstrip">${cells}</div>
        <div style="font-size:6px;color:var(--t4);margin-top:3px;letter-spacing:.04em">S T Q Q S S</div>
      </div>
      <div class="ar-cell" style="text-align:center">
        <span class="badge ${bCls}">${bTxt}</span>
      </div>
    </div>`;
  }).join('');

  document.getElementById('audit-rows').innerHTML =
    html || '<div class="empty-msg">Nenhum resultado com estes filtros.</div>';
}

/* ══ BOOT ══ */
loadAll();
</script>
