<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ALM · Decision · 2026/2027</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9A84C;--gold2:#E8C97A;--gold3:rgba(201,168,76,.15);--gold4:rgba(201,168,76,.06);
  --green:#1DB87A;--green-a:rgba(29,184,122,.14);--green-b:rgba(29,184,122,.35);
  --red:#E8455A;--red-a:rgba(232,69,90,.12);--red-b:rgba(232,69,90,.3);
  --amber:#E8A020;--amber-a:rgba(232,160,32,.13);--amber-b:rgba(232,160,32,.3);
  --bg:#07060E;--bg2:#0E0B1A;--bg3:#141025;
  --b:rgba(201,168,76,.07);--b2:rgba(201,168,76,.16);--b3:rgba(201,168,76,.30);
  --t:rgba(238,218,168,.92);--t2:rgba(210,188,140,.52);--t3:rgba(210,188,140,.26);--t4:rgba(210,188,140,.10);
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',system-ui,sans-serif;--display:'Bebas Neue',sans-serif;
  --c-juv:#28C8B0;--c-ger:#C8A44A;--c-exa:#9B5ECA;--c-inf:#4A8FF5;
}
html,body{height:100%;background:var(--bg);color:var(--t);font-family:var(--mono);font-size:12px;-webkit-font-smoothing:antialiased;overflow:hidden}
body{display:flex;flex-direction:column}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.025) 3px,rgba(0,0,0,.025) 4px);pointer-events:none;z-index:0}

/* ══ TOPBAR ══ */
.topbar{flex-shrink:0;height:50px;display:flex;align-items:center;background:rgba(7,6,14,.99);border-bottom:1px solid var(--b2);position:relative;z-index:200}
.home-btn{display:flex;align-items:center;gap:7px;padding:0 16px;height:100%;border-right:1px solid var(--b);text-decoration:none;flex-shrink:0;transition:background .15s}
.home-btn:hover{background:var(--gold4)}
.home-icon{font-size:13px;color:var(--t3)}
.home-btn:hover .home-icon{color:var(--gold2)}
.home-label{font-size:7px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t4)}
.home-btn:hover .home-label{color:var(--gold)}
.brand{display:flex;align-items:center;padding:0 16px;height:100%;border-right:1px solid var(--b);flex-shrink:0;gap:8px}
.brand-alm{font-family:var(--display);font-size:22px;letter-spacing:6px;color:var(--gold2)}
.brand-yr{font-size:7px;color:var(--t3);letter-spacing:.14em;align-self:flex-end;padding-bottom:3px}
.tabs{display:flex;align-items:stretch;height:100%;overflow:hidden}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px;cursor:pointer;border-right:1px solid var(--b);border-bottom:2px solid transparent;transition:all .18s;position:relative;flex-shrink:0;gap:2px;text-decoration:none}
.tab:hover{background:var(--gold4)}
.tab.active{background:rgba(201,168,76,.05);border-bottom-color:var(--gold)}
.tab-num{font-size:7px;font-weight:700;letter-spacing:.08em;color:var(--t4);width:16px;height:16px;border:1px solid var(--b);display:flex;align-items:center;justify-content:center;transition:all .18s}
.tab.active .tab-num{background:var(--gold);color:#07060E;border-color:var(--gold)}
.tab-label{font-size:7.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);transition:color .18s;white-space:nowrap}
.tab.active .tab-label{color:var(--gold2)}
.tab:hover .tab-label{color:var(--t2)}
.tab-badge{position:absolute;top:7px;right:6px;background:var(--red);color:#fff;font-size:6px;font-weight:700;padding:1px 4px;min-width:14px;text-align:center;border-radius:6px;line-height:1.4}
.tab-badge.amber{background:var(--amber)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:7px;padding:0 14px;border-left:1px solid var(--b);height:100%;flex-shrink:0}
.live{display:flex;align-items:center;gap:5px}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.live-lbl{font-size:7px;font-weight:700;letter-spacing:.1em;color:var(--green)}
.tb-pill{font-size:7px;font-weight:600;letter-spacing:.08em;padding:2px 9px;border:1px solid var(--b2);color:var(--t2)}
.tb-pill.gold{color:var(--gold2);border-color:var(--b3);background:var(--gold4)}
.tb-pill.ok{color:var(--green);border-color:var(--green-b)}
.tb-pill.loading{color:var(--amber);border-color:var(--amber-b)}
.tb-pill.err{color:var(--red);border-color:var(--red-b)}

/* ══ MAIN ══ */
.main-layout{flex:1;display:flex;overflow:hidden;position:relative;z-index:1}

/* ══ LEFT PANEL ══ */
.left-panel{width:224px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--b2);overflow:hidden;background:var(--bg2)}
.stat-strip{display:grid;grid-template-columns:repeat(3,1fr);flex-shrink:0;border-bottom:1px solid var(--b2)}
.stat-cell{padding:10px 10px 8px;background:var(--bg2)}
.stat-cell+.stat-cell{border-left:1px solid var(--b)}
.stat-v{font-size:20px;font-weight:700;line-height:1}
.stat-l{font-size:5.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-top:3px}

.loc-tabs-wrap{display:flex;flex-wrap:wrap;gap:3px;padding:7px 10px;border-bottom:1px solid var(--b);flex-shrink:0}
.loc-tab{font-size:7px;font-weight:600;letter-spacing:.05em;padding:3px 8px;border:1px solid var(--b);cursor:pointer;color:var(--t3);transition:all .13s;background:transparent;font-family:var(--mono)}
.loc-tab:hover{color:var(--t2);border-color:var(--b2)}
.loc-tab.active{background:var(--gold3);border-color:var(--gold);color:var(--gold2)}

.search-wrap{position:relative;padding:7px 10px;border-bottom:1px solid var(--b);flex-shrink:0}
.search-inner{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--b2);padding:5px 9px;transition:border-color .15s}
.search-wrap:focus-within .search-inner{border-color:var(--gold)}
.search-icon{font-size:10px;color:var(--t4);flex-shrink:0}
.search-inp{background:transparent;border:none;outline:none;font-family:var(--mono);font-size:9px;color:var(--t);width:100%;min-width:0}
.search-inp::placeholder{color:var(--t3)}
.search-results{display:none;position:absolute;left:10px;right:10px;top:calc(100% - 1px);background:var(--bg2);border:1px solid var(--b2);border-top:none;z-index:500;max-height:220px;overflow-y:auto;scrollbar-width:thin}
.search-results.open{display:block}
.sr-item{display:flex;align-items:center;gap:8px;padding:6px 10px;cursor:pointer;border-bottom:.5px solid var(--b);transition:background .1s}
.sr-item:hover{background:var(--gold4)}
.sr-item:last-child{border-bottom:none}

/* ══ LEVEL TREE ══ */
.level-tree{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--b) transparent}
.level-tree::-webkit-scrollbar{width:2px}
.level-tree::-webkit-scrollbar-thumb{background:var(--b2)}
.dept-block{border-bottom:1px solid var(--b)}
.dept-hdr{display:flex;align-items:center;gap:7px;padding:7px 10px;cursor:pointer;user-select:none;transition:background .12s}
.dept-hdr:hover{background:rgba(255,255,255,.012)}
.dept-bar{width:3px;height:12px;flex-shrink:0;border-radius:1px}
.dept-hdr-name{font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;flex:1}
.dept-hdr-n{font-size:7.5px;color:var(--t3)}
.dept-arrow{font-size:7px;color:var(--t4);transition:transform .18s;flex-shrink:0}
.dept-arrow.open{transform:rotate(90deg)}
.level-list{display:none}
.level-list.open{display:block}
.level-item{display:flex;align-items:center;gap:6px;padding:5px 10px 5px 20px;cursor:pointer;border-left:2px solid transparent;transition:all .12s}
.level-item:hover{background:rgba(255,255,255,.018)}
.level-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.level-item-name{font-size:8.5px;font-weight:600;flex:1}
.level-item-n{font-size:8px;color:var(--t3);flex-shrink:0}
/* indicator dots per level */
.level-dots{display:flex;align-items:center;gap:2px;flex-shrink:0;margin-left:3px}
.ldot{width:7px;height:7px;border-radius:1px;flex-shrink:0;transition:opacity .15s}
.ldot.green{background:var(--green);opacity:.55}
.ldot.green-conf{background:var(--green);opacity:1;box-shadow:0 0 3px rgba(29,184,122,.5)}
.ldot.amber{background:var(--amber);opacity:.6}

/* ══ RIGHT PANEL ══ */
.right-panel{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--b) transparent;position:relative}
.right-panel::-webkit-scrollbar{width:3px}
.right-panel::-webkit-scrollbar-thumb{background:var(--b2)}

.rp-header{position:sticky;top:0;z-index:100;background:rgba(7,6,14,.97);border-bottom:1px solid var(--b2);padding:0 20px;height:38px;display:flex;align-items:center;gap:14px;backdrop-filter:blur(10px)}
.rp-loc{font-family:var(--display);font-size:20px;letter-spacing:5px;color:var(--gold2)}
.rp-sub{font-size:7.5px;color:var(--t3);letter-spacing:.08em}
.rp-legend{margin-left:auto;display:flex;align-items:center;gap:16px}
.leg-item{display:flex;align-items:center;gap:5px}
.leg-sq{width:9px;height:9px;border-radius:1px}
.leg-lbl{font-size:7px;color:var(--t3);letter-spacing:.06em}

.rp-shell{padding:18px 20px 80px}

/* ══ DEPT SECTION ══ */
.dept-section{margin-bottom:30px}
.dept-sec-hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.dept-sec-bar{width:4px;height:20px;flex-shrink:0;border-radius:1px}
.dept-sec-name{font-family:var(--display);font-size:26px;letter-spacing:4px}
.dept-sec-count{font-size:7.5px;color:var(--t3);letter-spacing:.1em;align-self:flex-end;padding-bottom:3px;margin-left:4px}
.dept-sec-line{flex:1;height:.5px;background:var(--b2)}

/* ══ LEVEL SECTION ══ */
.level-section{margin-bottom:20px}
.level-sec-hdr{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.level-sec-name{font-size:8px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.level-sec-stats{font-size:7px;color:var(--t4);letter-spacing:.04em}
.level-sec-line{flex:1;height:.5px;background:var(--b)}
.level-total{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0}
.lt-n{font-size:15px;font-weight:700;line-height:1}
.lt-l{font-size:6px;color:var(--t3);letter-spacing:.08em;margin-top:1px}

/* ══ BOX GRID ══ */
.box-grid{display:flex;flex-wrap:wrap;gap:9px}

/* ══ GROUP BOX ══ */
.gbox{
  width:136px;height:104px;
  background:var(--bg2);
  border:1px solid var(--b2);
  border-radius:2px;
  display:flex;flex-direction:column;
  position:relative;overflow:hidden;
  cursor:pointer;flex-shrink:0;
  transition:transform .15s,border-color .15s,box-shadow .15s;
}
.gbox:hover{transform:translateY(-2px);border-color:var(--b3);box-shadow:0 8px 22px rgba(0,0,0,.45)}
.gbox.proposed{border-color:var(--green-b)}
.gbox.confirmed{border-color:var(--green);background:rgba(29,184,122,.04)}
.gbox.sinalizado{border-color:var(--amber-b);opacity:.82}
/* top colour bar */
.gbox::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;z-index:1}
.gbox.proposed::before{background:var(--green)}
.gbox.confirmed::before{background:var(--green)}
.gbox.sinalizado::before{background:var(--amber)}
/* inner */
.gbox-inner{padding:9px 9px 4px;flex:1;display:flex;flex-direction:column}
.gbox-branch{font-family:var(--display);font-size:30px;letter-spacing:2px;line-height:1}
.gbox.proposed .gbox-branch{color:var(--green)}
.gbox.confirmed .gbox-branch{color:var(--green)}
.gbox.sinalizado .gbox-branch{color:var(--amber)}
.gbox-num{font-family:var(--display);font-size:17px;letter-spacing:2px;line-height:1;margin-top:1px}
.gbox.proposed .gbox-num{color:rgba(29,184,122,.65)}
.gbox.confirmed .gbox-num{color:var(--green)}
.gbox.sinalizado .gbox-num{color:rgba(232,160,32,.65)}
.gbox-days{font-size:7px;font-weight:600;color:var(--t3);margin-top:4px;letter-spacing:.02em}
.gbox-block{font-size:6.5px;color:var(--t4);letter-spacing:.04em;margin-top:1px}
/* count — top right absolute */
.gbox-count{position:absolute;top:8px;right:8px;font-family:var(--display);font-size:24px;line-height:1;z-index:2}
.gbox.proposed .gbox-count{color:rgba(29,184,122,.35)}
.gbox.confirmed .gbox-count{color:rgba(29,184,122,.55)}
.gbox.sinalizado .gbox-count{color:rgba(232,160,32,.3)}
/* tick — confirmed */
.gbox-tick{position:absolute;bottom:32px;right:8px;font-size:15px;color:var(--green);font-weight:700;opacity:0;transition:opacity .2s;z-index:2}
.gbox.confirmed .gbox-tick{opacity:1}
/* hover action bar */
.gbox-actions{position:absolute;bottom:0;left:0;right:0;height:30px;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);border-top:1px solid var(--b);display:flex;align-items:center;justify-content:space-around;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;z-index:3}
.gbox:hover .gbox-actions{opacity:1;transform:translateY(0)}
.gbox-act{width:28px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:2px;font-size:12px;border:none;background:transparent;cursor:pointer;color:var(--t2);transition:background .12s}
.gbox-act:hover{background:rgba(201,168,76,.12);color:var(--gold2)}
.gbox-act.g-confirm{color:var(--green)}
.gbox-act.g-confirm:hover{background:var(--green-a);color:var(--green)}
/* pulse on confirm */
@keyframes confPulse{0%{box-shadow:0 0 0 0 rgba(29,184,122,.55)}70%{box-shadow:0 0 0 12px rgba(29,184,122,0)}100%{box-shadow:0 0 0 0 rgba(29,184,122,0)}}
.gbox.just-confirmed{animation:confPulse .7s ease}

/* ══ MODAL ══ */
.modal-overlay{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.62);backdrop-filter:blur(18px);align-items:center;justify-content:center}
.modal-overlay.open{display:flex;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:min(460px,95vw);max-height:86dvh;background:var(--bg2);border:1px solid var(--b2);border-top:3px solid var(--gold);display:flex;flex-direction:column;overflow:hidden;animation:slideUp .22s ease}
@keyframes slideUp{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal-hdr{display:flex;align-items:flex-start;gap:10px;padding:14px 18px;border-bottom:1px solid var(--b)}
.modal-code{font-family:var(--display);font-size:30px;letter-spacing:4px;line-height:1}
.modal-sub{font-size:7.5px;color:var(--t3);margin-top:4px;letter-spacing:.04em}
.modal-close{margin-left:auto;font-size:14px;cursor:pointer;color:var(--t3);transition:color .12s;background:none;border:none;padding:4px 8px;line-height:1}
.modal-close:hover{color:var(--red)}
.modal-body{flex:1;overflow-y:auto;padding:14px 18px;scrollbar-width:thin;scrollbar-color:var(--b) transparent}
.modal-row{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-bottom:.5px solid rgba(201,168,76,.04)}
.modal-row:last-of-type{border-bottom:none}
.modal-key{color:var(--t3);font-size:8px;letter-spacing:.08em;text-transform:uppercase}
.modal-val{color:var(--t);font-weight:500;font-size:10px}
.sec-label{font-size:7.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:14px 0 8px;display:flex;align-items:center;gap:8px}
.sec-label::after{content:'';flex:1;height:.5px;background:var(--b2)}
.modal-student{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:.5px solid rgba(201,168,76,.04)}
.modal-student:last-child{border-bottom:none}
.modal-av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;flex-shrink:0;border:1px solid}
.modal-footer{padding:11px 18px;border-top:1px solid var(--b);display:flex;gap:8px}
.mf-btn{flex:1;padding:8px;border:1px solid;font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.08em;cursor:pointer;background:transparent;transition:all .13s;text-transform:uppercase}
.mf-confirm{border-color:var(--green-b);color:var(--green)}
.mf-confirm:hover:not(:disabled){background:var(--green-a)}
.mf-confirm:disabled{opacity:.38;cursor:default}
.mf-close{border-color:var(--b);color:var(--t3)}
.mf-close:hover{border-color:var(--red-b);color:var(--red)}

/* ══ UTILITY ══ */
.spinner-wrap{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--t3);gap:10px;font-size:9px;letter-spacing:.1em}
.spinner{width:14px;height:14px;border:1.5px solid var(--b2);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(8px);padding:5px 18px;font-size:9px;font-weight:600;letter-spacing:.06em;opacity:0;transition:all .2s;z-index:9000;pointer-events:none;border:1px solid;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--green-a);border-color:var(--green-b);color:var(--green)}
.toast.warn{background:var(--amber-a);border-color:var(--amber-b);color:var(--amber)}
.toast.err{background:var(--red-a);border-color:var(--red-b);color:var(--red)}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <a class="home-btn" href="/admin/alm-painel-central">
    <span class="home-icon">⌂</span>
    <span class="home-label">Overview</span>
  </a>
  <div class="brand">
    <span class="brand-alm">ALM</span>
    <span class="brand-yr">2026/27</span>
  </div>
  <div class="tabs">
    <a class="tab" href="/admin/alm-painel-central">
      <div class="tab-num">1</div>
      <div class="tab-label">Overview</div>
    </a>
    <a class="tab" href="/admin/alm-painel-central#audit">
      <div class="tab-num">2</div>
      <div class="tab-label">Audit</div>
    </a>
    <a class="tab" href="/admin/alm-group-formation">
      <div class="tab-num">3</div>
      <div class="tab-label">Formation</div>
    </a>
    <div class="tab active">
      <div class="tab-num">4</div>
      <div class="tab-label">Decision</div>
    </div>
    <a class="tab" href="/admin/alm-atribuir-turmas">
      <div class="tab-num">5</div>
      <div class="tab-label">Assign</div>
    </a>
    <a class="tab" href="/admin/alm-painel-central#watchlist">
      <div class="tab-num">6</div>
      <div class="tab-label">Acompanhar</div>
      <div class="tab-badge amber" id="badge-watch">0</div>
    </a>
  </div>
  <div class="topbar-right">
    <div class="live"><div class="live-dot"></div><span class="live-lbl">LIVE</span></div>
    <div class="tb-pill">2026/2027</div>
    <div class="tb-pill gold" id="pill-total">— grupos</div>
    <div class="tb-pill ok" id="pill-conf">0 conf.</div>
    <div class="tb-pill loading" id="pill-status">A carregar…</div>
  </div>
</div>

<!-- MAIN LAYOUT -->
<div class="main-layout">

  <!-- LEFT PANEL -->
  <div class="left-panel">
    <div class="stat-strip">
      <div class="stat-cell">
        <div class="stat-v" style="color:var(--gold2)" id="st-total">—</div>
        <div class="stat-l">Inscritos</div>
      </div>
      <div class="stat-cell">
        <div class="stat-v" style="color:var(--green)" id="st-com">—</div>
        <div class="stat-l">C/ pedido</div>
      </div>
      <div class="stat-cell">
        <div class="stat-v" style="color:var(--red)" id="st-sem">—</div>
        <div class="stat-l">S/ pedido</div>
      </div>
    </div>

    <div class="loc-tabs-wrap" id="loc-tabs">
      <div class="spinner-wrap" style="padding:8px"><div class="spinner"></div></div>
    </div>

    <div class="search-wrap">
      <div class="search-inner">
        <span class="search-icon">⌕</span>

/* ══ CONSTANTS ══ */

const BRANCH_ORDER=['FUNCHAL','CAMARA_LOBOS','SANTA_CRUZ','MACHICO','RIBEIRA_BRAVA','CALHETA'];
const BRANCH_CODE={FUNCHAL:'FUN',CAMARA_LOBOS:'CLB',SANTA_CRUZ:'SCZ',MACHICO:'MAC',RIBEIRA_BRAVA:'RBR',CALHETA:'CAL'};
const LEVEL_MAP={

  'adults|B2':  {dept:'adults',  label:'4th',   color:'var(--c-ger)',order:11,max:200},
  'adults|C1':  {dept:'adults',  label:'5th',   color:'var(--c-ger)',order:12,max:200},

};
const DEPT_CONFIG={

  kids_juv: {label:'Juvenil', color:'var(--c-juv)'},
  adults:   {label:'Geral',   color:'var(--c-ger)'},
  exam:     {label:'Exames',  color:'var(--c-exa)'},
};
const DEPT_ORDER=['kids','kids_juv','adults','exam'];
const DAY_EN_TO_IDX={
  monday:0,tuesday:1,wednesday:2,thursday:3,friday:4,saturday:5,
  segunda:0,terca:1,terça:1,quarta:2,quinta:3,sexta:4,sabado:5,sábado:5,
  mon:0,tue:1,wed:2,thu:3,fri:4,sat:5,seg:0,ter:1,qua:2,qui:3,sex:4,sab:5,'sáb':5
};
const ALM_PAIRS=[
  {a:0,b:2,aLbl:'SEG',bLbl:'QUA',code:'SW'},
  {a:1,b:3,aLbl:'TER',bLbl:'QUI',code:'TQ'},
  {a:2,b:4,aLbl:'QUA',bLbl:'SEX',code:'QX'},
  {a:5,b:5,aLbl:'SÁB',bLbl:'SÁB',code:'SS',examOnly:true},
];
const MIN_GROUP=5,MAX_GROUP=17;

/* ══ STATE ══ */
let allEnrolments=[],allRequests=[],reqByRef={};
let activeLoc='FUNCHAL';
let openDepts={kids:true,kids_juv:true,adults:true,exam:true};
let _boxData={};
let _activeBoxId=null;
let _treeData={};
let branchSeq={};

/* ══ CONFIRMED ══ */
function getConfirmed(){try{return JSON.parse(localStorage.getItem('alm-dec-confirmed')||'{}')}catch{return{}}}
function saveConfirmed(obj){localStorage.setItem('alm-dec-confirmed',JSON.stringify(obj))}

/* ══ HELPERS ══ */
function normBranch(b){return(b||'').toUpperCase().replace(/[\s\-]+/g,'_').trim()}
function normStatus(s){return(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()}
function levelKey(e){return`${(e.family||'').toLowerCase()}|${(e.level_cefr||'').toUpperCase()}`}
function getLevelMeta(e){return LEVEL_MAP[levelKey(e)]||{dept:'adults',label:`${e.family}·${e.level_cefr}`,color:'var(--t3)',order:99,max:60}}
function parseDayPrefs(raw){if(!raw)return[];if(Array.isArray(raw))return raw;try{const p=JSON.parse(raw);return Array.isArray(p)?p:[]}catch{return[]}}
function parseHour(t){if(t==null)return null;const h=parseInt((t+'').split(':')[0],10);return isNaN(h)?null:h}
function classifyBlock(s){const h=parseHour(s);if(h===null)return null;if(h>=8&&h<=11)return'manha';if(h>=14&&h<=20)return'tarde';return null}
function normDay(str){
  if(!str)return null;
  const n=parseInt(str);
  if(!isNaN(n)&&n>=1&&n<=6)return n-1;
  return DAY_EN_TO_IDX[(str+'').toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'')]??null;
}
function analysePrefs(ref){
  const req=reqByRef[ref];if(!req)return null;
  const raw=parseDayPrefs(req.day_preferences);
  const slots=raw.map(p=>({dayIdx:normDay(p.day||p.weekday||p.dia||''),block:classifyBlock(p.session_start||p.start_time||''),raw:p})).filter(s=>s.dayIdx!==null);
  const dayList=slots.map(s=>s.dayIdx);
  const sameDay=dayList.length>=2&&new Set(dayList).size<dayList.length;
  const validSlots=slots.filter(s=>s.block!==null);
  return{prefs:slots,sameDay,validSlots,dayIdxs:[...new Set(slots.map(s=>s.dayIdx))]};
}
function avCol(name){
  let h=0;for(let i=0;i<(name||'?').length;i++)h=(h*31+(name||'?').charCodeAt(i))&0xffffffff;
  const p=[{bg:'#3A2244',text:'#C8A0E0'},{bg:'#1E2E50',text:'#7AABEE'},{bg:'#1A3A2A',text:'#5EC888'},{bg:'#3A2A14',text:'#D4944A'},{bg:'#3A1A1A',text:'#E07878'},{bg:'#282838',text:'#9898D8'},{bg:'#1A2A3A',text:'#5A9EC8'},{bg:'#2A3820',text:'#80B850'}];
  return p[Math.abs(h)%p.length];
}
function nextSeq(branch){
  if(!branchSeq[branch])branchSeq[branch]=0;
  branchSeq[branch]++;
  return String(branchSeq[branch]).padStart(2,'0');
}
function resetSeq(){branchSeq={}}

/* ══ GROUPING ENGINE ══ */
function buildGroupProposals(lk,branch){
  const allAtLevel=allEnrolments.filter(e=>{
    if(levelKey(e)!==lk)return false;
    if(branch!=='all'&&normBranch(e.branch)!==branch)return false;
    return true;
  });
  const withReq=allAtLevel.filter(e=>!!reqByRef[e.ref]);
  const dept=(LEVEL_MAP[lk]||{}).dept||'adults';
  const placed=new Set(),groups=[];
  const sameDayBucket=withReq.filter(e=>{const a=analysePrefs(e.ref);return a&&a.sameDay});
  sameDayBucket.forEach(e=>placed.add(e.ref));
  const invalidBucket=withReq.filter(e=>{if(placed.has(e.ref))return false;const a=analysePrefs(e.ref);return a&&a.validSlots.length===0});
  invalidBucket.forEach(e=>placed.add(e.ref));
  const eligible=withReq.filter(e=>!placed.has(e.ref));
  ALM_PAIRS.forEach(pair=>{
    if(pair.examOnly&&dept!=='exam')return;
    ['manha','tarde'].forEach(block=>{
      const sub=eligible.filter(e=>{
        if(placed.has(e.ref))return false;
        const a=analysePrefs(e.ref);if(!a)return false;
        if(pair.a===pair.b)return a.validSlots.filter(s=>s.dayIdx===pair.a&&s.block===block).length>=2;
        return a.validSlots.some(s=>s.dayIdx===pair.a&&s.block===block)&&a.validSlots.some(s=>s.dayIdx===pair.b&&s.block===block);
      });
      if(sub.length<MIN_GROUP)return;
      let rem=[...sub];
      while(rem.length>=MIN_GROUP){
        const chunk=rem.slice(0,MAX_GROUP);rem=rem.slice(MAX_GROUP);
        chunk.forEach(e=>placed.add(e.ref));
        groups.push({pair,block,students:chunk});
      }
    });
  });
  const sinalizados=[
    ...sameDayBucket.map(e=>({e,reason:'same-day'})),
    ...invalidBucket.map(e=>({e,reason:'invalid-window'})),
    ...eligible.filter(e=>!placed.has(e.ref)).map(e=>({e,reason:'no-group'}))
  ];
  return{groups,sinalizados,total:allAtLevel.length,withReq:withReq.length};
}

/* ══ LOAD ══ */
async function loadAll(){
  try{
    const[enrol,reqs]=await Promise.all([
      sbGet('enrolments',`select=ref,name,branch,lang,family,level_cefr&academic_year=eq.${encodeURIComponent(AY)}&limit=2000`),

    ]);
    allEnrolments=enrol||[];allRequests=reqs||[];reqByRef={};
    allRequests.forEach(r=>{reqByRef[r.ref]=r});

    const total=allEnrolments.length,sem=allEnrolments.filter(e=>!reqByRef[e.ref]).length;

    document.getElementById('st-com').textContent=total-sem;

/* ══ LOC TABS ══ */
function initLocTabs(){
  const branches=[...new Set(allEnrolments.map(e=>normBranch(e.branch)).filter(Boolean))];
  const ordered=BRANCH_ORDER.filter(b=>branches.includes(b));
  document.getElementById('loc-tabs').innerHTML=
    ordered.map(b=>`<button class="loc-tab${b===activeLoc?' active':''}" onclick="setLoc('${b}',this)">${BRANCH_LABELS[b]||b}</button>`).join('');
}
function setLoc(loc,btn){
  activeLoc=loc;
  document.querySelectorAll('.loc-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  renderAll();
}

/* ══ RENDER ALL ══ */
function renderAll(){
  resetSeq();
  _boxData={};
  const confirmed=getConfirmed();

  // Build tree data
  const students=allEnrolments.filter(e=>normBranch(e.branch)===activeLoc);
  const lks=[...new Set(students.map(e=>levelKey(e)).filter(lk=>LEVEL_MAP[lk]))];
  const treeData={};

  lks.forEach(lk=>{
    const meta=LEVEL_MAP[lk];
    const dk=meta.dept;
    if(!treeData[dk])treeData[dk]={};
    const result=buildGroupProposals(lk,activeLoc);
    // Assign stable codes to each group
    result.groups.forEach(g=>{
      const brCode=BRANCH_CODE[activeLoc]||activeLoc.slice(0,3);
      const seq=nextSeq(activeLoc);
      const code=`${brCode}-${seq}`;
      const boxId=`${activeLoc}|${lk}|${g.pair.code}|${g.block}|${seq}`;
      // Confirmed: check localStorage first, then Supabase assigned_turma
      const isConfLS=!!confirmed[boxId];
      const isConfSB=g.students.some(e=>{const r=reqByRef[e.ref];return r&&r.assigned_turma===code});
      const isConf=isConfLS||isConfSB;
      if(isConf&&!confirmed[boxId]){
        const c=getConfirmed();c[boxId]=new Date().toISOString();saveConfirmed(c);
      }
      g._code=code;g._boxId=boxId;g._confirmed=isConf;
    });
    treeData[dk][lk]={result,meta};
  });
  _treeData=treeData;

  // Topbar counts
  let totalG=0,confG=0;
  DEPT_ORDER.forEach(dk=>{if(!treeData[dk])return;Object.values(treeData[dk]).forEach(({result})=>{result.groups.forEach(g=>{totalG++;if(g._confirmed)confG++;})})});
  document.getElementById('pill-total').textContent=`${totalG} grupos`;
  document.getElementById('pill-conf').textContent=`${confG} conf.`;
  document.getElementById('rp-loc-name').textContent=BRANCH_LABELS[activeLoc]||activeLoc;
  document.getElementById('rp-sub').textContent=`${totalG} grupos · ${confG} confirmados · ${totalG-confG} pendentes`;

  renderTree();
  renderBoxGrid();
}

/* ══ LEVEL TREE ══ */
function renderTree(){
  let html='';
  DEPT_ORDER.forEach(dk=>{
    if(!_treeData[dk])return;
    const dc=DEPT_CONFIG[dk];
    const isOpen=openDepts[dk];
    const sortedLks=Object.keys(_treeData[dk]).sort((a,b)=>(LEVEL_MAP[a]?.order||99)-(LEVEL_MAP[b]?.order||99));
    const dTotal=sortedLks.reduce((s,lk)=>s+_treeData[dk][lk].result.total,0);
    html+=`<div class="dept-block">
      <div class="dept-hdr" onclick="toggleDept('${dk}')">
        <div class="dept-bar" style="background:${dc.color}"></div>
        <div class="dept-hdr-name" style="color:${dc.color}">${dc.label}</div>
        <div class="dept-hdr-n">${dTotal}</div>
        <div class="dept-arrow${isOpen?' open':''}">▶</div>
      </div>
      <div class="level-list${isOpen?' open':''}">`;
    sortedLks.forEach(lk=>{
      const{result,meta}=_treeData[dk][lk];
      let dots='';
      result.groups.forEach(g=>{
        dots+=`<div class="ldot ${g._confirmed?'green-conf':'green'}" title="${g._code} · ${g.students.length} al."></div>`;
      });
      if(result.sinalizados.length>0)dots+=`<div class="ldot amber" title="${result.sinalizados.length} sinalizados"></div>`;
      html+=`<div class="level-item" onclick="scrollToLevel('${lk}')">
        <div class="level-dot" style="background:${meta.color}"></div>
        <div class="level-item-name" style="color:${meta.color}">${meta.label}</div>
        <div class="level-item-n">${result.total}</div>
        <div class="level-dots">${dots}</div>
      </div>`;
    });
    html+=`</div></div>`;
  });
  document.getElementById('level-tree').innerHTML=html||'<div class="spinner-wrap" style="padding:16px;font-size:8px">Sem dados.</div>';
}

function toggleDept(dk){
  openDepts[dk]=!openDepts[dk];
  renderTree();
}

function scrollToLevel(lk){
  const id='lva-'+lk.replace(/[|]/g,'-');
  const el=document.getElementById(id);
  if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
}

/* ══ BOX GRID ══ */
function renderBoxGrid(){
  let html='';
  DEPT_ORDER.forEach(dk=>{
    if(!_treeData[dk])return;
    const dc=DEPT_CONFIG[dk];
    const sortedLks=Object.keys(_treeData[dk]).sort((a,b)=>(LEVEL_MAP[a]?.order||99)-(LEVEL_MAP[b]?.order||99));
    const dGroups=sortedLks.reduce((s,lk)=>s+_treeData[dk][lk].result.groups.length,0);
    const dSinal=sortedLks.reduce((s,lk)=>s+((_treeData[dk][lk].result.sinalizados.length>0)?1:0),0);
    if(!dGroups&&!dSinal)return;

    html+=`<div class="dept-section">
      <div class="dept-sec-hdr">
        <div class="dept-sec-bar" style="background:${dc.color}"></div>
        <div class="dept-sec-name" style="color:${dc.color}">${dc.label.toUpperCase()}</div>
        <div class="dept-sec-count">${dGroups} grupo${dGroups!==1?'s':''}</div>
        <div class="dept-sec-line"></div>
      </div>`;

    sortedLks.forEach(lk=>{
      const{result,meta}=_treeData[dk][lk];
      if(!result.groups.length&&!result.sinalizados.length)return;
      const anchorId='lva-'+lk.replace(/[|]/g,'-');
      const placedN=result.groups.reduce((s,g)=>s+g.students.length,0);

      html+=`<div class="level-section" id="${anchorId}">
        <div class="level-sec-hdr">
          <span class="level-sec-name" style="color:${meta.color}">${meta.label}</span>
          <span class="level-sec-stats">· ${result.total} inscritos · ${result.withReq} c/pedido · ${placedN} em turma</span>
          <div class="level-sec-line"></div>
          <div class="level-total">
            <div class="lt-n" style="color:${meta.color}">${result.total}</div>
            <div class="lt-l">inscritos</div>
          </div>
        </div>
        <div class="box-grid">`;

      result.groups.forEach(g=>{
        const{_code:code,_boxId:boxId,_confirmed:isConf}=g;
        const blockLbl=g.block==='manha'?'Manhã':'Tarde';
        const brCode=code.split('-')[0];
        const num=code.split('-')[1];
        const status=isConf?'confirmed':'proposed';
        // Register for modal
        _boxData[boxId]={code,lk,dk,pair:g.pair,block:g.block,students:g.students,meta,confirmed:isConf,type:'group'};
        html+=`<div class="gbox ${status}" id="gbox-${boxId.replace(/[|]/g,'_')}" onclick="openModal('${boxId}')">
          <div class="gbox-inner">
            <div class="gbox-branch">${brCode}</div>
            <div class="gbox-num">${num}</div>
            <div class="gbox-days">${g.pair.aLbl}+${g.pair.bLbl}</div>
            <div class="gbox-block">${blockLbl}</div>
          </div>
          <div class="gbox-count">${g.students.length}</div>
          <div class="gbox-tick">✓</div>
          <div class="gbox-actions">
            <button class="gbox-act g-confirm" title="Confirmar" onclick="event.stopPropagation();quickConfirm('${boxId}')">✓</button>
            <button class="gbox-act" title="Ver alunos" onclick="event.stopPropagation();openModal('${boxId}')">👥</button>
          </div>
        </div>`;
      });

      // Sinalizado box — one collective per level
      if(result.sinalizados.length>0){
        const sId=`SINAL|${activeLoc}|${lk}`;
        const safeId=sId.replace(/[|]/g,'_');
        _boxData[sId]={lk,dk,meta,sinalizados:result.sinalizados,type:'sinalizado'};
        html+=`<div class="gbox sinalizado" id="gbox-${safeId}" onclick="openModal('${sId}')">
          <div class="gbox-inner">
            <div class="gbox-branch" style="font-size:22px;letter-spacing:1px">SINAL</div>
            <div style="font-size:7px;color:var(--amber);margin-top:3px">⚠ não alocados</div>
            <div class="gbox-block" style="margin-top:2px">${meta.label}</div>
          </div>
          <div class="gbox-count">${result.sinalizados.length}</div>
          <div class="gbox-actions">
            <button class="gbox-act" title="Ver sinalizados" onclick="event.stopPropagation();openModal('${sId}')">👁</button>
          </div>
        </div>`;
      }

      html+=`</div></div>`; // /box-grid /level-section
    });
    html+=`</div>`; // /dept-section
  });
  document.getElementById('rp-shell').innerHTML=html||'<div class="spinner-wrap">Nenhum grupo gerado para esta filial.</div>';
}

/* ══ QUICK CONFIRM ══ */
async function quickConfirm(boxId){
  const box=_boxData[boxId];
  if(!box||box.type!=='group'){showToast('Não confirmável','warn');return;}
  const confirmed=getConfirmed();
  if(confirmed[boxId]||box.confirmed){showToast('Já confirmado','warn');return;}

  // Optimistic UI
  confirmed[boxId]=new Date().toISOString();
  saveConfirmed(confirmed);
  box.confirmed=true;

  const elId='gbox-'+boxId.replace(/[|]/g,'_');
  const el=document.getElementById(elId);
  if(el){
    el.classList.remove('proposed');
    el.classList.add('confirmed','just-confirmed');
    setTimeout(()=>el.classList.remove('just-confirmed'),700);
  }
  updateTopbarConf();
  renderTree(); // refresh indicator dots
  showToast(`${box.code} a confirmar…`,'ok');

  // Supabase PATCH
  const refs=box.students.map(e=>e.ref).filter(Boolean);
  if(refs.length){
    try{
      const inList=refs.map(r=>`"${r}"`).join(',');
      const r=await fetch(
        `${SB}/rest/v1/timetable_requests?ref=in.(${inList})&academic_year=eq.${encodeURIComponent(AY)}`,
        {method:'PATCH',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify({assigned_turma:box.code,status:'atribuido'})}
      );
      if(r.ok){
        showToast(`${box.code} ✓ · ${refs.length} alunos actualizados`,'ok');
        refs.forEach(ref=>{if(reqByRef[ref]){reqByRef[ref].assigned_turma=box.code;reqByRef[ref].status='atribuido';}});
      }else{
        showToast(`Guardado local · erro Supabase ${r.status}`,'warn');
      }
    }catch{
      showToast('Guardado local · sem ligação','warn');
    }
  }
}

function updateTopbarConf(){
  const conf=getConfirmed();
  const groups=Object.keys(_boxData).filter(id=>_boxData[id]?.type==='group');
  const n=groups.filter(id=>conf[id]||_boxData[id]?.confirmed).length;
  const total=groups.length;
  document.getElementById('pill-conf').textContent=`${n} conf.`;
  document.getElementById('rp-sub').textContent=`${total} grupos · ${n} confirmados · ${total-n} pendentes`;
}

/* ══ MODAL ══ */
function openModal(boxId){
  _activeBoxId=boxId;
  const box=_boxData[boxId];if(!box)return;
  const confirmed=getConfirmed();
  const mc=document.getElementById('m-code');
  const ms=document.getElementById('m-sub');
  const mb=document.getElementById('m-body');
  const btn=document.getElementById('m-btn-confirm');

  if(box.type==='group'){
    const isConf=box.confirmed||!!confirmed[boxId];
    mc.textContent=box.code;
    mc.style.color=isConf?'var(--green)':'var(--gold2)';
    ms.textContent=`${box.meta.label} · ${box.pair.aLbl}+${box.pair.bLbl} · ${box.block==='manha'?'Manhã 08–11h':'Tarde 14–20h'} · ${BRANCH_LABELS[activeLoc]||activeLoc}`;
    btn.disabled=isConf;
    btn.textContent=isConf?'✓ Confirmado':'✓ Confirmar turma';
    btn.style.opacity=isConf?'.4':'1';
    btn.style.display='';

    let body=`
      <div class="modal-row"><span class="modal-key">Código</span><span class="modal-val" style="font-family:var(--display);font-size:20px;color:${isConf?'var(--green)':'var(--gold2)'}">${box.code}</span></div>
      <div class="modal-row"><span class="modal-key">Nível</span><span class="modal-val">${box.meta.label}</span></div>
      <div class="modal-row"><span class="modal-key">Dias</span><span class="modal-val">${box.pair.aLbl} + ${box.pair.bLbl}</span></div>
      <div class="modal-row"><span class="modal-key">Bloco</span><span class="modal-val">${box.block==='manha'?'Manhã · 08–11h':'Tarde · 14–20h'}</span></div>
      <div class="modal-row"><span class="modal-key">Filial</span><span class="modal-val">${BRANCH_LABELS[activeLoc]||activeLoc}</span></div>
      <div class="modal-row"><span class="modal-key">Alunos</span><span class="modal-val" style="color:var(--green);font-weight:700">${box.students.length}</span></div>
      <div class="modal-row"><span class="modal-key">Estado</span><span class="modal-val" style="color:${isConf?'var(--green)':'var(--amber)'}">${isConf?'✓ Confirmado':'Proposto — aguarda decisão'}</span></div>
      <div class="sec-label">Alunos neste grupo</div>`;

    box.students.sort((a,b)=>(a.name||'').localeCompare(b.name||'')).forEach(e=>{
      const col=avCol(e.name||e.ref);
      const init=(e.name||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
      const req=reqByRef[e.ref];
      const st=req?normStatus(req.status):'sem_pedido';
      const stCol=st==='atribuido'?'var(--green)':st==='sem_pedido'?'var(--red)':'var(--amber)';
      const stTxt=st==='atribuido'?'atribuído':st==='sem_pedido'?'sem pedido':'pendente';
      body+=`<div class="modal-student">
        <div class="modal-av" style="background:${col.bg};border-color:${col.text}55;color:${col.text}">${init}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:9px;color:var(--t)">${e.name||'—'}</div>
          <div style="font-size:7px;color:var(--t3)">${e.ref||'—'}</div>
        </div>
        <span style="font-size:7.5px;font-weight:700;color:${stCol}">${stTxt}</span>
      </div>`;
    });
    mb.innerHTML=body;

  } else {
    // Sinalizado
    mc.textContent='⚠ SINAL';mc.style.color='var(--amber)';
    ms.textContent=`${box.meta.label} · ${box.sinalizados.length} alunos não alocados`;
    btn.style.display='none';
    const reasons={'same-day':'Mesmo dia','invalid-window':'Fora de horário','no-group':'Sem grupo compatível'};
    let body=`<div class="modal-row"><span class="modal-key">Total sinalizado</span><span class="modal-val" style="color:var(--amber);font-weight:700">${box.sinalizados.length} alunos</span></div>
    <div class="sec-label">Alunos sinalizados</div>`;
    box.sinalizados.forEach(({e,reason})=>{
      const col=avCol(e.name||e.ref);
      const init=(e.name||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
      body+=`<div class="modal-student">
        <div class="modal-av" style="background:${col.bg};border-color:${col.text}55;color:${col.text}">${init}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:9px;color:var(--t)">${e.name||'—'}</div>
          <div style="font-size:7px;color:var(--t3)">${e.ref||'—'}</div>
        </div>
        <span style="font-size:7.5px;color:var(--amber);font-weight:600">${reasons[reason]||reason}</span>
      </div>`;
    });
    mb.innerHTML=body;
  }
  document.getElementById('modal').classList.add('open');
}

function closeModal(){
  document.getElementById('modal').classList.remove('open');
  _activeBoxId=null;
  document.getElementById('m-btn-confirm').style.display='';
}

async function modalConfirm(){
  if(!_activeBoxId)return;
  await quickConfirm(_activeBoxId);
  // Reflect in open modal
  const box=_boxData[_activeBoxId];
  if(box){
    document.getElementById('m-code').style.color='var(--green)';
    const btn=document.getElementById('m-btn-confirm');
    btn.disabled=true;btn.textContent='✓ Confirmado';btn.style.opacity='.4';
  }
}

/* ══ SEARCH ══ */
function onSearch(val){
  const q=val.trim().toLowerCase();
  const res=document.getElementById('search-results');
  if(q.length<2){res.classList.remove('open');return;}
  const matches=allEnrolments
    .filter(e=>normBranch(e.branch)===activeLoc&&((e.name||'').toLowerCase().includes(q)||(e.ref||'').toLowerCase().includes(q)))
    .slice(0,8);
  if(!matches.length){
    res.innerHTML=`<div style="padding:10px;font-size:8px;color:var(--t3);text-align:center">Nenhum aluno encontrado</div>`;
    res.classList.add('open');return;
  }
  res.innerHTML=matches.map(e=>{
    const meta=getLevelMeta(e);const col=avCol(e.name||e.ref);
    const init=(e.name||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
    const req=reqByRef[e.ref];const st=req?normStatus(req.status):'sem_pedido';
    const stCol=st==='atribuido'?'var(--green)':st==='sem_pedido'?'var(--red)':'var(--amber)';
    const stTxt=st==='atribuido'?'attr.':st==='sem_pedido'?'s/ped.':'pend.';
    return`<div class="sr-item">
      <div style="width:22px;height:22px;border-radius:50%;background:${col.bg};border:1px solid ${col.text}55;color:${col.text};display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;flex-shrink:0">${init}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:9px;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e.name||'—'}</div>
        <div style="font-size:7px;color:var(--t3)">${meta.label} · ${e.ref}</div>
      </div>
      <span style="font-size:7px;font-weight:700;color:${stCol};flex-shrink:0">${stTxt}</span>
    </div>`;
  }).join('');
  res.classList.add('open');
}
document.addEventListener('click',e=>{
  if(!e.target.closest('.search-wrap'))document.getElementById('search-results')?.classList.remove('open');
});

/* ══ TOAST ══ */
let _toastT;
function showToast(msg,type='ok'){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className=`toast ${type} show`;
  clearTimeout(_toastT);_toastT=setTimeout(()=>el.classList.remove('show'),2800);
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ══ BOOT ══ */
loadAll();
</script>
