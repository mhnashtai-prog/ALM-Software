
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ALM · Decision · 2026/2027</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9A84C;--gold2:#E8C97A;--gold3:rgba(201,168,76,.14);--gold4:rgba(201,168,76,.06);
  --green:#1DB87A;--green-a:rgba(29,184,122,.13);--green-b:rgba(29,184,122,.32);--green-c:rgba(29,184,122,.06);
  --red:#E8455A;--red-a:rgba(232,69,90,.11);--red-b:rgba(232,69,90,.28);
  --amber:#E8A020;--amber-a:rgba(232,160,32,.12);--amber-b:rgba(232,160,32,.28);
  --teal:#28C8B0;--blue:#4A8FF5;--purple:#9B5ECA;
  --bg:#07060E;--bg2:#0E0B1A;--bg3:#141025;--bg4:#1C1830;
  --b:rgba(201,168,76,.07);--b2:rgba(201,168,76,.15);--b3:rgba(201,168,76,.28);
  --t:rgba(238,218,168,.92);--t2:rgba(210,188,140,.55);--t3:rgba(210,188,140,.28);--t4:rgba(210,188,140,.10);
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',system-ui,sans-serif;--display:'Bebas Neue',sans-serif;
  --c-juv:#28C8B0;--c-ger:#C8A44A;--c-exa:#9B5ECA;--c-inf:#4A8FF5;
  --r:6px;
}
html,body{height:100%;background:var(--bg);color:var(--t);font-family:var(--mono);font-size:12px;-webkit-font-smoothing:antialiased;overflow:hidden}
body{display:flex;flex-direction:column}

/* ── TOPBAR ── */
.topbar{flex-shrink:0;height:48px;display:flex;align-items:center;background:rgba(7,6,14,.99);border-bottom:1px solid var(--b2);z-index:200;position:relative}
.tb-home{display:flex;align-items:center;gap:6px;padding:0 14px;height:100%;border-right:1px solid var(--b);text-decoration:none;transition:background .14s;flex-shrink:0}
.tb-home:hover{background:var(--gold4)}
.tb-home svg{width:13px;height:13px;stroke:var(--t3);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:stroke .14s}
.tb-home:hover svg{stroke:var(--gold2)}
.brand{display:flex;align-items:center;gap:7px;padding:0 14px;height:100%;border-right:1px solid var(--b);flex-shrink:0}
.brand-alm{font-family:var(--display);font-size:20px;letter-spacing:6px;color:var(--gold2)}
.brand-yr{font-size:6.5px;color:var(--t3);letter-spacing:.14em}
.tabs{display:flex;align-items:stretch;height:100%;overflow:hidden}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 13px;cursor:pointer;border-right:1px solid var(--b);border-bottom:2px solid transparent;transition:all .16s;position:relative;flex-shrink:0;gap:2px;text-decoration:none}
.tab:hover{background:var(--gold4)}
.tab.active{background:rgba(201,168,76,.04);border-bottom-color:var(--gold)}
.tab-num{font-size:6.5px;font-weight:700;letter-spacing:.08em;color:var(--t4);width:14px;height:14px;border:1px solid var(--b);display:flex;align-items:center;justify-content:center}
.tab.active .tab-num{background:var(--gold);color:#07060E;border-color:var(--gold)}
.tab.done .tab-num{background:var(--green);color:#020e06;border-color:var(--green)}
.tab-label{font-size:7px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);white-space:nowrap}
.tab.active .tab-label{color:var(--gold2)}
.tab.done .tab-label{color:var(--green)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:6px;padding:0 12px;border-left:1px solid var(--b);height:100%;flex-shrink:0}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:blink 2s infinite;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.tb-pill{font-size:7px;font-weight:600;letter-spacing:.06em;padding:2px 8px;border:1px solid var(--b2);color:var(--t2);flex-shrink:0}
.tb-pill.gold{color:var(--gold2);border-color:var(--b3);background:var(--gold4)}
.tb-pill.ok{color:var(--green);border-color:var(--green-b);background:var(--green-c)}
.tb-pill.load{color:var(--amber);border-color:var(--amber-b)}
.tb-pill.err{color:var(--red);border-color:var(--red-b)}

/* ── LAYOUT ── */
.main-layout{flex:1;display:flex;overflow:hidden;position:relative}

/* ── LEFT PANEL ── */
.left{width:210px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--b2);background:var(--bg2);overflow:hidden}
.left-stats{display:grid;grid-template-columns:repeat(3,1fr);flex-shrink:0;border-bottom:1px solid var(--b2)}
.ls-cell{padding:9px 8px 7px;background:var(--bg2)}
.ls-cell+.ls-cell{border-left:1px solid var(--b)}
.ls-v{font-size:18px;font-weight:700;line-height:1}
.ls-l{font-size:5.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-top:3px}
/* Branch tabs */
.branch-wrap{display:flex;flex-wrap:wrap;gap:3px;padding:7px 8px;border-bottom:1px solid var(--b);flex-shrink:0}
.btab{font-size:6.5px;font-weight:600;letter-spacing:.05em;padding:3px 7px;border:1px solid var(--b);cursor:pointer;color:var(--t3);transition:all .12s;background:transparent;font-family:var(--mono);border-radius:2px}
.btab:hover{color:var(--t2);border-color:var(--b2)}
.btab.active{background:var(--gold3);border-color:var(--gold);color:var(--gold2)}
/* Search */
.search-wrap{padding:7px 8px;border-bottom:1px solid var(--b);flex-shrink:0;position:relative}
.search-inner{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--b2);padding:5px 8px;transition:border-color .14s;border-radius:var(--r)}
.search-wrap:focus-within .search-inner{border-color:var(--gold)}
.search-icon{font-size:10px;color:var(--t4);flex-shrink:0}
.search-inp{background:transparent;border:none;outline:none;font-family:var(--mono);font-size:9px;color:var(--t);width:100%}
.search-inp::placeholder{color:var(--t3)}
.search-res{display:none;position:absolute;left:8px;right:8px;top:calc(100% - 1px);background:var(--bg2);border:1px solid var(--b2);border-top:none;z-index:500;max-height:220px;overflow-y:auto;border-radius:0 0 var(--r) var(--r)}
.search-res.open{display:block}
.sr-item{display:flex;align-items:center;gap:7px;padding:6px 9px;cursor:pointer;border-bottom:.5px solid var(--b);transition:background .1s}
.sr-item:hover{background:var(--gold4)}
.sr-item:last-child{border-bottom:none}
/* Level tree */
.level-tree{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--b) transparent}
.dept-block{border-bottom:1px solid var(--b)}
.dept-hdr{display:flex;align-items:center;gap:6px;padding:6px 9px;cursor:pointer;user-select:none;transition:background .1s}
.dept-hdr:hover{background:rgba(255,255,255,.012)}
.dept-bar{width:3px;height:11px;flex-shrink:0;border-radius:1px}
.dept-hdr-name{font-size:7.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;flex:1}
.dept-hdr-n{font-size:7px;color:var(--t3)}
.dept-arrow{font-size:7px;color:var(--t4);transition:transform .18s}
.dept-arrow.open{transform:rotate(90deg)}
.level-list{display:none}
.level-list.open{display:block}
.level-item{display:flex;align-items:center;gap:5px;padding:4px 9px 4px 18px;cursor:pointer;transition:all .1s}
.level-item:hover{background:rgba(255,255,255,.015)}
.level-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.level-name{font-size:8px;font-weight:600;flex:1}
.level-n{font-size:7.5px;color:var(--t3);flex-shrink:0}
.ldots{display:flex;gap:2px;flex-shrink:0}
.ld{width:7px;height:7px;border-radius:2px;flex-shrink:0}

/* ── RIGHT PANEL ── */
.right{flex:1;display:flex;flex-direction:column;overflow:hidden}
.rp-hdr{flex-shrink:0;height:40px;display:flex;align-items:center;gap:10px;padding:0 18px;background:rgba(7,6,14,.96);border-bottom:1px solid var(--b2);backdrop-filter:blur(10px);position:sticky;top:0;z-index:100}
.rp-loc{font-family:var(--display);font-size:20px;letter-spacing:5px;color:var(--gold2)}
.rp-sub{font-size:7px;color:var(--t3);letter-spacing:.05em}
.rp-acts{margin-left:auto;display:flex;align-items:center;gap:6px}
.rp-btn{padding:3px 9px;border:1px solid;font-family:var(--mono);font-size:7px;font-weight:700;cursor:pointer;background:transparent;transition:all .12s;letter-spacing:.06em;border-radius:2px}
.rp-btn.ok{border-color:var(--green-b);color:var(--green)}
.rp-btn.ok:hover{background:var(--green-a)}
.rp-btn.go{border-color:var(--b2);color:var(--gold)}
.rp-btn.go:hover{background:var(--gold3)}
.rp-legend{display:flex;align-items:center;gap:10px}
.leg-i{display:flex;align-items:center;gap:4px}
.leg-sq{width:8px;height:8px;border-radius:1px}
.leg-l{font-size:6.5px;color:var(--t3);letter-spacing:.04em}
.rp-scroll{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--b) transparent;padding:14px 18px 80px}

/* ── DEPT + LEVEL HEADERS ── */
.dept-sec{margin-bottom:26px}
.dept-sec-hdr{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.dept-sec-bar{width:3px;height:18px;flex-shrink:0;border-radius:1px}
.dept-sec-name{font-family:var(--display);font-size:24px;letter-spacing:4px}
.dept-sec-n{font-size:7px;color:var(--t3);letter-spacing:.08em;align-self:flex-end;padding-bottom:2px}
.dept-sec-line{flex:1;height:.5px;background:var(--b2)}

.level-sec{margin-bottom:18px}
.level-sec-hdr{display:flex;align-items:center;gap:7px;margin-bottom:9px}
.level-sec-name{font-size:7.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.level-sec-stats{font-size:7px;color:var(--t4);letter-spacing:.04em}
.level-sec-line{flex:1;height:.5px;background:var(--b)}
.level-sec-total{font-size:13px;font-weight:700;flex-shrink:0}

/* ── BOX GRID ── */
.box-grid{display:flex;flex-wrap:wrap;gap:9px}

/* ── GROUP CARD ── */
.gbox{
  width:155px;background:var(--bg2);
  border:1px solid var(--b2);border-radius:var(--r);
  display:flex;flex-direction:column;overflow:hidden;
  cursor:pointer;flex-shrink:0;position:relative;
  transition:border-color .18s,transform .15s,box-shadow .15s;
}
.gbox:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(0,0,0,.55)}
.gbox.proposed{border-color:var(--b2)}
.gbox.proposed:hover{border-color:var(--b3)}
.gbox.confirmed{border-color:rgba(29,184,122,.45);background:rgba(29,184,122,.03)}
.gbox.confirmed:hover{border-color:rgba(29,184,122,.7)}
.gbox.low-viab{border-color:rgba(232,69,90,.22)}
.gbox.sinalizado{border-color:var(--amber-b);opacity:.85}

/* top accent */
.gbox-accent{height:2.5px;width:100%;flex-shrink:0}
.gbox.proposed .gbox-accent{background:var(--b3)}
.gbox.confirmed .gbox-accent{background:linear-gradient(90deg,var(--green),var(--teal))}
.gbox.low-viab .gbox-accent{background:var(--red)}
.gbox.sinalizado .gbox-accent{background:var(--amber)}

/* pill row */
.gbox-pill-row{display:flex;align-items:center;justify-content:space-between;padding:9px 10px 4px}
.gbox-pill{
  display:inline-flex;align-items:center;gap:6px;
  border-radius:999px;padding:3px 10px 3px 3px;
  border:1px solid;font-size:12px;font-weight:600;letter-spacing:.03em;
  transition:all .18s;flex-shrink:0;
}
.gbox.proposed .gbox-pill{background:rgba(255,255,255,.04);border-color:var(--b2);color:var(--t)}
.gbox.confirmed .gbox-pill{background:rgba(29,184,122,.12);border-color:rgba(29,184,122,.5);color:#5DCAA5}
.gbox.low-viab .gbox-pill{background:rgba(232,69,90,.1);border-color:rgba(232,69,90,.35);color:#F09595}
.gbox.sinalizado .gbox-pill{background:var(--amber-a);border-color:var(--amber-b);color:var(--amber)}

/* avatar inside pill */
.pill-av{
  width:21px;height:21px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:7px;font-weight:700;flex-shrink:0;border:1px solid;
  transition:all .2s;
}
.pill-av.empty{
  background:transparent;
  border:1px dashed rgba(210,188,140,.2);
  color:var(--t4);font-size:9px;
}
.pill-av.has{border-width:1.5px}

/* student count badge top-right */
.gbox-badge{
  font-size:8px;font-weight:700;
  color:var(--t2);
  flex-shrink:0;
}
.gbox.confirmed .gbox-badge{color:var(--green)}
.gbox.low-viab .gbox-badge{color:var(--red)}

/* mid */
.gbox-mid{padding:2px 10px 7px;display:flex;flex-direction:column;gap:3px}
.gbox-days{font-size:10px;font-weight:600;color:var(--t2);display:flex;align-items:center;gap:5px}
.block-tag{font-size:6px;font-weight:700;letter-spacing:.1em;padding:1px 5px;border:1px solid;border-radius:2px}
.block-manha{background:rgba(74,143,245,.08);border-color:rgba(74,143,245,.22);color:var(--blue)}
.block-tarde{background:rgba(155,94,202,.08);border-color:rgba(155,94,202,.22);color:var(--purple)}

/* count row */
.gbox-count-row{display:flex;align-items:baseline;gap:3px;margin-top:1px}
.gbox-count{font-size:22px;font-weight:700;line-height:1;color:var(--t)}
.gbox.confirmed .gbox-count{color:var(--green)}
.gbox.low-viab .gbox-count{color:var(--red)}
.gbox.sinalizado .gbox-count{color:var(--amber)}
.gbox-count-lbl{font-size:8.5px;color:var(--t3)}

/* viability bar */
.gbox-viab{height:2px;background:rgba(255,255,255,.05);overflow:hidden;margin:5px 10px 0;border-radius:99px}
.gbox-viab-fill{height:100%;border-radius:99px;transition:width .4s}

/* action strip */
.gbox-acts{
  display:flex;border-top:1px solid var(--b);
  margin-top:8px;background:rgba(0,0,0,.2);
}
.gbox-act{
  flex:1;height:28px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:8.5px;font-weight:600;
  border:none;background:transparent;cursor:pointer;color:var(--t3);
  border-right:1px solid var(--b);
  transition:background .12s,color .12s;letter-spacing:.04em;
}
.gbox-act:last-child{border-right:none}
.gbox-act:hover{background:rgba(255,255,255,.04);color:var(--t2)}
.gbox-act.confirm{color:rgba(29,184,122,.7)}
.gbox-act.confirm:hover{background:var(--green-a);color:var(--green)}
.gbox-act.confirmed-done{color:rgba(29,184,122,.38);cursor:default}
.gbox-act.cancel{color:rgba(232,69,90,.6)}
.gbox-act.cancel:hover{background:var(--red-a);color:var(--red)}

/* pulse on confirm */
@keyframes confPulse{0%{box-shadow:0 0 0 0 rgba(29,184,122,.5)}70%{box-shadow:0 0 0 12px rgba(29,184,122,0)}100%{box-shadow:0 0 0 0 rgba(29,184,122,0)}}
.gbox.just-confirmed{animation:confPulse .7s ease}

/* ── MODAL ── */
.modal-overlay{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.7);backdrop-filter:blur(18px);align-items:center;justify-content:center}
.modal-overlay.open{display:flex;animation:fadeIn .16s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  width:min(500px,96vw);max-height:88dvh;
  background:var(--bg2);border:1px solid var(--b2);
  border-top:2px solid var(--gold);
  border-radius:var(--r);
  display:flex;flex-direction:column;overflow:hidden;
  animation:slideUp .2s ease;
  position:relative;
}
@keyframes slideUp{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal-close{position:absolute;top:11px;right:12px;width:22px;height:22px;background:rgba(255,255,255,.04);border:1px solid var(--b);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;color:var(--t3);cursor:pointer;transition:all .12s;border-radius:2px;z-index:10}
.modal-close:hover{background:var(--red-a);border-color:rgba(232,69,90,.4);color:var(--red)}

/* Modal header */
.modal-hdr{padding:16px 18px 12px;border-bottom:1px solid var(--b)}
.modal-pill-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.modal-pill{
  display:inline-flex;align-items:center;gap:7px;
  border-radius:999px;padding:4px 14px 4px 4px;
  border:1px solid;font-size:16px;font-weight:600;letter-spacing:.04em;
}
.modal-pill.proposed{background:rgba(255,255,255,.04);border-color:var(--b2);color:var(--t)}
.modal-pill.confirmed{background:rgba(29,184,122,.12);border-color:rgba(29,184,122,.5);color:#5DCAA5}
.modal-pill.low{background:var(--red-a);border-color:var(--red-b);color:#F09595}
.modal-pill.sinal{background:var(--amber-a);border-color:var(--amber-b);color:var(--amber)}
.modal-pill-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;border:1.5px solid}
.modal-pill-av.empty{background:transparent;border:1.5px dashed rgba(210,188,140,.2);color:var(--t4);font-size:12px}
.modal-status-row{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.m-badge{font-size:6.5px;font-weight:700;letter-spacing:.1em;padding:2px 7px;border:1px solid;border-radius:2px}
.m-badge.conf{background:var(--green-a);border-color:var(--green-b);color:var(--green)}
.m-badge.pend{background:var(--amber-a);border-color:var(--amber-b);color:var(--amber)}
.m-badge.low{background:var(--red-a);border-color:var(--red-b);color:var(--red)}
.m-badge.sinal{background:var(--amber-a);border-color:var(--amber-b);color:var(--amber)}
.modal-sub{font-size:8px;color:var(--t3);line-height:1.6;letter-spacing:.03em}

/* Modal body */
.modal-body{flex:1;overflow-y:auto;padding:0 18px 12px;scrollbar-width:thin;scrollbar-color:var(--b) transparent}
.modal-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 4px}
.m-kpi{background:var(--bg3);border:1px solid var(--b);padding:8px;text-align:center;border-radius:var(--r)}
.m-kpi-v{font-size:17px;font-weight:700;line-height:1}
.m-kpi-l{font-size:5.5px;color:var(--t3);letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
.m-row{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-bottom:.5px solid rgba(201,168,76,.04)}
.m-row:last-of-type{border-bottom:none}
.m-k{color:var(--t3);font-size:7.5px;letter-spacing:.07em;text-transform:uppercase}
.m-v{color:var(--t);font-weight:500;font-size:9.5px}
.sec-lbl{font-size:7px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:13px 0 7px;display:flex;align-items:center;gap:7px}
.sec-lbl::after{content:'';flex:1;height:.5px;background:var(--b2)}
.m-student{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:.5px solid rgba(201,168,76,.04)}
.m-student:last-child{border-bottom:none}
.m-av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7.5px;font-weight:700;flex-shrink:0;border:1px solid}
.hstrip{display:flex;gap:1px}
.hc{width:8px;height:7px;border-radius:1px}

/* Modal footer */
.modal-footer{padding:10px 18px;border-top:1px solid var(--b);display:flex;gap:7px}
.mf-btn{flex:1;padding:7px;border:1px solid;font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:.07em;cursor:pointer;background:transparent;transition:all .12s;text-transform:uppercase;border-radius:2px}
.mf-confirm{border-color:var(--green-b);color:var(--green)}
.mf-confirm:hover:not(:disabled){background:var(--green-a)}
.mf-confirm:disabled{opacity:.3;cursor:default}
.mf-cancel{border-color:var(--red-b);color:var(--red)}
.mf-cancel:hover{background:var(--red-a)}
.mf-csv{border-color:var(--b2);color:var(--gold)}
.mf-csv:hover{background:var(--gold3)}
.mf-close{border-color:var(--b);color:var(--t3)}
.mf-close:hover{border-color:var(--red-b);color:var(--red)}

/* ── PROGRESS BAR ── */

<script>
/* ══ SUPABASE ══ */
const SB='https://oapygbeliocdvitbdjbq.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9hcHlnYmVsaW9jZHZpdGJkamJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NjQzNjAsImV4cCI6MjA5MjA0MDM2MH0.-9Uj9Bg3q8sIlqzfzw2Sc1JziaueeyYGNwep-qWhWWg';
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
const AY='2026/2027';

async function sbGet(t,q){
  const r=await fetch(`${SB}/rest/v1/${t}?${q}`,{headers:H});
  if(!r.ok)throw new Error(`${t}: HTTP ${r.status}`);
  return r.json();
}

/* ══ CONSTANTS ══ */
const BL={FUNCHAL:'Funchal',CAMARA_LOBOS:'C. Lobos',SANTA_CRUZ:'S. Cruz',MACHICO:'Machico',RIBEIRA_BRAVA:'R. Brava',CALHETA:'Calheta'};
const BO=['FUNCHAL','CAMARA_LOBOS','SANTA_CRUZ','MACHICO','RIBEIRA_BRAVA','CALHETA'];
const BC={FUNCHAL:'FUN',CAMARA_LOBOS:'CLB',SANTA_CRUZ:'SCZ',MACHICO:'MAC',RIBEIRA_BRAVA:'RBR',CALHETA:'CAL'};
const LEVEL_MAP={
  'kids|A1':{dept:'kids',label:'PI-a1',color:'var(--c-inf)',order:1},
  'kids|A2':{dept:'kids',label:'PI-a2',color:'var(--c-inf)',order:2},
  'kids|B1':{dept:'kids',label:'PI-a3',color:'var(--c-inf)',order:3},
  'kids|B2':{dept:'kids',label:'PI-a4',color:'var(--c-inf)',order:4},
  'kids_juv|A1':{dept:'kids_juv',label:'PJ1',color:'var(--c-juv)',order:5},
  'kids_juv|A2':{dept:'kids_juv',label:'PJ2',color:'var(--c-juv)',order:6},
  'kids_juv|B1':{dept:'kids_juv',label:'PJ3',color:'var(--c-juv)',order:7},
  'adults|A1':{dept:'adults',label:'1st',color:'var(--c-ger)',order:8},
  'adults|A2':{dept:'adults',label:'2nd',color:'var(--c-ger)',order:9},
  'adults|B1':{dept:'adults',label:'3rd',color:'var(--c-ger)',order:10},
  'adults|B2':{dept:'adults',label:'4th',color:'var(--c-ger)',order:11},
  'adults|C1':{dept:'adults',label:'5th',color:'var(--c-ger)',order:12},
  'adults|C2':{dept:'adults',label:'5th+',color:'var(--c-ger)',order:13},
  'exam|B2':{dept:'exam',label:'6th B2',color:'var(--c-exa)',order:14},
  'exam|C1':{dept:'exam',label:'7th C1',color:'var(--c-exa)',order:15},
  'exam|C2':{dept:'exam',label:'8th C2',color:'var(--c-exa)',order:16},
};
const DC={
  kids:{label:'Infantil',color:'var(--c-inf)'},
  kids_juv:{label:'Juvenil',color:'var(--c-juv)'},
  adults:{label:'Geral',color:'var(--c-ger)'},
  exam:{label:'Exames',color:'var(--c-exa)'},
};
const DO=['kids','kids_juv','adults','exam'];
const DAY_IDX={monday:0,tuesday:1,wednesday:2,thursday:3,friday:4,saturday:5,segunda:0,terca:1,'terça':1,quarta:2,quinta:3,sexta:4,sabado:5,'sábado':5,mon:0,tue:1,wed:2,thu:3,fri:4,sat:5,seg:0,ter:1,qua:2,qui:3,sex:4,sab:5,'sáb':5};
const DAYS_PT=['SEG','TER','QUA','QUI','SEX','SÁB'];
const PAIRS=[
  {a:0,b:2,aL:'SEG',bL:'QUA',code:'SW'},
  {a:1,b:3,aL:'TER',bL:'QUI',code:'TQ'},
  {a:2,b:4,aL:'QUA',bL:'SEX',code:'QX'},
  {a:5,b:5,aL:'SÁB',bL:'SÁB',code:'SS',examOnly:true},
];
const MIN_G=5,MAX_G=17;
const SK_CONF='alm-dec-confirmed-2627';
const SK_TEACH='alm-dec-teachers-2627';

/* ══ STATE ══ */
let allE=[],allR=[],rByRef={};
let activeLoc='FUNCHAL';
let openDepts={kids:true,kids_juv:true,adults:true,exam:true};
let _boxes={};
let _activeBox=null;
let _treeData={};
let _brSeq={};

/* ══ TEACHER DATA ══ (loaded from localStorage / Step 5) */
const TEACHERS=[
  {id:'T01',name:'Ana Ferreira',   init:'AF',col:{bg:'#1A3A4A',text:'#5EC8E0',border:'#5EC8E055'}},
  {id:'T02',name:'Bruno Costa',    init:'BC',col:{bg:'#3A2A14',text:'#D4A44A',border:'#D4A44A55'}},
  {id:'T03',name:'Carla Santos',   init:'CS',col:{bg:'#1A3A2A',text:'#5EC888',border:'#5EC88855'}},
  {id:'T04',name:'David Nóbrega',  init:'DN',col:{bg:'#3A1A1A',text:'#E07878',border:'#E0787855'}},
  {id:'T05',name:'Eva Marques',    init:'EM',col:{bg:'#2A1A3A',text:'#C8A0E0',border:'#C8A0E055'}},
  {id:'T06',name:'Fábio Teixeira', init:'FT',col:{bg:'#1E2E50',text:'#7AABEE',border:'#7AABEE55'}},
  {id:'T07',name:'Graça Rodrigues',init:'GR',col:{bg:'#282838',text:'#9898D8',border:'#9898D855'}},
  {id:'T08',name:'Hugo Freitas',   init:'HF',col:{bg:'#2A3820',text:'#80B850',border:'#80B85055'}},
];

/* ══ STORAGE ══ */
function getConf(){try{return JSON.parse(localStorage.getItem(SK_CONF)||'{}')}catch{return{}}}
function saveConf(o){localStorage.setItem(SK_CONF,JSON.stringify(o))}
function getTeach(){try{return JSON.parse(localStorage.getItem(SK_TEACH)||'{}')}catch{return{}}}
function getTeacherForBox(id){const t=getTeach();const tid=t[id];return tid?TEACHERS.find(x=>x.id===tid):null}

/* ══ HELPERS ══ */
function normB(b){return(b||'').toUpperCase().replace(/[\s\-]+/g,'_').trim()}
function normS(s){return(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()}
function lk(e){return`${(e.family||'').toLowerCase()}|${(e.level_cefr||'').toUpperCase()}`}
function getLM(e){return LEVEL_MAP[lk(e)]||{dept:'adults',label:`${e.family}·${e.level_cefr}`,color:'var(--t3)',order:99}}
function parseDp(raw){if(!raw)return[];if(Array.isArray(raw))return raw;try{return JSON.parse(raw)||[]}catch{return[]}}
function parseH(t){if(t==null)return null;const h=parseInt((t+'').split(':')[0],10);return isNaN(h)?null:h}
function classB(s){const h=parseH(s);if(h===null)return null;if(h>=8&&h<=11)return'manha';if(h>=14&&h<=20)return'tarde';return null}
function normD(str){
  if(!str)return null;
  const n=parseInt(str);if(!isNaN(n)&&n>=1&&n<=6)return n-1;
  return DAY_IDX[(str+'').toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'')]??null;
}
function analysePrefs(ref){
  const req=rByRef[ref];if(!req)return null;
  const raw=parseDp(req.day_preferences);
  const slots=raw.map(p=>({dayIdx:normD(p.day||p.weekday||p.dia||''),block:classB(p.session_start||p.start_time||''),raw:p})).filter(s=>s.dayIdx!==null);
  const dayList=slots.map(s=>s.dayIdx);
  return{prefs:slots,sameDay:dayList.length>=2&&new Set(dayList).size<dayList.length,validSlots:slots.filter(s=>s.block!==null),dayIdxs:[...new Set(slots.map(s=>s.dayIdx))]};
}
function avCol(name){
  let h=0;for(let i=0;i<(name||'?').length;i++)h=(h*31+(name||'?').charCodeAt(i))&0xffffffff;
  const p=[{bg:'#3A2244',text:'#C8A0E0'},{bg:'#1E2E50',text:'#7AABEE'},{bg:'#1A3A2A',text:'#5EC888'},{bg:'#3A2A14',text:'#D4944A'},{bg:'#3A1A1A',text:'#E07878'},{bg:'#282838',text:'#9898D8'},{bg:'#1A2A3A',text:'#5A9EC8'},{bg:'#2A3820',text:'#80B850'}];
  return p[Math.abs(h)%p.length];
}
function nextSeq(b){if(!_brSeq[b])_brSeq[b]=0;_brSeq[b]++;return String(_brSeq[b]).padStart(2,'0')}
function resetSeq(){_brSeq={}}
function el(id,v){const n=document.getElementById(id);if(n&&v!==undefined)n.textContent=v;return n}

/* ══ GROUP ENGINE ══ */
function buildProposals(levelKey,branch){
  const atLevel=allE.filter(e=>lk(e)===levelKey&&(branch==='all'||normB(e.branch)===branch));
  const withReq=atLevel.filter(e=>!!rByRef[e.ref]);
  const dept=(LEVEL_MAP[levelKey]||{}).dept||'adults';
  const placed=new Set(),groups=[];
  const sameDayB=withReq.filter(e=>{const a=analysePrefs(e.ref);return a&&a.sameDay});
  sameDayB.forEach(e=>placed.add(e.ref));
  const invalidB=withReq.filter(e=>{if(placed.has(e.ref))return false;const a=analysePrefs(e.ref);return a&&a.validSlots.length===0});
  invalidB.forEach(e=>placed.add(e.ref));
  const eligible=withReq.filter(e=>!placed.has(e.ref));
  PAIRS.forEach(pair=>{
    if(pair.examOnly&&dept!=='exam')return;
    ['manha','tarde'].forEach(block=>{
      const sub=eligible.filter(e=>{
        if(placed.has(e.ref))return false;
        const a=analysePrefs(e.ref);if(!a)return false;
        if(pair.a===pair.b)return a.validSlots.filter(s=>s.dayIdx===pair.a&&s.block===block).length>=2;
        return a.validSlots.some(s=>s.dayIdx===pair.a&&s.block===block)&&a.validSlots.some(s=>s.dayIdx===pair.b&&s.block===block);
      });
      if(sub.length<MIN_G)return;
      let rem=[...sub];
      while(rem.length>=MIN_G){
        const chunk=rem.slice(0,MAX_G);rem=rem.slice(MAX_G);
        chunk.forEach(e=>placed.add(e.ref));
        groups.push({pair,block,students:chunk});
      }
    });
  });
  const sinal=[
    ...sameDayB.map(e=>({e,reason:'same-day'})),
    ...invalidB.map(e=>({e,reason:'invalid-window'})),
    ...eligible.filter(e=>!placed.has(e.ref)).map(e=>({e,reason:'no-group'}))
  ];
  return{groups,sinal,total:atLevel.length,withReq:withReq.length};
}

/* ══ LOAD ══ */
async function loadAll(){
  try{
    const[enrol,reqs]=await Promise.all([
      sbGet('enrolments',`select=ref,name,branch,lang,family,level_cefr&academic_year=eq.${encodeURIComponent(AY)}&limit=2000`),
      sbGet('timetable_requests',`select=ref,student_name,branch,family,level_cefr,day_preferences,status,sessions_per_week,assigned_turma&academic_year=eq.${encodeURIComponent(AY)}&limit=2000`)
    ]);
    allE=enrol||[];allR=reqs||[];rByRef={};
    allR.forEach(r=>{rByRef[r.ref]=r});
    const tot=allE.length,sem=allE.filter(e=>!rByRef[e.ref]).length;
    el('st-total',tot);el('st-com',tot-sem);el('st-sem',sem);
    el('pill-status','Supabase OK');document.getElementById('pill-status').className='tb-pill ok';
    initBranchTabs();renderAll();
    showToast(`${tot} inscritos · ${allR.length} pedidos carregados`,'ok');
  }catch(err){
    el('pill-status','Erro');document.getElementById('pill-status').className='tb-pill err';
    document.getElementById('rp-shell').innerHTML=`<div class="spinner-wrap" style="color:var(--red)">Erro: ${err.message}</div>`;
    showToast('Erro de ligação: '+err.message,'err');
  }
}

/* ══ BRANCH TABS ══ */
function initBranchTabs(){
  const branches=[...new Set(allE.map(e=>normB(e.branch)).filter(Boolean))];
  const ordered=BO.filter(b=>branches.includes(b));
  if(ordered.length&&!ordered.includes(activeLoc))activeLoc=ordered[0];
  document.getElementById('branch-tabs').innerHTML=ordered.map(b=>
    `<button class="btab${b===activeLoc?' active':''}" onclick="setLoc('${b}',this)">${BL[b]||b}</button>`
  ).join('');
}
function setLoc(loc,btn){
  activeLoc=loc;
  document.querySelectorAll('.btab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  renderAll();
}

/* ══ RENDER ALL ══ */
function renderAll(){
  resetSeq();_boxes={};
  const conf=getConf();
  const students=allE.filter(e=>normB(e.branch)===activeLoc);
  const lkSet=[...new Set(students.map(e=>lk(e)).filter(k=>LEVEL_MAP[k]))];
  const td={};
  lkSet.forEach(k=>{
    const meta=LEVEL_MAP[k];const dk=meta.dept;
    if(!td[dk])td[dk]={};
    const res=buildProposals(k,activeLoc);
    res.groups.forEach(g=>{
      const bCode=BC[activeLoc]||activeLoc.slice(0,3);
      const seq=nextSeq(activeLoc);
      const code=`${bCode}-${seq}`;
      const boxId=`${activeLoc}|${k}|${g.pair.code}|${g.block}|${seq}`;
      const isConfLS=!!conf[boxId];
      const isConfSB=g.students.some(e=>{const r=rByRef[e.ref];return r&&r.assigned_turma===code});
      const isConf=isConfLS||isConfSB;
      if(isConf&&!conf[boxId]){const c=getConf();c[boxId]=new Date().toISOString();saveConf(c)}
      g._code=code;g._boxId=boxId;g._confirmed=isConf;
    });
    td[dk][k]={res,meta};
  });
  _treeData=td;
  let totalG=0,confG=0;
  DO.forEach(dk=>{if(!td[dk])return;Object.values(td[dk]).forEach(({res})=>{res.groups.forEach(g=>{totalG++;if(g._confirmed)confG++;})})});
  el('pill-total',`${totalG} grupos`);
  el('pill-conf',`${confG} conf.`);
  el('rp-loc',BL[activeLoc]||activeLoc);
  el('rp-sub',`${totalG} grupos · ${confG} confirmados · ${totalG-confG} pendentes`);
  updateProgress(confG,totalG);
  renderTree();
  renderGrid();
}

/* ══ PROGRESS ══ */
function updateProgress(conf,total){
  const pct=total?Math.round(conf/total*100):0;
  document.getElementById('pb-fill').style.width=pct+'%';
  el('pb-stat',`${conf} / ${total} confirmados (${pct}%)`);
}

/* ══ TREE ══ */
function renderTree(){
  let html='';
  DO.forEach(dk=>{
    if(!_treeData[dk])return;
    const dc=DC[dk];const isOpen=openDepts[dk];
    const lks=Object.keys(_treeData[dk]).sort((a,b)=>(LEVEL_MAP[a]?.order||99)-(LEVEL_MAP[b]?.order||99));
    const dTot=lks.reduce((s,k)=>s+_treeData[dk][k].res.total,0);
    html+=`<div class="dept-block">
      <div class="dept-hdr" onclick="toggleDept('${dk}')">
        <div class="dept-bar" style="background:${dc.color}"></div>
        <div class="dept-hdr-name" style="color:${dc.color}">${dc.label}</div>
        <div class="dept-hdr-n">${dTot}</div>
        <div class="dept-arrow${isOpen?' open':''}">▶</div>
      </div>
      <div class="level-list${isOpen?' open':''}">`;
    lks.forEach(k=>{
      const{res,meta}=_treeData[dk][k];
      let dots='';
      res.groups.forEach(g=>{
        const isConf=g._confirmed||!!getConf()[g._boxId];
        dots+=`<div class="ld" style="background:${isConf?'var(--green)':'rgba(29,184,122,.25)'}" title="${g._code}"></div>`;
      });
      if(res.sinal.length)dots+=`<div class="ld" style="background:var(--amber);opacity:.6" title="${res.sinal.length} sinalizados"></div>`;
      html+=`<div class="level-item" onclick="scrollToLevel('${k}')">
        <div class="level-dot" style="background:${meta.color}"></div>
        <div class="level-name" style="color:${meta.color}">${meta.label}</div>
        <div class="level-n">${res.total}</div>
        <div class="ldots">${dots}</div>
      </div>`;
    });
    html+=`</div></div>`;
  });
  document.getElementById('level-tree').innerHTML=html||'<div class="spinner-wrap" style="padding:14px;font-size:7.5px">Sem dados.</div>';
}
function toggleDept(dk){openDepts[dk]=!openDepts[dk];renderTree()}
function scrollToLevel(k){const id='lva-'+k.replace(/[|]/g,'-');document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'})}

/* ══ GRID ══ */
function renderGrid(){
  const conf=getConf();
  let html='';
  DO.forEach(dk=>{
    if(!_treeData[dk])return;
    const dc=DC[dk];
    const lks=Object.keys(_treeData[dk]).sort((a,b)=>(LEVEL_MAP[a]?.order||99)-(LEVEL_MAP[b]?.order||99));
    const dG=lks.reduce((s,k)=>s+_treeData[dk][k].res.groups.length,0);
    const dS=lks.reduce((s,k)=>s+(_treeData[dk][k].res.sinal.length>0?1:0),0);
    if(!dG&&!dS)return;
    html+=`<div class="dept-sec">
      <div class="dept-sec-hdr">
        <div class="dept-sec-bar" style="background:${dc.color}"></div>
        <div class="dept-sec-name" style="color:${dc.color}">${dc.label.toUpperCase()}</div>
        <div class="dept-sec-n">${dG} grupo${dG!==1?'s':''}</div>
        <div class="dept-sec-line"></div>
      </div>`;
    lks.forEach(k=>{
      const{res,meta}=_treeData[dk][k];
      if(!res.groups.length&&!res.sinal.length)return;
      const placedN=res.groups.reduce((s,g)=>s+g.students.length,0);
      const anchorId='lva-'+k.replace(/[|]/g,'-');
      html+=`<div class="level-sec" id="${anchorId}">
        <div class="level-sec-hdr">
          <span class="level-sec-name" style="color:${meta.color}">${meta.label}</span>

          <div class="level-sec-total" style="color:${meta.color}">${res.total}</div>
        </div>

      res.groups.forEach(g=>{
        const{_code:code,_boxId:boxId,_confirmed:isConf}=g;
        const isConfNow=isConf||!!conf[boxId];
        const n=g.students.length;
        const isLow=n<MIN_G;

        const state=isConfNow?'confirmed':isLow?'low-viab':'proposed';
        const viabCol=isConfNow?'var(--green)':isLow?'var(--red)':n>=10?'var(--teal)':'var(--blue)';
        // teacher (passive — set by Step 5)
        const teacher=getTeacherForBox(boxId);
        let avHtml=teacher
          ?`<div class="pill-av has" style="background:${teacher.col.bg};border-color:${teacher.col.border};color:${teacher.col.text}" title="${teacher.name}">${teacher.init}</div>`
          :`<div class="pill-av empty" title="Professor ainda não atribuído (Step 5)">–</div>`;
        const pillState=isConfNow?'confirmed':isLow?'low':'proposed';
        _boxes[boxId]={code,lk:k,dk,pair:g.pair,block:g.block,students:g.students,meta,confirmed:isConfNow,isLow,type:'group'};
        const safeId=boxId.replace(/[|]/g,'_');
        html+=`<div class="gbox ${state}" id="gbox-${safeId}" onclick="openModal('${boxId}')">
          <div class="gbox-accent"></div>
          <div class="gbox-pill-row">
            <div class="gbox-pill ${pillState}">${avHtml}<span>${code}${isConfNow?' ✓':''}</span></div>
            <div class="gbox-badge">${n}</div>
          </div>
          <div class="gbox-mid">
            <div class="gbox-days">
              ${g.pair.aL}+${g.pair.bL}
              <span class="block-tag ${g.block==='manha'?'block-manha':'block-tarde'}">${g.block==='manha'?'Manhã':'Tarde'}</span>
            </div>
            <div class="gbox-count-row">
              <div class="gbox-count">${n}</div>
              <div class="gbox-count-lbl">alunos</div>

          </div>

                ?`<button class="gbox-act cancel" onclick="event.stopPropagation();cancelGroup('${boxId}')">✕ Cancelar</button>`

            }

          </div>
        </div>`;
      });

      // SINAL box
      if(res.sinal.length){
        const sId=`SINAL|${activeLoc}|${k}`;
        const safeId=sId.replace(/[|]/g,'_');
        _boxes[sId]={lk:k,dk,meta,sinal:res.sinal,type:'sinal'};
        html+=`<div class="gbox sinalizado" id="gbox-${safeId}" onclick="openModal('${sId}')">

/* ══ QUICK CONFIRM ══ */
async function quickConfirm(boxId){
  const box=_boxes[boxId];
  if(!box||box.type!=='group')return;
  const conf=getConf();
  if(conf[boxId]||box.confirmed){showToast(`${box.code} já confirmado`,'warn');return}
  conf[boxId]=new Date().toISOString();
  saveConf(conf);box.confirmed=true;
  // Update card UI
  const safeId=boxId.replace(/[|]/g,'_');
  const cardEl=document.getElementById('gbox-'+safeId);
  if(cardEl){
    cardEl.className='gbox confirmed just-confirmed';
    setTimeout(()=>cardEl.classList.remove('just-confirmed'),800);
    const pill=cardEl.querySelector('.gbox-pill');
    if(pill){pill.className='gbox-pill confirmed';const span=pill.querySelector('span:last-child');if(span)span.textContent=box.code+' ✓';}
    const acts=cardEl.querySelector('.gbox-acts');
    if(acts)acts.innerHTML=`<button class="gbox-act confirmed-done" onclick="event.stopPropagation()">✓ Confirmado</button><button class="gbox-act" onclick="event.stopPropagation();openModal('${boxId}')">👥 ${box.students.length}</button>`;
    const badge=cardEl.querySelector('.gbox-badge');if(badge)badge.style.color='var(--green)';
    const cnt=cardEl.querySelector('.gbox-count');if(cnt)cnt.style.color='var(--green)';
  }
  updateTopConf();renderTree();
  showToast(`${box.code} ✓ confirmado`,'ok');
  // Supabase update
  const refs=box.students.map(e=>e.ref).filter(Boolean);
  if(refs.length){
    try{
      const inList=refs.map(r=>`"${r}"`).join(',');
      const r=await fetch(`${SB}/rest/v1/timetable_requests?ref=in.(${inList})&academic_year=eq.${encodeURIComponent(AY)}`,
        {method:'PATCH',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify({assigned_turma:box.code,status:'atribuido'})});
      if(r.ok){refs.forEach(ref=>{if(rByRef[ref]){rByRef[ref].assigned_turma=box.code;rByRef[ref].status='atribuido'}})}
      else showToast(`SB erro ${r.status} — confirmado localmente`,'warn');
    }catch{showToast('Sem ligação — confirmado localmente','warn')}
  }
}

function cancelGroup(boxId){
  if(!confirm('Cancelar este grupo? Os alunos voltarão a sinalizados.'))return;
  showToast('Grupo cancelado','info');
  // In a full impl this would remove from data and re-render
}

async function confirmAllVisible(){
  const groups=Object.keys(_boxes).filter(id=>_boxes[id]?.type==='group');
  const conf=getConf();let ct=0;
  for(const boxId of groups){
    const box=_boxes[boxId];
    if(box&&!box.confirmed&&!conf[boxId]&&!box.isLow){await quickConfirm(boxId);ct++}
  }
  showToast(`${ct} turmas confirmadas`,'ok');
}

function updateTopConf(){
  const conf=getConf();
  const groups=Object.keys(_boxes).filter(id=>_boxes[id]?.type==='group');
  const n=groups.filter(id=>conf[id]||_boxes[id]?.confirmed).length;
  const total=groups.length;
  el('pill-conf',`${n} conf.`);
  el('rp-sub',`${total} grupos · ${n} confirmados · ${total-n} pendentes`);
  updateProgress(n,total);
}

/* ══ SEARCH ══ */
function onSearch(val){
  const q=val.trim().toLowerCase();
  const res=document.getElementById('search-res');
  if(q.length<2){res.classList.remove('open');return}
  const matches=allE.filter(e=>normB(e.branch)===activeLoc&&((e.name||'').toLowerCase().includes(q)||(e.ref||'').toLowerCase().includes(q))).slice(0,8);
  if(!matches.length){res.innerHTML=`<div style="padding:8px;font-size:7.5px;color:var(--t3);text-align:center">Nenhum resultado</div>`;res.classList.add('open');return}
  res.innerHTML=matches.map(e=>{
    const meta=getLM(e);const col=avCol(e.name||e.ref);
    const init=(e.name||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
    const req=rByRef[e.ref];const st=req?normS(req.status):'sem_pedido';
    const stCol=st==='atribuido'?'var(--green)':st==='sem_pedido'?'var(--red)':'var(--amber)';
    return`<div class="sr-item">
      <div style="width:20px;height:20px;border-radius:50%;background:${col.bg};border:1px solid ${col.text}44;color:${col.text};display:flex;align-items:center;justify-content:center;font-size:6.5px;font-weight:700;flex-shrink:0">${init}</div>
      <div style="flex:1;min-width:0"><div style="font-size:8.5px;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e.name||'—'}</div><div style="font-size:6.5px;color:var(--t3)">${meta.label} · ${e.ref}</div></div>
      <span style="font-size:6.5px;font-weight:700;color:${stCol};flex-shrink:0">${st==='atribuido'?'attr.':st==='sem_pedido'?'s/ped.':'pend.'}</span>
    </div>`;
  }).join('');
  res.classList.add('open');
}

/* ══ TOAST ══ */
let _toastT;
function showToast(msg,type='info'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className=`toast ${type} show`;
  clearTimeout(_toastT);_toastT=setTimeout(()=>t.classList.remove('show'),2800);
}

document.addEventListener('click',e=>{
  if(!e.target.closest('.search-wrap'))document.getElementById('search-res')?.classList.remove('open');
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

loadAll();
</script>
