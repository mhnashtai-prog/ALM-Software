<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ALM · Decision · 2027</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9A84C;--gold2:#E8C97A;--gold3:rgba(201,168,76,.15);--gold4:rgba(201,168,76,.06);
  --green:#1DB87A;--green-a:rgba(29,184,122,.12);--green-b:rgba(29,184,122,.32);
  --red:#E8455A;--red-a:rgba(232,69,90,.10);--red-b:rgba(232,69,90,.28);
  --amber:#E8A020;--amber-a:rgba(232,160,32,.12);--amber-b:rgba(232,160,32,.28);
  --teal:#28C8B0;--blue:#4A8FF5;--purple:#9B5ECA;
  --bg:#07060E;--bg2:#0E0B1A;--bg3:#141025;
  --b:rgba(201,168,76,.07);--b2:rgba(201,168,76,.14);--b3:rgba(201,168,76,.28);
  --t:rgba(238,218,168,.92);--t2:rgba(210,188,140,.55);--t3:rgba(210,188,140,.28);--t4:rgba(210,188,140,.10);
  --mono:'IBM Plex Mono',monospace;--display:'Bebas Neue',sans-serif;--dm:'DM Sans',-apple-system,sans-serif;
  --c-inf:#4A8FF5;--c-juv:#28C8B0;--c-ger:#C8A44A;--c-exa:#9B5ECA;
}
html,body{height:100%;background:var(--bg);color:var(--t);font-family:var(--mono);font-size:12px;-webkit-font-smoothing:antialiased;overflow:hidden}
body{display:flex;flex-direction:column}

@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.topbar{flex-shrink:0;height:50px;display:flex;align-items:center;background:rgba(7,6,14,.98);border-bottom:1px solid var(--b2);z-index:200}
.tb-home{display:flex;align-items:center;justify-content:center;width:44px;height:100%;border-right:1px solid var(--b);text-decoration:none;color:var(--t3);font-size:15px;flex-shrink:0;transition:all .15s}
.tb-home:hover{background:var(--gold4);color:var(--gold2)}
.tb-brand{display:flex;align-items:center;gap:8px;padding:0 16px;border-right:1px solid var(--b);flex-shrink:0;height:100%}
.tb-alm{font-family:var(--display);font-size:18px;letter-spacing:7px;color:var(--gold2)}
.tb-yr{font-size:7px;color:var(--t3);letter-spacing:.14em}
.tb-nav{display:flex;align-items:stretch;height:100%;flex:1}
.tb-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px;border-right:1px solid var(--b);text-decoration:none;gap:2px;flex-shrink:0;transition:background .15s;cursor:pointer}
.tb-tab:hover{background:var(--gold4)}
.tb-tab.active{background:rgba(201,168,76,.07);border-bottom:2px solid var(--gold)}
.tb-tab-sub{font-size:6.5px;color:var(--t4);letter-spacing:.08em;text-transform:uppercase}
.tb-tab.active .tb-tab-sub{color:var(--gold)}
.tb-tab-label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t3)}
.tb-tab.active .tb-tab-label{color:var(--gold2)}
.tb-tab-badge{font-size:6.5px;font-weight:700;padding:1px 5px;border-radius:2px;margin-top:2px;letter-spacing:.04em}
.tb-tab-badge.green{background:var(--green-a);border:1px solid var(--green-b);color:var(--green)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px;padding:0 14px;border-left:1px solid var(--b);height:100%;flex-shrink:0}
.tb-live{display:flex;align-items:center;gap:5px}
.tb-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:blink 2s infinite}
.tb-dot.warn{background:var(--amber)}.tb-dot.err{background:var(--red)}
.tb-pill{font-size:7.5px;font-weight:600;padding:2px 9px;border:1px solid;border-radius:2px;letter-spacing:.06em}
.tb-pill.gold{color:var(--gold2);border-color:var(--b3);background:var(--gold4)}
.tb-pill.ok{color:var(--green);border-color:var(--green-b);background:var(--green-a)}
.tb-pill.load{color:var(--amber);border-color:var(--amber-b)}
.tb-pill.err{color:var(--red);border-color:var(--red-b)}

.layout{flex:1;display:flex;overflow:hidden}
.sidebar{width:200px;flex-shrink:0;border-right:1px solid var(--b2);background:var(--bg2);display:flex;flex-direction:column;overflow:hidden}
.sb-kpis{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--b2);flex-shrink:0}
.sb-kpi{padding:9px 8px 7px}
.sb-kpi+.sb-kpi{border-left:1px solid var(--b)}
.sb-v{font-size:17px;font-weight:700;line-height:1}
.sb-l{font-size:6px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-top:3px}
.sb-branches{display:flex;flex-wrap:wrap;gap:3px;padding:7px 8px;border-bottom:1px solid var(--b);flex-shrink:0}
.br-pill{font-size:7.5px;font-weight:600;padding:3px 9px;border:1px solid var(--b);cursor:pointer;color:var(--t3);transition:all .13s;background:transparent;font-family:var(--mono);letter-spacing:.04em}
.br-pill:hover{color:var(--t2);border-color:var(--b2)}
.br-pill.active{background:var(--gold3);border-color:var(--gold);color:var(--gold2)}
.sb-list{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--b) transparent}
.sb-dept{padding:7px 10px 4px;font-size:6.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--t4);position:sticky;top:0;background:var(--bg2);z-index:2}
.sb-item{display:flex;align-items:center;gap:6px;padding:6px 10px;cursor:pointer;border-left:2px solid transparent;transition:all .12s}
.sb-item:hover{background:rgba(255,255,255,.018)}
.sb-item.active{background:var(--gold4);border-left-color:var(--gold)}
.sb-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.sb-name{font-size:9px;font-weight:600;flex:1}
.sb-n{font-size:8px;color:var(--t3)}
.sb-conf{font-size:6px;font-weight:700;padding:1px 4px;border:1px solid var(--green-b);color:var(--green);background:var(--green-a)}
.triage-panel{overflow-y:auto;max-height:220px;border-top:1px solid var(--b2)}
.tr-sec-hdr{display:flex;align-items:center;gap:7px;padding:8px 10px 5px;position:sticky;top:0;background:var(--bg2);border-bottom:.5px solid var(--b);z-index:2}
.tr-sec-label{font-size:7px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;flex:1}
.tr-sec-n{font-size:10px;font-weight:700;color:var(--t3)}
.tr-item{display:flex;align-items:center;gap:8px;padding:7px 10px 7px 11px;cursor:pointer;border-left:2.5px solid transparent;border-bottom:.5px solid var(--b);transition:all .12s}
.tr-item:hover{background:rgba(255,255,255,.016)}
.tr-item.ti-ok{border-left-color:var(--green)}.tr-item.ti-pending{border-left-color:rgba(201,168,76,.4)}
.tr-item-body{flex:1;min-width:0}.tr-item-label{font-size:9px;font-weight:600;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tr-item-sub{font-size:7.5px;color:var(--t3);margin-top:1px}
.tr-badge{font-size:7px;font-weight:700;padding:2px 7px;border:1px solid;border-radius:2px;flex-shrink:0}
.tb-green{background:var(--green-a);border-color:var(--green-b);color:var(--green)}.tb-gray{background:rgba(255,255,255,.04);border-color:var(--b2);color:var(--t3)}

.main{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--b) transparent;padding:20px 24px 80px}
.level-section{margin-bottom:32px;animation:fadeIn .3s ease}
.level-hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--b)}
.level-name{font-family:var(--display);font-size:22px;letter-spacing:4px}
.level-meta{font-size:8px;color:var(--t3);letter-spacing:.04em}
.level-spacer{flex:1}
.lv-btn{font-size:7px;font-weight:700;padding:3px 9px;border:1px solid;background:transparent;cursor:pointer;font-family:var(--mono);letter-spacing:.06em;transition:all .12s}
.lv-btn.green{border-color:var(--green-b);color:var(--green)}.lv-btn.green:hover{background:var(--green-a)}
.lv-btn.ghost{border-color:var(--b2);color:var(--t3)}.lv-btn.ghost:hover{border-color:var(--b3);color:var(--t2)}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.gcard{background:var(--bg2);border:1px solid var(--b2);border-radius:4px;overflow:hidden;transition:border-color .2s;position:relative;cursor:pointer}
.gcard.confirmed{border-color:rgba(29,184,122,.35)}
.gc-top{display:flex;align-items:center;justify-content:space-between;padding:10px 11px 7px}
.gc-code{font-family:var(--display);font-size:16px;letter-spacing:3px;line-height:1}
.gc-code.pending{color:var(--t4)}.gc-code.confirmed{color:var(--green)}
.gc-badge{font-size:6px;font-weight:700;padding:1px 6px;border:1px solid;letter-spacing:.08em}
.gc-badge.ok{background:var(--green-a);border-color:var(--green-b);color:var(--green)}
.gc-badge.pending{background:rgba(255,255,255,.03);border-color:var(--b2);color:var(--t4)}
.gc-mid{padding:4px 11px 8px;border-bottom:1px solid var(--b)}
.gc-pair{font-size:12px;font-weight:600;color:var(--t);letter-spacing:.02em;line-height:1}
.gc-block{display:inline-block;font-size:7px;font-weight:600;padding:1px 6px;margin-top:4px;letter-spacing:.06em}
.gc-block.manha{background:rgba(74,143,245,.1);color:var(--blue)}
.gc-block.tarde{background:rgba(155,94,202,.1);color:var(--purple)}
.gc-bottom{display:flex;align-items:center;justify-content:space-between;padding:7px 11px}
.gc-count{font-size:18px;font-weight:700;line-height:1}
.gc-max{font-size:9px;color:var(--t4);font-weight:400}
.gc-bar{width:36px;height:2px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:3px}
.gc-fill{height:100%;transition:width .3s}
.gc-toggle{width:32px;height:18px;background:rgba(255,255,255,.06);border:1px solid var(--b2);border-radius:99px;cursor:pointer;position:relative;transition:all .22s;flex-shrink:0}
.gc-toggle.on{background:var(--green);border-color:var(--green)}
.gc-toggle-thumb{position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:transform .22s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.gc-toggle.on .gc-toggle-thumb{transform:translateX(14px)}

.footer{position:fixed;bottom:0;left:200px;right:0;height:40px;background:rgba(7,6,14,.98);border-top:1px solid var(--b2);display:flex;align-items:center;gap:12px;padding:0 18px;z-index:150;backdrop-filter:blur(10px)}
.ft-label{font-size:7px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);flex-shrink:0}
.ft-track{flex:1;height:2px;background:rgba(255,255,255,.05);overflow:hidden}
.ft-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--teal));transition:width .6s ease}
.ft-stat{font-size:8px;color:var(--t2);flex-shrink:0;font-family:var(--mono)}
.ft-btn{font-size:7px;font-weight:700;padding:3px 10px;border:1px solid;background:transparent;cursor:pointer;font-family:var(--mono);letter-spacing:.06em;transition:all .12s;flex-shrink:0}
.ft-btn.green{border-color:var(--green-b);color:var(--green)}.ft-btn.green:hover{background:var(--green-a)}
.ft-btn.gold{border-color:var(--b3);color:var(--gold2)}.ft-btn.gold:hover{background:var(--gold4)}

.gl-overlay{display:none;position:fixed;inset:0;z-index:1800;background:rgba(4,3,10,.82);backdrop-filter:blur(28px);align-items:center;justify-content:center;padding:20px}
.gl-overlay.open{display:flex}
.gl-panel{width:min(600px,95vw);max-height:calc(100dvh - 100px);background:var(--bg2);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 32px 80px rgba(0,0,0,.9);border:.5px solid rgba(255,255,255,.06)}
.gl-hdr{position:relative;flex-shrink:0;min-height:100px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.gl-hdr-bg{position:absolute;inset:0}
.gl-hdr-scrim{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.05),rgba(0,0,0,.6))}
.gl-hdr-close{position:absolute;top:12px;right:12px;z-index:10;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.35);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.8);font-size:12px}
.gl-hdr-bottom{position:relative;z-index:5;padding:8px 16px 12px;display:flex;align-items:flex-end;justify-content:space-between}
.gl-hdr-code{font-family:var(--display);font-size:28px;letter-spacing:5px;color:#fff;line-height:1}
.gl-hdr-meta{font-size:9px;color:rgba(255,255,255,.55);margin-top:3px}
.gl-hdr-right{text-align:right;flex-shrink:0}
.gl-hdr-n{font-size:36px;font-weight:700;color:#fff;line-height:1}
.gl-hdr-max{font-size:16px;font-weight:400;color:rgba(255,255,255,.4)}
.gl-cap-bar-hdr{height:3px;background:rgba(255,255,255,.15);border-radius:2px;margin-top:5px;width:64px;margin-left:auto;overflow:hidden}
.gl-cap-fill-hdr{height:100%;border-radius:2px;transition:width .4s}
.gl-body{flex:1;overflow-y:auto;scrollbar-width:thin;padding:10px 14px}
.gl-footer{flex-shrink:0;border-top:1px solid rgba(255,255,255,.06)}
.gl-footer-btn{width:100%;height:46px;display:flex;align-items:center;justify-content:center;gap:10px;border:none;cursor:pointer;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.1em;transition:background .14s}
.gl-footer-btn.confirm{background:var(--green);color:#09080F}.gl-footer-btn.confirm:hover{background:#22d48c}
.gl-footer-btn.already{background:#0D3D24;color:var(--green);cursor:default}

.search-overlay{display:none;position:fixed;inset:0;z-index:2000;background:rgba(4,3,10,.75);backdrop-filter:blur(24px);align-items:flex-start;justify-content:center;padding-top:60px}
.search-overlay.open{display:flex}
.search-modal{width:min(580px,94vw);background:rgba(14,12,30,.96);border:.5px solid rgba(201,168,76,.24);border-radius:16px;overflow:hidden}
.sm-inp-row{display:flex;align-items:center;gap:12px;padding:14px 20px;background:rgba(0,0,0,.2)}
.sm-inp{background:transparent;border:none;outline:none;font-family:var(--mono);font-size:15px;color:var(--t);flex:1}
.sm-inp::placeholder{color:var(--t3)}
.sm-results{max-height:320px;overflow-y:auto;padding:6px 0}
.sm-result{display:flex;align-items:center;gap:12px;padding:9px 16px;cursor:pointer;transition:background .1s}
.sm-result:hover{background:rgba(201,168,76,.07)}
.sm-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;border:1px solid}
.sm-pill{font-size:7.5px;font-weight:700;padding:2px 8px;border-radius:99px;border:.5px solid;cursor:pointer}
.sm-pill.has-group{background:var(--green-a);border-color:var(--green-b);color:var(--green)}
.sm-pill.no-group{background:var(--red-a);border-color:var(--red-b);color:var(--red);cursor:default}
.sm-hint{display:flex;gap:12px;padding:8px 16px;background:rgba(0,0,0,.2);border-top:.5px solid rgba(255,255,255,.04);font-size:7.5px;color:var(--t4)}
.sm-kbd{border:.5px solid var(--b2);padding:1px 5px;border-radius:2px;color:var(--t3)}

.m-stu-row{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.02);border:.5px solid rgba(255,255,255,.05);margin-bottom:5px}
.m-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0}
.m-tick{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0}
.m-tick.done{background:var(--green);color:#fff}.m-tick.pend{background:rgba(232,160,32,.15);color:var(--amber);border:1px solid var(--amber-b)}

.toast{position:fixed;bottom:52px;left:50%;transform:translateX(-50%) translateY(8px);padding:5px 16px;font-size:8px;font-weight:600;opacity:0;transition:all .2s;z-index:3000;pointer-events:none;border:1px solid;white-space:nowrap;letter-spacing:.06em}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--green-a);border-color:var(--green-b);color:var(--green)}
.toast.warn{background:var(--amber-a);border-color:var(--amber-b);color:var(--amber)}
.toast.err{background:var(--red-a);border-color:var(--red-b);color:var(--red)}

.spinner-wrap{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--t3);gap:9px;font-size:8.5px;letter-spacing:.1em}
.spinner{width:13px;height:13px;border:1.5px solid rgba(255,255,255,.07);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}

.sb-search-wrap{padding:7px 8px;border-bottom:1px solid var(--b);flex-shrink:0;cursor:pointer}
.sb-search-inner{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--b2);padding:5px 8px}
.sb-search-inner:hover{border-color:var(--gold)}
.sb-search-fake{font-family:var(--mono);font-size:9px;color:var(--t3);flex:1}

*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.05) transparent}
</style>
</head>
<body>

<div class="topbar">
  <a class="tb-home" href="/admin/alm-painel-central">⌂</a>
  <div class="tb-brand">
    <span class="tb-alm">ALM</span>
    <span class="tb-yr" id="tb-yr">2026/27</span>
  </div>
  <div class="tb-nav">
    <a class="tb-tab" href="/admin/alm-painel-central">
      <div class="tb-tab-sub">visualizar</div>
      <div class="tb-tab-label">Overview</div>
    </a>
    <div class="tb-tab active">
      <div class="tb-tab-sub">certificar</div>
      <div class="tb-tab-label">Confirmar</div>
      <div class="tb-tab-badge green" id="conf-badge">0 / 0</div>
    </div>
    <a class="tb-tab" href="/admin/alm-atribuir-turmas">
      <div class="tb-tab-sub">atribuir</div>
      <div class="tb-tab-label">Atribuir</div>
    </a>
  </div>
  <div class="tb-right">
    <div class="tb-live"><div class="tb-dot" id="live-dot"></div></div>
    <div class="tb-pill gold" id="pill-total">— grupos</div>
    <div class="tb-pill ok" id="pill-conf">0 conf.</div>
    <div class="tb-pill load" id="pill-status">A carregar…</div>
  </div>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="sb-kpis">
      <div class="sb-kpi"><div class="sb-v" style="color:var(--gold2)" id="sb-total">—</div><div class="sb-l">Grupos</div></div>
      <div class="sb-kpi"><div class="sb-v" style="color:var(--green)" id="sb-com">—</div><div class="sb-l">Enviados</div></div>
      <div class="sb-kpi"><div class="sb-v" style="color:var(--amber)" id="sb-sem">—</div><div class="sb-l">Pendente</div></div>
    </div>
    <div class="sb-branches" id="sb-branches"></div>
    <div class="sb-search-wrap" onclick="openSearch()">
      <div class="sb-search-inner">
        <span style="font-size:10px;color:var(--t3)">⌕</span>
        <span class="sb-search-fake">Nome ou código…</span>
      </div>
    </div>
    <div class="sb-list" id="sb-list"><div class="spinner-wrap" style="padding:16px"><div class="spinner"></div></div></div>
    <div class="triage-panel" id="triage-panel"></div>
  </div>

  <div class="main" id="main">
    <div class="spinner-wrap"><div class="spinner"></div>A ligar à base de dados…</div>
  </div>
</div>

<div class="footer">
  <span class="ft-label">Progresso</span>
  <div class="ft-track"><div class="ft-fill" id="ft-fill" style="width:0%"></div></div>
  <span class="ft-stat" id="ft-stat">0 / 0</span>
  <button class="ft-btn gold" onclick="exportCSV()">↓ CSV</button>
  <button class="ft-btn green" onclick="certifyAll()">✓ Confirmar todos</button>
</div>

<!-- GROUP DETAIL OVERLAY -->
<div class="gl-overlay" id="gl-overlay" onclick="if(event.target===this)closeGL()">
  <div class="gl-panel">
    <div class="gl-hdr">
      <div class="gl-hdr-bg" id="gl-bg"></div>
      <div class="gl-hdr-scrim"></div>
      <button class="gl-hdr-close" onclick="closeGL()">✕</button>
      <div class="gl-hdr-bottom">
        <div>
          <div class="gl-hdr-code" id="gl-code">—</div>

<script>
// ═══════════════════════════════════════
// CONFIG — academic year stored literally as "2026/2027"

const SB  = 'https://oapygbeliocdvitbdjbq.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9hcHlnYmVsaW9jZHZpdGJkamJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NjQzNjAsImV4cCI6MjA5MjA0MDM2MH0.-9Uj9Bg3q8sIlqzfzw2Sc1JziaueeyYGNwep-qWhWWg';
const H   = { apikey:KEY, Authorization:'Bearer '+KEY, 'Content-Type':'application/json' };

// CRITICAL: the DB stores "2026/2027" — use encodeURIComponent for the eq. filter

const AY_ENC  = encodeURIComponent(AY_RAW);   // → "2026%2F2027"

};
const DO = ['kids','kids_juv','adults','exam'];
const BL = {FUNCHAL:'Funchal',CAMARA_LOBOS:'C. Lobos',SANTA_CRUZ:'S. Cruz',MACHICO:'Machico',RIBEIRA_BRAVA:'R. Brava',CALHETA:'Calheta'};
const BO = ['FUNCHAL','CAMARA_LOBOS','SANTA_CRUZ','MACHICO','RIBEIRA_BRAVA','CALHETA'];

const DEPT_GRADS = {
  kids:     'linear-gradient(145deg,#1A5FAA,#060D24)',
  kids_juv: 'linear-gradient(145deg,#0D8A6A,#021C16)',
  adults:   'linear-gradient(145deg,#8A5A0A,#1A0E02)',
  exam:     'linear-gradient(145deg,#6A28A8,#140820)',
};
const DEPT_ACCENTS = {kids:'#5A9EFF',kids_juv:'#1EC8A0',adults:'#F0A040',exam:'#B06AE8'};
const AV_POOL = [
  {bg:'#3A2244',text:'#C8A0E0'},{bg:'#1E2E50',text:'#7AABEE'},
  {bg:'#1A3A2A',text:'#5EC888'},{bg:'#3A2A14',text:'#D4944A'},
  {bg:'#3A1A1A',text:'#E07878'},{bg:'#282838',text:'#9898D8'},
  {bg:'#1A2A3A',text:'#5A9EC8'},{bg:'#2A3820',text:'#80B850'},
];
const DAY_TO_IDX = {SEG:0,TER:1,QUA:2,QUI:3,SEX:4,'SÁB':5,SAB:5};
const PAIR_COLORS = {'0-2':'#ABCBA0','1-3':'#C7A2A2','2-4':'#50732A','5-5':'#4B2C2A'};

// ═══════════════════════════════════════
// STATE
// ═══════════════════════════════════════
let allGroups = [];
let enrolByRef = {};
let certifiedSet = new Set();
let activeLoc = 'FUNCHAL';
let _glGroupCode = null;

// ═══════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════
const normB  = b => (b||'').toUpperCase().replace(/[\s\-]+/g,'_').trim();
const avCol  = n => { let h=0; for(let i=0;i<(n||'?').length;i++) h=(h*31+(n||'?').charCodeAt(i))&0xffffffff; return AV_POOL[Math.abs(h)%AV_POOL.length]; };
const avInit = n => (n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
const getLM  = lc => LEVEL_MAP[lc] || {dept:'adults',label:lc||'—',color:'var(--t3)',order:99};

function pairColFromDays(days){
  const idxs=[...new Set((days||[]).map(d=>DAY_TO_IDX[d]??-1).filter(i=>i>=0))].sort();
  if(!idxs.length) return '#847C3D';
  const key=idxs.length===1?`${idxs[0]}-${idxs[0]}`:`${idxs[0]}-${idxs[idxs.length-1]}`;
  return PAIR_COLORS[key]||'#847C3D';
}

function blockFrom(t){ const h=parseInt((t||'').split(':')[0],10); return !isNaN(h)&&h<=13?'manha':'tarde'; }

async function loadCertified(){
  const rows = await sbGet('certification_seals',
    `select=group_code,confirmed&academic_year=eq.${AY_ENC}&confirmed=eq.true`
  );
  certifiedSet = new Set(rows.map(r => r.group_code));
}

async function saveCertified(groupCode, isConfirmed){
  await fetch(
    `${SB}/rest/v1/certification_seals?group_code=eq.${encodeURIComponent(groupCode)}&academic_year=eq.${AY_ENC}`,
    { method:'PATCH', headers:{...H, Prefer:'return=minimal'},
      body: JSON.stringify({confirmed: isConfirmed}) }
  );
}
let _toastT;
function showToast(msg,type='ok'){
  const t=document.getElementById('toast'); t.textContent=msg; t.className=`toast ${type} show`;
  clearTimeout(_toastT); _toastT=setTimeout(()=>t.classList.remove('show'),3200);
}

// ═══════════════════════════════════════
// SUPABASE — paginated fetch
// ═══════════════════════════════════════
async function sbGet(table,qs){
  let all=[],page=0,ps=1000;
  while(true){
    const s=page*ps,e=s+ps-1;
    const r=await fetch(`${SB}/rest/v1/${table}?${qs}`,{headers:{...H,Range:`${s}-${e}`,Prefer:'count=none'}});
    if(!r.ok) throw new Error(`${table} HTTP ${r.status}: ${await r.text()}`);
    const d=await r.json(); all=all.concat(d);
    if(d.length<ps) break; page++; if(page>9) break;
  }
  return all;
}

// ═══════════════════════════════════════
// LOAD — reads from certification_seals + enrolments
// Both tables store academic_year as literal "2026/2027"
// ═══════════════════════════════════════
async function loadAll(){
  try{
    document.getElementById('pill-status').textContent='A carregar…';

    // 1. Fetch certification seals — these are the confirmed groups from Overview
    const seals = await sbGet('certification_seals',
      `select=group_code,turma_code_a,turma_code_b,level_code,department,branch,`
      +`pair_label,day_a,day_b,start_time,end_time,student_refs,academic_year`
      +`&academic_year=eq.${AY_ENC}`
      +`&order=group_code`
    );

    // 2. Fetch enrolments — no academic_year filter on enrolments table to avoid mismatch
    //    Just get all refs so we can resolve names
    const enrols = await sbGet('enrolments',
      `select=ref,name,branch,lang,family,level_code`
      +`&academic_year=eq.${AY_ENC}`
      +`&order=ref`
    );

    enrolByRef = {};
    enrols.forEach(e=>{ enrolByRef[e.ref]=e; });

    if(seals.length===0){
      // Fallback: try classes table (Overview writes there too)
      await loadFromClasses();
      return;
    }

    // Build group objects from seals
    allGroups = seals.map(s=>{
      const refs = Array.isArray(s.student_refs)?s.student_refs:[];
      const students = refs.map(r=>enrolByRef[r]||{ref:r,name:r}).filter(Boolean);
      const days = [s.day_a,s.day_b].filter(Boolean);
      const bl = blockFrom(s.start_time);
      const sessions = [
        {turma_code:s.turma_code_a||s.group_code+'A',day_of_week:s.day_a,suffix:'A'},
        ...(s.turma_code_b?[{turma_code:s.turma_code_b,day_of_week:s.day_b,suffix:'B'}]:[]),
      ].filter(x=>x.day_of_week);
      return {
        group_code:  s.group_code,
        sessions,
        level_code:  s.level_code,
        department:  s.department,
        branch:      normB(s.branch||'FUNCHAL'),
        meta:        getLM(s.level_code||''),
        students,
        student_refs:refs,
        pairLabel:   s.pair_label||(days.join(' + ')||'—'),
        pairCol:     pairColFromDays(days),
        block:       bl,
        start_time:  s.start_time,
        end_time:    s.end_time,
      };
    }).sort((a,b)=>(a.meta.order||99)-(b.meta.order||99)||a.group_code.localeCompare(b.group_code));

    finishLoad(seals.length, enrols.length);

  }catch(err){
    console.error('loadAll error:', err);
    document.getElementById('live-dot').className='tb-dot err';
    document.getElementById('pill-status').textContent='Erro DB';
    document.getElementById('pill-status').className='tb-pill err';
    document.getElementById('main').innerHTML=
      `<div class="spinner-wrap" style="color:var(--red);flex-direction:column;gap:8px">
        <div>Erro: ${err.message}</div>
        <div style="font-size:7px;color:var(--t3);max-width:400px;text-align:center">
          Verifique a consola. Pode ser um problema de autenticação ou que a tabela certification_seals está vazia.
        </div>
        <button onclick="loadFromClasses()" style="font-size:8px;padding:5px 12px;border:1px solid var(--amber-b);color:var(--amber);background:transparent;cursor:pointer;font-family:var(--mono)">
          Tentar via tabela classes →
        </button>
      </div>`;
    showToast('Erro BD: '+err.message,'err');
  }
}

// Fallback: load from 'classes' table (what Overview actually writes to)
async function loadFromClasses(){
  try{
    showToast('A tentar tabela classes…','warn');
    const rows = await sbGet('classes',
      `select=turma_code,group_code,level_code,department,branch,`
      +`day_of_week,start_time,end_time,student_refs,academic_year`
      +`&academic_year=eq.${AY_ENC}`
      +`&order=group_code`
    );

    // group by group_code
    const byGroup = {};
    rows.forEach(r=>{
      const gc = r.group_code||r.turma_code.replace(/[AB]$/,'');
      if(!byGroup[gc]) byGroup[gc]={sessions:[],row:r};
      byGroup[gc].sessions.push({turma_code:r.turma_code,day_of_week:r.day_of_week,suffix:r.turma_code.slice(-1)});
    });

    allGroups = Object.entries(byGroup).map(([gc,{sessions,row}])=>{
      const refs = Array.isArray(row.student_refs)?row.student_refs:[];
      const students = refs.map(r=>enrolByRef[r]||{ref:r,name:r}).filter(Boolean);
      const days = sessions.map(s=>s.day_of_week).filter(Boolean);
      return {
        group_code:  gc,
        sessions,
        level_code:  row.level_code,
        department:  row.department,
        branch:      normB(row.branch||'FUNCHAL'),
        meta:        getLM(row.level_code||''),
        students,
        student_refs:refs,
        pairLabel:   days.join(' + ')||'—',
        pairCol:     pairColFromDays(days),
        block:       blockFrom(row.start_time),
        start_time:  row.start_time,
        end_time:    row.end_time,
      };
    }).sort((a,b)=>(a.meta.order||99)-(b.meta.order||99)||a.group_code.localeCompare(b.group_code));

    finishLoad(allGroups.length, Object.keys(enrolByRef).length);
    showToast(`${allGroups.length} grupos carregados via classes`,'ok');

  }catch(err2){
    document.getElementById('main').innerHTML=
      `<div class="spinner-wrap" style="color:var(--red)">Erro classes: ${err2.message}</div>`;
    showToast('Erro tabela classes: '+err2.message,'err');
  }
}

function finishLoad(groupCount, enrolCount){
  document.getElementById('live-dot').className='tb-dot';
  document.getElementById('pill-status').textContent='Supabase OK';
  document.getElementById('pill-status').className='tb-pill ok';
  document.getElementById('pill-total').textContent=`${groupCount} grupos`;

  const branches=[...new Set(allGroups.map(g=>g.branch).filter(Boolean))];
  const ordered=BO.filter(b=>branches.includes(b)).concat(branches.filter(b=>!BO.includes(b)));
  if(ordered.length&&!ordered.includes(activeLoc)) activeLoc=ordered[0];

  renderBranches(ordered);
  renderAll();
  showToast(`${groupCount} grupos · ${enrolCount} inscrições`,'ok');
}

// ═══════════════════════════════════════
// BRANCHES
// ═══════════════════════════════════════
function renderBranches(ordered){
  document.getElementById('sb-branches').innerHTML =
    ordered.map(b=>`<button class="br-pill${b===activeLoc?' active':''}" onclick="setLoc('${b}',this)">${BL[b]||b}</button>`).join('');
}
function setLoc(loc,btn){
  activeLoc=loc;
  document.querySelectorAll('.br-pill').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  renderAll();
}

// ═══════════════════════════════════════
// RENDER ALL
// ═══════════════════════════════════════
function renderAll(){
  const groups = allGroups.filter(g=>g.branch===activeLoc);
  const cert = groups.filter(g=>certifiedSet.has(g.group_code)).length;

  document.getElementById('sb-total').textContent=groups.length;
  document.getElementById('sb-com').textContent=cert;
  document.getElementById('sb-sem').textContent=groups.length-cert;

  updateProgress(cert,groups.length);
  renderSidebar(groups);
  renderMain(groups);
  renderTriage(groups);
}

function updateProgress(cert,total){
  const pct=total?Math.round(cert/total*100):0;
  document.getElementById('ft-fill').style.width=pct+'%';
  document.getElementById('ft-stat').textContent=`${cert} / ${total} (${pct}%)`;
  document.getElementById('pill-conf').textContent=`${cert} enviados`;
  document.getElementById('conf-badge').textContent=`${cert} / ${total}`;
}

function renderSidebar(groups){
  const tree={};
  groups.forEach(g=>{
    const dk=g.meta.dept||'adults',lc=g.level_code;
    if(!tree[dk])tree[dk]={};
    if(!tree[dk][lc])tree[dk][lc]={count:0,cert:0};
    tree[dk][lc].count++;
    if(certifiedSet.has(g.group_code))tree[dk][lc].cert++;
  });
  let html='';
  DO.forEach(dk=>{
    if(!tree[dk])return;
    const dc=DC[dk]||{};
    html+=`<div class="sb-dept">${dc.label||dk}</div>`;
    Object.keys(tree[dk]).sort((a,b)=>(LEVEL_MAP[a]?.order||99)-(LEVEL_MAP[b]?.order||99)).forEach(lc=>{
      const meta=getLM(lc),{count,cert}=tree[dk][lc];
      html+=`<div class="sb-item" onclick="scrollToLevel('${lc}')">
        <div class="sb-dot" style="background:${meta.color}"></div>
        <div class="sb-name">${meta.label}</div>
        <div class="sb-n">${count}</div>
        ${cert>0?`<span class="sb-conf">${cert}</span>`:''}
      </div>`;
    });
  });
  document.getElementById('sb-list').innerHTML=html||'<div style="padding:16px;font-size:8px;color:var(--t3);text-align:center">Sem grupos</div>';
}

function scrollToLevel(lc){
  const el=document.getElementById('level-'+lc.replace(/[^a-z0-9]/gi,'_'));
  el?.scrollIntoView({behavior:'smooth',block:'start'});
}

function renderMain(groups){
  if(!groups.length){
    document.getElementById('main').innerHTML=
      `<div class="spinner-wrap" style="color:var(--t3);flex-direction:column;gap:8px">
        <div>Nenhuma turma confirmada para <strong>${BL[activeLoc]||activeLoc}</strong></div>
        <div style="font-size:7px;color:var(--t4)">Os grupos são criados no painel Overview e ficam aqui depois de certificados.</div>
      </div>`;
    return;
  }

  const byDept={};
  groups.forEach(g=>{
    const dk=g.meta.dept||'adults';
    if(!byDept[dk])byDept[dk]={};
    if(!byDept[dk][g.level_code])byDept[dk][g.level_code]=[];
    byDept[dk][g.level_code].push(g);
  });

  let html='';
  DO.forEach(dk=>{
    if(!byDept[dk])return;
    Object.keys(byDept[dk]).sort((a,b)=>(LEVEL_MAP[a]?.order||99)-(LEVEL_MAP[b]?.order||99)).forEach(lc=>{
      const lvGroups=byDept[dk][lc];
      const meta=getLM(lc);
      const total=lvGroups.reduce((s,g)=>s+g.students.length,0);
      const certCount=lvGroups.filter(g=>certifiedSet.has(g.group_code)).length;
      const safeKey=lc.replace(/[^a-z0-9]/gi,'_');
      html+=`<div class="level-section" id="level-${safeKey}">
        <div class="level-hdr">
          <div class="level-name" style="color:${meta.color}">${meta.label}</div>
          <div class="level-meta">${lvGroups.length} grupo${lvGroups.length!==1?'s':''} · ${total} alunos · ${certCount} enviados</div>
          <div class="level-spacer"></div>
          <button class="lv-btn green" onclick="certifyLevel('${lc}')">✓ Enviar nível</button>
        </div>
        <div class="card-grid">`;
      lvGroups.forEach(g=>{ html+=buildCards(g); });
      html+=`</div></div>`;
    });
  });

  document.getElementById('main').innerHTML=html;
}

function buildCards(g){
  const isSent=certifiedSet.has(g.group_code);
  const col=g.pairCol;
  const cap=Math.round(g.students.length/17*100);
  const fillCol=isSent?'var(--green)':col;

  return g.sessions.map((s,si)=>{
    const safeId=s.turma_code.replace(/[^a-z0-9]/gi,'_');
    const blockCls=g.block==='manha'?'manha':'tarde';
    const blockLbl=g.block==='manha'?'Manhã':'Tarde';
    const isA=si===0;
    const toggleHtml=isA?`
      <div style="position:absolute;bottom:10px;right:11px">
        <div class="gc-toggle ${isSent?'on':''}" onclick="event.stopPropagation();toggleCert('${g.group_code}')" title="Enviar para ASSIGN">
          <div class="gc-toggle-thumb"></div>
        </div>
      </div>`:'';
    return `<div class="gcard${isSent?' confirmed':''}" id="gcard-${safeId}" onclick="openGL('${g.group_code}')">
      <div class="gc-top">
        <div class="gc-code ${isSent?'confirmed':'pending'}">${s.turma_code}</div>
        <span class="gc-badge ${isSent?'ok':'pending'}">${isSent?'ENVIADO':'ENVIAR'}</span>
      </div>
      <div class="gc-mid">
        <div class="gc-pair" style="color:${col}">${s.day_of_week||'—'}</div>
        <span class="gc-block ${blockCls}">${blockLbl} · ${g.start_time||'—'}</span>
      </div>
      <div class="gc-bottom" style="${isA?'padding-bottom:42px':''}">
        <div>
          <div class="gc-count" style="color:${col}">${g.students.length}<span class="gc-max">/17</span></div>
          <div class="gc-bar"><div class="gc-fill" style="width:${cap}%;background:${fillCol}"></div></div>
        </div>
        ${!isA?`<div style="font-size:7px;color:var(--t4)">↑ mesmo grupo</div>`:''}
      </div>
      ${toggleHtml}
    </div>`;
  }).join('');
}

function refreshCard(groupCode){
  const g=allGroups.find(x=>x.group_code===groupCode);if(!g)return;
  const isSent=certifiedSet.has(groupCode);
  const col=g.pairCol;
  const cap=Math.round(g.students.length/17*100);
  const fillCol=isSent?'var(--green)':col;
  g.sessions.forEach((s,si)=>{
    const safeId=s.turma_code.replace(/[^a-z0-9]/gi,'_');
    const el=document.getElementById('gcard-'+safeId);
    if(!el)return;
    const blockCls=g.block==='manha'?'manha':'tarde';
    const blockLbl=g.block==='manha'?'Manhã':'Tarde';
    const isA=si===0;
    const toggleHtml=isA?`<div style="position:absolute;bottom:10px;right:11px"><div class="gc-toggle ${isSent?'on':''}" onclick="event.stopPropagation();toggleCert('${g.group_code}')"><div class="gc-toggle-thumb"></div></div></div>`:'';
    el.className=`gcard${isSent?' confirmed':''}`;
    el.innerHTML=`<div class="gc-top"><div class="gc-code ${isSent?'confirmed':'pending'}">${s.turma_code}</div><span class="gc-badge ${isSent?'ok':'pending'}">${isSent?'ENVIADO':'ENVIAR'}</span></div>
      <div class="gc-mid"><div class="gc-pair" style="color:${col}">${s.day_of_week||'—'}</div><span class="gc-block ${blockCls}">${blockLbl} · ${g.start_time||'—'}</span></div>
      <div class="gc-bottom" style="${isA?'padding-bottom:42px':''}"><div><div class="gc-count" style="color:${col}">${g.students.length}<span class="gc-max">/17</span></div><div class="gc-bar"><div class="gc-fill" style="width:${cap}%;background:${fillCol}"></div></div></div>${!isA?'<div style="font-size:7px;color:var(--t4)">↑ mesmo grupo</div>':''}</div>${toggleHtml}`;
  });
}

// ═══════════════════════════════════════
// CERTIFY
// ═══════════════════════════════════════
function toggleCert(groupCode){
  if(certifiedSet.has(groupCode))certifiedSet.delete(groupCode);
  else certifiedSet.add(groupCode);
  saveCertified();
  refreshCard(groupCode);
  const groups=allGroups.filter(g=>g.branch===activeLoc);
  const cert=groups.filter(g=>certifiedSet.has(g.group_code)).length;
  updateProgress(cert,groups.length);
  renderSidebar(groups);
  renderTriage(groups);
  document.getElementById('sb-com').textContent=cert;
  document.getElementById('sb-sem').textContent=groups.length-cert;
  showToast(certifiedSet.has(groupCode)?`${groupCode} → ASSIGN ✓`:`${groupCode} retirado`,'ok');
  if(_glGroupCode===groupCode) refreshGLFooter(groupCode);
}

function certifyLevel(lc){
  const groups=allGroups.filter(g=>g.branch===activeLoc&&g.level_code===lc);
  groups.forEach(g=>certifiedSet.add(g.group_code));
  saveCertified();
  groups.forEach(g=>refreshCard(g.group_code));
  const all=allGroups.filter(g=>g.branch===activeLoc);
  const cert=all.filter(g=>certifiedSet.has(g.group_code)).length;
  updateProgress(cert,all.length);
  renderSidebar(all);renderTriage(all);
  document.getElementById('sb-com').textContent=cert;
  document.getElementById('sb-sem').textContent=all.length-cert;
  showToast(`${groups.length} turmas de ${getLM(lc).label} enviadas`,'ok');
}

function certifyAll(){
  const groups=allGroups.filter(g=>g.branch===activeLoc);
  groups.forEach(g=>certifiedSet.add(g.group_code));
  saveCertified();
  renderAll();
  showToast(`${groups.length} turmas enviadas para ASSIGN`,'ok');
}

// ═══════════════════════════════════════
// TRIAGE
// ═══════════════════════════════════════
function renderTriage(groups){
  const tp=document.getElementById('triage-panel');if(!tp)return;
  const pending=groups.filter(g=>!certifiedSet.has(g.group_code));
  const done=groups.filter(g=>certifiedSet.has(g.group_code));
  let html='';
  if(pending.length){
    html+=`<div class="tr-sec-hdr"><span class="tr-sec-label" style="color:var(--gold2)">Por enviar</span><span class="tr-sec-n">${pending.length}</span></div>`;
    pending.slice(0,12).forEach(g=>{
      html+=`<div class="tr-item ti-pending" onclick="scrollToCard('${g.group_code}')">
        <div class="tr-item-body"><div class="tr-item-label">${g.group_code}</div><div class="tr-item-sub">${g.pairLabel} · ${g.meta.label} · ${g.students.length} al</div></div>
        <span class="tr-badge tb-gray">pend.</span>
      </div>`;
    });
    if(pending.length>12) html+=`<div style="padding:5px 10px;font-size:7px;color:var(--t4)">+${pending.length-12} mais…</div>`;
  }
  if(done.length){
    html+=`<div class="tr-sec-hdr"><span class="tr-sec-label" style="color:var(--green)">✓ Enviados</span><span class="tr-sec-n" style="color:var(--green)">${done.length}</span></div>`;
    done.slice(0,8).forEach(g=>{
      html+=`<div class="tr-item ti-ok" onclick="scrollToCard('${g.group_code}')">
        <div class="tr-item-body"><div class="tr-item-label">${g.group_code}</div><div class="tr-item-sub">${g.meta.label} · ${g.students.length} al</div></div>
        <span class="tr-badge tb-green">✓</span>
      </div>`;
    });
  }
  tp.innerHTML=html||'<div style="padding:14px;text-align:center;color:var(--t3);font-size:8px">Sem turmas</div>';
}

function scrollToCard(groupCode){
  const g=allGroups.find(x=>x.group_code===groupCode);if(!g)return;
  const s=g.sessions[0];if(!s)return;
  const el=document.getElementById('gcard-'+s.turma_code.replace(/[^a-z0-9]/gi,'_'));
  if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.outline='2px solid var(--gold)';setTimeout(()=>el.style.outline='',1200);}
}

// ═══════════════════════════════════════
// GROUP DETAIL OVERLAY
// ═══════════════════════════════════════
function openGL(groupCode){
  const g=allGroups.find(x=>x.group_code===groupCode);if(!g)return;
  _glGroupCode=groupCode;
  const accent=DEPT_ACCENTS[g.meta.dept]||DEPT_ACCENTS.adults;
  document.getElementById('gl-bg').style.background=DEPT_GRADS[g.meta.dept]||DEPT_GRADS.adults;
  const codes=g.sessions.map(s=>s.turma_code).join(' · ');
  document.getElementById('gl-code').textContent=codes;
  document.getElementById('gl-code').style.color=accent;
  document.getElementById('gl-meta').textContent=
    `${g.pairLabel} · ${g.block==='manha'?'Manhã':'Tarde'} ${g.start_time||'—'} · ${g.meta.label}`;
  document.getElementById('gl-n').textContent=g.students.length;
  const cap=Math.round(g.students.length/17*100);
  const fillEl=document.getElementById('gl-cap');
  if(fillEl){fillEl.style.width=cap+'%';fillEl.style.background=cap>=80?'var(--amber)':accent;}

  const isSent=certifiedSet.has(groupCode);
  const sorted=[...g.students].sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  document.getElementById('gl-body').innerHTML=sorted.map((e,i)=>{
    const col=avCol(e.name||e.ref),init=avInit(e.name||e.ref);
    return `<div class="m-stu-row">
      <div class="m-tick ${isSent?'done':'pend'}">${isSent?'✓':'◎'}</div>
      <span style="font-size:8px;color:var(--t4);width:18px;text-align:right">${i+1}</span>
      <div class="m-av" style="background:${col.bg};color:${col.text}">${init}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:10px;color:var(--t)">${e.name||'—'}</div>
        <div style="font-size:7.5px;color:var(--t3)">${e.ref||'—'} · ${e.lang||'EN'}</div>
      </div>
    </div>`;
  }).join('');

  refreshGLFooter(groupCode);
  document.getElementById('gl-overlay').classList.add('open');
}

function refreshGLFooter(groupCode){
  const isSent=certifiedSet.has(groupCode);
  const btn=document.getElementById('gl-btn');
  if(isSent){
    btn.className='gl-footer-btn already';
    btn.innerHTML='✓ ENVIADA · clique para retirar';
  }else{
    btn.className='gl-footer-btn confirm';
    btn.innerHTML='✦ ENVIAR PARA ASSIGN';
  }
}

function glToggle(){ if(_glGroupCode){toggleCert(_glGroupCode);} }
function closeGL(){ document.getElementById('gl-overlay').classList.remove('open');_glGroupCode=null; }

// ═══════════════════════════════════════
// SEARCH
// ═══════════════════════════════════════
function openSearch(){
  document.getElementById('search-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('sm-inp').focus(),60);
  document.getElementById('sm-results').innerHTML='<div style="padding:24px;text-align:center;color:var(--t3);font-size:9px">Digite para pesquisar…</div>';
}
function closeSearch(){ document.getElementById('search-overlay').classList.remove('open'); }

const groupByRef={};
function buildGroupIndex(){
  groupByRef={};
  allGroups.forEach(g=>g.students.forEach(s=>{groupByRef[s.ref]=g;}));
}

function onSearch(val){
  if(!val.trim()){document.getElementById('sm-results').innerHTML='<div style="padding:24px;text-align:center;color:var(--t3);font-size:9px">Digite para pesquisar…</div>';return;}
  const q=val.toLowerCase().trim();
  // Search in students
  let stuMatches=[];
  allGroups.forEach(g=>g.students.forEach(s=>{
    if((s.name||'').toLowerCase().includes(q)||(s.ref||'').toLowerCase().includes(q))
      stuMatches.push({s,g});
  }));
  // Search in group codes
  const gcMatches=allGroups.filter(g=>g.group_code.toLowerCase().includes(q));
  const seen=new Set(gcMatches.map(g=>g.group_code));
  stuMatches=stuMatches.filter(({g})=>!seen.has(g.group_code));

  const all=[
    ...gcMatches.map(g=>({type:'group',g})),
    ...stuMatches.slice(0,8).map(({s,g})=>({type:'student',s,g})),
  ].slice(0,12);

  if(!all.length){document.getElementById('sm-results').innerHTML='<div style="padding:24px;text-align:center;color:var(--t3);font-size:9px">Sem resultados</div>';return;}
  document.getElementById('sm-results').innerHTML=all.map(item=>{
    if(item.type==='group'){
      const g=item.g,isSent=certifiedSet.has(g.group_code);
      return `<div class="sm-result" onclick="closeSearch();openGL('${g.group_code}')">
        <div style="width:34px;height:34px;border-radius:4px;background:${g.pairCol}22;border:1px solid ${g.pairCol}55;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:12px;color:${g.pairCol};flex-shrink:0">${g.group_code.slice(-2)}</div>
        <div style="flex:1;min-width:0"><div style="font-size:10px;font-weight:700;color:var(--t)">${g.group_code}</div><div style="font-size:7.5px;color:var(--t3)">${g.pairLabel} · ${g.meta.label} · ${g.students.length} al</div></div>
        <span class="sm-pill ${isSent?'has-group':'no-group'}">${isSent?'✓ enviado':'pendente'}</span>
      </div>`;
    }else{
      const{s,g}=item;const col=avCol(s.name||s.ref);const isSent=certifiedSet.has(g.group_code);
      return `<div class="sm-result" onclick="closeSearch();openGL('${g.group_code}')">
        <div class="sm-av" style="background:${col.bg};border-color:${col.text};color:${col.text}">${avInit(s.name||s.ref)}</div>
        <div style="flex:1;min-width:0"><div style="font-size:10px;color:var(--t)">${s.name||'—'}</div><div style="font-size:7.5px;color:var(--t3)">${s.ref} · ${g.group_code} · ${g.meta.label}</div></div>
        <span class="sm-pill ${isSent?'has-group':'no-group'}">${isSent?'✓ enviado':'pendente'}</span>
      </div>`;
    }
  }).join('');
}
function onKey(e){ if(e.key==='Escape')closeSearch(); }

// ═══════════════════════════════════════
// EXPORT
// ═══════════════════════════════════════
function exportCSV(){
  const groups=allGroups.filter(g=>g.branch===activeLoc);
  const rows=['Código,Filial,Nível,Dias,Bloco,Hora,Alunos,Enviado'];
  groups.forEach(g=>{
    rows.push(`${g.group_code},${activeLoc},${g.meta.label},"${g.pairLabel}",${g.block==='manha'?'Manhã':'Tarde'},${g.start_time||'—'},${g.students.length},${certifiedSet.has(g.group_code)?'sim':'não'}`);
  });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv;charset=utf-8;'}));
  a.download=`ALM-Confirmar-${activeLoc}-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();showToast('CSV exportado','ok');
}

// ═══════════════════════════════════════
// KEYBOARD
// ═══════════════════════════════════════
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(document.getElementById('search-overlay').classList.contains('open')){closeSearch();return;}
    if(document.getElementById('gl-overlay').classList.contains('open')){closeGL();return;}
  }
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();openSearch();}
});

// ═══════════════════════════════════════
// BOOT
// ═══════════════════════════════════════
loadCertified();
loadAll();
</script>
</body>
</html>
