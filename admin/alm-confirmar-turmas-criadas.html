<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ALM · Mapa de Confirmação</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9A84C;--gold2:#E8C97A;--gold3:rgba(201,168,76,.15);--gold4:rgba(201,168,76,.06);
  --green:#1DB87A;--green-a:rgba(29,184,122,.14);--green-b:rgba(29,184,122,.35);
  --red:#E8455A;--red-a:rgba(232,69,90,.12);--red-b:rgba(232,69,90,.3);
  --amber:#E8A020;--amber-a:rgba(232,160,32,.13);--amber-b:rgba(232,160,32,.3);
  --bg:#07060E;--bg2:#0E0B1A;--bg3:#141025;
  --b:rgba(201,168,76,.07);--b2:rgba(201,168,76,.16);--b3:rgba(201,168,76,.30);
  --t:rgba(238,218,168,.92);--t2:rgba(210,188,140,.52);--t3:rgba(210,188,140,.26);--t4:rgba(210,188,140,.10);
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',system-ui,sans-serif;--display:'Bebas Neue',sans-serif;
  --c-juv:#28C8B0;--c-ger:#C8A44A;--c-exa:#9B5ECA;--c-inf:#4A8FF5;
}
html,body{min-height:100vh;background:var(--bg);color:var(--t);font-family:var(--mono);font-size:12px;-webkit-font-smoothing:antialiased}

/* scan-line atmosphere */
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.03) 3px,rgba(0,0,0,.03) 4px);pointer-events:none;z-index:0}

/* ══ TOPBAR ══ */
.topbar{position:sticky;top:0;z-index:200;height:50px;display:flex;align-items:center;background:rgba(7,6,14,.98);border-bottom:1px solid var(--b2);backdrop-filter:blur(12px)}
.home-btn{display:flex;align-items:center;gap:7px;padding:0 16px;height:100%;border-right:1px solid var(--b);text-decoration:none;flex-shrink:0;transition:background .15s}
.home-btn:hover{background:var(--gold4)}
.home-icon{font-size:13px;color:var(--t3)}
.home-btn:hover .home-icon{color:var(--gold2)}
.home-label{font-size:7px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t4)}
.home-btn:hover .home-label{color:var(--gold)}
.brand{display:flex;align-items:center;padding:0 18px;height:100%;border-right:1px solid var(--b);flex-shrink:0;gap:10px}
.brand-alm{font-family:var(--display);font-size:22px;letter-spacing:6px;color:var(--gold2)}
.brand-page{font-size:8px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--t3)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;padding:0 16px;border-left:1px solid var(--b);height:100%}
.live{display:flex;align-items:center;gap:5px}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.live-lbl{font-size:7px;font-weight:700;letter-spacing:.1em;color:var(--green)}
.tb-pill{font-size:7px;font-weight:600;letter-spacing:.08em;padding:2px 9px;border:1px solid var(--b2);color:var(--t2)}
.tb-pill.gold{color:var(--gold2);border-color:var(--b3);background:var(--gold4)}
.tb-pill.ok{color:var(--green);border-color:var(--green-b)}
.tb-pill.loading{color:var(--amber);border-color:var(--amber-b)}
.tb-pill.err{color:var(--red);border-color:var(--red-b)}

/* ══ LOCATION STRIP ══ */
.loc-strip{position:sticky;top:50px;z-index:190;background:rgba(7,6,14,.97);border-bottom:1px solid var(--b2);padding:0 20px;display:flex;align-items:center;gap:0;backdrop-filter:blur(8px)}
.loc-btn{height:38px;padding:0 18px;border:none;border-right:1px solid var(--b);background:transparent;font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);cursor:pointer;transition:all .13s;position:relative}
.loc-btn:hover{background:var(--gold4);color:var(--t2)}
.loc-btn.active{background:rgba(201,168,76,.07);color:var(--gold2)}
.loc-btn.active::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--gold)}
.loc-stats{margin-left:auto;display:flex;gap:20px;padding:0 4px}
.loc-stat{display:flex;align-items:center;gap:6px}
.ls-dot{width:7px;height:7px;border-radius:1px}
.ls-n{font-size:9px;font-weight:700}
.ls-l{font-size:7px;color:var(--t3);letter-spacing:.06em}

/* ══ DEPT SECTIONS ══ */
.shell{padding:20px 20px 80px;position:relative;z-index:1}
.dept-section{margin-bottom:32px}
.dept-hdr{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.dept-bar{width:4px;height:22px;flex-shrink:0}
.dept-name{font-family:var(--display);font-size:26px;letter-spacing:4px}
.dept-count{font-size:8px;color:var(--t3);letter-spacing:.1em;margin-left:4px;align-self:flex-end;padding-bottom:3px}
.dept-line{flex:1;height:.5px;background:var(--b2)}

/* ══ BOX GRID ══ */
.box-grid{display:flex;flex-wrap:wrap;gap:8px}

/* ══ GROUP BOX ══ */
.gbox{
  width:148px;height:148px;
  background:var(--bg2);
  border:1px solid var(--b2);
  border-radius:3px;
  display:flex;flex-direction:column;
  position:relative;overflow:hidden;
  cursor:pointer;
  transition:transform .15s, border-color .15s, box-shadow .15s;
  flex-shrink:0;
}
.gbox:hover{transform:translateY(-2px);border-color:var(--b3);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.gbox.confirmed{border-color:var(--green-b)}
.gbox.proposed{border-color:var(--amber-b)}
.gbox.blocked{border-color:var(--red-b);opacity:.7}

/* status accent bar top */
.gbox::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;transition:background .2s}
.gbox.confirmed::before{background:var(--green)}
.gbox.proposed::before{background:var(--amber)}
.gbox.blocked::before{background:var(--red)}

/* inner layout */
.gbox-top{padding:10px 10px 4px;flex:1;display:flex;flex-direction:column;gap:3px}
.gbox-code{font-family:var(--display);font-size:34px;letter-spacing:3px;line-height:1;transition:color .15s}
.gbox.confirmed .gbox-code{color:var(--green)}
.gbox.proposed .gbox-code{color:var(--amber)}
.gbox.blocked .gbox-code{color:var(--red)}
.gbox-level{font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}
.gbox-days{font-size:9px;font-weight:600;color:var(--t2);margin-top:1px}
.gbox-block{font-size:7px;color:var(--t3);letter-spacing:.06em}

/* student count */
.gbox-count{position:absolute;top:10px;right:10px;font-family:var(--display);font-size:20px;line-height:1}
.gbox.confirmed .gbox-count{color:rgba(29,184,122,.5)}
.gbox.proposed .gbox-count{color:rgba(232,160,32,.4)}
.gbox.blocked .gbox-count{color:rgba(232,69,90,.3)}

/* tick */
.gbox-tick{position:absolute;bottom:34px;right:8px;font-size:18px;opacity:0;transition:opacity .2s}
.gbox.confirmed .gbox-tick{opacity:1}

/* bottom action bar — visible on hover */
.gbox-actions{position:absolute;bottom:0;left:0;right:0;height:32px;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);border-top:1px solid var(--b);display:flex;align-items:center;justify-content:space-around;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
.gbox:hover .gbox-actions{opacity:1;transform:translateY(0)}
.gbox-act{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:2px;font-size:12px;transition:background .12s;border:none;background:transparent;cursor:pointer;color:var(--t2)}
.gbox-act:hover{background:rgba(201,168,76,.12);color:var(--gold2)}
.gbox-act.confirm-btn{color:var(--green)}
.gbox-act.confirm-btn:hover{background:var(--green-a);color:var(--green)}

/* sinalizados mini badge */
.gbox-sinal{position:absolute;top:9px;left:50%;transform:translateX(-50%);font-size:6px;font-weight:700;letter-spacing:.06em;padding:1px 5px;background:var(--red-a);border:1px solid var(--red-b);color:var(--red);white-space:nowrap;opacity:0;transition:opacity .15s}
.gbox:hover .gbox-sinal{opacity:1}

/* ══ LEVEL LABEL ══ */
.level-label{width:100%;font-size:7.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--t4);padding:2px 0 6px;display:flex;align-items:center;gap:8px}
.level-label::after{content:'';flex:1;height:.5px;background:var(--b)}
.level-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:flex-start}

/* ══ EMPTY / SPINNER ══ */
.spinner-wrap{display:flex;align-items:center;justify-content:center;padding:80px;color:var(--t3);gap:10px;font-size:9px;letter-spacing:.1em}
.spinner{width:16px;height:16px;border:1.5px solid var(--b2);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══ MODAL / DOSSIER LIGHT ══ */
.modal-overlay{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.6);backdrop-filter:blur(16px);align-items:center;justify-content:center}
.modal-overlay.open{display:flex;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:min(480px,95vw);max-height:85dvh;background:var(--bg2);border:1px solid var(--b2);border-top:3px solid var(--gold);display:flex;flex-direction:column;overflow:hidden;animation:slideUp .22s ease}
@keyframes slideUp{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal-hdr{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--b)}
.modal-code{font-family:var(--display);font-size:32px;letter-spacing:4px;line-height:1}
.modal-close{margin-left:auto;font-size:14px;cursor:pointer;color:var(--t3);transition:color .12s;background:none;border:none;padding:4px 8px}
.modal-close:hover{color:var(--red)}
.modal-body{flex:1;overflow-y:auto;padding:16px 18px;scrollbar-width:thin;scrollbar-color:var(--b) transparent}
.modal-row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:.5px solid rgba(201,168,76,.04);font-size:10px}
.modal-row:last-child{border-bottom:none}
.modal-key{color:var(--t3);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase}
.modal-val{color:var(--t);font-weight:500}
.modal-student{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:.5px solid rgba(201,168,76,.04)}
.modal-student:last-child{border-bottom:none}
.modal-av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;flex-shrink:0;border:1px solid}
.modal-sname{font-size:9px;color:var(--t);flex:1}
.modal-sref{font-size:7.5px;color:var(--t3)}
.modal-footer{padding:12px 18px;border-top:1px solid var(--b);display:flex;gap:8px}
.mf-btn{flex:1;padding:8px;border:1px solid;font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.08em;cursor:pointer;background:transparent;transition:all .13s;text-transform:uppercase}
.mf-confirm{border-color:var(--green-b);color:var(--green)}
.mf-confirm:hover{background:var(--green-a)}
.mf-send{border-color:var(--b2);color:var(--gold)}
.mf-send:hover{background:var(--gold3)}
.mf-cancel{border-color:var(--b);color:var(--t3)}
.mf-cancel:hover{border-color:var(--red-b);color:var(--red)}
.sec-label{font-size:7.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:12px 0 8px;display:flex;align-items:center;gap:8px}
.sec-label::after{content:'';flex:1;height:.5px;background:var(--b2)}

/* ══ TOAST ══ */
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(8px);padding:6px 20px;font-size:9px;font-weight:600;letter-spacing:.08em;opacity:0;transition:all .2s;z-index:9000;pointer-events:none;border:1px solid;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--green-a);border-color:var(--green-b);color:var(--green)}
.toast.warn{background:var(--amber-a);border-color:var(--amber-b);color:var(--amber)}
.toast.err{background:var(--red-a);border-color:var(--red-b);color:var(--red)}

/* ══ CONFIRM ANIMATION ══ */
@keyframes confirmPulse{
  0%{box-shadow:0 0 0 0 rgba(29,184,122,.6)}
  70%{box-shadow:0 0 0 12px rgba(29,184,122,0)}
  100%{box-shadow:0 0 0 0 rgba(29,184,122,0)}
}
.gbox.just-confirmed{animation:confirmPulse .6s ease}
</style>
</head>

</div>

<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════
   SUPABASE
══════════════════════════════════════════════════════ */
const SB  = 'https://oapygbeliocdvitbdjbq.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9hcHlnYmVsaW9jZHZpdGJkamJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NjQzNjAsImV4cCI6MjA5MjA0MDM2MH0.-9Uj9Bg3q8sIlqzfzw2Sc1JziaueeyYGNwep-qWhWWg';
const H   = {apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
const AY  = '2026/2027';

async function sbGet(table,qs){
  const r=await fetch(`${SB}/rest/v1/${table}?${qs}`,{headers:H});
  if(!r.ok)throw new Error(`${table}: HTTP ${r.status}`);
  return r.json();
}

/* ══ CONSTANTS ══ */
const BRANCH_LABELS={FUNCHAL:'Funchal',CAMARA_LOBOS:'C. Lobos',SANTA_CRUZ:'S. Cruz',MACHICO:'Machico',RIBEIRA_BRAVA:'R. Brava',CALHETA:'Calheta'};
const BRANCH_ORDER=['FUNCHAL','CAMARA_LOBOS','SANTA_CRUZ','MACHICO','RIBEIRA_BRAVA','CALHETA'];
const BRANCH_CODE={FUNCHAL:'FUN',CAMARA_LOBOS:'CLB',SANTA_CRUZ:'SCZ',MACHICO:'MAC',RIBEIRA_BRAVA:'RBR',CALHETA:'CAL'};

const LEVEL_MAP={
  'kids|A1':    {dept:'kids',    label:'PI-a1',color:'var(--c-inf)',order:1,max:60},
  'kids|A2':    {dept:'kids',    label:'PI-a2',color:'var(--c-inf)',order:2,max:60},
  'kids|B1':    {dept:'kids',    label:'PI-a3',color:'var(--c-inf)',order:3,max:60},
  'kids|B2':    {dept:'kids',    label:'PI-a4',color:'var(--c-inf)',order:4,max:60},
  'kids_juv|A1':{dept:'kids_juv',label:'PJ1',  color:'var(--c-juv)',order:5,max:90},

  'kids_juv|B1':{dept:'kids_juv',label:'PJ3',  color:'var(--c-juv)',order:7,max:90},
  'adults|A1':  {dept:'adults',  label:'1st',  color:'var(--c-ger)',order:8,max:200},
  'adults|A2':  {dept:'adults',  label:'2nd',  color:'var(--c-ger)',order:9,max:200},

  'adults|C2':  {dept:'adults',  label:'5th+', color:'var(--c-ger)',order:13,max:200},
  'exam|B2':    {dept:'exam',    label:'6th B2',color:'var(--c-exa)',order:13,max:60},
  'exam|C1':    {dept:'exam',    label:'7th C1',color:'var(--c-exa)',order:14,max:60},
  'exam|C2':    {dept:'exam',    label:'8th C2',color:'var(--c-exa)',order:15,max:60},
};
const DEPT_CONFIG={
  kids:    {label:'Infantil',color:'var(--c-inf)'},
  kids_juv:{label:'Juvenil', color:'var(--c-juv)'},
  adults:  {label:'Geral',   color:'var(--c-ger)'},
  exam:    {label:'Exames',  color:'var(--c-exa)'},
};
const DEPT_ORDER=['kids','kids_juv','adults','exam'];
const DAYS_PT=['SEG','TER','QUA','QUI','SEX','SÁB'];
const DAY_EN_TO_IDX={
  monday:0,tuesday:1,wednesday:2,thursday:3,friday:4,saturday:5,
  segunda:0,terca:1,terça:1,quarta:2,quinta:3,sexta:4,sabado:5,sábado:5,
  mon:0,tue:1,wed:2,thu:3,fri:4,sat:5,seg:0,ter:1,qua:2,qui:3,sex:4,sab:5,'sáb':5
};
const ALM_PAIRS=[
  {a:0,b:2,aLbl:'SEG',bLbl:'QUA',code:'SW'},
  {a:1,b:3,aLbl:'TER',bLbl:'QUI',code:'TQ'},
  {a:2,b:4,aLbl:'QUA',bLbl:'SEX',code:'QX'},
  {a:5,b:5,aLbl:'SÁB',bLbl:'SÁB',code:'SS',examOnly:true},
];
const MIN_GROUP=5,MAX_GROUP=17;

/* ══ STATE ══ */
let allEnrolments=[],allRequests=[],reqByRef={};
let activeLoc='all';
// confirmed state persisted in localStorage
function getConfirmed(){try{return JSON.parse(localStorage.getItem('alm-confirmed-groups')||'{}')}catch{return{}}}
function saveConfirmed(obj){localStorage.setItem('alm-confirmed-groups',JSON.stringify(obj))}

// sequential codes per branch
let branchCounters={};
function nextCode(branch){
  if(!branchCounters[branch])branchCounters[branch]=0;
  branchCounters[branch]++;
  return String(branchCounters[branch]).padStart(2,'0');
}
function resetCounters(){branchCounters={}}

/* ══ HELPERS ══ */
function normBranch(b){return(b||'').toUpperCase().replace(/[\s\-]+/g,'_').trim()}
function normStatus(s){return(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()}
function levelKey(e){return`${(e.family||'').toLowerCase()}|${(e.level_cefr||'').toUpperCase()}`}
function getLevelMeta(e){return LEVEL_MAP[levelKey(e)]||{dept:'unknown',label:`${e.family||'?'}·${e.level_cefr||'?'}`,color:'var(--t3)',order:99,max:60}}
function parseDayPrefs(raw){if(!raw)return[];if(Array.isArray(raw))return raw;try{const p=JSON.parse(raw);return Array.isArray(p)?p:[]}catch{return[]}}
function parseHour(t){if(t==null)return null;const h=parseInt((t+'').split(':')[0],10);return isNaN(h)?null:h}
function classifyBlock(s){const h=parseHour(s);if(h===null)return null;if(h>=8&&h<=11)return'manha';if(h>=14&&h<=20)return'tarde';return null}
function normDay(str){
  if(str==null)return null;
  // numeric: 1=SEG … 6=SÁB (1-based from DB)
  const n=parseInt(str);
  if(!isNaN(n)&&n>=1&&n<=6)return n-1;
  // string fallback
  return DAY_EN_TO_IDX[(str+'').toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'')]??null;
}
function analysePrefs(ref){
  const req=reqByRef[ref];if(!req)return null;
  const raw=parseDayPrefs(req.day_preferences);
  const slots=raw.map(p=>({dayIdx:normDay(p.day||p.weekday||p.dia||''),block:classifyBlock(p.session_start||p.start_time||''),hour:parseHour(p.session_start||p.start_time||''),raw:p})).filter(s=>s.dayIdx!==null);
  const dayList=slots.map(s=>s.dayIdx);
  const sameDay=dayList.length>=2&&new Set(dayList).size<dayList.length;
  const validSlots=slots.filter(s=>s.block!==null);
  return{prefs:slots,sameDay,validSlots,dayIdxs:[...new Set(slots.map(s=>s.dayIdx))]};
}
function avCol(name){
  let h=0;for(let i=0;i<(name||'?').length;i++)h=(h*31+(name||'?').charCodeAt(i))&0xffffffff;
  const p=[{bg:'#3A2244',text:'#C8A0E0'},{bg:'#1E2E50',text:'#7AABEE'},{bg:'#1A3A2A',text:'#5EC888'},{bg:'#3A2A14',text:'#D4944A'},{bg:'#3A1A1A',text:'#E07878'},{bg:'#282838',text:'#9898D8'}];
  return p[Math.abs(h)%p.length];
}

/* ══ GROUPING ENGINE (same logic as Overview) ══ */
function buildGroups(lk,branch){
  const all=allEnrolments.filter(e=>{
    if(levelKey(e)!==lk)return false;
    if(branch!=='all'&&normBranch(e.branch)!==branch)return false;
    return true;
  });
  const withReq=all.filter(e=>!!reqByRef[e.ref]);
  const dept=(LEVEL_MAP[lk]||{}).dept||'adults';
  const placed=new Set(),groups=[];
  const sameDayBucket=withReq.filter(e=>{const a=analysePrefs(e.ref);return a&&a.sameDay});
  sameDayBucket.forEach(e=>placed.add(e.ref));
  const invalidBucket=withReq.filter(e=>{if(placed.has(e.ref))return false;const a=analysePrefs(e.ref);return a&&a.validSlots.length===0});
  invalidBucket.forEach(e=>placed.add(e.ref));
  const eligible=withReq.filter(e=>!placed.has(e.ref));

  ALM_PAIRS.forEach(pair=>{
    if(pair.examOnly&&dept!=='exam')return;
    ['manha','tarde'].forEach(block=>{
      const forPair=eligible.filter(e=>{
        if(placed.has(e.ref))return false;
        const a=analysePrefs(e.ref);if(!a)return false;
        if(pair.a===pair.b)return a.validSlots.filter(s=>s.dayIdx===pair.a&&s.block===block).length>=2;
        return a.validSlots.some(s=>s.dayIdx===pair.a&&s.block===block)&&a.validSlots.some(s=>s.dayIdx===pair.b&&s.block===block);
      });
      if(forPair.length<MIN_GROUP)return;
      let rem=[...forPair];
      while(rem.length>=MIN_GROUP){
        const chunk=rem.slice(0,MAX_GROUP);rem=rem.slice(MAX_GROUP);
        chunk.forEach(e=>placed.add(e.ref));
        groups.push({pair,block,students:chunk,lk,branch});
      }
    });
  });

  const sinalizados=[...sameDayBucket,...invalidBucket,...eligible.filter(e=>!placed.has(e.ref))];
  return{groups,sinalizados,total:all.length,withReq:withReq.length};
}

/* ══ LOAD ══ */
async function loadAll(){
  const pill=document.getElementById('pill-status');
  try{
    const[enrol,reqs]=await Promise.all([
      sbGet('enrolments',`select=ref,name,branch,lang,family,level_cefr&academic_year=eq.${encodeURIComponent(AY)}&limit=2000`),
      sbGet('timetable_requests',`select=ref,student_name,branch,family,level_cefr,day_preferences,status,sessions_per_week&academic_year=eq.${encodeURIComponent(AY)}&limit=2000`)
    ]);
    allEnrolments=enrol||[];allRequests=reqs||[];reqByRef={};
    allRequests.forEach(r=>{reqByRef[r.ref]=r});
    pill.textContent=`Supabase · ${allRequests.length} pedidos`;pill.className='tb-pill ok';
    renderMap();
    showToast(`${allEnrolments.length} inscritos · ${allRequests.length} pedidos`,'ok');
  }catch(e){
    pill.textContent='Erro';pill.className='tb-pill err';
    document.getElementById('shell').innerHTML=`<div class="spinner-wrap" style="color:var(--red)">Erro: ${e.message}</div>`;
  }
}

/* ══ RENDER MAP ══ */
function setLoc(btn){
  activeLoc=btn.dataset.loc;
  document.querySelectorAll('.loc-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderMap();
}

function renderMap(){
  resetCounters();
  const confirmed=getConfirmed();
  const shell=document.getElementById('shell');

  // Collect all level keys present
  const students=activeLoc==='all'?allEnrolments:allEnrolments.filter(e=>normBranch(e.branch)===activeLoc);
  if(!students.length){shell.innerHTML='<div class="spinner-wrap">Sem inscrições para esta filial.</div>';return;}

  // Build tree: dept → level → branch → groups
  const tree={};
  const levelKeys=[...new Set(students.map(e=>levelKey(e)))];
  levelKeys.forEach(lk=>{
    const meta=LEVEL_MAP[lk];if(!meta)return;
    const dk=meta.dept;
    if(!tree[dk])tree[dk]={};
    if(!tree[dk][lk])tree[dk][lk]=[];
    // which branches for this level?
    const branches=activeLoc==='all'
      ?[...new Set(students.filter(e=>levelKey(e)===lk).map(e=>normBranch(e.branch)))]
      :[activeLoc];
    branches.forEach(br=>{
      const result=buildGroups(lk,br);
      result.groups.forEach(g=>{
        // generate a stable box id
        const boxId=`${br}-${lk}-${g.pair.code}-${g.block}-${tree[dk][lk].length}`;
        const brCode=BRANCH_CODE[br]||br.slice(0,3);
        const code=`${brCode}-${nextCode(br)}`;
        const isConfirmed=!!confirmed[boxId];
        const status=isConfirmed?'confirmed':'proposed';
        tree[dk][lk].push({boxId,code,pair:g.pair,block:g.block,students:g.students,status,br,lk,sinalizados:result.sinalizados.length});
      });
    });
  });

  // Count totals
  let totalGroups=0,totalConfirmed=0,totalProposed=0,totalBlocked=0;
  Object.values(tree).forEach(levels=>Object.values(levels).forEach(boxes=>{
    boxes.forEach(b=>{totalGroups++;if(b.status==='confirmed')totalConfirmed++;else totalProposed++;});
  }));

  // Update stats
  document.getElementById('pill-total').textContent=`${totalGroups} grupos`;
  document.getElementById('pill-confirmed').textContent=`${totalConfirmed} confirmados`;
  document.getElementById('stat-confirmed').textContent=totalConfirmed;
  document.getElementById('stat-proposed').textContent=totalProposed;
  document.getElementById('stat-blocked').textContent=totalBlocked;

  let html='';
  DEPT_ORDER.forEach(dk=>{
    if(!tree[dk])return;
    const dc=DEPT_CONFIG[dk];
    const sortedLks=Object.keys(tree[dk]).sort((a,b)=>(LEVEL_MAP[a]?.order||99)-(LEVEL_MAP[b]?.order||99));
    html+=`<div class="dept-section">
      <div class="dept-hdr">
        <div class="dept-bar" style="background:${dc.color}"></div>
        <div class="dept-name" style="color:${dc.color}">${dc.label.toUpperCase()}</div>
        <div class="dept-count">${Object.values(tree[dk]).flat().length} grupos</div>
        <div class="dept-line"></div>
      </div>`;

    sortedLks.forEach(lk=>{
      const boxes=tree[dk][lk];
      if(!boxes.length)return;
      const meta=LEVEL_MAP[lk];
      html+=`<div class="level-row">
        <div class="level-label" style="color:${meta.color};opacity:.8;width:100%">${meta.label} · ${boxes.length} grupo${boxes.length!==1?'s':''}</div>`;
      boxes.forEach(box=>{
        const blockLbl=box.block==='manha'?'Manhã':'Tarde';
        const n=box.students.length;
        const tickHtml=box.status==='confirmed'?'<div class="gbox-tick">✓</div>':'';
        const sinalHtml=box.sinalizados>0?`<div class="gbox-sinal">⚠ ${box.sinalizados} sinal.</div>`:'';
        html+=`<div class="gbox ${box.status}" id="box-${box.boxId}" onclick="openModal('${box.boxId}')">
          ${sinalHtml}
          <div class="gbox-top">
            <div class="gbox-code">${box.code}</div>
            <div class="gbox-level">${meta.label}</div>
            <div class="gbox-days">${box.pair.aLbl} + ${box.pair.bLbl}</div>
            <div class="gbox-block">${blockLbl} · ${BRANCH_LABELS[box.br]||box.br}</div>
          </div>
          <div class="gbox-count">${n}</div>
          ${tickHtml}
          <div class="gbox-actions">
            <button class="gbox-act confirm-btn" title="Confirmar" onclick="event.stopPropagation();quickConfirm('${box.boxId}')">✓</button>
            <button class="gbox-act" title="Ver alunos" onclick="event.stopPropagation();openModal('${box.boxId}')">👥</button>
            <button class="gbox-act" title="Enviar aviso" onclick="event.stopPropagation();sendNotice('${box.boxId}')">✉</button>
          </div>
        </div>`;
      });
      html+=`</div>`;
    });
    html+=`</div>`;
  });

  shell.innerHTML=html||'<div class="spinner-wrap">Nenhum grupo gerado.</div>';

  // store box data for modal
  _boxData={};
  DEPT_ORDER.forEach(dk=>{if(!tree[dk])return;Object.values(tree[dk]).forEach(boxes=>boxes.forEach(b=>{_boxData[b.boxId]=b}))});
}

/* ══ BOX DATA STORE ══ */
let _boxData={};

/* ══ QUICK CONFIRM ══ */
async function quickConfirm(boxId){
  const confirmed=getConfirmed();
  if(confirmed[boxId]){showToast('Já confirmado','warn');return;}
  const box=_boxData[boxId];
  if(!box){showToast('Grupo não encontrado','err');return;}

  // Optimistic UI update immediately
  confirmed[boxId]=new Date().toISOString();
  saveConfirmed(confirmed);
  const el=document.getElementById(`box-${boxId}`);
  if(el){
    el.classList.remove('proposed','blocked');
    el.classList.add('confirmed','just-confirmed');
    if(!el.querySelector('.gbox-tick')){const t=document.createElement('div');t.className='gbox-tick';t.textContent='✓';el.appendChild(t);}
    else el.querySelector('.gbox-tick').style.opacity='1';
    setTimeout(()=>el.classList.remove('just-confirmed'),700);
  }
  updateStats();
  showToast(`${box.code} a confirmar…`,'ok');

  // Write assigned_turma to Supabase for every student in the group
  const refs=box.students.map(e=>e.ref).filter(Boolean);
  if(refs.length){
    try{
      // Supabase REST: PATCH where ref=in.(...)
      const inList=refs.map(r=>`"${r}"`).join(',');
      const r=await fetch(
        `${SB}/rest/v1/timetable_requests?ref=in.(${inList})&academic_year=eq.${encodeURIComponent(AY)}`,
        {method:'PATCH',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify({assigned_turma:box.code,status:'atribuido'})}
      );
      if(r.ok){
        showToast(`${box.code} confirmado · ${refs.length} alunos actualizados ✓`,'ok');
        // Update local reqByRef so status badges reflect immediately
        refs.forEach(ref=>{if(reqByRef[ref]){reqByRef[ref].assigned_turma=box.code;reqByRef[ref].status='atribuido';}});
      } else {
        const err=await r.text();
        showToast(`Guardado localmente · erro Supabase: ${r.status}`,'warn');
        console.warn('Supabase PATCH error:',err);
      }
    }catch(e){
      showToast(`Guardado localmente · sem ligação`,'warn');
      console.warn('Network error:',e);
    }
  }
}

function updateStats(){
  const confirmed=getConfirmed();
  const all=Object.keys(_boxData);
  const n=all.filter(id=>confirmed[id]).length;
  const p=all.filter(id=>!confirmed[id]).length;
  document.getElementById('pill-confirmed').textContent=`${n} confirmados`;
  document.getElementById('stat-confirmed').textContent=n;
  document.getElementById('stat-proposed').textContent=p;
}

/* ══ MODAL ══ */
let _activeBoxId=null;
function openModal(boxId){
  _activeBoxId=boxId;
  const box=_boxData[boxId];if(!box)return;
  const confirmed=getConfirmed();
  const isConf=!!confirmed[boxId];
  const meta=LEVEL_MAP[box.lk]||{};
  const blockLbl=box.block==='manha'?'Manhã · 08–11h':'Tarde · 14–20h';

  document.getElementById('m-code').textContent=box.code;
  document.getElementById('m-code').style.color=isConf?'var(--green)':'var(--amber)';
  document.getElementById('m-sub').textContent=`${meta.label||box.lk} · ${box.pair.aLbl} + ${box.pair.bLbl} · ${blockLbl} · ${BRANCH_LABELS[box.br]||box.br}`;

  const confirmBtn=document.getElementById('m-confirm-btn');
  if(isConf){confirmBtn.textContent='✓ Confirmado';confirmBtn.style.opacity='.5';confirmBtn.disabled=true;}
  else{confirmBtn.textContent='✓ Confirmar turma';confirmBtn.style.opacity='1';confirmBtn.disabled=false;}

  let body=`
    <div class="modal-row"><span class="modal-key">Código</span><span class="modal-val" style="font-family:var(--display);font-size:18px;color:${isConf?'var(--green)':'var(--amber)'}">${box.code}</span></div>
    <div class="modal-row"><span class="modal-key">Nível</span><span class="modal-val">${meta.label||box.lk}</span></div>
    <div class="modal-row"><span class="modal-key">Dias</span><span class="modal-val">${box.pair.aLbl} + ${box.pair.bLbl}</span></div>
    <div class="modal-row"><span class="modal-key">Bloco</span><span class="modal-val">${blockLbl}</span></div>
    <div class="modal-row"><span class="modal-key">Filial</span><span class="modal-val">${BRANCH_LABELS[box.br]||box.br}</span></div>
    <div class="modal-row"><span class="modal-key">Alunos</span><span class="modal-val" style="color:var(--green);font-weight:700">${box.students.length}</span></div>
    <div class="modal-row"><span class="modal-key">Estado</span><span class="modal-val" style="color:${isConf?'var(--green)':'var(--amber)'}">${isConf?'✓ Confirmado':'Proposto'}</span></div>
    <div class="sec-label" style="margin-top:14px">Alunos</div>`;

  box.students.sort((a,b)=>(a.name||'').localeCompare(b.name||'')).forEach(e=>{
    const col=avCol(e.name||e.ref);
    const initials=(e.name||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
    const req=reqByRef[e.ref];
    const st=req?normStatus(req.status):'sem_pedido';
    const stCol=st==='atribuido'?'var(--green)':st==='sem_pedido'?'var(--red)':'var(--amber)';
    const stTxt=st==='atribuido'?'atribuído':st==='sem_pedido'?'sem pedido':'pendente';
    body+=`<div class="modal-student">
      <div class="modal-av" style="background:${col.bg};border-color:${col.text}55;color:${col.text}">${initials}</div>
      <div style="flex:1;min-width:0">
        <div class="modal-sname">${e.name||'—'}</div>
        <div class="modal-sref">${e.ref||'—'}</div>
      </div>
      <span style="font-size:7.5px;font-weight:700;color:${stCol}">${stTxt}</span>
    </div>`;
  });

  document.getElementById('m-body').innerHTML=body;
  document.getElementById('modal').classList.add('open');
}

function closeModal(){
  document.getElementById('modal').classList.remove('open');
  _activeBoxId=null;
}

async function modalConfirm(){
  if(!_activeBoxId)return;
  await quickConfirm(_activeBoxId);
  // update modal header to confirmed state
  document.getElementById('m-code').style.color='var(--green)';
  const confirmBtn=document.getElementById('m-confirm-btn');
  confirmBtn.textContent='✓ Confirmado';confirmBtn.style.opacity='.5';confirmBtn.disabled=true;
}

function modalSend(){
  if(!_activeBoxId)return;
  const box=_boxData[_activeBoxId];
  showToast(`Aviso para ${box?.students?.length||0} alunos — em breve`,'warn');
}

function sendNotice(boxId){
  const box=_boxData[boxId];
  showToast(`Aviso para ${box?.students?.length||0} alunos — em breve`,'warn');
}

/* ══ TOAST ══ */
let _toastT;
function showToast(msg,type='ok'){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className=`toast ${type} show`;
  clearTimeout(_toastT);_toastT=setTimeout(()=>el.classList.remove('show'),2800);
}

/* ══ ESC TO CLOSE ══ */
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ══ BOOT ══ */
loadAll();
</script>
