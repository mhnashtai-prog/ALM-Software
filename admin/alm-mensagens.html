<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ALM · Mensagens & Pedidos</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9A84C;--gold2:#E8C97A;--gold3:rgba(201,168,76,.18);--gold4:rgba(201,168,76,.08);
  --green:#1DB87A;--green-a:rgba(29,184,122,.16);--green-b:rgba(29,184,122,.38);--green-c:rgba(29,184,122,.07);
  --red:#E8455A;--red-a:rgba(232,69,90,.13);--red-b:rgba(232,69,90,.32);
  --amber:#E8A020;--amber-a:rgba(232,160,32,.14);--amber-b:rgba(232,160,32,.32);
  --teal:#28C8B0;--blue:#4A8FF5;--purple:#9B5ECA;
  --bg:#07060E;--bg2:#0E0C1A;--bg3:#161325;--bg4:#1C1930;
  --b:rgba(201,168,76,.09);--b2:rgba(201,168,76,.18);--b3:rgba(201,168,76,.32);
  --t:rgba(240,222,175,.94);--t2:rgba(215,193,145,.65);--t3:rgba(215,193,145,.38);--t4:rgba(215,193,145,.14);
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',system-ui,sans-serif;--display:'Bebas Neue',sans-serif;
  --c-inf:#4A8FF5;--c-juv:#2ECC8A;--c-ger:#C8943A;--c-exa:#A060D8;
}
html,body{height:100%;background:var(--bg);color:var(--t);font-family:var(--mono);font-size:12px;-webkit-font-smoothing:antialiased;overflow:hidden}
body{display:flex;flex-direction:column}
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.06) transparent}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes pulse-ring{0%,100%{box-shadow:0 0 0 0 rgba(232,69,90,.4)}50%{box-shadow:0 0 0 4px rgba(232,69,90,.0)}}
.topbar{flex-shrink:0;height:50px;display:flex;align-items:center;background:rgba(7,6,14,.99);border-bottom:1px solid var(--b2);z-index:200}
.nav-duo{display:flex;flex-direction:column;height:100%;border-right:1px solid var(--b2);flex-shrink:0;min-width:54px}
.nav-home{display:flex;align-items:center;justify-content:center;flex:1;padding:0 14px;text-decoration:none;transition:background .14s;border-bottom:.5px solid var(--b)}
.nav-home:hover{background:var(--gold4)}
.nav-back{display:flex;align-items:center;justify-content:center;gap:4px;flex:1;padding:0 10px;text-decoration:none;transition:background .14s}
.nav-back:hover{background:var(--gold4)}
.nav-home-icon{font-size:15px;color:var(--t2)}
.nav-back-arrow{font-size:9px;color:var(--t3)}
.nav-back-label{font-size:7px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}
.brand{display:flex;align-items:center;padding:0 18px;height:100%;border-right:1px solid var(--b);flex-shrink:0}
.brand-alm{font-size:18px;font-weight:700;letter-spacing:8px;color:var(--gold2);font-family:var(--display)}
.brand-yr{font-size:8px;color:var(--t2);letter-spacing:.14em;margin-left:8px;align-self:flex-end;padding-bottom:3px}
.topbar-mid{flex:1;display:flex;align-items:center;padding:0 16px;gap:8px}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:blink 2s infinite}
.live-lbl{font-size:8px;font-weight:700;letter-spacing:.1em;color:var(--green)}
.tb-chip{font-size:8px;font-weight:700;letter-spacing:.08em;padding:3px 10px;border:1px solid var(--b2);border-radius:2px;color:var(--t2)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:6px;padding:0 12px;border-left:1px solid var(--b);height:100%;flex-shrink:0}
.tb-pill{font-size:8px;font-weight:700;letter-spacing:.06em;padding:4px 11px;border:1px solid;border-radius:2px;white-space:nowrap}
.tb-pill.warn{color:var(--amber);border-color:var(--amber-b);background:var(--amber-a)}
.tb-pill.ok{color:var(--green);border-color:var(--green-b);background:var(--green-c)}
.tb-pill.red{color:var(--red);border-color:var(--red-b);background:var(--red-a);animation:blink 1.8s infinite}
.tb-pill.neutral{color:var(--t2);border-color:var(--b2);background:rgba(255,255,255,.02)}
.tb-btn{padding:4px 11px;border:1px solid var(--green-b);font-family:var(--mono);font-size:8px;font-weight:700;cursor:pointer;background:transparent;color:var(--green);border-radius:2px;transition:all .12s}
.tb-btn:hover{background:var(--green-a)}
.tb-clock{font-size:10px;color:var(--t3);letter-spacing:.04em;min-width:56px;text-align:right}
.spinner{width:12px;height:12px;border:1.5px solid rgba(255,255,255,.08);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;flex-shrink:0}
.layout{flex:1;display:flex;overflow:hidden}
.left{width:290px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--b2);display:flex;flex-direction:column;overflow:hidden}
.left-header{flex-shrink:0;padding:10px 12px;border-bottom:.5px solid var(--b);background:rgba(0,0,0,.2)}
.lh-title{font-size:8px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.filter-pills{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:0}
.fp{padding:3px 9px;border-radius:2px;border:.5px solid var(--b);font-size:7.5px;font-weight:700;cursor:pointer;color:var(--t3);transition:all .12s;letter-spacing:.04em;font-family:var(--mono)}
.fp:hover{color:var(--t2);border-color:var(--b2)}
.fp.active{background:var(--gold4);border-color:var(--b3);color:var(--gold2)}
.search-row{padding:8px 12px;border-bottom:.5px solid var(--b)}
.search-inp{width:100%;padding:5px 9px;background:rgba(255,255,255,.03);border:.5px solid var(--b2);border-radius:3px;font-family:var(--mono);font-size:10px;color:var(--t);outline:none;transition:border-color .12s}
.search-inp::placeholder{color:var(--t3)}.search-inp:focus{border-color:var(--gold)}
.teacher-list{flex:1;overflow-y:auto}
.t-row{display:flex;align-items:center;gap:9px;padding:9px 12px;cursor:pointer;border-bottom:.5px solid rgba(255,255,255,.03);border-left:3px solid transparent;transition:all .12s}
.t-row:hover{background:rgba(255,255,255,.025)}
.t-row.active{background:var(--gold4);border-left-color:var(--gold)}
.t-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;border:1px solid;box-shadow:inset 0 0 0 99px rgba(0,0,0,.35)}
.t-info{flex:1;min-width:0}
.t-name{font-size:11px;font-weight:500;color:var(--t);line-height:1}
.t-meta{font-size:8px;color:var(--t3);margin-top:2px}
.t-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.t-dot.ok{background:var(--green)}.t-dot.warn{background:var(--amber);animation:blink 2s infinite}
.t-dot.miss{background:var(--red);animation:pulse-ring 1.5s infinite}.t-dot.grey{background:rgba(255,255,255,.12)}
.t-badges{display:flex;gap:2px;flex-wrap:wrap;margin-top:3px}
.t-badge{font-size:6.5px;font-weight:700;padding:1px 5px;border-radius:2px;border:.5px solid}
.tb-msg{background:rgba(74,143,245,.12);border-color:rgba(74,143,245,.3);color:var(--blue)}
.tb-foto{background:var(--amber-a);border-color:var(--amber-b);color:var(--amber)}
.tb-miss{background:rgba(232,69,90,.08);border-color:rgba(232,69,90,.2);color:rgba(232,100,110,.7)}
.tb-pres{background:var(--green-c);border-color:var(--green-b);color:var(--green)}
.right{flex:1;display:flex;flex-direction:column;overflow:hidden}
.no-teacher{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:10px;color:var(--t3)}
.no-teacher-icon{font-size:32px;opacity:.2}
.no-teacher-txt{font-size:9px;letter-spacing:.12em;text-transform:uppercase;opacity:.4}
.teacher-view{display:none;flex-direction:column;height:100%;overflow:hidden;animation:fadeIn .18s ease}
.teacher-view.active{display:flex}
.t-hero{flex-shrink:0;min-height:90px;display:flex;align-items:flex-end;padding:0 18px 0 0;position:relative;overflow:hidden}
.t-hero-bg{position:absolute;inset:0;transition:background .3s}
.t-hero-scrim{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.05),rgba(0,0,0,.72))}
.t-hero-av{position:relative;z-index:5;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0;border:2px solid;box-shadow:inset 0 0 0 99px rgba(0,0,0,.35),0 4px 20px rgba(0,0,0,.6);margin:12px 14px 12px 18px}
.t-hero-info{position:relative;z-index:5;flex:1;padding:14px 0 12px}
.t-hero-name{font-family:var(--display);font-size:24px;letter-spacing:4px;color:#fff;line-height:1}
.t-hero-meta{font-size:9px;color:rgba(255,255,255,.5);margin-top:4px}
.t-hero-stats{position:relative;z-index:5;display:flex;gap:0;flex-shrink:0;padding:14px 0 12px}
.ths{text-align:center;padding:0 14px;border-right:.5px solid rgba(255,255,255,.1)}
.ths:last-child{border-right:none}
.ths-v{font-family:var(--display);font-size:26px;color:#fff;line-height:1;letter-spacing:1px}
.ths-l{font-size:7px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.1em;margin-top:2px}
.view-tabs{flex-shrink:0;display:flex;border-bottom:.5px solid var(--b);background:rgba(0,0,0,.15);overflow-x:auto}
.vt-tab{padding:8px 14px;font-size:8.5px;font-weight:700;cursor:pointer;color:var(--t3);border-bottom:2px solid transparent;margin-bottom:-.5px;white-space:nowrap;font-family:var(--mono);display:flex;align-items:center;gap:5px;transition:all .15s;background:none;border-top:none;border-left:none;border-right:none;letter-spacing:.06em}
.vt-tab:hover{color:var(--t2)}.vt-tab.active{color:var(--gold2);border-bottom-color:var(--gold)}
.vt-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.view-body{flex:1;overflow-y:auto;padding:14px 18px 40px}
.sec-title{font-size:8px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sec-title::after{content:'';flex:1;height:.5px;background:var(--b2)}
.empty{padding:24px;text-align:center;font-size:9px;color:var(--t3);letter-spacing:.08em;text-transform:uppercase;opacity:.5}
.classes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-bottom:20px}
.class-card{background:var(--bg3);border:.5px solid var(--b2);border-radius:8px;overflow:hidden;transition:all .18s;position:relative}
.class-card:hover{border-color:var(--b3);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.class-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.class-card.dept-adults::before{background:linear-gradient(90deg,#C8943A,#8A5A10)}
.class-card.dept-exam::before{background:linear-gradient(90deg,#A060D8,#6A28A8)}
.class-card.dept-kids_juv::before{background:linear-gradient(90deg,#2ECC8A,#0D8A5A)}
.class-card.dept-kids::before{background:linear-gradient(90deg,#4A8FF5,#1A5FAA)}
.cc-top{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px}
.cc-code{font-family:var(--display);font-size:20px;letter-spacing:3px;line-height:1}
.cc-status{display:flex;align-items:center;gap:5px}
.cc-sdot{width:7px;height:7px;border-radius:50%}
.cc-sdot.ok{background:var(--green)}.cc-sdot.miss{background:var(--red);animation:blink 1.5s infinite}.cc-sdot.none{background:rgba(255,255,255,.15)}
.cc-stxt{font-size:7.5px;font-weight:700;letter-spacing:.06em}
.cc-stxt.ok{color:var(--green)}.cc-stxt.miss{color:var(--red)}.cc-stxt.none{color:var(--t3)}
.cc-mid{padding:0 12px 8px}
.cc-time{font-size:12px;font-weight:600;color:var(--teal)}
.cc-level{font-size:8px;color:var(--t3);margin-top:2px}
.cc-lesson{font-size:9px;color:var(--gold2);margin-top:3px;font-weight:700}
.cc-foot{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;border-top:.5px solid rgba(255,255,255,.04);background:rgba(0,0,0,.2)}
.cc-stu{font-size:9px;color:var(--t2)}
.att-card{padding:12px 14px;background:rgba(255,255,255,.02);border:.5px solid var(--b);border-radius:4px;margin-bottom:10px}
.att-card-hdr{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.att-turma{font-family:var(--display);font-size:16px;letter-spacing:2px}
.att-lesson{font-size:9px;color:var(--teal);font-weight:700}
.att-time{font-size:9px;color:var(--t3)}
.att-status{font-size:8px;font-weight:700;padding:2px 8px;border-radius:2px;flex-shrink:0}
.att-status.ok{background:var(--green-c);border:.5px solid var(--green-b);color:var(--green)}
.att-status.miss{background:var(--red-a);border:.5px solid var(--red-b);color:var(--red)}
.att-bar-wrap{height:4px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden;margin-bottom:5px}
.att-bar-fill{height:100%;border-radius:2px;background:var(--green);transition:width .4s}
.att-detail{display:flex;justify-content:space-between;font-size:8.5px;color:var(--t3);margin-bottom:8px}
.att-detail strong{color:var(--t2)}
.stu-list{display:flex;flex-direction:column;gap:2px}
.stu-row{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:3px;background:rgba(255,255,255,.02);border:.5px solid rgba(255,255,255,.04)}
.stu-row.present{background:rgba(29,184,122,.07);border-color:rgba(29,184,122,.18)}
.stu-row.late{background:rgba(232,160,32,.06);border-color:rgba(232,160,32,.18)}
.stu-row.absent{background:rgba(232,69,90,.05);border-color:rgba(232,69,90,.14)}
.stu-av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;border:1px solid;box-shadow:inset 0 0 0 99px rgba(0,0,0,.35);flex-shrink:0}
.stu-name{flex:1;font-size:10px;color:var(--t)}
.stu-ref{font-size:7.5px;color:var(--t3)}
.stu-badge{font-size:7px;font-weight:700;padding:1px 6px;border-radius:2px;flex-shrink:0}
.stu-badge.present{background:var(--green-c);border:.5px solid var(--green-b);color:var(--green)}
.stu-badge.late{background:var(--amber-a);border:.5px solid var(--amber-b);color:var(--amber)}
.stu-badge.absent{background:var(--red-a);border:.5px solid var(--red-b);color:var(--red)}
.msg-card{padding:12px 14px;background:rgba(255,255,255,.02);border:.5px solid var(--b);border-radius:4px;margin-bottom:6px;border-left:3px solid;animation:fadeIn .15s ease}
.msg-card.mc-internal{border-left-color:var(--blue)}.msg-card.mc-parent{border-left-color:var(--purple)}
.msg-card.mc-foto{border-left-color:var(--amber)}.msg-card.mc-read{opacity:.45;border-left-color:var(--green)}
.mc-hdr{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.mc-type{font-size:7.5px;font-weight:700;padding:2px 7px;border-radius:2px;border:.5px solid;letter-spacing:.06em}
.mct-internal{background:rgba(74,143,245,.12);border-color:rgba(74,143,245,.3);color:var(--blue)}
.mct-parent{background:rgba(155,94,202,.12);border-color:rgba(155,94,202,.3);color:var(--purple)}
.mct-foto{background:var(--amber-a);border-color:var(--amber-b);color:var(--amber)}
.mct-read{background:var(--green-c);border-color:var(--green-b);color:var(--green)}
.mc-turma{font-size:8px;font-weight:700;padding:2px 7px;border-radius:2px;background:var(--gold4);border:.5px solid var(--b2);color:var(--gold2)}
.mc-lesson{font-size:8px;color:var(--teal)}
.mc-time{font-size:8px;color:var(--t3);margin-left:auto}
.mc-subject{font-size:11px;font-weight:600;color:var(--t);margin-bottom:4px}
.mc-body{font-size:10px;color:var(--t2);line-height:1.6;font-family:var(--sans);margin-bottom:6px}
.mc-actions{display:flex;gap:5px;margin-top:8px}
.mc-btn{padding:4px 12px;border-radius:2px;font-size:8.5px;font-weight:700;cursor:pointer;font-family:var(--mono);border:.5px solid;transition:all .12s;letter-spacing:.04em}
.mc-accept{background:var(--green-a);border-color:var(--green-b);color:var(--green)}.mc-accept:hover{background:rgba(29,184,122,.22)}
.mc-reject{background:var(--red-a);border-color:var(--red-b);color:var(--red)}.mc-reject:hover{background:rgba(232,69,90,.2)}
.mc-ghost{background:rgba(255,255,255,.04);border-color:var(--b2);color:var(--t3)}.mc-ghost:hover{color:var(--t2)}
.foto-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px}
.foto-field{padding:5px 8px;background:rgba(255,255,255,.02);border:.5px solid var(--b);border-radius:3px}
.foto-lbl{font-size:7px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:2px}
.foto-val{font-size:9.5px;color:var(--t2)}
.urg-badge{font-size:7.5px;font-weight:700;padding:2px 8px;border-radius:2px}
.urg-normal{background:var(--green-c);border:.5px solid var(--green-b);color:var(--green)}
.urg-urgent{background:var(--amber-a);border:.5px solid var(--amber-b);color:var(--amber)}
.urg-express{background:var(--red-a);border:.5px solid var(--red-b);color:var(--red)}
.sum-card{padding:12px 14px;background:rgba(255,255,255,.02);border:.5px solid var(--b);border-radius:4px;margin-bottom:8px}
.sc-meta{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.sc-date{font-size:9px;color:var(--t3)}
.sc-lesson{font-size:9px;color:var(--teal);font-weight:700}
.sc-skill{font-size:8px;font-weight:700;padding:2px 8px;border-radius:2px;background:rgba(155,94,202,.12);border:.5px solid rgba(155,94,202,.3);color:var(--purple)}
.sc-text{font-size:11px;color:var(--t);line-height:1.6;font-family:var(--sans);margin-bottom:6px}
.sc-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:5px}
.sc-field{padding:5px 8px;background:rgba(255,255,255,.02);border:.5px solid var(--b);border-radius:3px}
.sc-field-l{font-size:7px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:2px}
.sc-field-v{font-size:9.5px;color:var(--t2)}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(8px);padding:5px 16px;border-radius:2px;font-size:9px;font-weight:700;letter-spacing:.06em;opacity:0;transition:all .2s;z-index:9999;pointer-events:none;white-space:nowrap;border:.5px solid;font-family:var(--mono)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--green-a);border-color:var(--green-b);color:var(--green)}
.toast.warn{background:var(--amber-a);border-color:var(--amber-b);color:var(--amber)}
.toast.err{background:var(--red-a);border-color:var(--red-b);color:var(--red)}
.toast.info{background:var(--gold4);border-color:var(--b3);color:var(--gold2)}
.botbar{flex-shrink:0;height:26px;display:flex;align-items:center;gap:10px;padding:0 14px;background:rgba(7,6,14,.98);border-top:1px solid var(--b);font-size:7.5px;color:var(--t3)}
.bot-right{margin-left:auto}
</style>
</head>

async function sbGet(table,qs=''){
  let all=[],page=0,ps=1000;
  while(true){

async function sbPatch(table,qs,body){

/* ══ SHARED LESSON-NUMBER ENGINE (identical to Portal) ══ */
let AY='',YEAR_START='',YEAR_END='';
let HOLIDAYS=new Set(),BREAKS=[];
const DOW_MAP={SEG:1,TER:2,QUA:3,QUI:4,SEX:5,SAB:6,'SÁB':6,MON:1,TUE:2,WED:3,THU:4,FRI:5,SAT:6};

function isTeachingDay(iso){
  if(HOLIDAYS.has(iso))return false;
  return!BREAKS.some(([s,e])=>iso>=s&&iso<=e);
}
function buildDatesForDow(dowCode){
  if(!YEAR_START||!YEAR_END)return[];
  const target=DOW_MAP[(dowCode||'').toUpperCase().trim()];
  if(!target)return[];
  const dates=[],d=new Date(YEAR_START+'T12:00:00'),end=new Date(YEAR_END+'T12:00:00');
  while(d<=end){
    if(d.getDay()===target){const iso=d.toISOString().slice(0,10);if(isTeachingDay(iso))dates.push(iso);}
    d.setDate(d.getDate()+1);
  }
  return dates;
}
function getLessonInfo(dowCode){
  const today=todayISO(),dates=buildDatesForDow(dowCode),idx=dates.indexOf(today);
  return{lessonNum:idx>=0?idx+1:0,lessonTotal:dates.length,lessonDate:today,dates};
}

/* ══ CONSTANTS ══ */
const FLAGS={EN:'🇬🇧',PT:'🇵🇹',FR:'🇫🇷',ES:'🇪🇸',DE:'🇩🇪'};
const DAY_JS=[null,'SEG','TER','QUA','QUI','SEX','SÁB'];
const DAY_FULL={SEG:'Segunda',TER:'Terça',QUA:'Quarta',QUI:'Quinta',SEX:'Sexta','SÁB':'Sábado'};
const DEPT_GRADS={kids:'linear-gradient(145deg,#1A3A6A,#0D2248)',kids_juv:'linear-gradient(145deg,#0D4A3A,#062A20)',adults:'linear-gradient(145deg,#3A2A10,#201408)',exam:'linear-gradient(145deg,#3A1A3A,#200D20)'};
const DEPT_COLOURS={kids:'var(--c-inf)',kids_juv:'var(--c-juv)',adults:'var(--c-ger)',exam:'var(--c-exa)'};
const DEPT_LABELS={kids:'Infantil',kids_juv:'Juvenil',adults:'Geral',exam:'Exames'};
const LEVEL_MAP={'PI1':{dept:'kids'},'PI2':{dept:'kids'},'PI3':{dept:'kids'},'PI4':{dept:'kids'},'PJ1':{dept:'kids_juv'},'PJ2':{dept:'kids_juv'},'PJ3':{dept:'kids_juv'},'6':{dept:'exam'},'7':{dept:'exam'},'8':{dept:'exam'}};
const AV_POOL=[{bg:'#49281f',t:'#cfb590'},{bg:'#564334',t:'#9e9a41'},{bg:'#49281f',t:'#9e9a41'},{bg:'#564334',t:'#cfb590'},{bg:'#49281f',t:'#758918'},{bg:'#3d2a1a',t:'#cfb590'},{bg:'#564334',t:'#758918'},{bg:'#3d2a1a',t:'#9e9a41'}];
function avCol(n){let h=0;for(let i=0;i<(n||'').length;i++)h=(h*31+(n||'').charCodeAt(i))&0xffffffff;return AV_POOL[Math.abs(h)%AV_POOL.length];}
function avInit(n){return(n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();}
function getDept(c){
  if(c.department)return c.department;
  if(c.group_key){const last=(c.group_key||'').split('-').pop().toLowerCase();if(['kids','kids_juv','exam','adults'].includes(last))return last;}
  return LEVEL_MAP[(c.level_code||'').trim()]?.dept||'adults';
}
function todayISO(){return new Date().toISOString().slice(0,10);}
function fmtDate(ts){if(!ts)return'—';try{return new Date(ts).toLocaleDateString('pt-PT',{day:'2-digit',month:'2-digit',year:'numeric'});}catch{return ts;}}
function fmtDT(ts){if(!ts)return'—';try{const d=new Date(ts);return d.toLocaleDateString('pt-PT',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});}catch{return ts;}}
function normDay(raw){
  const S=new Set(['SEG','TER','QUA','QUI','SEX','SAB','SÁB']);
  let d=(raw||'').toUpperCase().replace(/\bSAB\b/g,'SÁB').replace(/\bMON\b/g,'SEG').replace(/\bTUE\b/g,'TER').replace(/\bWED\b/g,'QUA').replace(/\bTHU\b/g,'QUI').replace(/\bFRI\b/g,'SEX').trim();
  if(S.has(d))return d;
  return d.split(/[-_\s]+/).find(p=>S.has(p))||'';
}

/* ══ STATE ══ */
let TEACHERS=[],TEACHER_MAP={},CLASSES=[],ENROL_MAP={},MESSAGES=[],ATTEND=[],SUMARIOS=[];
let SEL_TEACHER=null,SEL_TAB='presencas',FILTER='all';

/* ══ BOOT ══ */

/* ══ TEACHER MAP — uses lesson-number engine ══ */
function buildTeacherMap(){
  const today=todayISO(),todayKey=DAY_JS[new Date().getDay()];
  TEACHER_MAP={};
  TEACHERS.forEach(t=>{
    const myClasses=CLASSES.filter(c=>c.teacher_id===t.id);
    const todaySlots=myClasses.filter(c=>c.day_of_week===todayKey);
    const submissions={};
    todaySlots.forEach(slot=>{
      const info=getLessonInfo(slot.day_of_week);
      // Match by lesson_number (Portal stores this) OR by date fallback
      const records=ATTEND.filter(a=>a.turma_code===slot.turma_code&&(a.lesson_number===info.lessonNum||a.date===today));
      if(records.length)submissions[slot.turma_code]={records,lNum:info.lessonNum,lTotal:info.lessonTotal,presentes:records.filter(r=>r.status==='present'||r.status==='late').length,total:records.length};
    });
    const myMessages=MESSAGES.filter(m=>m.teacher_id===t.id);
    TEACHER_MAP[t.id]={...t,myClasses,todaySlots,submissions,mySumarios:SUMARIOS.filter(s=>myClasses.some(c=>c.turma_code===s.turma_code)),messages:myMessages,pendingMsgs:myMessages.filter(m=>m.status==='pending'&&m.message_type!=='fotocopia'),pendingFoto:myMessages.filter(m=>m.status==='pending'&&m.message_type==='fotocopia')};
  });
}

function updateKPIs(){
  let msgs=0,foto=0,miss=0,ok=0;
  TEACHERS.forEach(t=>{const tm=TEACHER_MAP[t.id];if(!tm)return;msgs+=tm.pendingMsgs.length;foto+=tm.pendingFoto.length;if(tm.todaySlots.length){if(!Object.keys(tm.submissions).length)miss++;else ok++;}});
  const set=(id,txt,cls)=>{const el=document.getElementById(id);el.textContent=txt;el.className='tb-pill '+cls;};
  set('kpi-msgs',msgs+' msgs',msgs>0?'red':'neutral');
  set('kpi-foto',foto+' fotoc.',foto>0?'warn':'neutral');
  set('kpi-miss',miss+' sem pres.',miss>0?'warn':'ok');
  set('kpi-ok',ok+' submetidas','ok');
}

function teacherSt(tm){
  if(!tm)return'grey';
  if(tm.pendingMsgs.length||tm.pendingFoto.length)return'warn';
  if(tm.todaySlots.length&&!Object.keys(tm.submissions).length)return'miss';
  if(tm.todaySlots.length&&Object.keys(tm.submissions).length)return'ok';
  return'grey';
}
function setFilter(f,btn){FILTER=f;document.querySelectorAll('.fp').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderLeft();}

function renderLeft(){
  const q=(document.getElementById('search-inp')?.value||'').toLowerCase();
  let list=[...TEACHERS];
  if(q)list=list.filter(t=>t.name.toLowerCase().includes(q)||t.code.toLowerCase().includes(q));
  if(FILTER==='miss')list=list.filter(t=>teacherSt(TEACHER_MAP[t.id])==='miss');
  if(FILTER==='msgs')list=list.filter(t=>(TEACHER_MAP[t.id]?.pendingMsgs||[]).length>0);
  if(FILTER==='foto')list=list.filter(t=>(TEACHER_MAP[t.id]?.pendingFoto||[]).length>0);
  if(FILTER==='ok')list=list.filter(t=>teacherSt(TEACHER_MAP[t.id])==='ok');
  const order={miss:0,warn:1,ok:2,grey:3};
  list.sort((a,b)=>order[teacherSt(TEACHER_MAP[a.id])]-(order[teacherSt(TEACHER_MAP[b.id])]));
  const el=document.getElementById('teacher-list');
  if(!list.length){el.innerHTML='<div style="padding:16px;font-size:9px;color:var(--t3);text-align:center">Sem professores neste filtro</div>';return;}
  el.innerHTML=list.map(t=>{
    const tm=TEACHER_MAP[t.id]||{},st=teacherSt(tm),av=avCol(t.name);
    const badges=[];
    if((tm.pendingMsgs||[]).length)badges.push(`<span class="t-badge tb-msg">${tm.pendingMsgs.length} msg${tm.pendingMsgs.length>1?'s':''}</span>`);
    if((tm.pendingFoto||[]).length)badges.push(`<span class="t-badge tb-foto">${tm.pendingFoto.length} fotoc.</span>`);
    if(st==='miss')badges.push('<span class="t-badge tb-miss">sem pres.</span>');
    if(st==='ok')badges.push('<span class="t-badge tb-pres">✓ pres.</span>');
    return`<div class="t-row${SEL_TEACHER===t.id?' active':''}" onclick="selectTeacher('${t.id}')">
      <div class="t-av" style="background:${av.bg};border-color:${av.t}66;color:${av.t}">${avInit(t.name)}</div>
      <div class="t-info"><div class="t-name">${t.name}</div><div class="t-meta">${FLAGS[t.lang]||''} ${t.lang} · ${(tm.todaySlots||[]).length} aulas hoje</div>${badges.length?`<div class="t-badges">${badges.join('')}</div>`:''}</div>
      <div class="t-dot ${st}"></div>
    </div>`;
  }).join('');
}

function selectTeacher(id){
  SEL_TEACHER=id;renderLeft();
  const t=TEACHERS.find(x=>x.id===id);if(!t)return;
  const tm=TEACHER_MAP[id]||{},av=avCol(t.name),dept=tm.myClasses?.[0]?getDept(tm.myClasses[0]):'adults';
  document.getElementById('th-bg').style.background=DEPT_GRADS[dept]||DEPT_GRADS.adults;
  const avEl=document.getElementById('th-av');
  avEl.textContent=avInit(t.name);avEl.style.background=av.bg;avEl.style.borderColor=av.t+'66';avEl.style.color=av.t;
  document.getElementById('th-name').textContent=t.name;
  document.getElementById('th-meta').textContent=`${FLAGS[t.lang]||''} ${t.lang}${t.native?' · nativo':''} · ${t.contractH}h · ${t.branch}`;
  document.getElementById('ths-msgs').textContent=(tm.pendingMsgs||[]).length;
  document.getElementById('ths-foto').textContent=(tm.pendingFoto||[]).length;
  document.getElementById('ths-pres').textContent=Object.keys(tm.submissions||{}).length;
  document.getElementById('ths-turmas').textContent=(tm.myClasses||[]).length;
  document.getElementById('no-teacher').style.display='none';
  document.getElementById('teacher-view').classList.add('active');
  const startTab=(tm.pendingMsgs||[]).length?'msgs':(tm.pendingFoto||[]).length?'foto':'presencas';
  document.querySelectorAll('.vt-tab').forEach(x=>x.classList.remove('active'));
  document.getElementById('vtt-'+startTab)?.classList.add('active');
  SEL_TAB=startTab;renderTab(startTab);
}

function switchTab(id,btn){SEL_TAB=id;document.querySelectorAll('.vt-tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');renderTab(id);}

function renderTab(id){
  if(!SEL_TEACHER)return;
  const tm=TEACHER_MAP[SEL_TEACHER];if(!tm)return;
  const body=document.getElementById('view-body');
  if(id==='presencas')body.innerHTML=buildPresencas(tm);
  else if(id==='msgs')body.innerHTML=buildMsgs(tm);
  else if(id==='foto')body.innerHTML=buildFoto(tm);
  else if(id==='sumarios')body.innerHTML=buildSumarios(tm);
  else if(id==='turmas')body.innerHTML=buildTurmas(tm);
}

function buildPresencas(tm){
  const todayKey=DAY_JS[new Date().getDay()];
  if(!tm.todaySlots.length)return`<div class="sec-title">Presenças · Hoje</div><div class="empty">Sem aulas hoje</div>`;
  let html=`<div class="sec-title">Presenças · ${new Date().toLocaleDateString('pt-PT',{weekday:'long',day:'numeric',month:'long'})}</div>`;
  tm.todaySlots.forEach(slot=>{
    const info=getLessonInfo(slot.day_of_week),sub=tm.submissions[slot.turma_code],hasSub=!!sub;
    const dept=getDept(slot),col=DEPT_COLOURS[dept]||'var(--gold2)',pct=hasSub&&sub.total?Math.round(sub.presentes/sub.total*100):0;
    html+=`<div class="att-card"><div class="att-card-hdr">
      <div class="att-turma" style="color:${col}">${slot.turma_code}</div>
      ${info.lessonNum>0?`<div class="att-lesson">Aula ${String(info.lessonNum).padStart(3,'0')}/${info.lessonTotal}</div>`:''}
      <div class="att-time">${slot.start_time||slot.hour+'h'}–${slot.end_time||''} · ${slot.duration_min||90}min</div>
      <span class="att-status ${hasSub?'ok':'miss'}">${hasSub?'✓ Submetido':'Não submetido'}</span>
    </div>`;
    if(hasSub){
      html+=`<div class="att-bar-wrap"><div class="att-bar-fill" style="width:${pct}%"></div></div>
        <div class="att-detail"><span><strong>${sub.presentes}</strong> presentes</span><span><strong>${sub.total-sub.presentes}</strong> faltas</span><span><strong>${sub.total}</strong> total · <strong style="color:var(--green)">${pct}%</strong></span></div>
        <div class="stu-list">`;
      sub.records.forEach(r=>{
        const enr=ENROL_MAP[r.student_ref]||{name:r.student_name||r.student_ref},av=avCol(enr.name||r.student_ref);
        const sc=r.status==='present'?'present':r.status==='late'?'late':r.status==='absent'?'absent':'';
        const lbl=r.status==='present'?'PRESENTE':r.status==='late'?'ATRASO':r.status==='absent'?'FALTA':'—';
        html+=`<div class="stu-row ${sc}"><div class="stu-av" style="background:${av.bg};border-color:${av.t}66;color:${av.t}">${avInit(enr.name)}</div><div style="flex:1"><div class="stu-name">${enr.name||r.student_ref}</div><div class="stu-ref">${r.student_ref}</div></div><span class="stu-badge ${sc}">${lbl}</span></div>`;
      });
      html+=`</div>`;
    }else{
      html+=`<div style="font-size:9px;color:var(--red);padding:4px 0">Não submetido · ${(slot.student_refs||[]).length} alunos esperados${info.lessonNum>0?` · Aula ${info.lessonNum}/${info.lessonTotal}`:''}</div>`;
    }
    html+=`</div>`;
  });
  return html;
}

function buildMsgs(tm){
  const msgs=tm.messages.filter(m=>m.message_type!=='fotocopia');
  if(!msgs.length)return`<div class="sec-title">Mensagens</div><div class="empty">Sem mensagens</div>`;
  const pending=msgs.filter(m=>m.status==='pending'),done=msgs.filter(m=>m.status!=='pending');
  let html='';
  if(pending.length){html+=`<div class="sec-title">Pendentes · ${pending.length}</div>`;html+=pending.map(msgCard).join('');}
  if(done.length){html+=`<div class="sec-title" style="margin-top:16px">Lidas · ${done.length}</div>`;html+=done.map(msgCard).join('');}
  return html;
}
function msgCard(m){
  const isRead=m.status!=='pending',typeClass=m.message_type==='parent_contact'?'mc-parent':isRead?'mc-read':'mc-internal';
  const typeLbl=m.message_type==='parent_contact'?'ENCARREGADO':isRead?'✓ LIDO':'ESCOLA INTERNA';
  const typeBadge=m.message_type==='parent_contact'?'mct-parent':isRead?'mct-read':'mct-internal';
  return`<div class="msg-card ${typeClass}" id="mc-${m.id}"><div class="mc-hdr">
    <span class="mc-type ${typeBadge}">${typeLbl}</span>
    ${m.turma_code?`<span class="mc-turma">${m.turma_code}</span>`:''}
    ${m.lesson_number?`<span class="mc-lesson">Aula ${String(m.lesson_number).padStart(3,'0')}</span>`:''}
    ${m.to&&m.to!=='—'?`<span style="font-size:8px;color:var(--t3)">→ ${m.to}</span>`:''}
    <span class="mc-time">${fmtDT(m.created_at)}</span>
  </div>
  ${m.subject?`<div class="mc-subject">${m.subject}</div>`:''}
  ${m.body?`<div class="mc-body">${m.body}</div>`:''}
  ${!isRead?`<div class="mc-actions"><button class="mc-btn mc-accept" onclick="markMsg('${m.id}','${m.source}','read')">✓ Marcar lida</button><button class="mc-btn mc-ghost" onclick="markMsg('${m.id}','${m.source}','archived')">📁 Arquivar</button></div>`:''}
  </div>`;
}

function buildFoto(tm){
  const fotos=tm.messages.filter(m=>m.message_type==='fotocopia');
  if(!fotos.length)return`<div class="sec-title">Fotocópias</div><div class="empty">Sem pedidos</div>`;
  const pending=fotos.filter(m=>m.status==='pending'),done=fotos.filter(m=>m.status!=='pending');
  let html='';
  if(pending.length){html+=`<div class="sec-title">Pendentes · ${pending.length}</div>`;html+=pending.map(m=>fotoCard(m,false)).join('');}
  if(done.length){html+=`<div class="sec-title" style="margin-top:16px">Concluídos · ${done.length}</div>`;html+=done.map(m=>fotoCard(m,true)).join('');}
  return html;
}
function fotoCard(m,done){
  const urgClass=m.urgency==='express'?'urg-express':m.urgency==='urgent'?'urg-urgent':'urg-normal';
  const urgLbl=m.urgency==='express'?'EXPRESS':m.urgency==='urgent'?'URGENTE (24h)':'NORMAL (48h)';
  return`<div class="msg-card ${done?'mc-read':'mc-foto'}" id="mc-${m.id}"><div class="mc-hdr">
    <span class="mc-type ${done?'mct-read':'mct-foto'}">${done?'✓ CONCLUÍDO':'FOTOCÓPIAS'}</span>
    <span class="urg-badge ${urgClass}">${urgLbl}</span>
    ${m.turma_code?`<span class="mc-turma">${m.turma_code}</span>`:''}
    <span class="mc-time">${fmtDT(m.created_at)}</span>
  </div>
  ${m.document?`<div class="mc-subject">${m.document}</div>`:''}
  <div class="foto-grid">${m.copies?`<div class="foto-field"><div class="foto-lbl">Cópias</div><div class="foto-val">${m.copies}</div></div>`:''} ${m.sides?`<div class="foto-field"><div class="foto-lbl">Frente/Verso</div><div class="foto-val">${m.sides}</div></div>`:''}</div>
  ${m.body?`<div class="mc-body" style="margin-top:6px">${m.body}</div>`:''}
  ${!done?`<div class="mc-actions"><button class="mc-btn mc-accept" onclick="markMsg('${m.id}','${m.source}','completed')">✓ Confirmar entrega</button><button class="mc-btn mc-reject" onclick="markMsg('${m.id}','${m.source}','rejected')">✕ Recusar</button></div>`:''}
  </div>`;
}

function buildSumarios(tm){
  const sums=tm.mySumarios||[];
  if(!sums.length)return`<div class="sec-title">Sumários</div><div class="empty">Sem sumários</div>`;
  let html=`<div class="sec-title">Sumários · ${sums.length} registos</div>`;
  sums.forEach(s=>{
    const text=s.summary_text||s.summary||'',notes=s.observations||s.notes||'';
    html+=`<div class="sum-card"><div class="sc-meta">
      <span class="sc-date">${fmtDate(s.date)}</span>
      <span style="font-size:8.5px;color:var(--t2);font-weight:700">${s.turma_code||'—'}</span>
      ${s.lesson_number?`<span class="sc-lesson">Aula ${String(s.lesson_number).padStart(3,'0')}</span>`:''}
      ${s.skill?`<span class="sc-skill">${s.skill}</span>`:''}
      ${s.participation?`<span style="font-size:8px;color:var(--t3)">${s.participation}</span>`:''}
    </div>
    ${text?`<div class="sc-text">${text}</div>`:'<div class="sc-text" style="color:var(--t3);font-style:italic">Sem texto.</div>'}
    <div class="sc-fields">
      ${s.book_page?`<div class="sc-field"><div class="sc-field-l">Página</div><div class="sc-field-v">${s.book_page}</div></div>`:''}
      ${s.tpc?`<div class="sc-field"><div class="sc-field-l">TPC</div><div class="sc-field-v">${s.tpc}</div></div>`:''}
      ${notes?`<div class="sc-field" style="grid-column:1/-1"><div class="sc-field-l">Observações</div><div class="sc-field-v">${notes}</div></div>`:''}
    </div></div>`;
  });
  return html;
}

function buildTurmas(tm){
  const todayKey=DAY_JS[new Date().getDay()];
  if(!(tm.myClasses||[]).length)return`<div class="sec-title">Turmas</div><div class="empty">Sem turmas</div>`;
  const todays=tm.myClasses.filter(c=>c.day_of_week===todayKey),others=tm.myClasses.filter(c=>c.day_of_week!==todayKey);
  let html='';
  if(todays.length){html+=`<div class="sec-title">Hoje</div><div class="classes-grid">`;todays.forEach(c=>{html+=classCard(c,tm,true);});html+=`</div>`;}
  if(others.length){html+=`<div class="sec-title">Restantes</div><div class="classes-grid">`;others.forEach(c=>{html+=classCard(c,tm,false);});html+=`</div>`;}
  return html;
}
function classCard(slot,tm,isToday){
  const dept=getDept(slot),col=DEPT_COLOURS[dept]||'var(--gold2)',sub=tm.submissions[slot.turma_code];
  const subSt=!isToday?'none':sub?'ok':'miss',subTxt=!isToday?'—':sub?'✓ Submetido':'Não submetido';
  const info=isToday?getLessonInfo(slot.day_of_week):{lessonNum:0,lessonTotal:0};
  return`<div class="class-card dept-${dept}"><div class="cc-top">
    <div class="cc-code" style="color:${col}">${slot.turma_code}</div>
    <div class="cc-status"><div class="cc-sdot ${subSt}"></div><span class="cc-stxt ${subSt}">${subTxt}</span></div>
  </div><div class="cc-mid">
    <div class="cc-time">${slot.start_time||slot.hour+'h'}–${slot.end_time||''}</div>
    <div class="cc-level">${DAY_FULL[slot.day_of_week]||slot.day_of_week} · ${slot.level_display||slot.level_code||'—'} · ${DEPT_LABELS[dept]||dept}</div>
    ${info.lessonNum>0?`<div class="cc-lesson">Aula ${String(info.lessonNum).padStart(3,'0')} / ${info.lessonTotal}</div>`:''}
  </div><div class="cc-foot"><span class="cc-stu">${(slot.student_refs||[]).length} alunos</span></div></div>`;
}

async function markMsg(id,source,newStatus){
  const table=source==='messages'?'messages':'teacher_requests';
  const extra=newStatus==='read'?{read_at:new Date().toISOString()}:{};
  try{
    await sbPatch(table,`id=eq.${encodeURIComponent(id)}`,{status:newStatus,...extra});
    const msg=MESSAGES.find(m=>m.id===id);if(msg)msg.status=newStatus;
    buildTeacherMap();updateKPIs();renderLeft();renderTab(SEL_TAB);
    const labels={read:'Marcada como lida ✓',completed:'Entrega confirmada ✓',rejected:'Pedido recusado',archived:'Arquivada'};
    showToast(labels[newStatus]||'Actualizado ✓','ok');
  }catch(e){showToast('Erro: '+e.message,'err');}
}

function setBotSrc(txt){document.getElementById('bot-src').textContent=txt;}
function tick(){const n=new Date(),p=x=>String(x).padStart(2,'0');document.getElementById('clk').textContent=p(n.getHours())+':'+p(n.getMinutes())+':'+p(n.getSeconds());}
tick();setInterval(tick,1000);
setInterval(()=>{if(document.visibilityState==='visible'){const prev=SEL_TEACHER;boot().then(()=>{if(prev)selectTeacher(prev);});}},60000);
let _tt=null;
function showToast(msg,type='info'){const t=document.getElementById('toast');t.textContent=msg;t.className='toast '+type+' show';clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('show'),3000);}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){SEL_TEACHER=null;document.getElementById('teacher-view').classList.remove('active');document.getElementById('no-teacher').style.display='flex';renderLeft();}});
boot();
</script>
</body>
