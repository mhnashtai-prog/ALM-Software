<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ALM · Card Component</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════════════════
   ALM CARD COMPONENT
   Reusable modal profile card for students
   and teachers. Embed by including this file
   and calling openStudentCard(data) or
   openTeacherCard(data).

   iPhone 16 colour palette:
   Teal        #B0D4D2  → Infantil
   Pink        #F2ADDA  → Juvenil
   Ultramarine #9AADF6  → Geral
   Desert      #BFA48F  → Exames
   Black       #3C4042  → neutral
   White       #FAFAFA  → surfaces
═══════════════════════════════════════════ */

*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ip-teal:   #B0D4D2; --ip-teal-d:  #7ABAB8; --ip-teal-bg:  rgba(176,212,210,.15);
  --ip-pink:   #F2ADDA; --ip-pink-d:  #E07DC0; --ip-pink-bg:  rgba(242,173,218,.15);
  --ip-ultra:  #9AADF6; --ip-ultra-d: #6080E8; --ip-ultra-bg: rgba(154,173,246,.15);
  --ip-desert: #BFA48F; --ip-desert-d:#A08060; --ip-desert-bg:rgba(191,164,143,.15);
  --ip-black:  #3C4042; --ip-white:   #FAFAFA;
  /* lang colours */
  --en:#4A8FF5; --pt:#C8A44A; --fr:#9B5ECA; --es:#E8A020; --de:#28C8B0;
  /* surfaces */
  --bg:#07060E; --bg2:#0E0B1A; --bg3:#141025;
  --b:rgba(255,255,255,.06); --b2:rgba(255,255,255,.12);
  --t:rgba(238,218,168,.92); --t2:rgba(210,188,140,.55); --t3:rgba(210,188,140,.28);
  --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',system-ui,sans-serif;
}

body{
  background:var(--bg);
  font-family:var(--sans);
  color:var(--t);
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:20px;padding:20px;
}

/* ═══ DEMO BUTTONS ═══ */
.demo-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.demo-btn{
  padding:8px 18px;border:1px solid var(--b2);
  background:rgba(255,255,255,.04);color:var(--t2);
  font-family:var(--mono);font-size:9px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
  transition:all .15s;border-radius:4px;
}
.demo-btn:hover{background:rgba(255,255,255,.08);color:var(--t);border-color:rgba(255,255,255,.2)}

/* ═══ OVERLAY ═══ */
.card-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(4,2,12,.82);z-index:1000;
  align-items:center;justify-content:center;
  padding:20px;
  backdrop-filter:blur(12px);
}
.card-overlay.open{
  display:flex;
  animation:overlayIn .2s ease;
}
@keyframes overlayIn{from{opacity:0}to{opacity:1}}

/* ═══ CARD SHELL ═══ */
.alm-card{
  width:min(620px,96vw);
  max-height:90vh;
  overflow-y:auto;
  background:rgba(14,11,26,.97);
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 32px 80px rgba(0,0,0,.9);
  animation:cardIn .22s cubic-bezier(.22,.61,.36,1);
  scrollbar-width:none;
}
.alm-card::-webkit-scrollbar{display:none}
@keyframes cardIn{
  from{opacity:0;transform:scale(.94) translateY(16px)}
  to{opacity:1;transform:none}
}

/* ═══ BANNER ═══ */
.card-banner{
  height:110px;position:relative;
  display:flex;align-items:flex-end;
  padding:0 20px 0;
  flex-shrink:0;
  overflow:hidden;
}
.banner-bg{
  position:absolute;inset:0;
  background:linear-gradient(135deg, var(--card-color,#9AADF6) 0%, var(--card-color-d,#6080E8) 100%);
  opacity:.28;
}
.banner-stripe{
  position:absolute;inset:0;
  background-image:repeating-linear-gradient(
    45deg,
    var(--card-color,#9AADF6) 0,
    var(--card-color,#9AADF6) 1px,
    transparent 1px,
    transparent 9px
  );
  opacity:.07;
}
.banner-close{
  position:absolute;top:14px;right:14px;
  width:28px;height:28px;border-radius:50%;
  background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.15);
  color:rgba(255,255,255,.6);font-size:13px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .13s;z-index:2;
}
.banner-close:hover{background:rgba(232,69,90,.4);color:#fff;border-color:transparent}
.banner-dept{
  position:absolute;top:14px;left:16px;
  font-family:var(--mono);font-size:7px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;
  padding:3px 9px;border:1px solid;border-radius:999px;
  z-index:2;
}

/* ═══ AVATAR ═══ */
.card-avatar-wrap{
  position:relative;z-index:2;
  margin-bottom:-28px;
}
.card-avatar{
  width:80px;height:80px;border-radius:50%;
  border:3px solid rgba(14,11,26,.97);
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:24px;font-weight:700;
  flex-shrink:0;
  box-shadow:0 8px 24px rgba(0,0,0,.6);
}
.card-avatar img{width:100%;height:100%;object-fit:cover}

/* ═══ IDENTITY ═══ */
.card-identity{
  padding:36px 20px 16px;
  border-bottom:1px solid var(--b);
}
.card-name{
  font-size:22px;font-weight:600;
  color:var(--ip-white);
  letter-spacing:.01em;line-height:1.1;
  margin-bottom:4px;
}
.card-ref{
  font-family:var(--mono);font-size:11px;
  color:var(--t3);letter-spacing:.08em;
}
.card-tags{
  display:flex;gap:6px;flex-wrap:wrap;
  margin-top:10px;
}
.card-tag{
  font-family:var(--mono);font-size:8px;font-weight:700;
  padding:3px 9px;border:1px solid;border-radius:999px;
  letter-spacing:.06em;
}

/* ═══ SECTIONS ═══ */
.card-section{
  border-bottom:1px solid var(--b);
}
.card-sec-hdr{
  display:flex;align-items:center;gap:8px;
  padding:12px 20px;cursor:pointer;
  user-select:none;transition:background .12s;
}
.card-sec-hdr:hover{background:rgba(255,255,255,.03)}
.card-sec-icon{
  width:28px;height:28px;border-radius:8px;
  background:rgba(255,255,255,.05);border:1px solid var(--b);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.card-sec-icon svg{
  width:13px;height:13px;stroke:currentColor;
  stroke-width:1.6;fill:none;
  stroke-linecap:round;stroke-linejoin:round;
}
.card-sec-title{
  font-family:var(--mono);font-size:8px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;
  color:var(--t2);flex:1;
}
.card-sec-meta{
  font-family:var(--mono);font-size:8px;color:var(--t3);
}
.card-sec-chv{
  font-family:var(--mono);font-size:9px;color:var(--t3);
  transition:transform .2s;
}
.card-sec-hdr.open .card-sec-chv{transform:rotate(90deg)}
.card-sec-body{
  padding:0 20px 14px;
  display:none;
}
.card-sec-hdr.open + .card-sec-body{display:block}

/* ═══ MINI TIMETABLE HEATMAP ═══ */
.mini-heat{margin-top:4px}
.mh-hours{
  display:flex;gap:2px;margin-left:32px;margin-bottom:3px;
}
.mh-hlbl{
  width:20px;text-align:center;
  font-family:var(--mono);font-size:6px;color:var(--t3);
  flex-shrink:0;
}
.mh-row{display:flex;align-items:center;gap:2px;margin-bottom:2px}
.mh-day{
  font-family:var(--mono);font-size:7px;font-weight:700;
  color:var(--t3);width:28px;flex-shrink:0;
  letter-spacing:.04em;
}
.mh-cell{
  width:20px;height:16px;border-radius:3px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.04);
  flex-shrink:0;transition:all .1s;
  cursor:default;
  display:flex;align-items:center;justify-content:center;
}
.mh-cell.confirmed{border:none}
.mh-cell.requested{border:none}
.mh-legend{
  display:flex;gap:12px;margin-top:8px;
}
.mh-leg{
  display:flex;align-items:center;gap:5px;
  font-family:var(--mono);font-size:7px;color:var(--t3);
}
.mh-leg-dot{width:10px;height:10px;border-radius:2px}

/* ═══ INFO ROWS ═══ */
.info-row{
  display:flex;align-items:center;gap:10px;
  padding:6px 0;
  border-bottom:1px solid rgba(255,255,255,.03);
}
.info-row:last-child{border-bottom:none}
.info-key{
  font-family:var(--mono);font-size:8px;color:var(--t3);
  width:110px;flex-shrink:0;letter-spacing:.04em;
}
.info-val{
  font-family:var(--mono);font-size:9px;color:var(--t);
  flex:1;
}

/* ═══ HOURS BAR (teachers) ═══ */
.hours-bar-wrap{margin:8px 0}
.hours-bar-track{
  height:8px;background:rgba(255,255,255,.05);
  border-radius:4px;overflow:hidden;
}
.hours-bar-fill{
  height:100%;border-radius:4px;
  transition:width .6s ease;
}
.hours-bar-labels{
  display:flex;justify-content:space-between;
  margin-top:4px;
  font-family:var(--mono);font-size:7.5px;color:var(--t3);
}

/* ═══ ACTION TILES ═══ */
.card-actions{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:8px;padding:14px 20px 20px;
}
.card-action{
  display:flex;flex-direction:column;align-items:center;
  gap:7px;padding:14px 8px;
  background:rgba(255,255,255,.03);
  border:1px solid var(--b);border-radius:14px;
  cursor:pointer;transition:all .18s;
}
.card-action:hover{
  background:rgba(255,255,255,.07);
  border-color:var(--b2);
  transform:translateY(-2px);
}
.card-action-icon{
  width:40px;height:40px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;
}
.card-action-lbl{
  font-family:var(--mono);font-size:7.5px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;
  color:var(--t2);text-align:center;
}

/* ═══ TURMAS PILLS ═══ */
.turma-pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.turma-pill{
  font-family:var(--mono);font-size:8px;font-weight:600;
  padding:3px 10px;border:1px solid;border-radius:999px;
  letter-spacing:.04em;
}

/* ═══ DAY DOTS ═══ */
.day-dots{display:flex;gap:4px}
.day-dot{
  width:26px;height:26px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:7.5px;font-weight:700;
  border:1px solid;
}

/* ═══ DIVIDER ═══ */
.card-divider{
  height:1px;background:var(--b);
  margin:0 20px;
}

/* ═══ DEMO PAGE ═══ */
.demo-title{
  font-family:var(--mono);font-size:8px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;
  color:rgba(255,255,255,.2);margin-bottom:6px;text-align:center;
}
</style>
</head>
<body>

<div class="demo-title">ALM · Card Component · Demo</div>
<div class="demo-row">
  <button class="demo-btn" onclick="demoStudent('infantil')">👶 Infantil Student</button>
  <button class="demo-btn" onclick="demoStudent('juvenil')">🧒 Juvenil Student</button>
  <button class="demo-btn" onclick="demoStudent('geral')">📘 Geral Student</button>
  <button class="demo-btn" onclick="demoStudent('exam')">🎓 Exames Student</button>
  <button class="demo-btn" onclick="demoTeacher('EN')">🇬🇧 Teacher EN</button>
  <button class="demo-btn" onclick="demoTeacher('FR')">🇫🇷 Teacher FR</button>
</div>

<!-- ═══ CARD OVERLAY ═══ -->
<div class="card-overlay" id="card-overlay" onclick="handleCardOverlay(event)">
  <div class="alm-card" id="alm-card" onclick="event.stopPropagation()"></div>
</div>

<script>
/* ═══════════════════════════════════════
   DEPT → iPhone 16 colour mapping
═══════════════════════════════════════ */
const DEPT_COLOURS = {
  infantil: { bg:'#B0D4D2', dark:'#5A9E9B', text:'#0D3533', label:'Infantil',  tag:'rgba(176,212,210,.18)', tagBorder:'rgba(176,212,210,.4)',  tagText:'#7ABAB8' },
  juvenil:  { bg:'#F2ADDA', dark:'#C96FAA', text:'#3D0B28', label:'Juvenil',   tag:'rgba(242,173,218,.18)', tagBorder:'rgba(242,173,218,.4)',  tagText:'#E07DC0' },
  geral:    { bg:'#9AADF6', dark:'#4A6DE8', text:'#0A1A4A', label:'Geral',     tag:'rgba(154,173,246,.18)', tagBorder:'rgba(154,173,246,.4)',  tagText:'#7090F0' },
  exam:     { bg:'#BFA48F', dark:'#8A6A44', text:'#2A1A08', label:'Exames',    tag:'rgba(191,164,143,.18)', tagBorder:'rgba(191,164,143,.4)',  tagText:'#A08060' },
};

const LANG_COLOURS = {
  EN: { col:'#4A8FF5', bg:'rgba(74,143,245,.15)', border:'rgba(74,143,245,.35)', flag:'🇬🇧' },
  PT: { col:'#C8A44A', bg:'rgba(200,164,74,.15)',  border:'rgba(200,164,74,.35)',  flag:'🇵🇹' },
  FR: { col:'#9B5ECA', bg:'rgba(155,94,202,.15)',  border:'rgba(155,94,202,.35)',  flag:'🇫🇷' },
  ES: { col:'#E8A020', bg:'rgba(232,160,32,.15)',  border:'rgba(232,160,32,.35)',  flag:'🇪🇸' },
  DE: { col:'#28C8B0', bg:'rgba(40,200,176,.15)',  border:'rgba(40,200,176,.35)',  flag:'🇩🇪' },
};

const DAYS = ['SEG','TER','QUA','QUI','SEX','SÁB'];
const HOURS = [8,9,10,11,14,15,16,17,18,19,20];

/* Avatar colour from name seed */
function avColor(name){
  let h=0;
  for(let i=0;i<(name||'?').length;i++) h=(h*31+(name||'?').charCodeAt(i))&0xffffffff;
  const hues=[200,320,160,270,30,340,22,285];
  const hue=hues[Math.abs(h)%hues.length];
  const sat=55+(Math.abs(h>>4)%20);
  const lit=52+(Math.abs(h>>8)%12);
  return{bg:`hsl(${hue},${sat}%,22%)`,text:`hsl(${hue},${sat+10}%,72%)`};
}

function initials(name){
  return (name||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
}

/* ═══════════════════════════════════════
   BUILD STUDENT CARD
   data: { ref, name, dept, level, branch,
           lang, photo, availability,
           turma, status, enrolDate }
═══════════════════════════════════════ */
function buildStudentCard(data){
  const dc   = DEPT_COLOURS[data.dept] || DEPT_COLOURS.geral;
  const lc   = LANG_COLOURS[data.lang] || LANG_COLOURS.EN;
  const av   = avColor(data.name);
  const ini  = initials(data.name);
  const avail= data.availability || {};

  // Heatmap
  const heatRows = DAYS.map(day=>{
    const cells = HOURS.map(h=>{
      const key=`${day}_${h}`;
      const confirmed = avail[key]==='confirmed';
      const requested = avail[key]==='requested';
      let bg='rgba(255,255,255,.04)';
      if(confirmed) bg=dc.bg+'88';
      if(requested) bg=dc.bg+'44';
      return `<div class="mh-cell${confirmed?' confirmed':''}${requested?' requested':''}"
        style="background:${bg};border-color:${confirmed?dc.bg+'66':'transparent'}"
        title="${day} ${h}h${confirmed?' · confirmado':requested?' · pedido':''}">
      </div>`;
    }).join('');
    return `<div class="mh-row">
      <span class="mh-day">${day}</span>${cells}
    </div>`;
  }).join('');

  const hourLabels = HOURS.map(h=>`<div class="mh-hlbl">${h}</div>`).join('');

  // Day dots from availability
  const dayDots = DAYS.map(day=>{
    const hasSlot = HOURS.some(h=>avail[`${day}_${h}`]);
    return `<div class="day-dot" style="background:${hasSlot?dc.tag:'rgba(255,255,255,.03)'};border-color:${hasSlot?dc.tagBorder:'rgba(255,255,255,.06)'};color:${hasSlot?dc.tagText:'rgba(255,255,255,.2)'}">
      ${day.slice(0,1)}
    </div>`;
  }).join('');

  return `
    <!-- BANNER -->
    <div class="card-banner" style="--card-color:${dc.bg};--card-color-d:${dc.dark}">
      <div class="banner-bg"></div>
      <div class="banner-stripe"></div>
      <button class="banner-close" onclick="closeCard()">✕</button>
      <div class="banner-dept" style="background:${dc.tag};border-color:${dc.tagBorder};color:${dc.tagText}">
        ${dc.label}
      </div>
      <div class="card-avatar-wrap">
        <div class="card-avatar" style="background:${av.bg}">
          ${data.photo
            ? `<img src="${data.photo}" alt="${data.name}"/>`
            : `<span style="color:${av.text}">${ini}</span>`}
        </div>
      </div>
    </div>

    <!-- IDENTITY -->
    <div class="card-identity">
      <div class="card-name">${data.name||'—'}</div>
      <div class="card-ref">${data.ref||'—'}</div>
      <div class="card-tags" style="margin-top:10px">
        <span class="card-tag" style="background:${dc.tag};border-color:${dc.tagBorder};color:${dc.tagText}">${data.level||'—'}</span>
        <span class="card-tag" style="background:${lc.bg};border-color:${lc.border};color:${lc.col}">${lc.flag} ${data.lang||'EN'}</span>
        ${data.turma ? `<span class="card-tag" style="background:rgba(29,184,122,.12);border-color:rgba(29,184,122,.3);color:#1DB87A">✓ ${data.turma}</span>` : ''}
        <span class="card-tag" style="background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.08);color:rgba(255,255,255,.4)">${data.branch||'—'}</span>
      </div>
      <div style="margin-top:10px">${dayDots.replace(/<\/div>/g,'</div>').split('</div>').join('</div>')}</div>
      <div class="day-dots" style="margin-top:8px">${dayDots}</div>
    </div>

    <!-- HORÁRIO SECTION -->
    <div class="card-section">
      <div class="card-sec-hdr open" onclick="toggleSec(this)">
        <div class="card-sec-icon" style="color:${dc.tagText}">
          <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 5v3l2 2"/></svg>
        </div>
        <span class="card-sec-title">Horário</span>
        <span class="card-sec-meta">${Object.keys(avail).length} slots</span>
        <span class="card-sec-chv">›</span>
      </div>
      <div class="card-sec-body">
        <div class="mini-heat">
          <div class="mh-hours">${hourLabels}</div>
          ${heatRows}
        </div>
        <div class="mh-legend">
          <div class="mh-leg">
            <div class="mh-leg-dot" style="background:${dc.bg}88"></div>
            Confirmado
          </div>
          <div class="mh-leg">
            <div class="mh-leg-dot" style="background:${dc.bg}44"></div>
            Pedido
          </div>
          <div class="mh-leg">
            <div class="mh-leg-dot" style="background:rgba(255,255,255,.04)"></div>
            Livre
          </div>
        </div>
      </div>
    </div>

    <!-- INSCRIÇÃO SECTION -->
    <div class="card-section">
      <div class="card-sec-hdr" onclick="toggleSec(this)">
        <div class="card-sec-icon" style="color:${lc.col}">
          <svg viewBox="0 0 16 16"><path d="M4 2h8a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V3a1 1 0 011-1z"/><path d="M6 6h4M6 9h4M6 12h2"/></svg>
        </div>
        <span class="card-sec-title">Inscrição</span>
        <span class="card-sec-meta">${data.status||'activo'}</span>
        <span class="card-sec-chv">›</span>
      </div>
      <div class="card-sec-body">
        <div class="info-row"><span class="info-key">Referência</span><span class="info-val">${data.ref||'—'}</span></div>
        <div class="info-row"><span class="info-key">Nível</span><span class="info-val">${data.level||'—'} · ${data.dept||'—'}</span></div>
        <div class="info-row"><span class="info-key">Língua</span><span class="info-val">${lc.flag} ${data.lang||'—'}</span></div>
        <div class="info-row"><span class="info-key">Filial</span><span class="info-val">${data.branch||'—'}</span></div>
        <div class="info-row"><span class="info-key">Data inscrição</span><span class="info-val">${data.enrolDate||'—'}</span></div>
        <div class="info-row"><span class="info-key">Estado</span><span class="info-val" style="color:${data.status==='atribuido'?'#1DB87A':'rgba(232,184,75,.9)'}">${data.status||'pendente'}</span></div>
      </div>
    </div>

    <!-- ACTIONS -->
    <div class="card-actions">
      <div class="card-action" onclick="cardAction('timetable')">
        <div class="card-action-icon" style="background:${dc.tag}">

/* ═══════════════════════════════════════
   BUILD TEACHER CARD
   data: { code, name, lang, photo,
           contractH, usedH, turmas,
           branch, native, email }
═══════════════════════════════════════ */
function buildTeacherCard(data){
  const lc  = LANG_COLOURS[data.lang] || LANG_COLOURS.EN;
  const av  = avColor(data.name);
  const ini = initials(data.name);
  const pct = data.contractH ? Math.round(data.usedH/data.contractH*100) : 0;
  const barCol = pct>=90?'#E8455A':pct>=75?'#E8B84B':'#1DB87A';
  const turmas = data.turmas || [];

  const turmaHtml = turmas.map(t=>
    `<div class="turma-pill" style="background:${lc.bg};border-color:${lc.border};color:${lc.col}">${t}</div>`
  ).join('');

  return `
    <!-- BANNER -->
    <div class="card-banner" style="--card-color:${lc.col};--card-color-d:${lc.col}">
      <div class="banner-bg"></div>
      <div class="banner-stripe"></div>
      <button class="banner-close" onclick="closeCard()">✕</button>
      <div class="banner-dept" style="background:${lc.bg};border-color:${lc.border};color:${lc.col}">
        ${lc.flag} ${data.lang} ${data.native?'· Native':''}
      </div>
      <div class="card-avatar-wrap">
        <div class="card-avatar" style="background:${av.bg};border-color:rgba(14,11,26,.97)">
          ${data.photo
            ? `<img src="${data.photo}" alt="${data.name}"/>`
            : `<span style="color:${av.text}">${ini}</span>`}
        </div>
      </div>
    </div>

    <!-- IDENTITY -->
    <div class="card-identity">
      <div class="card-name">${data.name||'—'}</div>
      <div class="card-ref" style="color:${lc.col}">${data.code||'—'} · Professor</div>
      <div class="card-tags" style="margin-top:10px">
        <span class="card-tag" style="background:${lc.bg};border-color:${lc.border};color:${lc.col}">${lc.flag} ${data.lang}</span>
        ${data.native?`<span class="card-tag" style="background:rgba(29,184,122,.12);border-color:rgba(29,184,122,.3);color:#1DB87A">Native</span>`:''}
        <span class="card-tag" style="background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.08);color:rgba(255,255,255,.4)">${data.branch||'—'}</span>
      </div>

      <!-- Hours bar -->
      <div class="hours-bar-wrap" style="margin-top:14px">
        <div style="display:flex;justify-content:space-between;margin-bottom:5px">
          <span style="font-family:var(--mono);font-size:8px;color:var(--t3);letter-spacing:.08em;text-transform:uppercase">Horas semanais</span>
          <span style="font-family:var(--mono);font-size:10px;font-weight:700;color:${barCol}">${data.usedH||0}h / ${data.contractH||22}h</span>
        </div>
        <div class="hours-bar-track">
          <div class="hours-bar-fill" style="width:${Math.min(100,pct)}%;background:${barCol}"></div>
        </div>
        <div class="hours-bar-labels">
          <span>0h</span>
          <span style="color:${barCol}">${pct}% contrato</span>
          <span>${data.contractH||22}h</span>
        </div>
      </div>
    </div>

    <!-- TURMAS SECTION -->
    <div class="card-section">
      <div class="card-sec-hdr open" onclick="toggleSec(this)">
        <div class="card-sec-icon" style="color:${lc.col}">
          <svg viewBox="0 0 16 16"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>
        </div>
        <span class="card-sec-title">Turmas</span>
        <span class="card-sec-meta">${turmas.length} atribuídas</span>
        <span class="card-sec-chv">›</span>
      </div>
      <div class="card-sec-body">
        <div class="turma-pills">${turmaHtml||'<span style="font-family:var(--mono);font-size:8px;color:var(--t3)">Sem turmas atribuídas</span>'}</div>
      </div>
    </div>

    <!-- FICHA SECTION -->
    <div class="card-section">
      <div class="card-sec-hdr" onclick="toggleSec(this)">
        <div class="card-sec-icon" style="color:var(--t2)">
          <svg viewBox="0 0 16 16"><circle cx="8" cy="5" r="3"/><path d="M2 14c0-3 2.7-5 6-5s6 2 6 5"/></svg>
        </div>
        <span class="card-sec-title">Ficha</span>
        <span class="card-sec-meta">${data.email||'—'}</span>
        <span class="card-sec-chv">›</span>
      </div>
      <div class="card-sec-body">
        <div class="info-row"><span class="info-key">Código</span><span class="info-val">${data.code||'—'}</span></div>
        <div class="info-row"><span class="info-key">Língua</span><span class="info-val">${lc.flag} ${data.lang||'—'}</span></div>
        <div class="info-row"><span class="info-key">Filial principal</span><span class="info-val">${data.branch||'—'}</span></div>
        <div class="info-row"><span class="info-key">Email</span><span class="info-val" style="color:${lc.col}">${data.email||'—'}</span></div>
        <div class="info-row"><span class="info-key">Nativo</span><span class="info-val">${data.native?'✓ Sim':'—'}</span></div>
        <div class="info-row"><span class="info-key">Contrato</span><span class="info-val">${data.contractH||22}h / semana</span></div>
      </div>
    </div>

    <!-- ACTIONS -->
    <div class="card-actions">
      <div class="card-action" onclick="cardAction('schedule')">
        <div class="card-action-icon" style="background:${lc.bg}">
          <span style="font-size:20px">📅</span>
        </div>
        <span class="card-action-lbl">Horário</span>
      </div>
      <div class="card-action" onclick="cardAction('turmas')">
        <div class="card-action-icon" style="background:rgba(154,173,246,.15)">
          <span style="font-size:20px">📚</span>
        </div>
        <span class="card-action-lbl">Turmas</span>
      </div>
      <div class="card-action" onclick="cardAction('message')">
        <div class="card-action-icon" style="background:rgba(29,184,122,.12)">
          <span style="font-size:20px">✉</span>
        </div>
        <span class="card-action-lbl">Mensagem</span>
      </div>
    </div>`;
}

/* ═══════════════════════════════════════
   OPEN / CLOSE
═══════════════════════════════════════ */
function openCard(html){
  document.getElementById('alm-card').innerHTML = html;
  document.getElementById('card-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeCard(){
  document.getElementById('card-overlay').classList.remove('open');
  document.body.style.overflow = '';
}
function handleCardOverlay(e){
  if(e.target===document.getElementById('card-overlay')) closeCard();
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeCard(); });

function toggleSec(hdr){
  hdr.classList.toggle('open');
}

function cardAction(type){
  console.log('Action:', type);
  // Hook your own handlers here
}

/* Public API */
function openStudentCard(data){ openCard(buildStudentCard(data)); }
function openTeacherCard(data){ openCard(buildTeacherCard(data)); }
