<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ALM · Card Component · Child View</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:   #B0D4D2; --teal-d:  #7ABAB8;
  --pink:   #F2ADDA; --pink-d:  #E07DC0;
  --ultra:  #9AADF6; --ultra-d: #6080E8;
  --desert: #BFA48F; --desert-d:#A08060;
  --sun:    #FFD166; --sun-d:   #F0B429;
  --mint:   #A8EDBC; --mint-d:  #5DD68A;
  --cream:  #FDFAF4;
  --warm:   #F7F0E6;
  --text:   #3A3040;
  --text2:  #7A6E82;
  --card-bg:#FFFFFF;
  --round:  26px;
  --sans:   'Nunito',system-ui,sans-serif;
}

body{
  background:var(--warm);
  background-image:
    radial-gradient(circle at 20% 20%, rgba(176,212,210,.35) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(242,173,218,.3) 0%, transparent 50%),
    radial-gradient(circle at 60% 10%, rgba(255,209,102,.2) 0%, transparent 40%);
  font-family:var(--sans);
  color:var(--text);
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:18px;padding:20px;
}

/* ─── DEMO BUTTONS ─── */
.demo-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.demo-btn{
  padding:10px 20px;border:none;
  background:white;
  color:var(--text2);
  font-family:var(--sans);font-size:13px;font-weight:700;
  cursor:pointer;transition:all .18s;
  border-radius:50px;
  box-shadow:0 4px 14px rgba(0,0,0,.08);
}
.demo-btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.12)}

/* ─── OVERLAY ─── */
.card-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(58,48,64,.35);z-index:1000;
  align-items:center;justify-content:center;
  padding:20px;
  backdrop-filter:blur(10px);
}
.card-overlay.open{
  display:flex;
  animation:overlayIn .22s ease;
}
@keyframes overlayIn{from{opacity:0}to{opacity:1}}

/* ─── CARD ─── */
.alm-card{
  width:min(400px,94vw);
  background:var(--card-bg);
  border-radius:32px;
  overflow:hidden;
  box-shadow:0 30px 80px rgba(58,48,64,.22), 0 2px 8px rgba(0,0,0,.06);
  animation:cardIn .28s cubic-bezier(.22,.61,.36,1);
}
@keyframes cardIn{
  from{opacity:0;transform:scale(.92) translateY(20px)}
  to{opacity:1;transform:none}
}

/* ─── BANNER ─── */
.card-banner{
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:28px 20px 24px;
  gap:14px;
}
.banner-bg{
  position:absolute;inset:0;
  transition:background .4s;
}
/* soft inner glow */
.banner-bg::after{
  content:'';
  position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.22) 0%, transparent 70%);
}
.banner-close{
  position:absolute;top:14px;right:14px;
  width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,.38);
  border:none;
  color:rgba(0,0,0,.5);font-size:14px;font-weight:900;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .15s;z-index:10;
  font-family:var(--sans);
  backdrop-filter:blur(4px);
}
.banner-close:hover{background:rgba(255,255,255,.75);transform:scale(1.1)}

.dept-badge{
  position:absolute;top:14px;left:14px;
  font-family:var(--sans);font-size:11px;font-weight:800;
  letter-spacing:.04em;
  padding:5px 13px;border-radius:999px;
  z-index:10;
  background:rgba(255,255,255,.38);
  backdrop-filter:blur(4px);
}

/* ─── AVATAR (lives inside banner now) ─── */
.card-avatar-wrap{
  position:relative;z-index:5;
  display:flex;justify-content:center;
}
.card-avatar{
  width:110px;height:110px;border-radius:50%;
  border:5px solid rgba(255,255,255,.7);
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  font-family:var(--sans);font-size:36px;font-weight:900;
  flex-shrink:0;
  box-shadow:0 8px 32px rgba(0,0,0,.18), 0 2px 8px rgba(0,0,0,.12);
}
.card-avatar img{width:100%;height:100%;object-fit:cover}

/* banner name strip */
.banner-name{
  position:relative;z-index:5;
  text-align:center;
}
.banner-name-text{
  font-size:22px;font-weight:900;
  color:white;
  text-shadow:0 2px 12px rgba(0,0,0,.18);
  letter-spacing:-.01em;
  line-height:1.1;
}
.banner-ref{
  font-size:12px;font-weight:700;
  color:rgba(255,255,255,.72);
  margin-top:3px;
  letter-spacing:.04em;
}

/* ─── BODY ─── */
.card-body{
  padding:18px 28px 26px;
  display:flex;flex-direction:column;
  align-items:center;
  text-align:center;
}

/* ─── SOCIAL ROW ─── */
.social-row{
  display:flex;gap:16px;
  margin:18px 0;
  align-items:center;justify-content:center;
}
.social-icon{
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;
  background:var(--warm);
  transition:transform .15s;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.07);
}
.social-icon:hover{transform:scale(1.18) rotate(-5deg)}

/* ─── TAGS ─── */
.card-tags{
  display:flex;gap:8px;flex-wrap:wrap;
  justify-content:center;
  margin:6px 0 14px;
}
.card-tag{
  font-size:12px;font-weight:800;
  padding:6px 16px;border-radius:999px;
  letter-spacing:.01em;
}

/* ─── BIO ─── */
.card-bio{
  font-size:14px;font-weight:600;
  color:var(--text2);
  line-height:1.6;
  max-width:300px;
  margin:0 auto;
}
.card-company{
  font-size:13px;font-weight:700;
  margin-top:10px;
}

/* ─── HOURS BAR ─── */
.hours-wrap{
  width:100%;
  background:var(--warm);
  border-radius:16px;
  padding:14px 16px;
  margin-top:18px;
}
.hours-label{
  display:flex;justify-content:space-between;
  font-size:12px;font-weight:800;
  color:var(--text2);
  margin-bottom:8px;
}
.hours-track{
  height:10px;background:rgba(0,0,0,.06);
  border-radius:99px;overflow:hidden;
}
.hours-fill{
  height:100%;border-radius:99px;
  transition:width .8s cubic-bezier(.22,.61,.36,1);
}

/* ─── TURMAS ─── */
.turma-row{
  display:flex;flex-wrap:wrap;gap:6px;
  justify-content:center;
  margin-top:14px;width:100%;
}
.turma-pill{
  font-size:11px;font-weight:800;
  padding:5px 13px;border-radius:999px;
  letter-spacing:.02em;
}

/* ─── ACTIONS ─── */
.card-actions{
  display:flex;gap:10px;
  margin-top:20px;
  justify-content:center;
  width:100%;
}
.card-action{
  flex:1;
  display:flex;flex-direction:column;align-items:center;
  gap:6px;padding:14px 8px;
  background:var(--warm);
  border:none;border-radius:20px;
  cursor:pointer;transition:all .18s;
  font-family:var(--sans);
}
.card-action:hover{
  transform:translateY(-3px);
  box-shadow:0 8px 20px rgba(0,0,0,.1);
}
.ca-icon{font-size:22px}
.ca-lbl{
  font-size:10px;font-weight:800;
  color:var(--text2);
  letter-spacing:.04em;
  text-transform:uppercase;
}

/* ─── DEMO TITLE ─── */
.demo-title{
  font-family:var(--sans);font-size:12px;font-weight:700;
  color:rgba(58,48,64,.35);letter-spacing:.1em;
  text-transform:uppercase;text-align:center;
}
</style>
</head>
<body>

<div class="demo-title">ALM · Child View · Demo</div>
<div class="demo-row">
  <button class="demo-btn" onclick="demoStudent('infantil')">👶 Infantil</button>
  <button class="demo-btn" onclick="demoStudent('juvenil')">🧒 Juvenil</button>
  <button class="demo-btn" onclick="demoStudent('geral')">📘 Geral</button>
  <button class="demo-btn" onclick="demoStudent('exam')">🎓 Exames</button>
  <button class="demo-btn" onclick="demoTeacher('EN')">🇬🇧 Teacher EN</button>
  <button class="demo-btn" onclick="demoTeacher('FR')">🇫🇷 Teacher FR</button>
</div>

<!-- OVERLAY -->
<div class="card-overlay" id="card-overlay" onclick="handleOverlay(event)">
  <div class="alm-card" id="alm-card" onclick="event.stopPropagation()"></div>
</div>

<script>
/* ── PALETTE ── */
const DEPT = {
  infantil:{ grad:['#B0D4D2','#7DC8C8'], wave:'#B0D4D2', badgeC:'#3A7A78', badgeBg:'rgba(176,212,210,.45)', tag:'#7ABAB8', tagBg:'rgba(176,212,210,.25)', label:'Infantil 🌱' },
  juvenil: { grad:['#F2ADDA','#E888CC'], wave:'#F2ADDA', badgeC:'#8A2060', badgeBg:'rgba(242,173,218,.45)', tag:'#D060A8', tagBg:'rgba(242,173,218,.25)', label:'Juvenil 🌟' },
  geral:   { grad:['#9AADF6','#7090F8'], wave:'#9AADF6', badgeC:'#2040AA', badgeBg:'rgba(154,173,246,.45)', tag:'#5070E8', tagBg:'rgba(154,173,246,.25)', label:'Geral 📘' },
  exam:    { grad:['#F0C890','#D4A060'], wave:'#F0C890', badgeC:'#7A4A10', badgeBg:'rgba(240,200,144,.45)', tag:'#B07830', tagBg:'rgba(240,200,144,.25)', label:'Exames 🎓' },
};

const LANG = {
  EN:{ col:'#4A8FF5', bg:'rgba(74,143,245,.18)', flag:'🇬🇧' },
  PT:{ col:'#C8A44A', bg:'rgba(200,164,74,.18)',  flag:'🇵🇹' },
  FR:{ col:'#9B5ECA', bg:'rgba(155,94,202,.18)',  flag:'🇫🇷' },
  ES:{ col:'#E8A020', bg:'rgba(232,160,32,.18)',  flag:'🇪🇸' },
  DE:{ col:'#28C8B0', bg:'rgba(40,200,176,.18)',  flag:'🇩🇪' },
};

function avColor(name){
  let h=0;
  for(let i=0;i<(name||'').length;i++) h=(h*31+name.charCodeAt(i))&0xffffffff;
  const palette=[
    {bg:'#FFD6E0',text:'#C94070'},{bg:'#C8E6F5',text:'#2878B0'},
    {bg:'#D4F0C8',text:'#3A8830'},{bg:'#E8D8F8',text:'#7040C0'},
    {bg:'#FFE8C0',text:'#C07020'},{bg:'#C8F0E8',text:'#208870'},
  ];
  return palette[Math.abs(h)%palette.length];
}
function initials(n){return(n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase()}

/* wave path */
function waveSvg(color){
  return `<svg class="banner-wave" viewBox="0 0 400 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,30 C60,55 120,5 200,28 C280,50 340,10 400,30 L400,60 L0,60 Z" fill="white"/>
  </svg>`;
}

/* ── STUDENT CARD ── */
function buildStudentCard(data){
  const dc = DEPT[data.dept]||DEPT.geral;
  const lc = LANG[data.lang]||LANG.EN;
  const av = avColor(data.name);
  const ini= initials(data.name);

  return `
    <div class="card-banner">
      <div class="banner-bg" style="background:linear-gradient(145deg,${dc.grad[0]},${dc.grad[1]})"></div>
      <button class="banner-close" onclick="closeCard()">✕</button>
      <div class="dept-badge" style="color:${dc.badgeC};background:${dc.badgeBg}">${dc.label}</div>
      <div class="card-avatar-wrap">
        <div class="card-avatar" style="background:${av.bg}">
          ${data.photo?`<img src="${data.photo}" alt="${data.name}"/>`:`<span style="color:${av.text}">${ini}</span>`}
        </div>
      </div>
      <div class="banner-name">
        <div class="banner-name-text">${data.name||'—'}</div>
        <div class="banner-ref">${data.ref||'—'}</div>
      </div>
    </div>

    <div class="card-body">
      <div class="card-tags">
        <span class="card-tag" style="background:${dc.tagBg};color:${dc.tag}">${data.level||'—'}</span>
        <span class="card-tag" style="background:${lc.bg};color:${lc.col}">${lc.flag} ${data.lang||'EN'}</span>
        ${data.turma?`<span class="card-tag" style="background:rgba(93,214,138,.2);color:#28A860">✓ ${data.turma}</span>`:''}
      </div>

      <div class="card-bio">
        ${data.branch||'Funchal'} · Inscrito em ${data.enrolDate||'—'}
      </div>
      <div class="card-company" style="color:${dc.tag}">
        ${data.status==='atribuido'?'✓ Turma atribuída':'⏳ A aguardar atribuição'}
      </div>

      <div class="card-actions">
        <button class="card-action" onclick="cardAction('timetable')">
          <span class="ca-icon">📅</span><span class="ca-lbl">Horário</span>
        </button>
        <button class="card-action" onclick="cardAction('message')">
          <span class="ca-icon">✉️</span><span class="ca-lbl">Mensagem</span>
        </button>
        <button class="card-action" onclick="cardAction('payment')">
          <span class="ca-icon">💳</span><span class="ca-lbl">Pagamento</span>
        </button>
      </div>
    </div>`;
}

/* ── TEACHER CARD ── */
function buildTeacherCard(data){
  const lc  = LANG[data.lang]||LANG.EN;
  const av  = avColor(data.name);
  const ini = initials(data.name);
  const pct = data.contractH?Math.round(data.usedH/data.contractH*100):0;
  const barCol= pct>=90?'#E8455A':pct>=75?'#F0B429':'#5DD68A';
  const turmas= data.turmas||[];

  const teacherGrad = [lc.col+'CC', lc.col+'88'];

  return `
    <div class="card-banner">
      <div class="banner-bg" style="background:linear-gradient(145deg,${teacherGrad[0]},${teacherGrad[1]})"></div>
      <button class="banner-close" onclick="closeCard()">✕</button>
      <div class="dept-badge" style="color:white;background:rgba(255,255,255,.35)">${lc.flag} ${data.lang}${data.native?' · Nativo':''}</div>
      <div class="card-avatar-wrap">
        <div class="card-avatar" style="background:${av.bg}">
          ${data.photo?`<img src="${data.photo}" alt="${data.name}"/>`:`<span style="color:${av.text}">${ini}</span>`}
        </div>
      </div>
      <div class="banner-name">
        <div class="banner-name-text">${data.name||'—'}</div>
        <div class="banner-ref">${data.code||'—'} · Professor</div>
      </div>
    </div>

    <div class="card-body">
      <div class="card-tags">
        <span class="card-tag" style="background:${lc.bg};color:${lc.col}">${lc.flag} ${data.lang}</span>
        ${data.native?`<span class="card-tag" style="background:rgba(93,214,138,.2);color:#28A860">Nativo</span>`:''}
        <span class="card-tag" style="background:rgba(0,0,0,.05);color:var(--text2)">${data.branch||'Funchal'}</span>
      </div>

      <div class="hours-wrap">
        <div class="hours-label">
          <span>Horas semanais</span>
          <span style="color:${barCol}">${data.usedH||0}h / ${data.contractH||22}h</span>
        </div>
        <div class="hours-track">
          <div class="hours-fill" style="width:${Math.min(100,pct)}%;background:${barCol}"></div>
        </div>
      </div>

      ${turmas.length?`
      <div class="turma-row">
        ${turmas.map(t=>`<div class="turma-pill" style="background:${lc.bg};color:${lc.col}">${t}</div>`).join('')}
      </div>`:''}

      <div class="card-actions">
        <button class="card-action" onclick="cardAction('schedule')">
          <span class="ca-icon">📅</span><span class="ca-lbl">Horário</span>
        </button>
        <button class="card-action" onclick="cardAction('turmas')">
          <span class="ca-icon">📚</span><span class="ca-lbl">Turmas</span>
        </button>
        <button class="card-action" onclick="cardAction('message')">
          <span class="ca-icon">✉️</span><span class="ca-lbl">Mensagem</span>
        </button>
      </div>
    </div>`;
}

/* ── OPEN / CLOSE ── */
function openCard(html){
  document.getElementById('alm-card').innerHTML=html;
  document.getElementById('card-overlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeCard(){
  document.getElementById('card-overlay').classList.remove('open');
  document.body.style.overflow='';
}
function handleOverlay(e){
  if(e.target===document.getElementById('card-overlay')) closeCard();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCard();});
function cardAction(t){console.log('Action:',t);}

/* ── DEMO DATA ── */
function demoStudent(dept){
  const d={
    infantil:{ref:'ALM-0342',name:'Beatriz Nóbrega',dept:'infantil',level:'PI-a2',lang:'EN',branch:'Funchal',status:'pendente',enrolDate:'12 Set 2025'},
    juvenil: {ref:'ALM-0615',name:'Artur Alves Lopes',dept:'juvenil',level:'Pj1',lang:'EN',branch:'Funchal',status:'pendente',enrolDate:'08 Set 2025'},
    geral:   {ref:'ALM-0870',name:'Sofia Marques',dept:'geral',level:'2º Ano',lang:'EN',branch:'Funchal',status:'atribuido',turma:'2627-0042',enrolDate:'05 Set 2025'},
    exam:    {ref:'ALM-1124',name:'Tomás Ferreira',dept:'exam',level:'7th C1',lang:'EN',branch:'Funchal',status:'atribuido',turma:'2627-0088',enrolDate:'03 Set 2025'},
  };
  openCard(buildStudentCard(d[dept]));
}
function demoTeacher(lang){
  const d={
    EN:{code:'TK',name:'Tony Kennedy',lang:'EN',native:true,branch:'Funchal',contractH:22,usedH:18,turmas:['2627-0012','2627-0014','2627-0031','2627-0044','2627-0067','2627-0088']},
    FR:{code:'CM',name:'Catherine Moreau',lang:'FR',native:false,branch:'Funchal',contractH:22,usedH:14,turmas:['2627-0091','2627-0095','2627-0099','2627-0102']},
  };
  openCard(buildTeacherCard(d[lang]));
}

/* Auto-open Infantil on load so it's immediately visible */
window.addEventListener('load',()=>demoStudent('infantil'));
</script>
</body>
</html>
