async function sendRequest(){
  const doc=document.getElementById('rq-doc').value.trim();
  if(!doc){ toast('Indique o documento','warn'); return; }
  try{
    await sbUpsert('teacher_requests',[{teacher_id:ME.id, teacher_name:ME.name,
      turma_code:document.getElementById('rq-turma').value, type:'foto', document:doc,
      copies:parseInt(document.getElementById('rq-n').value)||1,
      sides:document.getElementById('rq-sides').value,
      urgency:document.getElementById('rq-urg').value,
      observations:document.getElementById('rq-obs').value,
      status:'pending', created_at:new Date().toISOString()}]);
    toast('Pedido enviado');
    document.getElementById('rq-doc').value=''; document.getElementById('rq-obs').value='';
  }catch(e){ toast('Erro: '+e.message,'err'); }
}

/* ══════════════════════════════════════════════════════════════════════
   THE PAUTA — a year of attendance for one class
   ══════════════════════════════════════════════════════════════════════ */
let pautaCode = null;
function renderPautaTabs(){
  if(!CLASSES.length){
    document.getElementById('pauta-tabs').innerHTML='';
    document.getElementById('pauta-body').innerHTML=
      '<div class="sh-empty">A pauta anual abre assim que houver uma turma atribuída.</div>';
    return;
  }
  document.getElementById('pauta-tabs').innerHTML = CLASSES.map(c=>
    `<button class="chip ${c.code===pautaCode?'on':''}" onclick="showPauta('${c.code}')">${esc(c.code)}</button>`).join('');
}
function showPauta(code){
  pautaCode = code;
  switchPanel('pauta');
  renderPautaTabs();
  const c = CLASSES.find(x=>x.code===code);
  const host = document.getElementById('pauta-body');
  if(!c){ host.innerHTML='<div class="sh-empty">Turma não encontrada.</div>'; return; }
  const dates = pastDatesFor(c), today = todayISO();
  if(!dates.length){
    const n = lessonDates(c.day).length, first = firstLessonOf(c);
    host.innerHTML = termState()==='before'
      ? `<div class="notice"><b>A pauta abre no primeiro dia de aulas.</b>
          ${esc(code)} tem ${n} aulas marcadas no calendário, a primeira a
          ${first?fmtLong(first):'—'}.</div>`
      : '<div class="sh-empty">Ainda não houve aulas nesta turma.</div>';
    return;
  }
  const students = c.refs.map(r=>({ref:r,name:ENROL[r]?.name||r}))
    .sort((a,b)=>a.name.localeCompare(b.name));

  const head1 = dates.map((d,i)=>`<th class="${d===today?'today-col':''}" title="${fmtLong(d)}">${String(i+1).padStart(2,'0')}</th>`).join('');
  const head2 = dates.map(d=>{ const dt=new Date(d+'T12:00:00');
    return `<th class="${d===today?'today-col':''}" style="font-weight:500;color:var(--faint)" title="${fmtLong(d)}">${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}</th>`; }).join('');

  const body = students.map(s=>{
    const t = tallyFor(c.code, s.ref, dates);
    const pct = t.marked ? Math.round(t.p/t.marked*100) : null;
    const flag = absenceFlag(c.code, s.ref);
    const cells = dates.map(d=>{
      const st = statusOf(c.code,s.ref,d);
      const m = st==='present'?'<span class="mk m-p">●</span>'
              : st==='absent'?'<span class="mk m-a">✕</span>'
              : st==='late'  ?'<span class="mk m-l">▲</span>'
              :               '<span class="mk m-o">·</span>';
      return `<td class="${d===today?'today-col':''}" title="${fmtLong(d)} · ${st||'sem registo'}"
        onclick="openLesson('${c.code}','${d}')" style="cursor:pointer">${m}</td>`;
    }).join('');
    return `<tr>
      <td class="stick-a" style="text-align:center;font-weight:600">${esc(s.ref)}</td>
      <td class="stick-b"><span class="reg-name" onclick="openStudent('${s.ref}')">${esc(s.name)}</span>
        ${flag?`<span class="att-flag" style="margin-left:6px">${flag.n}</span>`:''}</td>
      ${cells}
      <td class="tot" style="color:var(--sage-deep)">${t.p}</td>
      <td class="tot" style="color:${t.a?'var(--alert)':'var(--faint)'}">${t.a}</td>
      <td class="tot" style="color:${t.l?'var(--clay)':'var(--faint)'}">${t.l}</td>
      <td class="tot" style="color:${pct==null?'var(--faint)':pct>=80?'var(--sage-deep)':pct>=60?'var(--clay)':'var(--alert)'}">${pct==null?'—':pct+'%'}</td>
    </tr>`;
  }).join('');

  const foot = dates.map(d=>{
    let p=0; students.forEach(s=>{ if(statusOf(c.code,s.ref,d)==='present') p++; });
    return `<td class="${d===today?'today-col':''}" title="${fmtLong(d)} · ${p}/${students.length}">${isMarked(c.code,d)?p:'–'}</td>`;
  }).join('');

  host.innerHTML = `
    <div class="strip">
      <span class="lc-code">${esc(c.code)}</span>
      <span class="lc-meta">${DAY_FULL[c.day]} · ${c.start}–${c.end} · ${esc(c.level)}</span>
      <span class="lc-meta">${dates.length} aulas dadas · ${students.length} alunos</span>
      <button class="sh-btn" style="margin-left:auto" onclick="exportPauta('${c.code}')">Exportar CSV</button>
    </div>
    <div class="reg"><table>
      <thead>
        <tr><th class="stick-a">Ref</th><th class="stick-b">Nome</th>${head1}
          <th class="tot">P</th><th class="tot">F</th><th class="tot">A</th><th class="tot">%</th></tr>
        <tr><th class="stick-a"></th><th class="stick-b"></th>${head2}
          <th class="tot"></th><th class="tot"></th><th class="tot"></th><th class="tot"></th></tr>
      </thead>
      <tbody>${body}</tbody>
      <tfoot><tr><td class="stick-a">—</td><td class="stick-b" style="text-align:left">Presentes</td>${foot}
        <td colspan="4"></td></tr></tfoot>
    </table></div>
    <div class="reg-legend">
      <span style="color:var(--sage-deep)">● Presente</span>
      <span style="color:var(--alert)">✕ Falta</span>
      <span style="color:var(--clay)">▲ Atraso</span>
      <span style="color:var(--faint)">· Sem registo</span>
      <span style="margin-left:auto">Clique numa coluna para abrir essa aula · clique num nome para o dossier</span>
    </div>`;
}

function exportPauta(code){
  const c = CLASSES.find(x=>x.code===code); if(!c) return;
  const dates = pastDatesFor(c);
  const rows = [`ALM,${code},${AY||''}`, '',
    ['Ref','Nome',...dates.map(d=>fmtShort(d)),'P','F','A','%'].join(',')];
  c.refs.map(r=>({ref:r,name:ENROL[r]?.name||r})).sort((a,b)=>a.name.localeCompare(b.name))
    .forEach(s=>{
      const t = tallyFor(code,s.ref,dates);
      const pct = t.marked?Math.round(t.p/t.marked*100):'';
      rows.push([s.ref,`"${s.name}"`,...dates.map(d=>({present:'P',absent:'F',late:'A'})[statusOf(code,s.ref,d)]||''),
        t.p,t.a,t.l,pct].join(','));
    });
  const blob = new Blob([rows.join('\n')],{type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `ALM-${code}-pauta.csv`; a.click();
  toast('CSV exportado');
}

/* ══════════════════════════════════════════════════════════════════════
   THE LESSON SHEET
   Opened with a turma code and a DATE. Not an index, not a number —
   the date. Everything inside reads and writes against it.
   ══════════════════════════════════════════════════════════════════════ */
function closeSheet(id){ const el=document.getElementById(id); el.classList.remove('on'); el.innerHTML=''; }
function hostFor(id){ const el=document.getElementById(id);
  el.onclick = e => { if(e.target===el) closeSheet(id); }; return el; }

function openNextUnmarked(code){
  const c = CLASSES.find(x=>x.code===code); if(!c) return;
  const un = unmarkedFor(c);
  const past = pastDatesFor(c);
  openLesson(code, un[0] || past[past.length-1] || lessonDates(c.day)[0]);
}

function openLesson(code, iso){
  const c = CLASSES.find(x=>x.code===code); if(!c) return;
  const dates = lessonDates(c.day);
  /* If the date handed in is not a teaching day for this class — a cell
     clicked in a holiday week, a stale link — snap to the nearest real
     lesson on or before it and SAY SO, rather than opening a day that
     does not exist. */
  let date = iso, snapped = false;
  if(!dates.includes(date)){
    const before = dates.filter(d=>d<=iso);
    date = before[before.length-1] || dates[0] || null;
    snapped = !!date;
  }
  if(!date){ toast('Esta turma não tem aulas no calendário lectivo','warn'); return; }
  sheetLesson = {cls:c, date};
  attDraft = {};
  c.refs.forEach(r=>{ const s=statusOf(code,r,date); if(s) attDraft[r]=s; });
  paintLesson();
  if(snapped){
    /* Before term there IS no previous lesson — the snap lands on the
       first one, and saying "a aula anterior" would be a lie. */
    const first = lessonDates(c.day)[0];
    toast(date===first && date>todayISO()
      ? `Sem aula nesse dia — aberta a primeira aula, ${fmtShort(date)}`
      : `Sem aula nesse dia — aberta a aula de ${fmtShort(date)}`, 'warn');
  }
}

function paintLesson(){
  const {cls:c, date} = sheetLesson;
  const dates = lessonDates(c.day);
  const idx   = dates.indexOf(date);
  const today = todayISO();
  const marked= isMarked(c.code, date);
  const sum   = SUMS[c.code]?.[date] || {};
  const d     = DEPT[deptOf(c)];

  const rail = dates.map((iso,i)=>{
    const st = ['rc', isMarked(c.code,iso)?'done':'', iso===today?'today':'',
                iso>today?'future':'', iso===date?'sel':''].filter(Boolean).join(' ');
    const dt = new Date(iso+'T12:00:00');
    return `<button class="${st}" data-iso="${iso}" title="${fmtLong(iso)}">
      <span class="rc-n">${String(i+1).padStart(2,'0')}</span>
      <span class="rc-d">${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}</span>
    </button>`;
  }).join('');

  const roster = c.refs.map(r=>({ref:r,name:ENROL[r]?.name||r}))
    .sort((a,b)=>a.name.localeCompare(b.name))
    .map((s,i)=>{
      const st = attDraft[s.ref] || null;
      const cl = st==='present'?'p':st==='late'?'l':st==='absent'?'a':'';
      const ic = st==='present'?'✓':st==='late'?'⏱':st==='absent'?'✕':'·';
      const lb = st==='present'?'PRESENTE':st==='late'?'ATRASO':st==='absent'?'FALTA':'—';
      const av = avCol(s.name);
      const flag = absenceFlag(c.code, s.ref);
      return `<div class="att-row ${cl}" data-ref="${s.ref}">
        <button class="att-mark" data-cycle="${s.ref}">${ic}</button>
        <span class="att-num">${String(i+1).padStart(2,'0')}</span>
        <div class="sh-av" style="background:${av.bg};color:${av.t};cursor:pointer" data-stu="${s.ref}">${avInit(s.name)}</div>
        <div class="att-mid" data-cycle="${s.ref}">
          <div class="sh-name">${esc(s.name)}</div>
          <div class="sh-meta">${esc(s.ref)}</div>
        </div>
        ${flag?`<span class="att-flag" title="${flag.minor?'menor de idade':'adulto'}">${flag.n} faltas</span>`:''}
        <span class="att-st">${lb}</span>
        ${actionsFor(s.ref)}
      </div>`;
    }).join('');

  const host = document.getElementById('sh-lesson');
  host.innerHTML = `<div class="lp">

    <div class="lp-top">
      <button class="lp-back" data-close>&#8592; Semana</button>
      <span class="lp-code">${esc(c.code)}</span>
      <span class="lp-when">${fmtLong(date)} &middot; ${c.start}&ndash;${c.end}</span>
      <span class="lp-tag">${d.label} &middot; ${esc(c.level)}</span>
      <span class="lp-tag">Aula ${String(idx+1).padStart(2,'0')}/${dates.length}</span>
      <span class="lp-tag ${marked?'on':'pend'}">${marked?'Marcada':'Por marcar'}</span>
      ${date>today?'<span class="lp-tag pend">Futura</span>':''}
      <span class="lp-counts">
        <span class="lp-k" data-roster="present"><span class="lp-kv" id="k-p">0</span><span class="lp-kl">pres</span></span>
        <span class="lp-k" data-roster="late"><span class="lp-kv" id="k-l">0</span><span class="lp-kl">atr</span></span>
        <span class="lp-k" data-roster="absent"><span class="lp-kv" id="k-a">0</span><span class="lp-kl">falt</span></span>
        <span class="lp-k" data-roster="none"><span class="lp-kv" id="k-o">0</span><span class="lp-kl">s/ marca</span></span>
        <span class="lp-dirty" id="save-note"></span>
        <button class="lp-save" id="btn-save">Guardar</button>
      </span>
    </div>

    <div class="lp-rail"><div class="lp-track" id="rail">${rail}</div></div>

    <div class="lp-bar">
      <button class="lp-tab active" data-pane="pres">Presen&ccedil;as</button>
      <button class="lp-tab" data-pane="sum">Sum&aacute;rio</button>
      <button class="lp-tab" data-pane="msg">Mensagem</button>
      <span class="lp-bulk">
        <button class="lp-b sage" data-all="present">Todos presentes</button>
        <button class="lp-b" data-all="">Limpar</button>
        <button class="lp-b" data-all="absent">Todos faltam</button>
      </span>
    </div>

    <div class="lp-body">
      <div class="sh-pane active" id="pane-pres">
        <div class="lp-roster">${roster ? `<div class="reg-h">
            <span class="rh-m">&nbsp;</span><span class="rh-n">N&ordm;</span>
            <span class="rh-a">Aluno</span><span class="rh-s">Estado</span>
            <span class="rh-x">Ac&ccedil;&otilde;es</span></div>` + roster
          : '<div class="sh-empty">Esta turma n&atilde;o tem alunos inscritos.</div>'}</div>
      </div>

      <div class="sh-pane" id="pane-sum">
        <div class="lp-roster">
          <div class="sh-sec">Sum&aacute;rio da aula</div>
          <textarea class="inp" id="s-text" placeholder="Conte&uacute;dos abordados&hellip;">${esc(sum.summary_text||'')}</textarea>
          <div class="sh-g2" style="margin-top:8px">
            <div><div class="sh-fk">Livro / p&aacute;gina</div><input class="inp" id="s-book" value="${esc(sum.book_page||'')}"/></div>
            <div><div class="sh-fk">Compet&ecirc;ncia</div><select class="inp" id="s-skill">
              ${['','Speaking','Listening','Reading','Writing','Grammar','Vocabulary','Pronunciation']
                .map(o=>`<option ${o===(sum.skill||'')?'selected':''}>${o}</option>`).join('')}</select></div>
            <div><div class="sh-fk">Participa&ccedil;&atilde;o</div><select class="inp" id="s-part">
              ${['','Excelente','Boa','Satisfat&oacute;ria','Fraca']
                .map(o=>`<option ${o===(sum.participation||'')?'selected':''}>${o}</option>`).join('')}</select></div>
            <div><div class="sh-fk">Observa&ccedil;&otilde;es</div><input class="inp" id="s-obs" value="${esc(sum.observations||'')}"/></div>
          </div>
          <div class="sh-sec">Trabalho de casa</div>
          <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px" id="tpc">
            ${['Exerc&iacute;cios livro','Composi&ccedil;&atilde;o','Leitura','Revis&atilde;o gram&aacute;tica','Vocabul&aacute;rio']
              .map(t=>`<button class="chip ${(sum.tpc||'').includes(t)?'on':''}">${t}</button>`).join('')}
          </div>
          <div class="sh-g2">
            <div><div class="sh-fk">Refer&ecirc;ncia</div><input class="inp" id="s-tpc-ref" value="${esc(sum.tpc_ref||'')}"/></div>
            <div><div class="sh-fk">Entregar em</div><input class="inp" id="s-tpc-due" type="date" value="${esc(sum.tpc_due||'')}"/></div>

          <div class="sh-sec">Mensagem interna</div>
          <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px" id="msg-to">
            ${['Direc&ccedil;&atilde;o','Secretaria','Operacional'].map(t=>`<button class="chip">${t}</button>`).join('')}
          </div>
          <input class="inp" id="m-subj" placeholder="Assunto"/>
          <textarea class="inp" id="m-body" style="margin-top:8px" placeholder="Mensagem&hellip;"></textarea>

  host.classList.add('on');
  wireLesson();
  updateCounts();
  const sel = host.querySelector('.rc.sel');
  if(sel) sel.parentElement.scrollLeft = sel.offsetLeft - sel.parentElement.offsetWidth/2 + 29;

/* ── PER-STUDENT ACTIONS ──────────────────────────────────────────
   Disabled rather than hidden when the contact is missing: "why is
   there no phone icon" is a worse question than "why is the phone
   greyed out", and the greyed one tells you the record is incomplete. */
const ICON = {
  ficha:'<path d="M4 4h10l6 6v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M14 4v6h6"/>',
  wa:   '<path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 21l2.2-5.2A8.5 8.5 0 1 1 21 11.5z"/>',
  ee:   '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2 4.2 2 2 0 0 1 4 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.6a2 2 0 0 1-.5 2.1L8.1 9.6a16 16 0 0 0 6 6l1.2-1.1a2 2 0 0 1 2.1-.5c.8.3 1.7.6 2.6.7a2 2 0 0 1 1.7 2z"/>',
  mail: '<path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M22 6l-10 7L2 6"/>',
  note: '<path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/>',
  office:'<path d="M3 21V7l9-4 9 4v14"/><path d="M9 21v-6h6v6"/>',
};
function ic(k){ return `<svg viewBox="0 0 24 24">${ICON[k]}</svg>`; }

function actionsFor(ref){
  const e = ENROL[ref] || {};
  const tel  = (e.phone||'').replace(/\D/g,'');
  const gtel = (e.guardian_phone||'').replace(/\D/g,'');
  const mail = e.email || e.guardian_email || '';
  const b = (k,t,on,dis) =>
    `<button data-act="${k}" data-ref="${ref}" title="${esc(t)}"${dis?' disabled':''}${on?' class="on"':''}>${ic(k)}</button>`;
  return `<span class="act">
    ${b('ficha','Dossier do aluno')}
    ${b('wa', tel?`WhatsApp · ${e.phone}`:'Sem telefone do aluno', false, !tel)}
    ${b('ee', gtel?`Ligar ao EE · ${e.guardian_name||''} ${e.guardian_phone}`:'Sem telefone do EE', false, !gtel)}
    ${b('mail', mail?`Email · ${mail}`:'Sem email', false, !mail)}
    ${b('note', (e.notes||'').trim()?'Nota interna (tem nota)':'Nota interna', !!(e.notes||'').trim())}
    ${b('office','Mensagem à secretaria sobre este aluno')}
  </span>`;
}

/* Direct where it can be direct; a tooltip only where words are
   needed. Neither ever leaves the register. */
function runAction(k, ref, btn){
  const e = ENROL[ref] || {};
  const tel  = (e.phone||'').replace(/\D/g,'');
  const gtel = (e.guardian_phone||'').replace(/\D/g,'');
  const mail = e.email || e.guardian_email || '';
  if(k==='ficha')  return openStudent(ref);
  if(k==='wa')     return tel  && window.open(`https://wa.me/${tel}`,'_blank');
  if(k==='ee')     return gtel && (window.location.href = `tel:${gtel}`);
  if(k==='mail')   return mail && (window.location.href =
      `mailto:${mail}?subject=${encodeURIComponent(`${sheetLesson.cls.code} · ${e.name||ref}`)}`);
  if(k==='note')   return openTip(btn, ref, 'note');
  if(k==='office') return openTip(btn, ref, 'office');
}

let _tip=null;
function closeTip(){ if(_tip){ _tip.remove(); _tip=null; } }
function openTip(btn, ref, kind){
  closeTip();
  const e = ENROL[ref] || {};
  const row = btn.closest('.att-row');
  const t = document.createElement('div');
  t.className = 'tip on';
  t.innerHTML = `
    <div class="tip-h">
      <div><div class="tip-t">${kind==='note'?'Nota interna':'Para a secretaria'}</div>
        <div class="tip-n">${esc(e.name||ref)}</div></div>
    </div>
    <div class="tip-b"><textarea id="tip-x" placeholder="${
      kind==='note' ? 'Visível para toda a equipa ALM…'
                    : 'Assunto para a secretaria ou direcção…'}">${
      kind==='note' ? esc(e.notes||'') : ''}</textarea></div>
    <div class="tip-f">
      <button class="sh-btn" data-x="cancel">Cancelar</button>
      <button class="sh-btn sage" style="margin-left:auto" data-x="ok">${
        kind==='note'?'Guardar nota':'Enviar'}</button>
    </div>`;
  row.appendChild(t);
  /* Anchored to the row, flipped up if it would fall off the bottom. */
  const r = row.getBoundingClientRect();
  t.style.right = '8px';
  t.style.top   = (r.bottom + 250 > window.innerHeight) ? 'auto' : '100%';
  t.style.bottom= (r.bottom + 250 > window.innerHeight) ? '100%' : 'auto';
  _tip = t;
  t.querySelector('#tip-x').focus();
  t.querySelector('[data-x="cancel"]').onclick = closeTip;
  t.querySelector('[data-x="ok"]').onclick = async () => {
    const v = t.querySelector('#tip-x').value.trim();
    if(!v){ closeTip(); return; }
    try{
      if(kind==='note'){
        await sbPatch('enrolments',`ref=eq.${encodeURIComponent(ref)}`,{notes:v});
        ENROL[ref] = {...e, notes:v};
        btn.classList.add('on');
        toast('Nota guardada');
      } else {
        await sbUpsert('messages',[{turma_code:sheetLesson.cls.code,
          lesson_date:sheetLesson.date, academic_year:AY||null,
          teacher_id:ME.id, teacher_name:ME.name, message_type:'internal_school',
          section:'internal', to_recipients:'Secretaria',
          subject:`${sheetLesson.cls.code} · ${e.name||ref}`, body:v,
          status:'pending', created_at:new Date().toISOString()}]);
        toast('Enviado à secretaria');
      }
      closeTip();
    }catch(err){ toast('Erro: '+err.message,'err'); }
  };
}

function wireLesson(){
  const host = document.getElementById('sh-lesson');
  host.querySelectorAll('.lp-tab').forEach(b=>b.onclick=()=>{
    host.querySelectorAll('.lp-tab').forEach(x=>x.classList.remove('active'));
    host.querySelectorAll('.sh-pane').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); host.querySelector('#pane-'+b.dataset.pane).classList.add('active');
  });
  host.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeSheet('sh-lesson'));
  host.querySelectorAll('[data-all]').forEach(b=>b.onclick=()=>markAll(b.dataset.all||null));
  host.querySelectorAll('[data-roster]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.roster; rosterAtt(k==='none'?null:k); });
  host.querySelector('#btn-save').onclick = saveLesson;
  /* Changing the rail changes the DATE, which is the record. Nothing
     else is carried across — that is the whole point. */
  host.querySelectorAll('.rc').forEach(b=>b.onclick=()=>{
    if(dirty() && !confirm('Há marcações por guardar. Mudar de aula e perdê-las?')) return;
    openLesson(sheetLesson.cls.code, b.dataset.iso);
  });
  host.querySelectorAll('[data-cycle]').forEach(el=>el.onclick=()=>cycle(el.dataset.cycle));
  host.querySelectorAll('[data-act]').forEach(el=>el.onclick=ev=>{
    ev.stopPropagation();               /* never toggles the mark */
    runAction(el.dataset.act, el.dataset.ref, el);
  });
  host.addEventListener('click', ev=>{ if(!ev.target.closest('.tip')
    && !ev.target.closest('[data-act]')) closeTip(); });
  host.querySelectorAll('[data-stu]').forEach(el=>el.onclick=e=>{
    e.stopPropagation(); openStudent(el.dataset.stu); });
  host.querySelectorAll('#tpc .chip, #msg-to .chip').forEach(c=>c.onclick=()=>c.classList.toggle('on'));
  const track = host.querySelector('#rail');
  let drag=false,x0=0,s0=0;
  track.addEventListener('mousedown',e=>{drag=true;x0=e.pageX;s0=track.scrollLeft;});
  window.addEventListener('mousemove',e=>{ if(drag) track.scrollLeft = s0-(e.pageX-x0); });
  window.addEventListener('mouseup',()=>{drag=false;});
}

function cycle(ref){
  const cur = attDraft[ref] || null;
  attDraft[ref] = cur===null ? 'present' : cur==='present' ? 'late' : cur==='late' ? 'absent' : null;
  if(attDraft[ref]===null) delete attDraft[ref];
  const row = document.querySelector(`.att-row[data-ref="${ref}"]`);
  const st = attDraft[ref] || null;
  row.className = 'att-row ' + (st==='present'?'p':st==='late'?'l':st==='absent'?'a':'');
  row.querySelector('.att-mark').textContent = st==='present'?'✓':st==='late'?'⏱':st==='absent'?'✕':'·';
  row.querySelector('.att-st').textContent = st==='present'?'PRESENTE':st==='late'?'ATRASO':st==='absent'?'FALTA':'—';
  updateCounts();
}
function markAll(v){
  sheetLesson.cls.refs.forEach(r=>{ if(v) attDraft[r]=v; else delete attDraft[r]; });
  paintLesson();
}
function updateCounts(){
  const refs = sheetLesson.cls.refs;
  const n = s => refs.filter(r=>(attDraft[r]||null)===s).length;
  document.getElementById('k-p').textContent = n('present');
  document.getElementById('k-l').textContent = n('late');
  document.getElementById('k-a').textContent = n('absent');
  document.getElementById('k-o').textContent = n(null);
  document.getElementById('save-note').textContent = dirty() ? 'alterações por guardar' : '';
}
function dirty(){
  const {cls,date} = sheetLesson;
  return cls.refs.some(r => (attDraft[r]||null) !== (statusOf(cls.code,r,date)||null));
}

async function saveLesson(){
  if(saving) return;
  const {cls,date} = sheetLesson;
  if(date > todayISO()){ toast('Não é possível marcar uma aula futura','warn'); return; }
  const marked = cls.refs.filter(r=>attDraft[r]);
  const btn = document.getElementById('btn-save');
  saving = true; btn.disabled = true; btn.textContent = 'A guardar…';
  try{
    if(marked.length){
      const now = new Date().toISOString();
      /* lesson_number is written for the register's sake and never read
         back. The primary key is (turma_code, student_ref, date). */
      await sbUpsert('attendance', marked.map(r=>({
        turma_code:cls.code, student_ref:r, student_name:ENROL[r]?.name||r,
        date, lesson_number:lessonNoOf(cls.day,date), status:attDraft[r],
        recorded_by:ME.id, recorded_at:now })), 'turma_code,student_ref,date');
      marked.forEach(r=>{
        ((ATT[cls.code]=ATT[cls.code]||{})[r] = ATT[cls.code][r]||{})[date] = attDraft[r];
      });
    }
    const text = document.getElementById('s-text')?.value || '';
    const anySum = text || document.getElementById('s-book')?.value || document.getElementById('s-obs')?.value;
    if(anySum){
      const row = {turma_code:cls.code, teacher_id:ME.code||ME.id, date,
        day:cls.day, hour:cls.hour, lesson_number:lessonNoOf(cls.day,date),
        summary_text:text, book_page:document.getElementById('s-book').value,
        skill:document.getElementById('s-skill').value,
        participation:document.getElementById('s-part').value,
        observations:document.getElementById('s-obs').value,
        tpc:[...document.querySelectorAll('#tpc .chip.on')].map(c=>c.textContent).join(', '),
        tpc_ref:document.getElementById('s-tpc-ref').value,
        tpc_due:document.getElementById('s-tpc-due').value || null,
        created_at:new Date().toISOString()};
      await sbUpsert('lesson_summaries',[row],'turma_code,date');
      (SUMS[cls.code]=SUMS[cls.code]||{})[date] = row;
    }
    setConn(true,'Supabase');
    toast(`Aula de ${fmtShort(date)} guardada`);
    paintLesson(); renderAll();
  }catch(e){
    setConn(false,'erro'); toast('Erro: '+e.message,'err');
  }finally{ saving=false; const b=document.getElementById('btn-save'); if(b){b.disabled=false;b.textContent='Guardar';} }
}

async function sendMessage(){
  const body = document.getElementById('m-body').value.trim();
  if(!body){ toast('Escreva a mensagem','warn'); return; }
  try{
    await sbUpsert('messages',[{turma_code:sheetLesson.cls.code, lesson_date:sheetLesson.date,
      academic_year:AY||null, teacher_id:ME.id, teacher_name:ME.name,
      message_type:'internal_school', section:'internal',
      to_recipients:[...document.querySelectorAll('#msg-to .chip.on')].map(c=>c.textContent).join(', ')||'Secretaria',
      subject:document.getElementById('m-subj').value, body, status:'pending',
      created_at:new Date().toISOString()}]);
    document.getElementById('m-subj').value=''; document.getElementById('m-body').value='';
    toast('Mensagem enviada');
  }catch(e){ toast('Erro: '+e.message,'err'); }
}

/* ══════════════════════════════════════════════════════════════════════
   THE STUDENT SHEET
   The same card as the lesson, with an ID band at the top — photo well,
   name on a tinted strip, level mark at the right. A candidate card,
   because that is what it is.
   ══════════════════════════════════════════════════════════════════════ */
async function openStudent(ref){
  const host = hostFor('sh-student');
  host.innerHTML = `<div class="sh"><div class="sh-head">
    <div class="sh-eyebrow"><span class="sh-bar"></span><span class="sh-kicker">A carregar</span></div>
    <div class="sh-title">${esc(ref)}</div></div>
    <div class="loading"><span class="spin"></span></div></div>`;
  host.classList.add('on');

  let e = ENROL[ref] || null, hist = [];
  if(!e){
    try{ e = (await sbGet('enrolments',`ref=eq.${encodeURIComponent(ref)}&select=*&limit=1`))[0]||null; }catch(err){}
  }
  try{ hist = await sbGet('turma_students',
    `ref=eq.${encodeURIComponent(ref)}&select=ref,turma_code,academic_year,level_code,outcome,absences,grade_final,notes&order=academic_year.desc`); }catch(err){ hist=[]; }

  const name = e?.name || ref;
  const dept = e ? (LEVEL_DEPT[(e.level_code||'').trim()]||'adults') : 'adults';
  const lvl = LEVEL_DISP[(e?.level_code||'').trim()] || e?.level_code || '—';
  const av = avCol(name);
  const age = ageOf(ref);
  const mine = CLASSES.filter(c=>c.refs.includes(ref));

  /* Attendance across every class I teach this student in. The numbers
     here are the same tallies the register draws — one source. */
  const att = mine.map(c=>{
    const dates = pastDatesFor(c);
    return {c, t:tallyFor(c.code, ref, dates), dates};
  });
  const tot = att.reduce((a,x)=>({p:a.p+x.t.p,abs:a.abs+x.t.a,l:a.l+x.t.l,m:a.m+x.t.marked}),{p:0,abs:0,l:0,m:0});
  const pct = tot.m ? Math.round(tot.p/tot.m*100) : null;

  const fld = (k,v,mono) => v ? `<div class="sh-fld"><div class="sh-fk">${k}</div>
    <div class="sh-fv"${mono?' style="font-family:var(--mono);font-size:12px"':''}>${esc(v)}</div></div>` : '';

  const identity = `
    <div class="sh-sec">Inscrição</div>
    <div class="sh-g2">
      ${fld('Referência', e?.ref||ref, true)}
      ${fld('Nível', lvl)}
      ${age!=null?fld('Idade', age+' anos'+(age<18?' · menor':'')):''}
      ${fld('Língua', LANG_NAME[(e?.lang||'').toUpperCase().slice(0,2)]||e?.lang)}
      ${fld('Filial', (e?.branch||'').replace(/_/g,' '))}
      ${fld('Escola', e?.school)}
      ${fld('Ano escolar', e?.school_year)}
    </div>
    <div class="sh-sec">Contactos</div>
    <div class="sh-g2">${fld('Telefone', e?.phone, true)}${fld('Email', e?.email)}</div>
    <div class="sh-sec">Encarregado de educação</div>
    ${e?.guardian_name||e?.guardian_phone||e?.guardian_email
      ? `<div class="sh-g2">${fld('Nome',e?.guardian_name)}${fld('Telefone',e?.guardian_phone,true)}${fld('Email',e?.guardian_email)}</div>`
      : '<div class="sh-empty">Sem dados de EE registados.</div>'}`;

  const attendance = att.length ? att.map(({c,t,dates})=>{
    const p = t.marked?Math.round(t.p/t.marked*100):null;
    const flag = absenceFlag(c.code, ref);
    /* A strip of every lesson so far. Clicking one opens that lesson —
       the same date the mark belongs to. */
    const strip = dates.slice(-40).map(d=>{
      const s = statusOf(c.code,ref,d);
      const col = s==='present'?'var(--sage-deep)':s==='absent'?'var(--alert)':s==='late'?'var(--clay)':'rgba(0,0,0,.08)';
      return `<span title="${fmtLong(d)} · ${s||'sem registo'}" onclick="closeSheet('sh-student');openLesson('${c.code}','${d}')"
        style="width:9px;height:16px;border-radius:6px;background:${col};cursor:pointer;flex-shrink:0"></span>`;
    }).join('');
    return `<div class="sh-fld" style="margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span style="font-family:var(--mono);font-weight:700;color:var(--ink)">${esc(c.code)}</span>
        <span class="sh-meta">${DAY_FULL[c.day]} · ${c.start}</span>
        ${flag?`<span class="att-flag">${flag.n} faltas</span>`:''}
        <span style="margin-left:auto;font-weight:700;color:${p==null?'var(--faint)':p>=80?'var(--sage-deep)':p>=60?'var(--clay)':'var(--alert)'}">${p==null?'—':p+'%'}</span>
      </div>
      <div style="display:flex;gap:2px;margin-top:9px;overflow-x:auto;padding-bottom:2px">${strip||'<span class="sh-meta">ainda sem aulas</span>'}</div>
      <div class="sh-meta" style="margin-top:7px">${t.p} presenças · ${t.a} faltas · ${t.l} atrasos · ${t.o} por marcar</div>
    </div>`;
  }).join('') : '<div class="sh-empty">Sem turmas.</div>';

  const marksPane = `
    <div class="sh-sec">Avaliações ${AY||''}</div>
    <div class="notice"><b>Nota.</b> As avaliações são gravadas em <code>student_marks</code>.
      Se a tabela ainda não existir na base de dados, o registo falha e é avisado aqui —
      não é guardado em silêncio.</div>
    <div class="sh-g3">
      <div><div class="sh-fk">Turma</div><select class="inp" id="mk-turma">${mine.map(c=>`<option>${esc(c.code)}</option>`).join('')}</select></div>
      <div><div class="sh-fk">Tipo</div><select class="inp" id="mk-type">
        <option>Teste escrito</option><option>Oral</option><option>Participação</option><option>Projecto</option><option>Exame</option></select></div>
      <div><div class="sh-fk">Nota (0–100)</div><input class="inp" id="mk-val" type="number" min="0" max="100"/></div>
    </div>
    <div style="margin-top:8px"><div class="sh-fk">Comentário</div><input class="inp" id="mk-note"/></div>
    <div style="margin-top:10px"><button class="sh-btn primary" onclick="saveMark('${ref}')">Registar avaliação</button></div>
    <div class="sh-sec">Historial ALM</div>
    ${hist.length ? hist.map(y=>`<div class="sh-fld" style="margin-bottom:6px">
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <span style="font-family:var(--mono);font-weight:700">${esc(y.academic_year||'—')}</span>
          <span class="sh-meta">${esc(y.turma_code||'—')} · ${esc(LEVEL_DISP[(y.level_code||'').trim()]||y.level_code||'—')}</span>
          <span style="margin-left:auto;font-weight:600;color:${y.outcome==='aprovado'?'var(--sage-deep)':y.outcome==='reprovado'?'var(--alert)':'var(--faint)'}">${esc(y.outcome||'em curso')}</span>
        </div>
        <div class="sh-meta" style="margin-top:5px">${y.grade_final!=null?`Nota ${y.grade_final}%`:''}${y.absences!=null?` · ${y.absences} faltas`:''}</div>
      </div>`).join('') : '<div class="sh-empty">Sem anos anteriores registados.</div>'}`;

  const notes = `
    <div class="sh-sec">Nota interna</div>
    <textarea class="inp" id="stu-note" placeholder="Visível para toda a equipa ALM…">${esc(e?.notes||'')}</textarea>
    <div style="display:flex;justify-content:flex-end;margin-top:10px">
      <button class="sh-btn sage" onclick="saveNote('${ref}')">Guardar nota</button></div>`;

  host.innerHTML = `<div class="sh" style="--accent:${DEPT[dept].band}">
    <button class="sh-close" onclick="closeSheet('sh-student')">✕</button>
    <div class="sh-head">
      <div class="sh-eyebrow"><span class="sh-bar"></span>
        <span class="sh-kicker">${DEPT[dept].label} · ${esc(lvl)} · ${esc((e?.branch||'').replace(/_/g,' '))}</span></div>
      <div class="idband" style="--band:${DEPT[dept].band};margin:0;border-radius:10px">
        <div class="idb-photo" style="width:70px;cursor:default">
          <div class="idb-photo-ph" style="font-family:var(--mono);font-size:17px;font-weight:700;color:#fff">${avInit(name)}</div>
        </div>
        <div class="idb-who" style="padding:12px 16px;gap:5px">
          <div class="idb-name" style="font-size:clamp(19px,3vw,26px);letter-spacing:2px">${esc(name)}</div>
          <div class="idb-tags"><span class="idb-tag">${esc(ref)}</span>
            ${age!=null?`<span class="idb-tag">${age} anos</span>`:''}
            <span class="idb-tag">${esc((e?.lang||'').toUpperCase().slice(0,2))}</span></div>
        </div>
        <div class="idb-stat" style="cursor:default;padding:0 18px">
          <div class="idb-stat-v" style="font-size:24px">${esc(lvl)}</div>
          <div class="idb-stat-l">Nível</div></div>
      </div>
    </div>
    <div class="sh-strip">
      <div class="sh-stat"><div class="sh-stat-v" style="color:var(--sage-deep)">${tot.p}</div><div class="sh-stat-l">Presenças</div></div>
      <div class="sh-stat"><div class="sh-stat-v" style="color:${tot.abs?'var(--alert)':'var(--ink)'}">${tot.abs}</div><div class="sh-stat-l">Faltas</div></div>
      <div class="sh-stat"><div class="sh-stat-v" style="color:${tot.l?'var(--clay)':'var(--ink)'}">${tot.l}</div><div class="sh-stat-l">Atrasos</div></div>
      <div class="sh-stat"><div class="sh-stat-v">${pct==null?'—':pct+'%'}</div><div class="sh-stat-l">Assiduidade</div></div>
    </div>
    <div class="sh-tabs">
      <button class="sh-tab active" data-pane="id">Identidade</button>
      <button class="sh-tab" data-pane="att">Assiduidade</button>
      <button class="sh-tab" data-pane="mk">Avaliação</button>
      <button class="sh-tab" data-pane="nt">Notas</button>
    </div>
    <div class="sh-body">
      <div class="sh-pane active" id="pane-id">${identity}</div>
      <div class="sh-pane" id="pane-att">${attendance}</div>
      <div class="sh-pane" id="pane-mk">${marksPane}</div>
      <div class="sh-pane" id="pane-nt">${notes}</div>
    </div>
    <div class="sh-foot">
      ${e?.phone?`<button class="sh-btn" onclick="window.open('https://wa.me/${(e.phone||'').replace(/\D/g,'')}')">WhatsApp</button>`:''}
      ${e?.guardian_phone?`<button class="sh-btn" onclick="window.open('tel:${esc(e.guardian_phone)}')">Ligar ao EE</button>`:''}
      <button class="sh-btn" style="margin-left:auto" onclick="closeSheet('sh-student')">Fechar</button>
    </div>
  </div>`;
  host.querySelectorAll('.sh-tab').forEach(b=>b.onclick=()=>{
    host.querySelectorAll('.sh-tab').forEach(x=>x.classList.remove('active'));
    host.querySelectorAll('.sh-pane').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); host.querySelector('#pane-'+b.dataset.pane).classList.add('active');
  });
}

async function saveMark(ref){
  const v = parseFloat(document.getElementById('mk-val').value);
  if(isNaN(v)){ toast('Indique a nota','warn'); return; }
  try{
    await sbUpsert('student_marks',[{student_ref:ref, turma_code:document.getElementById('mk-turma').value,
      academic_year:AY||null, assessment_type:document.getElementById('mk-type').value,
      mark:v, comment:document.getElementById('mk-note').value,
      recorded_by:ME.id, date:todayISO(), created_at:new Date().toISOString()}]);
    toast('Avaliação registada');
    document.getElementById('mk-val').value=''; document.getElementById('mk-note').value='';
  }catch(err){
    /* Say what actually failed. A missing table is a setup problem, not
       a user error, and it should not look like one. */
    const missing = /relation|does not exist|404|PGRST205/i.test(err.message);
    toast(missing ? 'A tabela student_marks não existe na base de dados' : 'Erro: '+err.message,'err');
  }
}
async function saveNote(ref){
  const txt = document.getElementById('stu-note').value;
  try{
    await sbPatch('enrolments',`ref=eq.${encodeURIComponent(ref)}`,{notes:txt});
    if(ENROL[ref]) ENROL[ref].notes = txt;
    toast('Nota guardada');
  }catch(e){ toast('Erro: '+e.message,'err'); }
}

/* ══════════════════════════════════════════════════════════════════════
   THE ROSTER SHEET
   Any count on this page opens the list it counted. One function, so a
   figure and its list are produced from the same predicate.
   ══════════════════════════════════════════════════════════════════════ */
function openRoster(title, kicker, students){
  const host = hostFor('sh-roster');
  const list = students.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  host.innerHTML = `<div class="sh">
    <button class="sh-close" onclick="closeSheet('sh-roster')">✕</button>
    <div class="sh-head">
      <div class="sh-eyebrow"><span class="sh-bar"></span><span class="sh-kicker">${esc(kicker)}</span></div>
      <div class="sh-title">${esc(title)}</div>
      <div class="sh-sub">${list.length} aluno${list.length!==1?'s':''}</div>
    </div>
    <div class="sh-body">${list.length ? list.map(s=>{
      const av=avCol(s.name);
      return `<div class="sh-row" style="cursor:pointer" onclick="closeSheet('sh-roster');openStudent('${s.ref}')">
        <div class="sh-av" style="background:${av.bg};color:${av.t}">${avInit(s.name)}</div>
        <div style="flex:1;min-width:0"><div class="sh-name">${esc(s.name)}</div>
          <div class="sh-meta">${esc(s.ref)}${s.note?' · '+esc(s.note):''}</div></div>
      </div>`; }).join('') : '<div class="sh-empty">Nenhum aluno nesta contagem.</div>'}</div>
    <div class="sh-foot"><span class="sh-meta">clique num aluno para o dossier</span></div>
  </div>`;
  host.classList.add('on');
}
function rosterClass(code){
  const c = CLASSES.find(x=>x.code===code); if(!c) return;
  openRoster(code, `${DAY_FULL[c.day]} · ${c.start}–${c.end} · ${c.level}`,
    c.refs.map(r=>({ref:r, name:ENROL[r]?.name||r})));
}
function rosterAtt(status){
  const {cls,date} = sheetLesson;
  const lbl = {present:'Presentes', late:'Atrasos', absent:'Faltas'}[status] || 'Sem marca';
  openRoster(lbl, `${cls.code} · ${fmtLong(date)}`,
    cls.refs.filter(r=>(attDraft[r]||null)===status).map(r=>({ref:r,name:ENROL[r]?.name||r})));
}
function rosterAllStudents(){
  openRoster('Alunos', `${ME.name} · ${AY||''}`,
    myStudents().map(s=>({ref:s.ref, name:s.name, note:s.classes.map(c=>c.code).join(' · ')})));
}

/* ══════════════════════════════════════════════════════════════════════
   WIRING
   ══════════════════════════════════════════════════════════════════════ */
function switchPanel(name){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.panel===name));
  document.getElementById('p-'+name)?.classList.add('on');
}
document.getElementById('tb-nav').addEventListener('click', e=>{
  const b = e.target.closest('.nav-btn'); if(!b) return;
  switchPanel(b.dataset.panel);
  if(b.dataset.panel==='pauta' && !pautaCode && CLASSES.length) showPauta(CLASSES[0].code);
});
document.getElementById('st-turmas').onclick = ()=>switchPanel('turmas');
document.getElementById('st-alunos').onclick = rosterAllStudents;
document.getElementById('st-porMarcar').onclick = ()=>switchPanel('pedidos');
document.getElementById('btn-notif').onclick = ()=>switchPanel('pedidos');
document.getElementById('btn-reload').onclick = ()=>{ if(ME) loadTeacher(); };
document.getElementById('stu-search').addEventListener('input', renderAlunos);

/* The photo is held in the browser only. Saying so is better than a
   silent no-op that looks like it worked. */
document.getElementById('idb-photo').onclick = ()=>document.getElementById('idb-file').click();
document.getElementById('idb-file').onchange = ev=>{
  const f = ev.target.files?.[0]; if(!f) return;
  const r = new FileReader();
  r.onload = x=>{ const img=document.getElementById('idb-img');
    img.src=x.target.result; img.style.display='block';
    document.getElementById('idb-ph').style.display='none';
    toast('Pré-visualização apenas — não guardada no servidor','warn'); };
  r.readAsDataURL(f);
};

document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    ['sh-roster','sh-student','sh-lesson'].some(id=>{
      const el=document.getElementById(id);
      if(el.classList.contains('on')){ closeSheet(id); return true; }
    });
  }
  if((e.ctrlKey||e.metaKey) && e.key==='Enter' && document.getElementById('sh-lesson').classList.contains('on')) saveLesson();
});

function tick(){ const n=new Date(), p=x=>String(x).padStart(2,'0');
  document.getElementById('clock').textContent = p(n.getHours())+':'+p(n.getMinutes()); }
tick(); setInterval(tick,15000);
boot();
</script>
