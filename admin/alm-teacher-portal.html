<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>

<style>/* ── CHROME COMPACT, CONTENT GENEROUS ────────────────────────────
   The topbar, the identity strip and the panel padding were together
   taking about 200px off the top of every screen before a single
   student appeared. They are furniture; the students are the work.
   Everything above the content lost roughly a third of its height,
   and the student rows gained the space.
   ──────────────────────────────────────────────────────────────── */

/* ══════════════════════════════════════════════════════════════════════
   WHY THE COLLOCATIONS MODAL LOOKS CRISP
   Read from skills/grammar-rules/collocations.html. The surprise is
   that it is not the blur — the blur is doing nothing. .modal is
   rgba(28,28,30,0.98), effectively opaque, so its 60px backdrop-filter
   has almost no surface to act on. Four other things are doing the work:

     1. THE SCRIM IS HEAVY. rgba(0,0,0,0.85). The page behind is gone,
        not softened. Our sheets sat on .30 — light enough that the
        grid behind stayed legible and competed with the card. That is
        what reads as haze, and it is the single biggest factor.
     2. THE CARD IS OPAQUE AND HAS AN EDGE. A 1px rule at 40% grey
        gives it a defined boundary instead of bleeding into the scrim.
     3. AIR. 2.5rem of padding, 2rem under the header. Ours was 24px.
     4. TIGHT TYPE. -0.02em on the title, -0.01em on the subtitle, at
        SF-Pro-ish sizes. Negative tracking at display size is most of
        what makes a card look engineered rather than typed.

   So: heavier scrim, opaque card, defined edge, more air, tighter
   tracking — and no blur at all, which we do not need and the flat
   rules forbid.
   ══════════════════════════════════════════════════════════════════════ */

/* ══════════════════════════════════════════════════════════════════════
   FLAT PASS
   Every box-shadow, every backdrop blur and every decorative gradient
   has been removed from this file — not softened, removed. Half-flat
   is worse than either: a page with three shadows on it reads as a
   page that forgot to finish.

   What replaced them:
   · DEPTH → NOTHING. The recessed wells came from one reference tile
     and quietly set the tone for the entire product. A timetable cell
     does not need to look pressed into anything; it needs an edge and
     a fill. It now has a flat fill one step off the page and no edge
     at all, which is how the INTUITY skills screen, the Apple grid
     and every reference in the brief handle a repeating cell.
   · ELEVATION → HAIRLINE. A card is white with a 1px rule at 7%
     black. Where something must sit above something else — the rail,
     the sheet — it gets one hairline on the meeting edge and nothing
     more.
   · SCRIM → FLAT INK. rgba(20,20,15,.30), no blur. Blur is expensive,
     it smears the type behind it, and it was the single biggest
     contributor to the screen looking soft.
   · BANNERS → GONE. The sand mastheads are white. The ONE survivor is
     the identity strip on a student or teacher card, which is not
     decoration: it is the only place a block of colour is carrying
     information (which department this person belongs to).
   ══════════════════════════════════════════════════════════════════════ */

/* ══════════════════════════════════════════════════════════════════════
   ALM · PORTAL DO PROFESSOR
   One page for one teacher for one year.

   WHAT THIS REPLACES, AND WHY IT IS A REWRITE RATHER THAN A REPAINT
   ─────────────────────────────────────────────────────────────────
   The previous portal was a dark gold-on-black console whose central
   record — which lesson am I marking? — was identified by an integer
   counted from the start of the year. That integer is not an identity.
   It is derived from the school calendar, so the moment a holiday is
   added every stored number points at a different date, and the header
   and the body of the modal could disagree about which day was open
   without anything appearing to be wrong.

   Here the DATE IS THE RECORD. lesson_number is computed for display
   and written alongside for human reference, never read back as a key.
   Everything — attendance, summaries, marks — is addressed by
   (turma_code, student_ref, date).

   THE SURFACE
   Warm stone page, one cool stone instrument (the timetable), sage for
   arrival and clay for provisional. Depth means "has a lesson", never
   "is good". Numbers are doors: any count opens the list it counted.
   ══════════════════════════════════════════════════════════════════════ */

*{box-sizing:border-box;margin:0;padding:0}

:root{
  /* ── SURFACES ── */
  --page:#F2F1EC;          /* warm stone — the page */
  --card:#FBFAF7;          /* raised paper — panels */
  --field:#DFE3E3;         /* cool stone — the timetable, and only it */
  --shade:56,50,38;        /* warm dark — cards, page furniture */
  --grid-shade:40,50,54;   /* cool dark — the grid */

  /* ── INK ── */
  --ink:#14140F;
  --ink-2:#3A3A36;
  --sub:#7A7A72;
  --faint:#A8A69C;
  --line:rgba(0,0,0,.07);

  /* ── STATE ──
     Two solids, one meaning each. Sage is settled: marked, submitted,
     present. Clay is provisional: unmarked, pending, in progress.
     Nothing else carries hue. */
  --sage:#6F8F71;
  --sage-deep:#4E6B50;
  --sage-a:rgba(111,143,113,.12);
  --sage-b:rgba(111,143,113,.34);
  /* ── THE SAGE INSTRUMENT ─────────────────────────────────────────
     The grid was cool stone with sage marks on it. It is now a sage
     field, which is a better-looking object and a completely different
     colour problem: sage can no longer also mean "done", because a
     sage mark on a sage field is 1.6:1 against its own background and
     the clay mark is 1.05:1 — invisible.

     So the states were re-derived against the new ground:
       · PLUM  #2B2129 on sage = 4.17:1 — settled, marked, certified.
       · SAND  #E5D1B8 on sage = 2.51:1 — open, pending, unassigned.
     Warm sage and clay keep their meanings everywhere OFF the grid,
     on cards and chips, where they still have the contrast to work.

     The field and the cell fill are the same colour, as they always
     were — that is what makes the wells read as depth rather than as
     a vignette on a coloured box. The zebra is one step, not two:
     #7C9589 is a shade of the field, not a second colour.
     ──────────────────────────────────────────────────────────────── */
  /* ── SAGE IS A MARK, NOT A GROUND ────────────────────────────────
     The grid is light earthy stone again. Sage appears only on a slot
     that has something in it — assigned, marked, certified — and
     nowhere else. When the field itself went sage the tint stopped
     meaning anything: everything was sage, so nothing was.

     Two steps, chosen by whether small text sits on top:
       · #708A81 for marks that carry no text — seal discs, rings.
       · #5E776C for filled blocks that do. White at 9px measures
         3.72:1 on 708A81 and 4.85:1 on 5E776C; the smaller step is
         below AA and the turma code is 9px.
     Against the stone field they read 2.88:1 and 3.75:1 — a block,
     not body text, so that is the right range.
     ──────────────────────────────────────────────────────────────── */
  --sage-cool:#708A81;
  --sage-slot:#5E776C;
  --banner:#2B2129;
  --sand:#E5D1B8;
  --stone-warm:#D2CEC2;

  --clay:#9A7B62;
  --clay-a:rgba(154,123,98,.12);
  --clay-b:rgba(154,123,98,.32);
  --alert:#B8402A;
  --alert-a:rgba(184,64,42,.10);
  --warn:#8A8A82;

  /* ── DEPARTMENT TINTS ──
     Used on the ID band only, where the job is recognition rather than
     status. Muted enough to sit on paper. */
  --d-kids:#6E8CA8;
  --d-juv:#6F8F71;
  --d-adults:#8C7F6A;
  --d-exam:#7E7391;


  /* Flat surfaces. Four steps, each one flat, no shadow between them.
     The separation is value alone, which is all a flat system has. */
  --page:#F2F1EC;      /* the page                        */
  --card:#FFFFFF;      /* anything raised, by hairline    */
  --well:#E7E8E4;      /* a repeating cell in a grid      */
  --rule:rgba(0,0,0,.07);
  --rule-2:rgba(0,0,0,.13);
  /* Handed to alm-grid.js. The grid draws itself; the page only says
     what colour its own paper and its own states are. */
  --almg-paper:#FFFFFF; --almg-rule:#E4E2DB; --almg-rule-2:#CFCCC2;
  --almg-head:#F2F1EC; --almg-head-on:#DCE3DE;
  --almg-ink:#14140F; --almg-sub:#7A7A72; --almg-faint:#A8A69C;
  --almg-done:#5E776C; --almg-open:#9A7B62;
  --sans:'Geist',system-ui,-apple-system,sans-serif;
  --mono:'Geist Mono',ui-monospace,monospace;
  --display:'Anton',Impact,sans-serif;
  --row-h:58px;
}

html,body{height:100%;background:var(--page);color:var(--ink-2);
  font-family:var(--sans);font-size:13px;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;border:none;background:none;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
*{scrollbar-width:thin;scrollbar-color:rgba(var(--shade),.16) transparent}

@keyframes sheetIn{from{opacity:0;transform:scale(.95) translateY(20px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ══ TOPBAR ══ */
.topbar{flex-shrink:0;height:44px;display:flex;align-items:center;gap:0;
  background:var(--card);border-bottom:1px solid var(--line);z-index:200}
.tb-brand{display:flex;align-items:baseline;gap:8px;padding:0 14px;height:100%;
  border-right:1px solid var(--line);flex-shrink:0;align-items:center}
.tb-alm{font-family:var(--sans);font-size:16px;font-weight:800;letter-spacing:7px;color:var(--ink)}
.tb-yr{font-family:var(--mono);font-size:9px;color:var(--faint);letter-spacing:.1em}
.tb-nav{display:flex;align-items:center;gap:3px;padding:0 14px;flex:1;overflow-x:auto;scrollbar-width:none}
.tb-nav::-webkit-scrollbar{display:none}
.nav-btn{font-family:var(--sans);font-size:12px;font-weight:600;padding:5px 13px;
  border-radius:999px;color:var(--sub);white-space:nowrap;transition:all .14s}
.nav-btn:hover{color:var(--ink);background:rgba(var(--shade),.05)}
.nav-btn.active{background:var(--ink);color:#fff}
.nav-btn .nb-n{font-family:var(--mono);font-size:9px;font-weight:500;
  margin-left:6px;opacity:.55}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px;
  padding:0 16px;height:100%;border-left:1px solid var(--line);flex-shrink:0}
.tb-dot{width:6px;height:6px;border-radius:50%;background:var(--sage);animation:pulse 2.4s infinite}
.tb-dot.warn{background:var(--clay)}.tb-dot.err{background:var(--alert);animation:none}
.tb-msg{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--faint)}
.tb-clock{font-family:var(--mono);font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
.tb-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;
  justify-content:center;color:var(--sub);transition:all .14s;position:relative}
.tb-icon:hover{background:rgba(var(--shade),.07);color:var(--ink)}
.tb-icon .bdg{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;
  border-radius:999px;background:var(--alert);color:#fff;font-family:var(--mono);
  font-size:8px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 4px}
.tb-icon.has .bdg{display:flex}

/* ══ TEACHER PICKER ══ */
.picker{display:none;align-items:center;gap:12px;padding:10px 18px;
  background:var(--card);border-bottom:1px solid var(--line);flex-shrink:0}
.picker.on{display:flex}
.picker-lbl{font-family:var(--mono);font-size:9px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.picker select{padding:8px 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--page);font-size:13px;min-width:280px;outline:none;cursor:pointer}

/* ══ ID BAND ══════════════════════════════════════════════════════════
   The teacher's own card. Photo well, name, credentials, and the two
   numbers that describe the year. The tint is the department they
   mostly teach, so the band identifies before it is read. */
.idband{flex-shrink:0;margin:12px 14px 0;border-radius:14px;position:relative;
  overflow:hidden;display:flex;align-items:stretch;background:var(--band,#8C7F6A);}
.idband::after{content:'';position:absolute;inset:0;pointer-events:none;
  display:none}
.idb-photo{position:relative;z-index:1;width:52px;flex-shrink:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.12);border-right:1px solid rgba(255,255,255,.20)}
.idb-photo img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.idb-photo-ph{display:flex;flex-direction:column;align-items:center;gap:6px;
  color:rgba(255,255,255,.62);font-family:var(--mono);font-size:8px;
  letter-spacing:.12em;text-transform:uppercase}
.idb-photo:hover .idb-photo-ph{color:#fff}
.idb-who{position:relative;z-index:1;flex:1;min-width:0;display:flex;
  flex-direction:column;justify-content:center;padding:8px 14px;gap:4px}
.idb-name{font-family:var(--display);font-size:clamp(17px,2vw,21px);
  letter-spacing:4px;line-height:1;text-transform:uppercase;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idb-tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.idb-tag{font-family:var(--mono);font-size:8px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;padding:2px 7px;border-radius:6px;
  background:rgba(255,255,255,.20);color:#fff}
.idb-stat{position:relative;z-index:1;flex-shrink:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:0 16px;gap:1px;cursor:pointer;
  border-left:1px solid rgba(255,255,255,.18);transition:background .14s}
.idb-stat:hover{background:rgba(255,255,255,.10)}
.idb-stat-v{font-family:var(--display);font-size:19px;letter-spacing:1px;line-height:1;color:#fff}
.idb-stat-l{font-family:var(--mono);font-size:7px;letter-spacing:.12em;
  text-transform:uppercase;color:rgba(255,255,255,.78)}

/* ══ PANELS ══ */
.panels{flex:1;position:relative;overflow:hidden;min-height:0}
.panel{position:absolute;inset:0;display:none;overflow-y:auto;padding:10px 12px 20px}
.panel.on{display:block;animation:fadeIn .2s}

.strip{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.strip-lbl{font-family:var(--mono);font-size:9px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.sec{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink);
  display:flex;align-items:center;gap:10px;margin:0 0 10px}
.sec::after{content:'';flex:1;height:1px;background:var(--line)}

/* ══ TODAY CHIPS ══ */
.today-chip{display:flex;align-items:center;gap:9px;padding:8px 13px;border-radius:10px;
  background:var(--card);cursor:pointer;
  transition:border-color .12s;border-left:3px solid var(--clay)}
.today-chip:hover{border-color:var(--rule-2)}
.today-chip.done{border-left-color:var(--sage-deep)}
.today-chip.now{border-color:var(--sage-slot)}
.tc-time{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink)}
.tc-meta{font-family:var(--mono);font-size:9px;color:var(--faint)}
.tc-badge{font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:.08em;
  padding:2px 7px;border-radius:6px;background:var(--sage-a);color:var(--sage-deep)}
.tc-badge.now{background:var(--sage-deep);color:#fff}
.tc-badge.pend{background:var(--clay-a);color:var(--clay)}

/* ══ LIST CARDS ══ */
.lcard{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:8px;transition:border-color .14s}
.lcard:hover{border-color:var(--rule-2)}
.lc-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lc-code{font-family:var(--display);font-size:22px;letter-spacing:2px;
  line-height:1;color:var(--ink)}
.lc-meta{font-family:var(--mono);font-size:10px;color:var(--faint)}
.lc-n{margin-left:auto;font-family:var(--sans);font-size:22px;font-weight:700;
  letter-spacing:-.02em;color:var(--ink);cursor:pointer}
.lc-n small{font-size:11px;color:var(--faint);font-weight:500}

/* ══ REGISTER (pauta) ══════════════════════════════════════════════════
   A year of attendance for one class. Deliberately a plain white table
   with hairlines — it is the one surface here meant to be printed, and
   a printed register should look like a register. */
.reg{overflow:auto;max-height:calc(100vh - 340px);border-radius:10px;
  background:#fff;}
.reg table{border-collapse:separate;border-spacing:0;font-family:var(--mono);font-size:10px}
.reg th,.reg td{border-right:1px solid #EDEDE9;border-bottom:1px solid #F3F3F0;padding:4px 3px}
.reg thead th{position:sticky;top:0;z-index:6;background:#F6F6F3;font-weight:700;
  font-size:9px;color:var(--sub);text-align:center;white-space:nowrap}
.reg .stick-a{position:sticky;left:0;z-index:7;background:#F6F6F3;min-width:70px}
.reg .stick-b{position:sticky;left:70px;z-index:7;background:#F6F6F3;min-width:180px;
  text-align:left;border-right:2px solid #DEDEDA}
.reg tbody .stick-a,.reg tbody .stick-b{z-index:5;background:inherit}
.reg thead .stick-a,.reg thead .stick-b{z-index:8}
.reg tbody tr:nth-child(odd){background:#fff}
.reg tbody tr:nth-child(even){background:#FAFAF8}
.reg tbody tr:hover{background:var(--sage-a)}
.reg .mk{display:block;text-align:center;font-size:10px;font-weight:700;line-height:1.3}
.reg .m-p{color:var(--sage-deep)}
.reg .m-a{color:var(--alert)}
.reg .m-l{color:var(--clay)}
.reg .m-o{color:#D8D8D2}
.reg .today-col{background:var(--sage-a)!important}
.reg .tot{border-left:2px solid #DEDEDA;font-weight:700;text-align:center}
.reg tfoot td{position:sticky;bottom:0;background:#F6F6F3;border-top:2px solid #DEDEDA;
  font-weight:700;text-align:center;font-size:9px}
.reg-name{font-family:var(--sans);font-size:11px;font-weight:500;color:var(--ink);cursor:pointer}
.reg-name:hover{text-decoration:underline}
.reg-legend{display:flex;gap:16px;align-items:center;margin-top:8px;flex-wrap:wrap;
  font-family:var(--mono);font-size:9px;color:var(--sub)}

/* ══ SHEETS ══════════════════════════════════════════════════════════
   The INTUITY card: cream, one sage rule, mono eyebrow, a headline
   that is a headline. Used for every modal on this page so there is
   one modal language rather than four. */
.sh-ov{position:fixed;inset:0;z-index:1500;display:none;align-items:center;
  justify-content:center;padding:26px;background:rgba(16,16,12,.62)}
.sh-ov.on{display:flex}
.sh{position:relative;width:min(680px,95vw);max-height:90dvh;display:flex;
  flex-direction:column;overflow:hidden;background:#FAF8F5;border-radius:6px;animation:sheetIn .26s cubic-bezier(.2,.9,.3,1)}
.sh.wide{width:min(1080px,97vw)}

/* No masthead. The head is the same white as the body, separated by
   the rule under the stat strip and by nothing else. */
.sh-head{flex-shrink:0;padding:34px 36px 20px}
.sh-strip{border-bottom:1px solid var(--rule);padding:0 36px 22px}
.sh-eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sh-bar{width:22px;height:5px;border-radius:6px;background:var(--accent,var(--sage))}
.sh-kicker{font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:.18em;
  text-transform:uppercase;color:var(--faint)}
.sh-title{font-family:var(--display);font-size:clamp(26px,4.4vw,40px);line-height:.98;
  letter-spacing:2px;text-transform:uppercase;color:var(--banner)}

.sh-sub{font-size:15px;color:var(--sub);margin-top:14px;letter-spacing:-.01em}
.sh-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.sh-tag{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;padding:4px 10px;border-radius:6px;
  background:rgba(var(--shade),.06);color:var(--sub)}
.sh-tag.on{background:var(--sage-a);color:var(--sage-deep)}
.sh-tag.pend{background:var(--clay-a);color:var(--clay)}
.sh-close{position:absolute;top:22px;right:24px;z-index:4;width:28px;height:28px;
  border-radius:50%;color:var(--faint);font-size:15px;transition:all .14s}
.sh-close:hover{background:rgba(var(--shade),.07);color:var(--ink)}
.sh-strip{flex-shrink:0;display:flex;padding:0 32px 18px}
.sh-stat{flex:1;display:flex;flex-direction:column;gap:3px;cursor:default}
.sh-stat[data-click]{cursor:pointer}
.sh-stat[data-click]:hover{opacity:.7}
.sh-stat+.sh-stat{border-left:1px solid var(--line);padding-left:16px}
.sh-stat-v{font-family:var(--sans);font-size:27px;font-weight:700;line-height:1;
  letter-spacing:-.025em;color:var(--ink)}
.sh-stat-l{font-family:var(--mono);font-size:8px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint)}
.sh-tabs{flex-shrink:0;display:flex;gap:2px;padding:0 36px;overflow-x:auto;
  border-bottom:1px solid var(--line);scrollbar-width:none}
.sh-tabs::-webkit-scrollbar{display:none}
.sh-tab{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;
  padding:11px 14px;color:var(--faint);border-bottom:2px solid transparent;
  white-space:nowrap;transition:all .13s}
.sh-tab:hover{color:var(--ink-2)}
.sh-tab.active{color:var(--ink);border-bottom-color:var(--accent,var(--sage))}
.sh-body{flex:1;overflow-y:auto;padding:14px 36px 26px;min-height:0}
.sh-pane{display:none}.sh-pane.active{display:block}
.sh-sec{font-family:var(--mono);font-size:8px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--faint);display:flex;align-items:center;
  gap:10px;margin:18px 0 10px}
.sh-sec::after{content:'';flex:1;height:1px;background:var(--line)}
.sh-foot{flex-shrink:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:18px 36px;border-top:1px solid var(--rule);background:#fff}
.sh-btn{font-family:var(--sans);font-size:12px;font-weight:600;padding:9px 17px;
  border-radius:10px;background:rgba(var(--shade),.07);color:var(--ink-2);transition:all .13s}
.sh-btn:hover{background:rgba(var(--shade),.12)}
.sh-btn.primary{background:var(--ink);color:#fff}
.sh-btn.primary:hover{background:#000}
.sh-btn.sage{background:var(--sage-a);color:var(--sage-deep)}
.sh-btn.sage:hover{background:rgba(111,143,113,.22)}
.sh-btn:disabled{opacity:.35;cursor:not-allowed}
.sh-fld{background:rgba(var(--shade),.04);border-radius:6px;padding:10px 12px}
.sh-fk{font-family:var(--mono);font-size:8px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);margin-bottom:4px}
.sh-fv{font-family:var(--sans);font-size:14px;font-weight:500;
  letter-spacing:-.01em;color:var(--ink-2)}
.sh-g2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.sh-g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.sh-row{display:flex;align-items:center;gap:12px;padding:9px 0;
  border-bottom:1px solid var(--line);transition:background .12s}
.sh-row:last-child{border-bottom:none}
.sh-av{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;font-weight:700}
.sh-name{font-family:var(--sans);font-size:14px;font-weight:500;
  letter-spacing:-.01em;color:var(--ink-2)}
.sh-meta{font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:2px}
.sh-empty{font-size:13px;color:var(--faint);padding:22px 0;text-align:center}
.inp{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);
  background:#fff;outline:none;font-size:13px;transition:border-color .13s}
.inp:focus{border-color:var(--sage-b)}
textarea.inp{resize:vertical;min-height:84px;line-height:1.6}
.chip{font-family:var(--mono);font-size:10px;font-weight:600;padding:5px 11px;
  border-radius:999px;border:1px solid var(--line);color:var(--sub);
  background:#fff;transition:all .13s}
.chip:hover{border-color:var(--sage-b)}
.chip.on{background:var(--sage-a);border-color:var(--sage-b);color:var(--sage-deep)}

/* ══ LESSON RAIL ══════════════════════════════════════════════════════
   Every teaching date for this class, in order. The selected date is
   the record; the number beneath it is a label. Future dates are
   visible but inert — you cannot mark a lesson that has not happened. */
.rail{flex-shrink:0;position:relative;height:52px;border-bottom:1px solid var(--line);
  background:rgba(var(--shade),.03)}
.rail-track{display:flex;height:100%;overflow-x:auto;scroll-behavior:smooth;
  scrollbar-width:none;cursor:grab}
.rail-track::-webkit-scrollbar{display:none}
.rail-track:active{cursor:grabbing}
.rc{flex:0 0 58px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;border-right:1px solid var(--line);
  position:relative;user-select:none;transition:background .12s}
.rc:hover{background:rgba(var(--shade),.06)}
.rc-n{font-family:var(--display);font-size:15px;letter-spacing:1px;
  line-height:1;color:var(--sub)}
.rc-d{font-family:var(--mono);font-size:8px;color:var(--faint);white-space:nowrap}
.rc.done .rc-n{color:var(--sage-deep)}
.rc.done::after{content:'';position:absolute;bottom:5px;width:14px;height:2px;
  border-radius:6px;background:var(--sage-deep)}
.rc.today{background:var(--sage-a)}
.rc.future{opacity:.38;pointer-events:none}
.rc.sel{background:var(--ink)}
.rc.sel .rc-n,.rc.sel .rc-d{color:#fff}
.rc.sel::after{background:#fff}

/* ══ ATTENDANCE ROWS ══ */
.att-row{display:flex;align-items:center;gap:11px;padding:8px 11px;border-radius:10px;
  background:#fff;border:1px solid var(--rule);margin-bottom:4px;transition:all .13s}
.att-row.p{background:var(--sage-a);border-color:var(--sage-b)}
.att-row.l{background:var(--clay-a);border-color:var(--clay-b)}
.att-row.a{background:var(--alert-a);border-color:rgba(184,64,42,.26)}
.att-mark{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;font-size:14px;font-weight:700;
  border:1.5px solid var(--line);background:#fff;color:var(--faint);
  cursor:pointer;transition:all .16s}
.att-mark:hover{transform:scale(1.1)}
.att-row.p .att-mark{background:var(--sage-deep);border-color:var(--sage-deep);color:#fff}
.att-row.l .att-mark{background:var(--clay);border-color:var(--clay);color:#fff}
.att-row.a .att-mark{background:var(--alert);border-color:var(--alert);color:#fff}
.att-num{font-family:var(--mono);font-size:10px;color:var(--faint);width:20px;
  flex-shrink:0;text-align:right}
.att-mid{flex:1;min-width:0;cursor:pointer}
.att-st{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.08em;
  flex-shrink:0;min-width:64px;text-align:right;color:var(--faint)}
.att-row.p .att-st{color:var(--sage-deep)}
.att-row.l .att-st{color:var(--clay)}
.att-row.a .att-st{color:var(--alert)}
.att-flag{font-family:var(--mono);font-size:9px;font-weight:700;padding:2px 7px;
  border-radius:6px;background:var(--alert-a);color:var(--alert);flex-shrink:0}

/* ══ MISC ══ */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(8px);
  padding:9px 20px;border-radius:999px;font-size:12px;font-weight:600;opacity:0;
  transition:all .2s;z-index:9000;pointer-events:none;white-space:nowrap;
  background:var(--ink);color:#fff;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--alert)}
.toast.warn{background:var(--clay)}
.spin{width:14px;height:14px;border:2px solid rgba(var(--shade),.12);
  border-top-color:var(--sage);border-radius:50%;animation:spin .7s linear infinite;
  display:inline-block;vertical-align:-2px}
.loading{padding:40px;text-align:center;color:var(--faint);font-size:12px}
  .notice{padding:11px 14px;border-radius:10px;background:var(--clay-a);
  border:1px solid var(--clay-b);font-size:12px;color:var(--ink-2);line-height:1.6;margin-bottom:12px}
.notice b{color:var(--clay)}

/* At 400px the ID band was four columns fighting for 400px and the
   name collapsed to "A…". Below 620 it stacks: band on one row, the
   three counts sharing the next. */
@media(max-width:620px){
  .idband{flex-wrap:wrap}

  .idb-stat{flex:1;order:3;border-left:none;border-top:1px solid rgba(255,255,255,.18);padding:10px 6px}
  .idb-stat-v{font-size:24px}
  .topbar{height:auto;flex-wrap:wrap;padding-bottom:6px}
  .tb-right{border-left:none;width:100%;justify-content:flex-end}
}
@media(max-width:760px){
  .idband{flex-wrap:wrap}

  .sh-head{padding:22px 20px 14px}.sh-body{padding:6px 20px 18px}
  .sh-foot,.sh-tabs,.sh-strip{padding-left:20px;padding-right:20px}
}

/* ── THE STUDENTS ────────────────────────────────────────────────
   Given back what the chrome gave up. A student row is the densest,
   most-read thing on this page and it was set at the same 13px as a
   form label. Bigger name, bigger avatar, more vertical room, and a
   wider search field — the list is the point of the portal. */
#alunos-list .sh-row{padding:13px 15px!important;margin-bottom:6px!important;gap:14px!important}
#alunos-list .sh-av{width:38px;height:38px;font-size:11px}
#alunos-list .sh-name{font-size:15px;font-weight:550;letter-spacing:-.01em;color:var(--ink)}
#alunos-list .sh-meta{font-size:11px;margin-top:3px}
#stu-search{max-width:440px;padding:11px 14px;font-size:14px}
#stu-count{font-size:11px}

/* The attendance roster in the lesson sheet is the same content and
   gets the same treatment — it is where a teacher spends the lesson. */
.att-row{padding:10px 12px;gap:13px}
.att-mark{width:38px;height:38px;font-size:15px}
.att-row .sh-name{font-size:15px;font-weight:550}
.att-row .sh-meta{font-size:11px}
.att-st{font-size:9.5px;min-width:70px}

/* ══════════════════════════════════════════════════════════════════
   THE LESSON PAGE
   This was a modal: a 36px-padded masthead, a 40px display title, a
   subtitle, a tag row and four 27px stat blocks — about 330px of
   chrome standing between the teacher and the first student, inside
   a card floating on a dimmed copy of the page behind it.

   Marking a register is not a dialog. It is the single most-performed
   task in the product and it deserves the whole screen. So: a page,
   and the header IS the instrument. Every control that was scattered
   down the card — the date rail, the bulk buttons, the tabs, the
   save — is in one band at the top, and everything below it is
   students.

   Chrome: ~330px -> ~118px. The counts survive as small chips and
   stay clickable, because a count is still a door.
   ══════════════════════════════════════════════════════════════════ */
.lp-ov{position:fixed;inset:0;z-index:1500;display:none;background:var(--page)}
.lp-ov.on{display:flex;flex-direction:column}
.lp{flex:1;display:flex;flex-direction:column;min-height:0}

/* ── ROW 1 · identity and the verb, on one line ── */
.lp-top{flex-shrink:0;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:9px 16px;background:var(--card);border-bottom:1px solid var(--rule)}
.lp-back{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;
  color:var(--sub);padding:6px 11px;border-radius:6px}
.lp-back:hover{background:rgba(var(--shade),.06);color:var(--ink)}
.lp-code{font-family:var(--display);font-size:23px;letter-spacing:2px;
  text-transform:uppercase;color:var(--ink);line-height:1}
.lp-when{font-family:var(--mono);font-size:11px;color:var(--sub);letter-spacing:-.01em}
.lp-tag{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;padding:3px 9px;border-radius:6px;
  background:rgba(var(--shade),.06);color:var(--sub)}
.lp-tag.on{background:var(--sage-a);color:var(--sage-deep)}
.lp-tag.pend{background:var(--clay-a);color:var(--clay)}

/* The four counts, shrunk from stat blocks to chips. Still doors. */
.lp-counts{display:flex;gap:5px;margin-left:auto;align-items:center}
.lp-k{display:flex;align-items:baseline;gap:5px;padding:5px 10px;border-radius:6px;
  background:rgba(var(--shade),.05);cursor:pointer;transition:background .12s}
.lp-k:hover{background:rgba(var(--shade),.11)}
.lp-kv{font-size:16px;font-weight:700;letter-spacing:-.02em;color:var(--ink);
  font-variant-numeric:tabular-nums}
.lp-kl{font-family:var(--mono);font-size:8px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint)}
.lp-save{font-size:12px;font-weight:600;padding:8px 18px;border-radius:6px;
  background:var(--ink);color:#fff}
.lp-save:disabled{opacity:.35;cursor:not-allowed}
.lp-dirty{font-family:var(--mono);font-size:10px;color:var(--clay)}

/* ── ROW 2 · the date rail. The wizard: which lesson am I marking. ── */
.lp-rail{flex-shrink:0;height:44px;background:var(--card);
  border-bottom:1px solid var(--rule);position:relative}
.lp-track{display:flex;height:100%;overflow-x:auto;scroll-behavior:smooth;
  scrollbar-width:none;cursor:grab}
.lp-track::-webkit-scrollbar{display:none}
.lp-track:active{cursor:grabbing}

/* ── ROW 3 · tabs and bulk actions share one line ── */
.lp-bar{flex-shrink:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:0 16px;background:var(--card);border-bottom:1px solid var(--rule)}
.lp-tab{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;
  padding:10px 13px;color:var(--faint);border-bottom:2px solid transparent}
.lp-tab:hover{color:var(--ink-2)}
.lp-tab.active{color:var(--ink);border-bottom-color:var(--sage-slot)}
.lp-bulk{margin-left:auto;display:flex;gap:5px;align-items:center;padding:5px 0}
.lp-b{font-size:11px;font-weight:600;padding:6px 11px;border-radius:6px;
  background:rgba(var(--shade),.06);color:var(--ink-2)}
.lp-b:hover{background:rgba(var(--shade),.12)}
.lp-b.sage{background:var(--sage-a);color:var(--sage-deep)}

/* ── THE BODY · students, and nothing else ── */
.lp-body{flex:1;overflow-y:auto;padding:12px 16px 28px;min-height:0}
.lp-body .sh-pane{display:none}
.lp-body .sh-pane.active{display:block}
.lp-roster{max-width:920px}

@media(max-width:620px){
  .lp-top{padding:8px 12px;gap:9px}
  .lp-code{font-size:19px}
  .lp-counts{width:100%;margin-left:0;order:9}
  .lp-bar{padding:0 12px}
  .lp-body{padding:10px 12px 24px}
}

/* ══════════════════════════════════════════════════════════════════
   THE ACTION CLUSTER
   The old portal put seven emoji on every student row — ficha, notas,
   secretaria, encarregado, email, sinalizar, nota. The instinct was
   right and I removed it in the rewrite without replacing it, which
   was a regression: the register is where a teacher IS when they
   think "I must call his mother", and making them leave to do it is
   the expensive click.

   Rebuilt, with three changes:
   · No emoji. Six emoji at 12px on a cream row is the loudest thing
     on a page whose whole palette is stone and one sage. Line icons
     at 15px, in the row's own ink, at 34% until hovered.
   · Direct where it can be direct. WhatsApp, call, mail are tel:,
     mailto: and wa.me — one click, no dialog. Only the two that need
     text open anything.
   · Always visible, never hover-only. Hover-to-reveal costs a tap on
     touch and hides the feature from anyone who does not know it is
     there.
   ══════════════════════════════════════════════════════════════════ */
.act{display:flex;align-items:center;gap:1px;flex-shrink:0}
.act button{width:29px;height:29px;border-radius:6px;display:flex;align-items:center;
  justify-content:center;color:var(--ink-2);opacity:.34;transition:all .12s}
.act button:hover{opacity:1;background:rgba(var(--shade),.09)}
.act button:disabled{opacity:.12;cursor:not-allowed}
.act button.on{opacity:1;color:var(--alert);background:var(--alert-a)}
.act svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}

/* The two actions that need words open a tooltip card, anchored to
   the row — not a modal. Nothing is dismissed to keep marking. */
.tip{position:absolute;z-index:120;width:290px;background:#fff;
  border:1px solid var(--rule-2);border-radius:10px;overflow:hidden;display:none}
.tip.on{display:block}
.tip-h{display:flex;align-items:center;gap:8px;padding:10px 12px;
  border-bottom:1px solid var(--rule)}
.tip-t{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint)}
.tip-n{font-size:13px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.tip-b{padding:11px 12px}
.tip-b textarea{width:100%;min-height:74px;padding:9px 11px;border-radius:6px;
  border:1px solid var(--rule);background:#fff;outline:none;font:inherit;
  font-size:13px;line-height:1.6;resize:vertical}
.tip-b textarea:focus{border-color:var(--sage-b)}
.tip-f{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--rule);
  background:rgba(var(--shade),.025)}
.tip-f .sh-btn{font-size:11px;padding:7px 13px}
.att-row{position:relative}
@media(max-width:620px){ .act button{width:26px;height:26px} .act svg{width:14px;height:14px} }

/* ══════════════════════════════════════════════════════════════════
   THE PILLS
   Grey chips on a page whose only colour is sage read as disabled.
   The lesson header's tags now carry the same sage as the stamps, so
   the header and the grid are visibly one system.
   ══════════════════════════════════════════════════════════════════ */
.lp-tag{background:rgba(94,119,108,.13);color:#41594F}
.lp-tag.on{background:#5E776C;color:#fff}
.lp-tag.pend{background:rgba(154,123,98,.16);color:#7C6149}
.lp-k{background:rgba(94,119,108,.09)}
.lp-k:hover{background:rgba(94,119,108,.18)}

/* ══════════════════════════════════════════════════════════════════
   THE REGISTER
   It was a stack of white cards with 6px of air between them, faint
   icons floating in the middle distance, and about 40% of the row
   empty. It read like a settings screen. A class register is a ruled
   list — that is the form, on paper and in every school in Europe.

   So: hairline rows instead of cards, a column header, alternating
   ground, numbers in a fixed column, and the actions pulled tight to
   the right rather than drifting. Denser by a third, and it now looks
   like what it is.
   ══════════════════════════════════════════════════════════════════ */
.reg-h{display:flex;align-items:center;gap:13px;padding:0 13px 7px;
  font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--rule-2)}
.reg-h .rh-m{width:38px;flex-shrink:0}
.reg-h .rh-n{width:20px;flex-shrink:0;text-align:right}
.reg-h .rh-a{flex:1;min-width:0;padding-left:43px}
.reg-h .rh-s{width:74px;flex-shrink:0;text-align:right}
.reg-h .rh-x{width:180px;flex-shrink:0;text-align:right}

.lp-roster{border:1px solid var(--rule-2);border-radius:10px;overflow:hidden;
  background:#fff;max-width:1000px}
.lp-roster .reg-h{padding-top:9px;background:#F6F6F3}

/* One row, one rule. No card, no gap, no shadow. */
.att-row{border:none;border-bottom:1px solid var(--rule);border-radius:0;
  margin:0;padding:7px 13px;gap:13px;background:#fff}
.att-row:nth-child(even){background:#FAFAF8}
.att-row:last-child{border-bottom:none}
.att-row:hover{background:rgba(94,119,108,.06)}
.att-row.p{background:rgba(94,119,108,.12)}
.att-row.l{background:rgba(154,123,98,.12)}
.att-row.a{background:rgba(184,64,42,.08)}
.att-mark{width:30px;height:30px;font-size:13px;border-width:1.5px}
.att-num{width:20px;font-size:10px}
.att-row .sh-av{width:30px;height:30px;font-size:9px}
.att-row .sh-name{font-size:14px;font-weight:550}
.att-row .sh-meta{font-size:10px;margin-top:1px}
.att-st{min-width:74px;font-size:9px}
.act{gap:0}
.act button{width:26px;height:26px}
.act svg{width:14px;height:14px}
</style>
</head>
<body>

<!-- ══ TOPBAR ══ -->
<div class="topbar">
  <div class="tb-brand"><span class="tb-alm">ALM</span><span class="tb-yr" id="tb-yr">—</span></div>
  <div class="tb-nav" id="tb-nav">
    <button class="nav-btn active" data-panel="semana">Semana</button>

  </div>

      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="bdg" id="notif-n">0</span>
    </button>

      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg>
    </button>

</div>

<!-- ══ TEACHER PICKER ══ -->
<div class="picker" id="picker">
  <span class="picker-lbl">Professor</span>
  <select id="picker-sel"><option value="">Seleccionar…</option></select>

   photo_url did here: the teachers query 400'd, boot() threw, and the

async function sbGetSoft(table, base, optional){
  try{ return await sbGet(table, `${base},${optional.join(',')}`); }
  catch(e){
    console.warn(`${table}: colunas opcionais ignoradas (${optional.join(', ')}) — ${e.message}`);
    return await sbGet(table, base);
  }
}

async function sbGet(table, qs=''){
  let all=[], page=0, PS=1000;
  while(true){
    const s=page*PS, e=s+PS-1;
    const r = await fetch(`${SB}/rest/v1/${table}?${qs}`,{headers:{...H,Range:`${s}-${e}`,Prefer:'count=none'}});
    if(!r.ok){ const t=await r.text(); throw new Error(`${table} ${r.status}: ${t.slice(0,140)}`); }
    const d = await r.json(); all = all.concat(d);
    if(d.length < PS) break;
    if(++page > 19) break;
  }
  return all;
}
async function sbUpsert(table, rows, onConflict){
  const r = await fetch(`${SB}/rest/v1/${table}${onConflict?`?on_conflict=${onConflict}`:''}`,
    {method:'POST', headers:{...H, Prefer:'resolution=merge-duplicates,return=minimal'},
     body:JSON.stringify(rows)});
  if(!r.ok){ const t=await r.text(); throw new Error(`${r.status}: ${t.slice(0,160)}`); }
}
async function sbPatch(table, qs, body){
  const r = await fetch(`${SB}/rest/v1/${table}?${qs}`,{method:'PATCH',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify(body)});
  if(!r.ok){ const t=await r.text(); throw new Error(`${r.status}: ${t.slice(0,160)}`); }
}

/* ══════════════════════════════════════════════════════════════════════
   THE CALENDAR — dates are the record
   ──────────────────────────────────────────────────────────────────────
   lessonDates(day) returns every teaching date for a weekday, in order.
   Position in that array is the lesson NUMBER, which is a label for
   humans. Nothing is ever looked up by it. The previous portal stored
   lesson_number and read it back, so adding one holiday re-pointed every
   record in the year at a different day.
   ══════════════════════════════════════════════════════════════════════ */
const _dateCache = {};
function isTeachingDay(iso){
  if(HOLIDAYS.has(iso)) return false;
  return !BREAKS.some(([a,b]) => iso>=a && iso<=b);
}
function lessonDates(day){
  if(_dateCache[day]) return _dateCache[day];
  const out=[], target=DOW[(day||'').toUpperCase().trim()];
  if(!target || !Y0 || !Y1){ return (_dateCache[day]=out); }
  const d=new Date(Y0+'T12:00:00'), end=new Date(Y1+'T12:00:00');
  while(d<=end){
    if(d.getDay()===target){ const iso=isoOf(d); if(isTeachingDay(iso)) out.push(iso); }
    d.setDate(d.getDate()+1);
  }
  return (_dateCache[day]=out);
}
/* Local date, not UTC. toISOString() shifts across midnight in any
   timezone east of Greenwich and would silently move a Monday lesson
   onto Sunday for part of the year. */
function isoOf(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function todayISO(){ return isoOf(new Date()); }
function lessonNoOf(day, iso){ const i = lessonDates(day).indexOf(iso); return i<0 ? 0 : i+1; }
function fmtShort(iso){ const d=new Date(iso+'T12:00:00');
  return d.toLocaleDateString('pt-PT',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function fmtLong(iso){ const d=new Date(iso+'T12:00:00');
  return d.toLocaleDateString('pt-PT',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }
function weekDates(){
  const now=new Date(), dow=now.getDay()||7, mon=new Date(now);
  mon.setDate(now.getDate()-(dow-1));
  return DAYS.map((_,i)=>{ const d=new Date(mon); d.setDate(mon.getDate()+i); return isoOf(d); });
}
/* This week's date for a weekday — what "the Monday cell" means today. */
function thisWeek(day){ const i=DAYS.indexOf(day); return i<0?null:weekDates()[i]; }

async function boot(){
  setConn('warn','a carregar');
  try{
    const cfg = await sbGet('school_config','select=key,value&limit=40');
    cfg.forEach(r=>{ if(r.key==='academic_year')AY=r.value;
      if(r.key==='year_start_date')Y0=r.value; if(r.key==='year_end_date')Y1=r.value; });
  }catch(e){ console.warn('school_config',e.message); }
  /* THE YEAR IS 21 SEPTEMBER TO 30 JUNE.
     school_config stays authoritative, but when it is missing or blank
     the portal had no Y0/Y1 at all — and with no dates every lesson
     list is empty, which on screen is indistinguishable from a teacher
     with no classes. A stated default beats a blank page, and
     CFG_FALLBACK records that it was used so the year map can say so
     rather than quietly inventing a calendar. */
  /* ── THE CALENDAR GUARD ──────────────────────────────────────
     The first version of this only fired when school_config was
     EMPTY. It was never empty — it was WRONG: academic_year said
     2026/2027 while year_end_date still said June 2026. So the
     fallback never ran, and the portal faithfully announced that the
     year had ended and asked for 156 registers from a year that had
     not started.

     A stale config is the common case, not the missing one. This
     checks the dates against the year they claim to belong to, and
     when they disagree it says so on screen instead of quietly
     obeying. */
  CFG_STATE = 'ok';
  const _m = (AY||'').match(/^(\d{4})\s*\/\s*(\d{2,4})$/);
  if(!Y0 || !Y1){
    CFG_STATE = 'missing';
  } else if(_m){
    const _a = +_m[1], _b = _m[2].length===2 ? +('20'+_m[2]) : +_m[2];
    if(+Y0.slice(0,4)!==_a || +Y1.slice(0,4)!==_b) CFG_STATE = 'mismatch';
  }
  if(CFG_STATE!=='ok'){
    /* Do not guess a calendar on top of a contradictory one — that
       would replace a visible error with an invisible one. Use the
       stated year only when there is nothing at all. */
    if(CFG_STATE==='missing'){ Y0='2026-09-21'; Y1='2027-06-30'; AY=AY||'2026/2027'; }
  }
  CFG_FALLBACK = CFG_STATE!=='ok';
  try{ HOLIDAYS = new Set((await sbGet('school_holidays','select=date&limit=500')).map(r=>r.date)); }catch(e){}
  try{ BREAKS = (await sbGet('school_breaks','select=start_date,end_date&limit=100')).map(r=>[r.start_date,r.end_date]); }catch(e){}
  document.getElementById('tb-yr').textContent = AY || '—';

  try{
    const raw = await sbGetSoft('teachers',
      'select=id,code,name,lang,native,branch_primary,contract_hours_week&limit=300',
      ['photo_url']);
    TEACHERS = raw.map(r=>({id:r.id,code:r.code||'??',name:r.name||'—',
      lang:(r.lang||'EN').toUpperCase().slice(0,2), native:!!r.native,
      branch:r.branch_primary||'Funchal', hours:r.contract_hours_week||22, photo:r.photo_url||null}));
    setConn(true,'Supabase');
  }catch(e){
    setConn(false,'erro');
    /* The teacher list is the one query the page genuinely cannot do
       without, so it says so on the page rather than in a toast that
       scrolls away after three seconds. */
    document.getElementById('main-empty-host').innerHTML =
      `<div class="notice"><b>Não foi possível carregar os professores.</b><br>${esc(e.message)}</div>`;
    switchPanel('semana');
    toast('Erro ao carregar professores','err');
    return;
  }

  const q = new URLSearchParams(location.search).get('teacher');
  if(q) ME = TEACHERS.find(t=>t.id===q || t.code===q) || null;
  if(!ME){
    const sel=document.getElementById('picker-sel');
    sel.innerHTML = '<option value="">Seleccionar…</option>' +
      TEACHERS.map(t=>`<option value="${t.id}">${esc(t.code)} · ${esc(t.name)} · ${t.lang}</option>`).join('');
    sel.onchange = () => { const t=TEACHERS.find(x=>x.id===sel.value); if(t){ ME=t;
      document.getElementById('picker').classList.remove('on'); loadTeacher(); } };
    document.getElementById('picker').classList.add('on');
    setConn('warn','escolha um professor');
    return;
  }
  await loadTeacher();
}

async function loadTeacher(){
  CLASSES=[]; SCHED={}; ENROL={}; ATT={}; SUMS={}; MARKS={};
  renderIdBand();
  setConn('warn','a carregar turmas');

  /* A TEACHER WITH NO CLASSES IS A NORMAL STATE, NOT A FAILURE.
     It is September and nothing has been assigned yet — that is most
     of the staff for several weeks. The page loads, says so, and
     keeps every panel reachable. Only a genuine query error is an
     error, and even that does not stop the render. */
  let rows=[]; let loadErr=null;
  try{
    rows = await sbGetSoft('classes',
      `teacher_id=eq.${encodeURIComponent(ME.id)}${AY?'&academic_year=eq.'+encodeURIComponent(AY):''}` +
      `&select=turma_code,lang,level_code,level_display,branch,day_of_week,hour,start_time,end_time,student_refs`,
      ['department','group_key','duration_min','sala']);
  }catch(e){ loadErr=e; setConn(false,'erro'); }

  CLASSES = rows.map(normaliseClass).filter(Boolean);
  CLASSES.forEach(c=>{ (SCHED[c.day] = SCHED[c.day]||{})[c.hour] = c; });

  /* Enrolments for every student I teach */
  const refs = [...new Set(CLASSES.flatMap(c=>c.refs))].filter(Boolean);
  for(let i=0;i<refs.length;i+=200){
    try{
      const chunk = await sbGet('enrolments',
        `ref=in.(${refs.slice(i,i+200).join(',')})&select=ref,name,age,date_of_birth,phone,email,branch,lang,family,level_code,level_cefr,guardian_name,guardian_phone,guardian_email,school,school_year,notes`);
      chunk.forEach(e=>{ ENROL[e.ref]=e; });
    }catch(e){ console.warn('enrolments',e.message); }
  }

  /* The whole year of attendance, once. Keyed by date throughout. */
  const codes = CLASSES.map(c=>c.code).filter(Boolean);
  if(codes.length && Y0 && Y1){
    try{
      const att = await sbGet('attendance',
        `turma_code=in.(${codes.join(',')})&date=gte.${Y0}&date=lte.${Y1}&select=turma_code,student_ref,status,date&limit=100000`);
      att.forEach(r=>{
        ((ATT[r.turma_code] = ATT[r.turma_code]||{})[r.student_ref] =
          ATT[r.turma_code][r.student_ref]||{})[r.date] = normStatus(r.status);
      });
    }catch(e){ console.warn('attendance',e.message); }
    try{
      const sums = await sbGet('lesson_summaries',
        `turma_code=in.(${codes.join(',')})&select=turma_code,date,summary_text,book_page,skill,participation,observations,tpc,tpc_ref,tpc_due&limit=20000`);
      sums.forEach(r=>{ (SUMS[r.turma_code]=SUMS[r.turma_code]||{})[r.date]=r; });
    }catch(e){ console.warn('lesson_summaries',e.message); }
  }

  await loadNotices();
  if(!loadErr) setConn(true, CLASSES.length ? 'Supabase' : 'sem turmas');
  renderAll();
  if(loadErr) toast('Turmas: '+loadErr.message,'err');
}

/* Day and time are frequently missing or encoded in the group key, so
   this is the one place that guesses, and it records what it guessed. */
function normaliseClass(c){
  let refs=[];
  if(Array.isArray(c.student_refs)) refs=c.student_refs;
  else { try{ refs=JSON.parse(c.student_refs||'[]'); }catch{ refs=[]; } }

  let day = (c.day_of_week||'').toUpperCase().replace('SAB','SÁB').trim();
  const known = new Set([...DAYS,'SAB']);
  if(!day){
    const hunt = s => (s||'').toUpperCase()
      .replace(/\bSAB\b/g,'SÁB').replace(/\bMON\b/g,'SEG').replace(/\bTUE\b/g,'TER')
      .replace(/\bWED\b/g,'QUA').replace(/\bTHU\b/g,'QUI').replace(/\bFRI\b/g,'SEX')
      .split(/[-_\s]+/).find(p=>known.has(p));
    day = hunt(c.group_key) || hunt(c.turma_code) || '';
  }
  if(!day) return null;                      /* no day = not placeable  */

  const hour = typeof c.hour==='number' ? c.hour : parseInt(c.hour,10);
  let start = c.start_time, end = c.end_time;
  if(!start && hour>0){
    start = `${String(hour).padStart(2,'0')}:00`;
    const dur = typeof c.duration_min==='number' ? c.duration_min : 90;
    const em = hour*60+dur;
    end = `${String(Math.floor(em/60)).padStart(2,'0')}:${String(em%60).padStart(2,'0')}`;
  }
  return {
    code:c.turma_code, lang:c.lang, levelCode:(c.level_code||'').trim(),
    level:c.level_display || LEVEL_DISP[(c.level_code||'').trim()] || c.level_code || '—',
    department:c.department, branch:c.branch, sala:c.sala,
    day, hour: isNaN(hour)?9:hour, start:(start||'').slice(0,5), end:(end||'').slice(0,5),
    duration:c.duration_min||90, refs,
  };
}

/* ══════════════════════════════════════════════════════════════════════
   DERIVED FACTS
   Every number the interface shows comes from one of these, so a count
   and the list behind it can never disagree.
   ══════════════════════════════════════════════════════════════════════ */
function statusOf(code, ref, iso){ return ATT[code]?.[ref]?.[iso] ?? null; }
function isMarked(code, iso){
  const t = ATT[code]; if(!t) return false;
  return Object.values(t).some(byDate => byDate[iso] != null);
}
/* ── WHERE WE ARE IN THE YEAR ────────────────────────────────────
   On 13 September with term starting on the 21st, every lesson in the
   calendar is in the future. Everything this portal counts — lessons
   given, marks made, registers outstanding — is defined as "on or
   before today", so all of it is correctly zero, and a screen full of
   correct zeros looks exactly like a broken page.

   So the pre-term state is named and handled. The grid still shows
   the timetable, because the teacher wants to see it. The counts say
   what they are counting. And nothing pretends there is work waiting
   that cannot exist yet. */
function termState(){
  if(!Y0 || !Y1) return 'unknown';
  const t = todayISO();
  if(t < Y0) return 'before';
  if(t > Y1) return 'after';
  return 'during';
}
function daysUntilTerm(){
  if(!Y0) return null;
  const a=new Date(todayISO()+'T12:00:00'), b=new Date(Y0+'T12:00:00');
  return Math.round((b-a)/86400000);
}
function firstLessonOf(cls){ return lessonDates(cls.day)[0] || null; }

function pastDatesFor(cls){ const t=todayISO(); return lessonDates(cls.day).filter(d=>d<=t); }
function unmarkedFor(cls){ return pastDatesFor(cls).filter(d=>!isMarked(cls.code,d)); }
function allUnmarked(){ return CLASSES.flatMap(c=>unmarkedFor(c).map(d=>({cls:c,date:d}))); }
function tallyFor(code, ref, dates){
  let p=0,a=0,l=0,o=0;
  dates.forEach(d=>{ const s=statusOf(code,ref,d);
    if(s==='present')p++; else if(s==='absent')a++; else if(s==='late')l++; else o++; });
  return {p,a,l,o,total:dates.length,marked:p+a+l};
}
function ageOf(ref){
  const e=ENROL[ref]; if(!e) return null;
  if(typeof e.age==='number') return e.age;
  if(!e.date_of_birth) return null;
  const b=new Date(e.date_of_birth), n=new Date();
  let y=n.getFullYear()-b.getFullYear();
  if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate())) y--;
  return y;
}
function absenceFlag(code, ref){
  const t = tallyFor(code, ref, pastDatesFor(CLASSES.find(c=>c.code===code)||{day:''}));
  const age = ageOf(ref), minor = age!=null && age<18;
  const limit = minor ? ABS_WARN_MINOR : ABS_WARN_ADULT;
  if(t.a >= ABS_LIMIT) return {level:'limit', n:t.a, minor};
  if(t.a >= limit)     return {level:'warn',  n:t.a, minor};
  return null;
}
function myStudents(){
  const seen = new Map();
  CLASSES.forEach(c => c.refs.forEach(r => {
    if(!seen.has(r)) seen.set(r, {ref:r, name:ENROL[r]?.name||r, classes:[]});
    seen.get(r).classes.push(c);
  }));
  return [...seen.values()].sort((a,b)=>a.name.localeCompare(b.name));
}

function renderAll(){
  /* Said once, at the top of the week, and only when it is true. */
  const host = document.getElementById('main-empty-host');
  const st = termState(), d = daysUntilTerm();
  let msg = '';
  if(CFG_STATE==='mismatch'){
    msg = `<div class="notice"><b>O calendário da escola está incoerente.</b>
      O ano lectivo diz <b>${esc(AY)}</b> mas as datas gravadas vão de
      ${fmtShort(Y0)} a ${fmtShort(Y1)}. Enquanto assim estiver, as contagens
      desta página não são de confiar.
      <a href="alm-ano-lectivo.html" style="color:var(--ink)">Corrigir o ano lectivo &rarr;</a></div>`;
  } else if(CFG_STATE==='missing'){
    msg = `<div class="notice"><b>O calendário da escola não está definido.</b>
      A usar ${fmtShort(Y0)} &ndash; ${fmtShort(Y1)} por defeito.
      <a href="alm-ano-lectivo.html" style="color:var(--ink)">Definir o ano lectivo &rarr;</a></div>`;
  } else if(ME && !CLASSES.length){
    msg = `<div class="notice"><b>Ainda sem turmas atribuídas.</b> Assim que a direcção
      atribuir turmas a ${esc(ME.name)}, aparecem aqui na grelha e a pauta anual
      fica disponível. As restantes secções continuam acessíveis.</div>`;
  } else if(st==='before'){
    msg = `<div class="notice"><b>As aulas começam a ${fmtLong(Y0)}.</b>
      ${d===1?'Falta 1 dia':'Faltam '+d+' dias'} — a grelha abaixo é o horário do ano;
      as presenças abrem no primeiro dia de aulas. Pode já consultar as turmas e os alunos.</div>`;
  } else if(st==='after'){
    msg = `<div class="notice"><b>O ano lectivo terminou a ${fmtLong(Y1)}.</b>
      A pauta continua disponível para consulta e exportação.</div>`;
  }
  if(host) host.innerHTML = msg;
  renderIdBand(); renderToday(); renderGrid();
  renderTurmas(); renderPautaTabs(); renderAlunos(); renderPedidos();
  const un = allUnmarked().length;
  document.getElementById('v-turmas').textContent = CLASSES.length || '—';
  document.getElementById('v-alunos').textContent = myStudents().length || '—';
  document.getElementById('v-porMarcar').textContent = un;
  document.getElementById('n-turmas').textContent = CLASSES.length;
  document.getElementById('n-alunos').textContent = myStudents().length;
}

function renderIdBand(){
  if(!ME) return;
  /* The band takes the tint of whatever the teacher mostly teaches. */
  const tally={};
  CLASSES.forEach(c=>{ const d=deptOf(c); tally[d]=(tally[d]||0)+1; });
  const main = Object.keys(tally).sort((a,b)=>tally[b]-tally[a])[0] || 'adults';
  document.getElementById('idband').style.setProperty('--band', DEPT[main].band);
  document.getElementById('idb-name').textContent = ME.name;
  document.getElementById('idb-tags').innerHTML =
    `<span class="idb-tag">${esc(ME.code)}</span>` +
    `<span class="idb-tag">${LANG_NAME[ME.lang]||ME.lang}</span>` +
    (ME.native?`<span class="idb-tag">Nativo</span>`:'') +
    `<span class="idb-tag">${ME.hours}h / semana</span>` +
    `<span class="idb-tag">${esc(ME.branch)}</span>`;
  if(ME.photo){
    const img=document.getElementById('idb-img');
    img.src=ME.photo; img.style.display='block';
    document.getElementById('idb-ph').style.display='none';
  }
}

function renderToday(){
  const host=document.getElementById('today-strip');
  const day = DAY_OF_JS[new Date().getDay()], iso = todayISO();
  const mine = day ? HOURS.filter(h=>h!==null && SCHED[day]?.[h]).map(h=>SCHED[day][h]) : [];
  const now = new Date().getHours()*60 + new Date().getMinutes();

  if(termState()==='before'){
    const first = CLASSES.map(c=>({c,d:firstLessonOf(c)})).filter(x=>x.d)
      .sort((a,b)=>a.d.localeCompare(b.d))[0];
    host.innerHTML = `<span class="strip-lbl">Hoje · ${fmtLong(iso)}</span>` +
      (first ? `<div class="today-chip" onclick="openLesson('${first.c.code}','${first.d}')">
          <span class="tc-time">${first.c.start}</span>
          <span class="tc-meta">Primeira aula · ${esc(first.c.code)} · ${fmtLong(first.d)}</span>
          <span class="tc-badge pend">${daysUntilTerm()} dias</span></div>`
        : `<span style="font-size:12px;color:var(--faint)">Sem turmas.</span>`);
    return;
  }
  if(!mine.length){
    /* Say when the next one is rather than just saying there is none. */
    let next=null;
    for(let i=1;i<=7 && !next;i++){
      const d=new Date(); d.setDate(d.getDate()+i);
      const k=DAY_OF_JS[d.getDay()];
      const h=k && HOURS.find(x=>x!==null && SCHED[k]?.[x]);
      if(h!=null) next={day:k,cls:SCHED[k][h],iso:isoOf(d)};
    }
    host.innerHTML = `<span class="strip-lbl">Hoje · ${fmtLong(iso)}</span>` +
      `<span style="font-size:12px;color:var(--faint)">Sem aulas.</span>` +
      (next?`<span class="today-chip" onclick="openLesson('${next.cls.code}','${next.iso}')">
        <span class="tc-time">${next.cls.start}</span>
        <span class="tc-meta">${DAY_FULL[next.day]} · ${esc(next.cls.code)}</span></span>`:'');
    return;
  }
  host.innerHTML = `<span class="strip-lbl">Hoje · ${fmtLong(iso)}</span>` + mine.map(c=>{
    const [sh,sm]=(c.start||'09:00').split(':').map(Number), [eh,em]=(c.end||'10:30').split(':').map(Number);
    const isNow = now>=sh*60+sm && now<eh*60+em;
    const done = isMarked(c.code, iso);
    return `<div class="today-chip ${done?'done':''} ${isNow?'now':''}" onclick="openLesson('${c.code}','${iso}')">
      <span class="tc-time">${c.start}–${c.end}</span>
      <span class="tc-meta">${esc(c.code)} · ${esc(c.level)}</span>
      ${isNow?'<span class="tc-badge now">Agora</span>':
        done?'<span class="tc-badge">Marcada</span>':'<span class="tc-badge pend">Por marcar</span>'}
    </div>`;
  }).join('');
}

/* ── THE GRID ────────────────────────────────────────────────────
   Was ~70 lines here: markup, a gap constant, a positioning routine
   and a resize listener — all of it a copy of what Assign had, and
   the reason the duration fix had to be made twice. It is now data
   and a click handler. */
function renderGrid(){
  const today = DAY_OF_JS[new Date().getDay()];
  const now = new Date().getHours()*60 + new Date().getMinutes();
  ALMGrid.render(document.getElementById('grid'), {
    today,
    items: CLASSES.map(c=>{
      const iso  = thisWeek(c.day);
      const done = iso && isMarked(c.code, iso);
      const no   = iso ? lessonNoOf(c.day, iso) : 0;
      const live = c.day===today && now>=toMins(c.start||'09:00') && now<toMins(c.end||'10:30');
      return {
        day:c.day, start:c.start, end:c.end,
        title:(c.code||'').replace(/^[^-]+-/,''),
        sub:`${c.start}–${c.end} · ${c.level} · ${c.refs.length} al${no?` · nº ${String(no).padStart(2,'0')}`:''}`,
        badge: live ? '•' : done ? '✓' : '',
        state: done ? 'done' : 'open',
        /* The pair key: 01A and 01B both reduce to FUN-01, so the two
           halves of a turma always share a tone. */
        tone: (c.code||'').replace(/[A-D]$/,''),
        code:c.code, iso:iso || todayISO(),
      };
    }),
    onItem: it => openLesson(it.code, it.iso),
    legend: [['#2E4A3A','preenchido = marcada'],['rgba(74,106,86,.28)','esbatido = por marcar']],
    hint: 'clique numa aula para abrir a folha de presenças',
  });
}

  const host=document.getElementById('turmas-list');
  if(!CLASSES.length){ host.innerHTML=
    '<div class="sh-empty">Sem turmas atribuídas. Nada a mostrar aqui até haver uma.</div>'; return; }
  host.innerHTML = CLASSES.slice().sort((a,b)=>DAYS.indexOf(a.day)-DAYS.indexOf(b.day)||a.hour-b.hour)
    .map(c=>{
      const past=pastDatesFor(c), un=unmarkedFor(c), all=lessonDates(c.day);
      const d=DEPT[deptOf(c)];
      return `<div class="lcard">
        <div class="lc-head">
          <span class="lc-code">${esc(c.code)}</span>
          <span class="sh-tag">${d.label}</span>
          <span class="lc-meta">${DAY_FULL[c.day]} · ${c.start}–${c.end}${c.sala?' · Sala '+esc(c.sala):''}</span>
          <span class="lc-meta">${past.length} de ${all.length} aulas dadas</span>
          ${un.length?`<span class="sh-tag pend">${un.length} por marcar</span>`:'<span class="sh-tag on">Em dia</span>'}
          <span class="lc-n" onclick="rosterClass('${c.code}')">${c.refs.length}<small> alunos</small></span>
        </div>
        <div style="display:flex;gap:7px;margin-top:11px;flex-wrap:wrap">
          <button class="sh-btn sage" onclick="openNextUnmarked('${c.code}')">${un.length?'Marcar a próxima em falta':'Abrir última aula'}</button>
          <button class="sh-btn" onclick="showPauta('${c.code}')">Pauta anual</button>
          <button class="sh-btn" onclick="rosterClass('${c.code}')">Ver alunos</button>
        </div>
      </div>`;
    }).join('');
}

function renderAlunos(){
  const q = (document.getElementById('stu-search').value||'').toLowerCase().trim();
  let list = myStudents();
  if(q) list = list.filter(s => s.name.toLowerCase().includes(q) || s.ref.toLowerCase().includes(q));
  document.getElementById('stu-count').textContent = `${list.length} aluno${list.length!==1?'s':''}`;
  document.getElementById('alunos-list').innerHTML = list.length ? list.map(s=>{
    const av=avCol(s.name);
    const flags = s.classes.map(c=>absenceFlag(c.code,s.ref)).filter(Boolean);
    const worst = flags.sort((a,b)=>b.n-a.n)[0];
    const age = ageOf(s.ref);
    return `<div class="sh-row" style="cursor:pointer;padding:11px 14px;background:var(--card);
        border-radius:10px;margin-bottom:5px;border-bottom:none;border:1px solid var(--rule)"
        onclick="openStudent('${s.ref}')">
      <div class="sh-av" style="background:${av.bg};color:${av.t}">${avInit(s.name)}</div>
      <div style="flex:1;min-width:0">
        <div class="sh-name">${esc(s.name)}</div>
        <div class="sh-meta">${esc(s.ref)}${age!=null?` · ${age} anos`:''} · ${s.classes.map(c=>esc(c.code)).join(' · ')}</div>
      </div>
      ${worst?`<span class="att-flag">${worst.n} falta${worst.n!==1?'s':''}</span>`:''}
    </div>`;
  }).join('') : '<div class="sh-empty">Nenhum aluno encontrado.</div>';
}

  const host = document.getElementById('pedidos-body');
  host.innerHTML =
    `<div class="sec">Aulas por marcar</div>` +
    (!CLASSES.length ? '<div class="sh-empty">Sem turmas — nada por marcar.</div>'
      : termState()==='before' ? `<div class="notice">As aulas começam a ${fmtLong(Y0)}.
          Não há registos em falta porque ainda não houve aulas.</div>` : '') +
    (un.length ? Object.entries(byClass).map(([code,dates])=>{
      const c = CLASSES.find(x=>x.code===code);
      return `<div class="lcard"><div class="lc-head">
        <span class="lc-code">${esc(code)}</span>
        <span class="lc-meta">${DAY_FULL[c.day]} · ${c.start}</span>
        <span class="sh-tag pend">${dates.length} aula${dates.length!==1?'s':''}</span></div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:10px">

        ${dates.length>14?`<span class="sh-meta" style="align-self:center">+${dates.length-14} anteriores</span>`:''}
        </div></div>`;
    }).join('') : '<div class="sh-empty">Nada em falta. Todas as aulas dadas estão marcadas.</div>') +
    `<div class="sec" style="margin-top:20px">Pedido de fotocópias</div>
     <div class="lcard">
       <div class="sh-g2">
         <div><div class="sh-fk">Documento</div><input class="inp" id="rq-doc" placeholder="ex: Grammar test U3"/></div>
         <div><div class="sh-fk">Turma</div><select class="inp" id="rq-turma">${CLASSES.length?CLASSES.map(c=>`<option>${esc(c.code)}</option>`).join(''):'<option value="">— sem turma —</option>'}</select></div>
       </div>
       <div class="sh-g3" style="margin-top:8px">
         <div><div class="sh-fk">Cópias</div><input class="inp" id="rq-n" type="number" min="1" max="300" value="17"/></div>
         <div><div class="sh-fk">Frente / verso</div><select class="inp" id="rq-sides"><option>Só frente</option><option>Frente e verso</option></select></div>
         <div><div class="sh-fk">Urgência</div><select class="inp" id="rq-urg"><option value="normal">Normal (48h)</option><option value="urgent">Urgente (24h)</option><option value="express">Express (hoje)</option></select></div>
       </div>
       <div style="margin-top:8px"><div class="sh-fk">Observações</div><textarea class="inp" id="rq-obs" style="min-height:60px"></textarea></div>

     </div>
     <div class="sec" style="margin-top:20px">Avisos da secretaria</div>
     ${NOTICES.length ? NOTICES.slice(0,12).map(n=>`
       <div class="lcard" style="border-left:3px solid ${n.urgency==='urgente'||n.urgency==='cancelamento'?'var(--alert)':'var(--sage)'}">
